<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CN1 Refresher</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark;
    --bg: #0d0f14; --surface: #161921; --border: #252a35; --card-bg: #1a1f2e;
    --accent: #e8ff47; --accent2: #47c8ff; --text: #e8eaf0; --muted: #7a8196;
    --ok: #7bc84a; --ok-bg: rgba(58,110,26,.22); --bad: #e05c5c; --bad-bg: rgba(122,26,26,.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-family: 'Syne', 'Arial Black', sans-serif; font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 800; letter-spacing: -1px; color: var(--accent); text-transform: uppercase; line-height: 1; }
  header p { color: var(--muted); font-size: .78rem; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
  .wrap { width: 100%; max-width: 720px; }
  .panel { background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 28px 30px; }
  .label { font-size: .65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; font: inherit; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 2px; }
  .chip:hover { color: var(--text); border-color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .btn { padding: 12px 26px; font: inherit; font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 2px; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #fff; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-secondary:hover { border-color: var(--text); color: var(--text); }
  .btn:focus-visible, .chip:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .stats { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  .stats strong { font-size: 1rem; color: var(--accent); }
  .stats .s-ok strong { color: var(--ok); } .stats .s-bad strong { color: var(--bad); }
  .track { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 18px; }
  .fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .q { font-size: 1.02rem; line-height: 1.6; margin-bottom: 20px; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; font: inherit; font-size: .86rem; line-height: 1.5; border-radius: 3px; cursor: pointer; width: 100%; }
  .opt:hover:not(:disabled) { border-color: var(--accent2); }
  .opt .key { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); }
  .opt:disabled { cursor: default; }
  .opt.is-ok { background: var(--ok-bg); border-color: var(--ok); }
  .opt.is-ok .key { color: var(--ok); border-color: var(--ok); }
  .opt.is-bad { background: var(--bad-bg); border-color: var(--bad); }
  .opt.is-bad .key { color: var(--bad); border-color: var(--bad); }
  .opt.is-dim { opacity: .55; }
  .why { margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--accent2); background: var(--surface); font-size: .8rem; line-height: 1.7; color: #b8bdcc; }
  .why b { color: var(--text); }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .hint { font-size: .66rem; color: var(--muted); letter-spacing: 1px; }
  .big { font-family: 'Syne', 'Arial Black', sans-serif; font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .per { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin: 20px 0; }
  .per div { background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: 3px; font-size: .75rem; color: var(--muted); }
  .per strong { display: block; font-size: 1.1rem; color: var(--text); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .wrong { margin-top: 18px; display: grid; gap: 10px; }
  .wrong div { background: var(--surface); border-left: 3px solid var(--bad); padding: 12px 14px; font-size: .8rem; line-height: 1.6; }
  .wrong .a { color: var(--ok); margin-top: 4px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  @media (max-width: 520px) { .panel { padding: 22px 18px; } .q { font-size: .95rem; } }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body><a href="index.html" style="display:block;width:max-content;margin:14px auto 0;font:600 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a5;background:#161921;border:1px solid #252a35;padding:8px 10px;text-decoration:none">&larr; Menu</a>
<header>
  <h1>CN1 Refresher</h1>
  <p>Computer Networks I · <span id="total">0</span> meerkeuzevragen</p>
</header>

<main class="wrap">
  <section id="setup" class="panel">
    <div class="label">Module</div>
    <div class="row" id="chapters"></div>
    <div class="label">Aantal vragen</div>
    <div class="row" id="sizes"></div>
    <button class="btn btn-primary" id="start">Start</button>
    <p class="hint" style="margin-top:14px">Vragen en antwoorden worden telkens geschud. Foute antwoorden komen in "Te herhalen" (in deze browser).</p>
  </section>

  <section id="quiz" hidden>
    <div class="stats">
      <span>Vraag <strong id="num">1</strong> / <strong id="of">0</strong></span>
      <span class="s-ok">Juist <strong id="nok">0</strong></span>
      <span class="s-bad">Fout <strong id="nbad">0</strong></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="panel">
      <div class="label" id="qlabel">H1</div>
      <div class="q" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="why" id="why" hidden></div>
      <div class="nav">
        <button class="btn btn-secondary" id="stop">Stoppen</button>
        <span class="hint">A–D of 1–4 om te kiezen · Enter = volgende</span>
        <button class="btn btn-primary" id="next" hidden>Volgende →</button>
      </div>
    </div>
  </section>

  <section id="result" class="panel" hidden>
    <div class="label">Resultaat</div>
    <div class="big" id="score">0 / 0</div>
    <div class="per" id="per"></div>
    <div class="actions">
      <button class="btn btn-primary" id="retry">Herhaal de foute</button>
      <button class="btn btn-secondary" id="again">Nieuwe toets</button>
    </div>
    <div class="wrong" id="wrong"></div>
  </section>
</main>

<script>
const QUESTIONS = [{"id": "cn001", "ch": "1", "q": "Wat is een host (end device) volgens de cursus?", "ok": "Elke computer in een netwerk; hij kan optreden als client, als server of als beide.", "bad": ["Een intermediary device dat end devices met elkaar verbindt, zoals een switch of router.", "Uitsluitend een server die informatie levert aan andere toestellen.", "Het medium waarover berichten van bron naar bestemming reizen."], "why": "Every computer on a network is called a host or end device. Servers leveren informatie, clients vragen ze op. In een peer-to-peer netwerk is één toestel beide."}, {"id": "cn002", "ch": "1", "q": "Welke combinatie beschrijft de nadelen van een peer-to-peer netwerk?", "ok": "Geen centraal beheer, minder veilig, niet schaalbaar en tragere prestaties.", "bad": ["Moeilijk op te zetten, complexer en duurder dan een netwerk met servers.", "Enkel bruikbaar voor grote netwerken met honderden hosts.", "Vereist een dedicated server voor bestanden en printers."], "why": "Voordelen zijn net: eenvoudig op te zetten, minder complex, goedkoper. Daarom enkel aanbevolen voor zeer kleine netwerken."}, {"id": "cn003", "ch": "1", "q": "Welke taak hoort bij een intermediary device?", "ok": "Datasignalen regenereren en bijhouden welke paden er in het netwerk bestaan.", "bad": ["Het bericht aanmaken dat over het netwerk verstuurd wordt, en het daarna ontvangen.", "De e-mail- of webserversoftware uitvoeren waarmee clients hun gegevens ophalen.", "Als eindbestemming het bericht ontvangen en het aan de gebruiker tonen."], "why": "Intermediary devices (switch, AP, router, firewall) verbinden end devices en beheren de datastroom: regenereren, paden bijhouden, fouten melden. Aanmaken en ontvangen doen end devices."}, {"id": "cn004", "ch": "1", "q": "Welk medium stuurt data via modulatie van specifieke frequenties van elektromagnetische golven?", "ok": "Draadloze transmissie", "bad": ["Koperdraden in kabels", "Glasvezelkabel", "Coaxkabel"], "why": "Koper: elektrische impulsen. Glasvezel: lichtpulsen. Draadloos: modulatie van frequenties van elektromagnetische golven."}, {"id": "cn005", "ch": "1", "q": "Een diagram toont de toestellen, hun poorten en het adresseringsschema van het netwerk. Welk type diagram is dit?", "ok": "Een logisch topologiediagram", "bad": ["Een fysiek topologiediagram", "Een device inventory", "Een bekabelingsplan van het gebouw"], "why": "Physical topology: fysieke locatie van toestellen en kabels. Logical topology: toestellen, poorten en adresseringsschema."}, {"id": "cn006", "ch": "1", "q": "Welke uitspraak past bij een WAN?", "ok": "Verbindt LANs over grote afstanden en wordt meestal beheerd door een of meer service providers.", "bad": ["Verbindt LANs over grote afstanden en wordt meestal beheerd door één organisatie.", "Verbindt end devices in een beperkt gebied en wordt meestal beheerd door service providers.", "Verbindt end devices in een beperkt gebied en wordt meestal beheerd door één organisatie."], "why": "LAN: beperkt gebied, één organisatie, hoge snelheid. WAN: verbindt LANs over grote afstand, beheerd door SP's, meestal tragere links."}, {"id": "cn007", "ch": "1", "q": "Een bedrijf geeft medewerkers van een leverancier beveiligde toegang tot een deel van zijn netwerk. Hoe noem je dit?", "ok": "Een extranet", "bad": ["Een intranet", "Een WAN", "Een peer-to-peer netwerk"], "why": "Intranet: enkel voor leden van de eigen organisatie. Extranet: veilige toegang voor mensen van een andere organisatie."}, {"id": "cn008", "ch": "1", "q": "Het internet is van niemand. Welke groepen helpen de structuur van het internet te bewaren?", "ok": "IETF, ICANN en IAB", "bad": ["IEEE, EIA en TIA", "De grootste ISP's samen", "ISO en ITU"], "why": "IEEE, EIA en TIA maken elektronica- en communicatiestandaarden (kabels, connectoren). Voor de structuur van het internet noemt de cursus IETF, ICANN en IAB."}, {"id": "cn009", "ch": "1", "q": "Welke internetverbinding is always-on, heeft hoge bandbreedte en loopt over een telefoonlijn?", "ok": "DSL", "bad": ["Cable", "Dial-up", "Cellular"], "why": "Dial-up loopt ook over de telefoonlijn, maar met lage bandbreedte via een modem. Cable komt van de kabeltelevisie-provider."}, {"id": "cn010", "ch": "1", "q": "Welke zakelijke verbinding bestaat uit gereserveerde circuits binnen het netwerk van de service provider om verre kantoren te verbinden?", "ok": "Dedicated leased line", "bad": ["Ethernet WAN", "Business DSL (SDSL)", "Satellite"], "why": "Ethernet WAN breidt LAN-technologie uit naar het WAN. Satellite is voor plaatsen zonder bekabelde oplossing."}, {"id": "cn011", "ch": "1", "q": "Wat is een converged network?", "ok": "Eén netwerkinfrastructuur die data, spraak en video draagt met dezelfde set regels en standaarden.", "bad": ["Een netwerk met aparte bekabeling voor telefoon, video en data, elk met eigen standaarden.", "Een netwerk waarin LAN en WAN samengevoegd worden zodat er geen router meer nodig is.", "Een netwerk dat enkel draadloze en glasvezelverbindingen combineert."], "why": "Vroeger had een organisatie aparte netwerken per dienst. Een converged network brengt die samen op één link."}, {"id": "cn012", "ch": "1", "q": "Welke vier kenmerken moet de onderliggende netwerkarchitectuur volgens de cursus hebben?", "ok": "Fault tolerance, scalability, quality of service en security", "bad": ["Confidentiality, integrity, availability en authentication", "BYOD, online collaboration, video communication en cloud computing", "Bandwidth, latency, throughput en goodput"], "why": "Valkuil: CIA (confidentiality, integrity, availability) zijn de doelen van network security, niet de vier kenmerken van de architectuur. De trends (BYOD, cloud ...) zijn ook iets anders."}, {"id": "cn013", "ch": "1", "q": "Waarom draagt packet switching bij tot fault tolerance?", "ok": "Pakketten kunnen elk een ander pad nemen, zodat verkeer rond een defect kan.", "bad": ["Elk gesprek krijgt een vast, gereserveerd circuit dat niet onderbroken kan worden.", "Elk pakket wordt apart versleuteld, zodat een defect geen gevolgen heeft voor de beveiliging.", "Alle pakketten komen gegarandeerd in de juiste volgorde aan, ook als een link uitvalt."], "why": "Een fault tolerant netwerk beperkt de impact van een storing en heeft meerdere paden nodig. Vaste circuits zijn net het kenmerk van circuit-switched netwerken, die dit niet kunnen."}, {"id": "cn014", "ch": "1", "q": "Een livevideo hapert voortdurend omdat de vraag naar bandbreedte groter is dan wat beschikbaar is. Welk mechanisme ontbreekt waarschijnlijk?", "ok": "Quality of Service (QoS)", "bad": ["Scalability", "Fault tolerance", "Network infrastructure security"], "why": "QoS is het primaire mechanisme om betrouwbare levering voor iedereen te garanderen. Met een QoS-policy kan de router data- en spraakverkeer beter beheren."}, {"id": "cn015", "ch": "1", "q": "Welk doel van network security garandeert dat data onderweg niet gewijzigd werd?", "ok": "Integrity", "bad": ["Confidentiality", "Availability", "Scalability"], "why": "Confidentiality: enkel de bedoelde ontvangers kunnen lezen. Integrity: niet gewijzigd. Availability: tijdige en betrouwbare toegang voor geautoriseerde gebruikers."}, {"id": "cn016", "ch": "1", "q": "Wat betekent BYOD volgens de cursus?", "ok": "Elk toestel, met eender welk eigendom, overal gebruikt.", "bad": ["Enkel toestellen van het bedrijf die medewerkers mee naar huis mogen nemen.", "Een beleid dat persoonlijke toestellen op het bedrijfsnetwerk verbiedt.", "Het huren van servers en opslag bij een datacenter in de cloud."], "why": "Bring Your Own Device: gebruikers gebruiken hun eigen laptop, tablet, smartphone ... voor toegang tot informatie."}, {"id": "cn017", "ch": "1", "q": "Welk type cloud is gebouwd voor de noden van een specifieke sector, zoals de gezondheidszorg of de media?", "ok": "Custom cloud", "bad": ["Private cloud", "Hybrid cloud", "Public cloud"], "why": "Private: voor een specifieke organisatie (bv. de overheid). Hybrid: combinatie van twee of meer types. Custom: voor een sector, kan publiek of privé zijn."}, {"id": "cn018", "ch": "1", "q": "Een toestel staat ver van het access point en er ligt geen netwerkkabel, maar er is wel een stopcontact. Welke oplossing beschrijft de cursus hiervoor?", "ok": "Powerline networking: data over de elektriciteitsleiding sturen via een powerline adapter.", "bad": ["Een Wireless Internet Service Provider (WISP) die het toestel via een hotspot verbindt.", "Wireless broadband met een antenne buiten het huis.", "Een tweede ISP-verbinding via cable voor dat ene toestel."], "why": "Powerline networking is vooral nuttig wanneer access points niet alle toestellen in huis bereiken."}, {"id": "cn019", "ch": "1", "q": "Welke dreiging is een interne dreiging?", "ok": "Een medewerker die per ongeluk data verkeerd gebruikt", "bad": ["Een zero-day attack op een nog onbekende kwetsbaarheid", "Een denial of service attack vanaf het internet", "Identity theft door een threat actor buiten het bedrijf"], "why": "Interne dreigingen: verloren of gestolen toestellen, accidental misuse en kwaadwillige medewerkers. De rest staat in de cursus bij external threats."}, {"id": "cn020", "ch": "1", "q": "Welke beveiliging hoort volgens de cursus typisch bij grotere netwerken, bovenop antivirus en firewallfiltering?", "ok": "Een dedicated firewall, ACL's, een IPS en VPN's", "bad": ["Enkel antivirus en antispyware op elk end device", "Redundante links, QoS en schaalbare protocollen", "Packet switching in plaats van circuit switching"], "why": "Thuis/klein kantoor: antivirus + firewallfiltering. Grotere netwerken voegen dedicated firewall, ACL, IPS en VPN toe. Beveilig steeds in meerdere lagen."}, {"id": "cn021", "ch": "1", "q": "Welke elementen heb je volgens de cursus nodig om een klein netwerk te laten groeien?", "ok": "Netwerkdocumentatie, device inventory, budget en traffic analysis", "bad": ["Een tweede ISP-verbinding, extra switches, een DMZ en IPv6 op alle toestellen", "Een nieuwe router, een groter subnet, NAT en een DHCP-server per afdeling", "Een BYOD-beleid, cloudopslag, videoconferencing en een eigen helpdesk"], "why": "Met die vier elementen kan de netwerkbeheerder onderbouwde beslissingen nemen bij het schalen (zie ook module 17)."}, {"id": "cn022", "ch": "2", "q": "Welk deel van een besturingssysteem communiceert tussen hardware en software en beheert hoe hardwarebronnen gebruikt worden?", "ok": "De kernel", "bad": ["De shell", "De CLI", "De GUI"], "why": "Shell: de gebruikersinterface (CLI of GUI) waarmee je taken vraagt. Kernel: tussen hardware en software. Hardware: het fysieke deel."}, {"id": "cn023", "ch": "2", "q": "Waarom worden netwerktoestellen meestal via een CLI beheerd en niet via een GUI?", "ok": "Een GUI kan vastlopen, crashen of niet werken zoals bedoeld.", "bad": ["Een GUI kan enkel via de consolepoort gebruikt worden.", "Een CLI vraagt minder kennis van de onderliggende commandostructuur.", "Cisco IOS heeft geen ondersteuning voor Telnet of SSH in een GUI."], "why": "Een GUI is gebruiksvriendelijker en vraagt minder kennis, maar is minder betrouwbaar. Daarom de CLI."}, {"id": "cn024", "ch": "2", "q": "Via welke toegangsmethode doe je typisch de initiële configuratie van een nieuwe switch?", "ok": "Console", "bad": ["SSH", "Telnet", "Een webbrowser via HTTP"], "why": "De console is een fysieke beheerpoort, ook bruikbaar wanneer het toestel nog geen IP-adres heeft. SSH en Telnet gaan over het netwerk."}, {"id": "cn025", "ch": "2", "q": "Waarom is SSH de aanbevolen methode om op afstand te verbinden, en niet Telnet?", "ok": "Telnet stuurt wachtwoorden en commando's in plaintext; SSH beveiligt de verbinding.", "bad": ["SSH werkt via de consolepoort, waardoor er geen netwerkverbinding nodig is.", "Telnet werkt enkel op routers en niet op switches, SSH werkt op allebei.", "SSH is sneller omdat het UDP gebruikt in plaats van TCP voor de sessie."], "why": "Beide gaan via een virtuele interface over het netwerk (VTY-lijnen). Het verschil is beveiliging."}, {"id": "cn026", "ch": "2", "q": "Welk programma heb je nodig om via de consolepoort of via SSH/Telnet met een netwerktoestel te verbinden?", "ok": "Een terminal emulation program zoals PuTTY", "bad": ["Packet Tracer in simulation mode op de pc", "Een webbrowser met het IP-adres van de switch", "De Windows-opdracht ipconfig /all"], "why": "Voorbeelden uit de cursus: PuTTY, Tera Term en SecureCRT."}, {"id": "cn027", "ch": "2", "q": "De prompt is Switch#. In welke modus zit je?", "ok": "Privileged EXEC mode", "bad": ["User EXEC mode", "Global configuration mode", "Interface configuration mode"], "why": "> = user EXEC (beperkte monitoringcommando's). # = privileged EXEC (alle commando's). (config)# = global configuration."}, {"id": "cn028", "ch": "2", "q": "Je zit in Switch(config-if)#. Met welk commando ga je in één stap terug naar privileged EXEC mode?", "ok": "end (of Ctrl+Z)", "bad": ["exit", "disable", "configure terminal"], "why": "Valkuil: exit gaat maar één niveau terug, naar global configuration mode. end of Ctrl+Z gaat rechtstreeks naar privileged EXEC."}, {"id": "cn029", "ch": "2", "q": "Je zit in R1(config-if)# en typt exit. Waar kom je terecht?", "ok": "In global configuration mode: R1(config)#", "bad": ["In privileged EXEC mode: R1#", "In user EXEC mode: R1>", "In line configuration mode: R1(config-line)#"], "why": "Vanuit een subconfiguratiemodus brengt exit je terug naar global configuration mode."}, {"id": "cn030", "ch": "2", "q": "Je zit in R1(config-line)# en typt meteen interface g0/0/0. Wat gebeurt er?", "ok": "Je komt meteen in R1(config-if)#: je mag rechtstreeks naar een andere subconfiguratiemodus springen.", "bad": ["Je krijgt een foutmelding, want je moet eerst exit typen om terug naar global configuration mode te gaan.", "Je keert terug naar global configuration mode en het commando wordt genegeerd tot je het opnieuw typt.", "Het commando wordt toegepast op de consolelijn in plaats van op de interface, omdat je nog in line mode zit."], "why": "Je kan rechtstreeks naar een andere subconfiguratiemodus springen door het commando van die modus te typen."}, {"id": "cn031", "ch": "2", "q": "Met welk commando ga je van user EXEC mode naar privileged EXEC mode?", "ok": "enable", "bad": ["configure terminal", "end", "login"], "why": "enable: user EXEC naar privileged EXEC. disable: omgekeerd. configure terminal: naar global configuration mode."}, {"id": "cn032", "ch": "2", "q": "In het commando ping 192.168.10.5, wat is 192.168.10.5?", "ok": "Een argument: een waarde die de gebruiker zelf invult", "bad": ["Een keyword: een parameter die in het besturingssysteem vastligt", "Een optioneel element tussen vierkante haken", "De naam van de interface waarlangs gepingd wordt"], "why": "Keyword: vastgelegd in het OS (bv. ip protocols). Argument: niet vooraf gedefinieerd, door de gebruiker gekozen. In de syntaxis staat een argument in italics."}, {"id": "cn033", "ch": "2", "q": "Wat betekent [x] in de IOS-commandosyntaxis?", "ok": "Een optioneel element (keyword of argument)", "bad": ["Een verplicht element", "Een verplichte keuze tussen meerdere opties", "Een keyword dat je letterlijk intypt"], "why": "[x] optioneel, {x} verplicht, {x | y} verplichte keuze, boldface letterlijk intypen, italics zelf invullen."}, {"id": "cn034", "ch": "2", "q": "Wat betekent {x | y} in de IOS-commandosyntaxis?", "ok": "Je moet verplicht kiezen tussen x en y.", "bad": ["Je mag x of y toevoegen, maar het is niet verplicht.", "Je moet x en y allebei invullen, gescheiden door een spatie.", "x en y zijn argumenten die IOS zelf invult."], "why": "Accolades = verplicht. De verticale streep scheidt de keuzes. Bijvoorbeeld transport input {ssh | telnet}."}, {"id": "cn035", "ch": "2", "q": "Welke toetscombinatie gebruik je in Cisco IOS om een lopende traceroute of ping af te breken?", "ok": "Ctrl+Shift+6", "bad": ["Ctrl+Z", "Ctrl+C", "Tab"], "why": "Ctrl+Shift+6 is de algemene break sequence (DNS lookup, traceroute, ping). Ctrl+Z en Ctrl+C beëindigen de configuratiemodus. Valkuil: in Windows breek je tracert wel af met Ctrl+C."}, {"id": "cn036", "ch": "2", "q": "De output toont --More--. Wat doet de spatiebalk?", "ok": "Toont het volgende scherm", "bad": ["Toont de volgende regel", "Beëindigt de output en keert terug naar privileged EXEC", "Vult het commando automatisch aan"], "why": "Enter = volgende regel. Spatie = volgend scherm. Elke andere toets = stoppen."}, {"id": "cn037", "ch": "2", "q": "Waarom mag je configure afkorten tot conf?", "ok": "Omdat configure het enige commando is dat met conf begint.", "bad": ["Omdat elk commando altijd tot vier letters afgekort mag worden.", "Omdat conf een apart alias-commando is dat Cisco voorziet.", "Omdat afkortingen enkel in global configuration mode werken."], "why": "Commando's en keywords mogen ingekort worden tot het minimum aantal tekens dat een unieke keuze aanduidt."}, {"id": "cn038", "ch": "2", "q": "Welke hostname volgt de richtlijnen voor toestelnamen?", "ok": "Gent-SW2", "bad": ["2-Gent-SW", "Gent SW2", "Gent-SW2-"], "why": "Begin met een letter, geen spaties, eindig op een letter of cijfer, enkel letters, cijfers en streepjes, minder dan 64 tekens."}, {"id": "cn039", "ch": "2", "q": "Met welke reeks commando's beveilig je de toegang tot user EXEC mode via de console?", "ok": "line console 0, dan password <wachtwoord>, dan login", "bad": ["line console 0, dan password <wachtwoord> (login is niet nodig)", "line vty 0 15, dan password <wachtwoord>, dan login", "enable secret <wachtwoord> in global configuration mode"], "why": "Valkuil: zonder login wordt het wachtwoord niet gevraagd. line vty is voor remote toegang, enable secret beveiligt privileged EXEC."}, {"id": "cn040", "ch": "2", "q": "Wat beveilig je met enable secret <wachtwoord>?", "ok": "De toegang tot privileged EXEC mode", "bad": ["De toegang via de consolepoort", "De toegang via Telnet en SSH", "De versleuteling van alle wachtwoorden in de configuratie"], "why": "enable secret wordt ingegeven in global configuration mode en wordt gevraagd wanneer je enable typt."}, {"id": "cn041", "ch": "2", "q": "Waarvoor dienen de VTY-lijnen op een switch?", "ok": "Voor remote toegang via Telnet of SSH (vaak 0 tot 15).", "bad": ["Voor fysieke toegang via de consolepoort met een rollover-kabel.", "Voor de verbinding van de switch met zijn default gateway.", "Voor het IP-adres waarmee je de switch beheert (interface vlan 1)."], "why": "Beveiligen: line vty 0 15, password ..., login. De SVI (interface vlan 1) is wat anders: dat is het IP-adres van de switch."}, {"id": "cn042", "ch": "2", "q": "Wat doet het commando service password-encryption?", "ok": "Het versleutelt alle plaintext-wachtwoorden in de configuratie.", "bad": ["Het versleutelt al het verkeer tussen de pc en de switch via de console.", "Het schakelt SSH in en Telnet uit op alle VTY-lijnen van het toestel.", "Het versleutelt enkel het enable secret-wachtwoord en laat de rest staan."], "why": "Zonder dit commando tonen startup-config en running-config de meeste wachtwoorden in plaintext. Controleer met show running-config."}, {"id": "cn043", "ch": "2", "q": "In banner motd #Geen toegang# , wat is de functie van #?", "ok": "Het is het delimiting character dat begin en einde van de boodschap aanduidt.", "bad": ["Het geeft aan dat het commando in privileged EXEC mode moet staan.", "Het is een commentaarteken: alles erna wordt genegeerd.", "Het is een verplicht deel van de boodschap dat op het scherm verschijnt."], "why": "Een banner waarschuwt onbevoegden bij een poging tot toegang."}, {"id": "cn044", "ch": "2", "q": "Waar staan startup-config en running-config?", "ok": "startup-config in NVRAM, running-config in RAM", "bad": ["startup-config in RAM, running-config in NVRAM", "Beide in NVRAM", "Beide in RAM"], "why": "startup-config: opgeslagen, gebruikt bij opstarten of reboot. running-config: huidige configuratie in RAM, gaat verloren bij uitschakelen. Wijzigingen in de running-config werken meteen."}, {"id": "cn045", "ch": "2", "q": "Met welk commando sla je je wijzigingen op zodat ze een herstart overleven?", "ok": "copy running-config startup-config (in privileged EXEC mode)", "bad": ["copy startup-config running-config (in privileged EXEC mode)", "copy running-config startup-config (in global configuration mode)", "copy startup-config running-config (in global configuration mode)"], "why": "Valkuil: de richting. Je kopieert van wat nu draait (running) naar wat bij opstart geladen wordt (startup)."}, {"id": "cn046", "ch": "2", "q": "Je deed ongewenste wijzigingen in de running-config, maar je hebt nog niets opgeslagen. Hoe keer je terug naar de vorige configuratie?", "ok": "De commando's één voor één terugdraaien of reload uitvoeren", "bad": ["erase startup-config uitvoeren en daarna het toestel herstarten met reload", "copy running-config startup-config uitvoeren om de vorige versie terug te halen", "Het commando undo all uitvoeren in global configuration mode"], "why": "Met reload laadt het toestel de startup-config opnieuw (kort offline!). erase startup-config is enkel nodig als de foute wijzigingen al opgeslagen waren."}, {"id": "cn047", "ch": "2", "q": "Je wil een switch op afstand kunnen beheren. Wat moet je configureren?", "ok": "Een IP-adres op de SVI (interface vlan 1) en die activeren met no shutdown", "bad": ["Een IP-adres op elke fysieke switchpoort waar een pc op aangesloten is", "Enkel line vty 0 15 met een wachtwoord en login, verder niets", "Een IP-adres op de consolepoort, want die is altijd bereikbaar"], "why": "Stappen: interface vlan 1, ip address ip-address subnet-mask, no shutdown. Voor beheer vanuit een ander netwerk heb je ook ip default-gateway nodig."}, {"id": "cn048", "ch": "2", "q": "Wat is de default gateway van een host?", "ok": "Het IP-adres van de router die de host gebruikt om remote netwerken te bereiken.", "bad": ["Het IP-adres van de switch waar de host op aangesloten is, voor al het lokale verkeer.", "Het eerste IP-adres van elk subnet, dat altijd voorbehouden is voor de DNS-server.", "Het MAC-adres van de NIC van de host, waarmee frames het netwerk verlaten."], "why": "IP-adres + subnetmasker bepalen in welk subnet de host zit. De default gateway is nodig om buiten dat subnet te geraken."}, {"id": "cn049", "ch": "2", "q": "Met welk Windows-commando zie je het MAC-adres van je netwerkkaart en de Layer 3-details?", "ok": "ipconfig /all", "bad": ["ipconfig /displaydns", "ipconfig /renew", "arp -a"], "why": "ipconfig /displaydns toont de DNS-cache. ipconfig /release en /renew vernieuwen een DHCP-configuratie. arp -a toont de ARP-cache (andere toestellen)."}, {"id": "cn050", "ch": "2", "q": "Met welk commando toon je op een Linux-host de adressen van de interfaces, en kan je er ook adressen mee toevoegen of verwijderen?", "ok": "ip address", "bad": ["ipconfig /all", "show ip interface brief", "netstat -r"], "why": "Op Linux en macOS kan ook ifconfig. show ip interface brief is een Cisco IOS-commando."}, {"id": "cn051", "ch": "2", "q": "Hoeveel ICMP echo requests stuurt ping standaard op Windows 10 en op Cisco IOS?", "ok": "Windows 4, Cisco IOS 5", "bad": ["Windows 5, Cisco IOS 4", "Beide 4", "Beide 5"], "why": "IOS toont per reply een indicator: ! succes, . timeout, U destination unreachable."}, {"id": "cn052", "ch": "2", "q": "Een IOS-ping toont U.U.U. Wat betekent de U?", "ok": "Een router op het pad stuurde een ICMP destination unreachable terug.", "bad": ["Het echo reply-bericht werd goed ontvangen, maar met vertraging.", "De tijd om op een echo reply te wachten is verlopen zonder antwoord.", "De bestemming is onbekend omdat de DNS-server niet antwoordt."], "why": "! = echo reply ontvangen (Layer 3-verbinding OK). . = timeout. U = destination unreachable, bv. de router kent de weg naar het netwerk niet."}, {"id": "cn053", "ch": "2", "q": "Hoe start je een extended ping op een Cisco-router?", "ok": "Typ ping zonder IP-adres in privileged EXEC mode.", "bad": ["Typ ping extended <ip-adres> in global configuration mode.", "Typ ping -t <ip-adres> in user EXEC mode, zoals op Windows.", "Typ ping <ip-adres> repeat 100 in interface configuration mode."], "why": "Enter accepteert telkens de standaardwaarde. Voor IPv6: ping ipv6. Extended traceroute werkt op dezelfde manier."}, {"id": "cn054", "ch": "2", "q": "Welk verschil bestaat er tussen tracert op Windows en traceroute op Cisco IOS of Linux?", "ok": "Windows stuurt ICMP echo requests; IOS en Linux sturen UDP met een ongeldig poortnummer.", "bad": ["Windows stuurt UDP met een ongeldig poortnummer; IOS en Linux sturen ICMP echo requests.", "Windows en IOS sturen allebei TCP SYN-segmenten naar poort 80.", "Er is geen verschil, alleen de naam van het commando verschilt."], "why": "Bij UDP antwoordt de eindbestemming met ICMP port unreachable. Een * betekent dat een hop niet antwoordde."}, {"id": "cn055", "ch": "3", "q": "Welke drie elementen heeft elke communicatie volgens de cursus?", "ok": "Een bron, een bestemming en een kanaal (medium)", "bad": ["Een protocol, een poortnummer en een IP-adres", "Een client, een server en een router ertussen", "Een header, de data en een trailer"], "why": "Een verbinding alleen volstaat niet: toestellen moeten ook afspreken hoe ze communiceren. Dat zijn de protocollen."}, {"id": "cn056", "ch": "3", "q": "Welke reeks bevat de vereisten waarover computerprotocollen het eens moeten zijn?", "ok": "Encoding, formatting/encapsulation, size, timing en delivery options", "bad": ["Bandwidth, latency, throughput, goodput en jitter", "Fault tolerance, scalability, quality of service en security", "Addressing, routing, switching, NAT en fragmentatie"], "why": "Dit zijn de vijf Network Protocol Requirements uit 3.1."}, {"id": "cn057", "ch": "3", "q": "Welk onderdeel van message timing bepaalt hoe lang een toestel wacht wanneer het geen antwoord krijgt?", "ok": "Response timeout", "bad": ["Flow control", "Access method", "Sequencing"], "why": "Flow control: hoeveel en hoe snel. Response timeout: hoe lang wachten. Access method: wanneer iemand mag zenden."}, {"id": "cn058", "ch": "3", "q": "Welke uitspraak over delivery options klopt?", "ok": "Broadcast bestaat bij IPv4 maar niet bij IPv6; IPv6 kent wel anycast.", "bad": ["Broadcast bestaat bij IPv6 maar niet bij IPv4; IPv4 kent wel anycast.", "Zowel IPv4 als IPv6 gebruiken broadcast, maar enkel IPv6 kent multicast.", "Multicast is one-to-all, broadcast is one-to-many."], "why": "Unicast = one-to-one, multicast = one-to-many (meestal niet iedereen), broadcast = one-to-all."}, {"id": "cn059", "ch": "3", "q": "Welke protocolfunctie zorgt ervoor dat elk verzonden datasegment een uniek label krijgt?", "ok": "Sequencing", "bad": ["Reliability", "Flow control", "Addressing"], "why": "Addressing: zender en ontvanger. Reliability: gegarandeerde levering. Flow control: efficiënt tempo. Error detection: corruptie opsporen. Application interface: proces-tot-proces."}, {"id": "cn060", "ch": "3", "q": "Welke protocollen horen bij welke taak in de cursus?", "ok": "HTTP: web client-server; TCP: gesprekken en gegarandeerde levering; IP: globale levering; Ethernet: NIC naar NIC op de LAN", "bad": ["HTTP: globale levering; TCP: NIC naar NIC op de LAN; IP: gesprekken en gegarandeerde levering; Ethernet: web client-server", "HTTP: gesprekken en gegarandeerde levering; TCP: web client-server; IP: NIC naar NIC op de LAN; Ethernet: globale levering", "HTTP: web client-server; TCP: globale levering; IP: gesprekken en gegarandeerde levering; Ethernet: NIC naar NIC op de LAN"], "why": "Elk protocol heeft zijn eigen functie en formaat. Valkuil: IP garandeert niets (best effort), dat doet TCP."}, {"id": "cn061", "ch": "3", "q": "Waarom wordt TCP/IP een open standaard genoemd?", "ok": "Het is vrij beschikbaar voor het publiek en elke fabrikant mag het gebruiken.", "bad": ["Het werd ontwikkeld door ISO en ITU, net als het OSI-model.", "Het is eigendom van de IETF, die licenties verkoopt aan fabrikanten.", "Het werkt enkel op open-source besturingssystemen zoals Linux."], "why": "TCP/IP is open en standards-based (goedgekeurd door een standaardenorganisatie voor interoperabiliteit). AppleTalk en Novell NetWare waren proprietary."}, {"id": "cn062", "ch": "3", "q": "Welke organisatie ontwikkelt, updatet en onderhoudt internet- en TCP/IP-technologieën?", "ok": "IETF", "bad": ["IEEE", "ICANN", "TIA"], "why": "ISOC: open ontwikkeling van het internet. IAB: beheer en ontwikkeling van internetstandaarden. IRTF: lange-termijnonderzoek. ICANN/IANA: IP-adressen en domeinnamen."}, {"id": "cn063", "ch": "3", "q": "Welke organisatie coördineert de toewijzing van IP-adressen en het beheer van domeinnamen?", "ok": "ICANN", "bad": ["IETF", "IEEE", "EIA"], "why": "IANA beheert de toewijzing voor ICANN en verdeelt blokken over de vijf RIR's."}, {"id": "cn064", "ch": "3", "q": "Welke organisatie maakt standaarden voor elektrische bekabeling, connectoren en de 19-inch racks?", "ok": "EIA", "bad": ["IEEE", "ITU-T", "IETF"], "why": "IEEE: o.a. netwerken (802.3 Ethernet, 802.11 Wi-Fi). TIA: radio, gsm-masten, VoIP, satelliet. ITU-T: videocompressie, IPTV, DSL."}, {"id": "cn065", "ch": "3", "q": "Wat is een voordeel van een gelaagd model?", "ok": "Een wijziging in één laag heeft geen invloed op de lagen erboven en eronder.", "bad": ["Elke laag kan rechtstreeks met elke andere laag praten, zonder vaste interfaces.", "Er is maar één fabrikant nodig voor alle lagen, wat compatibiliteit garandeert.", "Protocollen hoeven niet meer te weten welke informatie ze moeten verwerken."], "why": "Andere voordelen: hulp bij protocolontwerp, concurrentie (producten van verschillende fabrikanten werken samen), een gemeenschappelijke taal."}, {"id": "cn066", "ch": "3", "q": "Welke OSI-laag beschrijft methodes om frames uit te wisselen over een gemeenschappelijk medium?", "ok": "Laag 2 - Datalinklaag", "bad": ["Laag 1 - Fysieke laag", "Laag 3 - Netwerklaag", "Laag 4 - Transportlaag"], "why": "1 Physical: fysieke verbindingen activeren en onderhouden. 2 Data Link: frames over het medium. 3 Network: pakketten over het netwerk. 4 Transport: segmenteren en reassembleren."}, {"id": "cn067", "ch": "3", "q": "Welke OSI-laag zorgt voor een gemeenschappelijke voorstelling van de data, bv. MKV, JPG of PNG?", "ok": "Presentatielaag", "bad": ["Sessielaag", "Applicatielaag", "Transportlaag"], "why": "Op het schema van de cursus staan de bestandsformaten bij de presentatielaag. De sessielaag beheert de dialoog."}, {"id": "cn068", "ch": "3", "q": "Welke OSI-lagen vallen samen met de applicatielaag van het TCP/IP-model?", "ok": "Applicatielaag, presentatielaag en sessielaag", "bad": ["Applicatielaag en transportlaag", "Enkel de applicatielaag", "Sessielaag, transportlaag en netwerklaag"], "why": "Het OSI-model splitst de applicatielaag en de netwerktoegangslaag van TCP/IP op in meerdere lagen."}, {"id": "cn069", "ch": "3", "q": "Wat is de juiste volgorde van PDU's bij encapsulation, van boven naar beneden?", "ok": "Data, segment, packet, frame, bits", "bad": ["Data, packet, segment, frame, bits", "Bits, frame, packet, segment, data", "Data, segment, frame, packet, bits"], "why": "Encapsulation is top-down. De-encapsulation gaat bottom-up: elke laag haalt zijn header eraf en geeft door naar boven."}, {"id": "cn070", "ch": "3", "q": "Hoe heet de PDU op de netwerklaag (internetlaag) en welke adressen staan in de header?", "ok": "IP-pakket, met bron- en bestemmings-IP-adres", "bad": ["IP-pakket, met bron- en bestemmings-MAC-adres", "Frame, met bron- en bestemmings-IP-adres", "Frame, met bron- en bestemmings-MAC-adres"], "why": "Schema van de cursus: transportlaag segment (poortnummers), netwerklaag IP-pakket (IP-adressen), datalinklaag frame (MAC-adressen), fysieke laag bitstroom."}, {"id": "cn071", "ch": "3", "q": "Wat zijn de twee voordelen van segmentatie?", "ok": "Data blokkeert de link niet, en enkel verloren segmenten worden opnieuw verzonden.", "bad": ["Segmenten worden versleuteld, en ze komen altijd in de juiste volgorde aan.", "Er zijn geen poortnummers meer nodig, en de headers worden een stuk kleiner.", "De bestemming hoeft niets te reassembleren, en er zijn geen ACK's meer nodig."], "why": "Increases speed en increases efficiency. Multiplexing = meerdere stromen gesegmenteerde data door elkaar verweven op dezelfde link."}, {"id": "cn072", "ch": "3", "q": "Welk protocol is verantwoordelijk voor sequencing, het nummeren van segmenten zodat het bericht aan de bestemming terug samengesteld kan worden?", "ok": "TCP", "bad": ["IP", "Ethernet", "UDP"], "why": "UDP nummert niet: het zet data samen in de volgorde waarin ze aankomen."}, {"id": "cn073", "ch": "3", "q": "Welk deel van een IPv4-adres is hetzelfde voor alle toestellen in dezelfde LAN?", "ok": "Het netwerkgedeelte (bij IPv6 de prefix)", "bad": ["Het hostgedeelte (bij IPv6 de interface ID)", "De laatste octet", "Het MAC-adres van de NIC"], "why": "Het netwerkgedeelte staat links. Het hostgedeelte is uniek per toestel in het netwerk."}, {"id": "cn074", "ch": "3", "q": "PC1 (192.168.1.110) stuurt een pakket naar een webserver op 172.16.1.99. Welk bestemmings-MAC-adres zet PC1 in het frame?", "ok": "Het MAC-adres van de default gateway", "bad": ["Het MAC-adres van de webserver op 172.16.1.99", "FF-FF-FF-FF-FF-FF, want de bestemming is remote", "Het MAC-adres van de switch waar PC1 op hangt"], "why": "Laag 2-adressering is lokaal. Bij een remote bestemming levert Laag 3 het IP-adres van de default gateway aan Laag 2, die het frame naar de router stuurt."}, {"id": "cn075", "ch": "3", "q": "Een pakket reist van PC1 via R1 en R2 naar een webserver. Wat verandert er onderweg aan elke hop?", "ok": "De MAC-adressen veranderen; de IP-adressen blijven hetzelfde.", "bad": ["De IP-adressen veranderen; de MAC-adressen blijven hetzelfde.", "Zowel de MAC- als de IP-adressen veranderen aan elke hop.", "Niets verandert: het volledige frame gaat ongewijzigd verder."], "why": "L2 is lokaal per link, L3 is globaal (van oorspronkelijke bron tot eindbestemming). Het pakket blijft, het frame wordt vervangen. Uitzondering die later komt: NAT."}, {"id": "cn076", "ch": "3", "q": "Hoe groot zijn een standaard TCP-header, UDP-header en IPv4-header volgens het schema van de cursus?", "ok": "TCP 20 byte, UDP 8 byte, IPv4 20 byte", "bad": ["TCP 8 byte, UDP 20 byte, IPv4 20 byte", "TCP 20 byte, UDP 8 byte, IPv4 40 byte", "TCP 40 byte, UDP 8 byte, IPv4 20 byte"], "why": "Valkuil: 40 byte is de vaste IPv6-header. TCP 20 + IPv4 20 = 40, daarom is de MSS 1500 - 40 = 1460."}, {"id": "cn077", "ch": "3", "q": "Hoeveel bits telt elk adrestype op het schema van de cursus?", "ok": "Poortnummer 16 bit, IPv4-adres 32 bit, IPv6-adres 128 bit, MAC-adres 48 bit", "bad": ["Poortnummer 8 bit, IPv4-adres 32 bit, IPv6-adres 64 bit, MAC-adres 48 bit", "Poortnummer 16 bit, IPv4-adres 48 bit, IPv6-adres 128 bit, MAC-adres 32 bit", "Poortnummer 32 bit, IPv4-adres 32 bit, IPv6-adres 128 bit, MAC-adres 64 bit"], "why": "16 bit geeft 65.536 poorten (0 tot 65.535). 64 bit is de typische interface ID bij IPv6 /64."}, {"id": "cn078", "ch": "4", "q": "Wat doet de fysieke laag?", "ok": "Ze codeert een volledig frame als signalen op het lokale medium.", "bad": ["Ze kiest het beste pad door het netwerk naar de bestemming.", "Ze voegt de bron- en bestemmings-MAC-adressen toe aan het frame.", "Ze controleert met de FCS of het ontvangen frame beschadigd is."], "why": "De fysieke laag transporteert bits en is de laatste stap van encapsulation. Adressen en FCS zijn werk van de datalinklaag."}, {"id": "cn079", "ch": "4", "q": "Welke drie functionele gebieden behandelen de standaarden van de fysieke laag?", "ok": "Physical components, encoding en signaling", "bad": ["Addressing, framing en error detection", "Bandwidth, latency en throughput", "Segmentatie, multiplexing en sequencing"], "why": "Components: hardware, media, connectoren. Encoding: bitstroom omzetten naar herkenbare patronen. Signaling: hoe 1 en 0 op het medium voorgesteld worden."}, {"id": "cn080", "ch": "4", "q": "Welke zijn voorbeelden van encoding-methodes uit de cursus?", "ok": "Manchester, 4B/5B en 8B/10B", "bad": ["CSMA/CD, CSMA/CA en Token Ring", "T568A, T568B en rollover", "UTP, STP en coax"], "why": "Encoding zet de bitstroom om naar voorspelbare patronen die het volgende toestel herkent."}, {"id": "cn081", "ch": "4", "q": "Wat is het verschil tussen throughput en goodput?", "ok": "Goodput is de bruikbare data per tijdseenheid: throughput min de overhead van het verkeer.", "bad": ["Goodput is de theoretische capaciteit van het medium, throughput is wat je echt haalt.", "Throughput is de vertraging van punt tot punt, goodput is de capaciteit.", "Er is geen verschil, het zijn twee namen voor bandwidth."], "why": "Bandwidth: capaciteit van het medium. Latency: tijd inclusief vertragingen. Throughput: werkelijke overdracht (= resultaat van een speedtest). Goodput = throughput - overhead."}, {"id": "cn082", "ch": "4", "q": "Wat is attenuation bij koperkabels, en hoe beperk je het?", "ok": "Het signaal wordt zwakker naarmate het verder reist; je houdt je strikt aan de maximale kabellengte.", "bad": ["Het signaal wordt zwakker naarmate het verder reist; je gebruikt metalen afscherming en aarding.", "Storing door elektromagnetische velden; je houdt je strikt aan de maximale kabellengte.", "Storing door elektromagnetische velden; je gebruikt metalen afscherming en aarding."], "why": "Attenuation: lengte respecteren. EMI/RFI: afscherming en aarding. Crosstalk: draden in paren twisten."}, {"id": "cn083", "ch": "4", "q": "Hoe beperkt UTP crosstalk zonder afscherming?", "ok": "Door cancellation (tegengestelde polariteit per paar) en een verschillend aantal twists per paar.", "bad": ["Door een gevlochten koperen mantel rond elk paar die storing van buitenaf tegenhoudt.", "Door licht te sturen in plaats van elektrische impulsen, zodat de paren elkaar niet storen.", "Door een dikkere plastic buitenmantel die elektromagnetische velden volledig blokkeert."], "why": "De magnetische velden van de getwiste draden heffen elkaar op. STP heeft wel afscherming (folie of gevlochten)."}, {"id": "cn084", "ch": "4", "q": "Welke uitspraak over STP in vergelijking met UTP klopt?", "ok": "Betere bescherming tegen ruis, maar duurder en moeilijker te installeren.", "bad": ["Betere bescherming tegen ruis, en goedkoper en makkelijker te installeren.", "Minder bescherming tegen ruis, maar duurder en moeilijker te installeren.", "Minder bescherming tegen ruis, en goedkoper en makkelijker te installeren."], "why": "STP heeft folie of gevlochten afscherming tegen EMI/RFI. UTP is het meest gebruikte netwerkmedium."}, {"id": "cn085", "ch": "4", "q": "Waar wordt coaxkabel volgens de cursus vooral gebruikt?", "ok": "Voor antennes van draadloze toestellen en bij kabelinternet", "bad": ["Als backbone tussen de verschillende gebouwen van een campus", "Tussen een pc en de consolepoort van een router of switch", "Voor alle nieuwe bekabelde Ethernet-LANs in kantoren"], "why": "Backbone tussen gebouwen is typisch glasvezel. Voor de console gebruik je een rollover-kabel."}, {"id": "cn086", "ch": "4", "q": "Welke organisaties bepalen de standaarden voor UTP?", "ok": "TIA/EIA voor kabeltypes, lengtes en connectoren; de IEEE voor de categorieën (Cat 5e, Cat 6)", "bad": ["De IEEE voor kabeltypes, lengtes en connectoren; TIA/EIA voor de categorieën (Cat 5e, Cat 6)", "De IETF voor zowel de kabeltypes als de elektrische categorieën van koperkabels", "ISO voor de connectoren en ICANN voor de elektrische categorieën van koperkabels"], "why": "TIA/EIA-568 standaardiseert kabeltypes, lengtes, connectoren, terminatie en testmethodes."}, {"id": "cn087", "ch": "4", "q": "Welke kabel gebruik je tussen een host en een switch, en welke tussen twee switches zonder auto-MDIX?", "ok": "Host-switch: straight-through; switch-switch: crossover", "bad": ["Host-switch: crossover; switch-switch: straight-through", "Host-switch: straight-through; switch-switch: straight-through", "Host-switch: crossover; switch-switch: crossover"], "why": "Straight-through: beide uiteinden T568A of beide T568B, host naar netwerktoestel. Crossover: T568A aan het ene, T568B aan het andere uiteinde, voor gelijke toestellen. Crossover is legacy door auto-MDIX."}, {"id": "cn088", "ch": "4", "q": "Welke kabel gebruik je om de seriële poort van een pc (via adapter) op de consolepoort van een router aan te sluiten?", "ok": "Rollover", "bad": ["Crossover", "Straight-through", "Coax"], "why": "Rollover is een Cisco-eigen kabel."}, {"id": "cn089", "ch": "4", "q": "Waarom is glasvezel ideaal voor lange afstanden?", "ok": "Weinig attenuation en volledig immuun voor EMI en RFI.", "bad": ["Het is goedkoper en makkelijker te installeren dan UTP.", "Het gebruikt elektrische impulsen met een hogere spanning.", "Het heeft geen connectoren nodig aan de uiteinden."], "why": "Glasvezel draagt data over langere afstanden met hogere bandbreedte dan elk ander medium. Nadelen: hoogste kost, installatiekennis en veiligheidsmaatregelen."}, {"id": "cn090", "ch": "4", "q": "Welke combinatie beschrijft single-mode fiber?", "ok": "Zeer kleine kern, dure lasers, lange afstanden", "bad": ["Zeer kleine kern, goedkopere LEDs, lange afstanden", "Grotere kern, dure lasers, korte afstanden", "Grotere kern, goedkopere LEDs, korte afstanden"], "why": "Multimode: grotere kern, LEDs, tot 10 Gbps over 550 m. MMF heeft meer dispersion dan SMF."}, {"id": "cn091", "ch": "4", "q": "Wat is dispersion bij glasvezel?", "ok": "Het uitspreiden van een lichtpuls in de tijd; multimode heeft er meer last van dan single-mode.", "bad": ["Het uitspreiden van een lichtpuls in de tijd; single-mode heeft er meer last van dan multimode.", "Storing door elektromagnetische velden van nabije stroomkabels, vooral bij multimode.", "Het lekken van signaal naar een naburige vezel in dezelfde kabel, vooral bij single-mode."], "why": "Door de grotere dispersion is de maximale afstand voor MMF 550 meter. Valkuil: glasvezel is net immuun voor EMI, en crosstalk is iets van koper."}, {"id": "cn092", "ch": "4", "q": "Welke kleur heeft de mantel van een single-mode glasvezelkabel, en welke van multimode?", "ok": "Single-mode geel, multimode oranje (of aqua)", "bad": ["Single-mode oranje, multimode geel", "Single-mode blauw, multimode grijs", "Beide geel; het verschil zit enkel in de connector"], "why": "Connectoren uit de cursus: ST, SC, LC simplex en duplex multimode LC."}, {"id": "cn093", "ch": "4", "q": "Welke beperking van draadloze media betekent dat slechts één toestel tegelijk kan zenden of ontvangen?", "ok": "Shared medium", "bad": ["Coverage area", "Interference", "Security"], "why": "Hoe meer gebruikers tegelijk, hoe minder bandbreedte per gebruiker."}, {"id": "cn094", "ch": "4", "q": "Welke standaard hoort bij welke draadloze technologie?", "ok": "Wi-Fi 802.11, Bluetooth 802.15, WiMAX 802.16, Zigbee 802.15.4", "bad": ["Wi-Fi 802.3, Bluetooth 802.11, WiMAX 802.15, Zigbee 802.16", "Wi-Fi 802.11, Bluetooth 802.16, WiMAX 802.15, Zigbee 802.15.4", "Wi-Fi 802.15, Bluetooth 802.11, WiMAX 802.16, Zigbee 802.3"], "why": "802.3 is bedraad Ethernet. Zigbee: lage datasnelheid en laag verbruik, vooral voor IoT."}, {"id": "cn095", "ch": "4", "q": "Welke twee toestellen heeft een WLAN in het algemeen nodig?", "ok": "Een access point en wireless NIC's", "bad": ["Een router en een rollover-kabel", "Een switch en een coaxkabel naar elke host", "Een DSL-modem en een powerline adapter"], "why": "Het AP concentreert de draadloze signalen en verbindt met de bekabelde infrastructuur."}, {"id": "cn096", "ch": "4", "q": "Hoeveel bps is 1 Gbps?", "ok": "1.000.000.000 bps (10^9)", "bad": ["1.000.000 bps (10^6)", "1.024 x 1.024 x 1.024 bps", "1.000.000.000.000 bps (10^12)"], "why": "Kbps 10^3, Mbps 10^6, Gbps 10^9, Tbps 10^12. Netwerkbandbreedte gebruikt machten van 10, niet van 1024."}, {"id": "cn097", "ch": "6", "q": "Welke twee sublagen heeft de datalinklaag volgens IEEE 802?", "ok": "LLC (communiceert met de netwerksoftware erboven) en MAC (data-encapsulatie en media access control)", "bad": ["MAC (communiceert met de netwerksoftware erboven) en LLC (data-encapsulatie en media access control)", "TCP en UDP", "Physical en Logical"], "why": "LLC (802.2) identificeert welk netwerklaagprotocol in het frame zit. MAC (802.3, 802.11, 802.15) doet adressering en toegang tot het medium."}, {"id": "cn098", "ch": "6", "q": "Welke vier Laag 2-functies voert een router uit aan elke hop?", "ok": "Frame aannemen, de-encapsuleren, het pakket in een nieuw frame steken, doorsturen", "bad": ["Frame aannemen, het bestemmings-IP aanpassen, de FCS weglaten, het oude frame doorsturen", "Het bron-MAC leren, het frame floodden, de TTL verhogen, het frame doorsturen", "Het pakket fragmenteren, de MAC-adressen bewaren, de poorten aanpassen, doorsturen"], "why": "Onderweg kan het pakket over verschillende datalinklagen en media reizen. Daarom bouwt de router telkens een nieuw frame."}, {"id": "cn099", "ch": "6", "q": "Welke WAN-topologie is de eenvoudigste en meest gebruikte?", "ok": "Point-to-point", "bad": ["Hub and spoke", "Mesh", "Bus"], "why": "Point-to-point: permanente link tussen twee eindpunten, eenvoudige protocollen. Hub and spoke: centrale site met point-to-point links. Mesh: hoge beschikbaarheid, elk systeem met elk ander verbonden."}, {"id": "cn100", "ch": "6", "q": "Welke topologie gebruiken end devices in een LAN typisch?", "ok": "Star of extended star", "bad": ["Bus", "Ring", "Mesh"], "why": "Star is makkelijk te installeren, schaalbaar en makkelijk te troubleshooten. Bus en ring zijn legacy (vroeg Ethernet, Token Ring)."}, {"id": "cn101", "ch": "6", "q": "Welke uitspraak over half-duplex en full-duplex klopt?", "ok": "WLANs werken half-duplex; Ethernet-switches werken full-duplex.", "bad": ["WLANs werken full-duplex; Ethernet-switches werken half-duplex.", "Zowel WLANs als Ethernet-switches werken half-duplex.", "Zowel WLANs als Ethernet-switches werken full-duplex."], "why": "Half-duplex: één toestel tegelijk (WLAN, legacy bus met hubs). Full-duplex: beide tegelijk zenden en ontvangen."}, {"id": "cn102", "ch": "6", "q": "Welke toegangsmethode gebruiken IEEE 802.11 WLANs, en hoe werkt ze?", "ok": "CSMA/CA: elk toestel meldt hoe lang zijn transmissie duurt.", "bad": ["CSMA/CD: toestellen detecteren een botsing, wachten willekeurig lang en zenden opnieuw.", "Controlled access: elk toestel krijgt een vaste beurt op het medium, zoals bij Token Ring.", "Full-duplex: alle toestellen zenden en ontvangen tegelijk, zodat er geen regels nodig zijn."], "why": "CSMA/CD = collision detection, legacy bus-Ethernet. CSMA/CA = collision avoidance, WLAN. Controlled access = deterministisch, legacy Token Ring en ARCNET."}, {"id": "cn103", "ch": "6", "q": "Wat gebeurt er bij CSMA/CD als twee toestellen tegelijk zenden?", "ok": "Ze detecteren de botsing, wachten willekeurig lang en zenden opnieuw.", "bad": ["Het toestel met het laagste MAC-adres krijgt voorrang en zendt verder.", "Ze sturen eerst een bericht met de duur van hun transmissie.", "De switch buffert één van de frames tot het medium weer vrij is."], "why": "Moderne geswitchte full-duplex Ethernet-LANs hebben CSMA/CD niet meer nodig."}, {"id": "cn104", "ch": "6", "q": "Uit welke drie delen bestaat een datalinkframe?", "ok": "Header, data en trailer", "bad": ["Header, payload en checksum", "Preamble, header en data", "Bronadres, bestemmingsadres en data"], "why": "De velden van header en trailer verschillen per datalinkprotocol."}, {"id": "cn105", "ch": "6", "q": "Welk frameveld identificeert het ingekapselde Laag 3-protocol?", "ok": "Type", "bad": ["Control", "Error detection", "Addressing"], "why": "Frame start/stop, addressing (bron/bestemming), type (L3-protocol), control (flow control), data (payload), error detection."}, {"id": "cn106", "ch": "6", "q": "Welke uitspraak over Laag 2-adressen klopt?", "ok": "Ze dienen enkel voor lokale levering en elk doorsturend toestel past ze aan.", "bad": ["Ze staan in de pakketheader en blijven gelijk van bron tot eindbestemming.", "Ze worden door de ISP toegewezen en zijn wereldwijd routeerbaar.", "Ze staan in de trailer van het frame en worden enkel door routers gelezen."], "why": "Een Laag 2-adres wordt ook physical address genoemd."}, {"id": "cn107", "ch": "6", "q": "Welke datalinkprotocollen noemt de cursus voor LAN en WAN?", "ok": "Ethernet, 802.11, PPP, HDLC en Frame Relay", "bad": ["TCP, UDP, ICMP, ARP, DNS en DHCP", "IPv4, IPv6, NAT, OSPF, EIGRP en BGP", "HTTP, FTP, SMTP, POP3, IMAP en SMB"], "why": "De logische topologie en het fysieke medium bepalen welk datalinkprotocol gebruikt wordt."}, {"id": "cn108", "ch": "7", "q": "In welke lagen werkt Ethernet?", "ok": "In de datalinklaag en de fysieke laag", "bad": ["Enkel in de datalinklaag", "In de netwerklaag en de datalinklaag", "Enkel in de fysieke laag"], "why": "Ethernet is een familie van technologieën gedefinieerd in IEEE 802.2 en 802.3."}, {"id": "cn109", "ch": "7", "q": "Waarvoor dient het FCS-veld in een Ethernet-frame?", "ok": "Error detection: is het frame beschadigd?", "bad": ["Het netwerklaagprotocol in het frame identificeren.", "De volgorde van de frames herstellen bij aankomst.", "Aangeven dat het frame een jumbo frame is."], "why": "FCS = frame check sequence, in de trailer. Bij store-and-forward berekent de switch de CRC en gooit hij foute frames weg."}, {"id": "cn110", "ch": "7", "q": "Wat zijn de minimale en maximale grootte van een Ethernet-frame?", "ok": "Minimum 64 byte, maximum 1518 byte (zonder preamble)", "bad": ["Minimum 64 byte, maximum 1500 byte (zonder preamble)", "Minimum 46 byte, maximum 1518 byte (zonder preamble)", "Minimum 46 byte, maximum 1500 byte (zonder preamble)"], "why": "Kleiner dan 64 byte = runt frame of collision fragment, wordt weggegooid. Valkuil: 1500 byte is de maximale data (MTU), niet het volledige frame."}, {"id": "cn111", "ch": "7", "q": "Hoe is een Ethernet MAC-adres opgebouwd?", "ok": "48 bits (12 hex-tekens): de eerste 24 bits zijn de OUI van de fabrikant, de laatste 24 bits kiest de fabrikant.", "bad": ["32 bits (8 hex-tekens): de eerste 16 bits zijn de OUI, de rest kiest de fabrikant.", "48 bits (12 hex-tekens): de eerste 24 bits kiest de netwerkbeheerder, de laatste 24 bits zijn de OUI.", "64 bits (16 hex-tekens): de eerste 32 bits zijn de OUI, de rest kiest de fabrikant."], "why": "Fabrikanten registreren zich bij de IEEE voor een unieke OUI van 6 hex-tekens (3 byte). Een MAC-adres is dus 6 byte."}, {"id": "cn112", "ch": "7", "q": "Hoe schrijf je het binaire getal 0000 1010 in hexadecimaal?", "ok": "0A", "bad": ["A0", "10", "0x10"], "why": "0000 = 0, 1010 = A. Bij hex worden voorloopnullen altijd getoond om de 8 bits te vervolledigen. Notaties: 0x0A of 0AH."}, {"id": "cn113", "ch": "7", "q": "Een NIC ontvangt een frame. Wanneer geeft hij het door aan de hogere lagen?", "ok": "Bij zijn eigen MAC-adres, een broadcast of een multicastgroep waarvan hij lid is", "bad": ["Altijd: de NIC geeft elk frame door en de netwerklaag beslist wat ermee gebeurt", "Enkel als het bron-MAC-adres al in zijn ARP-tabel staat", "Enkel als het bestemmings-IP-adres overeenkomt met zijn eigen IP-adres"], "why": "Komt het niet overeen, dan gooit de NIC het frame weg. De NIC kijkt naar MAC-adressen, niet naar IP-adressen."}, {"id": "cn114", "ch": "7", "q": "Wat is het Ethernet-broadcastadres, en wat doet een router ermee?", "ok": "FF-FF-FF-FF-FF-FF; een router stuurt het niet door.", "bad": ["FF-FF-FF-FF-FF-FF; een router stuurt het door naar alle andere netwerken.", "01-00-5E-00-00-00; een router stuurt het niet door.", "01-00-5E-00-00-00; een router stuurt het door naar alle andere netwerken."], "why": "48 enen in binair. Een switch flood een broadcast naar alle poorten behalve de inkomende poort."}, {"id": "cn115", "ch": "7", "q": "Met welke bytes begint het bestemmings-MAC-adres bij een IPv4-multicast en bij een IPv6-multicast?", "ok": "IPv4: 01-00-5E; IPv6: 33-33", "bad": ["IPv4: 33-33; IPv6: 01-00-5E", "IPv4: FF-FF; IPv6: FF-02", "IPv4: 01-00-5E; IPv6: FF-FF"], "why": "Een multicastadres kan enkel bestemming zijn. Het bronadres is altijd unicast."}, {"id": "cn116", "ch": "7", "q": "Welk proces gebruikt een host om bij een bekend IPv4-adres het bestemmings-MAC-adres te vinden, en welk bij IPv6?", "ok": "IPv4: ARP; IPv6: Neighbor Discovery (ND)", "bad": ["IPv4: Neighbor Discovery; IPv6: ARP", "IPv4: DNS; IPv6: DHCPv6", "IPv4: ARP; IPv6: DNS"], "why": "Zie module 9. ND gebruikt ICMPv6-berichten."}, {"id": "cn117", "ch": "7", "q": "Hoe leert een switch MAC-adressen?", "ok": "Uit het bron-MAC-adres van elk binnenkomend frame, samen met de inkomende poort.", "bad": ["Uit het bestemmings-MAC-adres van elk frame, samen met de uitgaande poort.", "Door bij het opstarten een ARP-request naar alle toestellen te sturen.", "De netwerkbeheerder moet elk MAC-adres manueel aan een poort koppelen."], "why": "Bij opstart is de MAC-adrestabel (CAM-tabel) leeg. Staat het adres er al op een andere poort, dan wordt het vervangen door de nieuwe poort."}, {"id": "cn118", "ch": "7", "q": "Het bestemmings-MAC-adres van een unicastframe staat niet in de MAC-adrestabel. Wat doet de switch?", "ok": "Hij flood het frame uit alle poorten behalve de inkomende.", "bad": ["Hij gooit het frame weg en wacht op een nieuw frame.", "Hij stuurt het frame terug naar de afzender met een foutmelding.", "Hij stuurt zelf een ARP-request om het MAC-adres te vinden."], "why": "Een Laag 2-switch is zich niet bewust van de inhoud (IPv4, ARP ...): hij beslist enkel op basis van MAC-adressen. Broadcast en multicast worden ook geflood."}, {"id": "cn119", "ch": "7", "q": "Welk voordeel heeft store-and-forward switching?", "ok": "De switch controleert eerst de CRC en gooit foute frames weg; dit is ook nodig voor QoS-analyse.", "bad": ["De laagste latency omdat het frame meteen na het bestemmingsadres doorgestuurd wordt.", "Er is helemaal geen buffergeheugen nodig.", "Het controleert enkel de eerste 64 byte, wat de meeste fouten opvangt."], "why": "Snelste latency = cut-through fast-forward. Eerste 64 byte controleren = fragment-free."}, {"id": "cn120", "ch": "7", "q": "Welke variant van cut-through switching controleert de eerste 64 byte van het frame voor het doorsturen?", "ok": "Fragment-free", "bad": ["Fast-forward", "Store-and-forward", "Shared memory"], "why": "De meeste fouten en botsingen gebeuren in de eerste 64 byte. Fragment-free is een compromis tussen store-and-forward en fast-forward."}, {"id": "cn121", "ch": "7", "q": "Welk type geheugenbuffering steekt alle frames in een gemeenschappelijke buffer die dynamisch over de poorten verdeeld wordt?", "ok": "Shared memory", "bad": ["Port-based memory", "NVRAM", "Fragment-free buffering"], "why": "Bij port-based memory kan één frame naar een drukke poort alle frames erachter in de wachtrij ophouden."}, {"id": "cn122", "ch": "7", "q": "Twee verbonden poorten werken de ene in full-duplex en de andere in half-duplex. Wat is het gevolg?", "ok": "Een duplex mismatch: er is nog communicatie, maar de prestaties zijn erg slecht.", "bad": ["De link gaat volledig down tot beide kanten hetzelfde staan.", "De switch past automatisch beide kanten aan naar half-duplex zonder gevolgen.", "Er ontstaat een broadcast storm in het hele netwerk."], "why": "Oorzaak: autonegotiation mislukt of één kant handmatig aangepast. Best practice: beide kanten autonegotiation aan of beide uit; liefst full-duplex. Gigabit-poorten werken enkel full-duplex."}, {"id": "cn123", "ch": "7", "q": "Wat doet auto-MDIX?", "ok": "De poort detecteert het kabeltype en past zich aan.", "bad": ["Het onderhandelt automatisch snelheid en duplex met de andere kant.", "Het controleert de CRC en gooit beschadigde frames weg.", "Het zet een rollover-kabel om naar een Ethernet-verbinding."], "why": "Standaard aan op recente IOS-versies, maar het kan uitgeschakeld zijn. Daarom: gebruik altijd het juiste kabeltype. Opnieuw aanzetten: mdix auto."}, {"id": "cn124", "ch": "8", "q": "Welke vier basisoperaties voert de netwerklaag uit?", "ok": "End devices adresseren, encapsulation, routing en de-encapsulation", "bad": ["Segmentatie, sequencing, flow control en reassembly", "Framing, MAC-adressering, error detection en media access control", "Encoding, signaling, bandwidth en throughput"], "why": "De netwerklaag (IPv4, IPv6) laat end devices data uitwisselen over netwerken heen."}, {"id": "cn125", "ch": "8", "q": "Welke drie eigenschappen beschrijven IP?", "ok": "Connectionless, best effort en media independent", "bad": ["Connection-oriented, reliable en media independent", "Connectionless, reliable en media dependent", "Connection-oriented, best effort en media dependent"], "why": "IP heeft weinig overhead. Betrouwbaarheid en verbindingen laat het over aan andere protocollen, typisch TCP."}, {"id": "cn126", "ch": "8", "q": "Wat betekent best effort bij IP?", "ok": "IP garandeert de levering niet en verwacht geen ACK's.", "bad": ["IP probeert elk pakket maximaal drie keer opnieuw te verzenden.", "IP kiest altijd het snelste pad, ook als dat duurder is.", "IP zet eerst een verbinding op met de bestemming voor het zendt."], "why": "IP weet niet of de andere kant werkt of het pakket ontving. Opnieuw verzenden en volgorde herstellen doet TCP."}, {"id": "cn127", "ch": "8", "q": "Een router stuurt een IPv4-pakket van Ethernet naar een trage WAN-link met een kleinere MTU. Wat gebeurt er?", "ok": "De router kan het IPv4-pakket fragmenteren, wat latency geeft.", "bad": ["De router gooit het pakket weg, want IPv4 kan niet fragmenteren.", "De switch verkleint het frame tot de juiste grootte voor de WAN.", "TCP op de router splitst het segment opnieuw op in kleinere stukken."], "why": "Valkuil: bij IPv6 fragmenteren routers niet. Daar moet de bron het pakket klein genoeg maken."}, {"id": "cn128", "ch": "8", "q": "Welk veld in de IPv4-header werkt als hop count en zorgt ervoor dat een pakket weggegooid wordt als het 0 wordt?", "ok": "Time to Live (TTL)", "bad": ["Header Checksum", "Differentiated Services", "Fragment Offset"], "why": "Elke router verlaagt de TTL. Bij 0 gooit hij het pakket weg en stuurt hij een ICMP Time Exceeded. In IPv6 heet dit veld Hop Limit."}, {"id": "cn129", "ch": "8", "q": "Waarvoor dient het veld Protocol in de IPv4-header?", "ok": "Het identificeert het protocol van de volgende laag, bv. TCP (6).", "bad": ["Het geeft de IP-versie aan: 0100 voor IPv4 en 0110 voor IPv6.", "Het wordt gebruikt voor QoS, zoals het DiffServ-veld.", "Het nummert de fragmenten van een gefragmenteerd pakket."], "why": "Version = 4 bits (0100). DS/DiffServ = QoS. Identification, Flag en Fragment Offset = fragmentatie. In IPv6 heet het Protocol-veld Next Header."}, {"id": "cn130", "ch": "8", "q": "Welke drie grote beperkingen van IPv4 noemt de cursus?", "ok": "Adresuitputting, geen end-to-end connectiviteit, complexiteit door NAT", "bad": ["Een te grote header, geen QoS en geen ondersteuning voor glasvezel", "Geen broadcast, geen multicast en geen loopbackadres beschikbaar", "Geen subnetmaskers, geen DHCP en geen ondersteuning voor DNS"], "why": "Private adressen en NAT hielden IPv4 in leven, maar maakten directe communicatie met publieke adressen onmogelijk en veroorzaken latency en troubleshooting-problemen."}, {"id": "cn131", "ch": "8", "q": "Welke uitspraak over de IPv6-header klopt?", "ok": "Hij is vereenvoudigd maar niet kleiner: vast 40 byte.", "bad": ["Hij is kleiner dan de IPv4-header: vast 20 byte.", "Hij is variabel van 20 tot 60 byte, net als bij IPv4.", "Hij bevat dezelfde velden als IPv4, maar met grotere adressen."], "why": "Velden als Flag, Fragment Offset en Header Checksum werden verwijderd om de verwerking te versnellen."}, {"id": "cn132", "ch": "8", "q": "Welke IPv4-velden zijn verwijderd uit de IPv6-header?", "ok": "Flag, Fragment Offset en Header Checksum", "bad": ["Source en Destination Address", "Version, Traffic Class en Payload Length", "Time to Live en Protocol (ze bestaan niet meer)"], "why": "TTL en Protocol bestaan nog, maar onder een andere naam: Hop Limit en Next Header."}, {"id": "cn133", "ch": "8", "q": "Welk IPv6-headerveld informeert toestellen om pakketten met hetzelfde label op dezelfde manier te behandelen?", "ok": "Flow Label", "bad": ["Traffic Class", "Next Header", "Payload Length"], "why": "Flow Label is 20 bit. Traffic Class = QoS (zoals DiffServ). Payload Length = 16 bit, lengte van het datagedeelte."}, {"id": "cn134", "ch": "8", "q": "Wat zijn IPv6 extension headers?", "ok": "Optionele headers tussen de IPv6-header en de payload", "bad": ["Verplichte headers die de IPv4-header vervangen in dual stack", "Transportlaagheaders die IPv6 toevoegt voor betrouwbaarheid", "Trailers achteraan het pakket met een extra checksum"], "why": "Extension headers bieden optionele netwerklaaginformatie."}, {"id": "cn135", "ch": "8", "q": "Hoe bepaalt een IPv4-host of een bestemming lokaal of remote is?", "ok": "Met zijn eigen IP-adres, zijn subnetmasker en het bestemmings-IP.", "bad": ["Hij vraagt het aan de DNS-server die het IP-adres teruggeeft.", "Hij kijkt of het MAC-adres van de bestemming in zijn ARP-tabel staat.", "Hij stuurt altijd eerst een ping en kijkt naar de TTL van het antwoord."], "why": "Bij IPv6 gebruikt de host de netwerkprefix die de lokale router adverteert. Remote verkeer gaat naar de default gateway."}, {"id": "cn136", "ch": "8", "q": "Welke adressen gebruikt een host om zichzelf te bereiken?", "ok": "127.0.0.1 voor IPv4 en ::1 voor IPv6", "bad": ["169.254.0.1 voor IPv4 en fe80::1 voor IPv6", "0.0.0.0 voor IPv4 en :: voor IPv6", "255.255.255.255 voor IPv4 en ff02::1 voor IPv6"], "why": "Een host kan pakketten sturen naar zichzelf, naar lokale hosts en naar remote hosts."}, {"id": "cn137", "ch": "8", "q": "Met welke Windows-commando's toon je de routingtabel van een pc?", "ok": "route print of netstat -r", "bad": ["show ip route", "ipconfig /all", "tracert -d"], "why": "De output heeft drie secties: Interface List, IPv4 Route Table en IPv6 Route Table."}, {"id": "cn138", "ch": "8", "q": "Welke drie types routes staan in de routingtabel van een router?", "ok": "Directly connected, remote en default", "bad": ["Static, dynamic en broadcast routes", "Local, global en link-local routes", "Unicast, multicast en anycast routes"], "why": "Directly connected: automatisch als de interface actief is en een adres heeft. Remote: manueel (static) of dynamisch (routingprotocol). Default: als er geen andere match is."}, {"id": "cn139", "ch": "8", "q": "Welke uitspraak past bij statische routing?", "ok": "Manueel geconfigureerd en aangepast bij elke wijziging; goed voor kleine niet-redundante netwerken.", "bad": ["Ontdekt automatisch remote netwerken en zoekt een nieuw pad bij een wijziging in de topologie.", "Wordt automatisch toegevoegd zodra een interface een IP-adres heeft.", "Werkt enkel met IPv6 en vervangt de default route."], "why": "Dynamische routing ontdekt netwerken, houdt info up-to-date en kiest het beste pad. Statische routes worden vaak gebruikt voor een default route."}, {"id": "cn140", "ch": "8", "q": "Wat betekent S* in de output van show ip route?", "ok": "Een statische default route", "bad": ["Een direct verbonden netwerk", "Een route geleerd via OSPF", "Het lokale IP-adres van de interface"], "why": "C = connected, L = local, S = static, O = OSPF, D = EIGRP. Het sterretje duidt op een kandidaat-default route."}, {"id": "cn141", "ch": "9", "q": "Welke twee adressen heeft een toestel op een LAN, en waarvoor dienen ze?", "ok": "MAC-adres: van NIC naar NIC op hetzelfde netwerk; IP-adres: van bron- naar bestemmingstoestel", "bad": ["MAC-adres: van bron- naar bestemmingstoestel; IP-adres: van NIC naar NIC op hetzelfde netwerk", "MAC-adres: van NIC naar NIC op hetzelfde netwerk; IP-adres: enkel voor de default gateway", "MAC-adres: enkel voor de default gateway; IP-adres: van bron- naar bestemmingstoestel"], "why": "Laag 2 = fysiek adres, Laag 3 = logisch adres."}, {"id": "cn142", "ch": "9", "q": "Een host wil een pakket naar een remote netwerk sturen. Welk IPv4-adres zoekt hij in zijn ARP-tabel?", "ok": "Het IPv4-adres van de default gateway", "bad": ["Het IPv4-adres van de eindbestemming", "Het broadcastadres van zijn netwerk", "Het IPv4-adres van de DNS-server"], "why": "Valkuil: niet de eindbestemming. Het frame gaat naar de router, dus heeft de host het MAC-adres van de default gateway nodig."}, {"id": "cn143", "ch": "9", "q": "Wat zijn de twee basisfuncties van ARP?", "ok": "IPv4-adressen omzetten naar MAC-adressen en een ARP-tabel bijhouden met die koppelingen", "bad": ["MAC-adressen omzetten naar IPv4-adressen en een MAC-adrestabel bijhouden per switchpoort", "Domeinnamen omzetten naar IPv4-adressen en een DNS-cache bijhouden", "IPv4-adressen uitdelen aan hosts en de leases bijhouden"], "why": "MAC-adrestabel = switch. DNS = namen. DHCP = adressen uitdelen."}, {"id": "cn144", "ch": "9", "q": "Er is geen ARP-entry voor het gezochte IPv4-adres. Wat doet de host?", "ok": "Hij stuurt een ARP-request als broadcast; het juiste toestel antwoordt met een ARP-reply.", "bad": ["Hij stuurt het frame met de data al naar FF-FF-FF-FF-FF-FF en wacht op een antwoord.", "Hij vraagt het MAC-adres op bij de DNS-server die in zijn configuratie staat.", "Hij gebruikt het MAC-adres van de switch als bestemming tot hij het juiste kent."], "why": "ARP-requests worden door elk toestel op het lokale netwerk ontvangen en verwerkt. Te veel ARP-broadcasts kunnen de prestaties verminderen."}, {"id": "cn145", "ch": "9", "q": "Hoe verdwijnen entries uit een ARP-tabel?", "ok": "Na een cache timer, of de beheerder verwijdert ze manueel.", "bad": ["Ze blijven permanent staan tot de host herstart.", "De switch wist ze wanneer een toestel van poort verandert.", "De DHCP-server wist ze wanneer de lease van het adres afloopt."], "why": "Op Windows leeg je de cache met netsh interface ip delete arpcache (vaak admin nodig)."}, {"id": "cn146", "ch": "9", "q": "Met welk commando toon je de ARP-tabel op een Cisco-router en op een Windows-pc?", "ok": "Router: show ip arp; Windows: arp -a", "bad": ["Router: arp -a; Windows: show ip arp", "Router: show mac address-table; Windows: arp -a", "Router: show ip arp; Windows: ipconfig /all"], "why": "De ARP-cache toont enkel toestellen die recent gecontacteerd werden. Ping eerst om hem te vullen."}, {"id": "cn147", "ch": "9", "q": "Wat is ARP poisoning (ARP spoofing)?", "ok": "Een threat actor stuurt vervalste ARP-replies zodat verkeer naar het verkeerde MAC-adres gaat.", "bad": ["Een threat actor overspoelt de switch met frames zodat de MAC-adrestabel vol raakt.", "Een threat actor stuurt vervalste DNS-antwoorden met een fout IP-adres.", "Een threat actor stuurt een DHCPNAK naar alle clients."], "why": "Enterprise-switches hebben technieken om ARP-aanvallen tegen te gaan."}, {"id": "cn148", "ch": "9", "q": "Welke ICMPv6-berichten gebruikt IPv6 voor adresresolutie tussen toestellen?", "ok": "Neighbor Solicitation (NS) en Neighbor Advertisement (NA)", "bad": ["Router Solicitation (RS) en Router Advertisement (RA)", "ARP request en ARP reply", "Echo request en echo reply"], "why": "RS/RA = tussen toestel en router (router discovery, adresinfo). NS/NA = tussen toestellen (adresresolutie, DAD). ND biedt ook redirect."}, {"id": "cn149", "ch": "9", "q": "Wat is het eerste wat een toestel doet als een IPv6-adres van een bestemming bekend is maar het MAC-adres niet?", "ok": "Een Neighbor Solicitation naar het solicited-node multicastadres sturen", "bad": ["Een ARP-request als broadcast naar FF-FF-FF-FF-FF-FF sturen op de LAN", "Een Router Solicitation naar ff02::2 sturen en wachten op een RA", "Een DNS-query sturen voor de AAAA-record van de bestemming"], "why": "IPv6 heeft geen broadcast en geen ARP. NS-berichten gebruiken speciale Ethernet- en IPv6-multicastadressen."}, {"id": "cn150", "ch": "10", "q": "Wat doet transport input ssh onder line vty 0 4?", "ok": "Het laat enkel SSH toe voor remote toegang via die VTY-lijnen.", "bad": ["Het genereert de RSA-sleutels en start de SSH-server op de router.", "Het sluit de consolepoort af zodat enkel SSH nog mogelijk is.", "Het versleutelt alle wachtwoorden die in de running-config staan."], "why": "Met transport input {ssh | telnet} kies je welke protocollen toegelaten worden. In het voorbeeld van de cursus: transport input ssh telnet."}, {"id": "cn151", "ch": "10", "q": "Waarom gebruik je description op een router-interface?", "ok": "Om te documenteren welk netwerk aangesloten is, bv. Link to LAN.", "bad": ["Om de interface te activeren, zodat de status van down naar up gaat.", "Om het IP-adres van de interface automatisch in DNS te registreren.", "Om de interface te hernoemen, bv. LAN1 in plaats van G0/0/0."], "why": "description verandert niets aan de werking. no shutdown activeert de interface."}, {"id": "cn152", "ch": "10", "q": "Je configureerde een IP-adres op G0/0/0 maar vergat no shutdown. Wat toont show ip interface brief?", "ok": "administratively down / down", "bad": ["up / down, want er is wel een adres maar geen kabel", "up / up, want het adres volstaat om de interface te activeren", "down / up, want enkel het protocol is actief"], "why": "Router-interfaces staan standaard uit. no shutdown activeert ze. In het voorbeeld van de cursus staat Vlan1 unassigned en administratively down."}, {"id": "cn153", "ch": "10", "q": "Wat betekenen de codes C en L in show ip route?", "ok": "C: direct verbonden netwerk; L: het IP-adres van de eigen interface (/32)", "bad": ["C: het IP-adres van de eigen interface (/32); L: direct verbonden netwerk", "C: direct verbonden netwerk; L: route geleerd via een link-state protocol", "C: route via een Cisco-protocol; L: het IP-adres van de eigen interface (/32)"], "why": "Voorbeeld: C 192.168.10.0/24 is directly connected, L 192.168.10.1/32 is directly connected. S = static, O = OSPF, D = EIGRP, S* = default route."}, {"id": "cn154", "ch": "10", "q": "Welk commando toont statistieken voor alle interfaces, maar enkel de IPv4-adresinformatie?", "ok": "show interfaces", "bad": ["show ip interface brief", "show ipv6 interface brief", "show ip route"], "why": "show interfaces toont o.a. MAC-adres, duplex, snelheid, MTU, runts en giants. show ip interface brief geeft een kort overzicht van status en IP per interface."}, {"id": "cn155", "ch": "10", "q": "show ipv6 interface brief toont onder G0/0/0 zowel FE80::201:C9FF:FE89:4501 als 2001:DB8:ACAD:10::1. Wat is FE80::201:C9FF:FE89:4501?", "ok": "Het link-local adres dat de router zelf aanmaakte", "bad": ["Het global unicast adres dat je zelf configureerde", "Het adres van de default gateway van die LAN", "Een multicastadres waarop alle routers luisteren"], "why": "Een router maakt automatisch een LLA aan zodra je een GUA configureert. FE80::/10 = link-local."}, {"id": "cn156", "ch": "10", "q": "PC1 heeft 192.168.10.10/24 en als default gateway 192.168.20.1. Wat is het probleem?", "ok": "De gateway ligt buiten het netwerk van de host, dus remote netwerken zijn onbereikbaar.", "bad": ["Er is geen probleem: een default gateway mag in eender welk netwerk liggen, de router regelt de rest.", "Het enige probleem is dat een default gateway altijd op .254 moet eindigen in een /24-netwerk.", "PC1 kan daardoor ook geen enkele host op zijn eigen LAN meer bereiken, want alle frames gaan naar de gateway."], "why": "Het IP-adres van de host en van de router-interface moeten in hetzelfde netwerk liggen. Lokaal verkeer werkt wel nog."}, {"id": "cn157", "ch": "10", "q": "Waarom configureer je ip default-gateway op een switch?", "ok": "Om de switch vanuit een ander netwerk op afstand te kunnen beheren.", "bad": ["Zodat de pc's op de switch het internet kunnen bereiken.", "Zodat de switch frames tussen VLANs kan routeren.", "Omdat de switch anders zijn MAC-adrestabel niet kan opbouwen."], "why": "De switch stuurt frames van pc's door op basis van MAC-adressen, daarvoor heeft hij geen ga
