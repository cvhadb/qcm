<!DOCTYPE html>
<html lang="nl">
<head>

<title>OS Refresher (SEM 2)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark;
    --bg: #0d0f14; --surface: #161921; --border: #252a35; --card-bg: #1a1f2e;
    --accent: #e8ff47; --accent2: #47c8ff; --text: #e8eaf0; --muted: #7a8196;
    --ok: #7bc84a; --ok-bg: rgba(58,110,26,.22); --bad: #e05c5c; --bad-bg: rgba(122,26,26,.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-family: 'Syne', 'Arial Black', sans-serif; font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 800; letter-spacing: -1px; color: var(--accent); text-transform: uppercase; line-height: 1; }
  header p { color: var(--muted); font-size: .78rem; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
  .wrap { width: 100%; max-width: 720px; }
  .panel { background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 28px 30px; }
  .label { font-size: .65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; font: inherit; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 2px; }
  .chip:hover { color: var(--text); border-color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .btn { padding: 12px 26px; font: inherit; font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 2px; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #fff; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-secondary:hover { border-color: var(--text); color: var(--text); }
  .btn:focus-visible, .chip:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .stats { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  .stats strong { font-size: 1rem; color: var(--accent); }
  .stats .s-ok strong { color: var(--ok); } .stats .s-bad strong { color: var(--bad); }
  .track { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 18px; }
  .fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .q { font-size: 1.02rem; line-height: 1.6; margin-bottom: 20px; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; font: inherit; font-size: .86rem; line-height: 1.5; border-radius: 3px; cursor: pointer; width: 100%; }
  .opt:hover:not(:disabled) { border-color: var(--accent2); }
  .opt .key { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); }
  .opt:disabled { cursor: default; }
  .opt.is-ok { background: var(--ok-bg); border-color: var(--ok); }
  .opt.is-ok .key { color: var(--ok); border-color: var(--ok); }
  .opt.is-bad { background: var(--bad-bg); border-color: var(--bad); }
  .opt.is-bad .key { color: var(--bad); border-color: var(--bad); }
  .opt.is-dim { opacity: .55; }
  .why { margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--accent2); background: var(--surface); font-size: .8rem; line-height: 1.7; color: #b8bdcc; }
  .why b { color: var(--text); }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .hint { font-size: .66rem; color: var(--muted); letter-spacing: 1px; }
  .big { font-family: 'Syne', 'Arial Black', sans-serif; font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .per { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin: 20px 0; }
  .per div { background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: 3px; font-size: .75rem; color: var(--muted); }
  .per strong { display: block; font-size: 1.1rem; color: var(--text); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .wrong { margin-top: 18px; display: grid; gap: 10px; }
  .wrong div { background: var(--surface); border-left: 3px solid var(--bad); padding: 12px 14px; font-size: .8rem; line-height: 1.6; }
  .wrong .a { color: var(--ok); margin-top: 4px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  @media (max-width: 520px) { .panel { padding: 22px 18px; } .q { font-size: .95rem; } }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>

<header>
  <h1>OS Refresher (SEM 2)</h1>
  <p>Operating Systems · <span id="total">0</span> meerkeuzevragen</p>
</header>

<main class="wrap">
  <section id="setup" class="panel">
    <div class="label">Hoofdstuk</div>
    <div class="row" id="chapters"></div>
    <div class="label">Aantal vragen</div>
    <div class="row" id="sizes"></div>
    <button class="btn btn-primary" id="start">Start</button>
    <p class="hint" style="margin-top:14px">Vragen en antwoorden worden telkens geschud. Foute antwoorden komen in "Te herhalen" (in deze browser).</p>
  </section>

  <section id="quiz" hidden>
    <div class="stats">
      <span>Vraag <strong id="num">1</strong> / <strong id="of">0</strong></span>
      <span class="s-ok">Juist <strong id="nok">0</strong></span>
      <span class="s-bad">Fout <strong id="nbad">0</strong></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="panel">
      <div class="label" id="qlabel">H1</div>
      <div class="q" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="why" id="why" hidden></div>
      <div class="nav">
        <button class="btn btn-secondary" id="stop">Stoppen</button>
        <span class="hint">A–D of 1–4 om te kiezen · Enter = volgende</span>
        <button class="btn btn-primary" id="next" hidden>Volgende →</button>
      </div>
    </div>
  </section>

  <section id="result" class="panel" hidden>
    <div class="label">Resultaat</div>
    <div class="big" id="score">0 / 0</div>
    <div class="per" id="per"></div>
    <div class="actions">
      <button class="btn btn-primary" id="retry">Herhaal de foute</button>
      <button class="btn btn-secondary" id="again">Nieuwe toets</button>
    </div>
    <div class="wrong" id="wrong"></div>
  </section>
</main>

<script>
const QUESTIONS = [{"id": "os001", "ch": "2", "q": "Wat is virtualisatie volgens de cursus?", "ok": "Technologie om virtuele representaties te maken van servers, opslag en netwerken", "bad": ["Technologie om meerdere besturingssystemen naast elkaar te installeren en te kiezen bij het opstarten", "Het huren van rekenkracht bij een provider met een pay-as-you-go model", "Het opdelen van een schijf in partities met elk een eigen file system"], "why": "De virtualisatiesoftware bootst fysieke hardware na, zodat meerdere VM's tegelijk op één machine draaien. Het is ook de basis van cloud computing."}, {"id": "os002", "ch": "2", "q": "Wat is het verschil tussen meerdere besturingssystemen installeren (multi-boot) en virtualisatie?", "ok": "Bij multi-boot draait er maar één OS tegelijk; met virtualisatie draaien ze gelijktijdig.", "bad": ["Bij virtualisatie draait er maar één OS tegelijk; met multi-boot draaien ze gelijktijdig.", "Bij multi-boot delen de systemen de hardware; bij virtualisatie heeft elk OS eigen hardware.", "Er is geen verschil: virtualisatie is een andere naam voor multi-boot."], "why": "Wisselen tussen geïnstalleerde systemen vereist een herstart. Virtuele computers delen de hardware maar werken als afzonderlijke computers."}, {"id": "os003", "ch": "2", "q": "Welke virtuele hardware heeft elke VM?", "ok": "vCPU, vRAM, virtuele netwerkkaart(en) en virtual disk(s)", "bad": ["Een eigen fysieke processor, eigen RAM-latjes en een eigen schijf", "Enkel een vCPU; geheugen en schijf worden live gedeeld met de host", "Een container layer en een storage driver"], "why": "Virtuele schijven zijn bestanden op de fysieke schijf. vCPU's krijgen via scheduling een deel van de processorcapaciteit."}, {"id": "os004", "ch": "2", "q": "Waar worden de virtual disks van een VM bewaard?", "ok": "Als bestanden op de fysieke schijf van de host", "bad": ["In het RAM van de host, ze verdwijnen bij een herstart", "Op een aparte fysieke partitie per VM", "In de container layer van de hypervisor"], "why": "Voorbeelden van formaten (H4): VDI, VHDX, VMDK. Zo'n bestand stelt een virtueel blokapparaat voor met eigen partitietabel."}, {"id": "os005", "ch": "2", "q": "Welke combinatie geeft de voordelen van virtualisatie volgens de cursus?", "ok": "Efficiënter hardwaregebruik, goedkoper, lagere ecologische voetafdruk", "bad": ["Betere prestaties dan fysiek, geen overhead, eenvoudiger beheer", "Elke software is compatibel, ook zware games", "Geen technische kennis of strategie nodig"], "why": "De andere opties zijn net de nadelen omgekeerd: prestatieverlies door overhead, beperkte compatibiliteit (grafische software, games) en complexiteit."}, {"id": "os006", "ch": "2", "q": "Wat gebeurt er volgens de cursus zonder goede virtualisatiestrategie?", "ok": "Een wildgroei aan virtuele servers en hogere beheerskosten", "bad": ["De VM's starten na een tijd niet meer op", "De hypervisor schakelt automatisch over naar Type 2", "De host schakelt alle VM's om naar containers"], "why": "Complexiteit is één van de drie nadelen, naast compatibiliteit en prestaties."}, {"id": "os007", "ch": "2", "q": "Welke virtualisatiesoftware maakte als eerste virtualisatie op het Intel-platform mogelijk?", "ok": "VMware", "bad": ["VirtualBox", "Hyper-V", "Docker"], "why": "Gratis alternatieven: Xen, KVM en VirtualBox. Parallels is geoptimaliseerd voor Mac."}, {"id": "os008", "ch": "2", "q": "Waarom is Docker een speciale vorm van virtualisatie?", "ok": "Er zijn geen VM's: containers delen één Linux-kernel.", "bad": ["Elke container krijgt een eigen kernel en eigen virtuele hardware.", "Docker werkt enkel als Type 1 hypervisor op bare metal.", "Docker emuleert een volledige computer, net als VirtualBox."], "why": "In de indeling van VM's is Docker applicatie-specifiek: het bootst geen volledige computer na."}, {"id": "os009", "ch": "2", "q": "Welk soort virtuele machine is de JVM?", "ok": "Programmeertaal-specifiek", "bad": ["Emulator", "Applicatie-specifiek", "Type 1 hypervisor"], "why": "Emulator: bootst een volledige computer na (VirtualBox, VMware). Applicatie-specifiek: Docker-containers."}, {"id": "os010", "ch": "2", "q": "Wat doet JIT-compilatie bij de JVM?", "ok": "Bytecode tijdens de uitvoering omzetten naar platforminstructies", "bad": ["Java-code omzetten naar bytecode bij de ontwikkelaar", "De JVM omzetten naar een Docker-container", "Bytecode versleutelen zodat niemand ze kan lezen"], "why": "JIT = just in time. Java compileert naar bytecode, die de JVM interpreteert of via JIT omzet. Gevolg: platformonafhankelijk."}, {"id": "os011", "ch": "2", "q": "Wat is een hypervisor?", "ok": "Software om VM's aan te maken, op te starten en te beheren", "bad": ["Hardware in de CPU die containers scheidt", "Het besturingssysteem in een VM (guest OS)", "Het bestand waarin een virtuele schijf bewaard wordt"], "why": "De hypervisor verdeelt CPU, geheugen, opslag en netwerk zodat elke VM werkt alsof ze eigen hardware heeft."}, {"id": "os012", "ch": "2", "q": "Welke uitspraak past bij een Type 1 hypervisor?", "ok": "Ligt direct op de hardware en wordt vooral voor servers gebruikt", "bad": ["Ligt direct op de hardware en wordt vooral op laptops gebruikt", "Ligt op een besturingssysteem en wordt vooral voor servers gebruikt", "Ligt op een besturingssysteem en wordt vooral op laptops gebruikt"], "why": "Type 1 (bare metal): krachtiger, vraagt technische kennis. Type 2: als gewoon programma op Windows, macOS of Linux, makkelijker maar minder efficiënt."}, {"id": "os013", "ch": "2", "q": "Welke zijn allemaal Type 1 hypervisors?", "ok": "VMware ESXi, Xen, KVM en Hyper-V", "bad": ["VirtualBox, VMware Workstation en Parallels Desktop", "Docker, Podman en Kubernetes", "VMware ESXi, VirtualBox en Parallels Desktop"], "why": "Type 2: VirtualBox, VMware Workstation, Parallels Desktop. In H3 wordt ook Proxmox als Type 1 genoemd."}, {"id": "os014", "ch": "2", "q": "Kan je op één toestel een Type 1 en een Type 2 hypervisor naast elkaar installeren?", "ok": "Nee; meerdere Type 2 hypervisors naast elkaar kan wel.", "bad": ["Ja; meerdere Type 2 naast elkaar kan echter niet.", "Ja, zolang ze van dezelfde fabrikant zijn.", "Nee, en ook twee Type 2 hypervisors kan niet."], "why": "Type 1 ligt rechtstreeks op de hardware, dus er is geen OS waarop een Type 2 kan draaien."}, {"id": "os015", "ch": "2", "q": "Welke uitspraak over single-tenant en multi-tenant klopt?", "ok": "Multi-tenant: beter gebruik van de ruimte en goedkoper, maar minder afscherming.", "bad": ["Multi-tenant: meer afscherming en goedkoper, maar slechter gebruik van de ruimte.", "Single-tenant: beter gebruik van de ruimte en goedkoper, maar minder afscherming.", "Single-tenant: minder afscherming en duurder, maar beter gebruik van de ruimte."], "why": "Analogie uit de cursus: single-tenant = alleenstaande woning, multi-tenant = appartement."}, {"id": "os016", "ch": "2", "q": "Wat is een tenant?", "ok": "Een gebruiker of groep met gemeenschappelijke toegang", "bad": ["Een fysieke server in een datacenter van de provider", "Een virtuele schijf die aan een VM gekoppeld is", "Een read-only laag in een Docker-image"], "why": "Tenant = huurder. Multi-tenancy kan op hardwareniveau (VM's) of op softwareniveau (een webapplicatie voor meerdere klanten)."}, {"id": "os017", "ch": "2", "q": "Wat zijn de nadelen van multi-tenancy?", "ok": "Minder isolatie en minder prestatie-isolatie", "bad": ["Hogere operationele kosten en meer stroomverbruik", "Er kan maar één tenant tegelijk werken", "Elke tenant heeft een eigen fysieke server nodig"], "why": "Een inbreuk op één instantie kan meerdere tenants raken, en een grote tenant kan kleinere vertragen. Daarom: strikte scheiding van prestaties en gegevens."}, {"id": "os018", "ch": "2", "q": "Welke kenmerken heeft cloud computing volgens de cursus?", "ok": "On demand, pay-as-you-go, elasticiteit en multi-tenancy", "bad": ["Eigen hardware, vaste maandprijs, vaste capaciteit en single-tenancy", "Gratis, onbeperkt, offline en zonder provider", "Bare metal, Type 1, containers en partities"], "why": "Zonder mogelijkheid om te schalen is een online dienst geen cloud computing."}, {"id": "os019", "ch": "2", "q": "Een ziekenhuis bewaart gevoelige data die wettelijk niet naar het buitenland mag in een eigen cloud, en doet zwaar rekenwerk bij een publieke provider. Welk deployment model is dit?", "ok": "Hybride cloud", "bad": ["Private cloud", "Publieke cloud", "Community cloud"], "why": "Dat is het voorbeeld uit de cursus. Private cloud kan self hosted of colocated zijn, en kan opgezet worden met bv. OpenStack."}, {"id": "os020", "ch": "2", "q": "Bij welk service model kies je zelf het besturingssysteem en log je bv. via SSH in op een VM?", "ok": "IaaS (bv. Amazon EC2)", "bad": ["PaaS (bv. Google App Engine)", "SaaS (bv. Gmail)", "FaaS (bv. AWS Lambda)"], "why": "IaaS: meeste controle, meeste kennis nodig. PaaS: je beheert de software, niet de hardware. SaaS: de aanbieder beheert alles."}, {"id": "os021", "ch": "2", "q": "Welk service model biedt frameworks zoals Python, .NET of Java aan, zonder controle over de hardware?", "ok": "PaaS", "bad": ["IaaS", "SaaS", "Bare metal"], "why": "Voorbeelden: Microsoft Azure App Service, Google App Engine."}, {"id": "os022", "ch": "2", "q": "Wat is elasticiteit in de cloud?", "ok": "Bronnen automatisch aanpassen aan een stijgende of dalende vraag", "bad": ["Zo veel mogelijk tenants op één fysieke server zetten", "Bronnen een vol jaar vast reserveren tegen een lagere prijs", "VM's verplaatsen tussen een Type 1 en een Type 2 hypervisor"], "why": "Kan proactief (vooraf voorspellen, vaak met AI op historische data) of reactief. Elasticiteit onderscheidt cloud computing van bv. grid computing."}, {"id": "os023", "ch": "2", "q": "Wat is het gevolg van under-provisioning?", "ok": "Applicaties reageren traag of crashen", "bad": ["Je betaalt voor instanties die niets doen", "De provider rekent automatisch meer instanties aan", "De applicatie verhuist naar een private cloud"], "why": "Over-provisioning: alles loopt vlot, maar je betaalt voor ongebruikte bronnen."}, {"id": "os024", "ch": "3", "q": "Welk nadeel heeft bare metal deployment volgens de cursus?", "ok": "Eén crash kan de hele server offline halen.", "bad": ["Je kan geen service installeren zonder hypervisor.", "Er is veel overhead door meerdere OS-lagen.", "Elke service krijgt een eigen kernel en veel RAM."], "why": "Andere nadelen: bestanden verspreid, moeilijk meerdere versies naast elkaar, sterke koppeling soft- en hardware, veel ruimte en stroom, onderbenutte hardware."}, {"id": "os025", "ch": "3", "q": "Welke nadelen hebben VM's volgens H3?", "ok": "Veel overhead, trage opzet en grote omvang", "bad": ["Ze delen de kernel van de host en zijn dus niet geïsoleerd", "Ze kunnen maar door één klant tegelijk gebruikt worden", "Ze verliezen al hun data bij elke herstart"], "why": "Daarnaast zijn ze complexer om te beheren. Containers delen wel de kernel, dat is net hun voordeel."}, {"id": "os026", "ch": "3", "q": "Wat beheert en voert containers uit, in plaats van een hypervisor?", "ok": "Een container runtime", "bad": ["Een bootloader", "Een storage driver", "Een Type 2 hypervisor"], "why": "Containers delen de kernel van de host; enkel de applicatie en haar afhankelijkheden worden geïsoleerd. Voorbeelden: Docker en Podman."}, {"id": "os027", "ch": "3", "q": "Wanneer kies je volgens de vuistregel van de cursus voor VM's en wanneer voor containers?", "ok": "VM's voor infrastructuur, containers voor applicaties", "bad": ["Containers voor infrastructuur, VM's voor applicaties", "Altijd containers, want VM's zijn achterhaald", "Altijd VM's, want containers zijn niet veilig"], "why": "Kies op basis van de situatie: beide hebben voor- en nadelen."}, {"id": "os028", "ch": "3", "q": "Wat is het verschil tussen een image en een container?", "ok": "Een image is een onveranderlijk sjabloon; een container is een draaiend exemplaar met een beschrijfbare laag.", "bad": ["Een container is een onveranderlijk sjabloon; een image is een draaiend exemplaar met een beschrijfbare laag.", "Een image is een draaiende VM; een container is het bestand op de schijf.", "Er is geen verschil; het zijn twee namen voor hetzelfde."], "why": "Analogie uit de cursus: image = exe-bestand op de schijf, container = draaiende instantie in RAM. Je kan meerdere containers van één image starten."}, {"id": "os029", "ch": "3", "q": "Welke Dockerfile-instructie stelt een environment variable in, en welke documenteert een poort?", "ok": "ENV en EXPOSE", "bad": ["RUN en CMD", "COPY en FROM", "EXPOSE en ENV"], "why": "FROM: basisimage. RUN: commando tijdens het bouwen (bv. apt-get install). COPY: bestanden kopiëren. CMD: standaardcommando bij de start."}, {"id": "os030", "ch": "3", "q": "Wat is het verschil tussen RUN en CMD in een Dockerfile?", "ok": "RUN bij het bouwen van de image; CMD bij het starten van de container", "bad": ["CMD bij het bouwen van de image; RUN bij het starten van de container", "RUN en CMD allebei bij elke start van een container", "RUN installeert de basisimage; CMD kopieert de applicatie"], "why": "In H4: RUN maakt een nieuwe image layer, CMD wijzigt enkel de metadata."}, {"id": "os031", "ch": "3", "q": "Wat doet docker run?", "ok": "Een container maken en starten", "bad": ["Een image bouwen uit een Dockerfile", "Een image uploaden naar DockerHub", "Een gestopte container herstarten"], "why": "docker build bouwt, docker push uploadt, docker start herstart een bestaande container. docker run is het meest gebruikte commando."}, {"id": "os032", "ch": "3", "q": "Wat doet docker commit?", "ok": "De staat van een container opslaan als image", "bad": ["Een image naar een registry uploaden", "Een container naar een tar-bestand exporteren", "Een label (tag) aan een image toekennen"], "why": "push: uploaden. save/load: exporteren en importeren als tar. tag: label toekennen."}, {"id": "os033", "ch": "3", "q": "Hoe maak je een back-up van een image zonder registry?", "ok": "docker save en docker load (tar-bestand)", "bad": ["docker commit en daarna docker push", "docker stop en daarna docker start", "docker pull en daarna docker tag"], "why": "Bv. backup.tar."}, {"id": "os034", "ch": "3", "q": "Je stopt een container met docker stop. Wat is waar?", "ok": "De container blijft bestaan; je ziet hem met docker ps -a.", "bad": ["De container wordt verwijderd met al zijn data.", "De image wordt ook verwijderd.", "De container verschijnt nog in docker ps zonder -a."], "why": "Zonder -a toont docker ps enkel draaiende containers. Containernamen worden willekeurig gegenereerd (bv. thirsty_feynman), tenzij je --name gebruikt."}, {"id": "os035", "ch": "3", "q": "Wat doet -p 8123:80 bij docker run?", "ok": "Poort 8123 op de host koppelen aan poort 80 in de container", "bad": ["Poort 8123 in de container koppelen aan poort 80 op de host", "De container toegang geven tot poorten 80 tot 8123", "Poort 80 open zetten in de firewall van de host"], "why": "Syntaxis: -p poort_op_host:poort_in_container. Zonder binding is een container van buitenaf niet bereikbaar."}, {"id": "os036", "ch": "3", "q": "Wat is het verschil tussen een named volume en een bind mount?", "ok": "Named volume: door Docker beheerd. Bind mount: een specifieke map op de host die je zelf kan bewerken.", "bad": ["Bind mount: door Docker beheerd. Named volume: een specifieke map op de host die je zelf kan bewerken.", "Een named volume verdwijnt bij het verwijderen van de container, een bind mount niet.", "Een bind mount is altijd read-only, een named volume niet."], "why": "Named volume: -v naam:map_in_container (op Linux in /var/lib/docker/volumes/). Bind mount: -v map_op_host:map_in_container. :ro maakt het read-only."}, {"id": "os037", "ch": "3", "q": "Waarom gebruik je beter geen image zonder tag in productie?", "ok": "Dan wordt latest gebruikt, met kans op breaking changes.", "bad": ["Dan start de container helemaal niet op.", "Dan wordt altijd de oudste versie gebruikt.", "Dan is de container volledig read-only."], "why": "Voorbeeld: nginx:1.24.0. Een tag kan ook de basisimage aanduiden (ubuntu of alpine)."}, {"id": "os038", "ch": "3", "q": "Welke opties geven een container een naam en laten hem op de achtergrond draaien?", "ok": "--name en -d", "bad": ["-n en -b", "--name en -e", "-t en -d"], "why": "-d = detached. -e VARIABLE=waarde geeft configuratie mee zonder de image aan te passen."}, {"id": "os039", "ch": "3", "q": "Waarom bestaat Docker Compose?", "ok": "Lange commando's vermijden en containers laten samenwerken", "bad": ["Images bouwen zonder dat je een Dockerfile nodig hebt", "Containers omzetten naar volwaardige VM's", "Docker laten werken op Windows en macOS"], "why": "docker-compose.yml is infrastructure as code in YAML, handig om met git te versioneren."}, {"id": "os040", "ch": "3", "q": "Welke commando's starten een compose-project op de achtergrond en stoppen en verwijderen het weer?", "ok": "docker compose up -d en docker compose down", "bad": ["docker compose start en docker compose stop", "docker compose run -d en docker compose rm", "docker compose up --detach en docker compose stop"], "why": "Valkuil: down stopt én verwijdert de containers. Overige: compose ls, compose images, compose ps (-a)."}, {"id": "os041", "ch": "3", "q": "Hoe bereikt de service adminer de database in een docker-compose.yml?", "ok": "Via de servicenaam database (ingebouwde DNS)", "bad": ["Via het IP-adres van de database-container", "Via localhost:3306 binnen het netwerk", "Via de port mapping van de database naar de host"], "why": "Compose maakt automatisch een geïsoleerd netwerk met eigen DNS. Servicenamen zijn hostnamen."}, {"id": "os042", "ch": "3", "q": "Wat gaat er mis met WORDPRESS_DB_HOST: localhost:3306 in een docker-compose.yml?", "ok": "WordPress zoekt de database dan in zijn eigen container.", "bad": ["WordPress zoekt de database dan op de host buiten Docker.", "Het werkt, want localhost wijst naar het compose-netwerk.", "Compose weigert te starten omdat localhost verboden is."], "why": "Compose virtualiseert hier twee computers in een netwerk. Gebruik database:3306."}, {"id": "os043", "ch": "3", "q": "Wat is de best practice voor de database in een compose-project?", "ok": "Geen port mapping: enkel intern bereikbaar", "bad": ["Altijd 3306:3306 mappen voor de webapplicatie", "De database als bind mount op de host draaien", "De database in dezelfde service als de webapp zetten"], "why": "Een port mapping voor de database mag tijdens ontwikkeling, maar is in productie een beveiligingsrisico. De webapp (bv. adminer) heeft wel een port mapping nodig."}, {"id": "os044", "ch": "3", "q": "Wat doet depends_on in een docker-compose.yml?", "ok": "Een afhankelijkheid tussen services aangeven", "bad": ["Een volume aan een service koppelen", "Een environment variable doorgeven", "Een poort van de service naar de host mappen"], "why": "Andere sleutels: image, ports, volumes, environment."}, {"id": "os045", "ch": "3", "q": "Hoe volg je live de logs van alle services in een compose-project?", "ok": "docker compose logs -f", "bad": ["docker compose ps -a", "docker logs --all", "tail -f docker-compose.yml"], "why": "-f of --follow, vergelijkbaar met tail -f. Je kan ook één of meer services opgeven: docker compose logs wordpress database."}, {"id": "os046", "ch": "4", "q": "Welke drie doelen heeft persistente opslag?", "ok": "Data bewaren na afsluiten, veel opslaan en delen tussen processen", "bad": ["Sneller rekenen, minder stroom verbruiken en de CPU ontlasten", "Processen afschermen, virtueel geheugen maken en cachen", "Bestanden versleutelen, comprimeren en automatisch back-uppen"], "why": "RAM is vluchtig, beperkt, en processen zijn van elkaar afgeschermd."}, {"id": "os047", "ch": "4", "q": "Welke uitspraak over HDD en SSD klopt?", "ok": "Een HDD heeft een seek time en is goedkoop per GB; een SSD heeft geen bewegende delen en is duurder per GB.", "bad": ["Een SSD heeft een seek time en is goedkoop per GB; een HDD heeft geen bewegende delen en is duurder per GB.", "Een HDD heeft geen bewegende delen en is duurder per GB; een SSD heeft een seek time en is goedkoop per GB.", "Een SSD heeft een seek time en is duurder per GB; een HDD heeft geen bewegende delen en is goedkoop per GB."], "why": "Een HDD is magnetisch met draaiende schijven. Een SSD werkt met IC's, sneller en robuuster. Een USB-stick werkt ook met IC's."}, {"id": "os048", "ch": "4", "q": "Wat betekent everything is a file in UNIX?", "ok": "Ook mappen, apparaten, sockets en pipes zijn bestanden.", "bad": ["Elk programma bewaart al zijn data in één enkel bestand.", "Er bestaan geen mappen, enkel bestanden met lange namen.", "Elk bestand in het systeem is ook uitvoerbaar."], "why": "Soorten: gewone bestanden, directories, links, block/character special files (bv. /dev/null), sockets en pipes (FIFO)."}, {"id": "os049", "ch": "4", "q": "Welke suffix toont ls -F achter een uitvoerbaar bestand en achter een link?", "ok": "* voor uitvoerbaar, @ voor een link", "bad": ["@ voor uitvoerbaar, * voor een link", "* voor uitvoerbaar, = voor een link", "/ voor uitvoerbaar, @ voor een link"], "why": "/ = map, * = uitvoerbaar, @ = link, = = socket, | = named pipe."}, {"id": "os050", "ch": "4", "q": "Welk type bestand is /dev/null?", "ok": "Een special file", "bad": ["Een named pipe", "Een socket", "Een symbolische link"], "why": "Special files geven toegang tot hardware. Sockets: netwerkcommunicatie. Pipes: output van het ene proces naar input van het andere."}, {"id": "os051", "ch": "4", "q": "Wat is random access bij een bestand?", "ok": "Bytes in willekeurige volgorde kunnen lezen", "bad": ["Bytes enkel in volgorde kunnen lezen", "Het bestand op een willekeurige plaats op de schijf zetten", "Een willekeurige naam aan het bestand geven"], "why": "Sequentieel: bytes moeten in volgorde gelezen worden."}, {"id": "os052", "ch": "4", "q": "Welke drie stations-letters zijn in Windows gereserveerd volgens de cursus?", "ok": "A, B en F", "bad": ["A, B en C", "C, D en E", "X, Y en Z"], "why": "C is meestal de systeemschijf. Opstartbestanden staan op een aparte bootpartitie zonder schijfletter."}, {"id": "os053", "ch": "4", "q": "Welke Linux-map bevat configuratiebestanden, en welke variabele bestanden zoals logs?", "ok": "/etc en /var", "bad": ["/var en /etc", "/opt en /boot", "/usr en /dev"], "why": "/home: gebruikers. /dev: apparaten. /mnt of /media: I/O-apparaten. /boot: opstartbestanden. /(s)bin, /usr/(s)bin, /opt: uitvoerbare bestanden."}, {"id": "os054", "ch": "4", "q": "Wat is speciaal aan programma's in sbin?", "ok": "Ze vereisen systeemprivileges.", "bad": ["Ze zijn enkel scripts, geen binaries.", "Ze worden bij het opstarten automatisch uitgevoerd.", "Ze zijn van de gebruiker zelf geïnstalleerd."], "why": "Eigen gebruikersapplicaties zet je in je home directory, niet in /usr/bin, om conflicten met pakketten te vermijden."}, {"id": "os055", "ch": "4", "q": "Welke implementatiemethode van files is eenvoudig en snel, maar leidt tot fragmentatie bij groeiende bestanden?", "ok": "Contiguous storage", "bad": ["Linked lists", "File allocation table (FAT)", "Index nodes (inodes)"], "why": "Geschikt voor read-only of write-once media zoals CD/DVD."}, {"id": "os056", "ch": "4", "q": "Welke combinatie beschrijft linked lists als implementatiemethode?", "ok": "Geen fragmentatie, maar slechte leessnelheid en geen random access", "bad": ["Geen fragmentatie, en goede leessnelheid met random access", "Fragmentatie, maar goede leessnelheid met random access", "Fragmentatie, en slechte leessnelheid zonder random access"], "why": "Elk blok verwijst naar het volgende, overal op het medium."}, {"id": "os057", "ch": "4", "q": "Wat is het nadeel van een FAT (file allocation table)?", "ok": "De tabel kan veel RAM innemen.", "bad": ["Er is geen random access mogelijk.", "Bestanden moeten aaneensluitend staan.", "Het werkt enkel op SSD's en niet op HDD's."], "why": "1 TB met blokken van 4 KB = 250 miljoen blokken. Met 32-bit verwijzingen: 1 GB. Bij inodes moeten enkel de inodes van geopende bestanden in RAM."}, {"id": "os058", "ch": "4", "q": "Waarom zijn inodes efficiënter in RAM-gebruik dan een FAT?", "ok": "Enkel de inodes van geopende bestanden moeten in RAM.", "bad": ["Inodes worden nooit in RAM geladen.", "Een inode bevat de volledige data van het bestand.", "Inodes gebruiken geen verwijzingen naar datablokken."], "why": "Een inode bevat metadata en verwijzingen naar de datablokken. Goede leessnelheid en random access."}, {"id": "os059", "ch": "4", "q": "Welke uitspraak over hard links en soft links klopt volgens H4?", "ok": "Een hard link werkt enkel binnen hetzelfde file system; een soft link kan een dangling pointer worden.", "bad": ["Een soft link werkt enkel binnen hetzelfde file system; een hard link kan een dangling pointer worden.", "Een hard link heeft een eigen inode; een soft link deelt de inode van het origineel.", "Beide werken tussen file systems en verwijzen altijd naar een geldig bestand."], "why": "Hard link: meerdere entries delen dezelfde inode. Soft link: eigen inode met een verwijzing; werkt tussen file systems, maar breekt als het doel verdwijnt."}, {"id": "os060", "ch": "4", "q": "In welke volgorde werkt een journal?", "ok": "Loggen, uitvoeren, voltooid markeren", "bad": ["Uitvoeren, loggen, voltooid markeren", "Voltooid markeren, loggen, uitvoeren", "Uitvoeren, voltooid markeren, loggen"], "why": "Na een crash kan het file system onvoltooide bewerkingen detecteren en herstellen. Een file verwijderen raakt drie dingen: directory entry, inode en datablokken."}, {"id": "os061", "ch": "4", "q": "Wat doet het virtual file system (VFS) op Linux en macOS?", "ok": "Alle file systems samenbrengen in één hiërarchie", "bad": ["Elk file system een eigen schijfletter geven", "Een virtuele schijf aanmaken voor een VM", "Bestanden comprimeren voor ze opgeslagen worden"], "why": "Windows geeft elk file system een drive letter. Mount: een file system op een map inladen. Unmount: loskoppelen."}, {"id": "os062", "ch": "4", "q": "Welke beperkingen heeft MBR?", "ok": "Maximaal 2 TB en 4 primaire partities", "bad": ["Maximaal 2 TB en 128 primaire partities", "Maximaal 4 TB en 4 primaire partities", "Maximaal 4 TB en 128 primaire partities"], "why": "Workaround: een extended partitie met logische partities, maar dat maakt beheer complex. MBR bestaat sinds 1983 (DOS 2.0)."}, {"id": "os063", "ch": "4", "q": "Welke uitspraak over GPT klopt?", "ok": "Ondersteunt meer dan 2 TB, hoort bij UEFI en geeft elke partitie een GUID.", "bad": ["Ondersteunt maximaal 2 TB en 4 primaire partities, net zoals MBR.", "Is ouder dan MBR en heeft een extended partitie nodig.", "Kan geen enkele schijf met een MBR-partitietabel lezen."], "why": "Theoretisch onbeperkt aantal partities, in Windows maximaal 128. De boot loader staat op een EFI System Partition. Achterwaarts compatibel met MBR."}, {"id": "os064", "ch": "4", "q": "Wat is de juiste volgorde van de stappen van een bootloader?", "ok": "Bestanden uitpakken, kernel laden, root file system laden, controle aan de kernel", "bad": ["Kernel laden, bestanden uitpakken, controle aan de kernel, root file system laden", "Root file system laden, kernel laden, bestanden uitpakken, controle aan de kernel", "Controle aan de kernel, kernel laden, root file system laden, bestanden uitpakken"], "why": "De bootpartitie is klein (bv. 128 MB voor Windows). De bootvolgorde stel je in via BIOS/UEFI."}, {"id": "os065", "ch": "4", "q": "Waarom mag je een computer niet uitschakelen tijdens een kernelupdate?", "ok": "De nieuwe bootbestanden kunnen beschadigd raken.", "bad": ["De update wordt dan automatisch dubbel geïnstalleerd.", "De partitietabel wordt omgezet van GPT naar MBR.", "De swappartitie wordt daarbij volledig gewist."], "why": "Een kernelupdate genereert nieuwe bootbestanden."}, {"id": "os066", "ch": "4", "q": "Je wil Windows en Linux in multi-boot. Wat raadt de cursus aan?", "ok": "Eerst Windows, dan Linux; GRUB kan dan doorverwijzen (chain loading).", "bad": ["Eerst Linux, dan Windows; Windows Boot Manager toont dan een menu.", "Beide tegelijk installeren vanaf één USB-stick.", "Eerst Windows, dan Linux; daarna GRUB verwijderen."], "why": "Een nieuwe installatie overschrijft vaak de bootloader. Windows heeft zelf geen boot menu, GRUB wel."}, {"id": "os067", "ch": "4", "q": "Welke bootloaders horen bij Linux volgens de cursus?", "ok": "GRUB, LILO en rEFInd", "bad": ["BootX en Windows Boot Manager", "UEFI en BIOS", "NTFS-3G en WSL"], "why": "macOS: BootX. Windows: Windows Boot Manager."}, {"id": "os068", "ch": "4", "q": "Welk file system heeft een maximale bestandsgrootte van 4 GB?", "ok": "FAT32", "bad": ["exFAT", "NTFS", "ext4"], "why": "FAT32: 32-bit clusteradressering, max. 4 GB per bestand en 2 TB per file system. exFAT vervangt het op USB-sticks en SD-kaarten."}, {"id": "os069", "ch": "4", "q": "Welk file system gebruikt een FAT maar heeft geen journaling, en is bedoeld voor USB-sticks en SD-kaarten?", "ok": "exFAT", "bad": ["NTFS", "ext4", "APFS"], "why": "NTFS en ext4 hebben wel journaling. APFS is het standaard file system van macOS."}, {"id": "os070", "ch": "4", "q": "Welk file system is standaard op veel Linux-distributies, met journaling en achterwaarts compatibel met ext2 en ext3?", "ok": "ext4", "bad": ["Btrfs", "ZFS", "NTFS"], "why": "Btrfs (Oracle, antwoord op ZFS) is standaard op Fedora. ZFS (Sun, Solaris) heeft snapshots, klonen en integriteitscontrole, sterk tegen bitrot."}, {"id": "os071", "ch": "4", "q": "Welk file system is standaard op macOS sinds 2017, met focus op SSD's en encryptie?", "ok": "APFS", "bad": ["HFS+", "exFAT", "UDF"], "why": "HFS+ was de vorige standaard (met journaling) en wordt niet meer aanbevolen. ISO 9660 en UDF zijn voor optische schijven."}, {"id": "os072", "ch": "4", "q": "Hoe is de opslag van een Docker-container opgebouwd?", "ok": "Read-only image layers met één schrijfbare container layer erbovenop", "bad": ["Eén virtuele schijf (VDI of VMDK) met een eigen partitietabel", "Eén schrijfbare image layer onder read-only container layers", "Een aparte partitie op de host per container"], "why": "Het beheer gebeurt door een storage driver. Meerdere containers kunnen dezelfde image layers delen."}, {"id": "os073", "ch": "4", "q": "Een Dockerfile bevat FROM, COPY, RUN make, RUN rm en CMD. Hoeveel image layers levert dat op?", "ok": "4", "bad": ["5", "3", "2"], "why": "De eerste vier instructies maken elk een layer. CMD wijzigt enkel de metadata."}, {"id": "os074", "ch": "4", "q": "Wat gebeurt er met de data in de container layer als je de container verwijdert?", "ok": "Die verdwijnt; de image layers blijven bestaan.", "bad": ["Die blijft bewaard in de image.", "Die wordt automatisch naar een volume gekopieerd.", "Die blijft bestaan tot je de image verwijdert."], "why": "Voor persistente data: volumes (delen tussen containers) of bind mounts (ook vanaf de host toegankelijk). Pas de layers nooit manueel aan op de host."}, {"id": "os075", "ch": "5", "q": "Wat is compileren?", "ok": "Broncode omzetten naar instructies uit de ISA van de CPU", "bad": ["Een binary in het RAM laden zodat het een proces wordt", "Bytecode stap voor stap interpreteren tijdens de uitvoering", "Een proces kopiëren met een nieuw PID via fork()"], "why": "Elk CPU-type heeft een eigen ISA, bv. x86, x86-64, ARM, MIPS, 8051. Daarom moeten C, C++ en Rust per instructieset opnieuw gecompileerd worden."}, {"id": "os076", "ch": "5", "q": "Wat bevatten de registers PC, IR en AC in de instructiecyclus?", "ok": "PC: adres van de volgende instructie; IR: de uit te voeren instructie; AC: tussenresultaten", "bad": ["PC: de uit te voeren instructie; IR: adres van de volgende instructie; AC: tussenresultaten", "PC: tussenresultaten; IR: de uit te voeren instructie; AC: adres van de volgende instructie", "PC: adres van de volgende instructie; IR: tussenresultaten; AC: de uit te voeren instructie"], "why": "PC = Program Counter, IR = Instruction Register, AC = Accumulator."}, {"id": "os077", "ch": "5", "q": "Wat gebeurt er tijdens de fetch-stap?", "ok": "Instructie op adres PC naar het IR, en PC + 1", "bad": ["De instructie in het IR analyseren en uitvoeren", "Het resultaat uit de AC naar het geheugen schrijven", "De huidige toestand opslaan voor een context switch"], "why": "Execute: de instructie in het IR analyseren en uitvoeren. Na de execute-stap komt een extra interrupt-stap."}, {"id": "os078", "ch": "5", "q": "Wat gebeurt er bij een interrupt?", "ok": "Toestand opslaan, interrupt handler uitvoeren, toestand herstellen", "bad": ["Het programma beëindigen en uit het RAM verwijderen", "De huidige instructie overslaan en gewoon verdergaan", "Het proces meteen naar de toestand Exit sturen"], "why": "Oorzaken: nieuw apparaat, gebruikersactie, fout, timer. Het wisselen van programma heet een context switch."}, {"id": "os079", "ch": "5", "q": "Welk binair formaat hoort bij Linux?", "ok": "ELF", "bad": ["PE", "Mach-O", "JAR"], "why": "Windows: PE (Portable Executable, vaak .exe). Mac: Mach-O. Programma's zijn niet zomaar overdraagbaar; uitzonderingen zoals WINE en Proton werken niet altijd."}, {"id": "os080", "ch": "5", "q": "Wat is het verschil tussen een binary en een proces?", "ok": "Een binary is een passief bestand op schijf; een proces is een actieve instantie in het RAM.", "bad": ["Een proces is een passief bestand op schijf; een binary is een actieve instantie in het RAM.", "Een binary bevat enkel data; een proces bevat enkel instructies.", "Er is geen verschil: elk bestand op schijf is een proces."], "why": "Twee keer hello.exe starten geeft twee processen, maar één bestand op schijf."}, {"id": "os081", "ch": "5", "q": "Welk deel van de process image bevat functieparameters en returnadressen, en wat geeft te diepe recursie?", "ok": "De stack, en een stackoverflow", "bad": ["De heap, en een memory leak", "De stack, en een memory leak", "De heap, en een stackoverflow"], "why": "Heap: dynamisch gealloceerd geheugen tot de programmeur het opkuist. Data: globale variabelen. Text: de instructies."}, {"id": "os082", "ch": "5", "q": "Wat bevat het text-deel van de process image?", "ok": "De uit te voeren instructies", "bad": ["Globale variabelen", "Dynamisch gealloceerd geheugen", "Functieparameters en returnadressen"], "why": "Volgorde in de cursus: stack, heap, data, text. De exacte vorm hangt af van het OS."}, {"id": "os083", "ch": "5", "q": "Wat is een Process Control Block (PCB)?", "ok": "Een element in de process table met de info over één proces", "bad": ["Het deel van het RAM dat een proces mag aanspreken", "Het bestand op schijf waaruit een proces gestart wordt", "Een interrupt die een lopend proces blokkeert"], "why": "Het RAM-deel dat een proces mag aanspreken, heet de address space."}, {"id": "os084", "ch": "5", "q": "Welk type proces wacht continu op de achtergrond, start meestal bij het opstarten en wordt ook service genoemd?", "ok": "Een daemon", "bad": ["Een foreground process", "Een batchproces", "Een zombieproces"], "why": "Voorbeelden: OneDrive-synchronisatie, MySQL. Batchprocessen staan in een FIFO-wachtrij, bv. een nachtelijke back-up."}, {"id": "os085", "ch": "5", "q": "Wat is het verschil tussen een foreground en een background process?", "ok": "Een foreground process blokkeert de terminal zolang het loopt; een background process enkel bij de start.", "bad": ["Een background process blokkeert de terminal zolang het loopt; een foreground process enkel bij de start.", "Een foreground process start bij het opstarten; een background process start enkel op vraag.", "Er is geen verschil, enkel de prioriteit is anders."], "why": "Beide zijn interactieve processen, gestart vanuit een terminalsessie."}, {"id": "os086", "ch": "5", "q": "Welk proces heeft PID 1 op een recent Linux-systeem?", "ok": "systemd", "bad": ["bash", "init.d", "sshd"], "why": "Op oudere systemen: init. Het is de moeder van alle processen; de andere ontstaan als kinderen, waardoor een boom ontstaat."}, {"id": "os087", "ch": "5", "q": "Wat doen fork() en exec()?", "ok": "fork() maakt een exacte kopie met een nieuw PID; exec() overschrijft het kind met het gewenste programma.", "bad": ["exec() maakt een exacte kopie met een nieuw PID; fork() overschrijft het kind met het gewenste programma.", "fork() beëindigt het ouderproces; exec() start een daemon.", "fork() en exec() maken allebei een nieuw proces zonder ouder."], "why": "Het PPID van het kind is het PID van de ouder. Patroon: fork-exec-wait."}, {"id": "os088", "ch": "5", "q": "Wat betekent exit code 0?", "ok": "Het proces is correct afgesloten.", "bad": ["Het proces is gecrasht.", "Het proces wacht nog op I/O.", "Het proces werd met kill beëindigd."], "why": "Een andere code is een foutcode. De ouder leest de exit code via wait."}, {"id": "os089", "ch": "5", "q": "Wat is een zombieproces?", "ok": "Een afgesloten kind waarvan enkel de PCB nog bestaat", "bad": ["Een kind waarvan de ouder al gestopt is en dat nog volop draait", "Een proces dat naar de schijf of SSD geswapped is", "Een proces dat nooit CPU-tijd krijgt van de scheduler"], "why": "Orphan process: een zombie waarvan de exit code nooit gelezen wordt, bv. omdat de ouder eerst stopte. Het vervuilt de process table."}, {"id": "os090", "ch": "5", "q": "Wat gebeurt er als een ouderproces nooit wacht op zijn kind en er geen ander mechanisme is?", "ok": "Een resource leak: PCB en resources blijven bezet.", "bad": ["Het kind wordt automatisch de nieuwe ouder.", "Het besturingssysteem herstart het kind meteen.", "Het kind krijgt automatisch PID 1 toegewezen."], "why": "Daarom hoort een ouder te wachten (waitpid). Anders kan het systeem zelfs verhongeren (starvation)."}, {"id": "os091", "ch": "5", "q": "Welke vijf toestanden heeft het procesmodel met 5 statussen?", "ok": "New, Ready, Running, Blocked, Exit", "bad": ["New, Ready, Running, Suspend, Exit", "Ready, Running, Blocked, Zombie, Orphan", "Running, Not Running, Blocked, Suspend, Exit"], "why": "Het 2-statusmodel heeft Running en Not Running. Het 6-statusmodel voegt Suspend toe, het 7-statusmodel splitst dat in Ready/Suspend en Blocked/Suspend."}, {"id": "os092", "ch": "5", "q": "Welke overgang heet preemption?", "ok": "Running naar Ready, omdat het quantum op is", "bad": ["Running naar Blocked, omdat het proces op I/O wacht", "Blocked naar Ready, omdat het wachten voorbij is", "Ready naar Running, omdat het proces eerst in de wachtrij staat"], "why": "Quantum = time slice. Na Blocked gaat een proces achteraan de wachtrij."}, {"id": "os093", "ch": "5", "q": "Een proces moet wachten op data van de schijf. Naar welke toestand gaat het?", "ok": "Blocked", "bad": ["Ready", "Suspend", "Exit"], "why": "Blocked: wacht op iets zoals I/O. Ready: wacht enkel op de CPU."}, {"id": "os094", "ch": "5", "q": "Wat is swapping?", "ok": "Wachtende processen naar schijf schrijven als het RAM vol is", "bad": ["Snel wisselen tussen twee processen op de CPU", "Een proces kopiëren met fork() en exec()", "Een container verplaatsen naar een andere host"], "why": "Dat geeft de Suspend-toestand. Windows gebruikt pagefile.sys en swapfile.sys, Linux vaak een swappartitie. Zeer traag."}, {"id": "os095", "ch": "5", "q": "Uniprogramming: 15 tijdseenheden uitvoering en 10 tijdseenheden wachten op I/O. Wat is de CPU utilization?", "ok": "60%", "bad": ["40%", "66,7%", "150%"], "why": "CPU utilization = CPU usage time / total time = 15 / 25 = 60%. Voorbeeld uit de cursus; met multiprogramming werd het 15/16 = 93,75%."}, {"id": "os096", "ch": "5", "q": "Waarom is een CPU op 100% utilization niet ideaal?", "ok": "Er blijft geen marge over voor interrupts.", "bad": ["De CPU wordt dan uitgeschakeld.", "Er is dan geen multiprogramming meer mogelijk.", "Het RAM raakt dan vol."], "why": "Je streeft naar een hoge utilization en een lage idle time, maar onder 100%."}, {"id": "os097", "ch": "5", "q": "Wat is het verschil tussen multiprogramming en time sharing?", "ok": "Multiprogramming benut de CPU zo goed mogelijk; time sharing creëert de illusie van parallelle processen.", "bad": ["Time sharing benut de CPU zo goed mogelijk; multiprogramming creëert de illusie van parallelle processen.", "Multiprogramming vereist meerdere cores; time sharing werkt enkel op één core.", "Er is geen verschil, het zijn twee namen voor hetzelfde."], "why": "Multiprogramming kan ook op één core. Bij time sharing moet het quantum goed gekozen worden: te kort = te veel overhead, te lang = merkbaar."}, {"id": "os098", "ch": "5", "q": "Wat is starvation?", "ok": "Een proces krijgt nooit CPU-tijd.", "bad": ["Een proces houdt resources vast na het afsluiten.", "De CPU heeft niets te doen en staat idle.", "Het RAM is vol en processen worden geswapped."], "why": "Treedt op bij SPN en SRT voor lange processen."}, {"id": "os099", "ch": "5", "q": "Welke scheduling-algoritmes zijn preemptive?", "ok": "SRT en Round Robin", "bad": ["FCFS en SPN", "FCFS en Round Robin", "SPN en SRT"], "why": "Non-preemptive: FCFS en SPN, een proces wordt volledig afgewerkt."}, {"id": "os100", "ch": "5", "q": "Welk algoritme is eerlijk en heeft geen starvation, maar hangt sterk af van de keuze van Q?", "ok": "Round Robin", "bad": ["FCFS", "SPN", "SRT"], "why": "FCFS heeft ook geen starvation, maar korte processen moeten er soms lang wachten en een proces kan het systeem monopoliseren."}, {"id": "os101", "ch": "5", "q": "Welk algoritme kiest als volgende het proces met de kortste totale uitvoeringstijd, zonder een lopend proces te onderbreken?", "ok": "SPN", "bad": ["SRT", "FCFS", "Round Robin"], "why": "SRT kiest de kortste resterende tijd en onderbreekt wel als er een korter proces aankomt."}, {"id": "os102", "ch": "5", "q": "A komt op t=0 (5 eenheden), B op t=1 (3), C op t=2 (1). Wanneer is C klaar met SPN?", "ok": "Op t=6", "bad": ["Op t=3", "Op t=9", "Op t=7"], "why": "SPN onderbreekt A niet: A loopt van 0 tot 5. Dan kiest het het kortste in de wachtrij: C (5-6), daarna B (6-9). Met SRT zou C al op t=3 klaar zijn."}, {"id": "os103", "ch": "5", "q": "Zelfde opgave (A: t=0, 5 eenheden; B: t=1, 3; C: t=2, 1). In welke volgorde zijn de processen klaar met SRT?", "ok": "C, B, A", "bad": ["A, C, B", "A, B, C", "B, C, A"], "why": "t0 A; t1 B (3) is korter dan A (4 resterend) dus B; t2 C (1) is korter dan B (2 resterend) dus C tot t3; dan B tot t5; dan A tot t9."}, {"id": "os104", "ch": "5", "q": "Zelfde opgave met Round Robin, Q = 2. Een onderbroken proces gaat in de wachtrij vóór een proces dat op hetzelfde moment aankomt. Wat is de tijdlijn?", "ok": "AABBAACBA", "bad": ["AABBCAABA", "AACBBAABA", "AABBCCAAA"], "why": "t2: A onderbroken, wachtrij B, A, C. B 2-4 (nog 1), A 4-6 (nog 1), C 6-7 klaar, B 7-8 klaar, A 8-9 klaar."}, {"id": "os105", "ch": "5", "q": "Welk algoritme werkt het best bij korte processen volgens de overzichtstabel?", "ok": "SPN en SRT", "bad": ["FCFS en Round Robin", "Enkel FCFS", "Enkel Round Robin"], "why": "FCFS en Round Robin zijn het best bij lange processen."}];
const CH = {"all": "Alles", "2": "H2 · Virtualisatie & cloud", "3": "H3 · Docker", "4": "H4 · File systems", "5": "H5 · Processen", "review": "Te herhalen"};
const ORDER = ["all", "2", "3", "4", "5", "review"];
const KEYS = ['A','B','C','D'];
let chapter = 'all', size = 20, deck = [], idx = 0, answered = false, results = [];

function loadReview() { try { return JSON.parse(localStorage.getItem('os-qcm-review') || '[]'); } catch (e) { return []; } }
function saveReview(list) { try { localStorage.setItem('os-qcm-review', JSON.stringify(list)); } catch (e) {} }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const $ = id => document.getElementById(id);

function pool() {
  if (chapter === 'review') { const r = loadReview(); return QUESTIONS.filter(q => r.includes(q.id)); }
  return chapter === 'all' ? QUESTIONS.slice() : QUESTIONS.filter(q => q.ch === chapter);
}
function renderSetup() {
  $('total').textContent = QUESTIONS.length;
  const review = loadReview().length;
  $('chapters').innerHTML = '';
  ORDER.forEach(k => {
    const n = k === 'all' ? QUESTIONS.length : k === 'review' ? review : QUESTIONS.filter(q => q.ch === k).length;
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = CH[k] + ' (' + n + ')';
    b.setAttribute('aria-pressed', String(chapter === k)); b.disabled = n === 0;
    b.onclick = () => { chapter = k; renderSetup(); };
    $('chapters').appendChild(b);
  });
  $('sizes').innerHTML = '';
  [10, 20, 40, 'alle'].forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = s === 'alle' ? 'Alle' : s;
    b.setAttribute('aria-pressed', String(size === s));
    b.onclick = () => { size = s; renderSetup(); };
    $('sizes').appendChild(b);
  });
}
function start(list) {
  let qs = shuffle(list.slice());
  if (size !== 'alle') qs = qs.slice(0, size);
  // spread the correct answer evenly over A–D
  const pos = shuffle(qs.map((_, i) => i % 4));
  deck = qs.map((q, i) => {
    const opts = shuffle(q.bad.slice());
    opts.splice(pos[i], 0, q.ok);
    return { q, opts, correct: pos[i] };
  });
  idx = 0; results = [];
  $('setup').hidden = true; $('result').hidden = true; $('quiz').hidden = false;
  $('of').textContent = deck.length;
  render();
}
function render() {
  const d = deck[idx]; answered = false;
  $('num').textContent = idx + 1;
  $('nok').textContent = results.filter(r => r.ok).length;
  $('nbad').textContent = results.filter(r => !r.ok).length;
  $('fill').style.width = (idx / deck.length * 100) + '%';
  $('qlabel').textContent = CH[d.q.ch];
  $('qtext').textContent = d.q.q;
  $('why').hidden = true; $('next').hidden = true;
  $('opts').innerHTML = '';
  d.opts.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="key">' + KEYS[i] + '</span><span></span>';
    b.lastChild.textContent = t;
    b.onclick = () => choose(i);
    $('opts').appendChild(b);
  });
}
function choose(i) {
  if (answered) return; answered = true;
  const d = deck[idx], ok = i === d.correct;
  results.push({ q: d.q, ok });
  const r = loadReview().filter(x => x !== d.q.id);
  if (!ok) r.push(d.q.id);
  saveReview(r);
  [...$('opts').children].forEach((b, j) => {
    b.disabled = true;
    if (j === d.correct) b.classList.add('is-ok');
    else if (j === i) b.classList.add('is-bad');
    else b.classList.add('is-dim');
  });
  $('why').innerHTML = '<b>' + (ok ? 'Juist.' : 'Fout. Juist antwoord: ' + KEYS[d.correct] + '.') + '</b> ';
  $('why').appendChild(document.createTextNode(d.q.why));
  $('why').hidden = false;
  $('nok').textContent = results.filter(x => x.ok).length;
  $('nbad').textContent = results.filter(x => !x.ok).length;
  $('next').textContent = idx + 1 < deck.length ? 'Volgende →' : 'Resultaat →';
  $('next').hidden = false; $('next').focus();
}
function next() { if (!answered) return; if (idx + 1 < deck.length) { idx++; render(); } else finish(); }
function finish() {
  $('quiz').hidden = true; $('result').hidden = false;
  const ok = results.filter(r => r.ok).length;
  $('score').textContent = ok + ' / ' + results.length;
  $('per').innerHTML = '';
  ORDER.filter(k => k !== 'all' && k !== 'review').forEach(c => {
    const rs = results.filter(r => r.q.ch === c); if (!rs.length) return;
    const el = document.createElement('div');
    el.innerHTML = CH[c] + '<strong>' + rs.filter(r => r.ok).length + ' / ' + rs.length + '</strong>';
    $('per').appendChild(el);
  });
  const wrong = results.filter(r => !r.ok);
  $('retry').hidden = wrong.length === 0;
  $('wrong').innerHTML = '';
  wrong.forEach(r => {
    const el = document.createElement('div');
    const q = document.createElement('div'); q.textContent = r.q.q;
    const a = document.createElement('div'); a.className = 'a'; a.textContent = '→ ' + r.q.ok;
    el.append(q, a); $('wrong').appendChild(el);
  });
}
$('start').onclick = () => { const p = pool(); if (p.length) start(p); };
$('next').onclick = next;
$('stop').onclick = () => results.length ? finish() : backToSetup();
$('retry').onclick = () => { const s = size; size = 'alle'; start(results.filter(r => !r.ok).map(r => r.q)); size = s; };
$('again').onclick = backToSetup;
function backToSetup() { $('quiz').hidden = true; $('result').hidden = true; $('setup').hidden = false; renderSetup(); }
document.addEventListener('keydown', e => {
  if ($('quiz').hidden) return;
  const k = e.key.toUpperCase();
  const i = KEYS.indexOf(k) >= 0 ? KEYS.indexOf(k) : ['1','2','3','4'].indexOf(e.key);
  if (i >= 0 && !answered) { e.preventDefault(); choose(i); }
  else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); }
});
renderSetup();
</script>
