<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MML QCM</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--surface:#161921;--border:#252a35;--accent:#e8ff47;--accent2:#47c8ff;--text:#e8eaf0;--muted:#8a91a5;--card:#1a1f2e;--ok:#7bc84a;--okbg:rgba(58,110,26,.18);--ko:#e05c5c;--kobg:rgba(122,26,26,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
header{text-align:center;margin-bottom:18px}
h1{font-family:'Syne',sans-serif;font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-1px;color:var(--accent);text-transform:uppercase;line-height:1}
header p{color:var(--muted);font-size:.76rem;margin-top:6px;letter-spacing:1.5px;text-transform:uppercase}
.wrap{width:100%;max-width:760px}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.fb{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:6px 12px;font-family:inherit;font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;border-radius:2px}
.fb:hover,.fb.active{background:var(--accent);color:#000;border-color:var(--accent)}
.track{height:3px;background:var(--border);border-radius:2px;margin-bottom:8px}
.fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-bottom:18px;text-transform:uppercase;letter-spacing:1px}
.qbox{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:4px;padding:26px 28px;margin-bottom:16px}
.qlabel{font-size:.63rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:12px}
.qtext{font-size:.98rem;line-height:1.6}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.84rem;line-height:1.5;padding:13px 16px;border-radius:3px;cursor:pointer;margin-bottom:10px}
.opt:hover:not(:disabled){border-color:var(--accent2)}
.opt .l{color:var(--accent2);font-weight:600;min-width:1.2em}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:#3a6e1a}
.opt.wrong{background:var(--kobg);border-color:#7a1a1a}
.why{display:none;margin:-4px 0 10px 0;padding:10px 16px;font-size:.76rem;line-height:1.6;color:var(--muted);border-left:2px solid var(--border)}
.why.show{display:block}
.why.r{border-left-color:#3a6e1a}.why.k{border-left-color:#7a1a1a}
.why b{color:var(--text);font-weight:600}
.btn{padding:12px 26px;font-family:inherit;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:2px;cursor:pointer;border:none;border-radius:2px}
.bp{background:var(--accent);color:#000}.bp:hover{background:#fff}
.bs{background:transparent;border:1px solid var(--border);color:var(--muted)}.bs:hover{border-color:var(--text);color:var(--text)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
#res{display:none}
.big{font-family:'Syne',sans-serif;font-size:3rem;font-weight:800;color:var(--accent)}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:.78rem}
td,th{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left}
th{color:var(--muted);font-weight:400;text-transform:uppercase;letter-spacing:1px;font-size:.66rem}
</style>
</head>
<body>
<header><h1>MML QCM</h1><p>Mathematics for Machine Learning · <span id="n"></span> vragen</p></header>
<div class="wrap">
<div class="filter-bar" id="fbar"></div>
<div id="quiz">
<div class="track"><div class="fill" id="fill"></div></div>
<div class="meta"><span id="pos"></span><span id="score"></span></div>
<div class="qbox"><div class="qlabel" id="ql"></div><div class="qtext" id="qt"></div></div>
<div id="opts"></div>
<div class="row"><button class="btn bp" id="next" style="display:none" onclick="nextQ()">Volgende</button></div>
</div>
<div id="res">
<div class="big" id="rs"></div>
<p id="rp" style="color:var(--muted);font-size:.8rem"></p>
<table id="rt"></table>
<div class="row"><button class="btn bp" id="rw" onclick="retryWrong()">Foute vragen herhalen</button><button class="btn bs" onclick="startAll()">Opnieuw</button></div>
</div>
</div>
<script>
const DATA = [{"ch": "1", "q": "Wat is de loodrechte projectie van b = [3, 4, -1] op de rechte door a = [1, 0, 2]?", "o": ["[3/5, 4/5, -1/5]", "[14/5, 4, -7/5]", "[3/26, 2/13, -1/26]", "[1/5, 0, 2/5]"], "w": ["Een getal (a·b)/(a·a) hoort bij a te staan; de uitkomst ligt dan niet op de rechte door a.", "Dit is b − proj, het loodrechte deel, niet de projectie zelf.", "Je projecteerde a op b (rollen omgedraaid): de projectie ligt op de rechte door a, niet door b.", "proj = (a·b)/(a·a)·a = 1/5·a."], "a": 3}, {"ch": "2", "q": "Bereken A·B voor A = [1 2; 0 1] en B = [0 1; 2 3].", "o": ["[4 7; 2 3]", "[0 1; 2 7]", "[0 2; 0 3]", "[0 2; 1 7]"], "w": ["Rij i van A met kolom j van B.", "Je berekende B·A: het matrixproduct is niet commutatief.", "Dit is het elementgewijze product, geen matrixproduct.", "A^T·B^T is niet hetzelfde als A·B (en ook niet (AB)^T): de volgorde en het transponeren spelen mee."], "a": 0}, {"ch": "3", "q": "Wat is det(A) voor A = [2 1 1; 4 3 3; 8 7 9], met LU-decompositie zonder rijwisselingen (U = [2 1 1; 0 1 1; 0 0 2])?", "o": ["−4", "5", "54", "4"], "w": ["Het teken wijzigt enkel bij een oneven aantal rijwisselingen; hier zijn er geen.", "Je telde de diagonaal van U op (2+1+2) in plaats van te vermenigvuldigen.", "Je nam het product van de diagonaal van A (2·3·9) in plaats van die van U.", "det(A) = product van de diagonaal van U = 2·1·2."], "a": 3}, {"ch": "4", "q": "Q is een 3×2 matrix met QᵀQ = I₂. Welke uitspraak is juist?", "o": ["Q is een orthogonale matrix.", "Q⁻¹ = Qᵀ.", "De kolommen van Q zijn orthogonaal maar niet noodzakelijk genormaliseerd.", "De kolommen van Q zijn orthonormaal, maar QQᵀ is niet I₃."], "w": ["Een orthogonale matrix is vierkant; Q is 3×2.", "Q is niet vierkant, dus er is geen inverse.", "QᵀQ = I betekent ook dat de diagonaal (qᵢ·qᵢ) 1 is.", "QᵀQ = I geldt voor orthonormale kolommen; QQᵀ = I vraagt een vierkante Q."], "a": 3}, {"ch": "5", "q": "A is een 5×3 matrix. Wat zijn de afmetingen van U, Σ en V in de VOLLEDIGE SVD?", "o": ["U: 5×5, Σ: 5×3, V: 3×3", "U: 5×5, Σ: 5×5, V: 3×3", "U: 3×3, Σ: 5×3, V: 5×5", "U: 5×3, Σ: 3×3, V: 3×3"], "w": ["U en V zijn vierkant (orthogonaal), Σ heeft de vorm van A.", "Σ heeft dezelfde afmetingen als A, niet 5×5.", "U en V staan verkeerd; U hoort bij de rijen (5), V bij de kolommen (3).", "Dit zijn de afmetingen van de zuinige SVD."], "a": 0}, {"ch": "6", "q": "Wat is de afgeleide van f(x) = sin(3x²)?", "o": ["6x·cos(3x²)", "cos(6x)", "cos(3x²)", "−6x·cos(3x²)"], "w": ["Kettingregel: buitenste afleiden (cos), maal de afgeleide van het binnenste (6x).", "Je leidde het binnenste af in plaats van het te behouden.", "Je vergat de factor 6x van de binnenste functie.", "De afgeleide van sin is +cos; het minteken hoort bij cos → −sin."], "a": 0}, {"ch": "7", "q": "Wat is ∇f(1, 2) voor f(x,y) = x²y + 3xy² − y?", "o": ["[7, 15]", "[4, 1]", "[12, 16]", "[16, 12]"], "w": ["Je evalueerde in (2, 1) i.p.v. in (1, 2): x en y verwisseld bij het invullen.", "Je leidde enkel x²y af en negeerde de termen 3xy² en −y.", "Je verwisselde fₓ en f_y.", "fₓ = 2xy + 3y² = 16; f_y = x² + 6xy − 1 = 12."], "a": 3}, {"ch": "A", "q": "Wat geeft a.sum(axis=1, keepdims=True) voor a = np.array([[1,2,3],[4,5,6]])?", "o": ["[[6], [15]], shape (2, 1)", "[5, 7, 9], shape (3,)", "[6, 15], shape (2,)", "[[21]], shape (1, 1)"], "w": ["Som per rij; de dimensie blijft behouden.", "Dat is axis=0 (som per kolom).", "Zonder keepdims=True verdwijnt de dimensie: shape (2,) i.p.v. (2,1).", "21 is de som van alle elementen (zonder axis)."], "a": 0}, {"ch": "1", "q": "Wat is cos θ voor de ingesloten hoek tussen v = [1, 2, 2] en w = [2, -1, 2]?", "o": ["2/9", "2/3", "2/13", "4/9"], "w": ["Je deelde door ‖v‖² + ‖w‖² = 18 in plaats van ‖v‖·‖w‖.", "Je deelde door ‖v‖ + ‖w‖ = 6 in plaats van door het product.", "Je deelde door ‖v + w‖² = 26: de norm van de som is niet wat de formule vraagt.", "cos θ = (v·w)/(‖v‖·‖w‖) = 4/(3·3)."], "a": 3}, {"ch": "2", "q": "Wat is de inverse van C = [2 1; 5 3]?", "o": ["[3 1; 5 2]", "[2 -1; -5 3]", "[1/2 1; 1/5 1/3]", "[3 -1; -5 2]"], "w": ["Je wisselde de diagonaal om, maar vergat de tekens van b en c te veranderen.", "Je veranderde de tekens van b en c, maar wisselde de diagonaal a en d niet om.", "Je nam het omgekeerde van elk element apart; dat is geen inverse.", "1/det·[d −b; −c a] met det = 6 − 5 = 1."], "a": 3}, {"ch": "3", "q": "De punten (1,2), (2,3), (3,5) worden gefit met een rechte via θ = (XᵀX)⁻¹Xᵀy en X = [1, x]. Wat is θ?", "o": ["[1/3, 3/2]", "[3/2, 1/3]", "[10/3, 7/2]", "[2, 3]"], "w": ["θ = [intercept, helling]; y = 1/3 + 3/2·x.", "Je wisselde intercept en helling: de kolom van 1'en komt eerst in X, dus θ₁ is het intercept.", "Je nam Xᵀy=[10, 23] gedeeld door n=3 en 6: een afgeleide die niets met (XᵀX)⁻¹ te maken heeft.", "Dit is gewoon het eerste paar y-waarden; er werd niets gefit."], "a": 0}, {"ch": "4", "q": "Welke matrix beeldt het eenheidsvierkant af op een vorm met dezelfde lengtes en hoeken?", "o": ["[1 1; 0 1]", "[0 −1; 1 0]", "[1 0; 0 0]", "[2 0; 0 2]"], "w": ["Een scheeftrekking (shear): j wordt [1,1] met lengte √2 en hoeken veranderen.", "Rotatie over 90°: QᵀQ = I, dus orthogonaal.", "Een projectie op de x-as: het vierkant wordt een lijnstuk.", "Een uitrekking: alle lengtes verdubbelen; QᵀQ = 4I ≠ I."], "a": 1}, {"ch": "5", "q": "Een gecentreerde datamatrix X heeft singuliere waarden σ1 = 8,07 en σ2 = 1,34. Welk deel van de variabiliteit verklaart de eerste component (ongeveer)?", "o": ["97 %", "86 %", "50 %", "99 %"], "w": ["σ1²/(σ1² + σ2²) = 65,1/66,9.", "σ1/(σ1 + σ2) = 8,07/9,41: de singuliere waarden zelf, niet hun kwadraten.", "Je nam aan dat beide componenten evenveel bijdragen.", "σ1/√(σ1² + σ2²): je nam de wortel van de totale variabiliteit als noemer."], "a": 0}, {"ch": "6", "q": "Wat is de raaklijn aan f(x) = x³ − 2x in het punt x = 2?", "o": ["y = 4x − 4", "y = 10x + 4", "y = 10x − 16", "y = 10x − 4"], "w": ["Je nam f(2) = 4 als richtingscoëfficiënt.", "Je liet −10·2 weg: y = f(a) + f'(a)·x i.p.v. f(a) + f'(a)(x − a).", "f(2) = 4, f'(2) = 10 → y = 4 + 10(x − 2).", "Je nam y = f'(a)·x − f(a): het punt (a, f(a)) moet op de rechte liggen."], "a": 2}, {"ch": "7", "q": "Wat geldt voor de gradiënt ∇f in een punt op een contourplot?", "o": ["∇f ligt evenwijdig aan de niveaukromme en wijst langs die kromme.", "∇f staat loodrecht op de niveaukromme en wijst naar hogere waarden van f.", "∇f heeft altijd lengte 1 en wijst naar de oorsprong van het assenstelsel.", "∇f wijst altijd rechtstreeks naar het dichtstbijzijnde minimum."], "w": ["Langs de niveaukromme verandert f niet: de afgeleide in die richting is 0.", "Steilste stijging.", "De lengte van ∇f is de steilheid; de richting hangt van f af.", "Dat is niet gegarandeerd; het wijst enkel naar de steilste stijging (−∇f naar de steilste daling)."], "a": 1}, {"ch": "A", "q": "Wat is het resultaat van np.arange(3, 8)?", "o": ["array([3, 4, 5, 6, 7])", "array([3, 5, 7])", "array([4, 5, 6, 7])", "array([3, 4, 5, 6, 7, 8])"], "w": ["Het eindpunt is niet inbegrepen.", "De standaardstap is 1, niet 2.", "Het beginpunt is wél inbegrepen.", "Het eindpunt hoort er niet bij (dat is np.linspace gedrag)."], "a": 0}, {"ch": "1", "q": "Welke van deze vectoren behoort tot het omhulsel van a = [1, 0, 1] en b = [0, 1, 1]?", "o": ["[1, 4, 6]", "[3, 1, 3]", "[4, 2, 8]", "[2, 5, 7]"], "w": ["1 + 4 = 5 ≠ 6: de derde component past niet bij de eerste twee.", "Hier is de derde component gelijk aan de eerste; voor αa + βb moet ze de SOM van de eerste twee zijn (3 + 1 = 4).", "4 + 2 = 6 ≠ 8: de derde component past niet bij de eerste twee.", "Elke combinatie αa + βb heeft derde component α + β: 2 + 5 = 7."], "a": 3}, {"ch": "2", "q": "A en B zijn inverteerbare n×n matrices. Wat is (AB)⁻¹?", "o": ["A⁻¹ + B⁻¹", "B⁻¹A⁻¹", "(A + B)⁻¹", "A⁻¹B⁻¹"], "w": ["De inverse is niet lineair: (AB)⁻¹ is geen som van inversen.", "Bij inverteren (en transponeren) van een product wisselt de volgorde: (AB)(B⁻¹A⁻¹) = I.", "Een som en een product zijn verschillende bewerkingen.", "Zelfde volgorde als het product: werkt enkel als AB = BA, niet in het algemeen."], "a": 1}, {"ch": "3", "q": "Wanneer is Ax = b oplosbaar volgens je cursus?", "o": ["Als de rijen van A onderling lineair onafhankelijk zijn.", "Als b ∈ Col(A), een combinatie van de kolommen van A.", "Als A vierkant is, met evenveel vergelijkingen als onbekenden.", "Als de determinant van A gelijk is aan nul."], "w": ["Het gaat om b en de kolommen; onafhankelijke rijen alleen garanderen niets voor een specifieke b.", "Ax is precies een combinatie van de kolommen van A.", "Vierkant volstaat niet: bv. [1 1; 1 1]x = [1, 2] is strijdig.", "Dan is A niet inverteerbaar: er is hoogstens een oneindige of lege oplossingsverzameling."], "a": 1}, {"ch": "4", "q": "q1 = [1/√2, 1/√2, 0] en q2 = [−1/√2, 1/√2, 0] zijn een orthonormale basis van een vlak. Wat zijn de coördinaten van v = [3, 1, 0] t.o.v. die basis?", "o": ["[−√2, 2√2]", "[2√2, −√2]", "[3, 1]", "[4, −2]"], "w": ["Je verwisselde de volgorde: de eerste coördinaat hoort bij q1.", "coördinaat i = qi·v: 4/√2 en −2/√2.", "Dit zijn de coördinaten in de standaardbasis.", "Je liet de factor 1/√2 weg: qi heeft lengte 1, de vector [1,1,0] niet."], "a": 1}, {"ch": "5", "q": "Wat is de pseudoinverse Σ⁺ van Σ = [3 0; 0 2; 0 0]?", "o": ["[1/3 0; 0 1/2; 0 0]", "[1/3 0 0; 0 1/2 0]", "[3 0 0; 0 2 0]", "[1/9 0 0; 0 1/4 0]"], "w": ["Je nam de reciproke maar vergat de vorm te transponeren (Σ⁺ is 2×3).", "Neem 1/σ van de niet-nul singuliere waarden en transponeer de vorm.", "Je transponeerde zonder te inverteren.", "Je nam de reciproke van de kwadraten; Σ⁺ gebruikt 1/σ zelf."], "a": 1}, {"ch": "6", "q": "Newton-Raphson voor f(x) = x² − 2 met x₀ = 1. Wat is x₁?", "o": ["3/2", "2", "−1", "1/2"], "w": ["x₁ = 1 − (−1)/2.", "Je nam x₁ = x₀ − f(x₀) (zonder te delen door f').", "Je nam x₁ = f(x₀)/f'(x₀).", "Je rekende x₀ + f/f' = 1 + (−1)/2: het teken in de formule is een min."], "a": 0}, {"ch": "7", "q": "Gradient descent op f(x,y) = x² + 2y², start (2,1), α = 1/8. Wat is (x₂, y₂) na twee stappen?", "o": ["[3/2, 1/2]", "[1, 0]", "[9/8, 1/4]", "[25/8, 9/4]"], "w": ["Dit is (x₁, y₁) na één stap; je stopte te vroeg.", "Je herberekende de gradiënt niet in het nieuwe punt: ∇f(x₀) twee keer gebruikt.", "∇f = [2x, 4y]: eerst [3/2, 1/2], dan [9/8, 1/4].", "Je telde α·∇f op i.p.v. af te trekken (dat is gradient ascent)."], "a": 2}, {"ch": "A", "q": "Hoe genereer je volgens je cursus 3 getallen uit een standaardnormale verdeling?", "o": ["rng = np.random.default_rng(); rng.random(3)", "rng = np.random.default_rng(); rng.standard_normal(3)", "rng = np.random.default_rng(); rng.normal(3)", "rng = np.random.default_rng(); rng.rand(3)"], "w": ["rng.random geeft uniforme getallen in [0,1), geen normale verdeling.", "Moderne generator met standaardnormale getallen.", "Het eerste argument is het gemiddelde (loc = 3): je krijgt één getal rond 3.", "Een Generator heeft geen rand(): dat is de oude np.random.rand-stijl (en geeft uniforme getallen)."], "a": 1}, {"ch": "1", "q": "Welke verzameling is een lineaire deelruimte van ℝ³?", "o": ["V = {(x, y, z) : xy = 0}", "V = {(x, y, z) : x + y + z = 0}", "V = {(x, y, z) : x ≥ 0}", "V = {(x, y, z) : x + y + z = 1}"], "w": ["Niet gesloten onder optelling: (1,0,0) + (0,1,0) = (1,1,0) heeft xy = 1.", "Bevat de nulvector en is gesloten onder optelling en scalaire vermenigvuldiging: een vlak door de oorsprong.", "Niet gesloten onder scalaire vermenigvuldiging: (1,0,0) maal −1 valt buiten V.", "De nulvector zit er niet in (0 + 0 + 0 ≠ 1): een vlak dat niet door de oorsprong gaat."], "a": 1}, {"ch": "2", "q": "A is een 3×2 matrix en B is een 2×4 matrix. Welke uitspraak is correct?", "o": ["AB bestaat en is 2×2.", "AB en BA bestaan allebei, maar zijn verschillend.", "AB bestaat en is 3×4; BA bestaat niet.", "Geen van beide producten bestaat."], "w": ["Het product heeft het aantal rijen van A en kolommen van B (3×4), niet de binnenste dimensies.", "Alleen als de binnenste afmetingen overeenkomen. BA kan hier niet.", "(3×2)(2×4) → 3×4; (2×4)(3×2): 4 ≠ 3, niet gedefinieerd.", "De binnenste dimensies van AB zijn beide 2: dat bestaat wel."], "a": 2}, {"ch": "3", "q": "Na rijreductie van [A | b] krijg je een rij [0 0 0 | 5]. Wat betekent dit?", "o": ["A is niet inverteerbaar maar het stelsel is wel oplosbaar.", "Er is een vrije variabele, dus oneindig veel oplossingen.", "Er is een unieke oplossing met x₃ = 5.", "Het stelsel is strijdig: b ∉ Col(A), geen oplossing."], "w": ["Niet inverteerbaar kan, maar 0 = 5 maakt het stelsel onoplosbaar.", "Een vrije variabele komt van een kolom zonder pivot; deze rij is een tegenspraak.", "De rij bevat geen onbekenden meer; ze zegt 0 = 5.", "Die rij zegt 0 = 5."], "a": 3}, {"ch": "4", "q": "Gram-Schmidt met a1 = [1,1,0] en a2 = [3,0,1]. Wat is e2 (voor normalisatie)?", "o": ["[3/2, -3/2, 1]", "[0, -3, 1]", "[3/2, 3/2, 0]", "[2, -1, 1]"], "w": ["e2 = a2 − (e1·a2)/(e1·e1)·e1 = a2 − 1/2·a1.", "Je vergat te delen door e1·e1 = 2.", "Dit is de projectie van a2 op a1, niet het loodrechte deel e2.", "Je trok a1 volledig af in plaats van de projectie (1/2·a1)."], "a": 0}, {"ch": "5", "q": "A is 3×2 met onafhankelijke kolommen en b ∉ Col(A). Wat is de oplossing van het stelsel Ax = b in de zin van je cursus?", "o": ["Een unieke exacte oplossing x = A⁻¹b, want A is inverteerbaar.", "Oneindig veel exacte oplossingen, door vrije variabelen.", "Geen enkele oplossing, ook geen benaderende oplossing.", "Een unieke kleinste-kwadratenoplossing x = A⁺b = (AᵀA)⁻¹Aᵀb."], "w": ["A is niet vierkant en b ∉ Col(A): A⁻¹ bestaat niet en er is geen exacte oplossing.", "Onafhankelijke kolommen betekenen N(A) = {0}, en b ∉ Col(A) sluit exacte oplossingen uit.", "Er is geen exacte oplossing, maar wel een beste benadering.", "Geval 3: b ∉ Col(A), N(A) = {0}."], "a": 3}, {"ch": "6", "q": "Vereenvoudig ln(6) − ln(2) + 2·ln(3).", "o": ["ln 9", "ln 18", "ln 36", "ln 27"], "w": ["Je zag 2·ln 3 = ln 9, maar vergat ln 6 − ln 2 = ln 3 erbij op te tellen.", "Je schreef 2·ln 3 als ln(2·3) = ln 6; de factor 2 wordt een exponent: ln(3²).", "Je nam ln(6 − 2) = ln 4 (verschil van de argumenten) en 4·9 = 36; ln a − ln b = ln(a/b).", "ln(6/2) + ln 9 = ln 3 + ln 9."], "a": 3}, {"ch": "7", "q": "Bij gradient descent voor f(x) = x² met x₀ = 1 neem je α = 1. Wat gebeurt er?", "o": ["De iteraties springen eeuwig tussen 1 en −1.", "Het algoritme stopt na één stap in het minimum.", "Het algoritme convergeert naar 0.", "Het algoritme divergeert naar oneindig."], "w": ["xₙ₊₁ = (1 − 2α)xₙ = −xₙ.", "Dat gebeurt bij α = 1/2.", "Dat gebeurt enkel als |1 − 2α| < 1.", "Dat zou bij |1 − 2α| > 1 zijn; hier is het exact −1."], "a": 0}, {"ch": "A", "q": "Wat is de shape van a + c, met a van shape (2,3) en c = np.array([[1],[2]]) van shape (2,1)?", "o": ["(3, 2)", "Fout: de shapes zijn onverenigbaar.", "(2, 3)", "(2, 1)"], "w": ["De vorm wisselt niet door broadcasting.", "Dimensies zijn compatibel als ze gelijk of 1 zijn; hier 3 vs 1 mag.", "Broadcasting rekt de kolom uit over 3 kolommen.", "Het resultaat heeft de grootste compatibele vorm, niet die van c."], "a": 2}, {"ch": "1", "q": "De vectoren a, b, c ∈ ℝ² zijn gegeven. Wat kan je altijd besluiten?", "o": ["Minstens twee van de drie zijn veelvouden van elkaar.", "a, b, c zijn lineair afhankelijk.", "Het omhulsel van a, b, c is ℝ² precies als ze onafhankelijk zijn.", "a, b, c vormen een basis van ℝ²."], "w": ["Afhankelijk betekent niet dat twee ervan evenwijdig zijn: bv. [1,0], [0,1], [1,1].", "Meer vectoren (3) dan dimensies (2): altijd afhankelijk.", "Drie vectoren in ℝ² kunnen nooit onafhankelijk zijn; de uitspraak spreekt zichzelf tegen.", "Een basis van ℝ² heeft precies 2 vectoren."], "a": 1}, {"ch": "2", "q": "Een matrix P is de projectiematrix op de kolomruimte van A. Welke eigenschappen heeft P altijd?", "o": ["P^T = −P en P² = P", "P⁻¹ = P^T", "P^T P = I en P² = I", "P^T = P en P² = P"], "w": ["P is symmetrisch, niet anti-symmetrisch.", "P is niet inverteerbaar zodra de deelruimte kleiner is dan de hele ruimte.", "Dat zijn de eigenschappen van een orthogonale matrix/spiegeling; P projecteert en heeft gewoonlijk geen inverse.", "Symmetrisch en idempotent: nog eens projecteren verandert niets."], "a": 3}, {"ch": "3", "q": "Los op: x + 2y + z = 2, 3x + 8y + z = 12, 4y + z = 2.", "o": ["(x,y,z) = (−2, 2, 1)", "(x,y,z) = (2, 1, −2)", "(x,y,z) = (1, 2, −2)", "(x,y,z) = (2, −1, 2)"], "w": ["Dit is een gespiegelde volgorde; vergelijking 1 geeft −2 + 4 + 1 = 3 ≠ 2.", "Gauss: z = −2, dan y = 1, dan x = 2.", "x en y verwisseld: vergelijking 1 geeft 1 + 4 − 2 = 3 ≠ 2.", "Je verwisselde de tekens bij achterwaartse substitutie; controleer in vergelijking 3: 4(−1) + 2 = −2 ≠ 2."], "a": 1}, {"ch": "4", "q": "A = QR met Q ∈ ℝ^(3×2) orthonormale kolommen en R bovendriehoeks. Hoe bepaal je de kleinste-kwadratenoplossing van Ax = b?", "o": ["Los Rx = Qᵀb op door achterwaartse substitutie.", "Los Rx = b op door achterwaartse substitutie.", "Bereken x = RQᵀb.", "Bereken x = Q⁻¹Rb."], "w": ["QᵀQ = I maakt het stelsel RᵀRx = RᵀQᵀb → Rx = Qᵀb.", "Q mag niet verdwijnen: je moet b eerst met Qᵀ vermenigvuldigen.", "De volgorde en het oplossen ontbreken: x volgt uit Rx = Qᵀb, niet uit een product met R.", "Q is niet vierkant, dus Q⁻¹ bestaat niet."], "a": 0}, {"ch": "5", "q": "Bij Ax = b heeft A afhankelijke kolommen en geldt b ∈ Col(A). Welke oplossing kiest de pseudoinverse?", "o": ["De unieke oplossing x = (AᵀA)⁻¹Aᵀb, die altijd bestaat.", "Van de oneindig veel oplossingen degene met kleinste norm: x = A⁺b.", "Geen oplossing, want afhankelijke kolommen maken het stelsel strijdig.", "Een kleinste-kwadratenbenadering, want er is geen exacte oplossing."], "w": ["AᵀA is niet inverteerbaar bij afhankelijke kolommen.", "Geval 2: x = A⁺b.", "b ∈ Col(A) betekent niet strijdig.", "b zit in Col(A): er is wel een exacte oplossing."], "a": 1}, {"ch": "6", "q": "σ(x) = 1/(1 + e^(−x)). Wat is σ'(0)?", "o": ["1/2", "1/4", "−1/4", "0"], "w": ["Dit is σ(0), niet σ'(0).", "σ' = σ(1 − σ) en σ(0) = 1/2.", "Je vergat dat de binnenste afgeleide van −x ook −1 is: de twee tekens heffen elkaar op.", "Je dacht dat de grafiek in 0 vlak is; σ is overal stijgend, dus σ' > 0."], "a": 1}, {"ch": "7", "q": "Voor f = (xy + z)² in (x,y,z) = (2,3,1): wat zijn de partiële afgeleiden volgens reverse-mode autodiff?", "o": ["[42, 28, 14]", "[14, 14, 14]", "[84, 56, 28]", "[28, 42, 14]"], "w": ["∂f/∂b = 2b = 14; ∂f/∂x = 14·y = 42; ∂f/∂y = 14·x = 28; ∂f/∂z = 14.", "Je vergat de lokale afgeleiden y en x van het product xy te vermenigvuldigen.", "Je nam de factor ∂f/∂b = 2b = 14 twee keer mee in de achterwaartse pas.", "Je vermenigvuldigde ∂f/∂a met x i.p.v. y (en omgekeerd)."], "a": 0}, {"ch": "A", "q": "Je wil nagaan of Q (numpy) orthogonaal is. Wat gebruik je?", "o": ["(Q.T @ Q == np.eye(n)).all()", "np.allclose(Q.T * Q, np.eye(n))", "np.allclose(Q.T @ Q, np.eye(n))", "np.allclose(Q @ Q, np.eye(n))"], "w": ["Door afrondingsfouten faalt een exacte vergelijking vaak.", "* is elementgewijs, geen matrixproduct.", "Floats vergelijk je met een tolerantie.", "Dat test Q² = I (een spiegeling), niet QᵀQ = I."], "a": 2}, {"ch": "1", "q": "Wat zijn de coördinaten van v = [5, −1] ten opzichte van de basis {[1, 1], [1, −1]}?", "o": ["[3, 2]", "[4, −6]", "[2, 3]", "[5, −1]"], "w": ["Je verwisselde de volgorde: de eerste coördinaat hoort bij b1.", "Je nam v·b1 = 4 en v·b2 = 6 (inproducten): dat werkt enkel bij een ORTHONORMALE basis; deze basis is niet genormaliseerd.", "2·[1,1] + 3·[1,−1] = [5, −1].", "Dit zijn de coördinaten t.o.v. de standaardbasis, niet t.o.v. de gegeven basis."], "a": 2}, {"ch": "2", "q": "Wat is de rang van M = [1 2 3; 2 4 6; 1 0 1]?", "o": ["0", "1", "2", "3"], "w": ["De rang is 0 enkel voor de nulmatrix.", "Je zag dat rij 2 afhangt van rij 1, maar rij 3 is wel onafhankelijk van rij 1.", "Rij 2 = 2·rij 1: slechts 2 onafhankelijke rijen.", "Je telde het aantal rijen; de rang is het aantal ONAFHANKELIJKE rijen."], "a": 2}, {"ch": "3", "q": "Los op met Gaussische eliminatie: 3x + y − 2z = 11, x − 2y − 2z = 3, − 2x − y + z = -7.", "o": ["[0, 1, -5]", "[-1, -2, 3]", "[-3, 2, 1]", "[1, 2, -3]"], "w": ["Je loste het getransponeerde stelsel Aᵀx = b op.", "Tekenfout in alle stappen.", "Je draaide de volgorde bij achterwaartse substitutie om.", "Eliminatie + achterwaartse substitutie."], "a": 3}, {"ch": "4", "q": "Welk stel vectoren is orthonormaal?", "o": ["{[2/7, 3/7, 6/7], [3/7, -6/7, 2/7]}", "{[2/7, 3/7, 6/7], [3/7, -6/7, 3/7]}", "{[2/7, 3/7, 6/7], [3/7, 6/7, 2/7]}", "{[2, 3, 6], [3, -6, 2]}"], "w": ["qi·qj = 0 en ‖qi‖ = 1.", "Noch orthogonaal, noch genormaliseerd.", "Beide hebben lengte 1 maar hun inwendig product is niet 0.", "Wel orthogonaal, maar de lengtes zijn 7, niet 1."], "a": 0}, {"ch": "5", "q": "Wat is de beste rang-1 benadering van A met SVD A = σ1u1v1ᵀ + σ2u2v2ᵀ en σ1 > σ2 > 0?", "o": ["σ2·u2·v2ᵀ", "u1·v1ᵀ", "σ1·u1·v1ᵀ", "σ1·v1·u1ᵀ"], "w": ["Dit is de kleinste component; de benadering heeft dan een grotere fout.", "Je liet σ1 weg: zonder singuliere waarde klopt de schaal niet.", "Eckart-Young: behoud de grootste singuliere waarde.", "u en v verwisseld: de afmetingen kloppen niet (u1 ∈ ℝ^n, v1 ∈ ℝ^m)."], "a": 2}, {"ch": "6", "q": "Wat is ReLu(x) = max(0, x) afgeleide voor x < 0 en voor x > 0?", "o": ["x voor x > 0 en 0 voor x < 0", "0 voor x < 0 en 1 voor x > 0", "0 voor alle x", "1 voor x < 0 en 0 voor x > 0"], "w": ["Je gaf de functie zelf, niet de afgeleide.", "Dit is de stapfunctie.", "ReLu is stijgend voor x > 0, de afgeleide is daar 1.", "Verkeerde volgorde."], "a": 1}, {"ch": "7", "q": "Waarom gebruikt backpropagation reverse-mode autodiff?", "o": ["Het hoeft geen tussenresultaten van de voorwaartse pas te bewaren.", "Het werkt enkel voor lineaire berekeningsgrafen, en is daardoor sneller.", "Eén achterwaartse pas geeft alle partiële afgeleiden van de loss.", "Het levert nauwkeurigere afgeleiden op dan forward-mode autodiff."], "w": ["De waarden van de voorwaartse pas moeten bewaard worden.", "Autodiff werkt via de ³ zijn een basis.", "Drie vectoren zijn een basis als ze onafhankelijk zijn.", "Een basis moet orthogonale vectoren bevatten.", "Vier onafhankelijke vectoren vormen een basis van ℝ³."], "w": ["Als ze afhankelijk zijn niet.", "Drie onafhankelijke vectoren spannen ℝ³ op.", "Dat is een orthogonale basis; een basis moet enkel onafhankelijk zijn en opspannen.", "In ℝ³ zijn vier vectoren altijd afhankelijk."], "a": 1}, {"ch": "6", "q": "Wat is het domein van g(x) = ln(x)?", "o": ["alle reële getallen", "x ≥ 0", "x > 0", "x > 1"], "w": ["ln(−1) bestaat niet.", "ln(0) bestaat niet.", "ln is enkel gedefinieerd voor positieve getallen.", "Ook 0 < x < 1 is toegelaten (ln negatief)."], "a": 2}, {"ch": "1", "q": "V = {(α, β, α+β)} ⊂ ℝ³. Wat is V?", "o": ["Een rechte door de oorsprong.", "Geen deelruimte, want de derde component hangt af van de eerste twee.", "Een lineaire deelruimte: het vlak x₃ = x₁ + x₂.", "Geen deelruimte, want V bevat niet alle punten van ℝ³."], "w": ["Er zijn twee vrije parameters: dat is een vlak.", "Die afhankelijkheid is lineair en blijft behouden bij optellen en schalen.", "0 ∈ V en gesloten onder optellen en schalen.", "Een deelruimte hoeft niet gelijk te zijn aan ℝ³."], "a": 2}, {"ch": "6", "q": "Wat is f'(0) voor f(x) = |x|?", "o": ["−1, want de functie daalt links van 0 met helling −1.", "0, want |x| heeft een minimum in x = 0 (horizontale raaklijn).", "Bestaat niet: de helling links en rechts verschilt.", "1, want de functie stijgt rechts van 0 met helling 1."], "w": ["Enkel links van 0.", "De raaklijn is niet horizontaal; er is geen raaklijn.", "De linker- en rechterraaklijn verschillen (−1 en 1).", "Enkel rechts van 0."], "a": 2}, {"ch": "1", "q": "De loodrechte projectie van b op a heeft lengte 0. Wat weet je?", "o": ["b is de nulvector, enkel dan.", "a is de nulvector.", "b is een veelvoud van a.", "b staat loodrecht op a (b·a = 0)."], "w": ["Ook elke b loodrecht op a geeft 0.", "Dan is proj niet gedefinieerd (delen door 0).", "Dan is proj_a(b) = b.", "proj = (a·b)/(a·a)·a = 0 ⟺ a·b = 0."], "a": 3}, {"ch": "6", "q": "f'(x) > 0 op een interval betekent:", "o": ["f is positief op dat interval.", "f is stijgend op dat interval.", "f is constant.", "f heeft een maximum op dat interval."], "w": ["f'(x) zegt niets over het teken van f.", "De raaklijn heeft positieve helling.", "Dat is f' = 0.", "Een maximum heeft f' = 0."], "a": 1}, {"ch": "1", "q": "Welke formule geeft de afstand tussen de eindpunten van twee vectoren v en w?", "o": ["‖v + w‖", "‖v − w‖", "v·w", "‖v‖ − ‖w‖"], "w": ["Norm van de som.", "Norm van het verschil.", "Het inwendig product is een getal dat hoeken meet, geen afstand.", "Verschil van de lengtes: kan 0 zijn terwijl v ≠ w."], "a": 1}, {"ch": "6", "q": "Wat is de afgeleide van f(x) = 5?", "o": ["1", "5", "5x", "0"], "w": ["Dat is de afgeleide van x.", "Je liet de constante staan.", "Dat is een primitieve.", "De afgeleide van een constante is 0."], "a": 3}, {"ch": "6", "q": "Een open doos zonder deksel heeft vierkante bodem x en inhoud V. Welke formule geeft de oppervlakte S in functie van x?", "o": ["S(x) = 2x² + 4V/x", "S(x) = x² + 4Vx", "S(x) = x² + 4V/x", "S(x) = x² + V/x²"], "w": ["De doos heeft geen deksel.", "h = V/x², niet V·x.", "h = V/x², S = x² + 4xh.", "Je vergat de vier zijkanten."], "a": 2}];
const NAMES={'1':'H1 Vectoren','2':'H2 Matrices','3':'H3 Stelsels','4':'H4 Orthogonale matrices','5':'H5 SVD','6':'H6 Functies 1 var.','7':'H7 Functies meerdere var.','A':'Bijlage A numpy'};
let filt='all',deck=[],i=0,correct=0,answered=false,wrongs=[],stat={};
const L=['A','B','C','D'];
function el(id){return document.getElementById(id)}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function buildBar(){
  const b=el('fbar');
  const mk=(k,t)=>{const x=document.createElement('button');x.className='fb'+(k===filt?' active':'');x.textContent=t;x.onclick=()=>{filt=k;start(k==='all'?DATA:DATA.filter(q=>q.ch===k));buildBar()};b.appendChild(x)};
  b.innerHTML='';mk('all','Alles');Object.keys(NAMES).forEach(k=>mk(k,NAMES[k]));
}
function start(src){deck=[...src];i=0;correct=0;wrongs=[];stat={};el('quiz').style.display='block';el('res').style.display='none';show()}
function startAll(){filt='all';buildBar();start(DATA)}
function show(){
  answered=false;const q=deck[i];
  el('pos').textContent='Vraag '+(i+1)+' / '+deck.length;el('score').textContent='Score '+correct;
  el('fill').style.width=(i/deck.length*100)+'%';
  el('ql').textContent=NAMES[q.ch];el('qt').textContent=q.q;el('next').style.display='none';
  const o=el('opts');o.innerHTML='';
  q.o.forEach((t,k)=>{
    const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="l">'+L[k]+'</span><span>'+esc(t)+'</span>';
    b.onclick=()=>pick(k);o.appendChild(b);
    const w=document.createElement('div');w.className='why';o.appendChild(w);
  });
}
function pick(k){
  if(answered)return;answered=true;const q=deck[i];
  const ok=k===q.a;if(ok)correct++;else wrongs.push(q);
  const s=stat[q.ch]||(stat[q.ch]=[0,0]);s[1]++;if(ok)s[0]++;
  const bs=document.querySelectorAll('.opt'),ws=document.querySelectorAll('.why');
  bs.forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('right');else if(j===k)b.classList.add('wrong');
    ws[j].classList.add('show');ws[j].classList.add(j===q.a?'r':'k');
    ws[j].innerHTML='<b>'+(j===q.a?'Juist. ':'Fout. ')+'</b>'+esc(q.w[j])});
  el('score').textContent='Score '+correct;el('next').style.display='inline-block';
  el('next').textContent=i+1>=deck.length?'Resultaat':'Volgende';
}
function nextQ(){i++;if(i>=deck.length)done();else show()}
function done(){
  el('quiz').style.display='none';el('res').style.display='block';
  const p=Math.round(correct/deck.length*100);
  el('rs').textContent=correct+' / '+deck.length;el('rp').textContent=p+' % juist';
  let h='<tr><th>Hoofdstuk</th><th>Juist</th></tr>';
  Object.keys(NAMES).forEach(k=>{if(stat[k])h+='<tr><td>'+NAMES[k]+'</td><td>'+stat[k][0]+' / '+stat[k][1]+'</td></tr>'});
  el('rt').innerHTML=h;el('rw').style.display=wrongs.length?'inline-block':'none';
}
function retryWrong(){const w=[...wrongs];start(w)}
el('n').textContent=DATA.length;buildBar();start(DATA);
</script>
