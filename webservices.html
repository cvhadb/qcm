aties in volgorde. Maken twee branches elk een migratie, dan wijzigen ze allebei dezelfde plek in het journaal en krijg je een merge-conflict.\n\nDaarom gaf Céline alle schemawijzigingen in één korte branch (chore/schema-update) die als eerste gemerged werd, zodat de feature-branches daarop konden verder. Als het toch botst, zegt de cursus: houd de inkomende migraties en genereer de eigen opnieuw.\n\nOOSD-vergelijking: net als een gedeeld klassendiagram, waar twee mensen niet tegelijk dezelfde klasse wijzigen."}, {"id": "q050", "ch": "6", "q": "Je merkt dat een bestaande migratie een fout bevat. Wat doe je?", "c": "Een nieuwe migratie toevoegen; een bestaande wijzig je nooit.", "w": ["Je past het bestaande SQL-bestand aan en voert db:migrate opnieuw uit.", "Je verwijdert de migratie en genereert hem opnieuw vanuit het schema.", "Je gebruikt drizzle-kit push op de productiedatabank."], "x": ["Drizzle houdt bij welke migraties gedraaid zijn; een gewijzigd bestand wordt niet herhaald.", "Dat breekt de volgorde en de journal.", "push is enkel voor lokaal ontwikkelen."], "m": "Migraties zijn onveranderlijk", "y": "Andere omgevingen hebben de oude migratie al uitgevoerd. Een gewijzigd bestand zou daar nooit meer draaien.", "d": "", "o": "zoals een commit in git: je herschrijft de geschiedenis niet, je voegt een nieuwe commit toe.", "u": "Een migratie die al uitgevoerd is, staat in de tabel met migratiegeschiedenis van elke omgeving waar ze draaide. Pas je het bestand achteraf aan, dan voert Drizzle het niet opnieuw uit en lopen omgevingen uit elkaar. Je kan niet weten waar het oude bestand al gedraaid is.\n\nDaarom los je een fout op met een nieuwe migratie die de fout herstelt.\n\nOOSD-vergelijking: net zoals een commit in git. Je herschrijft de geschiedenis niet, je voegt een nieuwe commit toe."}, {"id": "q051", "ch": "6", "q": "Wat is het verschil tussen een migratie en een seed?", "c": "Migratie wijzigt het schema; seed vult de databank met testdata.", "w": ["Een migratie vult de databank met testdata; een seed wijzigt het schema van de tabellen.", "Ze zijn gelijkwaardig; de keuze tussen beide is een persoonlijke voorkeur.", "Een seed draait automatisch bij elke start; een migratie moet handmatig gestart worden."], "x": ["Dat is omgekeerd.", "Het zijn verschillende dingen.", "Bij ons draaien migraties automatisch en de seed nooit."], "m": "Schema versus testdata", "y": "Data die in productie nodig is, hoort in een migratie. De seed gebruikt een eigen connectie buiten Nest en draait nooit automatisch.", "d": "", "o": "", "u": "Een migratie wijzigt het schema (tabellen, kolommen, indexen) en draait automatisch bij het opstarten. Een seed vult de databank met testdata (gebruikers, spellen, sessies) en draait enkel als je ze zelf start, in Docker met docker compose exec api node dist/src/drizzle/seed.js.\n\nDe seed gebruikt een eigen connectie buiten Nest. Data die in productie nodig is (bijvoorbeeld standaardrollen) hoort in een migratie, niet in de seed.\n\nSeed-accounts uit jullie project: Céline (admin en gebruiker), Thibault en Pieter, met een dummy wachtwoord. De seed is een evaluatiecriterium."}, {"id": "q052", "ch": "6", "q": "Je wil spellen filteren op een kolom van een gejoinde tabel. Wat gebruik je?", "c": "Een query builder met een join; with: filtert niet op de gejoinde tabel.", "w": ["De relationele API met with: en een where op de gerelateerde tabel.", "Twee aparte queries en samenvoegen in JavaScript, want Drizzle kent geen joins.", "Een ruwe SQL-string in de service."], "x": ["Dat is precies wat niet kan.", "Drizzle ondersteunt joins.", "De cursus raadt de ORM-interface aan."], "m": ".select().from().innerJoin()", "y": "with: haalt gerelateerde data op. De COUNT-query voor een totaal heeft dezelfde join nodig.", "d": "", "o": "", "u": "Drizzle heeft twee manieren om gerelateerde data te lezen. De relationele API (db.query.games.findMany({ with: ... })) laadt kindrijen geneste in het resultaat, maar kan niet filteren op een kolom van de gelaagde tabel in de hoofdquery. De query builder (db.select().from().innerJoin()) schrijft expliciet SQL-joins en laat dat wel toe.\n\nJullie games-service gebruikt enkel with: (spellen met hun categorieën). Er staan geen expliciete joins in de code, omdat er geen filter op categorie is. Zou je er een toevoegen, dan moet je naar de query builder met innerJoin overschakelen, en de COUNT-query heeft dezelfde join nodig.\n\nValkuil. Wees eerlijk over wat jullie gebruiken: with: voor ophalen, de query builder voor avg() en count() en de wachtlijst."}, {"id": "q053", "ch": "6", "q": "Waarom zit er in onze main.ts app.enableShutdownHooks()?", "c": "Zonder die regel roept Nest onModuleDestroy niet aan bij een stop-signaal.", "w": ["Het activeert de Swagger-documentatie bij het afsluiten van de applicatie.", "Het voert de migraties uit vlak voordat de applicatie definitief stopt.", "Het schakelt de healthcheck uit tijdens het afsluiten van de container."], "x": ["Swagger heeft er niets mee te maken.", "Migraties draaien bij het opstarten.", "De healthcheck is een Docker-instelling."], "m": "Shutdown hooks", "y": "Het bleek aan exitcode 137: Docker moest de container na 10 seconden doden. Nu stopt hij in 0,2 seconden met exitcode 0.", "d": "Een eigen bevinding, niet uit de cursus.", "o": "", "u": "Bij een stopsignaal (SIGTERM, wat docker stop stuurt) doet Nest standaard niets met de lifecycle-hooks. Met app.enableShutdownHooks() luistert Nest naar het signaal en roept hij onModuleDestroy aan. In DrizzleModule sluit die hook de connection pool.\n\nJullie merkten het aan de exitcode: zonder de regel wachtte Docker 10 seconden en moest de container met exitcode 137 gedood worden. Met de regel stopt hij in ongeveer 0,2 seconden met exitcode 0.\n\nValkuil. onModuleDestroy bestaat in de code, maar werkt niet zonder enableShutdownHooks. Beide zijn nodig."}, {"id": "q054", "ch": "6", "q": "Waarom een ORM zoals Drizzle in plaats van ruwe SQL in de services?", "c": "De ORM genereert de SQL en vertaalt resultaten naar objecten.", "w": ["SQL schrijven is in Node.js niet mogelijk zonder extra bibliotheek.", "Een ORM maakt de queries altijd sneller dan handgeschreven SQL.", "De rubric verbiedt het woord SELECT in de services."], "x": ["Het kan, maar het is minder veilig en minder onderhoudbaar.", "Een ORM is niet per definitie sneller.", "De rubric zegt dat de servicelaag geen SQL-queries bevat; de ORM-interface is geen SQL."], "m": "ORM = object-relational mapper", "y": "Dat vermindert herhaling en fouten. Je blijft wel verantwoordelijk voor efficiënte queries.", "d": "", "o": "Data Mapper.", "u": "Een ORM (object-relational mapper) schrijft de SQL voor je en zet de resultaatrijen om naar objecten. Dat verlaagt herhaling, vermindert typefouten en geeft je typeveiligheid: TypeScript kent de kolommen.\n\nHet vervangt wel niet je verantwoordelijkheid. Een slechte query blijft traag, en je moet weten wat de ORM genereert (denk aan het N+1-probleem).\n\nOOSD-vergelijking: dit is een Data Mapper. De mapper kent de tabelstructuur, de domeinobjecten niet.\n\nValkuil. 'ORM' betekent niet dat SQL verdwijnt. Voor avg() en count() gebruiken jullie de query builder, die dicht tegen SQL aanleunt."}, {"id": "q055", "ch": "6", "q": "Waarom geeft een insert in MySQL met Drizzle enkel het id terug?", "c": "MySQL kent geen RETURNING; je haalt de rij daarna zelf op.", "w": ["Drizzle verbergt de rest van de rij om de respons klein te houden.", "Het is een beveiligingsmaatregel tegen het lekken van kolommen.", "Omdat het id het enige veld is dat uniek is in de rij."], "x": ["Het is een beperking van MySQL, niet van Drizzle.", "Er is geen beveiligingsreden.", "Het heeft niets met uniciteit te maken."], "m": "$returningId()", "y": "Bij PostgreSQL zou je de hele rij kunnen teruggeven. Bij MySQL doe je een tweede query.", "d": "", "o": "", "u": "PostgreSQL kent INSERT ... RETURNING: de databank geeft de volledige nieuwe rij terug. MySQL niet. Drizzle biedt voor MySQL daarom $returningId(), dat enkel het automatisch gegenereerde id geeft.\n\nJullie patroon in de services: invoegen, het id nemen en met getById(id) de volledige rij ophalen. Zo is het antwoord altijd de rij zoals ze in de databank staat.\n\nValkuil. Doe je dat niet, dan geef je enkel terug wat je zelf instuurde, zonder gegenereerde velden."}, {"id": "q056", "ch": "6", "q": "De seed wist eerst de bestaande applicatiegegevens. In welke volgorde?", "c": "Kinderen vóór ouders, vanwege de foreign keys.", "w": ["Ouders vóór kinderen, zodat de verwijzingen eerst verdwijnen.", "In willekeurige volgorde; MySQL regelt dat.", "Alfabetisch op tabelnaam."], "x": ["Dat geeft ER_ROW_IS_REFERENCED_2.", "MySQL controleert de volgorde net.", "De volgorde moet de afhankelijkheden volgen."], "m": "Kinderen eerst", "y": "Een rij verwijderen waar nog iets naar wijst, wordt door de foreign key geweigerd.", "d": "", "o": "", "u": "Foreign keys weigeren het verwijderen van een rij waar nog een kindrij naar wijst. Je wist dus altijd van kind naar ouder.\n\nDe seed doet dit in die volgorde: reviews, game_categories, categories, play_session_participants, play_sessions, games en tot slot users. Eerst de tabellen die van anderen afhangen, dan de tabellen waar naar verwezen wordt.\n\nOpbouwen gaat de andere kant op: eerst de ouders (users, games, categories), dan de kinderen."}, {"id": "q057", "ch": "6", "q": "Waarom wordt de databankverbinding door één module beheerd en gesloten bij het afsluiten?", "c": "Het is een criterium en voorkomt openblijvende verbindingen.", "w": ["Omdat NestJS maar één databankverbinding per project toelaat.", "Omdat elke feature-module anders zijn eigen aparte databank zou krijgen.", "Omdat de verbinding anders door Docker wordt gesloten bij het stoppen."], "x": ["Een pool kan meerdere verbindingen hebben.", "Een feature-module krijgt dezelfde verbinding.", "Docker sluit alleen het proces."], "m": "Eén DrizzleModule", "y": "Feature-modules injecteren de verbinding via de token; ze beheren hem niet. onModuleDestroy sluit de pool.", "d": "", "o": "wat je opent, sluit je (try-with-resources, IDisposable).", "u": "DrizzleModule maakt de connection pool aan en sluit hem in onModuleDestroy. Andere modules krijgen de databank enkel via het token (@InjectDrizzle()). Zo is er één verantwoordelijke voor de verbinding en één plaats waar ze netjes sluit.\n\nHet is een evaluatiecriterium van de cursus: één module beheert de verbinding en sluit ze bij het afsluiten van de server. Zonder dat blijven verbindingen openstaan.\n\nDe pool heeft connectionLimit 5: hoogstens vijf gelijktijdige verbindingen.\n\nOOSD-vergelijking: wat je opent, sluit je (try-with-resources, IDisposable)."}, {"id": "q058", "ch": "7", "q": "Wat is waar over een JWT?", "c": "De payload is leesbaar voor iedereen; de signature voorkomt ongemerkte wijziging.", "w": ["De payload is versleuteld met het secret, dus je kan er veilig gevoelige gegevens in bewaren.", "De signature wordt gecontroleerd met een publieke sleutel die elke client in bezit heeft.", "Na het verlopen van exp blijft het token geldig tot de gebruiker expliciet uitlogt."], "x": ["Dat is een veelvoorkomende misvatting; een JWT is base64, geen encryptie.", "Bij onze HMAC-ondertekening is het secret symmetrisch en geheim.", "exp bepaalt wanneer de server het token niet meer aanvaardt."], "m": "Ondertekend, niet versleuteld", "y": "Het secret staat enkel op de server (AUTH_JWT_SECRET) en een verlopen token wordt geweigerd. Zet geen gevoelige gegevens in de payload.", "d": "", "o": "", "u": "Een JWT bestaat uit drie delen, gescheiden door punten: header, payload en signature. De eerste twee zijn enkel base64-gecodeerd, dus iedereen kan ze lezen. De signature is een berekening over header en payload met een geheim dat enkel de server kent (AUTH_JWT_SECRET). Wijzigt iemand de payload, dan klopt de signature niet meer.\n\nEen JWT is dus gesigneerd, niet versleuteld. Zet er daarom nooit gevoelige gegevens in. Een verlopen token (exp) wordt geweigerd.\n\nValkuil. 'Het token is geheim' klopt niet: de inhoud is leesbaar. Alleen het signeergeheim is geheim."}, {"id": "q059", "ch": "7", "q": "Welke claims staan in onze JWT-payload?", "c": "sub, email, roles, iat, exp, aud en iss.", "w": ["id, naam, wachtwoordhash en rol.", "username, sessionId en csrfToken.", "alleen het gebruikers-id."], "x": ["De hash verlaat de server nooit.", "Er is geen sessie en geen CSRF-token in een stateless JWT-opzet.", "Ook e-mail en rollen zitten erin, zodat de RolesGuard niet naar de databank hoeft."], "m": "Claims", "y": "Het token is een uur geldig. De wachtwoordhash zit er nooit in.", "d": "", "o": "", "u": "Onze payload bevat drie eigen gegevens: sub (het gebruikers-id), email en roles. Daarbij komen de standaardclaims: iat (uitgegeven op), exp (vervalt, een uur na uitgifte), aud (voor wie, AUTH_JWT_AUDIENCE) en iss (uitgever, AUTH_JWT_ISSUER).\n\naud en iss laten de AuthGuard controleren dat het token van onze API komt en voor onze API bedoeld is. De wachtwoordhash zit er nooit in.\n\nWaarom roles in het token: de RolesGuard hoeft de databank niet te raadplegen. Het nadeel is dat een rolwijziging pas na het verlopen van het token zichtbaar wordt."}, {"id": "q060", "ch": "7", "q": "Wat gebeurt er als iemand de payload van zijn JWT wijzigt (bijvoorbeeld roles: admin)?", "c": "De signature klopt niet meer; de AuthGuard weigert met 401.", "w": ["De server accepteert het token omdat hij enkel de payload leest.", "De RolesGuard merkt het en geeft een 403.", "De databank weigert het request omdat de rol niet overeenkomt."], "x": ["De verificatie van de signature gebeurt vóór het lezen van de claims.", "De RolesGuard draait pas na de AuthGuard; het token is dan al afgekeurd.", "De databank komt hier niet aan te pas."], "m": "Signature bewaakt de integriteit", "y": "De signature is berekend over header en payload met het geheim van de server. Wie het geheim niet kent, kan hem niet opnieuw berekenen.", "d": "", "o": "", "u": "De signature is berekend over header en payload met het geheim van de server. Verander je roles naar admin, dan klopt de oude signature niet meer bij de nieuwe payload. De AuthGuard herberekent bij elk request de signature, ziet het verschil en gooit een UnauthorizedException: 401.\n\nEen aanvaller kan geen nieuwe geldige signature maken zonder het geheim. Daarom mag het geheim nooit in git staan of in de client terechtkomen.\n\nValkuil. Het is 401, niet 403: het token zelf is ongeldig, er is geen betrouwbare identiteit."}, {"id": "q061", "ch": "7", "q": "Waarom hash je wachtwoorden met argon2id en een salt?", "c": "Argon2id is traag en geheugenintensief; de salt maakt elke hash uniek.", "w": ["Een hash is omkeerbaar, zodat je wachtwoorden kan terugsturen wanneer iemand ze vergeet.", "De salt is een geheim dat in .env staat en elke hash versleutelt voor hij opgeslagen wordt.", "De hash maakt het wachtwoord korter zodat de databank minder opslagruimte nodig heeft."], "x": ["Een hash is een eenrichtingsfunctie.", "Een salt is niet geheim; hij zit bij de hash.", "Opslagruimte is hier niet de reden."], "m": "Hash + salt", "y": "De parameters (timeCost, memoryCost, ...) staan in de hash zelf, dus verify heeft ze niet apart nodig.", "d": "", "o": "", "u": "Een wachtwoord sla je nooit leesbaar op. Een hash is een eenrichtingsfunctie. Argon2id is bewust traag en geheugenintensief (timeCost 6, memoryCost 65536 KiB, hashLength 32), zodat een aanvaller met een gelekte databank niet snel miljoenen gokken kan proberen. De salt is een willekeurige waarde per wachtwoord, zodat twee gelijke wachtwoorden een verschillende hash krijgen en vooraf berekende tabellen (rainbow tables) nutteloos zijn.\n\nDe parameters en de salt staan in de hashstring zelf. Daardoor heeft argon2.verify ze niet apart nodig.\n\nValkuil. Een salt is geen geheim, het is geen peper. En een snelle hash zoals SHA-256 is voor wachtwoorden net slecht."}, {"id": "q062", "ch": "7", "q": "Wat doet de AuthDelayInterceptor?", "c": "Willekeurige vertraging, ook bij fouten, zodat de responstijd niets verraadt.", "w": ["Hij blokkeert een account na enkele foute pogingen om brute force tegen te houden.", "Hij geeft de databank tijd om de argon2-hash te berekenen voor hij antwoordt.", "Hij beperkt het aantal login-requests per IP-adres per minuut (rate limiting)."], "x": ["Dat is account lockout.", "De hash wordt in de service berekend; wachten is niet nodig.", "Dat is rate limiting, een andere techniek."], "m": "Tegen timing attacks", "y": "Een onbekend adres antwoordt sneller dan een bekend adres met een fout wachtwoord. De vertraging maakt beide even traag.", "d": "", "o": "", "u": "Zonder vertraging antwoordt een onbekend e-mailadres sneller dan een bekend adres met een fout wachtwoord (de hash moet niet berekend worden). Een aanvaller kan uit die tijd afleiden welke adressen bestaan: een timing attack.\n\nDe interceptor hangt enkel aan POST /api/auth/login. Hij laat de handler lopen en stelt daarna het antwoord, ook een fout, uit met een willekeurige tijd tussen 0 en auth.maxDelay. De code valt terug op 5000 ms, maar .env.example zet AUTH_MAX_DELAY=2000.\n\nValkuil. Dit is geen rate limiting en blokkeert geen account. Het verbergt enkel verschillen in responstijd."}, {"id": "q063", "ch": "7", "q": "Wat is het verschil tussen authenticatie en autorisatie?", "c": "Authenticatie: wie je bent; autorisatie: wat je mag.", "w": ["Authenticatie controleert wat je mag; autorisatie wie je bent.", "Authenticatie geldt voor de server; autorisatie voor de client.", "Ze betekenen hetzelfde."], "x": ["Omgekeerd.", "Beide gebeuren op de server.", "Het zijn twee stappen."], "m": "Wie versus wat", "y": "AuthGuard = authenticatie. RolesGuard en assertOwner = autorisatie.", "d": "", "o": "", "u": "Authenticatie beantwoordt 'wie ben je?': je bewijst je identiteit met een wachtwoord bij het inloggen en daarna met een token. Autorisatie beantwoordt 'wat mag je?': je rechten op basis van je rol of je eigenaarschap.\n\nIn jullie code: AuthGuard is authenticatie (token geldig, zet request.user). RolesGuard (@Roles) en assertOwner (eigenaar of admin) zijn autorisatie. Eerst moet je geïdentificeerd zijn, daarna wordt je recht getoetst.\n\nStatuscodes: authenticatie faalt met 401, autorisatie met 403 (en 404 bij CheckUserAccessGuard)."}, {"id": "q064", "ch": "7", "q": "Wie mag een review van Anna aanpassen of verwijderen?", "c": "Anna zelf en elke admin, via assertOwner().", "w": ["Alleen Anna zelf; een admin mag niet aan andermans gegevens komen.", "Anna zelf en de admin die het spel heeft aangemaakt.", "Elke ingelogde gebruiker."], "x": ["Dat is de cursusregel voor transacties, niet voor ons.", "Er is geen koppeling tussen spel en admin die een review beheert.", "Dan zou iedereen elke review kunnen wijzigen."], "m": "Eigenaar of admin", "y": "In de cursus mag zelfs een admin andermans transactie niet wijzigen (privé financiële data). Reviews en sessies zijn semi-publiek en verdienen moderatie.", "d": "Eén functie op één plek: assertOwner() in common/ownership.ts.", "o": "", "u": "In ReviewsService roepen update en delete assertOwner(user, review.userId) aan. Die ene functie, in common/ownership.ts, laat door als de gebruiker de eigenaar is of admin, en gooit anders een ForbiddenException (403). Ze wordt ook voor speelsessies gebruikt (host).\n\nIn de cursus mag zelfs een admin de transactie van iemand anders niet wijzigen, want dat is privé financiële data. Reviews en sessies zijn semi-publiek, dus moderatie door een admin is zinvol.\n\nValkuil. Een andere gewone gebruiker, zelfs met een geldig token, krijgt 403. De check gebeurt in de service omdat hij de review eerst uit de databank moet halen."}, {"id": "q065", "ch": "7", "q": "Wat is het verschil tussen 401 en 403?", "c": "401: niet aangemeld of ongeldig token; 403: aangemeld maar zonder recht.", "w": ["401: de gebruiker heeft geen rol; 403: het token is ongeldig of verlopen.", "401: het spel bestaat niet; 403: de gebruiker bestaat niet in de databank.", "401: serverfout; 403: clientfout, beide zonder verband met aanmelden."], "x": ["Omgekeerd.", "Dat zijn beide 404-situaties.", "Beide zijn 4xx, dus clientfouten."], "m": "Wie ben je versus wat mag je", "y": "Een gewone gebruiker die een spel wil aanmaken krijgt 403. Een request zonder token krijgt 401.", "d": "", "o": "", "u": "401 betekent niet geauthenticeerd: geen token, een ongeldig of verlopen token. De server weet niet wie je bent. 403 betekent geauthenticeerd maar niet geautoriseerd: de server weet wie je bent en je mag dit niet.\n\nVoorbeelden uit jullie API: een gewone gebruiker die een spel wil aanmaken (@Roles(Role.ADMIN)) krijgt 403. Een request zonder token krijgt 401. Wie andermans review wijzigt, krijgt 403 van assertOwner.\n\nValkuil. De naam 'Unauthorized' misleidt. Denk 401 = onbekend, 403 = verboden. En voor andermans /users/:id kiezen jullie 404, om niet te verklappen dat die gebruiker bestaat."}, {"id": "q066", "ch": "7", "q": "Waarom gaan passwordHash en roles nooit naar de client?", "c": "Het response-DTO exposeert enkel gemarkeerde velden (@Expose, excludeExtraneousValues).", "w": ["De databank filtert die kolommen weg met een view voordat de service ze ziet.", "De RolesGuard verwijdert ze uit het antwoord voor niet-admins.", "Swagger verbergt ze in de documentatie, waardoor clients ze niet te zien krijgen."], "x": ["Er is geen view.", "De guard draait vóór de controller.", "Swagger documenteert alleen; het filtert niets."], "m": "Expose + excludeExtraneousValues", "y": "Een whitelist op het antwoord: wat je niet expliciet toont, verlaat de server niet.", "d": "", "o": "information hiding.", "u": "De databankrij bevat passwordHash en roles, maar de service geeft ze niet rechtstreeks terug. In UsersService wordt de rij met plainToInstance en excludeExtraneousValues omgezet naar PublicUserResponseDto. Enkel de velden die in dat DTO met @Expose gemarkeerd zijn, komen in het antwoord. De rest wordt weggelaten.\n\nDit is een whitelist op het antwoord: wat je niet expliciet toont, verlaat de server niet. Zo kan een nieuwe kolom nooit per ongeluk lekken.\n\nOOSD-vergelijking: information hiding. Het DTO is de publieke interface van het gegeven, de entiteit blijft intern."}, {"id": "q067", "ch": "7", "q": "Waarom is controle op rollen enkel in een front-end niet genoeg?", "c": "Een client kan de API rechtstreeks aanroepen; de backend controleert dus zelf.", "w": ["Omdat een browser rollen niet kan lezen uit een token dat hij ontvangt.", "Omdat een JWT geen rollen kan bevatten in zijn payload.", "Omdat guards alleen werken wanneer er geen front-end gebruikt wordt."], "x": ["Dat kan wel.", "Onze JWT bevat rollen.", "Guards werken ongeacht de client."], "m": "Vertrouw de client nooit", "y": "Daarom zitten RolesGuard en assertOwner in de backend.", "d": "", "o": "", "u": "Een front-end draait in de browser van de gebruiker en kan omzeild worden. Iedereen kan met Postman, curl of Swagger de API rechtstreeks aanroepen en zo elke knop of verborgen pagina overslaan.\n\nDe backend moet dus altijd zelf controleren wie wat mag: RolesGuard voor rollen, assertOwner voor eigenaarschap. De front-end mag knoppen verbergen als gebruiksgemak, maar dat is geen beveiliging.\n\nRegel: vertrouw nooit de client. Dat geldt voor rollen, voor de userId van een review en voor alles wat in de body staat."}, {"id": "q068", "ch": "7", "q": "Wat is de rol van AUTH_JWT_SECRET?", "c": "Het geheim waarmee de server de signature berekent; nooit in de code.", "w": ["De sleutel waarmee de payload versleuteld wordt, zodat niemand ze kan lezen.", "Het wachtwoord van de admin dat bij de eerste opstart wordt aangemaakt.", "Een publieke sleutel die clients meekrijgen om het token zelf te controleren."], "x": ["Een JWT is niet versleuteld.", "Het heeft niets met gebruikers te maken.", "Het is net geheim."], "m": "Server-geheim", "y": "Lekt het geheim, dan kan iemand geldige tokens maken. Daarom staat het niet in git.", "d": "", "o": "", "u": "AUTH_JWT_SECRET is het geheim waarmee de server de signature van elk token berekent en later controleert. Wie het kent, kan zelf geldige tokens maken, met elke rol. Daarom hoort het enkel in de omgevingsvariabelen van de server, nooit in de code of in git.\n\nIn jullie repo staat een .env.example met een dummywaarde, en .env staat in .gitignore. Een van de ontvankelijkheidscriteria is dat er geen .env of echte sleutels op GitHub staan.\n\nValkuil. Lekt het geheim, dan verander je het meteen: alle bestaande tokens worden ongeldig."}, {"id": "q069", "ch": "8", "q": "Hoe werkt de afbeeldingsupload voor een spel?", "c": "FileInterceptor en ParseFilePipe controleren, CloudinaryService uploadt, de secure_url komt in imageUrl.", "w": ["De client stuurt de afbeelding als base64 mee in POST /api/games en de API bewaart ze in een kolom.", "Multer bewaart het bestand op de schijf van de server en imageUrl wijst naar dat pad op de schijf.", "De client uploadt rechtstreeks naar Cloudinary en stuurt enkel de URL mee in POST /api/games."], "x": ["Afbeeldingen horen niet in de databank.", "Bestanden op de schijf van de server horen niet in een stateless, containergebaseerde opzet.", "imageUrl zet je enkel via de uploadroute, niet via POST of PUT van het spel."], "m": "PUT /api/games/:id/image", "y": "Aparte route, enkel voor admins, met een limiet van 5 MB en de typen jpeg, png en webp.", "d": "", "o": "", "u": "De route is PUT /api/games/:id/image, enkel voor admins (@Roles(Role.ADMIN)). De volgorde: de FileInterceptor('file') leest het bestand uit het multipart-request; de ParseFilePipe controleert de grootte (max 5 MB) en het type (jpeg, png of webp); de controller geeft het bestand door aan CloudinaryService, die het uploadt; de service bewaart de secure_url in games.imageUrl.\n\nIn de databank staat dus enkel de URL, niet de afbeelding. Cloudinary is jullie extra technologie.\n\nValkuil. De interceptor loopt vóór de pipe. Zonder de interceptor is er geen bestand om te valideren."}, {"id": "q070", "ch": "8", "q": "Waarom Cloudinary voor de afbeeldingen?", "c": "Cloudinary bewaart ze buiten de databank en de server en geeft een URL terug.", "w": ["Omdat MySQL geen binaire data kan opslaan en dus geen afbeeldingen aankan.", "Omdat Cloudinary elke afbeelding automatisch controleert op schadelijke scripts.", "Omdat de cursus Cloudinary als extra technologie verplicht voor elk project."], "x": ["MySQL kan BLOBs opslaan; het is gewoon geen goed idee.", "Validatie van het type doet ParseFilePipe.", "Elke student kiest zelf een extra technologie."], "m": "Extra technologie", "y": "Cloudinary is onze gekozen extra technologie. Zijn sleutels (CLOUDINARY_*) komen uit de omgeving en worden nooit gecommit.", "d": "", "o": "je bewaart een verwijzing (URL) in plaats van het object zelf.", "u": "Afbeeldingen horen niet in de databank en ook niet op de schijf van de API-server: een container is vluchtig en bij een herstart zijn de bestanden weg. Cloudinary bewaart ze, geeft een URL terug en serveert ze snel (CDN).\n\nHet is jullie gekozen extra technologie, een ontvankelijkheidscriterium dat je in het dossier beschrijft. De sleutels (CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET) komen uit de omgeving, in .env.example staan dummywaarden.\n\nOOSD-vergelijking: je bewaart een verwijzing (URL) in plaats van het object zelf."}, {"id": "q071", "ch": "8", "q": "Wat controleert ParseFilePipe bij de upload?", "c": "De maximale grootte (5 MB) en het bestandstype (jpeg, png, webp).", "w": ["Of de gebruiker admin is en dus een afbeelding mag uploaden naar de catalogus.", "Of het spel al een afbeelding heeft die dan overschreven zou worden.", "Of de dienst Cloudinary op dat moment bereikbaar is voor de upload."], "x": ["Dat is de RolesGuard.", "Dat is domeinlogica in de service.", "Dat merk je pas bij de upload zelf."], "m": "Bestand valideren", "y": "Een pipe valideert invoer, hier het bestand. De rol controleert de RolesGuard.", "d": "", "o": "", "u": "ParseFilePipe krijgt een lijst van validators: MaxFileSizeValidator (maximaal 5 MB) en FileTypeValidator (image/jpeg, image/png of image/webp). Voldoet het bestand niet, dan gooit de pipe een 400.\n\nWie de route mag gebruiken, is een andere vraag: dat is @Roles(Role.ADMIN) en de RolesGuard, die vóór de pipe draait. Een pipe controleert data, geen rechten.\n\nValkuil. Het type wordt gecontroleerd op de inhoud van het bestand (file-type), niet enkel op de extensie. Daarom is de ESM-instelling in de test nodig."}, {"id": "q072", "ch": "8", "q": "Waarom staat NODE_OPTIONS=--experimental-vm-modules in .env.test?", "c": "Jest kan anders het ESM-pakket file-type niet laden.", "w": ["Het versnelt de testrun door modules in een aparte virtuele machine te cachen.", "Het is nodig om Testcontainers de MySQL-container te laten starten vanuit Jest.", "Het activeert de coverage-rapportage voor bestanden die als ESM geschreven zijn."], "x": ["Het gaat om compatibiliteit, niet om snelheid.", "Testcontainers hebben die optie niet nodig.", "Coverage staat los hiervan."], "m": "ESM in Jest", "y": "Zonder die schakelaar kreeg elke geldige afbeelding in de uploadtest een 400.", "d": "", "o": "", "u": "FileTypeValidator van Nest gebruikt het pakket file-type, en dat is een ESM-pakket (ES modules). Jest draait standaard met CommonJS en kan dat niet inladen. Met NODE_OPTIONS=--experimental-vm-modules krijgt Jest ondersteuning voor ES modules.\n\nHet symptoom was bedrieglijk: zonder de instelling kreeg elke geldige afbeelding in de uploadtest een 400, alsof de validatie de afbeelding afkeurde. In werkelijkheid kon de validator niet laden.\n\nValkuil. Dit is een testomgeving-probleem, geen fout in de applicatiecode. De env-cmd laadt .env.test voor de testen."}, {"id": "q073", "ch": "8", "q": "Wat bevat het speldetail GET /api/games/:id aan beoordelingsgegevens?", "c": "averageRating en reviewCount, plus de categorieën; geen volledige lijst van reviews.", "w": ["De volledige lijst van reviews met alle commentaren, rechtstreeks in het speldetail.", "Alleen de id's van de reviews, zodat de client ze apart kan opvragen.", "Niets; reviews zijn volledig losgekoppeld van het spel in de API."], "x": ["Dat doen we bewust niet.", "Ook geen id's.", "Het gemiddelde en het aantal staan er wel."], "m": "Samenvatting, geen lijst", "y": "De lijst staat op GET /api/reviews?gameId=. Zo hangt de games-code niet af van de reviews-code en konden we parallel werken.", "d": "", "o": "", "u": "Het speldetail bevat het spel, de categorieën, een gemiddelde score (averageRating) en het aantal reviews (reviewCount). De volledige lijst van reviews zit er niet in. Die haal je op met GET /api/reviews?gameId=.\n\nWaarom die scheiding: de games-code hangt niet af van de reviews-code, en jullie konden parallel werken (Céline games, Thibault reviews). Een spel met duizend reviews zou ook een enorm antwoord geven.\n\nValkuil. 'reviewCount' en 'averageRating' zijn afgeleide waarden. Ze worden bij elke aanvraag berekend en niet opgeslagen."}, {"id": "q074", "ch": "8", "q": "Hoe wordt averageRating berekend?", "c": "Een aparte avg()- en count()-query op de reviews van het spel.", "w": ["De client berekent het gemiddelde zelf uit de lijst van reviews die hij opvraagt.", "Het staat als kolom in games en wordt door een trigger bijgewerkt bij elke review.", "De controller telt de reviews op uit het geheugen bij elk request."], "x": ["Dan is de logica niet in de server.", "Er is geen kolom en geen trigger.", "De controller bevat geen logica."], "m": "Aggregatiequery", "y": "Zo is het altijd actueel en kost het geen extra kolom om consistent te houden.", "d": "Domeinlogica hoort in de service.", "o": "", "u": "In GamesService.getById staat een aparte query: select avg(rating) en count() uit reviews waar gameId gelijk is aan het spel. De databank rekent, de service voegt het resultaat toe aan het antwoord (averageRating is null als er geen reviews zijn).\n\nEen aparte kolom 'gemiddelde' in games zou bij elke nieuwe, gewijzigde of verwijderde review bijgewerkt moeten worden, en kan uit sync raken. Door te berekenen bij het opvragen is het altijd actueel.\n\nValkuil. Het gemiddelde ophalen door alle reviews in JavaScript te middelen is trager en verplaatst werk naar de applicatie."}, {"id": "q075", "ch": "8", "q": "Wat gebeurt er met de koppelingen als je PUT /api/games/3 doet zonder categoryIds?", "c": "De bestaande koppelingen blijven ongewijzigd.", "w": ["Alle koppelingen worden verwijderd.", "Het request krijgt een 400 omdat categoryIds verplicht is.", "De categorieën worden op de standaardcategorie gezet."], "x": ["Dat is wat [] doet.", "Het veld is optioneel.", "Er is geen standaardcategorie."], "m": "Weggelaten = ongemoeid", "y": "categoryIds is optioneel. [] wist alle koppelingen; [1, 2] vervangt ze.", "d": "", "o": "", "u": "In GamesService.update staat if (categoryIds !== undefined). Is het veld niet meegestuurd, dan wordt het hele koppelingsblok overgeslagen en blijven de bestaande koppelingen onaangeroerd.\n\nJe kan categoryIds dus bewust weglaten bij het wijzigen van enkel de titel. Stuur je [] dan verwijdert dat alle koppelingen; stuur je [1, 2] dan worden ze vervangen.\n\nValkuil. 'Niet meegestuurd' (undefined) en 'lege lijst' ([]) zijn twee verschillende dingen in de code."}, {"id": "q076", "ch": "8", "q": "Een PUT op een spel met categoryIds: [999] (een onbestaande categorie). Wat gebeurt er?", "c": "404 en alles wordt teruggedraaid, ook de spelwijzigingen.", "w": ["200: de onbekende categorie wordt genegeerd en de rest wordt bewaard.", "409: omdat het categorie-id al bestaat in de tabel.", "500: omdat de foreign key faalt en Nest dat niet vertaalt."], "x": ["Dan zou de koppeling onbetrouwbaar zijn.", "Het id bestaat net niet.", "Dat is vertaald naar een nette 404."], "m": "Transactie + ER_NO_REFERENCED_ROW_2", "y": "De foreign key faalt, de filter vertaalt dat naar 404 en de transactie rolt terug.", "d": "", "o": "", "u": "In de transactie worden eerst de spelvelden bijgewerkt en de oude koppelingen verwijderd, daarna worden nieuwe rijen in game_categories ingevoegd met categoryId 999. Die categorie bestaat niet, dus de foreign key faalt met ER_NO_REFERENCED_ROW_2.\n\nDe DrizzleQueryErrorFilter vertaalt die code naar 404. Omdat de fout binnen de transactie optreedt, draait MySQL alles terug: ook de wijziging van de spelvelden en het verwijderen van de oude koppelingen. Het spel is na het mislukte request ongewijzigd.\n\nValkuil. 400 klopt niet: de invoer is geldig van vorm, maar verwijst naar iets dat er niet is."}, {"id": "q077", "ch": "8", "q": "Waarom komt er geen aparte route om een categorie aan een spel te koppelen?", "c": "game_categories is een pure tussentabel; je beheert ze via het spel.", "w": ["Omdat Swagger geen geneste of extra routes kan tonen in de documentatie.", "Omdat categorieën volgens het ontwerp niet aan spellen gekoppeld mogen worden.", "Omdat de koppelingen rechtstreeks via de seed in de databank gezet worden."], "x": ["Swagger kan geneste routes tonen.", "Dat is net de functionaliteit.", "De seed vult enkel data."], "m": "Cursusregel", "y": "Een tussentabel krijgt nooit een eigen controller of service.", "d": "", "o": "", "u": "game_categories is een pure tussentabel zonder eigen gegevens. De cursus zegt: geen controller of service voor tussentabellen, je beheert ze via de ouder. Daarom koppel je via categoryIds bij POST en PUT van het spel.\n\nDat houdt de API klein en voorkomt dat clients een inconsistente toestand kunnen maken.\n\nValkuil. Een route zoals POST /api/games/3/categories lijkt logisch, maar het is een aparte API-aanroep voor een afhankelijke entiteit. Dat is in strijd met het rubriekpunt 'geen API-aanroepen voor afhankelijke entiteiten'."}, {"id": "q078", "ch": "8", "q": "Wie mag spellen en categorieën aanmaken, wijzigen en verwijderen?", "c": "Alleen een admin, via @Roles(Role.ADMIN).", "w": ["Elke ingelogde gebruiker.", "Alleen de gebruiker die het spel als eerste ziet.", "Niemand; alles loopt via de seed."], "x": ["Dan zou de catalogus niet beheerd zijn.", "Er is geen 'eerste gebruiker'.", "De API heeft CRUD-routes."], "m": "Schrijven = admin", "y": "Lezen mag elke ingelogde gebruiker. De RolesGuard geeft 403 aan een gewone gebruiker.", "d": "", "o": "", "u": "Op de controllers van games en categories staat @Roles(Role.ADMIN) bij POST, PUT en DELETE. De RolesGuard vergelijkt de rollen in het token met die vereiste rol. Een gewone gebruiker heeft een geldig token (AuthGuard slaagt) maar mist de rol: 403.\n\nLezen (GET) kan elke ingelogde gebruiker. Alleen login, registreren en health zijn volledig publiek.\n\nValkuil. 401 en 403 niet verwarren. De gebruiker is bekend maar mag niet."}, {"id": "q079", "ch": "8", "q": "Een dubbele titel van een spel geeft welke respons?", "c": "409, door de unieke index idx_game_title_unique.", "w": ["400, doordat de ValidationPipe titels vergelijkt met de databank.", "404, omdat het spel met die titel niet gevonden wordt.", "422, omdat de DTO ongeldig is."], "x": ["Een pipe kent de databank niet.", "404 is voor een onbestaande resource.", "Wij gebruiken 400 voor ongeldige invoer, niet 422."], "m": "409", "y": "ER_DUP_ENTRY wordt vertaald naar 409 Conflict.", "d": "", "o": "", "u": "games.title heeft een unieke index, idx_game_title_unique. Een tweede spel met dezelfde titel wordt door MySQL geweigerd met ER_DUP_ENTRY. De DrizzleQueryErrorFilter maakt daarvan een 409 Conflict.\n\nDezelfde aanpak gebruiken jullie voor een dubbel e-mailadres (idx_user_email_unique), een dubbele categorienaam (idx_category_name_unique) en een dubbele review (idx_review_user_game_unique). Eén vertaalplaats voor al die gevallen, en geen eigen check in de service."}, {"id": "q080", "ch": "9", "q": "Een derde gebruiker schrijft zich in voor een sessie met maxParticipants 2 en twee bevestigde deelnemers. Wat gebeurt er?", "c": "De inschrijving slaagt met status waitlisted.", "w": ["409, omdat de sessie vol is.", "De inschrijving slaagt met confirmed en de laatste bevestigde wordt van de lijst gehaald.", "404, omdat er geen vrije plaats bestaat."], "x": ["Dat was de eerste versie; nu is er een wachtlijst.", "Niemand wordt verdrongen.", "404 is voor een onbestaande resource."], "m": "waitlisted", "y": "409 komt er alleen als je al deelneemt of al op de wachtlijst staat, of als de capaciteit lager wordt gezet dan het aantal bevestigden.", "d": "", "o": "", "u": "In PlaySessionsService.join telt de service in een transactie de bevestigde deelnemers. Is het aantal gelijk aan of groter dan maxParticipants, dan krijgt de nieuwe deelnemer status 'waitlisted' in plaats van 'confirmed'. De inschrijving slaagt dus altijd, tenzij je al deelneemt.\n\nEen 409 krijg je enkel als je al deelnemer bent (of al op de wachtlijst staat) en bij update als de capaciteit lager wordt gezet dan het aantal bevestigden.\n\nValkuil. Een volle sessie weigert niemand: ze zet hem op de wachtlijst. Dat is het hele nut van de wachtlijst."}, {"id": "q081", "ch": "9", "q": "Een bevestigde deelnemer vertrekt en er staan meerdere mensen op de wachtlijst. Wie schuift door?", "c": "De wachtende met de oudste joinedAt; bij gelijkstand het laagste userId.", "w": ["De wachtende met het laagste userId, ongeacht het tijdstip van inschrijving.", "De wachtende die de host op dat moment zelf kiest.", "De wachtende met de nieuwste joinedAt, want die is het laatst toegevoegd."], "x": ["Het userId is enkel de tiebreaker.", "Er is geen keuze van de host.", "Dat is omgekeerd."], "m": "Eerlijk op volgorde van inschrijving", "y": "Het is een FIFO-wachtrij met een tweede sorteersleutel voor het geval twee tijdstippen gelijk zijn.", "d": "", "o": "een wachtrij met een comparator.", "u": "Bij leave verwijdert de service de rij van de vertrekkende deelnemer en roept daarna promoteWaitlisted aan. Die berekent de vrije plaatsen (maxParticipants min bevestigden), selecteert de wachtenden met orderBy(joinedAt, userId) en limit(vrije plaatsen), en zet hun status op confirmed.\n\nZo schuift wie het langst wacht eerst door. Bij een gelijk tijdstip beslist het laagste userId, zodat de volgorde altijd voorspelbaar is.\n\nOOSD-vergelijking: een wachtrij (FIFO) met een tweede sleutel als comparator."}, {"id": "q082", "ch": "9", "q": "Waarom draait het doorschuiven in een transactie met een vergrendelde sessierij (for update)?", "c": "Gelijktijdige verzoeken kunnen dezelfde vrijgekomen plaats innemen.", "w": ["Een transactie maakt de queries sneller omdat MySQL ze bundelt in één bewerking.", "Zonder transactie zou het tijdstip joinedAt van de wachtenden verloren gaan.", "De cursus verplicht een transactie bij elke schrijfbewerking op een tussentabel."], "x": ["Snelheid is niet het doel.", "joinedAt blijft bestaan.", "Dat is geen cursusregel."], "m": "Lock + transactie", "y": "De bewerkingen lopen achter elkaar, zodat niemand overboekt wordt.", "d": "", "o": "wederzijdse uitsluiting, zoals synchronized, maar in de databank.", "u": "Zonder slot kunnen twee requests tegelijk de vrije plaatsen tellen: allebei zien ze 'één plaats vrij' en allebei nemen ze die. Dan zijn er meer bevestigden dan plaatsen.\n\nlockSession doet een select ... for update op de rij van de sessie. De tweede transactie wacht tot de eerste klaar is en telt daarna op een correcte waarde. Alle schrijfacties (join, leave, update, delete) nemen dat slot.\n\nOOSD-vergelijking: wederzijdse uitsluiting, zoals synchronized rond een kritische sectie, maar in de databank.\n\nValkuil. Het slot is op de sessierij, niet op de hele tabel. Aanvragen op andere sessies hinderen elkaar niet."}, {"id": "q083", "ch": "9", "q": "Wat gebeurt er als de host maxParticipants verhoogt?", "c": "Wachtenden schuiven in volgorde door naar confirmed tot de nieuwe capaciteit bereikt is.", "w": ["Er gebeurt niets; wachtenden moeten zich opnieuw inschrijven om bevestigd te worden.", "Alle wachtenden worden onmiddellijk bevestigd, ook als dat boven de capaciteit uitkomt.", "Het request krijgt een 409 zolang er nog wachtenden op de lijst staan."], "x": ["Dat zou onhandig zijn en het is niet wat de service doet.", "De capaciteit blijft de bovengrens.", "409 geldt voor een capaciteit lager dan het aantal bevestigden."], "m": "Capaciteit omhoog", "y": "Dezelfde logica als bij uitschrijven: oudste joinedAt eerst.", "d": "", "o": "", "u": "In PlaySessionsService.update vergelijkt de service de nieuwe capaciteit met de oude. Is ze groter, dan roept hij promoteWaitlisted aan. Daar komen dezelfde stappen als bij leave: vrije plaatsen berekenen, wachtenden op joinedAt (en userId) sorteren, de eerste N op confirmed zetten.\n\nWordt de capaciteit niet verhoogd (titel, tijdstip of lagere waarde), dan is er geen promotie.\n\nValkuil. Een verlaging onder het aantal bevestigden is geen promotie maar een fout: 409."}, {"id": "q084", "ch": "9", "q": "Wie mag een speelsessie wijzigen of verwijderen?", "c": "De host of een admin, via assertOwner().", "w": ["Elke deelnemer van die sessie, want zij nemen er ook aan deel.", "Alleen de host, want een admin mag nooit andermans sessie wijzigen.", "Elke ingelogde gebruiker, want sessies zijn publieke gegevens."], "x": ["Een deelnemer heeft geen beheerrechten.", "Een admin mag ook (moderatie).", "Dan zou iedereen sessies van anderen kunnen verwijderen."], "m": "Eigenaar of admin", "y": "Alle ingelogde gebruikers kunnen alle sessies bekijken, nodig om in te schrijven. Schrijven vraagt eigenaarschap.", "d": "", "o": "", "u": "Alle ingelogde gebruikers kunnen alle sessies bekijken, want ze moeten kunnen inschrijven. Schrijven (PUT, DELETE) vraagt eigenaarschap: assertOwner(user, session.hostId) laat enkel de host of een admin door, anders 403.\n\nDe check zit in de service omdat die de sessie eerst uit de databank haalt (met het slot) en pas dan kan vergelijken wie de host is. Een guard kent die gegevens niet.\n\nValkuil. Een deelnemer is niet de host. Een deelnemer kan wel zelf leave doen, maar de sessie niet wijzigen."}, {"id": "q085", "ch": "9", "q": "Neemt de host automatisch deel aan zijn eigen sessie?", "c": "Nee; de host kan zich zoals iedereen inschrijven.", "w": ["Ja, hij is altijd confirmed en telt dus mee voor de capaciteit.", "Ja, maar hij telt niet mee voor maxParticipants van de sessie.", "Nee, de host mag zich nooit inschrijven voor zijn eigen sessie."], "x": ["Dat staat zo niet in het ontwerp.", "Er is geen uitzondering voor de telling.", "Er is geen verbod."], "m": "Host ≠ deelnemer", "y": "De host komt uit het token en is niet wijzigbaar.", "d": "", "o": "", "u": "Nee. PlaySessionsService.create voegt enkel een rij in play_sessions in, met hostId uit het token. Er wordt geen rij in play_session_participants aangemaakt. De host is organisator, geen deelnemer, tot hij zich net als iedereen inschrijft.\n\nhostId komt uit het token (user.id) en staat niet in de CreatePlaySessionRequestDto. Een client kan dus niet kiezen wie de host is.\n\nValkuil. 'Host' en 'deelnemer' zijn twee verschillende relaties tussen users en play_sessions: een één-op-veel (hostId) en een veel-op-veel (participants)."}, {"id": "q086", "ch": "9", "q": "Welke route gebruik je om je uit te schrijven?", "c": "DELETE /api/play-sessions/:id/participants/me", "w": ["POST /api/play-sessions/:id/leave", "PUT /api/play-sessions/:id met een lege lijst", "DELETE /api/play-session-participants/:id"], "x": ["Werkwoord in de URI.", "PUT vervangt de sessie, niet de deelname.", "Een tussentabel heeft geen eigen controller."], "m": "REST op de tussentabel via de ouder", "y": "Geen werkwoord in de URI en geen aparte controller voor de tussentabel.", "d": "", "o": "", "u": "De route is DELETE /api/play-sessions/:id/participants/me. De URI beschrijft een resource: de deelname van de huidige gebruiker aan de sessie. Het werkwoord zit in de HTTP-methode (DELETE), niet in het pad.\n\nHet woord 'me' werkt als bij gebruikers: de server haalt de identiteit uit het token. De controller van de sessie beheert de tussentabel; er is geen apart /participants-resource met eigen controller.\n\nValkuil. Een route zoals POST /sessions/:id/leave bevat een werkwoord en past niet bij de REST-conventies van de cursus."}, {"id": "q087", "ch": "9", "q": "Waarom heeft POST /api/play-sessions/:id/participants geen body?", "c": "De deelnemer komt uit het token en de sessie uit de URL.", "w": ["Omdat POST volgens de HTTP-specificatie nooit een body mag hebben.", "Omdat Nest de body weggooit bij geneste routes zoals deze.", "Omdat de status door de client berekend en meegestuurd wordt."], "x": ["POST heeft doorgaans wel een body.", "Nest gooit niets weg.", "De client mag de status niet bepalen."], "m": "Identiteit uit het token", "y": "De server bepaalt zelf confirmed of waitlisted.", "d": "", "o": "", "u": "Alles wat de server nodig heeft, zit al in het request. De sessie staat in de URL (:id). De gebruiker die zich inschrijft, komt uit het token. De status, confirmed of waitlisted, bepaalt de service zelf op basis van de capaciteit.\n\nAls een client de userId of de status kon meesturen, kon hij iemand anders inschrijven of zichzelf bevestigen. Door niets uit de body te nemen, valt er niets te vervalsen.\n\nPrincipe: vertrouw enkel gegevens die de server zelf bepaalt of kan verifiëren."}, {"id": "q088", "ch": "10", "q": "Wat is het verschil tussen OpenAPI en Swagger UI?", "c": "OpenAPI is de beschrijving (JSON/YAML); Swagger UI is de interactieve pagina.", "w": ["OpenAPI is de interactieve pagina; Swagger UI is de beschrijving van de API in JSON.", "OpenAPI is een NestJS-bibliotheek; Swagger UI is een databank voor de documentatie.", "Ze zijn hetzelfde en worden enkel door verschillende teams anders genoemd."], "x": ["Omgekeerd.", "OpenAPI is een specificatie, geen bibliotheek.", "Het zijn twee onderdelen."], "m": "Specificatie versus UI", "y": "Bij ons staat de UI op /docs en de JSON op /docs-json.", "d": "", "o": "", "u": "OpenAPI is een specificatie: een formaat (JSON of YAML) waarin je beschrijft welke routes, parameters, body's en antwoorden je API heeft. Swagger UI is een tool die zo'n document inleest en er een interactieve webpagina van maakt, waar je routes kan uitproberen.\n\nBij jullie staat de UI op /docs en het OpenAPI-document zelf als JSON op /docs-json. Het document wordt gegenereerd uit de code.\n\nOOSD-vergelijking: OpenAPI is het ontwerp (zoals een interface of UML-model), Swagger UI is één manier om het te bekijken."}, {"id": "q089", "ch": "10", "q": "Wat doet SwaggerModule.createDocument()?", "c": "Het scant de applicatie en bouwt het OpenAPI-document uit de decorators.", "w": ["Het publiceert de Swagger UI op de route /docs zodat de pagina bereikbaar is.", "Het schrijft de documentatie handmatig weg in een YAML-bestand op schijf.", "Het valideert de binnenkomende requests tegen de documentatie."], "x": ["Dat is setup().", "De documentatie wordt gegenereerd.", "Swagger valideert niets."], "m": "Document bouwen", "y": "SwaggerModule.setup() publiceert daarna de UI.", "d": "", "o": "", "u": "In main.ts bouw je eerst een DocumentBuilder (titel, beschrijving, bearer-auth). SwaggerModule.createDocument(app, config) scant dan de hele applicatie: controllers, routes en decorators zoals @ApiProperty, en bouwt daaruit het OpenAPI-document.\n\nSwaggerModule.setup('docs', app, document) publiceert het document daarna als Swagger UI op /docs. Eerst maken, dan publiceren.\n\nValkuil. Het document is een momentopname van de code bij het opstarten. Wijzig je een DTO, dan verandert de documentatie mee, zonder dat je iets bijwerkt."}, {"id": "q090", "ch": "10", "q": "Wat levert nestjs-swagger-dto op voor request-DTO's?", "c": "Het combineert validatie en documentatie, zodat je ze niet dubbel schrijft.", "w": ["Het genereert automatisch de migraties voor de velden in de DTO.", "Het vervangt de ValidationPipe door een eigen versie met meer opties.", "Het controleert het JWT in de Swagger UI voor een route uitgevoerd wordt."], "x": ["Migraties komen van drizzle-kit.", "De ValidationPipe blijft.", "Dat doet de AuthGuard."], "m": "Eén decorator voor beide", "y": "Voor response-DTO's gebruik je @ApiProperty.", "d": "", "o": "", "u": "Zonder dat pakket schrijf je op elk veld twee reeksen decorators: class-validator (@IsString, @IsNumber) voor de validatie en @ApiProperty voor de documentatie. Dat is dubbel werk en kan uit sync raken.\n\nMet nestjs-swagger-dto (decorators zoals @IsString({ name, minLength, maxLength, optional }) in jullie DTO's) geef je de eigenschappen één keer op en krijg je validatie én documentatie. Dat zie je in games.dto.ts bij title, minPlayers en maxPlayers.\n\nVoor response-DTO's valideer je niets, dus daar gebruik je gewoon @ApiProperty."}, {"id": "q091", "ch": "10", "q": "Wat is het uitgangspunt van de cursus rond API-documentatie?", "c": "De documentatie wordt grotendeels uit de code gegenereerd.", "w": ["Documentatie schrijf je op het einde van het project in een Word-document.", "Documentatie is enkel nodig voor publieke API's die door derden gebruikt worden.", "De README volstaat als documentatie voor alle routes van de API."], "x": ["Dan loopt ze snel achter.", "Ook interne API's hebben ze nodig.", "De README bevat de opstartinstructies, geen volledige API-documentatie."], "m": "Eén bron van waarheid", "y": "Zo blijft ze synchroon met de code.", "d": "", "o": "zoals Javadoc, de documentatie volgt uit de code.", "u": "De documentatie wordt grotendeels gegenereerd uit de code (decorators op controllers en DTO's), niet apart geschreven. Zo blijft ze synchroon: wijzig je de code, dan wijzigt de documentatie mee.\n\nEen apart Word- of Markdown-document over je API veroudert snel, omdat niemand het bijwerkt.\n\nOOSD-vergelijking: zoals Javadoc, waar de documentatie uit de broncode volgt.\n\nValkuil. 'Documented API' is een evaluatiecriterium. Een onvolledig gedocumenteerde route (zonder antwoordtypes of foutcodes) kost punten."}, {"id": "q092", "ch": "10", "q": "Hoe test je een beveiligde route in Swagger UI?", "c": "Inloggen, het token kopiëren, Authorize klikken en dan 'Try it out'.", "w": ["De server onthoudt je login na de eerste aanroep automatisch voor de volgende requests.", "Het token als query-parameter in de URL plakken bij elke aanroep.", "De route eerst @Public() maken zodat Swagger er zonder token bij kan."], "x": ["De server is stateless.", "Tokens horen niet in een URL.", "Dat zou de beveiliging uitschakelen."], "m": "addBearerAuth()", "y": "DocumentBuilder.addBearerAuth() activeert de Authorize-knop.", "d": "", "o": "", "u": "Stap 1: roep POST /api/auth/login aan en kopieer het token uit het antwoord. Stap 2: klik op Authorize rechtsboven en plak het token. Stap 3: gebruik 'Try it out' op een beveiligde route. Swagger stuurt het token voortaan mee in de Authorization-header.\n\nDe Authorize-knop bestaat dankzij DocumentBuilder.addBearerAuth() in main.ts. Zonder die regel is er geen manier om een token in te geven.\n\nValkuil. Het token verloopt na een uur. Krijg je plots overal 401, log dan opnieuw in."}, {"id": "q093", "ch": "11", "q": "Wat is het verschil tussen onze *.e2e-spec.ts-testen en wat de cursus 'end-to-end' noemt?", "c": "Integratietesten van de API met een echte databank; e2e in de cursus gaat via de UI.", "w": ["Ze zijn hetzelfde: e2e betekent dat elke route van begin tot einde getest wordt.", "Onze testen zijn unit-testen, omdat ze telkens één controller tegelijk aanspreken.", "E2E-testen gebruiken een in-memory databank, integratietesten een echte databank."], "x": ["De cursus onderscheidt ze.", "Onze testen doorlopen validatie, auth en databank samen.", "Dat is niet het onderscheid."], "m": "Integratietest", "y": "De bestandsnaam is een conventie van Nest. De cursus richt zich op integratietesten.", "d": "", "o": "", "u": "In de cursus is een end-to-end test een test die de volledige keten doorloopt, inclusief de gebruikersinterface. Jullie testen sturen echte HTTP-requests naar de API met supertest en gebruiken een echte MySQL-databank, maar er is geen front-end. Dat zijn integratietesten van de API.\n\nDe bestandsnaam .e2e-spec.ts is gewoon een conventie van de Nest CLI en zegt niets over het type.\n\nValkuil. In het dossier noem je ze integratietesten. De opdracht vraagt 'niet-triviale, werkende integratietesten'."}, {"id": "q094", "ch": "11", "q": "Waarom Testcontainers voor de integratietesten?", "c": "Elke testrun start een echte MySQL-container met de migraties.", "w": ["Testcontainers vervangt de databank door mockobjecten, zodat de tests sneller verlopen.", "Zo hoeven de tests geen migraties meer uit te voeren, omdat de container ze al heeft.", "Het is verplicht zodra je Jest en supertest samen gebruikt in een NestJS-project."], "x": ["Dan test je de unieke indexen en foreign keys niet.", "De setup voert ze wel uit.", "Het is een keuze."], "m": "Echte databank in een container", "y": "jest.global-setup start één container voor de hele run, zet DATABASE_URL en draait de migraties; jest.global-teardown stopt hem.", "d": "", "o": "", "u": "Testcontainers start voor de testrun automatisch een echte MySQL-container (mysql:8.0) via Docker. jest.global-setup start één container voor de hele run, zet DATABASE_URL, draait de migraties met pnpm db:migrate en jest.global-teardown stopt hem.\n\nHet voordeel: iedere ontwikkelaar of CI-machine met Docker heeft dezelfde, schone databank. Er is geen gedeelde testdatabank nodig die iemand moet installeren of opruimen.\n\nValkuil. De testen hebben Docker nodig. Zonder draaiende Docker kan Testcontainers niet starten."}, {"id": "q095", "ch": "11", "q": "Waarom draaien de testen met --runInBand?", "c": "De suites lopen na elkaar zodat de gedeelde databank consistent blijft.", "w": ["Jest kan TypeScript-bestanden alleen sequentieel compileren, dus parallel kan niet.", "Anders start elke suite een eigen MySQL-container en raakt Docker overbelast.", "Anders wordt er geen coverage-rapport gegenereerd door Jest."], "x": ["Dat is niet de reden.", "De container is globaal, één voor de run.", "Coverage werkt los hiervan."], "m": "Eén databank", "y": "Parallel draaien zou testdata door elkaar halen.", "d": "", "o": "", "u": "Jest voert testbestanden standaard parallel uit in meerdere workers. Jullie suites delen één MySQL-container. Twee suites die tegelijk dezelfde tabellen vullen en wissen, zouden elkaars data zien en willekeurig falen.\n\n--runInBand draait de suites na elkaar in één proces. Dat is trager, maar de uitkomst is voorspelbaar.\n\nValkuil. 'Soms faalt een test' bij parallelle suites met gedeelde data wijst vrijwel altijd op dit probleem."}, {"id": "q096", "ch": "11", "q": "Wat zegt een coverage van 94,65% statements?", "c": "Dat dat deel van de code is uitgevoerd, niet dat de tests zinvol zijn.", "w": ["Dat 94,65% van de mogelijke fouten door de tests wordt opgevangen.", "Dat 94,65% van de routes correct werkt wanneer de applicatie in productie draait.", "Dat elke service afzonderlijk boven de 90% zit, ook die voor Cloudinary."], "x": ["Coverage meet geen fouten.", "Dat zegt niets over productie.", "Cloudinary zit bijvoorbeeld op 41%."], "m": "Uitvoering, geen kwaliteit", "y": "Lage waarden zoals cloudinary.service.ts (gemockt) laten zien welke code de tests niet raken. Het criterium vraagt minstens één entiteit in de REST-laag met 90% of meer.", "d": "", "o": "", "u": "Coverage meet welk deel van de code tijdens de testen is uitgevoerd. 94,65% betekent dat bijna alle statements minstens één keer zijn aangeraakt. Het zegt niet dat de testen de juiste dingen controleren: een test zonder asserts kan veel coverage geven.\n\nLage waarden in het rapport tonen de blinde vlekken, zoals cloudinary.service.ts, dat gemockt wordt. De opdracht vraagt minstens één entiteit in de REST-laag met 90% of meer coverage, plus tests voor de gebruikersrouten.\n\nValkuil. Coverage is een ondergrens voor kwaliteit, geen bewijs."}, {"id": "q097", "ch": "11", "q": "Waarom wordt CloudinaryService in de tests vervangen met overrideProvider?", "c": "Zo heeft de suite geen netwerk of sleutels nodig.", "w": ["Omdat Cloudinary geen testomgeving of sandbox aanbiedt voor ontwikkelaars.", "Omdat de echte service de databank zou wijzigen tijdens de test.", "Omdat overrideProvider de enige manier is om een service te testen."], "x": ["Dat is geen reden.", "Cloudinary raakt de databank niet.", "Je kan services ook rechtstreeks testen."], "m": "Test double via DI", "y": "De stub geeft een vaste URL terug.", "d": "", "o": "stub/mock; mogelijk dankzij DI.", "u": "In de test-module zeg je: 'waar iemand CloudinaryService vraagt, geef deze stub'. De stub geeft een vaste URL terug. De echte service zou een afbeelding naar het internet uploaden en echte API-sleutels vragen.\n\nHet voordeel is dat de suite snel is, deterministisch en geen netwerk of sleutels nodig heeft. De rest van de keten (guards, pipes, controller, databank) blijft echt.\n\nOOSD-vergelijking: een stub of mock, mogelijk gemaakt door dependency injection.\n\nValkuil. De test bewijst niet dat Cloudinary echt werkt. Dat is een bewuste afweging en een gekend zwak punt."}, {"id": "q098", "ch": "11", "q": "Wat is de testpiramide?", "c": "Veel snelle unit tests onderaan, weinig trage e2e-testen bovenaan.", "w": ["Veel e2e-testen onderaan en weinig unit tests bovenaan, omdat e2e het meest zegt.", "Evenveel tests van elk type, zodat alles gelijk gedekt is.", "Een model voor de hiërarchie van testers in een team."], "x": ["Omgekeerd.", "Dat is niet het idee.", "Het gaat om testtypes."], "m": "Hoger = trager en duurder", "y": "De vorm toont hoeveel je van elk type wilt.", "d": "", "o": "", "u": "De piramide toont de verhouding tussen testtypes. Onderaan staan veel unit tests: snel, klein, geïsoleerd. In het midden integratietesten. Bovenaan weinig end-to-end-tests: traag, breed, duur om te onderhouden.\n\nJullie project is eerder omgekeerd: veel integratietesten (168 tests in 7 suites) en één unit-testbestand (ownership.spec.ts, 3 tests). Dat is een bewuste keuze, want de opdracht vraagt integratietesten, maar het blijft een eerlijk zwak punt.\n\nValkuil. De piramide is een richtlijn, geen regel. Je moet je keuze kunnen verklaren."}, {"id": "q099", "ch": "11", "q": "Waarom testen jullie liever tegen een echte databank dan tegen een mock?", "c": "Een mock bootst unieke indexen en foreign keys niet na.", "w": ["Omdat mocks in TypeScript niet bestaan en niet door Jest ondersteund worden.", "Omdat een echte databank sneller is dan een mock en dus tijd bespaart.", "Omdat de cursus het gebruik van unit tests met mocks uitdrukkelijk verbiedt."], "x": ["Mocks bestaan wel.", "Een echte databank is trager.", "De cursus noemt unit tests met mocks als mogelijke uitbreiding."], "m": "Realisme", "y": "Het nadeel is trager en meer infrastructuur (Docker).", "d": "", "o": "", "u": "Een mock bootst enkel na wat jij erin programmeert. Een unieke index, een foreign key of een onDelete-regel bestaan in een mock niet, terwijl jullie logica er sterk op steunt: een dubbele review wordt geweigerd door een index, een spel met sessies door onDelete 'no action'.\n\nMet een echte MySQL (Testcontainers) test je dus ook het gedrag van het schema, de transacties en de wachtlijstslot. Het nadeel is trager en meer infrastructuur (Docker).\n\nValkuil. Een test die met een mock slaagt, kan in productie falen op een databankregel die de mock negeert."}, {"id": "q100", "ch": "11", "q": "Wat is de enige unit test in het project?", "c": "ownership.spec.ts, voor assertOwner().", "w": ["games.service.spec.ts, voor de service van de spellen.", "auth.guard.spec.ts, voor de AuthGuard.", "Er zijn helemaal geen unit tests in het project."], "x": ["Die bestaat niet.", "Die bestaat niet.", "Er is er één."], "m": "Weinig unit tests", "y": "Dat is een eerlijk zwak punt; unit tests met mocks zijn een logische uitbreiding.", "d": "", "o": "", "u": "ownership.spec.ts test assertOwner() met drie tests: de eigenaar mag, een admin mag, een andere gebruiker krijgt een ForbiddenException. De functie is zuiver (geen databank, geen netwerk), ideaal voor een snelle unit test.\n\nDe rest is integratietest. Het ontbreken van meer unit tests (bijvoorbeeld voor de wachtlijstlogica met een gemockte databank) is een eerlijk zwak punt dat je zelf mag benoemen, samen met hoe je het zou verbeteren.\n\nOOSD-vergelijking: een pure functie zonder afhankelijkheden hoeft geen test double."}, {"id": "q101", "ch": "11", "q": "Wat doet testAuthHeader in onze testen?", "c": "Een helper die voor elke beveiligde route de 401-gevallen test.", "w": ["Een functie die automatisch tokens genereert voor admins in elke test.", "Een mock van de AuthGuard waardoor de test de login overslaat.", "Een decorator die routes tijdens de test publiek maakt."], "x": ["Tokens komen van de login-helper.", "De echte guard draait in de test.", "Dat zou de beveiliging omzeilen."], "m": "Herbruikbaar", "y": "Tokens halen we op met test/helpers/login.ts en sturen we mee met .auth(token, { type: 'bearer' }).", "d": "", "o": "", "u": "testAuthHeader staat in test/helpers/testAuthHeader.ts. Het is een helper die, voor een route, controleert dat een request zonder token 401 geeft en een request met een ongeldig token ook. Je roept ze op met een functie die het request bouwt, bijvoorbeeld testAuthHeader(() => request(server).put(url)).\n\nZo herhaal je de 401-tests niet in elke suite. Tokens haal je op met test/helpers/login.ts en je stuurt ze mee met .auth(token, { type: 'bearer' }).\n\nPrincipe: DRY, ook in testcode."}, {"id": "q102", "ch": "11", "q": "Wat zegt de cursus over opruimen van testdata?", "c": "Echt herstel je de databank per test (beforeEach/afterEach).", "w": ["Je mag nooit opruimen; testdata moet na de test blijven staan.", "Opruimen gebeurt automatisch door Jest na elke suite, zonder code.", "Alleen de eerste test mag data aanmaken; de rest hergebruikt die."], "x": ["Dan zijn tests niet herhaalbaar.", "Jest ruimt niets op.", "Dat zou tests afhankelijk van volgorde maken."], "m": "beforeEach / afterEach", "y": "Per test herstellen voorkomt dat tests elkaar beïnvloeden.", "d": "", "o": "", "u": "Tests moeten onafhankelijk zijn: de uitkomst van een test mag niet afhangen van wat een andere test achterliet. De cursus zegt daarom: herstel de databank per test (beforeEach of afterEach), bijvoorbeeld door de testdata opnieuw in te voegen.\n\nDat voorkomt dat een test faalt omdat een vorige een rij overliet, of net slaagt dankzij die rij.\n\nValkuil. Eén keer opruimen na de hele suite lijkt efficiënter, maar tests die van elkaar afhangen, zijn moeilijk te debuggen."}, {"id": "q103", "ch": "12", "q": "Waarom een multi-stage Dockerfile?", "c": "De eindimage bevat alleen productie-afhankelijkheden en de gebouwde code, geen dev-tools.", "w": ["Zo kunnen de testen in dezelfde image draaien als de productieapp, zonder extra configuratie.", "Docker laat maar één commando per stage toe, dus bouwen en draaien moeten gescheiden.", "Elke stage start een eigen container, waardoor de app sneller opstart."], "x": ["Dat zou dev-tools in productie brengen.", "Dat is niet waar.", "Stages bestaan enkel tijdens het bouwen."], "m": "Kleine image", "y": "Stages: base, dev-deps, prod-deps, builder en runner. Kleiner is sneller en heeft minder aanvalsoppervlak.", "d": "", "o": "", "u": "Je bouwt een Node-app met veel dev-afhankelijkheden (TypeScript, compiler, testtools) die je in productie niet nodig hebt. Met een multi-stage Dockerfile gebruik je meerdere FROM-stappen: base, dev-deps, prod-deps, builder en runner. De finale stage (runner) kopieert enkel de productie-afhankelijkheden en de gebouwde code uit de vorige stages.\n\nResultaat: een kleinere image, sneller te downloaden en te starten, en met minder aanvalsoppervlak (geen compilers of dev-tools in productie).\n\nValkuil. Een stage is geen aparte container tijdens het draaien. Stages bestaan enkel bij het bouwen."}, {"id": "q104", "ch": "12", "q": "Wat doet depends_on met condition: service_healthy bij de api-service?", "c": "De API start pas als de databank-healthcheck slaagt.", "w": ["De API en de databank worden samengevoegd in één container.", "De databank wordt herstart zodra de API een fout geeft.", "De API wacht tot de seed is uitgevoerd."], "x": ["Het blijven twee services.", "Er is geen herstartlogica.", "De seed draait apart en nooit automatisch."], "m": "Wachten op gezondheid", "y": "Alleen depends_on wacht enkel tot de container gestart is. Met service_healthy wacht Compose tot de check slaagt.", "d": "", "o": "", "u": "depends_on zonder voorwaarde wacht enkel tot de container van de databank gestart is. Maar MySQL heeft nog seconden nodig voor hij verbindingen aanneemt. De API zou opstarten, niet kunnen verbinden en crashen.\n\nMet condition: service_healthy wacht Compose tot de healthcheck van de db-service slaagt. Pas dan start de API. Zo volgt de volgorde de echte beschikbaarheid, niet enkel de opstart.\n\nValkuil. 'Gestart' is niet 'klaar'. Daarom bestaat de healthcheck."}, {"id": "q105", "ch": "12", "q": "Wat is het verschil tussen docker compose down en docker compose down -v?", "c": "Met -v wordt ook het volume en dus alle databankdata verwijderd.", "w": ["Met -v worden ook de gebouwde images verwijderd, zodat je ze opnieuw moet bouwen.", "Met -v worden de containers herstart in plaats van gestopt en verwijderd.", "Met -v wordt alleen het netwerk verwijderd en blijven de containers staan."], "x": ["Images verwijder je met --rmi.", "Herstarten is restart.", "Het netwerk gaat sowieso weg."], "m": "-v = volumes", "y": "Zonder -v blijft db_data bewaard en zijn de data er bij de volgende start nog.", "d": "", "o": "", "u": "docker compose down stopt en verwijdert de containers en het netwerk. De data staat in een benoemd volume (db_data), dat bij down blijft bestaan. Bij de volgende start zijn de gegevens er nog.\n\nMet -v verwijder je ook de volumes, dus alle databankdata. Dat is nuttig voor een schone start (bijvoorbeeld om de eerste-start-situatie van een lector na te bootsen), maar je verliest alles.\n\nValkuil. -v is destructief en niet te herstellen. Gebruik het bewust."}, {"id": "q106", "ch": "12", "q": "Welke aanpassing loste de crash bij de allereerste start op?", "c": "De healthcheck met -h 127.0.0.1, die een netwerkverbinding afdwingt.", "w": ["De healthcheck verlengen naar tien minuten zodat MySQL voldoende tijd krijgt.", "Een vaste pauze van 30 seconden inbouwen vóór de API start.", "De poort van MySQL wijzigen zodat de init-server niet in de weg zit."], "x": ["Langer wachten lost de oorzaak niet op.", "Een vaste pauze is fragiel.", "De poort was niet het probleem."], "m": "127.0.0.1 in plaats van localhost", "y": "Bij de eerste start draait MySQL tijdelijk een init-server die enkel via een socket bereikbaar is. localhost gebruikt dat socket en meldt dus 'gezond'; 127.0.0.1 gebruikt TCP, dat pas opent bij de echte server.", "d": "Dit bleek enkel bij een lege databank, precies de situatie bij een lector.", "o": "", "u": "Bij een lege databank start MySQL eerst een tijdelijke init-server die enkel via een Unix-socket bereikbaar is. De healthcheck mysqladmin ping -h localhost gebruikt dat socket, ziet de init-server en meldt 'gezond'. Daardoor startte de API te vroeg en crashte hij, want de echte server (via TCP) was nog niet klaar.\n\nMet -h 127.0.0.1 forceer je een TCP-verbinding. Die opent pas op de echte server, dus de healthcheck slaagt pas als de databank echt klaar is.\n\nDit bleek enkel bij een lege databank, precies de situatie bij een lector die voor het eerst start. Daarom is het zo belangrijk te testen met down -v."}, {"id": "q107", "ch": "12", "q": "Waarom stopte de container eerst met exitcode 137?", "c": "Het proces stopte niet netjes en Docker doodde het na 10 seconden (SIGKILL).", "w": ["De container had te weinig geheugen en werd door de out-of-memory killer gestopt.", "Een fout in de migraties liet het proces crashen vlak na het opstarten.", "De healthcheck faalde vijf keer op rij, waarna Docker de container stopte."], "x": ["Dan zou het OOM-killer zijn; hier was het een time-out.", "Migraties draaien bij het opstarten.", "Een falende healthcheck stopt de container niet."], "m": "137 = 128 + 9 (SIGKILL)", "y": "Zonder app.enableShutdownHooks() reageert Nest niet op SIGTERM.", "d": "", "o": "", "u": "Exitcode 137 betekent 128 + 9: het proces werd gedood met SIGKILL. Docker stuurt eerst SIGTERM en wacht standaard 10 seconden. Reageert het proces niet, dan volgt SIGKILL.\n\nZonder app.enableShutdownHooks() reageert Nest niet op SIGTERM: de lifecycle-hooks (zoals onModuleDestroy) draaien niet en de pool blijft open. Docker wacht dus 10 seconden en doodt dan de container.\n\nMet de regel stopt de container in ongeveer 0,2 seconden met exitcode 0.\n\nValkuil. Een trage stop met code 137 is een signaal dat de shutdown niet netjes verloopt."}, {"id": "q108", "ch": "12", "q": "Waarom staat de databankdata in een volume?", "c": "De data blijft bewaard buiten de container, ook als die vervangen wordt.", "w": ["Een volume maakt de databank sneller dan wanneer de data in de container staat.", "Zonder volume kan MySQL niet starten in een container.", "Een volume is nodig om de seed te kunnen uitvoeren."], "x": ["Snelheid is niet het doel.", "MySQL start ook zonder.", "De seed werkt ook zonder volume."], "m": "db_data", "y": "Een container is vluchtig; een volume niet.", "d": "", "o": "", "u": "Een container is vluchtig: wordt hij verwijderd of vervangen (docker compose down, een nieuwe image), dan is zijn bestandssysteem weg. Een volume is opslag buiten de container, beheerd door Docker. Het overleeft het verwijderen of herstarten van de container.\n\nVoor een databank is dat noodzakelijk. Zonder volume verlies je alle gegevens bij elke herbouw.\n\nValkuil. Een volume is geen back-up. Verwijder je het (down -v), dan is de data weg."}, {"id": "q109", "ch": "12", "q": "Hoe start je het project met één commando?", "c": "docker compose up --build -d --wait", "w": ["pnpm start:all, dat backend en databank samen opstart.", "docker run backend, met de gebouwde image van de API.", "node dist/main.js, zodra het project gebouwd is."], "x": ["Dat script bestaat niet in dit project.", "Dat start enkel één container, zonder databank.", "Dat vereist een eigen databank en een build."], "m": "Compose", "y": "De seed draai je apart: docker compose exec api node dist/src/drizzle/seed.js. Dit is een ontvankelijkheidscriterium.", "d": "", "o": "", "u": "docker compose up --build -d --wait bouwt de images (--build), start alles op de achtergrond (-d) en wacht tot de services gezond zijn (--wait). Zo start het project met één commando, zoals de opdracht vraagt: 'Starts with one command listed in the README'.\n\nDe seed is bewust een apart commando: docker compose exec api node dist/src/drizzle/seed.js. Hij draait nooit automatisch, zodat een productiedatabank niet per ongeluk overschreven wordt.\n\nValkuil. De migraties draaien wel automatisch bij het opstarten (DrizzleModule.onModuleInit), dus het schema is er meteen. Alleen de testdata ontbreekt tot je de seed draait."}, {"id": "q110", "ch": "12", "q": "Welke waarden van de API-container hebben voorrang op .env.example?", "c": "NODE_ENV, PORT en DATABASE_URL, die in de compose zelf staan.", "w": ["Geen enkele; env_file wint altijd van de waarden in de compose.", "Alle waarden in backend/.env, omdat die het laatst ingelezen worden.", "Enkel de secrets, omdat die extra beschermd zijn."], "x": ["environment in de compose heeft voorrang op env_file.", "Die zijn optioneel en staan onder de compose.", "Secrets krijgen geen speciale behandeling."], "m": "Compose-waarden eerst", "y": "Zo wijst DATABASE_URL naar de db-service in plaats van naar localhost.", "d": "", "o": "", "u": "De api-service in docker-compose.yml leest backend/.env.example via env_file, en zet daarnaast zelf enkele variabelen onder environment: NODE_ENV, PORT en DATABASE_URL. Waarden in environment winnen van env_file.\n\nDat is nodig voor DATABASE_URL: in .env.example staat localhost, wat in een container naar de container zelf wijst. De compose zet de URL op de service-naam db, de databank in het Docker-netwerk.\n\nValkuil. 'localhost' binnen een container is niet je computer. Andere services bereik je via hun servicenaam."}, {"id": "q111", "ch": "13", "q": "Waarom mergen jullie met --no-ff en nooit met squash?", "c": "Zo blijft elke commit zichtbaar in main, zoals de criteria vragen.", "w": ["Squash is in GitHub niet beschikbaar voor pull requests met meerdere commits.", "Met --no-ff worden mergeconflicten automatisch opgelost, ook bij hetzelfde bestand.", "Een merge commit voorkomt dat de branch daarna nog gebruikt kan worden."], "x": ["Squash bestaat in GitHub.", "Conflicten los je zelf op.", "Een branch blijft gewoon bestaan."], "m": "Merge commit", "y": "Elke student moet minstens ongeveer 10 kleine, betekenisvolle commits kunnen tonen.", "d": "", "o": "", "u": "Een merge commit (--no-ff) behoudt alle commits van de feature-branch in de geschiedenis van main. Een squash voegt ze samen tot één commit en verbergt wie wat in welke stappen deed.\n\nDe opdracht beoordeelt individuele bijdragen op basis van commits, branches, PR's en reviews, en vraagt minstens ongeveer 10 kleine, betekenisvolle commits per feature-branch. Met squash zie je die niet meer in main.\n\nValkuil. Fast-forward merge laat geen merge commit achter. Daarom --no-ff."}, {"id": "q112", "ch": "13", "q": "Waarom ontstond een mergeconflict in app.module.ts?", "c": "Beide branches voegen op dezelfde plek een regel toe om hun module te registreren.", "w": ["Drizzle genereert bij elke nieuwe module het schema en de migraties opnieuw.", "De globale guards moeten bij elke merge opnieuw geregistreerd worden in de module.", "Twee branches in Git mogen niet dezelfde databanktabel gebruiken."], "x": ["Het schema staat in schema.ts.", "Guards staan al in de module.", "Dat is geen regel."], "m": "Zelfde plek", "y": "Je lost het op door beide registraties te bewaren, git add en commit.", "d": "", "o": "", "u": "Elke feature-branch registreert zijn module in app.module.ts: een nieuwe regel in imports en een import bovenaan. Twee branches die op dezelfde plek een regel toevoegen, geven bij het mergen een conflict: git weet niet in welke volgorde of welke wint.\n\nJe lost het op door beide registraties te bewaren, de conflictmarkeringen te verwijderen, git add en commit.\n\nValkuil. Kies niet 'ours' of 'theirs' blindelings: dan verdwijnt de module van één branch uit de app."}, {"id": "q113", "ch": "13", "q": "Welke review geldt als inhoudelijk?", "c": "Een opmerking over concrete code of gedrag van de PR.", "w": ["Een goedkeuring met de bevestiging dat de pull request netjes en volledig is.", "Een opmerking over de titel en beschrijving van de pull request zelf.", "Een samenvatting van de wijzigingen, in de eigen woorden van de reviewer."], "x": ["Dat zegt niets over de code.", "Dat is vorm, geen inhoud.", "Een samenvatting geeft geen feedback."], "m": "Over de code", "y": "De opdracht controleert expliciet of er op elke PR inhoudelijke feedback van de andere student staat.", "d": "", "o": "", "u": "De opdracht controleert expliciet of er op elke PR inhoudelijke feedback van de andere student staat. Een goedkeuring zonder commentaar ('LGTM') volstaat niet.\n\nInhoudelijk is een opmerking over concrete code of gedrag: een bug, een ontbrekende validatie, een betere naam, een ontbrekende test. Voorbeeld uit jullie project: de bevinding dat het verwijderen van een spel met sessies een 500 gaf.\n\nValkuil. De reviewer geeft feedback maar voegt geen code toe aan de branch van de ander."}, {"id": "q114", "ch": "13", "q": "Wat is de Feature Branch Workflow?", "c": "Elke feature of taak krijgt een eigen branch die via een pull request wordt gemerged.", "w": ["Iedereen werkt rechtstreeks op main met korte commits en pusht meermaals per dag.", "Er is één branch per student voor het hele semester.", "Features worden in aparte repositories ontwikkeld en later samengevoegd."], "x": ["Dat is trunk-based zonder branches.", "Dan is de branch geen feature.", "Eén repository is vereist."], "m": "Branch per feature", "y": "De andere student reviewt de PR met minstens één inhoudelijke opmerking.", "d": "", "o": "", "u": "Elke taak of feature krijgt een eigen branch, afgesplitst van main. Je werkt daar met kleine commits, opent een pull request, en de andere student reviewt. Na goedkeuring wordt de branch met een merge commit in main gevoegd.\n\nZo blijft main altijd werkend, kan je parallel werken zonder elkaars werk te breken, en is de bijdrage per student zichtbaar. De auteur schrijft de PR-beschrijving (wat, waarom, hoe getest) en beantwoordt vragen.\n\nValkuil. Rechtstreeks op main committen is in strijd met de workflow."}, {"id": "q115", "ch": "13", "q": "In welke volgorde plande je de branches?", "c": "Setup en auth, één schema-branch, games en reviews parallel, sessies, finalize.", "w": ["Alles tegelijk in één grote branch, zodat er geen conflicten zijn.", "Eerst Docker, dan de tests en pas daarna de features zelf.", "Eerst alle migraties per feature, dan de gedeelde code."], "x": ["Dan is er geen Feature Branch Workflow.", "Docker en tests kwamen op het einde.", "Migraties per feature botsen in de journal."], "m": "Afhankelijkheden bepalen volgorde", "y": "Alles hangt af van de globale guards uit auth. Eén schema-branch voorkomt migratieconflicten.", "d": "", "o": "", "u": "Eerst chore/project-setup en feature/auth, want alle andere routes hangen af van de globale guards uit auth. Daarna één chore/schema-update met alle schema- en migratiewijzigingen. Daarna games en reviews parallel, dan sessies (met wachtlijst), en tot slot chore/finalize.\n\nWaarom één schema-branch: elke migratie wijzigt migrations/meta/_journal.json. Zo voorkom je migratieconflicten tussen parallelle branch
