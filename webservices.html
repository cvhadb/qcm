es.\n\nPrincipe: bepaal afhankelijkheden vooraf. Wat anderen blokkeert, doe je eerst."}, {"id": "q116", "ch": "13", "q": "Welk patroon volgen de commitberichten?", "c": "type(scope): omschrijving, bijvoorbeeld feat(games): add image upload.", "w": ["Een vrije zin met de datum vooraan, zodat de geschiedenis chronologisch leest.", "Het ticketnummer gevolgd door de naam van de auteur.", "Alleen het woord update en een volgnummer."], "x": ["Dat is geen conventie.", "Er zijn geen tickets.", "Dat zegt niets."], "m": "Conventionele commits", "y": "Typen: feat, fix, test, docs, chore.", "d": "", "o": "", "u": "Jullie gebruiken Conventional Commits: type(scope): omschrijving, bijvoorbeeld feat(games): add image upload. Het type zegt wat voor wijziging het is: feat (nieuwe functionaliteit), fix (bugfix), test, docs, chore (onderhoud). De scope zegt waar: games, auth, categories.\n\nHet voordeel is een leesbare geschiedenis. Je ziet in één blik wat er gebeurd is, en het is makkelijker om bijdragen per student te beoordelen.\n\nValkuil. 'update stuff' of 'wip' zegt niets en is geen betekenisvolle commit."}, {"id": "q117", "ch": "13", "q": "Waarom is het commitaantal per student een ontvankelijkheidscriterium?", "c": "Het toont regelmatig werk in kleine, betekenisvolle commits.", "w": ["Het bewijst dat de code zonder fouten is, omdat elke wijziging apart gecontroleerd werd.", "Het bepaalt rechtstreeks de score voor de code coverage.", "Het is een manier om de gewerkte uren per student te registreren."], "x": ["Het aantal zegt niets over fouten.", "Coverage staat los hiervan.", "Het gaat om werkwijze, niet om uren."], "m": "Geschiedenis zichtbaar", "y": "Daarom merge je met een merge commit en niet met squash.", "d": "", "o": "", "u": "De opdracht verlangt dat elke student minstens twee feature-branches heeft, elk met een PR en minstens 10 kleine, betekenisvolle commits. Dat toont dat je regelmatig en zelfstandig werkte, en laat de lectoren jouw bijdrage onderscheiden van die van je partner.\n\nDaarom merge je met een merge commit en niet met squash: een squash zou alle commits tot één samenvatten. Wie dit niet haalt, krijgt 'Afwezig'.\n\nValkuil. Eén grote commit met alles erin voldoet niet, ook al is de code goed."}, {"id": "q118", "ch": "14", "q": "Welk OOSD-principe past het best bij dependency injection?", "c": "Dependency Inversion: de afhankelijkheid wordt aangereikt in plaats van zelf gemaakt.", "w": ["Open/Closed: een klasse is open voor uitbreiding via overerving en gesloten voor wijziging.", "Liskov Substitution: subklassen moeten de basisklasse overal kunnen vervangen.", "Interface Segregation: een interface bevat geen methodes die de gebruiker niet nodig heeft."], "x": ["Dat gaat over uitbreiden zonder te wijzigen.", "Dat gaat over correcte overerving.", "Dat gaat over de grootte van interfaces."], "m": "DIP / IoC", "y": "De container (Nest) maakt de objecten; de klasse vraagt ze aan in de constructor.", "d": "", "o": "", "u": "Dependency Inversion: een klasse hangt af van een abstractie die van buiten wordt aangereikt, niet van een concrete klasse die hij zelf aanmaakt. In Nest vraagt GamesService in de constructor een Drizzle-provider en de container maakt en levert die.\n\nHet is nauw verwant met Inversion of Control: niet jouw code beheert de levenscyclus van objecten, maar het framework (de container). Dat maakt de klasse los gekoppeld en testbaar.\n\nValkuil. Dependency Inversion zegt 'hang af van abstracties'. Dependency Injection is de techniek om dat in te vullen."}, {"id": "q119", "ch": "14", "q": "Welke OOSD-laag komt overeen met een NestJS-service?", "c": "De Service Layer met de domeinlogica.", "w": ["De presentatielaag, met de routes en de DTO's.", "De persistentielaag, met de ORM en de databank.", "De deploymentlaag, met Docker en de configuratie."], "x": ["Dat is de controller met DTO's.", "Dat is Drizzle met MySQL.", "Dat bestaat niet in de lagen van de applicatie."], "m": "Domeinlogica", "y": "De controller is de presentatielaag; Drizzle de persistentielaag.", "d": "", "o": "", "u": "In een gelaagde architectuur is de Service Layer de laag met de domeinlogica en de regels van de toepassing. In Nest is dat de service: PlaySessionsService met de wachtlijst, GamesService met categoriekoppeling en gemiddelde score.\n\nDe controller is de presentatielaag (HTTP in en uit). Drizzle is de persistentielaag. Elke laag praat enkel met de laag eronder.\n\nValkuil. De rubric vraagt dat de servicelaag geen SQL of databankgerelateerde code bevat. Jullie verdedigen dat met: Drizzle is de repository, niet de service."}, {"id": "q120", "ch": "14", "q": "Welk OOSD-patroon lijkt het best op de pipeline van guards, interceptors en pipes?", "c": "Chain of Responsibility: elke schakel kan stoppen of doorgeven.", "w": ["Singleton: één enkele instantie voor het hele systeem.", "Observer: schakels worden verwittigd wanneer er iets gebeurt.", "Builder: het request wordt stap voor stap opgebouwd."], "x": ["Dat gaat over één instantie.", "De schakels worden niet verwittigd, ze worden na elkaar doorlopen.", "Het request wordt niet opgebouwd, wel gecontroleerd en omgezet."], "m": "Ketting", "y": "Een guard die weigert stopt de ketting; een pipe die faalt ook.", "d": "", "o": "", "u": "Chain of Responsibility: een request gaat door een ketting van handlers. Elke schakel kan het request verwerken, stoppen of doorgeven. Een guard die weigert, stopt de ketting. Een pipe die faalt, ook.\n\nDat verklaart waarom je een controller zo mager kan houden: alles wat controle is (identiteit, rechten, geldigheid van data) is al gebeurd voor hij aan de beurt is.\n\nValkuil. Het Decorator-pattern lijkt op een interceptor (omwikkelen), maar de pipeline als geheel is een ketting."}, {"id": "q121", "ch": "14", "q": "Wat is play_session_participants in UML-termen?", "c": "Een associatieklasse op de veel-op-veel tussen User en PlaySession.", "w": ["Een overerving van PlaySession, met extra attributen voor de deelnemers.", "Een aggregatie waarbij een sessie zijn deelnemers bezit en meeneemt bij verwijdering.", "Een interface die PlaySession implementeert voor de deelnemers."], "x": ["Er is geen is-een relatie.", "Een gebruiker bestaat los van de sessie.", "Een interface is geen datamodel."], "m": "Associatieklasse", "y": "Een gewone veel-op-veel zonder attributen, zoals Game en Category, wordt in de relationele databank een pure tussentabel.", "d": "", "o": "", "u": "Een gewone veel-op-veel relatie in UML heeft geen eigen attributen. Heeft de relatie zelf gegevens, hier status en joinedAt, dan modelleer je een associatieklasse tussen User en PlaySession. In de relationele databank wordt dat een tussentabel met extra kolommen.\n\nVergelijk met game_categories: een pure veel-op-veel zonder attributen, dus een pure tussentabel.\n\nValkuil. Een associatieklasse is geen aparte entiteit met eigen identiteit. De samengestelde sleutel (sessionId, userId) maakt de combinatie uniek."}, {"id": "q122", "ch": "14", "q": "Waarom is 'decorator' in NestJS niet hetzelfde als het Decorator-pattern?", "c": "Een NestJS-decorator voegt metadata toe; het pattern wikkelt een object om.", "w": ["Het zijn twee namen voor hetzelfde idee, met enkel een verschil in de programmeertaal.", "NestJS-decorators zijn een implementatie van het Strategy-pattern voor routekeuze.", "Het Decorator-pattern bestaat niet in TypeScript, enkel in Java en C#."], "x": ["Het zijn verschillende dingen.", "Ze voegen metadata toe, ze wisselen geen algoritme.", "Het kan wel in TypeScript."], "m": "Annotatie versus pattern", "y": "Een interceptor lijkt eerder op het Decorator-pattern.", "d": "", "o": "", "u": "Een TypeScript-decorator (@Injectable(), @Roles()) is een taalfunctie die metadata aan een klasse of methode hangt, die het framework later leest. Er wordt niets omwikkeld.\n\nHet Decorator-pattern uit OOSD wikkelt een object in een ander object met dezelfde interface, om gedrag toe te voegen. Een Nest-interceptor lijkt daar eerder op: hij omwikkelt de handler.\n\nValkuil. Dezelfde naam, twee verschillende dingen. Zeg bij de verdediging welk van de twee je bedoelt."}, {"id": "q123", "ch": "14", "q": "Wat is de OOSD-tegenhanger van een exception filter?", "c": "Een centrale exception handler, in plaats van try/catch overal.", "w": ["Een Factory die uitzonderingen aanmaakt voor de verschillende lagen.", "Een Observer die luistert naar alle methode-aanroepen en fouten registreert.", "Een Singleton die alle fouten van de applicatie bijhoudt."], "x": ["Uitzonderingen worden niet aangemaakt door een factory.", "Er wordt niet geluisterd, er wordt gevangen.", "Er is geen bijhouden."], "m": "Exception translation", "y": "De DrizzleQueryErrorFilter vertaalt een databankfout naar een HTTP-fout.", "d": "", "o": "", "u": "Een centrale exception handler: één plaats waar uitzonderingen worden omgezet naar een antwoord, in plaats van try/catch verspreid over elke methode.\n\nJullie hebben twee globale filters: HttpExceptionFilter (HttpException naar het uniforme foutformaat) en DrizzleQueryErrorFilter (databankfout naar 409 of 404). De code die een fout gooit, hoeft niets te weten over HTTP.\n\nValkuil. Een filter doet geen foutafhandeling in de zin van herstellen. Hij vertaalt een fout naar een antwoord."}, {"id": "q124", "ch": "14", "q": "Waarom kunnen we niet gewoon een TypeScript-interface injecteren?", "c": "Interfaces verdwijnen bij het compileren; Nest heeft een klasse of token nodig.", "w": ["TypeScript-interfaces zijn niet toegestaan in NestJS-projecten omdat ze geen metadata hebben.", "Interfaces kunnen geen methodes bevatten, enkel eigenschappen, en kunnen dus niets leveren.", "Nest kan alleen strings injecteren, geen klassen of objecten zoals een service."], "x": ["Je mag ze gebruiken, maar niet als sleutel.", "Dat kunnen ze wel.", "Nest kan klassen, tokens en waarden injecteren."], "m": "Type erasure", "y": "Daarom een token zoals DrizzleAsyncProvider.", "d": "", "o": "", "u": "Interfaces bestaan alleen in TypeScript tijdens het compileren. In de uitgevoerde JavaScript zijn ze weg. Nest moet tijdens het uitvoeren een waarde hebben om de juiste provider te vinden, een klasse of een token.\n\nDaarom registreren jullie de databank onder het token DrizzleAsyncProvider en injecteer je met @Inject (of de afkorting @InjectDrizzle()).\n\nOOSD-vergelijking: in Java blijft een interface bestaan tijdens het uitvoeren, dus kan een container erop injecteren. In TypeScript niet."}, {"id": "q125", "ch": "14", "q": "Wat is de OOSD-tegenhanger van een databanktransactie?", "c": "Een Unit of Work: een groep bewerkingen die samen slagen of mislukken.", "w": ["Een Command dat één bewerking uitvoert en kan terugdraaien.", "Een Singleton die alle schrijfacties van de applicatie beheert.", "Een Proxy die elke query bij een fout automatisch opnieuw probeert."], "x": ["Eén bewerking is geen groep.", "Er is geen centrale singleton.", "Een proxy herhaalt niets."], "m": "Atomiciteit", "y": "Bij ons: de wachtlijst en categoryIds.", "d": "", "o": "", "u": "Een Unit of Work: een groep bewerkingen die als één eenheid slagen of mislukken. In de transactie schrijf je meerdere wijzigingen; faalt er één, dan wordt alles teruggedraaid (rollback). Slaagt alles, dan worden ze samen bevestigd (commit).\n\nBij jullie: PlaySessionsService gebruikt een transactie voor join, leave en update, met het slot op de sessierij. GamesService gebruikt er een om het spel en de categoriekoppelingen samen te bewaren.\n\nValkuil. Een transactie beschermt tegen half uitgevoerde wijzigingen, niet automatisch tegen gelijktijdige requests. Daarvoor is het slot (for update) nodig."}, {"id": "q126", "ch": "14", "q": "Wat is de OOSD-tegenhanger van migraties?", "c": "Versiebeheer voor het schema: genummerde, onveranderlijke wijzigingen.", "w": ["Een Factory voor tabellen die nieuwe schema's aanmaakt op aanvraag.", "Een UML-klassendiagram dat automatisch uit de code gegenereerd wordt.", "Een back-up van de databank die je kan terugzetten."], "x": ["Een factory maakt objecten, geen schema's.", "Een diagram beschrijft maar voert niets uit.", "Een back-up bewaart data, geen wijzigingen."], "m": "Schema-geschiedenis", "y": "Je wijzigt een bestaande migratie nooit.", "d": "", "o": "", "u": "Versiebeheer voor het schema. Elke migratie is een genummerd, onveranderlijk bestand dat een stap in de opbouw van het schema beschrijft. Een databank is op een bepaalde versie, en migraties brengen hem naar de volgende. Zo komen alle omgevingen (jouw laptop, de container, de server) in dezelfde toestand.\n\nNet zoals een commit in git: je herschrijft een bestaande commit niet, je voegt een nieuwe toe. Een fout in een migratie herstel je met een nieuwe migratie.\n\nValkuil. Een migratie bewaart het schema, niet de data (tenzij data nodig is voor de werking, zoals standaardwaarden)."}, {"id": "q127", "ch": "14", "q": "Wat is onModuleDestroy() in OOSD-termen?", "c": "Een dispose-moment: hier sluit je de verbinding die je bij het opstarten opende.", "w": ["Een constructor die de databankverbinding aanmaakt bij het opstarten van de module.", "Een getter die de verbinding teruggeeft aan de services die erom vragen.", "Een Observer die wacht op nieuwe modules die zich aanmelden bij de container."], "x": ["Dat is onModuleInit of de factory.", "Het is geen getter.", "Er is geen waarnemer."], "m": "Lifecycle hook", "y": "Zonder app.enableShutdownHooks() wordt hij niet aangeroepen bij een stop-signaal.", "d": "", "o": "", "u": "Een dispose-moment: de plaats waar je bronnen vrijgeeft die je tijdens het opstarten opende. In DrizzleModule opent onModuleInit de migraties en de connection pool, onModuleDestroy sluit de pool.\n\nOOSD-vergelijking: dezelfde idee als try-with-resources in Java of IDisposable in C#. Wat je opent, sluit je.\n\nValkuil. onModuleDestroy wordt enkel aangeroepen als app.enableShutdownHooks() in main.ts staat. Zonder die regel wacht Docker 10 seconden en moet het proces gedood worden (exitcode 137)."}, {"id": "q128", "ch": "15", "q": "De lijstroutes hebben geen paginatie, terwijl er wel een PaginationQuery-klasse bestaat. Wat zeg je?", "c": "Eerlijk dat de DTO (page, pageSize) klaarstaat maar nog niet is aangesloten, en hoe je het zou doen: offset uit page en pageSize, een COUNT-query voor het totaal en een vaste sortering.", "w": ["Dat het een bewuste keuze was omdat de cursus paginatie afraadt bij kleine datasets, en dat de klasse een restant is.", "Dat Drizzle geen paginatie ondersteunt en dat de DTO daarom enkel voor de documentatie dient in Swagger.", "Dat paginatie enkel de taak van de front-end is, die alle items ophaalt en zelf in pagina's verdeelt."], "x": ["De cursus raadt dat niet af, en een restant zou je moeten opruimen.", "Drizzle ondersteunt limit en offset. De DTO is geen documentatie-object.", "Ook zonder front-end hoort een API grote lijsten niet volledig terug te geven."], "m": "Eerlijk blijven", "y": "De klasse is aanwezig maar ongebruikt. Dat is een eerlijk, concreet antwoord dat je kan geven, met een duidelijk plan om het aan te sluiten.", "d": "", "o": "", "u": "In src/common/common.dto.ts staat een PaginationQuery met page en pageSize, maar geen enkele lijstroute gebruikt ze. De lijsten geven alle items terug in { items: [...] }. Paginatie is geen beoordelingscriterium, maar de cursus behandelt het, dus wees er eerlijk over.\n\nHoe je het zou aansluiten: de DTO op de lijstroute als @Query() zetten, offset berekenen als (page - 1) * pageSize, met limit en offset in de query, een aparte COUNT-query voor het totaal, en een vaste sortering zodat pagina's niet overlappen. Het antwoord wordt { items, total, page, pageSize }, wat precies de reden is voor de items-wrapper.\n\nValkuil. Zeg niet dat het ontbreekt zonder te zeggen wat je zou doen."}, {"id": "q129", "ch": "15", "q": "Waarom een tweede sorteerveld bij paginatie?", "c": "Bij gelijke waarden is de volgorde niet vast; items kunnen dubbel of niet voorkomen.", "w": ["Omdat MySQL maximaal één ORDER BY-veld per query toelaat en een tweede veld dus nodig is.", "Omdat het de query sneller maakt bij grote tabellen met veel gelijke waarden.", "Omdat de COUNT-query die tweede sortering vereist om het totaal te berekenen."], "x": ["MySQL laat meerdere toe.", "Het kan de query trager maken.", "COUNT heeft geen volgorde nodig."], "m": "Stabiele volgorde", "y": "Kies een unieke kolom zoals id.", "d": "", "o": "", "u": "Sorteer je op een kolom waar meerdere rijen dezelfde waarde hebben (bijvoorbeeld rating of datum), dan is de volgorde van die rijen niet gegarandeerd. Bij twee opeenvolgende queries (pagina 1, pagina 2) kan MySQL de gelijke rijen in een andere volgorde teruggeven. Gevolg: een item verschijnt op beide pagina's of op geen enkele.\n\nEen tweede sorteersleutel op een unieke kolom, zoals id, maakt de volgorde totaal. Jullie doen iets gelijkaardigs in de wachtlijst: sorteren op joinedAt en dan userId.\n\nValkuil. 'ORDER BY' op één niet-unieke kolom is geen volledige orde."}, {"id": "q130", "ch": "15", "q": "Hoe verdedig je dat de services Drizzle-code bevatten terwijl de rubric 'geen databankgerelateerde code' vraagt?", "c": "Drizzle fungeert zelf als repository (cursus); er staat geen ruwe SQL in de services.", "w": ["Het is een fout; de queries hadden in de controllers moeten staan, dichter bij de routes.", "De rubric geldt enkel voor de migraties en de seed, niet voor de eigenlijke services.", "Services mogen alles bevatten; de rubric is slechts een richtlijn en geen criterium."], "x": ["Controllers bevatten geen databankcode.", "De rubric gaat over de servicelaag.", "De rubric is een beoordelingscriterium."], "m": "Cursusargument", "y": "Wees voorbereid en consequent: overal dezelfde aanpak.", "d": "", "o": "", "u": "De rubric zegt dat de servicelaag 'geen SQL of databankgerelateerde code' bevat. De cursus zegt dat Drizzle zelf de repository is: de laag die objecten naar tabellen vertaalt. Jullie services roepen Drizzle rechtstreeks aan (db.query..., db.select()), maar er staat geen ruwe SQL-string in en geen connectiebeheer.\n\nDe redenering: de service bevat domeinlogica (regels, controles, samenstellen van resultaten), niet het uitvoeren van SQL. Het uitvoeren zit in Drizzle. Jullie lieten bewust geen extra repositoryklasse bovenop, om niet enkel door te geven.\n\nValkuil. Wees consequent. Zeg bij elke service hetzelfde, en geef toe dat je een repositorylaag zou kunnen toevoegen."}, {"id": "q131", "ch": "15", "q": "Wat is een zwak punt van migraties bij het opstarten?", "c": "Als meerdere instanties tegelijk opstarten, kunnen ze allemaal migreren.", "w": ["De app start trager op dan zonder migraties, wat in productie storend is.", "De migraties worden bij elke start opnieuw volledig uitgevoerd.", "De seed wordt automatisch meegedraaid en overschrijft de data."], "x": ["Dat is geen echt probleem.", "Drizzle voert enkel nieuwe migraties uit.", "De seed draait nooit automatisch."], "m": "Concurrency", "y": "Voor dit project is dat geen probleem; de cursus voert ze vóór de serverstart uit.", "d": "", "o": "", "u": "Jullie voeren de migraties uit in DrizzleModule.onModuleInit, dus bij elke start van de app. Draaien er meerdere instanties tegelijk (bijvoorbeeld meerdere containers achter een load balancer), dan proberen ze allemaal te migreren. Dat kan racebugs veroorzaken.\n\nDe cursus voert migraties liever uit vóór de serverstart, in een apart commando of stap. Voor dit project, met één API-container, is dat geen probleem. Het voordeel van jullie aanpak: een lector die docker compose up draait, heeft meteen een correct schema.\n\nValkuil. Een zwak punt noemen is sterk als je erbij zegt waarom het hier aanvaardbaar is."}, {"id": "q132", "ch": "15", "q": "Wat zeg je over de ViCHOgent-deployment als die nog niet werkt?", "c": "Enkel wat klopt: wat gevraagd en geprobeerd is en dat de poort ontbrak.", "w": ["Dat het niet nodig is omdat de lector alles lokaal kan bekijken met Docker.", "Dat het werkt maar tijdelijk offline is wegens onderhoud van de server.", "Dat de lector het zelf moet opzetten aan de hand van de README."], "x": ["Het is een ontvankelijkheidscriterium.", "Dat zou onwaar zijn.", "Dat is niet jullie taak."], "m": "Feitelijk", "y": "Zeg niets over de status dat niet klopt.", "d": "", "o": "", "u": "Zeg enkel wat klopt. Dat het online draaien op de VIC-server een ontvankelijkheidscriterium is, dat jullie een poging deden, en wat er precies ontbrak of blokkeerde (bijvoorbeeld een poort of toegang). Verzin geen oplossing die niet bestaat en beweer niet dat het werkt.\n\nBij een mondelinge verdediging vallen onwaarheden snel op, en eerlijkheid over een externe blokkade weegt zwaarder dan een slecht verhaal. Wie de deployment doet, kan je het best vooraf vragen wat de actuele stand is.\n\nValkuil. De demo moet de online versie tonen, niet localhost. Weet dus wat je toont."}, {"id": "q133", "ch": "15", "q": "Je moet de 'e2e'-naamgeving verdedigen. Wat zeg je?", "c": "Een Nest-naamconventie; het zijn integratietesten van de API met een echte databank.", "w": ["Het zijn e2e-testen omdat ze de volledige applicatie opstarten en alle routes aanroepen.", "Het zijn unit-testen omdat elke test één enkele route of methode aanspreekt.", "De naam is een vergissing die we nooit meer hebben aangepast in de bestanden."], "x": ["Dat is niet de cursusdefinitie.", "Ze doorlopen meerdere lagen.", "Het is een conventie, geen fout."], "m": "Terminologie van de cursus", "y": "In de cursus betekent e2e vanuit de gebruiker, inclusief UI.", "d": "", "o": "", "u": "In jullie project heten de testbestanden *.e2e-spec.ts. Dat is de standaardconventie van de Nest CLI. In de cursus betekent 'end-to-end' echter een test vanuit de gebruiker, inclusief de UI.\n\nWat jullie doen: je start de volledige API (echte guards, pipes, controllers, een echte MySQL via Testcontainers) en stuurt HTTP-requests met supertest. Dat zijn integratietesten van de API. Er is geen front-end in de keten.\n\nAntwoord: 'de bestandsnaam volgt de Nest-conventie; inhoudelijk zijn het integratietesten van de API met een echte databank'."}, {"id": "q134", "ch": "15", "q": "Wat is het sterkste argument voor globale guards?", "c": "Veiligheid by default: een vergeten guard kan nooit een route openzetten.", "w": ["Het is sneller dan guards per route, omdat het token maar één keer gecontroleerd wordt.", "Het is verplicht in NestJS; per route registreren kan niet.", "Swagger kan enkel globale guards documenteren."], "x": ["Snelheid speelt geen rol.", "Je mag ook per route.", "Swagger is onafhankelijk."], "m": "By default", "y": "@Public() is een bewuste uitzondering.", "d": "", "o": "", "u": "Veiligheid by default. Is een guard globaal, dan is elke nieuwe route automatisch beveiligd. Een route openzetten is een bewuste daad: @Public() erop zetten. Het omgekeerde ontwerp, per route @UseGuards, laat een gat als je het vergeet.\n\nDat past bij het criterium 'authenticatie en autorisatie op alle routes'. De enige openbare routes zijn login, registreren en health.\n\nValkuil. Een zwakker argument is 'het is minder code'. Het echte argument is dat vergeten niet kan leiden tot een onbeveiligde route."}, {"id": "q135", "ch": "15", "q": "Een lector vraagt: 'wat gebeurt er als ik een gebruiker verwijder?'. Wat doe je?", "c": "Je kijkt in schema.ts naar de onDelete van de foreign keys en legt het gedrag uit.", "w": ["Je zegt dat alles automatisch mee verdwijnt, want dat is de normale gang van zaken.", "Je zegt dat een gebruiker verwijderen in dit systeem niet kan.", "Je antwoordt dat je dat niet weet, omdat het buiten de opdracht valt."], "x": ["Dat weet je pas na het nakijken.", "Dat weet je pas na het nakijken.", "Bereid dit voor."], "m": "Controleer je schema", "y": "Dit staat in de lijst 'Controleer dit in je code'.", "d": "", "o": "", "u": "Je gokt niet, je kijkt in schema.ts naar de onDelete van de foreign keys die naar users wijzen. play_sessions.hostId: cascade (de gehoste sessies verdwijnen). play_session_participants.userId: cascade. reviews.userId: cascade. De data van de gebruiker verdwijnt dus volledig.\n\nHet tegenovergestelde zie je bij games: play_sessions.gameId heeft no action, dus een spel met sessies kan je niet verwijderen (409).\n\nKanttekening: het token van de verwijderde gebruiker blijft technisch geldig tot het verloopt (een uur), omdat de API stateless is. Dat is een goed voorbeeld van een bewust gekend nadeel."}, {"id": "q136", "ch": "15", "q": "Wat is een goede afsluitende vraag 'wat zou je anders doen?'", "c": "Paginatie, meer unit tests, migraties los van het opstarten.", "w": ["Niets; alles is perfect uitgewerkt en zou zo in productie kunnen draaien.", "Een ander framework gebruiken omdat NestJS te zwaar bleek voor het project.", "Het project uitbreiden met een eigen front-end en een mobiele app."], "x": ["Dat overtuigt niet.", "Dat is geen reflectie op dit project.", "Front-end is een aparte cursus."], "m": "Reflectie", "y": "Een lector waardeert dat je beperkingen kent.", "d": "", "o": "", "u": "Een goed antwoord toont dat je je beperkingen kent en weet hoe je ze oplost, zonder je werk af te breken. Voor dit project: paginatie aansluiten op de lijstroutes (de DTO bestaat al), meer unit tests voor de wachtlijstlogica met een gemockte databank, en de migraties los van het opstarten uitvoeren.\n\nMogelijke uitbreidingen: een CI-pijplijn (niet vereist, wel zinvol), refresh tokens of een intrekkingslijst voor tokens, en rate limiting op login.\n\nValkuil. Zeg niet 'niets', en zeg niet dat alles slecht is. Drie concrete verbeteringen met een reden is genoeg."}, {"id": "q137", "ch": "9", "q": "Waarom starten join, leave, update en delete van een speelsessie met lockSession (een select ... for update)?", "c": "Gelijktijdige aanvragen op dezelfde sessie worden achter elkaar uitgevoerd, zodat twee mensen niet dezelfde laatste plaats kunnen krijgen.", "w": ["Het slot verhindert dat andere gebruikers de sessie nog kunnen opvragen terwijl iemand aan het joinen is, zodat ze nooit een verouderde teller zien.", "Het slot zorgt ervoor dat de transactie automatisch wordt teruggedraaid zodra de sessie vol blijkt te zijn bij een join.", "Het slot vervangt de samengestelde primaire sleutel op (sessionId, userId), waardoor die sleutel overbodig is voor dubbele deelnames."], "x": ["Gewone selects worden door dit slot niet geblokkeerd. Enkel andere schrijvers en andere locking reads wachten.", "Een rollback gebeurt alleen bij een uitzondering. Een volle sessie levert gewoon status waitlisted op.", "De primaire sleutel blijft nodig als veiligheidsnet: zelfs als de service een fout zou maken, weigert MySQL een dubbele deelname."], "m": "Rijslot op de sessie", "y": "Het slot ligt op de rij van de sessie. Wie een tweede aanvraag stuurt, wacht tot de eerste transactie klaar is. Daarna telt hij de bevestigde deelnemers opnieuw, op een correcte waarde.", "d": "", "o": "mutual exclusion op een gedeelde resource, zoals synchronized rond een kritische sectie, maar dan in de databank in plaats van in het geheugen.", "u": "Zonder slot kunnen twee requests tegelijk de plaatsen tellen: beide zien 'één plaats vrij' en beide krijgen de laatste plaats. Dat is een race condition (lost update).\n\nlockSession doet een SELECT ... FOR UPDATE op de rij van de sessie, binnen een transactie. De tweede transactie moet wachten tot de eerste klaar is (commit of rollback) en telt dan pas. De bewerkingen lopen dus achter elkaar, enkel voor dezelfde sessie. Een aanvraag voor een andere sessie wordt niet gehinderd.\n\nDe samengestelde primaire sleutel (sessionId, userId) blijft als veiligheidsnet: zelfs bij een fout in de service weigert MySQL dezelfde gebruiker twee keer.\n\nValkuil. Gewone selects worden niet geblokkeerd door dit slot."}, {"id": "q138", "ch": "9", "q": "De host zet maxParticipants van een sessie lager dan het aantal bevestigde deelnemers. Wat doet de service?", "c": "Ze weigert met 409 Conflict: de capaciteit mag niet lager zijn dan het aantal bevestigde deelnemers.", "w": ["Ze verplaatst de laatst aangemelde bevestigde deelnemers terug naar de wachtlijst tot de nieuwe capaciteit klopt.", "Ze laat de wijziging toe en weigert enkel nieuwe joins tot er weer plaats vrijkomt in de sessie.", "Ze weigert met 400 Bad Request, omdat de ValidationPipe de waarde tegen het aantal deelnemers vergelijkt."], "x": ["Er bestaat geen degradatie naar de wachtlijst. Zo'n stille actie zou onverwacht zijn voor de betrokkenen.", "De update wordt niet toegelaten, dus er zijn nooit meer bevestigden dan plaatsen.", "Een DTO-validatie ziet enkel het request zelf, niet de databank. Dit is een toestandscontrole in de service."], "m": "Capaciteit verlagen", "y": "In de transactie telt de service de bevestigde deelnemers en gooit een ConflictException als de nieuwe waarde lager is. Niemand wordt stilzwijgend gedegradeerd.", "d": "", "o": "", "u": "In PlaySessionsService.update (in een transactie met het slot) telt de service de bevestigde deelnemers. Is dto.maxParticipants kleiner dan dat aantal, dan gooit hij een ConflictException: 'Capacity cannot be lower than the number of confirmed participants'. Resultaat: 409.\n\nNiemand wordt stilzwijgend naar de wachtlijst verplaatst. Dat zou onverwacht zijn voor wie al een plaats had.\n\nValkuil. Dit is geen validatiefout van de DTO (400). De DTO kent het aantal deelnemers niet; het is een controle op de toestand in de databank, dus in de service."}, {"id": "q139", "ch": "9", "q": "Wanneer promoveert de update van een sessie wachtenden naar bevestigd?", "c": "Enkel wanneer de nieuwe maxParticipants groter is dan de oude.", "w": ["Bij elke update van de sessie, ook als alleen de titel of het tijdstip verandert.", "Nooit. Promotie gebeurt uitsluitend wanneer iemand de sessie verlaat of wordt verwijderd.", "Enkel wanneer de host expliciet een lijst van te promoveren gebruikers meestuurt in de body."], "x": ["Dat zou nutteloos werk doen. Zonder extra plaatsen valt er niets te promoveren.", "Ook een verhoging van de capaciteit geeft plaats vrij, dus promotie moet daar gebeuren.", "De body bevat geen lijst met gebruikers. Het systeem beslist zelf op basis van de volgorde."], "m": "Promotie bij update", "y": "De service vergelijkt dto.maxParticipants met session.maxParticipants en roept promoteWaitlisted alleen aan bij een verhoging. Zo blijven andere updates zonder nevenwerking.", "d": "", "o": "", "u": "In update vergelijkt de service dto.maxParticipants met session.maxParticipants. Alleen bij een verhoging roept hij promoteWaitlisted aan, die de vrije plaatsen berekent en de oudste wachtenden bevestigt.\n\nWijzig je enkel de titel of het tijdstip, of verlaag je de capaciteit (binnen de grens), dan is er niets te promoveren en gebeurt er niets met de wachtlijst.\n\nHetzelfde promoteWaitlisted wordt ook na leave aangeroepen, met de huidige capaciteit. Eén methode, twee aanleidingen."}, {"id": "q140", "ch": "9", "q": "Een gebruiker die geen deelnemer is, roept DELETE op de participatie van een sessie aan. Wat is het antwoord?", "c": "404 Not Found, met de melding dat hij geen deelnemer is van deze sessie.", "w": ["204 No Content, omdat verwijderen idempotent is en het eindresultaat toch al klopt.", "409 Conflict, omdat de gebruiker de sessie niet kan verlaten in de huidige toestand.", "403 Forbidden, omdat enkel deelnemers het recht hebben om leave aan te roepen."], "x": ["Idempotent kan, maar hier is er bewust een 404 gekozen. Hij meldt dat er niets te verlaten was.", "Een conflict gaat over een botsing met de bestaande toestand, zoals dubbel joinen.", "Er is geen rolcontrole. Het ontbreken van de rij is het probleem, niet het recht."], "m": "Leave zonder deelname", "y": "De delete-query geeft affectedRows terug. Is dat 0, dan gooit de service een NotFoundException voor de participatie.", "d": "", "o": "", "u": "leave verwijdert de rij (sessionId, userId) en kijkt naar affectedRows. Is dat 0, dan was er niets te verwijderen en gooit de service een NotFoundException met de melding dat je geen deelnemer bent. Resultaat: 404.\n\nDe alternatieven: 204 zou 'idempotent' zijn, maar jullie meldt expliciet dat er niets te verlaten was. 409 is voor botsingen met een bestaande toestand, zoals dubbel joinen. 403 is voor ontbrekende rechten, en hier is er geen rolcontrole.\n\nValkuil. DELETE is idempotent in effect, maar niet in antwoord. De eerste keer 204, daarna 404."}, {"id": "q141", "ch": "5", "q": "Welke rijen verdwijnen mee wanneer een gebruiker verwijderd wordt?", "c": "Zijn gehoste sessies, zijn deelnames en zijn reviews, omdat die relaties onDelete cascade hebben.", "w": ["Enkel de rij in users. In de andere tabellen wordt de verwijzing naar de gebruiker op null gezet.", "Niets, want de verwijdering wordt geweigerd zolang de gebruiker nog sessies host of reviews schreef.", "Zijn gehoste sessies en deelnames, maar zijn reviews blijven staan als anonieme beoordelingen."], "x": ["Een set null kan niet, want die kolommen zijn notNull.", "Dat gedrag hoort bij no action, en dat staat enkel op het spel-naar-sessie-pad.", "Ook reviews.userId is cascade en notNull, dus anoniem laten staan kan niet."], "m": "Cascade bij gebruiker", "y": "hostId, de gebruiker in participants en de gebruiker in reviews zijn alle drie cascade. Er blijft dus geen data van de gebruiker achter.", "d": "", "o": "", "u": "Drie foreign keys verwijzen naar users, allemaal onDelete cascade: play_sessions.hostId (de gehoste sessies, en via cascade ook hun deelnames), play_session_participants.userId en reviews.userId. De rijen zijn notNull, dus 'op null zetten' kan niet.\n\nGevolg: er blijft geen data van de gebruiker achter. Dat is een bewuste keuze: een review of sessie zonder auteur of host heeft geen betekenis.\n\nValkuil. Cascade is krachtig en gevaarlijk: één delete kan veel verwijderen. Daarom is DELETE op users enkel voor jezelf of een admin."}, {"id": "q142", "ch": "3", "q": "Waar worden de globale guards (JWT-authenticatie en rollen) geregistreerd?", "c": "Als APP_GUARD-providers in UsersModule.", "w": ["In main.ts met app.useGlobalGuards(...), vlak voor app.listen.", "In AppModule, via een eigen providers-lijst met de guard-klassen.", "Als decorator op elke controller afzonderlijk, met @UseGuards bovenaan de klasse."], "x": ["Dat zou kunnen, maar dan krijgen ze geen DI. Jullie gebruiken de providerroute.", "Dat is de plek die je zou verwachten, maar in de code staat het in UsersModule.", "Per controller zou niet-beveiligde routes mogelijk maken door vergeten. Globaal is veiliger, met @Public als uitzondering."], "m": "Plaats van APP_GUARD", "y": "De providers met APP_GUARD staan in users.module.ts. Daardoor werken ze globaal en kunnen ze toch via DI de services van die module gebruiken.", "d": "", "o": "dependency injection. Een guard die via een provider is geregistreerd, kan afhankelijkheden krijgen, in tegenstelling tot een new-object in main.ts.", "u": "Als providers met het token APP_GUARD in UsersModule. Een APP_GUARD-provider, in eender welke module, geldt voor de hele applicatie. Bij jullie staan de AuthGuard en de RolesGuard in users.module.ts. Eerder dacht ik AppModule, maar de code toont UsersModule.\n\nWaarom via een provider en niet met app.useGlobalGuards() in main.ts? Een provider kan via dependency injection andere services gebruiken (zoals ConfigService en JwtService), een instantie in main.ts niet.\n\nValkuil. Het effect is hetzelfde als je het in AppModule zet, maar bij de verdediging moet je de echte plaats noemen."}, {"id": "q143", "ch": "7", "q": "Een gewone ingelogde gebruiker vraagt GET /api/users/<id van een andere gebruiker>. Wat krijgt hij?", "c": "404 Not Found, zodat hij niet kan afleiden of die gebruiker bestaat.", "w": ["403 Forbidden, omdat hij geen recht heeft op andermans gegevens.", "401 Unauthorized, omdat zijn token niet bij die gebruiker hoort.", "200 OK met enkel de publieke velden van die andere gebruiker."], "x": ["403 verraadt dat de resource wel bestaat. Hier is bewust 404 gekozen.", "Zijn token is geldig. Authenticatie klopt, het gaat om autorisatie.", "Er is geen publiek profiel. De route is beperkt tot jezelf of een admin."], "m": "CheckUserAccessGuard", "y": "CheckUserAccessGuard antwoordt met een NotFoundException voor andermans id. 401 is voorbehouden aan een ontbrekend of ongeldig token.", "d": "", "o": "", "u": "CheckUserAccessGuard staat op de route /users/:id. Hij laat het request door als de id 'me' is, jouw eigen id, of als je admin bent. Voor andermans id gooit hij een NotFoundException: 404.\n\nWaarom 404 en geen 403? Met 403 verklap je dat die gebruiker bestaat. Met 404 is het antwoord identiek voor 'bestaat niet' en 'je mag het niet zien', dus een aanvaller kan geen id's aftasten. Dit volgt de cursus.\n\nValkuil. 401 is voor een ontbrekend of ongeldig token. Hier is het token goed en wordt de identiteit herkend."}, {"id": "q144", "ch": "7", "q": "Een admin verwijdert een gebruiker, maar die heeft nog een token van vijf minuten geleden. Wat gebeurt er?", "c": "De token blijft technisch geldig tot hij verloopt na 3600 seconden, omdat de API stateless is.", "w": ["De token wordt meteen ongeldig omdat de guard bij elke aanvraag de gebruiker in de databank opzoekt.", "De token blijft geldig, maar enkel voor routes met @Public omdat de gebruiker niet meer bestaat.", "De server houdt een lijst van ingetrokken tokens bij en weigert deze dus onmiddellijk."], "x": ["Dat zou stateful zijn en gebeurt hier niet. De token wordt enkel gecontroleerd op handtekening en claims.", "Een publieke route heeft de token niet nodig. Het gaat om beschermde routes waar de token nog accepteert.", "Zo'n blocklist bestaat niet in de code. Je zou ze moeten toevoegen, bijvoorbeeld met kortere levensduur of refresh tokens."], "m": "Stateless en intrekken", "y": "Zonder blocklist of databankcontrole kan de server een gesigneerde token niet intrekken. Dat is de prijs van stateless authenticatie.", "d": "", "o": "", "u": "De API is stateless: de AuthGuard controleert enkel de handtekening en de claims (exp, aud, iss) van het token, niet of de gebruiker nog in de databank staat. Het token blijft dus geldig tot het na 3600 seconden verloopt.\n\nOm een token vroeger ongeldig te maken heb je extra mechanismen nodig: een blocklist van ingetrokken tokens, een kortere levensduur met refresh tokens, of een databankcontrole bij elk request (wat de stateless aanpak opgeeft). Jullie hebben dat niet.\n\nValkuil. Een goed voorbeeld van een bewust gekend nadeel van JWT. Noem het zelf als zwak punt, met de oplossing erbij."}, {"id": "q145", "ch": "7", "q": "Welke velden kan een gebruiker met PUT op zijn eigen profiel wijzigen?", "c": "Enkel name en email.", "w": ["name, email en het wachtwoord, zodat gebruikers hun wachtwoord kunnen vernieuwen.", "name, email en roles, waarbij enkel admins de rolwijziging effectief doorvoeren.", "Alle kolommen van users, behalve het id."], "x": ["Een wachtwoord wijzigen is een aparte functionaliteit en zit niet in deze DTO.", "Rollen zitten niet in de DTO. Met whitelist en forbidNonWhitelisted wordt een extra veld in de body geweigerd.", "Dat zou mass assignment toelaten. De DTO met whitelist voorkomt dat."], "m": "Beperkte update van gebruiker", "y": "De UpdateUser-DTO bevat enkel name en email. Wachtwoord en rollen kunnen dus niet via deze route veranderen, ook niet door een admin.", "d": "", "o": "information hiding. De DTO is het contract en toont niet de hele entiteit.", "u": "UpdateUserRequestDto bevat enkel name en email. Wachtwoord en rollen zitten er niet in, dus kan je ze niet via deze route wijzigen, ook niet als admin.\n\nDe ValidationPipe staat met whitelist: true en forbidNonWhitelisted: true: stuur je bijvoorbeeld roles of passwordHash mee, dan krijg je 400. Zo kan een gebruiker zichzelf geen admin maken (mass assignment).\n\nOOSD-vergelijking: information hiding. De DTO is het contract naar buiten, de entiteit bevat meer dan je toont of laat wijzigen."}, {"id": "q146", "ch": "8", "q": "Hoe laadt de games-service de categorieën bij een game?", "c": "Met een relationele Drizzle-query (with: ...), zonder expliciete joins.", "w": ["Met een expliciete leftJoin op game_categories en categories, gevolgd door groupBy op de game.", "Met een ruwe SQL-string via sql`...` omdat Drizzle geen relaties kan laden.", "Met een aparte query per game in een lus, waarna de resultaten in code worden samengevoegd."], "x": ["Dat zou kunnen, maar de code gebruikt dat niet. Het groeperen moet je dan zelf doen.", "Relaties zijn net een kernfeature van Drizzle. Ruwe SQL is niet nodig.", "Dat is het N+1-probleem. De relationele query vermijdt dat."], "m": "with: in plaats van joins", "y": "Drizzle kent de relaties uit het schema (relations). Met with: vraag je ze op en krijg je een geneste structuur terug, zonder zelf rijen te groeperen.", "d": "", "o": "Data Mapper met lazy of eager loading. with: is eager loading van de associatie.", "u": "GamesService gebruikt de relationele API van Drizzle: db.query.games.findMany({ with: { categories: { with: { category: true } } } }). De relaties zijn in het schema met relations() beschreven. Zo krijg je per spel de koppelrijen en daarbinnen de categorie, in één geneste structuur, zonder expliciete join.\n\nDaarna zet de service het resultaat om: game.categories.map((link) => link.category), zodat de client enkel de categorieën ziet en niet de koppeltabel.\n\nValkuil. Een lus met een query per spel (N+1) werkt, maar is traag. with: laat Drizzle het efficiënt oplossen."}, {"id": "q147", "ch": "8", "q": "Hoe berekent de games-service de gemiddelde score en het aantal reviews bij GET /api/games/:id?", "c": "Met een aparte aggregatiequery op reviews (avg en count) voor die game, waarna het resultaat aan de game wordt toegevoegd.", "w": ["Het gemiddelde is een kolom in games die bij elke nieuwe review door een databanktrigger wordt bijgewerkt.", "De service laadt alle reviews van de game en berekent het gemiddelde met reduce in JavaScript.", "De with:-query laadt de reviews mee en Drizzle levert automatisch averageRating en reviewCount."], "x": ["Er is geen kolom of trigger. Een opgeslagen afgeleide waarde kan uit sync raken.", "Alle rijen ophalen om te tellen is trager en verplaatst werk naar de applicatie.", "with: haalt enkel gerelateerde rijen op en rekent niets uit."], "m": "Aggregatie in de databank", "y": "De databank rekent het gemiddelde en het aantal uit met avg() en count(). Er wordt niets opgeslagen, dus de waarde kan nooit achterlopen.", "d": "", "o": "een afgeleid attribuut, berekend bij opvraging in plaats van opgeslagen.", "u": "getById doet twee dingen: eerst de relationele query voor het spel met zijn categorieën, daarna een aparte aggregatiequery: select avg(rating), count() uit reviews waar gameId overeenkomt. Het gemiddelde (averageRating, null zonder reviews) en het aantal (reviewCount) worden aan het antwoord toegevoegd.\n\nHet is een afgeleid attribuut: berekend bij het opvragen, niet opgeslagen. Het kan nooit uit sync raken met de reviews.\n\nValkuil. with: berekent niets. Aggregaties (avg, count) doe je met de query builder."}, {"id": "q148", "ch": "15", "q": "Een lector merkt op dat er geen CI-workflow in de repository staat. Wat zeg je?", "c": "Eerlijk dat er geen pijplijn is en dat de testen lokaal draaien. Je legt uit dat je in een workflow installeren, linten, bouwen en de e2e-testen met Testcontainers zou laten lopen.", "w": ["Dat Docker Compose de CI vervangt, omdat docker compose up --build --wait bij elke commit de testen uitvoert.", "Dat GitHub zelf bij elke pull request automatisch de testen draait zodra er een package.json bestaat.", "Dat CI enkel nodig is bij een front-end, omdat een API handmatig getest kan worden met Swagger."], "x": ["Compose bouwt en start de omgeving, maar voert geen testen uit en draait niet bij een commit.", "GitHub voert niets uit zonder een workflowbestand in .github/workflows.", "Juist een API met een databank en autorisatieregels heeft geautomatiseerde testen nodig."], "m": "Geen CI", "y": "CI staat in de cursus (hoofdstuk 9) maar niet in de criteria van de examenopdracht. Een eerlijk antwoord met een concreet plan is sterker dan iets beweren dat de code niet toont.", "d": "", "o": "", "u": "Op main staat in .github enkel ISSUE_TEMPLATE; er is geen workflow. CI/CD is een cursushoofdstuk (hoofdstuk 9), maar het staat niet in de ontvankelijkheids- of evaluatiecriteria van de examenopdracht.\n\nEen goed antwoord: 'we hebben geen pijplijn, de testen draaien lokaal met Testcontainers. In een workflow zouden we installeren, linten, bouwen en de integratietesten laten lopen; de runner van GitHub heeft Docker'. Zo toon je dat je weet wat het is en wat het zou doen.\n\nValkuil. Beweer niet dat Docker Compose of GitHub dit automatisch doet. Zonder workflowbestand in .github/workflows voert GitHub niets uit."}, {"id": "q149", "ch": "3", "q": "In welke volgorde loopt een request door de onderdelen van NestJS naar de controller?", "c": "Middleware, guards, interceptors (voor de handler), pipes, controller.", "w": ["Middleware, pipes, guards, interceptors, controller: eerst de invoer valideren, dan pas controleren wie er aanklopt.", "Guards, middleware, interceptors, pipes, controller: eerst de toegang, daarna de algemene voorbewerking van het request.", "Middleware, interceptors, guards, pipes, controller: de interceptors omringen alles, ook de toegangscontrole."], "x": ["Eerst valideren zou werk doen voor iemand die toch geweigerd wordt.", "Middleware loopt altijd als eerste, nog voor Nest weet welke handler het request krijgt.", "Interceptors komen na de guards. Een geweigerd request bereikt dus nooit een interceptor."], "m": "Volgorde heenweg", "y": "Onthoud M-G-I-P-C. Wat het goedkoopst en het meest ingrijpend is, komt eerst: wie ben je (guard) vóór is de data geldig (pipe).", "d": "", "o": "een Chain of Responsibility. De volgorde bepaalt welke schakel als eerste mag weigeren.", "u": "Middleware, guards, interceptors (vóór), pipes, controller. Onthoud M-G-I-P-C. Op de terugweg: interceptors (na), en bij een fout de exception filters.\n\nDe logica: eerst het algemene (loggen, Helmet, CORS), dan de toegangscontrole (wie ben je, wat mag je), dan voor en rond de handler (interceptors), dan de data controleren (pipes). Een request dat bij de guard faalt, doet geen validatiewerk meer.\n\nValkuil. De volgorde guards, interceptors, pipes verbaast veel mensen: je zou denken dat validatie voor de interceptor komt. Nest doet het andersom, en jullie upload steunt daarop."}, {"id": "q150", "ch": "3", "q": "Een request heeft geen Authorization-header én een ongeldige body (rating 7 terwijl 1 tot 5 geldt). Wat is het antwoord?", "c": "401 Unauthorized: de guard weigert het request nog voor de pipe de body bekijkt.", "w": ["400 Bad Request: de ValidationPipe ziet de ongeldige rating en weigert het request als eerste.", "401 en 400 samen, in een lijst met alle fouten die het request bevat, zodat de client alles in één keer kan herstellen.", "403 Forbidden, omdat de gebruiker niet is aangemeld en dus ook geen schrijfrechten heeft."], "x": ["De pipe komt pas na de guards. Zonder token kom je niet zover.", "Er is maar één fout per request: de eerste schakel die weigert, beslist.", "403 is voor een bekende gebruiker zonder recht. Zonder token ben je niet geïdentificeerd, en dat is 401."], "m": "Guard vóór pipe", "y": "De guard loopt voor de pipe. Zodra een schakel een exception gooit, stopt de keten. De pipe wordt nooit bereikt.", "d": "", "o": "", "u": "Twee fouten, maar het request stopt bij de eerste schakel die weigert. De AuthGuard loopt vóór de ValidationPipe. Hij vindt geen token, gooit een UnauthorizedException, en de keten stopt: de pipe wordt nooit bereikt. Antwoord: 401.\n\nHet antwoord toont ook maar één fout. Je krijgt geen lijst met alles wat er mis is, want latere schakels draaien niet meer.\n\nWaarom is die volgorde goed? De validatie doet werk voor iemand die toch niet binnen mag. Bovendien lek je zo niets over je DTO's aan niet-aangemelde bezoekers.\n\nValkuil. 400 voor de body klopt voor een aangemelde gebruiker, niet voor een onbekende."}, {"id": "q151", "ch": "3", "q": "Een gewone gebruiker met een geldig token roept een route aan die @Roles(Role.ADMIN) vereist, met een ongeldige body. Wat is het antwoord?", "c": "403 Forbidden: de RolesGuard weigert vóór de ValidationPipe aan de beurt komt.", "w": ["400 Bad Request: de ValidationPipe wordt altijd als eerste uitgevoerd om slechte invoer snel te weren.", "401 Unauthorized: een gewone gebruiker heeft voor deze route niet de juiste token.", "404 Not Found: de route bestaat niet voor mensen zonder admin-rol, zodat die niet te raden valt."], "x": ["Validatie komt na de guards, niet ervoor.", "De identiteit is vastgesteld. Het gaat om een ontbrekend recht, en dat is 403.", "404 gebruiken wij enkel bij CheckUserAccessGuard voor andermans gebruiker, niet voor rollen."], "m": "RolesGuard vóór pipe", "y": "Het token is geldig, dus AuthGuard laat door. De RolesGuard vergelijkt de rol met @Roles en gooit een ForbiddenException.", "d": "", "o": "", "u": "AuthGuard slaagt: het token is geldig, de gebruiker staat op request.user. Dan komt de RolesGuard: de route heeft @Roles(Role.ADMIN), de gebruiker heeft enkel de rol user, dus een ForbiddenException: 403. De ValidationPipe komt daarna en wordt nooit bereikt.\n\nZelfde principe als de vorige vraag, maar nu met een geldige identiteit. 401 is dus fout (de identiteit is gekend) en 400 ook (de pipe loopt nog niet).\n\nValkuil. 404 gebruiken jullie alleen voor andermans /users/:id (CheckUserAccessGuard) en voor ontbrekende resources."}, {"id": "q152", "ch": "3", "q": "Waarom is de RolesGuard een guard en geen middleware?", "c": "Een guard kent de ExecutionContext en dus de metadata van de route (@Roles). Middleware weet niet welke handler het request krijgt.", "w": ["Een middleware mag geen statuscode terugsturen, enkel een guard kan een request weigeren met 401 of 403.", "Een middleware draait pas na de controller, zodat het te laat zou zijn om de rol van de gebruiker te controleren.", "Een middleware kan niet asynchroon zijn, terwijl het controleren van een rol altijd een databankaanroep vraagt."], "x": ["Middleware kan wel een antwoord sturen, bijvoorbeeld via res.status().send().", "Middleware draait vóór alles, niet erna.", "Middleware mag async zijn, en de rol zit in het token, niet in de databank."], "m": "Guard versus middleware", "y": "Nest haalt @Roles uit de metadata van de handler via de Reflector. Dat kan enkel waar de ExecutionContext beschikbaar is, dus in een guard.", "d": "", "o": "een guard krijgt de context van de aanroep mee, zoals een methode die het object en de annotaties kent. Een middleware ziet enkel het kale request.", "u": "De RolesGuard moet weten welke rol de route eist. Dat staat als metadata op de handler (@Roles(Role.ADMIN)). Een guard krijgt de ExecutionContext en kan met de Reflector die metadata uitlezen: welke controller, welke methode, welke decorators.\n\nMiddleware draait vooraan, op het kale request, nog voor Nest bepaald heeft welke handler het zal afhandelen. Daar bestaat de metadata nog niet in bruikbare vorm.\n\nMiddleware kan wel antwoorden sturen of async zijn. Het is enkel de plaats in de keten en de beschikbare context die het verschil maken.\n\nOOSD-vergelijking: een guard kent de aangeroepen methode en zijn annotaties. Een middleware ziet enkel de binnenkomende aanvraag."}, {"id": "q153", "ch": "3", "q": "Welke onderdelen kunnen code uitvoeren zowel vóór als na de controller-handler?", "c": "Interceptors. Ze omringen de handler en zien ook het resultaat.", "w": ["Guards en pipes, omdat ze het request voor de handler controleren en het resultaat daarna nog valideren.", "Middleware en exception filters, omdat beide het volledige request en het antwoord kunnen aanpassen.", "Guards en interceptors, omdat een guard na de handler nog mag beslissen of het antwoord vrijgegeven wordt."], "x": ["Pipes werken op de binnenkomende parameters en kennen het antwoord niet. Guards beslissen enkel vooraf.", "Filters lopen alleen bij een exception, en middleware kent het resultaat van de handler niet.", "Een guard beslist enkel vóór de handler. Op de terugweg doet hij niets."], "m": "Rond de handler", "y": "Een interceptor krijgt next.handle() en kan met de stroom die terugkomt van alles doen: vertragen, omzetten, loggen.", "d": "", "o": "around advice uit AOP. Code voor en na de aanroep, zonder dat de aangeroepen methode het weet.", "u": "Alleen interceptors. Een interceptor krijgt een CallHandler en roept next.handle() aan. Alles vóór die aanroep gebeurt voor de handler; alles dat je aan de teruggekeerde stroom (Observable) koppelt, gebeurt erna: het resultaat omzetten, vertragen, loggen of een fout opvangen.\n\nEen guard beslist enkel vooraf. Een pipe werkt enkel op binnenkomende parameters. Een filter treedt enkel op bij een exception.\n\nBij jullie: AuthDelayInterceptor laat de handler lopen en stelt daarna het antwoord uit.\n\nOOSD-vergelijking: around advice uit AOP."}, {"id": "q154", "ch": "3", "q": "Waarom werkt de ParseFilePipe bij het uploaden van een spelafbeelding pas nadat de FileInterceptor gelopen heeft?", "c": "Interceptors lopen vóór pipes. De FileInterceptor leest het bestand uit het multipart-request, zodat de pipe het kan valideren op grootte en type.", "w": ["Pipes lopen vóór interceptors, maar de ParseFilePipe wacht tot de controller het bestand uit het geheugen vrijgeeft.", "De FileInterceptor controleert zelf de grootte en het type, de ParseFilePipe zet het resultaat enkel om naar een buffer.", "De guard stuurt het bestand door naar de pipe nadat de rol is gecontroleerd, daarom komt de interceptor als laatste."], "x": ["De volgorde is andersom: interceptors vóór pipes.", "De validatie zit in de pipe met MaxFileSizeValidator en FileTypeValidator.", "Een guard geeft geen data door. Hij beslist enkel."], "m": "Upload in de pipeline", "y": "Volgorde: guards, interceptor (FileInterceptor leest de upload), pipes (ParseFilePipe: 5 MB, jpeg, png of webp), controller.", "d": "", "o": "", "u": "De uploadroute PUT /api/games/:id/image heeft @UseInterceptors(FileInterceptor('file')) en @UploadedFile(new ParseFilePipe({...})). De volgorde is: guards (rol admin), FileInterceptor, pipes, controller.\n\nFileInterceptor (op basis van multer) leest het bestand uit het multipart-request. Dat gebeurt vóór de pipes, zodat de ParseFilePipe iets heeft om te controleren: maximaal 5 MB (MaxFileSizeValidator) en het type image/jpeg, image/png of image/webp (FileTypeValidator).\n\nValkuil. De interceptor valideert zelf niets. De validatie zit in de pipe."}, {"id": "q155", "ch": "3", "q": "Welk onderdeel bouwt het foutantwoord met statusCode, timestamp, message en details?", "c": "De HttpExceptionFilter, die elke HttpException omzet naar dat JSON-formaat.", "w": ["De ValidationPipe, die bij een ongeldige invoer zelf het volledige antwoord opbouwt en terugstuurt.", "De controller, die in een try/catch de exception opvangt en het antwoord samenstelt.", "Een interceptor op de terugweg, die elke fout van de service naar een uniform formaat omzet."], "x": ["De pipe gooit enkel een BadRequestException met details. De filter geeft er het uiteindelijke formaat aan.", "Er is geen try/catch in onze controllers. Dat is net het nut van de filter.", "Wij hebben geen uitgaande interceptor voor fouten. Dat is de taak van filters."], "m": "Eén foutformaat", "y": "De filter is een centraal catch-blok. Guards, pipes en services gooien enkel een exception. De filter maakt het antwoord.", "d": "", "o": "één centrale exception handler in plaats van overal try/catch.", "u": "De HttpExceptionFilter. Hij is op de hele applicatie geregistreerd in main.ts met @Catch(HttpException), en zet elke HttpException om naar { statusCode, timestamp, message, details }.\n\nGuards, pipes, controllers en services gooien enkel een exception (UnauthorizedException, NotFoundException, ...). Wat daarmee gebeurt, weten ze niet. De filter maakt het antwoord, zodat alle fouten dezelfde vorm hebben.\n\nOOSD-vergelijking: één centrale exception handler in plaats van try/catch in elke methode.\n\nValkuil. De ValidationPipe levert enkel details (via zijn exceptionFactory). Het formaat van het antwoord maakt de filter."}, {"id": "q156", "ch": "3", "q": "De databank gooit ER_DUP_ENTRY bij een tweede review van dezelfde gebruiker voor dezelfde game. Wat maakt hiervan een 409?", "c": "De DrizzleQueryErrorFilter, die de MySQL-foutcode herkent en er een 409-antwoord van maakt.", "w": ["De HttpExceptionFilter, want die vangt alle fouten op, ook die van de databankdriver.", "De service, die in een try/catch rond de insert de fout opvangt en zelf een ConflictException gooit.", "MySQL zelf: de driver geeft de HTTP-statuscode 409 mee, en Nest stuurt die ongewijzigd door."], "x": ["De HttpExceptionFilter vangt enkel HttpException. Een databankfout valt daarbuiten.", "De service heeft hier geen try/catch. Dat zou in elke service herhaald moeten worden.", "MySQL kent geen HTTP. De driver geeft een foutcode zoals ER_DUP_ENTRY."], "m": "Databankfout naar HTTP", "y": "De fout van de driver is geen HttpException. Daarom heeft het project een tweede filter, die de codes ER_DUP_ENTRY (409), ER_NO_REFERENCED_ROW_2 (404) en ER_ROW_IS_REFERENCED_2 (409) vertaalt.", "d": "", "o": "", "u": "De fout komt van de MySQL-driver en is geen HttpException. De HttpExceptionFilter heeft @Catch(HttpException), dus hij ziet deze fout niet. Daarom hebben jullie een tweede filter: DrizzleQueryErrorFilter. Die kijkt naar de MySQL-foutcode en vertaalt: ER_DUP_ENTRY wordt 409, ER_NO_REFERENCED_ROW_2 wordt 404 en ER_ROW_IS_REFERENCED_2 wordt 409.\n\nWaarom geen try/catch in de service? Dan moet je die code in elke service herhalen. De filter doet het één keer, centraal.\n\nValkuil. MySQL kent geen HTTP-statuscodes. De vertaling gebeurt in jullie code."}, {"id": "q157", "ch": "3", "q": "Wat gebeurt er met een databankfout waarvoor de DrizzleQueryErrorFilter geen mapping heeft?", "c": "De fout wordt opnieuw gegooid en eindigt als 500 Internal Server Error.", "w": ["Ze wordt door de HttpExceptionFilter omgezet naar een 400, omdat de invoer van de client de oorzaak is.", "Ze wordt genegeerd en het request krijgt toch een 200, met een lege lijst als resultaat.", "Ze wordt omgezet naar een 409, omdat elke databankfout wijst op een conflict met bestaande data."], "x": ["De HttpExceptionFilter vangt enkel HttpException, en dit is er geen.", "Een fout verstoppen met 200 verbergt bugs.", "409 is voorbehouden aan herkende botsingen."], "m": "Onbekende databankfout", "y": "Enkel gekende codes worden vertaald. Alles daarbuiten is een serverfout.", "d": "", "o": "", "u": "De filter vertaalt enkel de codes die hij kent. Voor elke andere fout gooit hij de exception opnieuw. Dat komt uiteindelijk bij de standaardafhandeling van Nest terecht, die een 500 Internal Server Error teruggeeft.\n\nDat is bewust: een onbekende databankfout is meestal een fout van de server (een bug of een databankprobleem), geen fout van de client. Een 4xx zou de client ten onrechte de schuld geven. En een 200 zou een bug verbergen.\n\nValkuil. 409 en 404 zijn voor specifieke, begrepen situaties. Alles wat je niet begrijpt, laat je doorvallen."}, {"id": "q158", "ch": "3", "q": "Wat doet de AuthDelayInterceptor met het antwoord van het login-eindpunt?", "c": "Hij laat de handler gewoon lopen en stelt daarna het antwoord, ook een fout, met een willekeurige duur uit.", "w": ["Hij vertraagt het request vóór de handler, zodat de wachtwoordcontrole zelf trager wordt voor een aanvaller.", "Hij telt de mislukte pogingen per IP-adres en blokkeert verdere pogingen na een aantal fouten.", "Hij vertraagt enkel geslaagde logins, zodat een foute poging sneller antwoordt dan een juiste."], "x": ["De vertraging zit op het antwoord, na de handler. Een snelle hash blijft snel.", "Dat is rate limiting. Dit project heeft dat niet.", "Het omgekeerde zou net een tijdverschil geven. Ook de fout wordt uitgesteld."], "m": "Vertraging op de terugweg", "y": "Zowel een geslaagde als een foute login wacht een willekeurige tijd tot auth.maxDelay. Zo verraadt de responstijd niets over bestaande e-mailadressen.", "d": "", "o": "around advice. De interceptor omwikkelt de handler en past enkel het moment van het antwoord aan.", "u": "De interceptor roept next.handle() aan en laat de login-handler normaal lopen. Daarna koppelt hij er een delay aan met een willekeurige duur tussen 0 en auth.maxDelay. Bij een fout (verkeerd wachtwoord) wordt eveneens eerst gewacht, en dan pas de fout doorgegeven (catchError met een timer).\n\nZo antwoorden een bestaand en een onbestaand adres, juist of fout wachtwoord, met een willekeurige en dus niet te onderscheiden vertraging. De responstijd verraadt niets meer.\n\nValkuil. De vertraging zit op het antwoord, niet op de wachtwoordcontrole. Dit is geen rate limiting en blokkeert geen account."}, {"id": "q159", "ch": "3", "q": "Waarom controleert assertOwner in de service of Anna de auteur van een review is, en niet een guard?", "c": "Om de auteur te kennen moet je de review uit de databank halen. De service heeft die al geladen, een guard heeft die gegevens niet.", "w": ["Een guard mag enkel naar rollen kijken, de Nest-documentatie verbiedt het gebruik van route-parameters in guards.", "Een service draait vóór de guards, en kent daardoor de gebruiker al wanneer het eigenaarschap gecontroleerd wordt.", "Een guard kan enkel 401 teruggeven, terwijl het eigenaarschap met 403 beantwoord moet worden."], "x": ["Een guard mag parameters lezen. CheckUserAccessGuard doet dat met :id.", "De service loopt na de guards en de pipes, niet ervoor.", "Een guard kan elke HttpException gooien, ook 403."], "m": "Eigenaarschap in de service", "y": "De RolesGuard weet enkel of de rol klopt. Of dit record van jou is, hangt af van de data. Daarom assertOwner (eigenaar of admin) in de service, met 403 als antwoord.", "d": "", "o": "autorisatie op domeinniveau hoort bij de domeinlaag. Een algemene toegangscontrole kent de data niet.", "u": "De RolesGuard weet enkel welke rol je hebt. Of dit review van jou is, hangt af van de data: de userId in de rij. Om dat te weten moet je de review eerst uit de databank halen. In ReviewsService staat daarom: const review = await this.getById(id); assertOwner(user, review.userId);.\n\nassertOwner laat de eigenaar en admins door en gooit anders een ForbiddenException: 403. Eén functie, op één plaats (common/ownership.ts), gebruikt voor reviews en speelsessies.\n\nValkuil. Een guard mag parameters lezen (CheckUserAccessGuard doet dat met :id), maar het is niet de plaats voor een databankopvraging per entiteit. De domeinlogica hoort in de service."}, {"id": "q160", "ch": "3", "q": "Wanneer schrijft de LoggerMiddleware zijn regel met methode, URL en statuscode?", "c": "Nadat het antwoord is verstuurd (res.on('finish')), met een niveau dat afhangt van de statuscode.", "w": ["Vóór de guards, met enkel de methode en de URL, omdat de statuscode dan nog niet gekend is.", "Enkel bij fouten (4xx en 5xx), want gewone aanvragen hoeven niet in het logboek.", "Na de controller maar voor de interceptors, zodat de statuscode door een interceptor nog kan wijzigen."], "x": ["Hij logt ook de statuscode en wacht daarvoor op het einde.", "Alle aanvragen worden gelogd, enkel het niveau verschilt.", "Een middleware draait nooit tussen controller en interceptors. Hij luistert op het antwoord zelf."], "m": "Logger na afloop", "y": "De middleware registreert een luisteraar op het finish-event en roept next() onmiddellijk aan. Fouten (5xx) worden error, 4xx warn, de rest log.", "d": "", "o": "", "u": "LoggerMiddleware registreert in use() een luisteraar op res.on('finish') en roept meteen next() aan. Pas wanneer het antwoord verstuurd is, schrijft de luisteraar de regel met methode, URL en statuscode. Het niveau hangt af van de code: 500 en hoger error, 400 en hoger warn, de rest log.\n\nZo wordt elk request gelogd, ook de geweigerde (401, 403), omdat de middleware vooraan zit en het finish-event altijd komt.\n\nValkuil. Zonder next() zou het request blijven hangen. En de statuscode is pas bij finish gekend."}], "topics": {"rest": "REST en NestJS", "data": "Datalaag en relaties", "auth": "Authenticatie en autorisatie", "val": "Validatie en fouten", "feat": "Features", "test": "Testen", "ops": "Docker en opstarten", "git": "Workflow", "docs": "Documentatie en verdediging"}, "cards": [{"t": "rest", "f": "Wat is REST?", "b": "Een architectuurstijl voor communicatie tussen software via HTTP (Roy Fielding, 2000). Het zegt niets over de implementatie, enkel welke principes je volgt."}, {"t": "rest", "f": "Noem de vijf architectuurbeperkingen van REST.", "b": "Uniforme interface, client/server, stateless, cacheable en gelaagd systeem."}, {"t": "rest", "f": "Wat betekent stateless, en waar zie je dat in ons project?", "b": "De server bewaart geen sessiestatus tussen requests. Elk request bevat alles wat nodig is. Bij ons is dat het JWT in de Authorization-header."}, {"t": "rest", "f": "Hoe benoem je URL's volgens de cursus? Geef een voorbeeld uit ons project.", "b": "Zelfstandig naamwoord in het meervoud, geen werkwoorden: /api/games, /api/play-sessions. De HTTP-methode geeft de actie aan. Geneste routes tonen de relatie: /api/play-sessions/:id/participants."}, {"t": "rest", "f": "Welke HTTP-methoden horen bij CRUD?", "b": "GET lezen, POST aanmaken, PUT volledige resource aanpassen, PATCH enkel gewijzigde velden aanpassen, DELETE verwijderen. Wij gebruiken PUT."}, {"t": "rest", "f": "Welke statuscodes gebruiken we voor een geslaagde aanvraag?", "b": "200 voor ophalen en aanpassen, 201 voor aanmaken, 204 voor verwijderen zonder body (bij categorieën)."}, {"t": "rest", "f": "Waarom geven lijstroutes { \"items\": [...] } en geen kale array?", "b": "De cursus geeft als reden dat dit JSON hijacking voorkomt. Het laat ook toe om later velden toe te voegen, zoals een totaal bij paginatie."}, {"t": "rest", "f": "Wat is een module in NestJS?", "b": "Een groep van controllers, providers en imports voor één domein (@Module met imports, controllers, providers en exports). AppModule is de root."}, {"t": "rest", "f": "Wat doet een controller, en wat mag er niet in staan?", "b": "Hij verwerkt HTTP-verzoeken: routes, statuscodes, validatie en autorisatie via decorators. Er mag geen domeinlogica in."}, {"t": "rest", "f": "Wat doet een service (provider)?", "b": "Een @Injectable-klasse met alle domeinlogica, zoals de wachtlijst of het gemiddelde van de reviews. Ze spreekt de datalaag aan en staat in de providers-array van de module."}, {"t": "rest", "f": "Wat is dependency injection?", "b": "Nest maakt instanties aan in de IoC-container en injecteert ze via de constructor. Het type van de parameter bepaalt welke provider geïnjecteerd wordt. Providers zijn standaard singletons."}, {"t": "rest", "f": "Wat is een DTO?", "b": "Een Data Transfer Object. Het bepaalt de vorm van request- en responsedata en draagt de validatieregels als decorators."}, {"t": "rest", "f": "Welke drie lagen onderscheidt de cursus en wat hoort waar?", "b": "REST-laag (controller en DTO's), servicelaag (domeinlogica) en datalaag (Drizzle, schema, migraties)."}, {"t": "rest", "f": "Waarom hebben jullie geen repositorylaag?", "b": "Volgens de cursus fungeert Drizzle als ORM zelf als repository. De service gebruikt de Drizzle-client via @InjectDrizzle(). Het cursusadvies is: overal een repository of nergens."}, {"t": "rest", "f": "Waarom heet de login-controller AuthController en niet SessionController?", "b": "Omdat een sessie bij ons al iets anders betekent: een speelsessie."}, {"t": "rest", "f": "Waarom blijft de /api-prefix permanent?", "b": "app.setGlobalPrefix('api') staat in de cursus ook permanent. Elke route is /api/..."}, {"t": "data", "f": "Wat is een ORM en waarom Drizzle?", "b": "Een ORM genereert SQL en vertaalt resultaten naar objecten. Drizzle heeft native TypeScript-ondersteuning en we hebben geen geavanceerde queries nodig. Het is ook de keuze van de cursus."}, {"t": "data", "f": "Wat zijn DrizzleAsyncProvider en @InjectDrizzle()?", "b": "DrizzleAsyncProvider is de sleutel van de async provider. @InjectDrizzle() is een eigen decorator die @Inject(DrizzleAsyncProvider) aanroept. De factory leest de databankconfiguratie via ConfigService en maakt een MySQL connection pool."}, {"t": "data", "f": "Welke module beheert de connectie, en wat gebeurt bij het afsluiten?", "b": "DrizzleModule. Hij sluit de connectie in onModuleDestroy met this.db.$client.end(). Dat gebeurt bij een stop-signaal enkel als app.enableShutdownHooks() aan staat."}, {"t": "data", "f": "Wat is een migratie?", "b": "Een genummerd SQL-bestand dat het schema versioneert (drizzle-kit generate, daarna db:migrate). Drizzle bewaart de uitgevoerde migraties in de tabel __drizzle_migrations."}, {"t": "data", "f": "Waarom bewerk je nooit een bestaande migratie?", "b": "Ze is mogelijk al uitgevoerd op andere omgevingen. Je voegt een nieuwe migratie toe."}, {"t": "data", "f": "Waarom zaten alle schemawijzigingen in chore/schema-update?", "b": "Eén branch maakt alle migraties. Parallelle branches die elk een migratie genereren, conflicteren in migrations/meta/_journal.json."}, {"t": "data", "f": "Wanneer draaien jullie migraties, en wat is de afweging?", "b": "Bij het opstarten (DrizzleModule.onModuleInit), zodat de app in Docker met één commando start. De cursus draait ze vóór de serverstart. Nadeel: meerdere gelijktijdige instanties zouden allemaal migreren."}, {"t": "data", "f": "Wat is een seed en wanneer gebruik je hem?", "b": "Testdata voor development (db:seed). Niet voor productie: data die daar nodig is, hoort in een migratie. De seed wist eerst in de juiste volgorde, vanwege de foreign keys."}, {"t": "data", "f": "Hoe voer je de seed uit in Docker?", "b": "docker compose exec api node dist/src/drizzle/seed.js. Nooit automatisch, want de seed wist bestaande gegevens."}, {"t": "data", "f": "Welke twee veel-op-veel relaties zijn er?", "b": "users en play_sessions via play_session_participants (met status en joinedAt), en games en categories via game_categories."}, {"t": "data", "f": "Wat is het verschil tussen een tussentabel met en zonder extra kolommen?", "b": "Met: play_session_participants (status, joinedAt), zoals transactions in de cursus. Zonder: game_categories, zoals user_favorite_places. Beide hebben een samengestelde sleutel."}, {"t": "data", "f": "Waarom geen service of controller voor een tussentabel?", "b": "Een tussentabel heeft zonder haar ouder geen zin (cursusregel en beoordelingscriterium). Je beheert ze via de ouder: categoryIds bij games, /participants bij sessies."}, {"t": "data", "f": "Wat is het verschil tussen een foreign key in de tabel en relations()?", "b": "De foreign key (met onDelete) staat in de tabeldefinitie en bewaakt de integriteit in de databank. relations() is enkel voor Drizzle: types en de relationele query-API. De databank gebruikt het niet."}, {"t": "data", "f": "Wanneer gebruik je with: en wanneer een join?", "b": "Bij ons staat enkel with: in de games-service (geen expliciete joins). with: haalt gerelateerde data ORM-achtig op, ook genest, maar je kan er niet mee filteren op een kolom van de gejoinde tabel. Daarvoor gebruik je de query builder met innerJoin. De COUNT-query heeft dan dezelfde join nodig."}, {"t": "data", "f": "Wat is het verschil tussen cascade en no action bij onDelete?", "b": "Cascade verwijdert de kinderen mee (categorie weg, dan ook de rijen in game_categories). No action laat het verwijderen falen zolang er verwijzingen zijn (spel met speelsessies, resulterend in 409)."}, {"t": "data", "f": "Waarom een unieke index in de databank voor één review per spel?", "b": "De databank dwingt het af, ook bij gelijktijdige requests. Een check in code alleen kan door een race condition twee reviews laten slagen. Het gaat om idx_review_user_game_unique; de filter maakt er een 409 van."}, {"t": "data", "f": "Wat geeft MySQL terug bij een insert, en wat doe je daarna?", "b": "Enkel het id ($returningId()). Daarna haal je de volledige rij op."}, {"t": "auth", "f": "Wat is het verschil tussen authenticatie en autorisatie?", "b": "Authenticatie: wie ben je (login). Autorisatie: wat mag je (rollen en eigenaarschap)."}, {"t": "auth", "f": "Hoe worden wachtwoorden opgeslagen?", "b": "Gehasht met argon2id, met een salt. De parameters zitten in de hash zelf. Verify heeft ze dus niet apart nodig en je kan later zwaardere kiezen zonder bestaande hashes te breken."}, {"t": "auth", "f": "Hoe is een JWT opgebouwd, en wat zit in onze payload?", "b": "Header, payload en signature. Onze payload: sub, email, roles, iat, exp, aud en iss. Het token is een uur geldig."}, {"t": "auth", "f": "Waarom stop je geen gevoelige data in een JWT?", "b": "Het is ondertekend, niet versleuteld: iedereen kan de payload lezen. De signature (berekend met het secret) voorkomt enkel dat hij ongemerkt gewijzigd wordt. Het secret komt uit de omgeving, nooit uit de code."}, {"t": "auth", "f": "Welke guards zijn er en wat doen ze?", "b": "AuthGuard: token verifiëren, request.user zetten, anders 401. RolesGuard: @Roles controleren, anders 403. CheckUserAccessGuard: voor /users/:id, toegestaan bij me, je eigen id of als admin; voor andermans id een 404."}, {"t": "auth", "f": "Waarom zijn AuthGuard en RolesGuard globaal via APP_GUARD?", "b": "Ze staan als APP_GUARD-providers in UsersModule. Veiligheid by default: elke nieuwe route is automatisch beveiligd. Een open route moet bewust @Public() krijgen (login, registreren, health)."}, {"t": "auth", "f": "Wanneer geef je 401, 403 of 404?", "b": "401: niet aangemeld of ongeldig of verlopen token. 403: wel aangemeld, maar zonder de rol of het eigenaarschap. 404 bij CheckUserAccessGuard (cursus): zo lek je niet dat een gebruiker bestaat."}, {"t": "auth", "f": "Wat doet de AuthDelayInterceptor?", "b": "Hij voegt een willekeurige vertraging toe (0 tot auth.maxDelay ms), ook bij fouten. Dat is tegen timing attacks: anders antwoordt een onbekend e-mailadres sneller dan een bekend adres met een fout wachtwoord."}, {"t": "auth", "f": "Wat is assertOwner(), en hoe verschilt het van de cursus?", "b": "Eén herbruikbare functie die de eigenaar (host of auteur) of een admin toelaat. In de cursus mag zelfs een admin andermans transactie niet wijzigen, omdat die privé financiële data is. Sessies en reviews zijn semi-publiek en verdienen moderatie."}, {"t": "auth", "f": "Hoe voorkom je dat passwordHash naar de client gaat?", "b": "Met een response-DTO met @Expose() en plainToInstance met excludeExtraneousValues: true. PublicUserResponseDto toont geen passwordHash en geen roles."}, {"t": "val", "f": "Wat is het fail-fast principe?", "b": "Bij een validatiefout stopt de verwerking meteen en krijgt de client een duidelijke melding (400), zonder technische details."}, {"t": "val", "f": "Welke opties heeft jullie globale ValidationPipe?", "b": "whitelist, forbidNonWhitelisted, forbidUnknownValues, transform en een exceptionFactory die fouten per veld groepeert in details.body."}, {"t": "val", "f": "Wat is het verschil tussen pipe, guard, interceptor en filter?", "b": "Guard: mag het request door? Pipe: valideert of transformeert invoer. Interceptor: code vóór en/of na de handler. Filter: zet een exception om in een response. Volgorde: middleware, guards, interceptors, pipes, handler, bij fout de filters."}, {"t": "val", "f": "Hoe ziet een foutrespons eruit?", "b": "statusCode, timestamp, message en details (HttpExceptionFilter). details is enkel gevuld als de exception het meegeeft."}, {"t": "val", "f": "Wat doet de DrizzleQueryErrorFilter?", "b": "Hij vertaalt MySQL-foutcodes: ER_DUP_ENTRY wordt 409, ER_NO_REFERENCED_ROW_2 wordt 404, ER_ROW_IS_REFERENCED_2 wordt 409. De boodschap kiest hij via de indexnaam."}, {"t": "val", "f": "Welke bug vond Thibault in de review van games?", "b": "Een spel verwijderen dat nog speelsessies had, gaf een 500, omdat ER_ROW_IS_REFERENCED_2 niet vertaald werd. Nu een 409 met een e2e-test. 500 is voor fouten die de client niet kan vermijden."}, {"t": "val", "f": "Wat doet @Type van class-transformer?", "b": "Het zet query-parameters (altijd strings) en datums om naar het juiste type, zodat validaties zoals @IsInt() slagen."}, {"t": "feat", "f": "Wat bevat GET /api/games/:id extra?", "b": "averageRating en reviewCount, berekend met avg() en count() op de reviews (null en 0 zonder reviews), plus de categorieën."}, {"t": "feat", "f": "Hoe werkt de afbeeldingsupload?", "b": "PUT /api/games/:id/image (admin). FileInterceptor('file') en ParseFilePipe (5 MB, jpeg, png of webp). CloudinaryService stuurt de bytes via upload_stream naar de map boardgamenight/games. De secure_url komt in games.imageUrl."}, {"t": "feat", "f": "Waarom Cloudinary?", "b": "Afbeeldingen horen niet in de databank en niet op de schijf van de server. Cloudinary bewaart ze en geeft een URL terug."}, {"t": "feat", "f": "Wat doet categoryIds bij PUT /api/games/:id?", "b": "Weggelaten: koppelingen blijven. []: alle koppelingen weg. [1, 2]: vervangen door precies die twee. Alles in één transactie; een onbekende categorie geeft 404 en alles wordt teruggedraaid."}, {"t": "feat", "f": "Welke regels gelden voor reviews?", "b": "Eén per gebruiker per spel (unieke index, 409). Rating 1 tot 5. Comment optioneel (maximaal 500 tekens; null wist, weggelaten behoudt). userId uit het token. PUT en DELETE door auteur of admin."}, {"t": "feat", "f": "Wat gebeurt er als je je inschrijft voor een volle sessie?", "b": "Je krijgt de status waitlisted (geen 409 meer). Een bevestigde of wachtende deelnemer die zich opnieuw inschrijft, krijgt wel 409."}, {"t": "feat", "f": "Wie schuift door van de wachtlijst?", "b": "De wachtende met de oudste joinedAt; bij een gelijk tijdstip het laagste userId. Dat gebeurt bij uitschrijven en bij een verhoging van maxParticipants. Een capaciteit lager dan het aantal bevestigden geeft 409."}, {"t": "feat", "f": "Waarom een transactie met for update bij de wachtlijst?", "b": "Twee gelijktijdige verzoeken zouden dezelfde vrijgekomen plaats kunnen innemen. In db.transaction wordt de sessierij vergrendeld, zodat de bewerkingen na elkaar lopen."}, {"t": "feat", "f": "Wie mag wat bij speelsessies?", "b": "Elke ingelogde gebruiker mag alle sessies bekijken en zich inschrijven. PUT en DELETE mag enkel de host of een admin. De host komt uit het token en neemt niet automatisch deel."}, {"t": "feat", "f": "Waarom heeft het speldetail geen volledige lijst met reviews?", "b": "Om geen afhankelijkheid tussen GamesModule en de reviews-code te maken, want die werden parallel ontwikkeld. De lijst staat op GET /api/reviews?gameId=."}, {"t": "test", "f": "Wat is het verschil tussen unit-, integratie- en e2e-testen volgens de cursus?", "b": "Unit: één unit zonder dependencies. Integratie: de app met validatie, auth en databank (de focus van de cursus). E2E: vanuit de UI (niet van toepassing). Onze *.e2e-spec.ts-bestanden zijn dus integratietesten."}, {"t": "test", "f": "Hoe is onze testomgeving opgebouwd?", "b": "Testcontainers start via jest.global-setup één MySQL-container, zet DATABASE_URL en voert de migraties uit. jest.global-teardown stopt hem. De tests gebruiken supertest tegen een INestApplication met een echte databank."}, {"t": "test", "f": "Waarom --runInBand?", "b": "De suites lopen na elkaar, zodat de gedeelde databank consistent blijft."}, {"t": "test", "f": "Waarom env-cmd en .env.test?", "b": "Jest kent geen --env-file. env-cmd laadt .env.test, met dummywaarden en LOG_DISABLED=true."}, {"t": "test", "f": "Wat is testAuthHeader?", "b": "Een herbruikbare helper die voor een route de 401-gevallen test (geen of ongeldig token)."}, {"t": "test", "f": "Hoe testen jullie de Cloudinary-upload?", "b
