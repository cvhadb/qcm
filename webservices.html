": "overrideProvider vervangt CloudinaryService door een stub met een vaste URL. Geen netwerk en geen sleutels. De echte service heeft daardoor lage coverage (rond 41%)."}, {"t": "test", "f": "Waarom staat NODE_OPTIONS=--experimental-vm-modules in .env.test?", "b": "Jest kan het ESM-pakket file-type niet laden, dat Nest in FileTypeValidator gebruikt. Zonder die schakelaar kreeg elke geldige afbeelding een 400."}, {"t": "test", "f": "Wat zijn onze testresultaten?", "b": "7 suites, 168 tests, 94,65% statements en 71,5% branches. Categories, reviews en play-sessions staan op 100%, games rond 98%. Coverage toont welke code uitgevoerd is, niet of de tests zinvol zijn."}, {"t": "ops", "f": "Waarom een multi-stage Dockerfile?", "b": "Voor een kleine image: enkel productie-afhankelijkheden, de gebouwde dist en de migraties, zonder dev-tools. Stages: base, dev-deps, prod-deps, builder en runner."}, {"t": "ops", "f": "Wat staat er in docker-compose.yml?", "b": "db (mysql:8.0, volume db_data, healthcheck) en api (build ./backend, env_file, DATABASE_URL overschreven, depends_on met service_healthy, healthcheck op /api/health/ping)."}, {"t": "ops", "f": "Welke bug zat er in de healthcheck van de databank?", "b": "-h localhost gebruikte het interne socket van de tijdelijke init-server. Die meldde al gezond, de API startte te vroeg en crashte met ECONNREFUSED. Oplossing: -h 127.0.0.1 (TCP) en een korter interval."}, {"t": "ops", "f": "Waarom stopte de container met exitcode 137, en wat is de oplossing?", "b": "onModuleDestroy werd nooit aangeroepen en Docker doodde het proces na 10 seconden. Met app.enableShutdownHooks() stopt hij in 0,2 seconden met exitcode 0."}, {"t": "ops", "f": "Hoe start je alles op?", "b": "docker compose up --build -d --wait. De seed apart. Je hebt Compose 2.24 of nieuwer nodig en poorten 3000 en 3306 moeten vrij zijn."}, {"t": "ops", "f": "Wat doet docker compose down -v?", "b": "Het verwijdert de containers, het netwerk en het volume, dus alle databankdata. Zonder -v blijft de data bewaard."}, {"t": "git", "f": "Wat is de Feature Branch Workflow?", "b": "Elke feature in een eigen branch, een pull request met inhoudelijke review van de andere student, en mergen met een merge commit."}, {"t": "git", "f": "Waarom --no-ff en nooit squashen?", "b": "Zo blijft elke individuele commit zichtbaar in main. De ontvankelijkheidscriteria vragen dat."}, {"t": "git", "f": "Wat is een inhoudelijke review?", "b": "Een opmerking over concrete code of gedrag, niet enkel 'looks good'. Voorbeelden bij ons: de 500 bij het verwijderen van een spel met sessies en de ontbrekende wachtlijst."}, {"t": "git", "f": "Waarom gaf app.module.ts een mergeconflict?", "b": "Parallelle branches voegen elk een module toe aan dat bestand. Wie als tweede merget, lost het op door beide registraties te bewaren."}, {"t": "git", "f": "In welke volgorde werden de branches gemaakt, en waarom?", "b": "setup, dan auth (de globale guards raken alles), dan schema-update (alle migraties op één plek), games en reviews parallel, play-sessions na games, categories, finalize en docs/dossier."}, {"t": "docs", "f": "Wat is het verschil tussen OpenAPI en Swagger UI?", "b": "OpenAPI is de programmeertaal-onafhankelijke beschrijving van een API (YAML of JSON). Swagger UI is de interactieve pagina, bij ons op /docs (JSON op /docs-json)."}, {"t": "docs", "f": "Wat doen DocumentBuilder, SwaggerModule en nestjs-swagger-dto?", "b": "DocumentBuilder zet titel, versie en bearer-auth. SwaggerModule maakt het document (createDocument) en de UI (setup). nestjs-swagger-dto combineert validatie en documentatie voor request-DTO's; voor responses gebruik je @ApiProperty."}, {"t": "docs", "f": "Hoe test je beveiligde routes in Swagger?", "b": "Log in via POST /api/auth/login, kopieer het token, klik op Authorize en gebruik Try it out."}, {"t": "docs", "f": "Wat is paginatie en hoe implementeer je het?", "b": "Een DTO met page en pageSize, een offset uit die twee, een aparte COUNT-query en een tweede sorteerveld op een unieke kolom. Bij ons staat PaginationQuery (page, pageSize) in common.dto.ts, maar de lijstroutes gebruiken ze nog niet."}, {"t": "docs", "f": "Wat zijn onze zwakke punten?", "b": "Geen CI-workflow (niet vereist), paginatie niet aangesloten (PaginationQuery ongebruikt), weinig unit tests (enkel ownership.spec.ts, 3 tests), Cloudinary gemockt in de tests, migraties bij het opstarten, en de ViCHOgent-poort. Wees eerlijk en toon dat je weet hoe het beter kan."}, {"t": "docs", "f": "Hoe verdedig je dat services Drizzle-code bevatten?", "b": "De cursus zegt dat Drizzle zelf de repository is. Er staat geen ruwe SQL in onze services, enkel de ORM-interface."}, {"t": "val", "f": "Teken de volledige pipeline van een request, heen en terug.", "b": "Heen: middleware (Logger, Helmet, CORS), guards (Auth 401, Roles 403, CheckUserAccess 404), interceptor, pipes (400), controller, service, Drizzle, MySQL. Terug: Drizzle, service (response-DTO), controller, interceptor. Bij een fout vangen de filters het op. Onthoud M-G-I-P-C."}, {"t": "val", "f": "Waarom geeft een request zonder token en met een ongeldige body 401 en geen 400?", "b": "Guards lopen vóór pipes. De keten stopt bij de eerste schakel die een exception gooit, dus de pipe wordt nooit bereikt."}, {"t": "val", "f": "Welke onderdelen werken enkel op de heenweg, en welke ook op de terugweg?", "b": "Enkel heen: guards en pipes. Heen en terug: interceptors. Bij fouten: filters. Middleware draait vooraan, de LoggerMiddleware luistert wel op het einde van het antwoord."}, {"t": "val", "f": "Waar houden we passwordHash uit het antwoord?", "b": "In de service: plainToInstance met excludeExtraneousValues naar een response-DTO met enkel @Expose-velden. Dus niet in een interceptor."}, {"t": "val", "f": "Welke filter zet welke fout om?", "b": "HttpExceptionFilter: elke HttpException naar { statusCode, timestamp, message, details }. DrizzleQueryErrorFilter: ER_DUP_ENTRY 409, ER_NO_REFERENCED_ROW_2 404, ER_ROW_IS_REFERENCED_2 409, de rest wordt 500."}]};
const CH = DATA.chapters, ALL = DATA.qcm, CARDS = DATA.cards, TOPICS = DATA.topics;
const $ = id => document.getElementById(id);
const KEY = 'bgn-qcm-review', KKEY = 'bgn-cards-known';
let mode = 'qcm', filter = 'all', cfilter = 'all';
let deck = [], idx = 0, answers = {}, good = 0, bad = 0, wrongList = [];
let cdeck = [], cidx = 0, cflip = false, onlyOpen = false;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function codeify(s) { return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>'); }
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let review = load(KEY, []), known = load(KKEY, []);

function buildFilters() {
  const bar = $('filter-bar'); bar.innerHTML = '';
  const add = (id, label, active) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'filter-btn' + (active ? ' active' : ''); b.innerHTML = label;
    b.onclick = () => { if (mode === 'qcm') filter = id; else cfilter = id; buildFilters(); start(); };
    bar.appendChild(b);
  };
  if (mode === 'qcm') {
    add('all', 'Alles (' + ALL.length + ')', filter === 'all');
    Object.keys(CH).forEach(k => add(k, CH[k] + ' (' + ALL.filter(q => q.ch === k).length + ')', filter === k));
    add('review', '✗ Te herhalen (' + review.length + ')', filter === 'review');
  } else {
    add('all', 'Alles (' + CARDS.length + ')', cfilter === 'all');
    Object.keys(TOPICS).forEach(k => add(k, TOPICS[k] + ' (' + CARDS.filter(c => c.t === k).length + ')', cfilter === k));
  }
}

/* ---------- QCM ---------- */
function prepare(list) {
  return shuffle(list.map(c => ({ ...c, opts: shuffle([{ t: c.c, ok: true }, ...c.w.map((t, i) => ({ t, ok: false, why: c.x[i] }))]) })));
}
function buildDeck(src) {
  let list;
  if (src) list = src;
  else if (filter === 'all') list = ALL;
  else if (filter === 'review') { list = ALL.filter(c => review.includes(c.id)); if (!list.length) list = ALL; }
  else list = ALL.filter(c => c.ch === filter);
  deck = prepare(list); idx = 0; answers = {}; good = 0; bad = 0; wrongList = [];
  $('done-screen').hidden = true; $('qcard').hidden = false;
  updateStats(); render();
}
function updateStats() {
  $('stat-good').textContent = good; $('stat-bad').textContent = bad;
  const n = good + bad; $('stat-pct').textContent = n ? Math.round(good / n * 100) + '%' : '–';
}
function render() {
  const c = deck[idx];
  $('card-label').textContent = 'Vraag ' + (idx + 1) + ' · ' + CH[c.ch];
  $('card-question').innerHTML = codeify(c.q);
  const box = $('options'); box.innerHTML = '';
  const chosen = answers[idx];
  c.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    b.innerHTML = '<span class="key">' + 'ABCD'[i] + '</span><span class="txt">' + codeify(o.t) + '</span>';
    b.onclick = () => choose(i);
    if (chosen !== undefined) {
      b.disabled = true;
      if (o.ok) b.classList.add('correct'); else if (i === chosen) b.classList.add('wrong'); else b.classList.add('dim');
    }
    box.appendChild(b);
  });
  const ex = $('expl');
  if (chosen !== undefined) {
    const ok = c.opts[chosen].ok, v = $('verdict');
    v.textContent = ok ? 'Juist.' : 'Niet juist. Het goede antwoord is groen gemarkeerd.';
    v.className = 'verdict ' + (ok ? 'ok' : 'ko');
    $('expl-method').innerHTML = codeify(c.m);
    const wrongs = c.opts.map((o, i) => ({ o, i })).filter(x => !x.o.ok);
    const body = c.u ? '<div class="lbl">Uitleg</div>' + c.u.split('\n\n').map(p => '<p class="' + (/^Valkuil/.test(p) ? 'pit' : '') + '">' + codeify(p) + '</p>').join('') : '<div>' + codeify(c.y) + '</div>';
    $('expl-waarom').innerHTML = body + '<div class="lbl">Waarom de andere opties fout zijn</div><ul>' +
      wrongs.map(x => '<li><b>' + 'ABCD'[x.i] + '</b><span>' + codeify(x.o.why) + '</span></li>').join('') + '</ul>';
    const dt = $('expl-detail'); if (c.d) { dt.innerHTML = codeify(c.d); dt.hidden = false; } else dt.hidden = true;
    const oo = $('expl-oosd'); if (c.o) { oo.innerHTML = '<span class="k">OOSD-parallel</span>' + codeify(c.o); oo.hidden = false; } else oo.hidden = true;
    ex.hidden = false;
  } else ex.hidden = true;
  $('current-num').textContent = idx + 1; $('total-num').textContent = deck.length;
  const pct = Math.round((idx + 1) / deck.length * 100);
  $('progress-fill').style.width = pct + '%';
  $('progress-text').textContent = 'Vraag ' + (idx + 1) + ' van ' + deck.length + ' · ' + pct + '% van de reeks';
}
function choose(i) {
  if (answers[idx] !== undefined) return;
  answers[idx] = i;
  const c = deck[idx], ok = c.opts[i].ok;
  review = review.filter(x => x !== c.id);
  if (ok) good++; else { bad++; review.push(c.id); wrongList.push(c); }
  save(KEY, review); updateStats(); render(); refreshReviewLabel();
  $('btn-next').focus({ preventScroll: true });
}
function refreshReviewLabel() {
  const btns = $('filter-bar').querySelectorAll('.filter-btn'), last = btns[btns.length - 1];
  if (mode === 'qcm' && last) last.innerHTML = '✗ Te herhalen (' + review.length + ')';
}
function showDone() {
  $('qcard').hidden = true; $('done-screen').hidden = false;
  $('final-good').textContent = good; $('final-bad').textContent = bad;
  const b = $('btn-retry'); b.hidden = !wrongList.length;
  b.textContent = 'Herhaal foute vragen (' + wrongList.length + ')';
}

/* ---------- Blokkaarten ---------- */
function buildCards() {
  let list = CARDS.map((c, i) => ({ ...c, id: i })).filter(c => cfilter === 'all' || c.t === cfilter);
  if (onlyOpen) list = list.filter(c => !known.includes(c.id));
  cdeck = shuffle(list); cidx = 0; cflip = false;
  $('done-screen').hidden = true; $('qcard').hidden = false;
  renderCard();
}
function renderCard() {
  const total = CARDS.filter(c => cfilter === 'all' || c.t === cfilter).length;
  const kn = CARDS.filter((c, i) => (cfilter === 'all' || c.t === cfilter) && known.includes(i)).length;
  $('stat-good').textContent = kn; $('stat-bad').textContent = total - kn;
  $('stat-pct').textContent = total ? Math.round(kn / total * 100) + '%' : '–';
  const box = $('options'); box.innerHTML = ''; $('expl').hidden = true;
  if (!cdeck.length) {
    $('card-label').textContent = 'Blokkaarten'; $('card-question').textContent = 'Geen kaarten in deze selectie. Zet "Alleen te oefenen" uit of kies een ander onderwerp.';
    $('current-num').textContent = 0; $('total-num').textContent = 0; $('progress-fill').style.width = '0%'; return;
  }
  const c = cdeck[cidx];
  $('card-label').textContent = 'Kaart ' + (cidx + 1) + ' · ' + TOPICS[c.t] + (known.includes(c.id) ? ' · gekend' : '');
  $('card-question').innerHTML = codeify(c.f);
  const f = document.createElement('div'); f.className = 'flip'; f.tabIndex = 0; f.setAttribute('role', 'button');
  f.innerHTML = cflip ? '<div class="ans">' + codeify(c.b) + '</div>' : '<div class="tap">Formuleer het antwoord eerst hardop. Klik om om te draaien.</div>';
  f.onclick = () => { cflip = !cflip; renderCard(); };
  f.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cflip = !cflip; renderCard(); } };
  box.appendChild(f);
  if (cflip) {
    const row = document.createElement('div'); row.className = 'controls'; row.style.marginTop = '16px';
    const y = document.createElement('button'); y.type = 'button'; y.className = 'btn btn-primary'; y.textContent = 'Ken ik';
    const n = document.createElement('button'); n.type = 'button'; n.className = 'btn btn-secondary'; n.textContent = 'Nog oefenen';
    y.onclick = () => { if (!known.includes(c.id)) known.push(c.id); save(KKEY, known); cardStep(1); };
    n.onclick = () => { known = known.filter(x => x !== c.id); save(KKEY, known); cardStep(1); };
    row.appendChild(y); row.appendChild(n); box.appendChild(row);
  }
  $('current-num').textContent = cidx + 1; $('total-num').textContent = cdeck.length;
  const pct = Math.round((cidx + 1) / cdeck.length * 100);
  $('progress-fill').style.width = pct + '%';
  $('progress-text').textContent = 'Kaart ' + (cidx + 1) + ' van ' + cdeck.length;
}
function cardStep(d) { cidx = Math.min(cdeck.length - 1, Math.max(0, cidx + d)); cflip = false; renderCard(); }

/* ---------- navigatie ---------- */
function start() { if (mode === 'qcm') buildDeck(); else buildCards(); }
function nextQ() {
  if (mode === 'cards') { cardStep(1); return; }
  if (idx + 1 >= deck.length) { if (Object.keys(answers).length) showDone(); return; }
  idx++; render();
}
function prevQ() { if (mode === 'cards') { cardStep(-1); return; } if (idx > 0) { idx--; render(); } }
function shuffleDeck() { if (mode === 'cards') buildCards(); else buildDeck(deck.map(({ opts, ...c }) => c)); }
function setMode(m) {
  mode = m;
  $('m-qcm').classList.toggle('active', m === 'qcm'); $('m-cards').classList.toggle('active', m === 'cards');
  $('s-good-wrap').firstChild.textContent = m === 'qcm' ? 'Juist ' : 'Gekend ';
  $('s-bad-wrap').firstChild.textContent = m === 'qcm' ? 'Fout ' : 'Open ';
  document.querySelector('.stats-bar span').firstChild.textContent = m === 'qcm' ? 'Vraag ' : 'Kaart ';
  $('hints').hidden = m === 'cards';
  $('subtitle').textContent = 'Web Services · ' + (m === 'qcm' ? ALL.length + ' vragen' : CARDS.length + ' blokkaarten');
  good = bad = 0; buildFilters(); start();
}
$('m-qcm').onclick = () => setMode('qcm'); $('m-cards').onclick = () => setMode('cards');
$('btn-prev').onclick = prevQ; $('btn-next').onclick = nextQ; $('btn-shuffle').onclick = shuffleDeck;
$('btn-retry').onclick = () => buildDeck(wrongList.map(({ opts, ...c }) => c));
$('btn-again').onclick = () => buildDeck();
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (mode === 'cards') {
    if (e.key === 'ArrowRight') nextQ(); if (e.key === 'ArrowLeft') prevQ(); return;
  }
  const map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
  if (k in map && !$('qcard').hidden) { choose(map[k]); return; }
  if (e.key === 'ArrowRight' || (e.key === 'Enter' && answers[idx] !== undefined)) { e.preventDefault(); nextQ(); }
  if (e.key === 'ArrowLeft') prevQ();
  if (k === 's') shuffleDeck();
});
setMode('qcm');
</script>
</body>
