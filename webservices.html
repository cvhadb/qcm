<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verdediging Board Game Night</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark;
    --bg: #0d0f14; --surface: #161921; --border: #252a35;
    --accent: #e8ff47; --accent2: #47c8ff; --text: #e8eaf0; --muted: #8a91a5; --card-bg: #1a1f2e;
    --good: #7bc84a; --good-bg: rgba(58,110,26,.22); --good-bd: #3a6e1a;
    --bad: #e05c5c; --bad-bg: rgba(122,26,26,.22); --bad-bd: #7a1a1a;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --display: 'Syne', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-family: var(--display); font-size: clamp(1.7rem,4vw,2.5rem); font-weight: 800; letter-spacing: -1px; color: var(--accent); text-transform: uppercase; line-height: 1; text-wrap: balance; }
  header p { color: var(--muted); font-size: .78rem; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
  .modes { display: flex; gap: 8px; margin-bottom: 18px; }
  .mode-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 18px; font-family: var(--mono); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border-radius: 2px; }
  .mode-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .stats-bar { display: flex; gap: 22px; margin-bottom: 20px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; flex-wrap: wrap; justify-content: center; font-variant-numeric: tabular-nums; }
  .stats-bar strong { color: var(--accent); font-size: 1rem; }
  .stat-good strong { color: var(--good); } .stat-bad strong { color: var(--bad); }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; max-width: 880px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 2px; }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .progress-track { width: 100%; max-width: 720px; height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
  .progress-text { font-size: .7rem; color: var(--muted); text-align: center; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .qcard { width: 100%; max-width: 720px; background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 28px 32px; margin-bottom: 18px; min-width: 0; }
  .card-label { font-size: .65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 14px; }
  .card-question { white-space: pre-line; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; overflow-wrap: anywhere; }
  .card-question code, .expl code { background: rgba(71,200,255,.1); color: var(--accent2); padding: 1px 6px; border-radius: 2px; font-size: .9em; }
  .options { display: grid; gap: 10px; }
  .opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: .86rem; line-height: 1.5; padding: 12px 14px; border-radius: 3px; cursor: pointer; min-width: 0; }
  .opt .key { color: var(--muted); font-weight: 600; }
  .opt .txt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .opt:hover:not([disabled]) { border-color: var(--accent2); }
  .opt:focus-visible, .btn:focus-visible, .filter-btn:focus-visible, .mode-btn:focus-visible, .flip:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .opt[disabled] { cursor: default; }
  .opt.correct { background: var(--good-bg); border-color: var(--good-bd); }
  .opt.correct .key { color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad-bd); }
  .opt.wrong .key { color: var(--bad); }
  .opt.dim { opacity: .55; }
  .expl { margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 16px; }
  .verdict { font-family: var(--display); font-weight: 800; font-size: 1.05rem; margin-bottom: 10px; }
  .verdict.ok { color: var(--good); } .verdict.ko { color: var(--bad); }
  .expl-method { color: var(--accent2); font-weight: 600; font-size: .9rem; line-height: 1.6; margin-bottom: 8px; overflow-wrap: anywhere; }
  .expl-waarom { font-size: .85rem; line-height: 1.65; margin-bottom: 10px; overflow-wrap: anywhere; }
  .expl-waarom p { margin: 8px 0 0; }
  .expl-waarom p.pit { border-left: 2px solid var(--bad); padding-left: 10px; color: var(--text); }
  .expl-waarom ul { margin: 6px 0 0; padding-left: 0; list-style: none; color: var(--muted); display: grid; gap: 4px; }
  .expl-waarom li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
  .expl-waarom li b { color: var(--bad); }
  .expl-waarom .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 10px; }
  .expl-detail { color: var(--muted); font-size: .8rem; line-height: 1.7; overflow-wrap: anywhere; }
  .expl-oosd { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; font-size: .8rem; line-height: 1.65; color: var(--muted); overflow-wrap: anywhere; }
  .expl-oosd .k { color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-size: .68rem; display: block; margin-bottom: 2px; }
  .controls { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 12px 24px; font-family: var(--mono); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 2px; }
  .btn-primary { background: var(--accent); color: #000; } .btn-primary:hover { background: #fff; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); } .btn-secondary:hover { border-color: var(--text); color: var(--text); }
  .btn[disabled] { opacity: .4; cursor: default; }
  .kbd { display: inline-block; background: var(--border); color: var(--muted); padding: 1px 7px; border-radius: 2px; font-size: .68rem; margin: 4px 2px 0; }
  .hints { text-align: center; max-width: 720px; }
  #done-screen { width: 100%; max-width: 720px; margin-bottom: 18px; }
  .done-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .result-box { border-radius: 4px; padding: 1.2rem; text-align: center; }
  .result-box .big { font-family: var(--display); font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .result-box .lbl { font-size: .72rem; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .result-good { background: var(--good-bg); border: 1px solid var(--good-bd); color: var(--good); }
  .result-bad { background: var(--bad-bg); border: 1px solid var(--bad-bd); color: var(--bad); }
  .done-buttons { display: flex; gap: 10px; flex-wrap: wrap; } .done-buttons .btn { flex: 1; min-width: 200px; }
  .flip { cursor: pointer; }
  .flip .ans { border-top: 1px dashed var(--border); padding-top: 14px; font-size: .88rem; line-height: 1.7; white-space: pre-line; overflow-wrap: anywhere; }
  .flip .tap { color: var(--muted); font-size: .75rem; }
  @media (max-width: 520px) { .qcard { padding: 22px 18px; } .card-question { font-size: .95rem; } .opt { font-size: .82rem; } }
</style>
</head>
<body><a href="index.html" style="display:block;width:max-content;margin:14px auto 0;font:600 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a5;background:#161921;border:1px solid #252a35;padding:8px 10px;text-decoration:none">&larr; Menu</a>

<header>
  <h1>Verdediging Board Game Night</h1>
  <p id="subtitle">Web Services · mondelinge verdediging</p>
</header>

<div class="modes">
  <button class="mode-btn active" id="m-qcm" type="button">QCM</button>
  <button class="mode-btn" id="m-cards" type="button">Blokkaarten</button>
</div>

<div class="stats-bar">
  <span>Vraag <strong id="current-num">1</strong> / <strong id="total-num">–</strong></span>
  <span class="stat-good" id="s-good-wrap">Juist <strong id="stat-good">0</strong></span>
  <span class="stat-bad" id="s-bad-wrap">Fout <strong id="stat-bad">0</strong></span>
  <span>Score <strong id="stat-pct">–</strong></span>
</div>

<div class="filter-bar" id="filter-bar"></div>

<div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
<div class="progress-text" id="progress-text">Kies het juiste antwoord</div>

<div id="done-screen" hidden>
  <div class="done-grid">
    <div class="result-box result-good"><div class="big" id="final-good">0</div><div class="lbl">Juist</div></div>
    <div class="result-box result-bad"><div class="big" id="final-bad">0</div><div class="lbl">Fout</div></div>
  </div>
  <div class="done-buttons">
    <button class="btn btn-secondary" id="btn-retry" type="button">Herhaal foute vragen</button>
    <button class="btn btn-primary" id="btn-again" type="button">Alles opnieuw</button>
  </div>
</div>

<section class="qcard" id="qcard">
  <div class="card-label" id="card-label">Vraag –</div>
  <div class="card-question" id="card-question">Laden…</div>
  <div class="options" id="options"></div>
  <div class="expl" id="expl" hidden>
    <div class="verdict" id="verdict"></div>
    <div class="expl-method" id="expl-method"></div>
    <div class="expl-waarom" id="expl-waarom"></div>
    <div class="expl-detail" id="expl-detail" hidden></div>
    <div class="expl-oosd" id="expl-oosd" hidden></div>
  </div>
</section>

<div class="controls">
  <button class="btn btn-secondary" id="btn-prev" type="button">← Vorige</button>
  <button class="btn btn-primary" id="btn-next" type="button">Volgende →</button>
  <button class="btn btn-secondary" id="btn-shuffle" type="button">⇌ Schudden</button>
</div>
<div class="hints" id="hints">
  <span class="kbd">1–4 of A–D antwoorden</span>
  <span class="kbd">→ / Enter volgende</span>
  <span class="kbd">← vorige</span>
  <span class="kbd">S schudden</span>
</div>

<script>
const DATA = {"chapters": {"1": "REST & HTTP", "2": "Lagen, modules & DI", "3": "Request-pipeline", "4": "Validatie & fouten", "5": "Datalaag & ERD", "6": "Drizzle & migraties", "7": "Authenticatie", "8": "Features", "9": "Speelsessies & wachtlijst", "10": "API-documentatie", "11": "Testen", "12": "Docker", "13": "Git-workflow", "14": "OOSD-parallellen", "15": "Verdediging"}, "qcm": [{"id": "q000", "ch": "1", "q": "Wat betekent het dat een REST API stateless is?", "c": "De server onthoudt niets tussen twee requests; elk request bevat alles wat nodig is.", "w": ["De API slaat zelf geen enkel gegeven op, dus een databank is niet nodig om iets te bewaren.", "De server leest geen headers of cookies, omdat die de toestand van de client kunnen bevatten.", "Een URI mag maar één keer aangeroepen worden, daarna is de resource verbruikt en weg."], "x": ["Verwarring van 'geen toestand van de client' met 'geen data'. De databank bewaart wel de toestand van de applicatie.", "Headers lezen mag wel; het token zit net in de Authorization-header.", "Verwarring met idempotentie of eenmalige links; stateless zegt niets over hoe vaak je een URI mag oproepen."], "m": "Geen sessie op de server", "y": "Stateless gaat over de communicatie: de server onthoudt niet wie je bent of wat je vorig request deed. Daarom stuurt de client bij elk request het JWT mee.", "d": "", "o": "er is geen sessieobject dat op de server blijft leven tussen twee aanroepen.", "u": "Stateless gaat over de communicatie tussen client en server. De server bewaart tussen twee requests geen informatie over de client: geen sessieobject, geen geheugen van je vorige aanvraag. Alles wat de server nodig heeft om het request te begrijpen, zit in dat ene request zelf: de URL, de methode, de headers en de body.\n\nIn jullie project zie je dit aan de login. Na POST /api/auth/login krijg je een JWT terug. Bij elk volgend request stuur je het token mee in de Authorization-header, en de AuthGuard controleert het opnieuw. De server weet dus niet dat je 'ingelogd' bent; hij ziet enkel dat dit request een geldig token bevat.\n\nValkuil. Stateless betekent niet dat de server geen data bewaart. De databank bewaart alles. Het gaat enkel over de toestand van de verbinding of de sessie."}, {"id": "q001", "ch": "1", "q": "Welke URI volgt de conventies voor een REST API het best om alle reviews van spel 3 op te vragen?", "c": "GET /api/reviews?gameId=3", "w": ["GET /api/getReviewsForGame/3", "POST /api/reviews/search met { \"gameId\": 3 } in de body", "GET /api/review/game/3/list"], "x": ["Een werkwoord in de URI (get...) hoort niet; de HTTP-methode is al het werkwoord.", "Ophalen is een GET; POST is voor aanmaken. Zoeken met een body is geen REST-conventie.", "Enkelvoud en 'list' in de URI: de collectie wordt al aangeduid door het meervoud."], "m": "Zelfstandig naamwoord, meervoud, filter als query-parameter", "y": "Een resource is een zelfstandig naamwoord in het meervoud. Een filter op een collectie hoort in de query string.", "d": "", "o": "", "u": "In REST is een URI de identiteit van een resource. Een resource benoem je met een zelfstandig naamwoord in het meervoud: /api/reviews. De HTTP-methode geeft de actie aan (GET, POST, PUT, DELETE), dus er hoort geen werkwoord in de URL.\n\nDe reviews van spel 3 zijn geen aparte resource maar een gefilterde collectie van reviews. Een filter op een collectie zet je in de query string: GET /api/reviews?gameId=3. Dat is ook wat de ReviewsController ondersteunt.\n\nValkuil. Varianten met een werkwoord (getReviews) of een actie in het pad lijken logisch als je van functies komt, maar de cursus wil het naamwoord plus de HTTP-methode."}, {"id": "q002", "ch": "1", "q": "Welke HTTP-methode is idempotent?", "c": "DELETE: een tweede identieke aanroep verandert niets meer aan de toestand van de server.", "w": ["POST: elke aanroep geeft hetzelfde resultaat, dus herhalen is ongevaarlijk voor de data.", "Geen enkele methode kan idempotent zijn, omdat de server bij elke aanroep zijn toestand wijzigt.", "Alleen GET, want alle andere methodes veranderen de data die op de server staat."], "x": ["Twee keer POST maakt twee resources aan; dat is net de reden dat POST niet idempotent is.", "Idempotent gaat over het eindresultaat bij herhaling, niet over of er gewijzigd wordt.", "GET is wel veilig en idempotent, maar PUT en DELETE zijn ook idempotent."], "m": "GET, PUT en DELETE zijn idempotent; POST niet", "y": "Idempotent betekent dat meermaals uitvoeren hetzelfde eindresultaat geeft als één keer. Na de eerste DELETE bestaat de resource niet meer; de tweede verandert niets (het antwoord mag wel 404 zijn).", "d": "", "o": "", "u": "Idempotent betekent: je mag dezelfde aanroep meerdere keren uitvoeren en het eindresultaat op de server is hetzelfde als na de eerste keer. Het gaat dus over de toestand van de server, niet over het antwoord.\n\nDELETE /api/categories/5 verwijdert categorie 5. Roep je het nog een keer aan, dan is de toestand nog altijd 'categorie 5 bestaat niet'. Het antwoord mag wel veranderen (de eerste keer 204, daarna 404), maar de server is niet verder gewijzigd. GET, PUT en DELETE zijn idempotent. POST is het niet: elke aanroep maakt een nieuwe resource.\n\nValkuil. Verwar idempotent niet met 'geeft altijd hetzelfde antwoord'."}, {"id": "q003", "ch": "1", "q": "Wat is het verschil tussen een veilige (safe) en een idempotente methode?", "c": "Veilig wijzigt niets op de server (GET); idempotent geeft bij herhaling hetzelfde eindresultaat.", "w": ["Veilig betekent dat het request via HTTPS versleuteld is; idempotent dat het antwoord gecachet mag worden.", "Ze betekenen hetzelfde; elke idempotente methode is daardoor automatisch ook veilig.", "Veilig geldt voor methodes met een body; idempotent voor methodes zonder body in het request."], "x": ["Verwarring met HTTPS en caching; 'veilig' in REST-taal heeft niets met versleuteling te maken.", "Fout: DELETE is idempotent maar zeker niet veilig.", "De aanwezigheid van een body bepaalt dit niet."], "m": "Safe = geen wijziging; idempotent = herhaalbaar met zelfde eindresultaat", "y": "PUT en DELETE zijn idempotent maar niet veilig: ze wijzigen data. GET is beide.", "d": "", "o": "", "u": "Twee verschillende eigenschappen die je makkelijk door elkaar haalt. Veilig (safe) betekent dat de methode niets wijzigt op de server. Idempotent betekent dat herhalen hetzelfde eindresultaat geeft. Veilig is dus een strengere belofte.\n\nGET is veilig en idempotent. PUT en DELETE zijn idempotent maar niet veilig, want ze wijzigen data. POST is geen van beide.\n\nWaarom het ertoe doet: een browser of proxy mag een GET gerust opnieuw sturen of cachen, nooit een POST. Daarom hoort een GET nooit data te wijzigen."}, {"id": "q004", "ch": "1", "q": "Welke statuscode hoort bij een succesvol aangemaakte resource (POST /api/categories)?", "c": "201 Created", "w": ["200 OK, want 201 is enkel voor bestanden die geüpload worden.", "204 No Content, want er valt niets terug te sturen na een aanmaak.", "202 Accepted, want de databank schrijft nooit onmiddellijk."], "x": ["201 is voor elke aangemaakte resource, niet enkel voor bestanden.", "204 gebruiken wij bij DELETE; bij een aanmaak sturen we de nieuwe resource terug.", "202 betekent 'aanvaard maar nog niet verwerkt', dat doen wij hier niet."], "m": "201", "y": "201 is de standaardcode voor een nieuwe resource. 200 is voor ophalen of aanpassen.", "d": "", "o": "", "u": "Statuscodes in de 2xx-reeks betekenen 'gelukt', maar elke code zegt iets anders. 201 Created is het signaal dat er een nieuwe resource is aangemaakt, en is de standaard van een POST in Nest. 200 OK gebruik je voor ophalen of aanpassen met een antwoord.\n\nJullie loginroute is een uitzondering: die maakt niets aan, dus staat er @HttpCode(HttpStatus.OK) op, zodat het 200 is in plaats van 201.\n\nValkuil. Een POST geeft niet altijd 201. Kijk of er een resource ontstaat."}, {"id": "q005", "ch": "1", "q": "Wat geeft DELETE /api/categories/:id terug als het slaagt?", "c": "204 zonder body.", "w": ["200 met het verwijderde object in de body.", "202 met een link om de verwijdering te volgen.", "201 omdat de databank bijgewerkt is."], "x": ["Dat mag in andere API's, maar bij ons expliciet 204 (categorieën).", "Verwijderen gebeurt synchroon; er is geen asynchrone verwerking om te volgen.", "201 is voor het aanmaken van een resource."], "m": "204 No Content", "y": "Het verwijderen is gelukt en er is niets zinvols terug te sturen: 204 No Content.", "d": "", "o": "", "u": "Na een geslaagde verwijdering is er niets zinvols meer om terug te sturen, want de resource bestaat niet meer. 204 No Content zegt precies dat: gelukt, geen body.\n\nIn de code staat bij elke delete-route @HttpCode(HttpStatus.NO_CONTENT), want Nest geeft anders standaard 200. Dat geldt ook voor de verwijderroutes van gebruikers, reviews, speelsessies en het verlaten van een sessie.\n\nValkuil. Verwar 204 niet met 200 met een lege body. Bij 204 is er geen body, en de client mag er ook geen verwachten."}, {"id": "q006", "ch": "1", "q": "Waarom geven lijstroutes bij ons { \"items\": [...] } in plaats van een kale array?", "c": "De cursus noemt JSON hijacking als reden; een object laat ook later extra velden toe.", "w": ["Zo kan de client het aantal items afleiden uit de lengte van het object dat terugkomt.", "JSON laat geen arrays toe op het hoogste niveau van een document, dus een wrapper is verplicht.", "Zo is het antwoord automatisch gepagineerd door Nest, zonder extra code in de service."], "x": ["Een object heeft geen lengte; het aantal moet je zelf meegeven.", "JSON laat dat wel toe; het is een bewuste keuze.", "Paginatie hebben we niet geïmplementeerd; de wrapper is een andere keuze."], "m": "Object als wrapper", "y": "Een array op het hoogste niveau was een beveiligingsprobleem (JSON hijacking). Een object laat bovendien toe later bijvoorbeeld een totaal toe te voegen.", "d": "Wees eerlijk: paginatie is niet geïmplementeerd.", "o": "", "u": "Een lijst-endpoint geeft een object terug met een sleutel items in plaats van een kale array. De cursus geeft twee redenen. De eerste is beveiliging: oudere browsers lieten toe om een JSON-array op het hoogste niveau via een script uit te lezen (JSON hijacking). Een object is daar niet kwetsbaar voor.\n\nDe tweede is uitbreidbaarheid: je kan later velden bijvoegen, zoals een totaal bij paginatie, zonder dat bestaande clients breken. Een array laat dat niet toe.\n\nValkuil. Eerlijk zijn bij de verdediging: de wrapper is klaar voor paginatie, maar de lijstroutes gebruiken die nog niet. De PaginationQuery-klasse staat er wel, ongebruikt."}, {"id": "q007", "ch": "1", "q": "Waarom is een JWT in de Authorization-header nodig bij elk request?", "c": "De server is stateless en onthoudt niet wie ingelogd is.", "w": ["HTTP vereist een header bij elke methode behalve GET.", "Het token bevat de volledige gebruikersgegevens uit de databank.", "Zo kan de browser het antwoord cachen per gebruiker."], "x": ["Dat is geen HTTP-regel; het is onze beveiligingskeuze.", "Het token bevat een paar claims (sub, email, roles), niet de volledige gegevens.", "Caching heeft hier niets mee te maken."], "m": "Stateless server", "y": "Zonder sessie op de server moet elk request zelf bewijzen wie het stuurt.", "d": "", "o": "", "u": "Omdat de server stateless is. Er is geen sessie waarin staat dat je ingelogd bent. Elk request moet zelf bewijzen wie het stuurt, en dat bewijs is het JWT in de header Authorization: Bearer <token>.\n\nDe AuthGuard controleert bij elk request de handtekening en de claims (aud, iss, exp) en zet daarna de gebruiker op request.user. Zonder token krijg je 401.\n\nValkuil. Het token is gesigneerd, niet versleuteld. Iedereen kan de inhoud lezen. Daarom staat er geen wachtwoord of hash in."}, {"id": "q008", "ch": "1", "q": "Welke van deze beweringen over REST is correct volgens de cursus?", "c": "Een architectuurstijl: hij zegt niets over de implementatie, enkel over de principes.", "w": ["REST is een protocol dat bovenop HTTP draait en eigen headers en foutcodes definieert.", "REST is een framework dat je installeert zoals NestJS of Express en dat routes genereert.", "REST is een dataformaat dat JSON vervangt door een compactere, binaire versie voor API's."], "x": ["Het is geen protocol; HTTP is het protocol.", "Het is geen software die je installeert.", "Het is geen dataformaat; JSON is een voorbeeld van een formaat dat vaak gebruikt wordt."], "m": "Architectuurstijl (Fielding, 2000)", "y": "REST is een stijl met beperkingen (uniforme interface, client/server, stateless, cacheable, gelaagd). Je implementeert hem met HTTP.", "d": "", "o": "", "u": "REST is een architectuurstijl (Roy Fielding, 2000), geen protocol, geen framework en geen bibliotheek. Het geeft vijf beperkingen: uniforme interface, client/server, stateless, cacheable en gelaagd systeem. Hoe je dat implementeert, laat REST open. Jullie doen dat met HTTP en JSON.\n\nDaarom kan een API 'RESTful' zijn zonder 'REST te zijn' in een formele zin. De cursus gebruikt het woord voor een API die de conventies volgt.\n\nValkuil. Een andere bewering klinkt vaak technischer, maar enkel de definitie 'stijl met principes' klopt."}, {"id": "q009", "ch": "1", "q": "Wat is het verschil tussen een path-parameter en een query-parameter?", "c": "Path-parameter identificeert een resource (/games/3); query-parameter filtert een collectie (?gameId=3).", "w": ["Een path-parameter staat in de body van het request; een query-parameter staat in een header.", "Een path-parameter is altijd optioneel; een query-parameter is altijd verplicht om te kunnen filteren.", "Er is geen verschil; het is een kwestie van smaak welke je kiest voor een bepaalde route."], "x": ["Beide staan in de URL, niet in body of header.", "Het is net omgekeerd: path-parameters zijn verplicht, query-parameters meestal optioneel.", "Er is een duidelijk conceptueel verschil."], "m": "Path = identiteit; query = filter", "y": "In REST is de URI de identiteit van een resource. Filters en opties horen in de query string.", "d": "", "o": "", "u": "Een path-parameter zit in het pad en identificeert één resource: /api/games/3 is spel 3. Een query-parameter staat na het vraagteken en verfijnt een collectie: /api/reviews?gameId=3.\n\nVuistregel: kan je het niet weglaten zonder een andere resource te bedoelen, dan hoort het in het pad. Mag je het weglaten en krijg je gewoon een grotere lijst, dan hoort het in de query.\n\nValkuil. Query-parameters zijn altijd tekst. Daarom heb je @Type(() => Number) nodig om gameId om te zetten naar een getal."}, {"id": "q010", "ch": "2", "q": "Waar hoort de logica voor de wachtlijst thuis?", "c": "In de servicelaag.", "w": ["In de controller, omdat die de route kent.", "In de DTO, omdat die de gegevens beschrijft.", "In een databanktrigger, zodat de API er niets van weet."], "x": ["De controller vertaalt alleen HTTP naar een methode-aanroep.", "Een DTO is data met validatieregels, geen logica.", "Dan zit de regel verstopt in de databank en is hij niet testbaar via de API."], "m": "Servicelaag", "y": "De REST-laag bevat geen domeinlogica. De service bevat de regels en spreekt de datalaag aan.", "d": "", "o": "Service Layer / gelaagde architectuur: elke laag praat alleen met de laag eronder.", "u": "De wachtlijst is een domeinregel: wie krijgt een plaats, wie wacht, wie schuift door. Domeinregels horen in de servicelaag. In jullie code zit dat in PlaySessionsService, met join, leave, update en promoteWaitlisted.\n\nDe controller ontvangt enkel het HTTP-verzoek en roept de service aan. Zijn taak is vertalen, niet beslissen. De datalaag (Drizzle) voert enkel de queries uit.\n\nOOSD-vergelijking: dit is dezelfde scheiding als tussen UI, domein en data in een gelaagde architectuur.\n\nValkuil. De rubric zegt dat de REST-laag geen domeinlogica bevat. Een if over capaciteit in de controller zou dus fout zijn."}, {"id": "q011", "ch": "2", "q": "Waarom hebben jullie geen aparte repositorylaag?", "c": "Drizzle fungeert zelf als repository; de service gebruikt de client rechtstreeks.", "w": ["NestJS verbiedt repositoryklassen omdat de IoC-container ze niet kan beheren of injecteren.", "Een repository is enkel nodig bij MySQL; bij andere databanken doet de ORM dat werk zelf.", "De rubric verbiedt databankcode in services, dus alle queries staan in de migraties en de seed."], "x": ["Nest kan repositoryklassen gewoon als providers beheren.", "De keuze heeft niets met MySQL te maken.", "Migraties bevatten geen applicatiequery's."], "m": "Drizzle = repository", "y": "De rubric zegt 'indien van toepassing'. De cursus raadt aan consequent te zijn: overal een repository of nergens. Wij kozen nergens.", "d": "", "o": "de klassieke Repository/Data Mapper uit je OOSD-cursus bestaat hier in de vorm van Drizzle.", "u": "In klassiek OOSD zet je tussen service en databank een repository. In de cursus Web Services is Drizzle zelf die laag: het zet objecten om naar tabellen en terug, zoals een Data Mapper. Een eigen repositoryklasse erbovenop zou enkel doorgeven.\n\nDe rubric zegt 'repositorylaag, indien van toepassing'. De cursus raadt aan consequent te zijn: overal een repository of nergens. Jullie kozen nergens. De services injecteren daarom de Drizzle-databank rechtstreeks met @InjectDrizzle().\n\nValkuil. 'Geen repository' betekent niet 'geen scheiding'. De service bevat geen SQL, wel Drizzle-oproepen. Verdedig het zo."}, {"id": "q012", "ch": "2", "q": "Wat doet @Injectable() op een klasse?", "c": "Het markeert de klasse als provider die Nest kan beheren en injecteren.", "w": ["Het maakt van de klasse een singleton via een statische getInstance()-methode.", "Het registreert de klasse automatisch als route-handler voor alle HTTP-methodes.", "Het genereert een DTO voor de klasse, inclusief de validatieregels."], "x": ["De container maakt de singleton; er is geen statische methode.", "Routes definieer je met @Controller en @Get/@Post.", "DTO's schrijf je zelf."], "m": "Provider-markering", "y": "De decorator voegt metadata toe zodat de IoC-container weet dat hij de klasse mag aanmaken en doorgeven.", "d": "", "o": "", "u": "@Injectable() zet metadata op de klasse. Daardoor weet de IoC-container van Nest dat hij de klasse mag aanmaken, beheren en doorgeven als provider. Zonder die decorator kan Nest de constructorparameters van de klasse niet bepalen.\n\nHet is nog niet voldoende: de klasse moet ook in de providers-array van een module staan. @Injectable() is het label, providers is de registratie.\n\nOOSD-vergelijking: je geeft de container een 'bouwplan' in plaats van zelf new aan te roepen."}, {"id": "q013", "ch": "2", "q": "In welke array van de module moet GamesService staan om geïnjecteerd te kunnen worden?", "c": "providers", "w": ["controllers", "imports", "exports"], "x": ["Alleen controllers staan in `controllers`.", "`imports` is voor andere modules, niet voor klassen.", "`exports` maakt een provider beschikbaar voor andere modules, maar de provider moet er eerst in `providers` staan."], "m": "providers", "y": "Services zijn providers. Controllers staan in `controllers`, andere modules in `imports` en wat je wil delen in `exports`.", "d": "", "o": "", "u": "Een module (@Module) heeft vier arrays. controllers: de controllers van de module. providers: services en andere injecteerbare klassen. imports: andere modules waarvan je providers wil gebruiken. exports: de providers die je met andere modules deelt.\n\nGamesService is een service en dus een provider. Zet je hem in controllers, dan behandelt Nest hem als een controller en kan je hem niet injecteren.\n\nValkuil. Een provider die in providers staat is enkel binnen de module zichtbaar tot je hem exporteert."}, {"id": "q014", "ch": "2", "q": "Een andere module wil GamesService gebruiken. Wat is nodig?", "c": "GamesModule exporteert GamesService en de andere module importeert GamesModule.", "w": ["De andere module zet GamesService gewoon in zijn eigen controllers-array.", "GamesService moet @Public() krijgen zodat andere modules hem zien.", "Het volstaat dat de service in AppModule staat; dan zien alle modules hem."], "x": ["Een service hoort in `providers`, niet in `controllers`.", "@Public() gaat over authenticatie, niet over zichtbaarheid van providers.", "Het registreren in AppModule maakt hem niet voor andere modules beschikbaar zonder export."], "m": "exports + imports", "y": "Een module houdt zijn providers verborgen tot hij ze exporteert. De afnemer moet de module importeren.", "d": "", "o": "een module is een component met een publieke interface; `exports` is die interface.", "u": "Nest-modules kapselen hun providers in. Wat in providers staat, zien enkel andere klassen in dezelfde module. Wil een andere module de service gebruiken, dan zijn er twee stappen: GamesModule zet GamesService in exports, en de afnemer zet GamesModule in imports.\n\nOOSD-vergelijking: dit is zoals een klasse met een publieke interface. exports is die publieke interface, de rest is private.\n\nValkuil. Een provider opnieuw in de providers van een andere module zetten werkt technisch, maar maakt een tweede instantie aan en doorbreekt het singleton-idee."}, {"id": "q015", "ch": "2", "q": "Wat is de kern van dependency injection?", "c": "Een klasse maakt zijn afhankelijkheden niet zelf; de container levert ze via de constructor.", "w": ["Een klasse erft alle eigenschappen van de klassen die hij nodig heeft via een basisklasse.", "Afhankelijkheden worden bij elke methode-aanroep opnieuw aangemaakt met het sleutelwoord new.", "Alle klassen worden tijdens het bouwen samengevoegd tot één grote klasse met alle methodes."], "x": ["Overerving is een andere techniek; DI werkt met samenstelling.", "Providers zijn standaard singletons en worden niet opnieuw aangemaakt.", "Er wordt niets samengevoegd; de klassen blijven gescheiden."], "m": "Inversion of Control", "y": "Je schrijft nooit `new GamesService()`. Je vraagt het type aan in de constructor en Nest geeft de bestaande instantie.", "d": "", "o": "Dependency Inversion en Inversion of Control.", "u": "Een klasse maakt zijn afhankelijkheden niet zelf aan met new. Hij vraagt ze in de constructor, en de container (Nest) zoekt of bouwt de juiste instantie en levert ze. Je schrijft dus constructor(private readonly gamesService: GamesService) en niet this.gamesService = new GamesService().\n\nHet voordeel is losse koppeling: de klasse kent enkel het type dat hij nodig heeft, niet hoe het gebouwd wordt. Daardoor kan je in een test een andere implementatie aanreiken.\n\nOOSD-vergelijking: dit is Dependency Inversion en Inversion of Control. De controle over het aanmaken ligt niet meer bij de klasse maar bij het framework."}, {"id": "q016", "ch": "2", "q": "Wat levert dependency injection concreet op bij de tests?", "c": "Je kan een afhankelijkheid vervangen door een stub, zoals CloudinaryService met overrideProvider.", "w": ["De tests draaien automatisch parallel omdat elke klasse dankzij DI onafhankelijk van de andere wordt.", "De databank hoeft in de tests niet meer te bestaan omdat DI die automatisch door een nepversie vervangt.", "De tests worden automatisch gegenereerd uit de constructorparameters van de services."], "x": ["Het parallel draaien hangt van Jest-opties af; wij gebruiken --runInBand.", "Wij testen net tegen een echte databank via Testcontainers.", "DI genereert geen tests."], "m": "Vervangbare afhankelijkheden", "y": "Omdat de service zijn afhankelijkheden aangereikt krijgt, kan de test een andere implementatie aanreiken.", "d": "", "o": "", "u": "Omdat een klasse zijn afhankelijkheden aangereikt krijgt, kan de test er een andere aanreiken. In jullie e2e-testen vervangt overrideProvider(CloudinaryService) de echte Cloudinary-service door een stub. Zo uploadt een test geen afbeelding naar het internet en heb je geen echte sleutels nodig.\n\nDe rest van de applicatie blijft echt: echte controllers, echte guards, een echte MySQL-container via Testcontainers. Enkel de externe afhankelijkheid wordt nagebootst.\n\nOOSD-vergelijking: dit is een test double (stub of mock) die je injecteert in plaats van de echte klasse.\n\nValkuil. Een stub test niet of Cloudinary werkt. Dat is een bewuste afweging die je kan benoemen als zwak punt."}, {"id": "q017", "ch": "2", "q": "Waarom heeft Drizzle een token (DrizzleAsyncProvider) en een eigen decorator @InjectDrizzle()?", "c": "Er is geen klasse als sleutel; je injecteert op een token en de decorator vermijdt herhaling.", "w": ["Omdat Drizzle als externe bibliotheek niet met @Injectable() werkt en dus nooit geïnjecteerd kan worden.", "Omdat Nest alleen primitieve waarden zoals strings en getallen kan injecteren, geen objecten.", "Omdat de decorator de databankquery's automatisch cachet om de belasting te verlagen."], "x": ["Het gaat om het ontbreken van een klasse als sleutel, niet om @Injectable().", "Nest kan klassen, tokens en factories injecteren.", "De decorator doet geen caching."], "m": "Token als sleutel", "y": "TypeScript-interfaces verdwijnen bij het compileren; Nest heeft een waarde nodig om de juiste provider te vinden. @InjectDrizzle() is een afkorting voor @Inject(DrizzleAsyncProvider).", "d": "", "o": "in Java injecteer je een interface; in TypeScript bestaat die niet meer tijdens het uitvoeren, dus een token.", "u": "Bij de meeste providers is de klasse zelf de sleutel waarmee Nest de instantie vindt. De Drizzle-databank is geen klasse die jullie schreven: het is een object dat uit een bibliotheek komt. TypeScript-interfaces bestaan bovendien niet meer tijdens het uitvoeren, dus Nest kan er niet op zoeken.\n\nDaarom registreren jullie de provider onder een token, DrizzleAsyncProvider (een constante). Je injecteert met @Inject(DrizzleAsyncProvider). De eigen decorator @InjectDrizzle() is een afkorting, zodat je niet overal hetzelfde token moet herhalen.\n\nOOSD-vergelijking: in Java injecteer je een interface. In TypeScript is die weg na het compileren, dus gebruik je een token als sleutel."}, {"id": "q018", "ch": "2", "q": "Wat doet useFactory in drizzleProvider?", "c": "Het bouwt de databankverbinding op uit de configuratie (ConfigService) en levert hem als provider.", "w": ["Het maakt voor elk binnenkomend request een nieuwe databankverbinding aan en sluit die achteraf.", "Het genereert de migraties uit het schema telkens wanneer de applicatie opstart.", "Het vervangt de controllers door een fabriek die routes dynamisch aanmaakt tijdens het uitvoeren."], "x": ["Er wordt één verbinding (pool) gemaakt voor de hele applicatie.", "Migraties komen van drizzle-kit.", "Routes komen van controllers."], "m": "Factory-provider", "y": "Een factory-provider laat je code uitvoeren om de instantie op te bouwen. Hier leest hij de config en maakt hij de pool met Drizzle.", "d": "", "o": "Factory-pattern.", "u": "useFactory is een manier om een provider te bouwen met code in plaats van een klasse te instantiëren. De factory-functie krijgt andere providers (hier ConfigService via inject) en geeft de instantie terug.\n\nIn jullie code leest de factory de databankconfiguratie, maakt een MySQL-pool (connectionLimit 5) en bouwt daar de Drizzle-client mee. Die client wordt onder het token DrizzleAsyncProvider geregistreerd. Omdat het asynchroon kan, heet het 'Async'.\n\nOOSD-vergelijking: dit is het Factory-pattern. De container roept een fabriek aan die het object bouwt."}, {"id": "q019", "ch": "2", "q": "Wat is de standaard scope van een provider in NestJS?", "c": "Singleton: één instantie die door de hele applicatie gedeeld wordt.", "w": ["Per request: elk binnenkomend request krijgt zijn eigen instantie.", "Per module: elke module maakt zijn eigen kopie van de provider.", "Transient: elke injectie krijgt een nieuwe instantie."], "x": ["Request-scope moet je expliciet aanvragen.", "Een provider wordt niet per module gekopieerd.", "Transient moet je expliciet instellen."], "m": "Singleton", "y": "Tenzij je een andere scope instelt, deelt iedereen dezelfde instantie. Daarom hou je geen request-specifieke toestand bij in een service.", "d": "", "o": "Singleton-pattern, maar beheerd door de container.", "u": "Standaard is elke provider een singleton: Nest maakt één instantie bij het opstarten en geeft overal dezelfde. Alle requests delen dus GamesService en de Drizzle-pool.\n\nGevolg: bewaar nooit toestand van één request in een veld van een service. Twee gelijktijdige requests zouden elkaars gegevens zien. Per-request gegevens horen in lokale variabelen of in het request-object (request.user).\n\nOOSD-vergelijking: het Singleton-pattern, maar beheerd door de container in plaats van door een statische getInstance()."}, {"id": "q020", "ch": "3", "q": "Wat is de juiste volgorde van een request in NestJS?", "c": "Middleware, guards, interceptors, pipes, controller; daarna interceptors (na) en filters.", "w": ["Pipes, guards, middleware, interceptors, controller; de data wordt eerst gecontroleerd.", "Guards, middleware, pipes, interceptors, controller; de toegang wordt eerst beslist.", "Middleware, pipes, guards, controller, interceptors; de data wordt voor de toegang gecontroleerd."], "x": ["Pipes zitten niet voor de guards.", "Middleware draait vóór de guards.", "Pipes verwerken de parameters vóór de controller, en interceptors omringen de handler."], "m": "M-G-I-P-C-S", "y": "Beveiliging (guards) komt voor het verwerken van de data (pipes). Interceptors omwikkelen de handler en dus vóór de pipes.", "d": "", "o": "sequence diagram met een ketting van objecten (Chain of Responsibility).", "u": "De volgorde onthoud je met M-G-I-P-C: middleware, guards, interceptors (vóór), pipes, controller. Op de terugweg komen de interceptors (na) en bij een fout de exception filters.\n\nWaarom die volgorde? Wat het goedkoopst is en het meest beslist, komt eerst. Middleware is algemene voorbewerking (loggen, Helmet, CORS). Een guard beslist of je binnen mag. Pas dan heeft het zin om de data te valideren (pipes). Zo doet een niet-aangemelde gebruiker de validatie niet eens opstarten.\n\nValkuil. Interceptors komen vóór de pipes, niet erna. Daarom kan FileInterceptor de upload inlezen voordat ParseFilePipe hem controleert."}, {"id": "q021", "ch": "3", "q": "Een request zonder Authorization-header. Wat gebeurt er?", "c": "401, omdat de AuthGuard geen geldig token vindt.", "w": ["403, omdat de RolesGuard de gebruiker niet kent.", "400, omdat de ValidationPipe het ontbrekende veld weigert.", "404, omdat de route zonder token niet bestaat."], "x": ["De RolesGuard draait na de AuthGuard en de gebruiker is al afgekeurd.", "De pipe controleert de body, niet de header.", "De route bestaat; alleen de authenticatie ontbreekt."], "m": "401 door de AuthGuard", "y": "401 betekent 'ik weet niet wie je bent'. 403 betekent 'ik weet wie je bent en je mag niet'.", "d": "", "o": "", "u": "De AuthGuard leest de Authorization-header, vindt geen geldig token en gooit een UnauthorizedException. De exception filter maakt er een antwoord van met statuscode 401.\n\nHet verschil tussen 401 en 403 is het verschil tussen identiteit en rechten. 401: ik weet niet wie je bent (geen of ongeldig token). 403: ik weet wie je bent, maar je mag dit niet (RolesGuard of assertOwner).\n\nValkuil. Ondanks de naam betekent 401 Unauthorized eigenlijk 'niet geauthenticeerd'. Autorisatie is 403."}, {"id": "q022", "ch": "3", "q": "Wat is het verschil tussen een guard en een pipe?", "c": "Een guard beslist of het request door mag; een pipe valideert of transformeert een parameter.", "w": ["Een guard valideert de body van het request; een pipe controleert het token in de header.", "Een guard draait na de controller om het antwoord te controleren; een pipe draait ervoor.", "Er is geen verschil; beide zijn middleware onder een andere naam in NestJS."], "x": ["Dat is omgekeerd.", "Beide draaien vóór de controller; guards eerst.", "Middleware, guards en pipes hebben elk een eigen rol."], "m": "Guard = toegang; pipe = data", "y": "Guards gaan over wie mag. Pipes gaan over of de data geldig of omgezet is.", "d": "", "o": "", "u": "Een guard beantwoordt één vraag: mag dit request door? Hij geeft true, false of gooit een exception. Hij kent de ExecutionContext en de metadata van de route (zoals @Roles) en kijkt naar wie de aanvrager is.\n\nEen pipe werkt op één parameter. Hij valideert of transformeert de waarde: ParseIntPipe zet een tekst om naar een getal, ValidationPipe controleert een body tegen de DTO.\n\nSamengevat: guard gaat over wie, pipe gaat over wat. Daarom geeft een ontbrekend token 401 (guard) en een score van 7 een 400 (pipe)."}, {"id": "q023", "ch": "3", "q": "Wat doet een interceptor dat een guard niet doet?", "c": "Hij voert code uit vóór én ná de handler en kan resultaat of timing aanpassen.", "w": ["Hij kan als enige een request weigeren met een 401, omdat hij het token kan lezen.", "Hij heeft als enige toegang tot de databank, een guard kan niets injecteren.", "Hij draait uitsluitend wanneer er een fout optreedt tijdens de verwerking van het request."], "x": ["Ook guards kunnen weigeren.", "Elke provider kan geïnjecteerd worden; dat is geen onderscheid.", "Fouten vang je met filters."], "m": "Omwikkelt de handler", "y": "Een interceptor kan werk doen aan beide kanten van de handler. Een guard beslist alleen vooraf.", "d": "", "o": "around advice (AOP); het Decorator-pattern omwikkelt ook een object.", "u": "Een interceptor omwikkelt de handler. Hij krijgt de ExecutionContext en een CallHandler, en met next.handle() laat hij de handler lopen. Voor die aanroep kan hij code uitvoeren, erna kan hij het resultaat bekijken, omzetten, vertragen of een fout afvangen. Een guard beslist enkel vooraf.\n\nBij jullie: AuthDelayInterceptor laat de login-handler normaal lopen en stelt daarna het antwoord (ook een fout) met een willekeurige tijd uit. FileInterceptor leest bij de upload het bestand uit het request.\n\nOOSD-vergelijking: around advice uit AOP. Het Decorator-pattern lijkt erop, omdat ook daar een object omwikkeld wordt."}, {"id": "q024", "ch": "3", "q": "Waarom zijn de AuthGuard en de RolesGuard globaal geregistreerd met APP_GUARD?", "c": "Elke nieuwe route is automatisch beveiligd; een open route krijgt bewust @Public().", "w": ["Een guard werkt in NestJS alleen als hij globaal is.", "Een globale guard is sneller omdat het token één keer voor alle requests wordt gecontroleerd.", "Zo hoeft de gebruiker na het inloggen niet meer te bewijzen wie hij is."], "x": ["Guards kunnen ook op een controller of route staan.", "Er is geen cache van tokens tussen requests.", "De server onthoudt niets."], "m": "Veilig by default", "y": "Een vergeten guard kan zo nooit een route openzetten. Het token wordt bij elk request opnieuw geverifieerd, want de server is stateless.", "d": "Publiek zijn alleen POST /api/auth/login, POST /api/users en GET /api/health/ping.", "o": "", "u": "Je kan een guard per route (@UseGuards), per controller of globaal toepassen. Jullie kozen globaal, via een provider met APP_GUARD, in UsersModule. Het effect is voor de hele applicatie.\n\nHet principe heet veilig by default. Elke nieuwe route is automatisch beveiligd, en een open route moet je bewust markeren met @Public(). Een vergeten guard kan zo nooit per ongeluk een route openzetten, terwijl bij de omgekeerde aanpak één vergeten @UseGuards een gat maakt.\n\nDe openbare routes zijn POST /api/auth/login, POST /api/users (registreren) en GET /api/health/ping.\n\nValkuil. Waar APP_GUARD staat, maakt niet uit voor het bereik. Wel moet het ergens in een module geregistreerd zijn."}, {"id": "q025", "ch": "3", "q": "Wat doet @Public() in ons project?", "c": "Het zet metadata op de route zodat de AuthGuard hem overslaat.", "w": ["Het schakelt alle guards en pipes voor de route uit.", "Het geeft de route een openbare Swagger-documentatie.", "Het cachet het antwoord voor alle gebruikers."], "x": ["De ValidationPipe draait nog steeds.", "Swagger heeft eigen decorators.", "Er is geen caching."], "m": "Metadata voor de AuthGuard", "y": "De decorator is enkel een vlag. De AuthGuard leest ze met de Reflector en laat de route door.", "d": "", "o": "annotation + reflectie: een annotatie op zich doet niets, het framework leest hem.", "u": "@Public() is geen beveiligingsmechanisme op zich. Het zet een stukje metadata (een vlag) op de route. De AuthGuard leest die met de Reflector. Staat de vlag er, dan slaat hij de tokencontrole over en laat het request door.\n\nEen annotatie op zich doet dus niets. Het framework (of jullie guard) moet hem lezen en er iets mee doen.\n\nOOSD-vergelijking: dezelfde idee als annotaties met reflectie in Java. De annotatie is data, de logica zit in de code die hem uitleest."}, {"id": "q026", "ch": "3", "q": "Wat doet de RolesGuard bij een route zonder @Roles()?", "c": "Hij laat het request door.", "w": ["Hij weigert het request met 403 omdat er geen rol is opgegeven.", "Hij vereist standaard de rol admin.", "Hij geeft een 500 omdat de metadata ontbreekt."], "x": ["Dan zou elke route met 403 antwoorden.", "Er is geen impliciete admin-eis.", "Ontbrekende metadata is gewoon 'geen beperking'."], "m": "Geen @Roles = iedereen aangemeld", "y": "Zonder @Roles() is er geen rolbeperking. De AuthGuard heeft de gebruiker al gecontroleerd.", "d": "", "o": "", "u": "De RolesGuard zoekt metadata met de vereiste rollen. Vindt hij die niet, dan is er geen rolbeperking en laat hij het request door. De AuthGuard heeft hiervoor al gecontroleerd dat er een geldige gebruiker is, dus de route is wel beveiligd, maar voor elke ingelogde gebruiker toegankelijk.\n\nBij een route met @Roles(Role.ADMIN) vergelijkt hij de rollen uit het token met de vereiste rol, en gooit een ForbiddenException (403) als die ontbreekt.\n\nValkuil. 'Geen @Roles' is niet 'geen beveiliging'. Alleen @Public() maakt een route open."}, {"id": "q027", "ch": "3", "q": "Waarom draait een LoggerMiddleware met res.on('finish') om de statuscode te loggen?", "c": "De statuscode is pas bekend nadat de rest van de pipeline het antwoord gemaakt heeft.", "w": ["De middleware draait pas na de controller; anders kan hij het antwoord niet loggen.", "Anders toont de logger de statuscode van het vorige request dat dezelfde verbinding gebruikte.", "Het finish-event wordt gebruikt om de verbinding met de client netjes af te sluiten."], "x": ["Middleware draait vóór de guards.", "Er is geen gedeeld geheugen tussen requests.", "Het event sluit niets."], "m": "Loggen na afloop", "y": "Middleware draait vóór de rest; om de uiteindelijke statuscode te kennen wacht je tot het antwoord klaar is.", "d": "", "o": "", "u": "Middleware draait vooraan, voordat het antwoord bestaat. Op dat moment is de statuscode nog niet bekend, want die wordt pas door guards, pipes, controller of filters bepaald.\n\nDaarom registreert de LoggerMiddleware een luisteraar op het finish-event van het antwoord en roept hij meteen next() aan. Zodra het antwoord verstuurd is, schrijft de luisteraar methode, URL en statuscode weg. Het logniveau hangt af van de code: 5xx error, 4xx warn, de rest log.\n\nValkuil. De middleware blokkeert niets: zonder next() zou het request nooit verdergaan."}, {"id": "q028", "ch": "3", "q": "Welk onderdeel zet een uitgegooide exception om in een HTTP-antwoord?", "c": "Een exception filter.", "w": ["Een interceptor.", "Een guard.", "De controller zelf, met een try/catch."], "x": ["Interceptors kunnen exceptions vangen, maar daar dient hun rol niet voor.", "Guards beslissen vooraf.", "Een try/catch in elke controller betekent herhaling; een filter regelt het centraal."], "m": "Filters", "y": "Filters vangen exceptions op en bouwen het antwoord. Wij hebben er twee: HttpExceptionFilter en DrizzleQueryErrorFilter.", "d": "", "o": "één centrale exception handler in plaats van verspreide try/catch.", "u": "In Nest gooi je gewoon een exception (bijvoorbeeld NotFoundException) in een guard, pipe, controller of service. Een exception filter vangt die op en bouwt het HTTP-antwoord.\n\nJullie hebben twee globale filters, in main.ts geregistreerd: HttpExceptionFilter (zet elke HttpException om naar { statusCode, timestamp, message, details }) en DrizzleQueryErrorFilter (vertaalt databankfouten zoals ER_DUP_ENTRY naar 409).\n\nOOSD-vergelijking: één centrale exception handler in plaats van try/catch overal. De code die de fout gooit, hoeft niets te weten over HTTP-antwoorden."}, {"id": "q029", "ch": "3", "q": "Wat doet ParseUserIdPipe bij ons?", "c": "Hij controleert de parameter: 'me' gaat ongewijzigd door, een getal wordt een number en alles anders geeft 400.", "w": ["Hij controleert in de databank of de gebruiker bestaat en geeft anders 404.", "Hij vervangt 'me' door het id van de ingelogde gebruiker, zodat de service enkel getallen krijgt.", "Hij controleert of de gebruiker admin is, zodat enkel admins andermans id mogen opvragen."], "x": ["Een pipe raakt de databank niet aan. Het bestaan wordt in de service gecontroleerd.", "Dat doet de controller, niet de pipe. De pipe kent de ingelogde gebruiker niet.", "Rollen controleert de RolesGuard, en andermans id wordt door de CheckUserAccessGuard afgehandeld."], "m": "Pipe voor de gebruikers-id", "y": "De pipe valideert en converteert enkel de ruwe waarde. De controller vervangt 'me' daarna door het id van de ingelogde gebruiker (id === 'me' ? user.id : id).", "d": "", "o": "", "u": "De pipe werkt op de ruwe waarde van :id in /api/users/:id. Is het 'me', dan geeft hij 'me' terug. Is het een getal in tekstvorm, dan geeft hij een number terug. Alles anders (bijvoorbeeld 'abc') geeft een 400 met de melding dat het een getal of 'me' moet zijn.\n\nDe omzetting van 'me' naar het echte id gebeurt daarna in de controller: id === 'me' ? user.id : id. De user komt uit request.user, dat de AuthGuard heeft ingevuld. Zo kan een client /users/me gebruiken zonder zijn eigen id te kennen.\n\nValkuil. De pipe kent de ingelogde gebruiker niet. Hij laat 'me' door en de controller lost het op."}, {"id": "q030", "ch": "4", "q": "Een client stuurt bij POST /api/categories ook een veld isAdmin: true mee. Met whitelist en forbidNonWhitelisted op true gebeurt er wat?", "c": "Het request krijgt een 400 omdat het onbekende veld geweigerd wordt.", "w": ["Het veld wordt stilzwijgend verwijderd en de categorie wordt gewoon aangemaakt.", "Het veld wordt mee opgeslagen omdat een DTO enkel een typehint is.", "Het request krijgt een 403 omdat isAdmin een beveiligd veld is."], "x": ["Dat zou gebeuren met whitelist alleen.", "Met transform en whitelist komen onbekende velden niet in de DTO-instantie.", "403 is voor een ontbrekende rol of eigenaarschap, niet voor een ongeldig veld."], "m": "400", "y": "whitelist alleen verwijdert onbekende velden stilzwijgend. Samen met forbidNonWhitelisted wordt het request geweigerd.", "d": "", "o": "", "u": "De ValidationPipe staat globaal in main.ts met whitelist: true, forbidNonWhitelisted: true, forbidUnknownValues: true en transform: true. Elk veld dat niet in de DTO staat, is onbekend.\n\nAlleen whitelist: true zou het onbekende veld stilzwijgend weghalen. Samen met forbidNonWhitelisted: true weigert Nest het request met 400. De body van het antwoord geeft in details welk veld fout is.\n\nWaarom het ertoe doet: dit is mass assignment-bescherming. Een client kan niet via een extra veld iets instellen dat jij niet bedoeld had, zoals een rol.\n\nValkuil. Verwar 'veld weggehaald' (alleen whitelist) met 'veld geweigerd' (met forbidNonWhitelisted)."}, {"id": "q031", "ch": "4", "q": "Waar valideer je invoer volgens de cursus en waarom daar?", "c": "In een pipe vóór de controller, zodat de verwerking meteen stopt (fail fast).", "w": ["In de service, omdat daar alle domeinkennis zit om te beoordelen of de data zinvol is.", "In de databank met constraints, want controle in de applicatie is onbetrouwbaar.", "Alleen in de front-end, omdat de gebruiker daar meteen de fouten kan zien."], "x": ["De service krijgt dan al ongeldige data; je wil vroeger stoppen.", "Constraints vervangen de validatie niet; ze vangen wat erdoor glipt.", "Validatie in een front-end alleen is onvoldoende: de API moet zichzelf beschermen."], "m": "Pipe, fail fast", "y": "Hoe vroeger je stopt, hoe minder werk en hoe minder risico. De databank blijft wel een tweede verdedigingslinie.", "d": "", "o": "", "u": "Invoer valideer je zo vroeg mogelijk, in een pipe vóór de controller. Dat heet fail fast: stoppen voordat er werk gedaan wordt. De controller en de service ontvangen dan enkel geldige data en hoeven niet overal te controleren.\n\nDe databank blijft een tweede verdedigingslinie: unieke indexen en foreign keys weigeren wat de validatie niet kan zien, zoals een dubbele review.\n\nValkuil. Validatie in de controller of service is geen verbetering. Het verspreidt de regels en maakt ze moeilijker te onderhouden. De DTO met class-validator is de enige plaats."}, {"id": "q032", "ch": "4", "q": "Waarom zet je @Type(() => Number) bij een query-parameter zoals gameId?", "c": "Query-parameters komen altijd als string binnen; @Type zet ze om naar een getal.", "w": ["Omdat Swagger anders geen type kan tonen bij de parameter in de documentatie.", "Omdat MySQL enkel getallen als parameter aanvaardt in een WHERE-clausule.", "Omdat de ValidationPipe de decorator verplicht maakt voor elke eigenschap van een DTO."], "x": ["Swagger heeft eigen decorators.", "MySQL accepteert ook strings in een vergelijking.", "Je hebt @Type enkel nodig voor waarden die moeten omgezet worden."], "m": "String naar getal", "y": "Een URL kent geen types. class-transformer zet de waarde om, daarna kan @IsInt() ze valideren.", "d": "", "o": "", "u": "Alles in een URL is tekst. ?gameId=3 komt in Nest binnen als de string '3'. @IsInt() op een string zou altijd falen.\n\n@Type(() => Number) is een decorator van class-transformer. Met transform: true in de ValidationPipe zet Nest de waarde eerst om naar een number en pas daarna draaien de validatiedecorators. Zo kan @IsInt() slagen.\n\nValkuil. Een body in JSON heeft wel types (getal blijft getal). Het probleem is specifiek voor query- en path-parameters."}, {"id": "q033", "ch": "4", "q": "Welke velden heeft een foutantwoord van onze API?", "c": "statusCode, timestamp, message en details, met details enkel gevuld als de exception het meegeeft.", "w": ["error, code, path en stackTrace van de fout, zodat de client de oorzaak kan opsporen.", "status, reason, requestId en retryAfter, zodat de client weet wanneer hij opnieuw mag proberen.", "type, title, instance en errors, volgens een gestandaardiseerd probleemformaat voor API's."], "x": ["Een stackTrace lekt technische details; dat willen we niet.", "requestId en retryAfter zitten niet in onze structuur.", "Dat is een ander gestandaardiseerd formaat, niet het onze."], "m": "Vaste structuur", "y": "De HttpExceptionFilter geeft elke fout dezelfde vorm. details is enkel gevuld als de exception dat meegeeft, bijvoorbeeld de validatiefouten per veld.", "d": "", "o": "", "u": "De HttpExceptionFilter geeft elke fout dezelfde vorm: { statusCode, timestamp, message, details }. Een client hoeft dus maar één structuur te kennen.\n\ndetails is meestal null. Alleen als de exception het zelf meegeeft, wordt het ingevuld. Voorbeeld: de ValidationPipe heeft een eigen exceptionFactory die details: { body: { veldnaam: [foutmeldingen] } } meegeeft.\n\nValkuil. Het veld heet details, niet errors, en timestamp is een ISO-string."}, {"id": "q034", "ch": "4", "q": "Een gebruiker plaatst een tweede review op hetzelfde spel. Wat volgt?", "c": "409: de unieke index idx_review_user_game_unique wordt geschonden (ER_DUP_ENTRY).", "w": ["404, doordat het spel al een review heeft en dus niet meer gevonden wordt.", "400, doordat de ValidationPipe het dubbele gameId weigert na een vergelijking met de databank.", "500, doordat de databank de insert weigert en Nest die fout niet vertaalt."], "x": ["404 betekent dat een resource niet bestaat; hier is er een conflict.", "De pipe kent de databank niet; ze kan dubbels niet zien.", "Dat gebeurde bij een andere fout (ER_ROW_IS_REFERENCED_2) vóór we hem toevoegden."], "m": "409 via ER_DUP_ENTRY", "y": "De databank weigert de insert, de DrizzleQueryErrorFilter maakt er een 409 van.", "d": "", "o": "", "u": "De tabel reviews heeft een samengestelde unieke index idx_review_user_game_unique op (userId, gameId). Dezelfde gebruiker kan dus maar één review per spel hebben. De tweede insert wordt door MySQL geweigerd met de foutcode ER_DUP_ENTRY.\n\nDie fout is geen HttpException, dus de HttpExceptionFilter ziet ze niet. De DrizzleQueryErrorFilter herkent de code en maakt er een 409 Conflict van.\n\nValkuil. 400 is voor ongeldige invoer. Hier is de invoer geldig, maar ze botst met een bestaande toestand. Dat is een conflict."}, {"id": "q035", "ch": "4", "q": "Waarom gaf het verwijderen van een spel met speelsessies eerst een 500?", "c": "ER_ROW_IS_REFERENCED_2 werd niet vertaald; nu geeft de filter een 409.", "w": ["De service gooide een exception die niet in de HttpExceptionFilter stond; een try/catch in de controller loste het op.", "De cascade overbelastte de databank; de oplossing was onDelete op cascade te zetten.", "MySQL ondersteunt in die versie geen foreign keys; de controle staat nu in de service."], "x": ["Het gaat om een databankfout, vertaald door de DrizzleQueryErrorFilter.", "Cascade zou de sessies mee verwijderen; dat willen we net niet.", "MySQL 8 ondersteunt foreign keys."], "m": "Nieuwe vertaling in de filter", "y": "Een 500 is voor fouten die de client niet kan vermijden. Hier kan hij dat wel (eerst de sessies verwijderen), dus 409.", "d": "Nieuwe vertaling in de filter.", "o": "", "u": "De kolom play_sessions.gameId heeft onDelete 'no action'. MySQL weigert dus een spel te verwijderen waar nog sessies naar verwijzen en gooit ER_ROW_IS_REFERENCED_2. Dat bewust zo gekozen: geplande sessies mogen niet stilzwijgend verdwijnen.\n\nDe filter had voor die code nog geen vertaling, dus de fout werd opnieuw gegooid en eindigde als 500. Nu vertaalt de DrizzleQueryErrorFilter ze naar 409 Conflict.\n\nWaarom 409 en geen 500: een 500 is voor fouten die de client niet kan vermijden. Hier kan hij het wel (eerst de sessies verwijderen), dus is het een conflict."}, {"id": "q036", "ch": "4", "q": "Welke MySQL-fout hoort bij een verwijzing naar een spel dat niet bestaat?", "c": "ER_NO_REFERENCED_ROW_2, vertaald naar 404.", "w": ["ER_DUP_ENTRY, vertaald naar 409.", "ER_ROW_IS_REFERENCED_2, vertaald naar 409.", "ER_BAD_FIELD_ERROR, vertaald naar 400."], "x": ["ER_DUP_ENTRY gaat over een uniek geschonden.", "Dat is de omgekeerde situatie: het record is nog in gebruik.", "Die code duidt op een fout in de query zelf (programmeerfout), niet op ongeldige invoer van de client."], "m": "No referenced row", "y": "Ezelsbrug: 'no referenced row' = er is niets om naar te wijzen. 'Row is referenced' = er wijst nog iets naar mij.", "d": "", "o": "", "u": "Twee foutcodes met bijna dezelfde naam, voor twee tegengestelde situaties. ER_NO_REFERENCED_ROW_2: je voegt een rij in die verwijst naar een ouder die niet bestaat (een review voor een onbestaand spel). Er is geen rij om naar te verwijzen. Dat wordt 404. ER_ROW_IS_REFERENCED_2: je verwijdert een ouder waar nog kinderen naar wijzen. Dat wordt 409.\n\nEzelsbrug: 'no referenced row' = niets om naar te wijzen. 'Row is referenced' = er wijst nog iets naar mij.\n\nValkuil. De twee omwisselen is de meest voorkomende fout bij deze stof."}, {"id": "q037", "ch": "4", "q": "Waarom komt de gebruiker bij het aanmaken van een review uit het token en niet uit de body?", "c": "Anders kon een client een review in naam van een ander plaatsen.", "w": ["Omdat het token sneller te lezen is dan een body, wat de verwerking versnelt.", "Omdat een body bij een POST-request niet toegelaten is volgens de HTTP-specificatie.", "Omdat de ValidationPipe geen getallen in de body kan valideren."], "x": ["Snelheid speelt geen rol.", "POST heeft net een body.", "De pipe valideert getallen wel."], "m": "Identiteit komt van het token", "y": "Alles wat de client meestuurt kan vervalst worden. Het token is ondertekend.", "d": "", "o": "", "u": "In ReviewsService.create staat .values({ ...review, userId: user.id }). De userId komt uit de sessie (het token), nooit uit de body van de client. De CreateReviewRequestDto bevat zelfs geen userId-veld, en met forbidNonWhitelisted zou een meegestuurd veld geweigerd worden.\n\nWaarom: alles wat de client stuurt kan vervalst worden. Het token is ondertekend door de server. Kon de client userId zelf kiezen, dan kon hij een review plaatsen in naam van een ander.\n\nOOSD-vergelijking: vertrouw nooit invoer van buiten het systeem. Gebruik de gecontroleerde identiteit van de sessie."}, {"id": "q038", "ch": "4", "q": "Wat doet PUT /api/reviews/5 met een weggelaten comment, en wat met \"comment\": null?", "c": "Weggelaten laat de comment staan; null wist hem.", "w": ["Beide wissen de comment, want een weggelaten veld is hetzelfde als null.", "Weggelaten wist hem; null laat hem ongemoeid.", "Beide geven een 400 omdat comment bij een PUT verplicht is."], "x": ["Dat zijn twee verschillende betekenissen.", "Omgekeerd.", "comment is optioneel (maximaal 500 tekens, mag null)."], "m": "Weggelaten = behouden; null = wissen", "y": "Een PUT hier past enkel aan wat je meestuurt, met een uitzondering: rating is verplicht.", "d": "", "o": "", "u": "De service doet db.update(reviews).set(changes). Drizzle slaat velden met waarde undefined over, dus een weggelaten comment blijft zoals hij was. Met \"comment\": null wordt de kolom expliciet op NULL gezet, want de kolom is nullable.\n\nrating is de uitzondering: dat veld is verplicht in de DTO, dus een PUT zonder rating geeft 400.\n\nValkuil. Een echte PUT vervangt volgens de REST-theorie de hele resource. Hier gedraagt de update zich gedeeltelijk, behalve voor de verplichte velden. Weet dat verschil."}, {"id": "q039", "ch": "5", "q": "Welke tabel is een tussentabel met extra kolommen?", "c": "play_session_participants, met status en joinedAt.", "w": ["game_categories, met de kolommen gameId en categoryId.", "reviews, met de kolommen rating en comment.", "play_sessions, met de kolommen location en scheduledAt."], "x": ["game_categories is een pure tussentabel zonder extra kolommen.", "reviews is geen tussentabel in onze ERD; het is een eigen entiteit met één gebruiker en één spel.", "play_sessions is een gewone entiteit."], "m": "Veel-op-veel met attributen", "y": "Het koppelt users en play_sessions en heeft eigen gegevens (status, joinedAt).", "d": "", "o": "een associatieklasse in UML.", "u": "Een veel-op-veel relatie wordt in een relationele databank opgelost met een tussentabel die twee foreign keys bevat. Heeft de relatie zelf eigenschappen, dan komen die als extra kolommen in de tussentabel. play_session_participants koppelt users en play_sessions en heeft status (confirmed of waitlisted) en joinedAt.\n\ngame_categories is een pure tussentabel: enkel gameId en categoryId, zonder eigen gegevens. Beide hebben een samengestelde primaire sleutel op hun twee foreign keys.\n\nOOSD-vergelijking: een associatieklasse in UML, een klasse die de relatie zelf beschrijft."}, {"id": "q040", "ch": "5", "q": "Waarom is er geen /api/game-categories met eigen controller en service?", "c": "Een tussentabel heeft zonder haar ouder geen zin; je beheert ze via de ouder.", "w": ["NestJS kan geen controllers maken voor tabellen met een samengestelde primaire sleutel.", "De koppeling zat niet in de eerste migratie en moet dus later nog bijgewerkt worden.", "Een admin moet de koppelingen rechtstreeks in de databank aanpassen, buiten de API om."], "x": ["Het is geen technisch maar een ontwerpprobleem.", "De migratie heeft er niets mee te maken.", "Dan zou de API de data niet beheren."], "m": "Cursusregel", "y": "Dit is een cursusregel en een beoordelingscriterium. Koppelen gebeurt via POST en PUT van het spel.", "d": "", "o": "", "u": "game_categories is een pure tussentabel: twee foreign keys (gameId, categoryId) en geen eigen gegevens. Zo'n rij betekent niets zonder haar ouders. Daarom beheer je ze via de ouder: bij POST en PUT /api/games stuur je categoryIds mee.\n\nHet is een cursusregel en een beoordelingscriterium: geen controller of service voor een tussentabel, en geen API-aanroepen voor afhankelijke entiteiten.\n\nOOSD-vergelijking: de koppeltabel is een associatie zonder eigen gedrag. Je maakt er geen aparte klasse met controller voor, net zoals je in UML een gewone associatie niet als aparte klasse tekent.\n\nValkuil. play_session_participants is wel een tussentabel met eigen kolommen (status, joinedAt). Die heeft eigen routes (join, leave), want ze bevat zelf gedrag."}, {"id": "q041", "ch": "5", "q": "Wat betekent \"categoryIds\": [] bij PUT /api/games/3?", "c": "Alle koppelingen van het spel worden verwijderd.", "w": ["De koppelingen blijven ongewijzigd, want een lege lijst betekent 'niets'.", "Het request is ongeldig en krijgt een 400.", "Alle categorieën worden uit het systeem verwijderd."], "x": ["Dat geldt voor een weggelaten veld, niet voor een lege lijst.", "Een lege lijst is geldig.", "De categorieën zelf blijven bestaan; enkel de koppelingen verdwijnen."], "m": "Replace-semantiek", "y": "Weggelaten = ongemoeid. [] = alle weg. [1, 2] = vervangen door precies die twee.", "d": "", "o": "", "u": "De GamesService.update onderscheidt drie gevallen. categoryIds weggelaten (undefined): de koppelingen worden niet aangeraakt. categoryIds: []: alle bestaande koppelingen worden verwijderd en er komen geen nieuwe bij. categoryIds: [1, 2]: de oude koppelingen worden verwijderd en vervangen door precies die twee.\n\nDat heet replace-semantiek: de lijst die je stuurt, wordt de nieuwe volledige toestand.\n\nValkuil. Een lege lijst is niet hetzelfde als niets meesturen. Een lege lijst wist, weglaten laat staan."}, {"id": "q042", "ch": "5", "q": "Waarom worden het spel en zijn categoriekoppelingen in één transactie bewaard?", "c": "Alles of niets: een onbekende categorie draait ook de spelwijziging terug.", "w": ["Een transactie maakt de queries sneller omdat MySQL ze bundelt in één bewerking.", "MySQL laat geen twee INSERT-opdrachten na elkaar toe zonder transactie.", "Zo wordt de volgorde van de categorieën bij het spel bewaard."], "x": ["Snelheid is niet het doel.", "Dat is niet waar.", "Een koppeltabel heeft geen volgorde."], "m": "Atomiciteit", "y": "Zonder transactie kon een half gewijzigd spel achterblijven.", "d": "", "o": "Unit of Work.", "u": "Bij een update gebeuren er meerdere schrijfacties: de velden van het spel wijzigen, de oude koppelingen verwijderen en de nieuwe invoegen. In een transactie lukt dat alles of niets. Verwijst één van de nieuwe categoryIds naar een categorie die niet bestaat, dan faalt de insert (foreign key), en MySQL draait ook de spelwijziging terug.\n\nZonder transactie kon er een half gewijzigd spel achterblijven: nieuwe titel maar oude of ontbrekende categorieën.\n\nOOSD-vergelijking: dit is een Unit of Work. Een groep wijzigingen wordt als één atomaire eenheid doorgevoerd of geannuleerd."}, {"id": "q043", "ch": "5", "q": "Wat gebeurt er met de spellen als een admin een categorie verwijdert?", "c": "De koppelingen verdwijnen mee (cascade); de spellen blijven bestaan.", "w": ["Het verwijderen faalt met een 409 zolang er nog spellen aan de categorie gekoppeld zijn.", "De gekoppelde spellen worden ook verwijderd, omdat ze niet zonder categorie kunnen bestaan.", "De categorie blijft als verborgen rij staan en wordt later door een opruimtaak verwijderd."], "x": ["Dat gebeurt bij een spel met sessies, niet bij een categorie.", "Een koppeling verwijderen is iets anders dan een spel verwijderen.", "Er is geen soft delete."], "m": "onDelete cascade", "y": "Bij de koppeltabel staat cascade. Een spel met speelsessies kan daarentegen niet verwijderd worden (409).", "d": "", "o": "", "u": "game_categories.categoryId heeft onDelete cascade. Verwijder je een categorie, dan verdwijnen de koppelrijen mee, maar de spellen zelf blijven bestaan: een spel is niet afhankelijk van een categorie, enkel de koppeling is dat.\n\nVergelijk met play_sessions.gameId (onDelete 'no action'). Een spel waar nog sessies naar verwijzen, kan niet verwijderd worden: dat geeft 409.\n\nDe regel om te onthouden: cascade waar de rij zonder de ouder betekenisloos is (koppelingen, deelnames, reviews), no action waar verlies onverwacht zou zijn (sessies van een spel)."}, {"id": "q044", "ch": "5", "q": "Waarom wordt 'één review per gebruiker per spel' afgedwongen met een unieke index in de databank?", "c": "Het blijft correct bij gelijktijdige requests; een check in code kan door een race condition falen.", "w": ["Een unieke index maakt de queries sneller en vervangt daardoor de controle in de applicatie volledig.", "Drizzle kan geen unieke regels in code uitdrukken, dus dat moet noodgedwongen in de databank.", "Zo blijft de volgorde van de reviews gegarandeerd, wat nodig is voor het gemiddelde."], "x": ["Snelheid is een bijwerking, niet de reden.", "Je kan het wel in code controleren; het is alleen niet genoeg.", "De index zegt niets over volgorde."], "m": "Databank als laatste verdediging", "y": "De filter vertaalt de ER_DUP_ENTRY naar een nette 409.", "d": "", "o": "", "u": "Je kan in de service eerst controleren of er al een review bestaat en pas dan invoegen. Bij twee gelijktijdige requests lezen beide 'bestaat nog niet' en voegen beide in. Dat is een race condition. Een unieke index in de databank is atomair: MySQL laat er maar één door.\n\nDe index idx_review_user_game_unique staat op (userId, gameId). De tweede insert geeft ER_DUP_ENTRY, en de DrizzleQueryErrorFilter maakt er een 409 van.\n\nPrincipe: wat de databank kan afdwingen, laat je de databank afdwingen. De check in code is hooguit een extra vriendelijke boodschap."}, {"id": "q045", "ch": "5", "q": "Wat is relations() in Drizzle?", "c": "Een definitie voor Drizzle (types, query-API); de databank gebruikt ze niet.", "w": ["De definitie van de foreign keys die de databank zelf afdwingt bij elke insert.", "Een migratie die de relaties tussen de tabellen aanmaakt bij het opstarten.", "Een decorator die de relaties tussen de tabellen in Swagger zichtbaar maakt."], "x": ["Foreign keys definieer je met .references().", "Migraties komen van drizzle-kit generate.", "Swagger weet niets van Drizzle."], "m": "Alleen voor Drizzle", "y": "De integriteit zit in de foreign keys en indexen van het schema. relations() geeft de ORM kennis van de relaties voor with: en types.", "d": "", "o": "", "u": "Drizzle kent twee dingen die je niet moet verwarren. Het schema (mysqlTable met references en indexes) beschrijft wat er in de databank staat: dat is wat MySQL afdwingt. relations() beschrijft de relaties enkel voor Drizzle zelf: die gebruikt ze voor de relationele query-API (db.query.games.findMany({ with: ... })) en voor de types.\n\nrelations() maakt dus geen foreign key en verandert niets in de databank. De integriteit zit in de references en indexen van het schema.\n\nValkuil. Een relatie definiëren in relations() zonder references in het schema geeft je mooie queries maar geen bescherming in de databank."}, {"id": "q046", "ch": "5", "q": "Wat is correct over de cardinaliteit users – play_sessions (host)?", "c": "Een gebruiker host 0..N sessies; een sessie heeft precies 1 host.", "w": ["Een gebruiker host precies 1 sessie; een sessie heeft N hosts.", "Het is een veel-op-veel relatie met een eigen tussentabel.", "Een sessie kan zonder host bestaan."], "x": ["Dat is omgekeerd.", "Veel-op-veel is de relatie met deelnemers, niet de host.", "hostId is verplicht."], "m": "1 tot 0..N", "y": "hostId is een foreign key in play_sessions; zo is het een gewone één-op-veel.", "d": "", "o": "", "u": "De cursus tekent ERD's met 0/1/N-labels. Een gebruiker kan nul, één of meerdere sessies hosten (0..N). Een sessie heeft precies één host (1): hostId staat als verplichte foreign key in play_sessions. Dat is een gewone één-op-veel relatie.\n\nDat is iets anders dan de deelname: tussen users en play_sessions bestaat ook een veel-op-veel via play_session_participants. Dezelfde twee tabellen hebben dus twee relaties: host (1-N) en deelnemer (N-N).\n\nOOSD-vergelijking: een associatie met multipliciteit 1 aan de ene kant en 0..* aan de andere."}, {"id": "q047", "ch": "5", "q": "Wat vraagt de opdracht aan het datamodel (ontvankelijkheid)?", "c": "Minstens drie tabellen naast users, een veel-op-veel, en meerdere kolommen naast het id.", "w": ["Minstens één tabel per student en één veel-op-veel relatie tussen die tabellen.", "Een ERD met crow's-foot notatie en minstens vijf tabellen in totaal, de users-tabel inbegrepen.", "Alleen tabellen met een auto-increment id, zonder samengestelde sleutels."], "x": ["Het aantal tabellen per student is geen criterium.", "De cursus gebruikt 0/1/N-labels, niet crow's-foot.", "Een samengestelde sleutel is toegelaten."], "m": "Eisen datalaag", "y": "Wij hebben zeven tabellen (zes naast users) en twee veel-op-veel relaties. De cursus tekent met 0/1/N-labels.", "d": "", "o": "", "u": "De ontvankelijkheidscriteria voor de databank: minstens drie tabellen naast users, onderling verbonden; minstens één veel-op-veel relatie; meerdere kolommen per tabel naast het id. Wie hieraan niet voldoet, krijgt 'Afwezig'.\n\nJullie model: zeven tabellen (zes naast users) en twee veel-op-veel relaties (deelnemers en spel-categorieën), dus ruim boven het minimum. De tweede veel-op-veel kwam er na advies van de lector om met extra marge te werken.\n\nValkuil. Het zijn drempelcriteria. De evaluatie (complexiteit, correctheid, seeds, migraties) komt daarbovenop."}, {"id": "q048", "ch": "6", "q": "Wanneer worden de migraties bij ons uitgevoerd?", "c": "Bij het opstarten van de app, in DrizzleModule (onModuleInit).", "w": ["Tijdens het bouwen van de Docker-image, in een RUN-stap van de Dockerfile.", "Alleen handmatig met db:migrate; de app zelf controleert het schema niet.", "Tijdens het seeden; het seed-script maakt eerst het schema aan en vult het daarna."], "x": ["Bij het bouwen is er geen databank.", "Dat is de werkwijze van de cursus, niet de onze.", "De seed gaat ervan uit dat het schema bestaat."], "m": "onModuleInit", "y": "De cursus draait migraties vóór de serverstart en noemt dat een keuze. Bij meerdere instanties zou elke instantie migreren; hier geen probleem.", "d": "", "o": "", "u": "Migraties zijn SQL-bestanden die het schema stap voor stap opbouwen. Jullie voeren ze uit bij het opstarten van de app, in DrizzleModule.onModuleInit. Zo staat het schema altijd op orde, ook in de Docker-container, zonder een apart commando.\n\nDe cursus draait migraties liever vóór de serverstart en noemt dat een keuze. Het nadeel van jullie aanpak zie je bij meerdere instanties: elke instantie zou migreren. Voor deze applicatie, met één instantie, is dat geen probleem.\n\nValkuil. Verwar migraties niet met seeds. Migraties draaien automatisch, de seed nooit."}, {"id": "q049", "ch": "6", "q": "Waarom zaten alle schemawijzigingen in één branch (chore/schema-update)?", "c": "Twee branches die elk een migratie genereren, botsen in migrations/meta/_journal.json.", "w": ["Drizzle laat per branch maar één migratiebestand toe, anders weigert drizzle-kit te genereren.", "Alleen de eigenaar van de users-tabel mag het schema wijzigen, omdat alle andere ernaar verwijzen.", "De seed werkt alleen als alle migraties in één commit staan, anders vindt hij de tabellen niet."], "x": ["Er is geen limiet.", "Er is geen eigenaarsregel.", "De seed leest enkel de tabellen."], "m": "Migraties zijn genummerd", "y": "Eén korte branch voor de parallelle features voorkomt conflicten. De cursus zegt bij een conflict: houd de inkomende migraties en genereer opnieuw.", "d": "", "o": "", "u": "Elke keer dat je een migratie genereert, schrijft Drizzle een nieuw SQL-bestand én past hij migrations/meta/_journal.json aan, het register van alle migr
