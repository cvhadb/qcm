, "ok": "Als het antwoord op 'werkt het?' luidt 'dat hangt ervan af', is de requirement nog niet scherp genoeg.", "bad": ["Als een NFR afhangt van een andere NFR, moeten ze samengevoegd worden.", "Als de norm afhangt van het toestel van de gebruiker, schrijf je geen NFR maar een aparte user story per toestel.", "Als de klant zegt 'dat hangt ervan af', is de stakeholder niet de juiste bron."], "why": "Elk getal moet te herleiden zijn naar gebruikersfrustratie, wetgeving of hardwarelimieten."}, {"id": "q172", "ch": "3", "q": "Wat beschrijft het Then-deel van een NFR in GWT?", "ok": "Het meetbare, toetsbare resultaat dat een tester zonder overleg kan verifiëren.", "bad": ["De operationele context zoals het toestel, de netwerkstatus en de rol van de gebruiker.", "Het piekmoment of de actie die de NFR in gang zet.", "De FURPS+-categorie waartoe de NFR behoort."], "why": "Given = context · When = actie of piekmoment · Then = meetbaar resultaat."}, {"id": "q173", "ch": "3", "q": "Waar hoort een NFR volgens de cursus thuis?", "ok": "Als acceptatiecriterium bij de betrokken user story.", "bad": ["In een apart NFR-document dat bij de start van het project wordt opgesteld.", "In de Definition of Done, los van de stories.", "Pas in de testfase, als de functionaliteit al gebouwd is."], "why": "Zo kan een story niet naar Done zonder gevalideerde NFR's."}, {"id": "q174", "ch": "3", "q": "Welke NFR-formulering is zwak?", "ok": "Het systeem mag nooit vertragen, ook niet tijdens de grootste piek.", "bad": ["Bij een query van meer dan 1 seconde toont de interface een laadindicator.", "Gegeven 200 gelijktijdige klanten tussen 8u en 9u30, als een klant zoekt, dan verschijnen de resultaten binnen 2 seconden op 4G.", "Gegeven een gebruiker zonder geldig token, als die een beveiligd endpoint aanroept, dan weigert het systeem met HTTP 401."], "why": "Een onhaalbare absolute eis ('nooit'). Kies een realistische, verdedigbare waarde."}, {"id": "q175", "ch": "3", "q": "In welke FURPS+-categorie valt 'Het platform moet GDPR-conform zijn'?", "ok": "+ (Constraints)", "bad": ["Functionality", "Usability", "Supportability"], "why": "Dwingende technische, wettelijke of fysieke beperkingen."}, {"id": "q176", "ch": "3", "q": "In welke FURPS+-categorie valt 'Wat gebeurt er bij netwerkuitval of een serverstoring?'", "ok": "Reliability", "bad": ["Performance", "Supportability", "Functionality"], "why": "Fouten, uitval, databuffering en herstel."}, {"id": "q177", "ch": "3", "q": "Wat is de juiste volgorde van het model om NFR's te bepalen?", "ok": "Pragmatisch kader (5 kernvragen) → GWT-criteria in de stories → FURPS+ als vangnet", "bad": ["FURPS+ invullen → 5 kernvragen stellen → GWT-criteria schrijven", "GWT-criteria schrijven → FURPS+ invullen → 5 kernvragen stellen", "5 kernvragen stellen → FURPS+ volledig invullen → een apart NFR-document opstellen"], "why": "FURPS+ als startpunt gebruiken is een van de zes veelgemaakte fouten."}, {"id": "q178", "ch": "3", "q": "Platform, schaal en beveiliging duiken pas op bij de oplevering. Welke fout is dit?", "ok": "NFR's pas op het einde", "bad": ["Vage formuleringen", "Schijnprecisie", "FURPS+ mechanisch afvinken"], "why": "Oplossing: de 5 kernvragen stellen bij het schrijven en groomen van de story."}, {"id": "q179", "ch": "3", "q": "Een NFR zegt 'binnen 1,3 seconden' zonder enige onderbouwing. Welke fout is dit?", "ok": "Schijnprecisie", "bad": ["Vage formuleringen", "Aannames niet expliciet", "NFR's als los document"], "why": "Een grove maar beargumenteerde waarde is beter dan een willekeurig precies getal."}, {"id": "q180", "ch": "3", "q": "Wanneer is offline werking nodig voor de leveringslijst van een bezorger?", "ok": "Als hij onderweg geen bereik heeft: de lijst moet bij vertrek lokaal bewaard worden en later synchroniseren.", "bad": ["Nooit, want een bezorger heeft altijd 4G in zijn bestelwagen.", "Enkel als de bezorger een smartphone gebruikt in plaats van een tablet.", "Enkel als de klant uitdrukkelijk vraagt om de levering ook zonder internetverbinding te kunnen bevestigen."], "why": "Kernvraag 5: denk aan de context van de gebruiker. Offline vraagt lokale caching en synchronisatie."}, {"id": "q181", "ch": "3", "q": "Welke GWT-NFR is het best geformuleerd voor 'De app moet werken op de tablet van de bezorger'?", "ok": "Gegeven een bezorger op een tablet in landscape, als hij zijn ronde start, dan zijn alle adressen zichtbaar zonder horizontaal te scrollen.", "bad": ["Gegeven een bezorger die zijn ronde rijdt, als hij de app gebruikt op zijn tablet, dan werkt de app altijd goed, vlot en gebruiksvriendelijk.", "Gegeven een tablet, als de bezorger rijdt, dan moet de app zo gebruiksvriendelijk mogelijk zijn.", "Gegeven de app, als die op een tablet draait, dan gebruikt ze een responsive CSS-framework."], "why": "Concrete context, actie en een resultaat dat een tester zonder overleg kan controleren."}, {"id": "q182", "ch": "4", "q": "Welke uitspraak over waterval klopt?", "ok": "Elke fase moet volledig afgerond zijn voordat de volgende begint.", "bad": ["Elke fase wordt herhaald in korte iteraties van twee weken.", "De klant ziet na elke fase een werkend stuk product.", "Testen gebeurt doorlopend tijdens de implementatie."], "why": "Analyse → ontwerp → implementatie → testen → oplevering."}, {"id": "q183", "ch": "4", "q": "Welke uitspraak over agile klopt?", "ok": "Agile betekent niet dat er geen planning is: de planning wordt regelmatig bijgestuurd.", "bad": ["Agile betekent dat er geen documentatie meer gemaakt wordt.", "Agile betekent dat de klant pas bij de oplevering van het volledige product betrokken wordt.", "Agile betekent dat het team zonder vaste afspraken werkt."], "why": "Agile ≠ chaos. Werkende software boven documentatie betekent niet 'geen documentatie'."}, {"id": "q184", "ch": "4", "q": "Twee developers mailen elkaar dagelijks in plaats van naast elkaar te zitten. Welke Agile-waarde wordt geschonden?", "ok": "Individuen en interacties boven processen en tools", "bad": ["Werkende software boven uitgebreide documentatie", "Reageren op verandering boven een vast plan volgen", "Samenwerking met de klant boven contractonderhandeling"], "why": "Principe 6: face-to-face is de meest efficiënte manier om informatie over te brengen."}, {"id": "q185", "ch": "4", "q": "Welk Agile-principe past bij: 'De klant vraagt laat in het project een nieuwe functie en het team neemt die op in een volgende sprint.'?", "ok": "Verwelkom wijzigende requirements, zelfs laat in het ontwikkelproces.", "bad": ["Eenvoud is essentieel.", "Bouw projecten rondom gemotiveerde individuen en geef hen de nodige steun.", "Agile processen bevorderen duurzame ontwikkeling."], "why": "Agile benut verandering als concurrentievoordeel."}, {"id": "q186", "ch": "4", "q": "Welk Agile-principe noemt werkende software als eerste maatstaf?", "ok": "Werkende software is de eerste maatstaf voor vooruitgang.", "bad": ["Lever regelmatig werkende software op met voorkeur voor kortere termijnen.", "Constante aandacht voor technische kwaliteit versterkt de wendbaarheid.", "Business en ontwikkelaars werken dagelijks samen."], "why": "Vooruitgang meet je niet aan documenten of uren, maar aan wat werkt."}, {"id": "q187", "ch": "4", "q": "Hoe groot is een Scrum-ontwikkelteam typisch?", "ok": "5 à 9 mensen", "bad": ["2 à 3 mensen", "10 à 15 mensen", "Zo groot als nodig, er is geen richtlijn"], "why": "Hoe groter, hoe meer communicatie-overhead. Bij grote projecten: meerdere teams."}, {"id": "q188", "ch": "4", "q": "Wie beslist hoe het team het sprintdoel bereikt?", "ok": "Het ontwikkelteam zelf", "bad": ["De Product Owner", "De Scrum Master", "De projectmanager"], "why": "Het team is zelforganiserend: er is geen manager die taken toewijst."}, {"id": "q189", "ch": "4", "q": "Wie zorgt ervoor dat de stand-up elke dag binnen 15 minuten blijft?", "ok": "De Scrum Master", "bad": ["De Product Owner", "Het oudste teamlid", "De klant"], "why": "De SM bewaakt het proces en de grenzen: tijd, krijtlijnen en scope."}, {"id": "q190", "ch": "4", "q": "Wie houdt de klant (zaakvoerder) tevreden en vertegenwoordigt de stakeholders?", "ok": "De Product Owner", "bad": ["De Scrum Master", "Het ontwikkelteam", "De tester"], "why": "De PO is één stem namens alle stakeholders."}, {"id": "q191", "ch": "4", "q": "Wat is het doel van deel 1 van de Sprint Planning?", "ok": "Een ruwe inschatting maken van wat de sprint opgenomen wordt en het sprintdoel bepalen.", "bad": ["De backlog-items worden door het team opgesplitst in taken van 4 tot 16 uur per taak.", "De opgeleverde stories demonstreren aan de klant.", "Bespreken wat er de vorige sprint beter kon."], "why": "Deelnemers: PO, Scrum Master en team. Max. 4 uur per sprint van 2 weken."}, {"id": "q192", "ch": "4", "q": "Wie neemt deel aan de Sprint Review?", "ok": "Team, Product Owner, klant en management", "bad": ["Enkel het ontwikkelteam en de Scrum Master", "Enkel de Product Owner en de klant", "Enkel het management"], "why": "Informele demo van potentieel productiewaardige software."}, {"id": "q193", "ch": "4", "q": "Wat is een regel van de Retrospective volgens de cursus?", "ok": "Altijd concrete acties bepalen, zonder beschuldigingen ('nooit het woord JIJ').", "bad": ["De klant beslist welke verbeterpunten het team in de volgende sprint mag uitvoeren.", "Enkel de Scrum Master mag verbeterpunten voorstellen.", "De retro wordt overgeslagen als de sprint goed verliep."], "why": "Wat ging goed, wat kan verbeteren? Max. 3 uur per sprint van 2 weken."}, {"id": "q194", "ch": "4", "q": "Wat is een kenmerk van de Sprint Backlog?", "ok": "Het team past de schatting dagelijks aan op basis van wat nog rest.", "bad": ["De Product Owner bepaalt welke taken elk teamlid op welke dag uitvoert.", "Ze bevat alle stories van het volledige project.", "Ze wordt pas op het einde van de sprint ingevuld."], "why": "Groot verschil met klassieke urenstaten: bijsturen op wat nog rest, niet achteraf."}, {"id": "q195", "ch": "4", "q": "Wat is een kenmerk van de Product Backlog als Scrum-artefact?", "ok": "Ze is altijd uniek geprioriteerd, niet in blokken van gelijke prioriteit.", "bad": ["Ze bevat enkel user stories en nooit technische taken of bugs.", "Ze wordt beheerd door de Scrum Master.", "Ze wordt na de eerste sprint niet meer aangepast."], "why": "Beheerd door de PO; combinatie van user stories en technische taken."}, {"id": "q196", "ch": "4", "q": "De burndown blijft vlak en daalt plots op het einde van de sprint. Welk patroon is dit en wat helpt?", "ok": "The Cliff: bord dagelijks bijwerken, WIP-limieten instellen en nagaan of het team te veel opneemt.", "bad": ["The Gap: realistischer inschatten, meer slack inbouwen en onafgewerkt werk naar de volgende sprint.", "The Wave: geen scopewijzigingen tijdens de sprint toelaten.", "The Bounce: meer werk plannen en focussen op samenwerken."], "why": "Oorzaken: taken last-minute afgewerkt, taken uit de sprint gehaald, sociale druk om het bord 'goed' te laten lijken."}, {"id": "q197", "ch": "4", "q": "De burndown daalt goed maar stopt boven de nullijn. Wat is een oorzaak volgens de cursus?", "ok": "Te veel hooi op de vork of een onderschatting van de complexiteit.", "bad": ["Er werd tijdens de sprint nieuw werk toegevoegd.", "Het team werkte als individuen en pakte nieuwe taken op.", "Eén taak zat dagenlang vast op een technisch probleem dat niemand kon oplossen."], "why": "Dat is The Gap. Ook: onverwachte gebeurtenissen zoals uitval van een teamlid."}, {"id": "q198", "ch": "4", "q": "De burndown daalt trager dan de ideale lijn. Welke oplossing past?", "ok": "Taken opdelen, de bottleneck identificeren en WIP-limieten gebruiken.", "bad": ["Geen scopewijzigingen meer toelaten tijdens de sprint.", "Meer werk plannen in de volgende sprint.", "De sprint verlengen tot alles af is en de velocity daarop aanpassen."], "why": "Dat is The Lag. Oorzaken: taken te groot, complexe workflow, externe afhankelijkheid, te gespecialiseerde teamleden."}, {"id": "q199", "ch": "4", "q": "Waar komt Kanban vandaan?", "ok": "Uit de Japanse productieomgeving (Toyota)", "bad": ["Uit het Agile Manifesto van 17 experts (2001)", "Uit de Scrum Guide", "Uit het V-model"], "why": "Focus op continue flow en het beperken van onderhanden werk."}, {"id": "q200", "ch": "4", "q": "Welke uitspraak over Kanban klopt?", "ok": "Er zijn geen vaste rollen en geen vaste sprints: werk stroomt continu door.", "bad": ["Er is een Product Owner, een Scrum Master en sprints van twee weken.", "Scopewijzigingen zijn enkel toegestaan op het einde van een iteratie.", "WIP-limieten zijn optioneel en worden zelden gebruikt."], "why": "Kanban is laagdrempelig: je kan het op elk bestaand proces toepassen."}, {"id": "q201", "ch": "4", "q": "Welke uitspraak over Scrumban klopt?", "ok": "Het combineert de structuur van Scrum met de WIP-limieten en continue flow van Kanban.", "bad": ["Het is een nieuw framework dat Scrum en Kanban volledig vervangt.", "Het schaft alle Scrum-ceremonies af ten voordele van één Kanban-bord met WIP-limieten.", "Het is Scrum zonder Product Owner en zonder backlog."], "why": "Geen nieuw framework, maar een hybride. Sprint commitment is flexibeler."}, {"id": "q202", "ch": "4", "q": "Hoe gaan Scrum, Kanban en Scrumban om met scopewijzigingen?", "ok": "Scrum niet tijdens de sprint, Kanban op elk moment, Scrumban flexibeler dan Scrum maar minder dan Kanban.", "bad": ["Scrum op elk moment, Kanban enkel tussen iteraties, Scrumban nooit.", "Alle drie laten scopewijzigingen enkel toe nadat de Scrum Master ze uitdrukkelijk heeft goedgekeurd.", "Scrum en Kanban niet, Scrumban op elk moment zonder beperking."], "why": "Cadans: vaste sprints · continue flow · sprints + continue flow."}, {"id": "q203", "ch": "4", "q": "Welke kolommen voeg je in de Jira-workshop toe aan het standaard Scrum-bord?", "ok": "In Review en Testing", "bad": ["Backlog en Archief", "Blocked en Waiting", "Design en Deploy"], "why": "Standaard: To Do / In Progress / Done. Ook: time tracking activeren en card layout aanpassen."}, {"id": "q204", "ch": "4", "q": "Hoe registreer je in Jira hoeveel tijd je aan een subtaak besteed hebt?", "ok": "Subtaak openen → Log work → gespendeerde tijd invullen", "bad": ["De subtaak naar Done slepen, Jira berekent de tijd automatisch", "De tijd invullen in de beschrijving van de user story", "De Scrum Master vult de tijd in na de stand-up"], "why": "Doe het dagelijks of bij het afsluiten van een taak."}, {"id": "q205", "ch": "4", "q": "Waar vind je de burndown chart in Jira?", "ok": "Board → Reports → Burndown chart", "bad": ["Backlog → Close sprint → Sprint report", "Project settings → Features", "Issue → Create subtask"], "why": "Gebruik ze dagelijks in de stand-up om te bewaken of de sprint op schema ligt."}, {"id": "q206", "ch": "4", "q": "Waarmee doe je de retrospective als je met Jira werkt?", "ok": "Met een extern whiteboard zoals Miro of FigJam, of een fysiek bord.", "bad": ["Met de ingebouwde retro-module van Jira.", "Met het burndown-rapport, dat de verbeterpunten automatisch toont.", "Met de backlog: elk verbeterpunt wordt een user story."], "why": "Jira levert wel velocity-rapporten en sprint-statistieken als input."}];
const CH = { all: 'Alles', '1': 'H1 · Elicitatie', '2': 'H2 · Functionele req.', '3': 'H3 · NFR', '4': 'H4 · Agile', review: 'Te herhalen' };
const KEYS = ['A','B','C','D'];
let chapter = 'all', size = 20, deck = [], idx = 0, answered = false, results = [];

function loadReview() { try { return JSON.parse(localStorage.getItem('ra-qcm-review') || '[]'); } catch (e) { return []; } }
function saveReview(list) { try { localStorage.setItem('ra-qcm-review', JSON.stringify(list)); } catch (e) {} }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const $ = id => document.getElementById(id);

function pool() {
  if (chapter === 'review') { const r = loadReview(); return QUESTIONS.filter(q => r.includes(q.id)); }
  return chapter === 'all' ? QUESTIONS.slice() : QUESTIONS.filter(q => q.ch === chapter);
}
function renderSetup() {
  $('total').textContent = QUESTIONS.length;
  const review = loadReview().length;
  $('chapters').innerHTML = '';
  Object.keys(CH).forEach(k => {
    const n = k === 'all' ? QUESTIONS.length : k === 'review' ? review : QUESTIONS.filter(q => q.ch === k).length;
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = CH[k] + ' (' + n + ')';
    b.setAttribute('aria-pressed', String(chapter === k)); b.disabled = n === 0;
    b.onclick = () => { chapter = k; renderSetup(); };
    $('chapters').appendChild(b);
  });
  $('sizes').innerHTML = '';
  [10, 20, 40, 'alle'].forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = s === 'alle' ? 'Alle' : s;
    b.setAttribute('aria-pressed', String(size === s));
    b.onclick = () => { size = s; renderSetup(); };
    $('sizes').appendChild(b);
  });
}
function start(list) {
  let qs = shuffle(list.slice());
  if (size !== 'alle') qs = qs.slice(0, size);
  // spread the correct answer evenly over A–D
  const pos = shuffle(qs.map((_, i) => i % 4));
  deck = qs.map((q, i) => {
    const opts = shuffle(q.bad.slice());
    opts.splice(pos[i], 0, q.ok);
    return { q, opts, correct: pos[i] };
  });
  idx = 0; results = [];
  $('setup').hidden = true; $('result').hidden = true; $('quiz').hidden = false;
  $('of').textContent = deck.length;
  render();
}
function render() {
  const d = deck[idx]; answered = false;
  $('num').textContent = idx + 1;
  $('nok').textContent = results.filter(r => r.ok).length;
  $('nbad').textContent = results.filter(r => !r.ok).length;
  $('fill').style.width = (idx / deck.length * 100) + '%';
  $('qlabel').textContent = CH[d.q.ch];
  $('qtext').textContent = d.q.q;
  $('why').hidden = true; $('next').hidden = true;
  $('opts').innerHTML = '';
  d.opts.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="key">' + KEYS[i] + '</span><span></span>';
    b.lastChild.textContent = t;
    b.onclick = () => choose(i);
    $('opts').appendChild(b);
  });
}
function choose(i) {
  if (answered) return; answered = true;
  const d = deck[idx], ok = i === d.correct;
  results.push({ q: d.q, ok });
  const r = loadReview().filter(x => x !== d.q.id);
  if (!ok) r.push(d.q.id);
  saveReview(r);
  [...$('opts').children].forEach((b, j) => {
    b.disabled = true;
    if (j === d.correct) b.classList.add('is-ok');
    else if (j === i) b.classList.add('is-bad');
    else b.classList.add('is-dim');
  });
  $('why').innerHTML = '<b>' + (ok ? 'Juist.' : 'Fout. Juist antwoord: ' + KEYS[d.correct] + '.') + '</b> ';
  $('why').appendChild(document.createTextNode(d.q.why));
  $('why').hidden = false;
  $('nok').textContent = results.filter(x => x.ok).length;
  $('nbad').textContent = results.filter(x => !x.ok).length;
  $('next').textContent = idx + 1 < deck.length ? 'Volgende →' : 'Resultaat →';
  $('next').hidden = false; $('next').focus();
}
function next() { if (!answered) return; if (idx + 1 < deck.length) { idx++; render(); } else finish(); }
function finish() {
  $('quiz').hidden = true; $('result').hidden = false;
  const ok = results.filter(r => r.ok).length;
  $('score').textContent = ok + ' / ' + results.length;
  $('per').innerHTML = '';
  ['1','2','3','4'].forEach(c => {
    const rs = results.filter(r => r.q.ch === c); if (!rs.length) return;
    const el = document.createElement('div');
    el.innerHTML = CH[c] + '<strong>' + rs.filter(r => r.ok).length + ' / ' + rs.length + '</strong>';
    $('per').appendChild(el);
  });
  const wrong = results.filter(r => !r.ok);
  $('retry').hidden = wrong.length === 0;
  $('wrong').innerHTML = '';
  wrong.forEach(r => {
    const el = document.createElement('div');
    const q = document.createElement('div'); q.textContent = r.q.q;
    const a = document.createElement('div'); a.className = 'a'; a.textContent = '→ ' + r.q.ok;
    el.append(q, a); $('wrong').appendChild(el);
  });
}
$('start').onclick = () => { const p = pool(); if (p.length) start(p); };
$('next').onclick = next;
$('stop').onclick = () => results.length ? finish() : backToSetup();
$('retry').onclick = () => { const s = size; size = 'alle'; start(results.filter(r => !r.ok).map(r => r.q)); size = s; };
$('again').onclick = backToSetup;
function backToSetup() { $('quiz').hidden = true; $('result').hidden = true; $('setup').hidden = false; renderSetup(); }
document.addEventListener('keydown', e => {
  if ($('quiz').hidden) return;
  const k = e.key.toUpperCase();
  const i = KEYS.indexOf(k) >= 0 ? KEYS.indexOf(k) : ['1','2','3','4'].indexOf(e.key);
  if (i >= 0 && !answered) { e.preventDefault(); choose(i); }
  else if (e.key === 'Enter' && answered) { e.preventDefault(); next(); }
});
renderSetup();
</script>
</body>
</html>
