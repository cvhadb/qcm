<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA Oefentoets</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark;
    --bg: #0d0f14; --surface: #161921; --border: #252a35; --card-bg: #1a1f2e;
    --accent: #e8ff47; --accent2: #47c8ff; --text: #e8eaf0; --muted: #7a8196;
    --ok: #7bc84a; --ok-bg: rgba(58,110,26,.22); --bad: #e05c5c; --bad-bg: rgba(122,26,26,.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-family: 'Syne', 'Arial Black', sans-serif; font-size: clamp(1.8rem,4vw,2.6rem); font-weight: 800; letter-spacing: -1px; color: var(--accent); text-transform: uppercase; line-height: 1; }
  header p { color: var(--muted); font-size: .78rem; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
  .wrap { width: 100%; max-width: 720px; }
  .panel { background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 28px 30px; }
  .label { font-size: .65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; font: inherit; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 2px; }
  .chip:hover { color: var(--text); border-color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent); color: #000; border-color: var(--accent); }
  .chip:disabled { opacity: .35; cursor: not-allowed; }
  .btn { padding: 12px 26px; font: inherit; font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 2px; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: #fff; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-secondary:hover { border-color: var(--text); color: var(--text); }
  .btn:focus-visible, .chip:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .stats { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
  .stats strong { font-size: 1rem; color: var(--accent); }
  .stats .s-ok strong { color: var(--ok); } .stats .s-bad strong { color: var(--bad); }
  .track { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 18px; }
  .fill { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .q { font-size: 1.02rem; line-height: 1.6; margin-bottom: 20px; }
  .opts { display: grid; gap: 10px; }
  .opt { display: flex; gap: 14px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 14px 16px; font: inherit; font-size: .86rem; line-height: 1.5; border-radius: 3px; cursor: pointer; width: 100%; }
  .opt:hover:not(:disabled) { border-color: var(--accent2); }
  .opt .key { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 2px; font-size: .72rem; font-weight: 600; color: var(--muted); }
  .opt:disabled { cursor: default; }
  .opt.is-ok { background: var(--ok-bg); border-color: var(--ok); }
  .opt.is-ok .key { color: var(--ok); border-color: var(--ok); }
  .opt.is-bad { background: var(--bad-bg); border-color: var(--bad); }
  .opt.is-bad .key { color: var(--bad); border-color: var(--bad); }
  .opt.is-dim { opacity: .55; }
  .why { margin-top: 18px; padding: 14px 16px; border-left: 3px solid var(--accent2); background: var(--surface); font-size: .8rem; line-height: 1.7; color: #b8bdcc; }
  .why b { color: var(--text); }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .hint { font-size: .66rem; color: var(--muted); letter-spacing: 1px; }
  .big { font-family: 'Syne', 'Arial Black', sans-serif; font-size: 3rem; font-weight: 800; color: var(--accent); line-height: 1; }
  .per { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr)); gap: 10px; margin: 20px 0; }
  .per div { background: var(--surface); border: 1px solid var(--border); padding: 12px; border-radius: 3px; font-size: .75rem; color: var(--muted); }
  .per strong { display: block; font-size: 1.1rem; color: var(--text); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .wrong { margin-top: 18px; display: grid; gap: 10px; }
  .wrong div { background: var(--surface); border-left: 3px solid var(--bad); padding: 12px 14px; font-size: .8rem; line-height: 1.6; }
  .wrong .a { color: var(--ok); margin-top: 4px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  @media (max-width: 520px) { .panel { padding: 22px 18px; } .q { font-size: .95rem; } }
  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body><a href="index.html" style="display:block;width:max-content;margin:14px auto 0;font:600 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a5;background:#161921;border:1px solid #252a35;padding:8px 10px;text-decoration:none">&larr; Menu</a>
<header>
  <h1>RA Oefentoets</h1>
  <p>Requirement Analyse · <span id="total">0</span> meerkeuzevragen</p>
</header>

<main class="wrap">
  <section id="setup" class="panel">
    <div class="label">Hoofdstuk</div>
    <div class="row" id="chapters"></div>
    <div class="label">Aantal vragen</div>
    <div class="row" id="sizes"></div>
    <button class="btn btn-primary" id="start">Start</button>
    <p class="hint" style="margin-top:14px">Vragen en antwoorden worden telkens geschud. Foute antwoorden komen in "Te herhalen" (in deze browser).</p>
  </section>

  <section id="quiz" hidden>
    <div class="stats">
      <span>Vraag <strong id="num">1</strong> / <strong id="of">0</strong></span>
      <span class="s-ok">Juist <strong id="nok">0</strong></span>
      <span class="s-bad">Fout <strong id="nbad">0</strong></span>
    </div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="panel">
      <div class="label" id="qlabel">H1</div>
      <div class="q" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="why" id="why" hidden></div>
      <div class="nav">
        <button class="btn btn-secondary" id="stop">Stoppen</button>
        <span class="hint">A–D of 1–4 om te kiezen · Enter = volgende</span>
        <button class="btn btn-primary" id="next" hidden>Volgende →</button>
      </div>
    </div>
  </section>

  <section id="result" class="panel" hidden>
    <div class="label">Resultaat</div>
    <div class="big" id="score">0 / 0</div>
    <div class="per" id="per"></div>
    <div class="actions">
      <button class="btn btn-primary" id="retry">Herhaal de foute</button>
      <button class="btn btn-secondary" id="again">Nieuwe toets</button>
    </div>
    <div class="wrong" id="wrong"></div>
  </section>
</main>

<script>
const QUESTIONS = [{"id": "q001", "ch": "1", "q": "Wat is een requirement volgens de cursus?", "ok": "Een eigenschap of gedrag dat een systeem moet bezitten om aan de behoeften van de gebruikers of de organisatie te voldoen.", "bad": ["Een technische specificatie waarin het ontwikkelteam vastlegt met welke architectuur, taal en databank het systeem gebouwd zal worden.", "Een wens van de opdrachtgever die pas na de oplevering in het contract wordt opgenomen.", "Een testscenario waarmee de klant controleert of het opgeleverde systeem foutloos werkt."], "why": "Requirements beschrijven wat het systeem moet kunnen of zijn, niet hoe het gebouwd wordt. Ze vormen de brug tussen business en IT."}, {"id": "q002", "ch": "1", "q": "Wat is volgens de cursus de belangrijkste oorzaak van mislukte IT-projecten (31%)?", "ok": "Onduidelijke of ontbrekende requirements.", "bad": ["Een te klein ontwikkelteam voor de omvang van het project.", "Het gebruik van verouderde programmeertalen en frameworks.", "Te hoge licentiekosten voor de gebruikte tools."], "why": "Andere oorzaken: gebrekkige communicatie business–IT, requirements te laat of te snel vastgelegd, geen betrokkenheid van eindgebruikers, scope creep."}, {"id": "q003", "ch": "1", "q": "'Klanten jonger dan 18 jaar mogen geen alcoholische producten bestellen.' Welk type requirement?", "ok": "Bedrijfsregel", "bad": ["Functionele requirement", "Non-functionele requirement", "Randvoorwaarde"], "why": "Een regel uit de organisatie of wet die ook zonder systeem geldt. Er volgt wel een F uit: het systeem controleert de leeftijd."}, {"id": "q004", "ch": "1", "q": "'De applicatie moet GDPR-conform zijn.' Welk type requirement?", "ok": "Randvoorwaarde", "bad": ["Functionele requirement", "Bedrijfsregel", "Non-functionele requirement"], "why": "Een beperking van buitenaf, vaak technisch of wettelijk. Dat is het voorbeeld uit de cursus."}, {"id": "q005", "ch": "1", "q": "'De zoekresultaten worden weergegeven binnen 1 seconde.' Welk type requirement?", "ok": "Non-functionele requirement", "bad": ["Functionele requirement", "Bedrijfsregel", "Randvoorwaarde"], "why": "Het zegt hoe goed (snel) het systeem iets doet. De functie zoeken zelf bestaat al."}, {"id": "q006", "ch": "1", "q": "'De gebruiker ontvangt een bevestigingsmail na het plaatsen van een bestelling.' Welk type requirement?", "ok": "Functionele requirement", "bad": ["Non-functionele requirement", "Randvoorwaarde", "Bedrijfsregel"], "why": "Het beschrijft wat het systeem doet als reactie op een gebeurtenis."}, {"id": "q007", "ch": "1", "q": "Welke valkuil van slechte requirements zit in 'De database moet genormaliseerd zijn naar 3NF.'?", "ok": "Te technisch", "bad": ["Te vaag", "Tegenstrijdig", "Onvolledig"], "why": "Het is een implementatiekeuze (hoe), geen behoefte (wat)."}, {"id": "q008", "ch": "1", "q": "'De gebruiker kan zoeken op productnaam.' Er staat niets over wat er gebeurt als er geen resultaten zijn. Welke valkuil?", "ok": "Onvolledig", "bad": ["Te technisch", "Onmeetbaar", "Tegenstrijdig"], "why": "Enkel de happy flow is beschreven; de uitzondering ontbreekt."}, {"id": "q009", "ch": "1", "q": "Welke taak hoort NIET bij de business analist?", "ok": "Beslissen over het budget en de scope van het project.", "bad": ["Inconsistenties en ontbrekende informatie in requirements opsporen.", "Samen met stakeholders controleren of requirements correct en volledig zijn.", "Ervoor zorgen dat business en IT elkaar begrijpen."], "why": "Budget en scope beslist de opdrachtgever. De BA verzamelt, analyseert, documenteert, valideert en faciliteert de communicatie."}, {"id": "q010", "ch": "1", "q": "Welke stap van het requirementsproces komt direct na Analyse?", "ok": "Specificatie", "bad": ["Validatie", "Elicitatie", "Beheer"], "why": "Elicitatie → Analyse → Specificatie → Validatie → Beheer. Specificatie = documenteren (user stories, use cases)."}, {"id": "q011", "ch": "1", "q": "Welke uitspraak over stakeholders en eindgebruikers klopt?", "ok": "Elke eindgebruiker is een stakeholder, maar niet elke stakeholder is een eindgebruiker.", "bad": ["Elke stakeholder is een eindgebruiker, maar niet elke eindgebruiker is een stakeholder.", "Stakeholders zijn altijd intern, eindgebruikers zijn altijd extern.", "Een eindgebruiker heeft per definitie meer invloed op het project dan een stakeholder."], "why": "Bakkerij: de zaakvoerder is stakeholder maar geen eindgebruiker; verkoopster en klanten zijn eindgebruikers."}, {"id": "q012", "ch": "1", "q": "Wat is de snowball-techniek?", "ok": "Elke stakeholder vragen wie je nog moet spreken, zodat je nieuwe stakeholders ontdekt.", "bad": ["Een vragenlijst laten doorsturen zodat ze zo veel mogelijk klanten bereikt.", "Requirements stap voor stap groeperen tot steeds grotere epics.", "Interviews houden van de laagste naar de hoogste functie in de organisatie."], "why": "Een manier om geen stakeholders te vergeten. Staat ook in de afsluiting van het interviewsjabloon."}, {"id": "q013", "ch": "1", "q": "Een stakeholder met hoge invloed en lage interesse. Welke strategie?", "ok": "Tevreden houden", "bad": ["Nauw betrekken", "Informeren", "Monitoren"], "why": "Tevreden houden, niet overbelasten. Cursusvoorbeeld: senior management."}, {"id": "q014", "ch": "1", "q": "De verkoopster van de bakkerij verwerkt dagelijks bestellingen maar beslist niet over het project. Waar staat ze op het power/interest grid?", "ok": "Informeren (lage invloed, hoge interesse)", "bad": ["Nauw betrekken (hoge invloed, hoge interesse)", "Monitoren (lage invloed, lage interesse)", "Tevreden houden (hoge invloed, lage interesse)"], "why": "Vaak gebruiken betekent niet veel invloed hebben. Eindgebruikers informeer je en je verzamelt hun feedback."}, {"id": "q015", "ch": "1", "q": "Wat bedoelt de cursus met het ijsberg-principe?", "ok": "Wat stakeholders zeggen is maar het topje; wat ze bedoelen en wat ze vergeten te vermelden zit onder water.", "bad": ["De meeste kosten van een IT-project zitten verborgen in het onderhoud na oplevering.", "Het grootste deel van de requirements van een systeem is niet-functioneel en blijft daardoor voor de gebruiker onzichtbaar.", "Stakeholders met veel invloed verbergen bewust hun echte belangen voor de analist."], "why": "Elicitatie helpt om ook de impliciete requirements onder water te ontdekken."}, {"id": "q016", "ch": "1", "q": "Een receptionist omschrijft zijn werk als 'gewoon wat klikken'. Welke elicitatietechniek kies je?", "ok": "Observatie", "bad": ["Interview", "Survey / vragenlijst", "Documentanalyse"], "why": "Hij kan zijn werk moeilijk beschrijven (impliciete kennis). Observatie ontdekt impliciete requirements."}, {"id": "q017", "ch": "1", "q": "Een ziekenhuis heeft 200+ eindgebruikers verspreid over 5 campussen. Welke techniek past het best?", "ok": "Survey / vragenlijst", "bad": ["Workshop / focusgroep", "Observatie", "Prototyping"], "why": "Veel, verspreide stakeholders. Nadeel: je kan niet doorvragen, dus eventueel aanvullen met enkele interviews."}, {"id": "q018", "ch": "1", "q": "Sales en IT hebben een conflict over het CRM-systeem. Welke techniek past het best?", "ok": "Workshop met een goede facilitator", "bad": ["Survey / vragenlijst bij beide afdelingen", "Documentanalyse", "Observatie"], "why": "Een workshop brengt meerdere stakeholders samen om consensus en draagvlak te bereiken."}, {"id": "q019", "ch": "1", "q": "Stakeholders hebben moeite om abstracte requirements te verwoorden. Welke techniek helpt?", "ok": "Prototyping", "bad": ["Documentanalyse", "Survey / vragenlijst", "Observatie"], "why": "Een prototype maakt ideeën tastbaar. Aandachtspunt: het kan als definitief gezien worden."}, {"id": "q020", "ch": "1", "q": "Welk onderdeel van het interviewsjabloon komt direct na 'Huidig proces'?", "ok": "Pijnpunten", "bad": ["Behoeften", "Contextschets", "Must-haves"], "why": "Opening → contextschets → huidig proces → pijnpunten → behoeften → must-haves → nice-to-haves → randvoorwaarden → afsluiting."}, {"id": "q021", "ch": "1", "q": "Welke van deze is GEEN valkuil bij een interview?", "ok": "Dieper ingaan op een antwoord met een doorvraag.", "bad": ["Ja/nee-vragen stellen in plaats van open vragen.", "Antwoorden invullen voor de gesprekspartner.", "Geen aantekeningen maken en vertrouwen op je geheugen."], "why": "Doorvragen is net goed. De vierde valkuil is te snel doorgaan zonder door te vragen."}, {"id": "q022", "ch": "1", "q": "Wat is een persona?", "ok": "Een fictief maar realistisch profiel van een typische gebruiker, opgesteld op basis van interviews.", "bad": ["Een echte klant uit het klantenbestand die als testgebruiker wordt aangeduid.", "Het ideale klantprofiel dat de marketingafdeling in de toekomst wil aantrekken met campagnes.", "Een statistisch gemiddelde van alle antwoorden uit een survey."], "why": "Onderdelen: naam en leeftijd, rol, doelen, pijnpunten, context en een kenmerkend citaat."}, {"id": "q023", "ch": "1", "q": "Wat is de backbone van een User Story Map?", "ok": "De bovenste rij: de epics in de volgorde van het gebruikersverhaal.", "bad": ["De linkse kolom met de belangrijkste user stories van het project.", "De horizontale lijn die het MVP van de rest van de stories scheidt.", "De lijst van alle technische tasks die nodig zijn voor de eerste sprint."], "why": "De backbone is stabiel; de stories eronder evolueren doorheen het project."}, {"id": "q024", "ch": "1", "q": "Wat stelt de verticale as van een USM voor?", "ok": "De prioriteit van de stories: meest essentieel bovenaan.", "bad": ["De volgorde waarin de gebruiker de activiteiten doorloopt.", "De technische lagen van de applicatie, van databank tot interface.", "De verschillende gebruikersrollen die met het systeem werken."], "why": "De horizontale as is de narrative flow (volgorde van het verhaal)."}, {"id": "q025", "ch": "1", "q": "Waar plaats je de epic Administratie op de backbone, en waarom?", "ok": "Achteraan, omdat het ondersteunend is en geen stap in het verhaal van de eindgebruiker.", "bad": ["Vooraan, omdat de catalogus eerst ingevuld moet zijn voor iemand kan bestellen.", "In het midden, omdat het personeel tussen bestellen en leveren tussenkomt.", "Nergens, omdat interne functies niet op een User Story Map horen."], "why": "Zo staat het ook in het bakkerijvoorbeeld: Authenticatie → Producten → Bestellen → Leveren → Administratie."}, {"id": "q026", "ch": "1", "q": "Wat is volgens de cursus het grootste voordeel van een User Story Map?", "ok": "Het gesprek dat ertoe leidt: business en IT bouwen samen een gedeeld begrip op.", "bad": ["Dat ze het functioneel ontwerp volledig vervangt, zodat er geen documentatie meer nodig is.", "Dat ze automatisch de story points en de planning van elke sprint berekent.", "Dat de klant ze kan ondertekenen als contract voor de volledige scope."], "why": "De USM is een levend document. Maak ze samen met de stakeholders."}, {"id": "q027", "ch": "2", "q": "Welke van deze is GEEN van de vier kenmerken van een use case?", "ok": "Ze beschrijft hoe het systeem technisch gerealiseerd wordt.", "bad": ["Ze vertrekt vanuit het doel van de actor (gebruikerscentrisch ontwerp).", "Ze bakent af wat het systeem wel en niet doet (scope en grenzen).", "Ze deelt een complex systeem op in afzonderlijke functionaliteiten (structuur en overzicht)."], "why": "Het vierde kenmerk is focus op interactie en gedrag: enkel WAT, niet HOE."}, {"id": "q028", "ch": "2", "q": "Welke actiestap is correct geformuleerd voor een use case?", "ok": "De klant geeft zijn leveringsadres op.", "bad": ["De klant klikt op de blauwe knop in de rechterbovenhoek.", "Het systeem voert een SQL INSERT-query uit op de tabel bestellingen.", "Het systeem hasht het wachtwoord met bcrypt."], "why": "Geen GUI-elementen, geen technisch jargon, geen implementatiekeuzes. Schrijf in de taal van de opdrachtgever."}, {"id": "q029", "ch": "2", "q": "Wat betekent '3A' in een use case?", "ok": "Een alternatief verloop dat afwijkt van stap 3 van het normaal verloop.", "bad": ["De derde actor die bij de use case betrokken is.", "De derde domeinspecifieke regel van de use case.", "Een aanname bij stap 3 die nog als op te klaren punt aan de opdrachtgever voorgelegd moet worden."], "why": "Notatie XA, XB… met X het stapnummer. Zeg altijd waar het verloop verdergaat of eindigt."}, {"id": "q030", "ch": "2", "q": "Wat is de primaire actor van een use case?", "ok": "De actor die de use case initieert, altijd een rol en geen specifiek persoon.", "bad": ["De persoon met de meeste invloed op het project.", "Het systeem zelf, omdat het de meeste stappen uitvoert.", "De stakeholder die de use case uiteindelijk heeft goedgekeurd, met naam en functie."], "why": "Bv. 'Klant', niet 'Marie Declercq'."}, {"id": "q031", "ch": "2", "q": "Welke uitspraak over use cases en user stories klopt?", "ok": "Een user story is bewust onvolledig (een gespreksstarter); een use case beschrijft de volledige interactie met flows en uitzonderingen.", "bad": ["Een user story is een referentiedocument dat lang blijft bestaan; een use case vervalt meteen na de implementatie van de functie.", "Een use case is bedoeld voor communicatie en prioritering; een user story voor het functioneel ontwerp.", "Een user story beschrijft de volledige interactie; een use case is één kleine, concrete behoefte."], "why": "Use case: groot, volledig, lang, functioneel ontwerp. User story: klein, bewust onvolledig, kort, communicatie en prioritering."}, {"id": "q032", "ch": "2", "q": "Wat drukt het 'zodat'-deel van een user story uit?", "ok": "De business waarde: waarom de gebruiker dit wil.", "bad": ["De technische oplossing die het team zal bouwen.", "Het acceptatiecriterium waarmee de story getest wordt.", "De rol van de gebruiker die de functie aanvraagt."], "why": "Als [wie] wil ik [wat] zodat [waarom = business waarde]. Het 'zodat' maakt prioriteren makkelijker."}, {"id": "q033", "ch": "2", "q": "Welke user story is correct geformuleerd?", "ok": "Als klant wil ik mijn bestelling kunnen annuleren zodat ik geen ongewenste kosten heb.", "bad": ["Als gebruiker wil ik kunnen inloggen.", "De database moet een tabel aanmaken voor klantgegevens.", "Als klant wil ik dat de database een tabel aanmaakt voor mijn gegevens zodat ik kan bestellen."], "why": "Concrete rol, actie en waarde. De andere missen de rol, de waarde of zijn een task of een vage NFR."}, {"id": "q034", "ch": "2", "q": "Waar staat de N van INVEST voor?", "ok": "Negotiable: een story is een uitnodiging tot gesprek, geen contract.", "bad": ["Necessary: de story is noodzakelijk om het MVP te kunnen opleveren.", "Numbered: elke story heeft een uniek nummer in de backlog.", "Non-technical: de story bevat geen technisch jargon."], "why": "De PO bepaalt het wat, het team het hoe. Details worden zo laat mogelijk toegevoegd."}, {"id": "q035", "ch": "2", "q": "Het team kan een story niet inschatten. Wat raadt de cursus aan?", "ok": "De story opsplitsen of eerst een spike doen.", "bad": ["De story meteen op 40 story points zetten.", "De story naar de Won't-categorie verplaatsen.", "De Scrum Master laten beslissen over de schatting."], "why": "Niet Estimatable betekent: te vaag, te groot of technisch te onbekend."}, {"id": "q036", "ch": "2", "q": "'Als gebruiker wil ik producten kunnen zoeken en filteren en sorteren en vergelijken zodat ik het beste product vind.' Welke INVEST-criteria worden vooral geschonden?", "ok": "Small en Testable", "bad": ["Independent en Negotiable", "Valuable en Negotiable", "Independent en Valuable"], "why": "Meerdere 'en' = te groot. 'Het beste product' is niet testbaar. Oplossing: splitsen in vier stories."}, {"id": "q037", "ch": "2", "q": "Het team wil 'databank voor zoeken', 'API voor zoeken' en 'scherm voor zoeken' als drie stories plannen. Wat zegt het slice the cake-principe?", "ok": "Het zijn drie tasks van één story die door alle lagen snijdt.", "bad": ["Dat is correct: elke technische laag is een aparte story.", "Het zijn drie epics die elk nog gesplitst moeten worden.", "De databank wordt een story, de rest zijn tasks."], "why": "Een story levert zelfstandig waarde op. Een technische laag alleen levert geen waarde."}, {"id": "q038", "ch": "2", "q": "'Als verkoopster wil ik bestellingen kunnen beheren.' Wat is dit?", "ok": "Een epic", "bad": ["Een task", "Een goede user story", "Een acceptatiecriterium"], "why": "'Beheren' omvat bekijken, wijzigen, annuleren… → te groot, en het 'zodat' ontbreekt. Splitsen op CRUD."}, {"id": "q039", "ch": "2", "q": "Welke splitsingstechniek: 'betalen' → bij afhaling · via overschrijving · met kaart?", "ok": "Op business rules", "bad": ["Op workflow", "Op data", "Op gebruikersrollen"], "why": "Elke variant volgt een andere regel van het bedrijf."}, {"id": "q040", "ch": "2", "q": "Welke splitsingstechniek: 'producten beheren' → toevoegen · raadplegen · aanpassen · verwijderen?", "ok": "Op CRUD-operaties", "bad": ["Op workflow", "Op gebruikersrollen", "Op business rules"], "why": "Create, Read, Update, Delete."}, {"id": "q041", "ch": "2", "q": "Wat is een signaal dat een user story te groot is?", "ok": "De story bevat meerdere 'en' of 'of', of meer dan één actor of doel.", "bad": ["De story heeft een 'zodat'-deel met meer dan tien woorden.", "De story wordt door meer dan één ontwikkelaar tegelijk uitgevoerd in de sprint.", "De story staat onder de MVP-lijn op de User Story Map."], "why": "Andere signalen: het team kan de omvang niet inschatten, of er zijn te veel scenario's om te testen."}, {"id": "q042", "ch": "2", "q": "Wie beheert de Sprint Backlog?", "ok": "Het ontwikkelteam", "bad": ["De Product Owner", "De Scrum Master", "De business analist"], "why": "De Product Backlog wordt beheerd door de PO; de Sprint Backlog is het werkdocument van het team."}, {"id": "q043", "ch": "2", "q": "Wat is het verschil tussen MVP en MLP?", "ok": "MVP is de minimale versie die waarde levert en live kan; MLP is de versie die gebruikers écht blij maakt.", "bad": ["MVP bevat alle Must- en Should-stories; MLP bevat enkel de Could-stories.", "MVP is een klikbaar prototype zonder code om de klant te overtuigen; MLP is de eerste werkende versie van het product.", "MVP is bedoeld voor interne testers; MLP is de versie voor de klant."], "why": "MVP: enkel absolute must-haves, snel feedback. MLP: ook should-haves, loyaliteit en tevredenheid."}, {"id": "q044", "ch": "2", "q": "Wat is het verschil tussen de Definition of Done en acceptatiecriteria?", "ok": "Acceptatiecriteria gelden voor één specifieke story; de DoD geldt generiek voor alle stories.", "bad": ["De DoD wordt door de klant opgesteld, acceptatiecriteria door de ontwikkelaars.", "Acceptatiecriteria gelden voor de hele release van het product, de Definition of Done enkel voor de stories van één sprint.", "De DoD vervangt de acceptatiecriteria zodra het project agile werkt."], "why": "Een story is pas done als zowel de AC als de DoD vervuld zijn."}, {"id": "q045", "ch": "2", "q": "Welk aandeel van de inspanning mag volgens de vuistregel maximaal naar Must have gaan?", "ok": "Ongeveer 60%", "bad": ["Ongeveer 20%", "Ongeveer 80%", "Ongeveer 100%"], "why": "Must ~60%, Should ~20%, Could ~20%, Won't 0%. Als alles Must is, werkt de methode niet."}, {"id": "q046", "ch": "2", "q": "Wat betekent Won't have in MoSCoW?", "ok": "Bewust uit de scope van deze release, geparkeerd voor later.", "bad": ["Technisch onmogelijk, dus definitief geschrapt.", "Een nice-to-have die het team bouwt zodra er tijd over is in de sprint.", "Belangrijk, maar er bestaat een workaround."], "why": "Won't = niet nu. 'Nice-to-have als er tijd is' is Could; 'workaround mogelijk' is Should."}, {"id": "q047", "ch": "2", "q": "In welke Kano-categorie vallen snelle laadtijden?", "ok": "Prestatiebehoefte", "bad": ["Basisbehoefte", "Aantrekkelijke behoefte", "Onverschillig"], "why": "Hoe beter, hoe tevredener. Basis: kunnen inloggen. Aantrekkelijk: AI-assistent. Onverschillig: achtergrondkleur kiezen."}, {"id": "q048", "ch": "2", "q": "In welke Kano-categorie valt een dagelijkse pop-up met aanbiedingen?", "ok": "Omgekeerd", "bad": ["Onverschillig", "Aantrekkelijke behoefte", "Prestatiebehoefte"], "why": "De gebruiker wil dit niet: de aanwezigheid verlaagt de tevredenheid."}, {"id": "q049", "ch": "2", "q": "Welke combinatie komt in de prioriteitsvolgorde direct na Must + Prestatiebehoefte?", "ok": "Should + Prestatiebehoefte", "bad": ["Should + Aantrekkelijke behoefte", "Could + Basisbehoefte", "Must + Aantrekkelijke behoefte"], "why": "Must+basis → Must+prestatie → Should+prestatie → Should+aantrekkelijk → Could (alle)."}, {"id": "q050", "ch": "2", "q": "Wat zijn story points?", "ok": "Een relatieve maat voor complexiteit, risico en onzekerheid.", "bad": ["Het aantal uren dat een ontwikkelaar aan een story werkt.", "Een score voor de business waarde die de PO aan een story geeft.", "Het aantal acceptatiecriteria dat bij een story hoort."], "why": "Een story van 8 punten is twee keer zo complex als een van 4, niet '8 uur werk'."}, {"id": "q051", "ch": "2", "q": "Een story krijgt T-shirtmaat M. Hoeveel story points is dat volgens de cursus?", "ok": "5–8", "bad": ["2–3", "13–20", "40+"], "why": "XS = 1 · S = 2–3 · M = 5–8 · L = 13–20 (overweeg splitsen) · XL = 40+ (epic)."}, {"id": "q052", "ch": "2", "q": "Waarom draaien alle teamleden bij planning poker hun kaart tegelijk om?", "ok": "Om te vermijden dat de eerste genoemde schatting de anderen beïnvloedt (anchoring).", "bad": ["Om sneller tot een gemiddelde schatting te komen die meteen in de backlog opgenomen kan worden.", "Om te voorkomen dat de Product Owner de schatting overneemt.", "Om het spel eerlijk te houden, zodat niemand punten kan winnen."], "why": "Daarna lichten de hoogste en laagste schatter toe, en er wordt opnieuw geschat tot er consensus is."}, {"id": "q053", "ch": "2", "q": "Velocities: sprint 1 = 18, sprint 2 = 22, sprint 3 = 14, sprint 4 = 20 SP. Wat is de gemiddelde velocity?", "ok": "18,5 SP", "bad": ["20 SP", "22 SP", "74 SP"], "why": "(18 + 22 + 14 + 20) / 4 = 74 / 4 = 18,5. Volgens yesterday's weather plan je ~18 SP in sprint 5."}, {"id": "q054", "ch": "2", "q": "Wat is 'yesterday's weather'?", "ok": "Sprint planning op basis van de gemiddelde velocity van de vorige sprints.", "bad": ["De planning aanpassen aan de beschikbaarheid van het team van gisteren.", "De burndown van de vorige dag vergelijken met de ideale lijn.", "De stand-up starten met wat gisteren is misgelopen."], "why": "Velocity is geen maat voor productiviteit, maar een hulpmiddel voor voorspelbaarheid."}, {"id": "q055", "ch": "2", "q": "Wat is het verschil tussen een burndown chart en een burn-up chart?", "ok": "Een burndown toont het resterende werk; een burn-up toont het gerealiseerde werk en dient voor forecasting.", "bad": ["Een burndown toont de kosten van het project; een burn-up toont de opbrengsten.", "Een burndown is voor de Product Backlog; een burn-up voor de Sprint Backlog.", "Een burndown hoort bij de Product Backlog van het hele project; een burn-up bij de Sprint Backlog van één sprint."], "why": "De burndown signaleert vroeg als het team achterloopt."}, {"id": "q056", "ch": "2", "q": "Welke karakteristiek van goede acceptatiecriteria schendt 'Gebruik een cache om de productpagina sneller te maken.'?", "ok": "Resultaat, niet recept", "bad": ["Onafhankelijkheid", "Duidelijkheid en beknoptheid", "Testbaarheid"], "why": "Het beschrijft een oplossing. Een AC beschrijft het resultaat, bv. 'laadt binnen 2 seconden'."}, {"id": "q057", "ch": "2", "q": "Wat betekent 'Given' in het GWT-format?", "ok": "De beginsituatie: de context en precondities.", "bad": ["De actie die de gebruiker uitvoert.", "Het verwachte resultaat van de actie.", "De gebruiker die de user story heeft aangevraagd."], "why": "Given = beginsituatie · When = actie · Then = verwacht resultaat. GWT komt uit BDD."}, {"id": "q058", "ch": "2", "q": "Wie zijn de 3 amigos?", "ok": "PO/BA, het ontwikkelteam en de testers", "bad": ["PO, Scrum Master en de klant", "BA, projectmanager en de opdrachtgever", "Klant, eindgebruiker en ontwikkelaar"], "why": "Ze stellen de acceptatiecriteria samen op: klantbehoefte, haalbaarheid en randgevallen."}, {"id": "q059", "ch": "2", "q": "Wat is het verschil tussen verificatie en validatie?", "ok": "Verificatie: bouwen we het systeem correct? Validatie: bouwen we het juiste systeem?", "bad": ["Verificatie gebeurt door de klant, validatie door het ontwikkelteam.", "Verificatie gebeurt vóór de ontwikkeling start, validatie pas nadat het volledige systeem opgeleverd is.", "Verificatie controleert de NFR's, validatie de functionele requirements."], "why": "Verificatie zoekt bugs; validatie controleert of het systeem aan de requirements voldoet."}, {"id": "q060", "ch": "2", "q": "Met welk testniveau is het functioneel ontwerp gekoppeld in het V-model?", "ok": "Systeemtest", "bad": ["Acceptatietest", "Integratietest", "Unittest"], "why": "Requirements ↔ acceptatietest · functioneel ontwerp ↔ systeemtest · technisch ontwerp ↔ integratietest · componenten ↔ unit-/componenttest."}, {"id": "q061", "ch": "2", "q": "Hoeveel duurder is een fout die pas in productie ontdekt wordt, vergeleken met de requirementsfase (Boehm)?", "ok": "50 tot 100 keer", "bad": ["2 tot 3 keer", "5 tot 10 keer", "1000 keer"], "why": "Requirementsfase 1× · ontwikkeling 5–10× · productie 50–100×. Investeer vroeg in AC en testen."}, {"id": "q062", "ch": "2", "q": "Wat controleert een regressietest?", "ok": "Of nieuwe wijzigingen geen bestaande functionaliteit breken.", "bad": ["Of het systeem voldoet aan de behoeften van de gebruiker vóór de livegang.", "Of de verschillende modules correct samenwerken.", "Of een individuele functie in isolatie correct werkt."], "why": "Na elke codewijziging, door QA of geautomatiseerd. De andere opties zijn UAT, integratietest en unittest."}, {"id": "q063", "ch": "2", "q": "Welke techniek voor kwaliteitsborging is een formeel proces in 6 fasen?", "ok": "Inspectie (Fagan)", "bad": ["Collegiale review", "Structured walkthrough", "Expert review"], "why": "Planning → kick-off → voorbereiding → meeting → aanpassing → afsluiting."}, {"id": "q064", "ch": "3", "q": "Hoe definieert hoofdstuk 3 een niet-functionele requirement?", "ok": "Een eis die beschrijft onder welke randvoorwaarden het systeem zijn functionele taken uitvoert.", "bad": ["Een functie van het systeem die de gebruiker niet rechtstreeks ziet, zoals de databank of de serverlogica.", "Een requirement die niet getest kan worden en daarom optioneel is.", "Een wens van de klant die buiten de scope van het project valt."], "why": "FR = wát het systeem doet. NFR = onder welke randvoorwaarden (hoe goed, in welke context)."}, {"id": "q065", "ch": "3", "q": "De klant verwachtte een iOS-app, het team leverde een Android-app. Wat is de les?", "ok": "Platform is een NFR: als het niet expliciet staat, beslist het team zelf.", "bad": ["De functionele analyse was onvolledig, want er ontbraken schermen.", "Het team had beter cross-platform moeten bouwen, los van wat de klant vraagt.", "De klant had de app moeten testen tijdens de sprint review."], "why": "Alle functionaliteit klopte; het besturingssysteem stond nergens als harde randvoorwaarde."}, {"id": "q066", "ch": "3", "q": "Welke vraag hoort bij kernvraag 2 (Connectiviteit & API)?", "ok": "Bestaat de API al, of moet die nog gebouwd worden?", "bad": ["Moet de app ook zonder netwerkverbinding werken?", "Welke minimale OS-versie moet ondersteund worden?", "Welke rollen mogen welke gegevens zien?"], "why": "De andere vragen horen bij kernvraag 5, 1 en 3."}, {"id": "q067", "ch": "3", "q": "Wat is schijnprecisie?", "ok": "Willekeurige, precies ogende getallen zonder onderbouwing, zoals 'binnen 1,34 seconden'.", "bad": ["Een norm die zo streng is dat het systeem ze in de praktijk nooit kan halen, ook niet na optimalisatie.", "Een acceptatiecriterium zonder Given-deel.", "Een NFR die enkel in een apart document staat."], "why": "Een grove maar verdedigbare schatting is beter. Elk getal moet herleidbaar zijn naar gebruikersfrustratie, wetgeving of hardware."}, {"id": "q068", "ch": "3", "q": "Wat is de analysetemptoets?", "ok": "Kan een tester het criterium zonder overleg testen? Zo niet, dan is het niet scherp genoeg.", "bad": ["De tijd die een analist nodig heeft om voor elke user story de niet-functionele requirements op te stellen.", "Een test waarbij de analist zelf de applicatie gebruikt vóór oplevering.", "Een controle of elke FURPS+-letter minstens één NFR heeft."], "why": "Als de tester moet vragen 'wanneer vind jij dit geslaagd?', is het criterium gefaald."}, {"id": "q069", "ch": "3", "q": "Wat beschrijft het Given-deel van een NFR in GWT?", "ok": "De operationele context: toestel, netwerk, gebruikersrol of omgeving.", "bad": ["Het piekmoment of de actie van de gebruiker.", "Het meetbare resultaat dat de tester controleert.", "De user story en het story-nummer waaraan de niet-functionele requirement gekoppeld is."], "why": "When = actie of piekmoment · Then = meetbaar, toetsbaar resultaat."}, {"id": "q070", "ch": "3", "q": "Welke formulering is sterk (toetsbaar)?", "ok": "Gegeven 50 gelijktijdige gebruikers, als een klant zoekt op productnaam, dan verschijnen de resultaten binnen 2 seconden.", "bad": ["De bakkerij-applicatie is gebruiksvriendelijk op mobiele toestellen.", "De data van klanten moet veilig zijn en niet zomaar toegankelijk.", "De website mag nooit uitvallen, ook niet tijdens piekmomenten zoals Black Friday of de lancering van een nieuwe grafische kaart."], "why": "Context, actie en meetbare norm zijn gegeven. De andere zijn vaag of onhaalbaar."}, {"id": "q071", "ch": "3", "q": "In welke FURPS+-categorie valt 'Wachtwoorden worden gehasht opgeslagen'?", "ok": "Functionality", "bad": ["Reliability", "Supportability", "+ Constraints"], "why": "Security (rechten, rollen, beveiliging, koppelingen) valt in FURPS+ onder Functionality."}, {"id": "q072", "ch": "3", "q": "In welke FURPS+-categorie valt 'Elke mislukte betaling wordt gelogd met tijdstip en foutcode'?", "ok": "Supportability", "bad": ["Reliability", "Performance", "Usability"], "why": "Onderhoud, logging, monitoring en uitbreidbaarheid."}, {"id": "q073", "ch": "3", "q": "Hoe zet je FURPS+ correct in volgens de cursus?", "ok": "Als vangnet achteraf, na het pragmatisch kader met de vijf kernvragen.", "bad": ["Als startpunt: voor elke letter eerst één NFR schrijven.", "Als vervanging van de vijf kernvragen bij grote projecten.", "Enkel bij de oplevering, om te controleren of alles getest is."], "why": "FURPS+ mechanisch afvinken is een van de zes veelgemaakte fouten."}, {"id": "q074", "ch": "3", "q": "Het team zegt achteraf: 'We gingen ervan uit dat iedereen een smartphone in portretmodus gebruikte.' Welke fout is dit?", "ok": "Aannames niet expliciet", "bad": ["Schijnprecisie", "NFR's als los document", "FURPS+ mechanisch afvinken"], "why": "Oplossing: elke aanname over de gebruikscontext aftoetsen bij de klant en vastleggen."}, {"id": "q075", "ch": "3", "q": "Waarom is een apart NFR-document een fout?", "ok": "Developers kijken enkel naar het story-ticket, waardoor NFR's vergeten worden tot de release.", "bad": ["Omdat NFR's volgens de cursus niet gedocumenteerd hoeven te worden.", "Omdat de klant een apart document nooit kan goedkeuren.", "Omdat een NFR-document altijd alle FURPS+-categorieën moet bevatten, ook als ze niet relevant zijn voor het project."], "why": "NFR's horen als acceptatiecriteria bij de story: zo kan de story niet naar Done zonder gevalideerde NFR's."}, {"id": "q076", "ch": "3", "q": "Een gebruiker zonder geldig token roept een beveiligd endpoint aan. Welke HTTP-code verwacht een sterke NFR?", "ok": "401 Unauthorized", "bad": ["403 Forbidden", "404 Not Found", "500 Internal Server Error"], "why": "401 = niet (geldig) aangemeld. 403 = aangemeld, maar zonder rechten."}, {"id": "q077", "ch": "4", "q": "Wat is het kernprobleem van de watervalstrategie?", "ok": "De klant wordt pas bij de oplevering betrokken, en fouten uit de analyse worden pas laat ontdekt.", "bad": ["Er wordt te weinig gedocumenteerd tijdens het project, waardoor het onderhoud na de oplevering erg duur wordt.", "Het team werkt in te korte iteraties om een stabiel product te bouwen.", "De klant kan te vaak van gedacht veranderen tijdens de sprints."], "why": "Fouten uit de analyse zijn bij het testen of de oplevering exponentieel duurder om te herstellen."}, {"id": "q078", "ch": "4", "q": "Wat is agile volgens de cursus?", "ok": "Een filosofie: een mentaliteitswijziging van 'Command & Control' naar samenwerking.", "bad": ["Een methodologie met vaste rollen, verplichte documenten en fasen die elk project op dezelfde manier doorloopt.", "Een tool voor het beheren van backlogs en sprints.", "Een manier van werken zonder planning of structuur."], "why": "Agile ≠ chaos: er is wel planning, maar ze wordt regelmatig bijgestuurd."}, {"id": "q079", "ch": "4", "q": "Welke Agile-waarde wordt geschonden als het team eerst een functioneel ontwerp van 50 pagina's schrijft?", "ok": "Werkende software boven uitgebreide documentatie", "bad": ["Individuen en interacties boven processen en tools", "Samenwerking met de klant boven contractonderhandeling", "Reageren op verandering boven een vast plan volgen"], "why": "Documentatie heeft waarde, maar werkende software wordt hoger gewaardeerd."}, {"id": "q080", "ch": "4", "q": "De projectmanager zegt tegen de klant: 'Dat staat niet in het contract.' Welke Agile-waarde wordt geschonden?", "ok": "Samenwerking met de klant boven contractonderhandeling", "bad": ["Werkende software boven uitgebreide documentatie", "Individuen en interacties boven processen en tools", "Duurzame ontwikkeling boven een constant tempo"], "why": "De laatste optie is geen Agile-waarde."}, {"id": "q081", "ch": "4", "q": "Welke is volgens de cursus GEEN Scrum-artefact?", "ok": "Sprint Review", "bad": ["Product Backlog", "Sprint Backlog", "Burndown chart"], "why": "De Sprint Review is een evenement. Artefacten: Product Backlog, Sprint Backlog, Burndown chart."}, {"id": "q082", "ch": "4", "q": "Wat doet de Scrum Master NIET?", "ok": "Taken toewijzen aan de teamleden.", "bad": ["Het Scrum-proces bewaken en het team coachen.", "Obstakels wegwerken die het team niet zelf kan oplossen.", "Erop letten dat de stand-up binnen 15 minuten blijft."], "why": "De SM bepaalt of wijst geen taken toe, bepaalt geen prioriteiten of schattingen en lost problemen niet zelf op."}, {"id": "q083", "ch": "4", "q": "Wie prioriteert de Product Backlog?", "ok": "De Product Owner", "bad": ["De Scrum Master", "Het ontwikkelteam", "De business analist"], "why": "De PO bepaalt wát er gebouwd wordt. Het team bepaalt hoe en hoeveel."}, {"id": "q084", "ch": "4", "q": "Wat gebeurt er tijdens de Daily Scrum?", "ok": "Elk teamlid zegt wat hij gisteren deed, wat hij vandaag doet en welke obstakels er zijn; problemen worden nadien opgelost.", "bad": ["Het team demonstreert de opgeleverde stories aan de klant.", "Het team schat de nieuwe stories voor de volgende sprint in met planning poker en zet ze in volgorde voor de Product Owner.", "Het team bespreekt wat goed ging en welke acties nodig zijn."], "why": "Exact 15 minuten, staand. De andere opties zijn de Sprint Review, refinement en de Retrospective."}, {"id": "q085", "ch": "4", "q": "Wat gebeurt er in deel 2 van de Sprint Planning?", "ok": "Het team splitst de backlog-items zelf op in taken van 4 tot 16 uur.", "bad": ["De Product Owner bepaalt het sprintdoel, licht de stories toe en beantwoordt de vragen van het team.", "De klant keurt de opgeleverde stories goed.", "Het team kiest verbeterpunten voor de volgende sprint."], "why": "Deel 1: ruwe inschatting en sprintdoel (PO + SM + team). Deel 2: Sprint Backlog met taken (SM + team)."}, {"id": "q086", "ch": "4", "q": "Wanneer vindt de Retrospective plaats?", "ok": "Na de Sprint Review", "bad": ["Vóór de Sprint Planning", "Elke ochtend na de stand-up", "Halverwege de sprint"], "why": "Wat ging goed, wat kan beter: altijd concrete acties, geen beschuldigingen."}, {"id": "q087", "ch": "4", "q": "Welk burndown-patroon wijst er volgens de cursus op dat Scrum niet correct wordt toegepast?", "ok": "The Wave", "bad": ["The Cliff", "The Lag", "The Gap"], "why": "Bij The Wave groeit de sprint backlog tijdens de sprint: er worden scopewijzigingen doorgevoerd."}, {"id": "q088", "ch": "4", "q": "De burndown beweegt dagenlang niet meer. Wat is de meest waarschijnlijke oorzaak?", "ok": "Eén taak zit vast door een technisch probleem, gebrek aan ervaring of een externe afhankelijkheid.", "bad": ["Het team heeft te weinig werk gepland en voegt nieuwe taken toe.", "Er wordt tijdens de sprint nieuw werk toegevoegd omdat de klant van gedacht verandert over de scope.", "Het team heeft te veel hooi op de vork genomen en stopt boven de nullijn."], "why": "Dat is The Flatline. Oplossing: taak opdelen, technical spike, extra hulp. De andere opties zijn Bounce, Wave en Gap."}, {"id": "q089", "ch": "4", "q": "De burndown daalt snel naar nul en stijgt dan weer omdat het team nieuwe taken oppakt. Wat is een oorzaak volgens de cursus?", "ok": "Het team werkt als individuen in plaats van als team, of er werd te weinig werk gepland.", "bad": ["Taken werden pas op het einde afgewerkt omdat het team onder sociale druk het bord er goed wilde laten uitzien.", "Een externe afhankelijkheid blokkeert één taak.", "De taken waren te omvangrijk en de workflow te complex."], "why": "Dat is The Bounce. Oplossing: meer werk plannen, focus op samenwerken."}, {"id": "q090", "ch": "4", "q": "Wat is een WIP-limiet in Kanban?", "ok": "Het maximum aantal taken dat tegelijk in een bepaalde fase mag staan.", "bad": ["Het maximum aantal story points per sprint.", "Het maximum aantal teamleden dat tegelijk aan één en dezelfde taak mag werken.", "De deadline waarop een taak klaar moet zijn."], "why": "Is de limiet bereikt, dan eerst een taak afwerken. Zo wordt het knelpunt zichtbaar."}, {"id": "q091", "ch": "4", "q": "Een supportteam krijgt elke dag onvoorspelbare tickets met wisselende prioriteit. Welk framework past het best?", "ok": "Kanban", "bad": ["Scrum", "Waterval", "Scrumban"], "why": "Continue flow, geen vaste sprints, scope kan op elk moment wijzigen."}, {"id": "q092", "ch": "4", "q": "Een team bouwt nieuwe features in sprints, maar krijgt geregeld dringende onderhoudstaken. Welk framework past het best?", "ok": "Scrumban", "bad": ["Kanban", "Scrum", "Waterval"], "why": "Scrum-ceremonies voor de geplande features, een Kanban-bord met WIP-limieten voor de ad-hoc taken."}, {"id": "q093", "ch": "4", "q": "Hoeveel uur werk komt volgens de Jira-richtlijn in de cursus overeen met 5 story points?", "ok": "8 tot 16 uur", "bad": ["2 tot 4 uur", "4 tot 8 uur", "16 tot 32 uur"], "why": "1 = 0–2 u · 2 = 2–4 u · 3 = 4–8 u · 5 = 8–16 u · 8 = 16–32 u."}, {"id": "q094", "ch": "4", "q": "Wat gebeurt er in Jira met onafgewerkte items als je een sprint afsluit?", "ok": "Ze worden verplaatst naar de volgende sprint of terug naar de Product Backlog.", "bad": ["Ze worden automatisch als Done gemarkeerd.", "Ze worden verwijderd en moeten opnieuw aangemaakt worden.", "Ze blijven in de afgesloten sprint staan tot iemand ze manueel heropent."], "why": "Backlog → Close sprint. Onafgewerkte stories tellen niet mee voor de velocity."}, {"id": "q095", "ch": "4", "q": "Mag de scope tijdens een Scrum-sprint wijzigen?", "ok": "Nee, een sprint is een gesloten iteratie; nieuw werk gaat naar de Product Backlog.", "bad": ["Ja, zolang de Scrum Master de wijziging goedkeurt en de velocity van het team het toelaat.", "Ja, als de klant het nieuwe werk dringend vindt.", "Enkel in de eerste helft van de sprint."], "why": "Een van de vier fundamentele Scrum-regels. Alleen de PO kan een sprint stopzetten."}, {"id": "q096", "ch": "1", "q": "Waarom zijn requirements de 'brug' tussen business en IT?", "ok": "Ze vertalen wat gebruikers en organisatie nodig hebben naar iets wat ontwikkelaars kunnen bouwen.", "bad": ["Ze leggen vast welke programmeertaal, welk framework en welke databank het ontwikkelteam moet gebruiken.", "Ze vervangen de communicatie tussen de opdrachtgever en de ontwikkelaars.", "Ze leggen vast hoeveel het project mag kosten en wanneer het klaar is."], "why": "Zonder duidelijke requirements sluit het eindresultaat vaak niet aan bij wat de klant verwachtte."}, {"id": "q097", "ch": "1", "q": "Wat is scope creep?", "ok": "Het ongecontroleerd uitbreiden van de scope door nieuwe wensen.", "bad": ["Het bewust schrappen van functies om de deadline te halen.", "Het verschil tussen de geschatte en de werkelijke projectkost.", "Het vertragen van een project doordat stakeholders niet beschikbaar zijn."], "why": "Scope = afbakening van wat het systeem wel en niet doet. Scope creep is een van de oorzaken van mislukte projecten."}, {"id": "q098", "ch": "1", "q": "'Bestellingen onder €10 worden niet geleverd.' Welk type requirement?", "ok": "Bedrijfsregel", "bad": ["Non-functionele requirement", "Functionele requirement", "Randvoorwaarde"], "why": "Het voorbeeld uit de cursus. Valkuil: een getal maakt iets nog geen NFR."}, {"id": "q099", "ch": "1", "q": "'De applicatie moet werken op iOS en Android.' Welk type requirement?", "ok": "Non-functionele requirement", "bad": ["Functionele requirement", "Bedrijfsregel", "Bedrijfsregel van de organisatie"], "why": "Het beschrijft een platform (compatibiliteit), niet wat het systeem doet."}, {"id": "q100", "ch": "1", "q": "Welke requirement is het best bruikbaar?", "ok": "De productpagina laadt binnen 2 seconden bij 500 gelijktijdige bezoekers.", "bad": ["Het systeem moet snel en vlot reageren op alle toestellen van de klant.", "Het systeem gebruikt een cache zodat de productpagina sneller laadt.", "Het systeem moet even snel zijn als de websites van de concurrenten."], "why": "Meetbaar, met context. De andere zijn vaag, technisch (oplossing) of niet toetsbaar."}, {"id": "q101", "ch": "1", "q": "'Gebruikers mogen geen bestelling plaatsen.' en 'Klanten kunnen producten in het winkelmandje plaatsen.' Welke valkuil?", "ok": "Tegenstrijdig", "bad": ["Te technisch", "Onmeetbaar", "Te vaag"], "why": "Twee requirements die elkaar tegenspreken. Oplossing: rollen verduidelijken (bezoeker vs. ingelogde klant)."}, {"id": "q102", "ch": "1", "q": "In welke stap van het requirementsproces controleer je samen met de stakeholders of de requirements correct en volledig zijn?", "ok": "Validatie", "bad": ["Specificatie", "Analyse", "Beheer"], "why": "Analyse = zelf controleren op volledigheid, consistentie en haalbaarheid. Validatie = samen met de stakeholders."}, {"id": "q103", "ch": "1", "q": "Een gemeente bouwt een digitaal loket. Welke stakeholder is ook een eindgebruiker?", "ok": "De ambtenaar van de dienst Burgerzaken die de aanvragen behandelt.", "bad": ["De schepen die het budget voor het project goedkeurt.", "De privacyverantwoordelijke (DPO) die toeziet op de GDPR.", "De gemeenteraad die het beleid rond digitalisering bepaalt."], "why": "Vergeet de back-office niet: wie de aanvragen verwerkt, gebruikt het systeem dagelijks."}, {"id": "q104", "ch": "1", "q": "Welke vraag helpt je NIET om stakeholders te identificeren?", "ok": "Welke technologie gebruikt het ontwikkelteam?", "bad": ["Wie kan het project blokkeren of tegenwerken?", "Wie heeft wettelijke of regelgevende verantwoordelijkheid?", "Wie geeft de opdracht en betaalt het systeem?"], "why": "Andere vragen: wie zijn de eindgebruikers, wie zijn de externe partijen? Plus de snowball-techniek."}, {"id": "q105", "ch": "1", "q": "Een externe leverancier van componenten heeft weinig invloed en weinig interesse in het project. Welke strategie?", "ok": "Monitoren", "bad": ["Informeren", "Tevreden houden", "Nauw betrekken"], "why": "Minimaal opvolgen. Cursusvoorbeeld: externe leveranciers."}, {"id": "q106", "ch": "1", "q": "Hoe ga je om met een stakeholder in het kwadrant 'nauw betrekken'?", "ok": "Actief betrekken als sleutelspeler: regelmatig overleg en beslissingen samen nemen.", "bad": ["Enkel informeren via een nieuwsbrief zodra er een nieuwe versie van het platform opgeleverd is.", "Tevreden houden zonder hem te overbelasten met details.", "Minimaal opvolgen en alleen contacteren als er een probleem is."], "why": "Cursusvoorbeeld: zaakvoerder, product owner. De andere opties horen bij informeren, tevreden houden en monitoren."}, {"id": "q107", "ch": "1", "q": "De verkoopster wil dat klanten hun bestelling tot 12u kunnen wijzigen; de bezorger moet zijn route om 10u kennen. Wat doe je als BA?", "ok": "Het conflict zichtbaar maken, een compromis als requirement voorstellen en de opdrachtgever laten beslissen.", "bad": ["De bezorger gelijk geven, omdat de levering belangrijker is dan de verkoop.", "Beide wensen als requirement opnemen en het ontwikkelteam laten kiezen welke het best haalbaar is in de sprint.", "De vraag parkeren tot na de oplevering, omdat het geen functionele vraag is."], "why": "Dit zijn conflicterende belangen. De BA kiest niet zelf een winnaar."}, {"id": "q108", "ch": "1", "q": "Wat is een gesloten vraag?", "ok": "Een vraag die iets bevestigt, zoals 'Werkt u ook op weekends?'", "bad": ["Een vraag die dieper ingaat op een eerder antwoord om meer details te krijgen.", "Een vraag die een situatie schetst, zoals 'Stel dat…'", "Een vraag die de respondent vrij laat vertellen."], "why": "Open = vrij vertellen · doorvraag = dieper ingaan · hypothetisch = situatie schetsen."}, {"id": "q109", "ch": "1", "q": "'Stel dat een klant zijn bestelling wil wijzigen, wat dan?' Wat voor vraag is dit?", "ok": "Een hypothetische vraag", "bad": ["Een gesloten vraag", "Een doorvraag", "Een open vraag over het huidig proces"], "why": "Hypothetische vragen helpen om uitzonderingen en randgevallen op te sporen."}, {"id": "q110", "ch": "1", "q": "Wat is het grootste nadeel van een survey?", "ok": "Je kan niet doorvragen en je mist de nuance van een gesprek.", "bad": ["Je bereikt maar een klein aantal stakeholders tegelijk.", "De antwoorden zijn minder eerlijk omdat ze niet anoniem zijn.", "Het kost veel tijd omdat je elke respondent apart moet spreken."], "why": "Voordelen: veel stakeholders bereiken, anoniem = eerlijker, efficiënt voor bevestiging."}, {"id": "q111", "ch": "1", "q": "Wat is een aandachtspunt bij observatie?", "ok": "Je aanwezigheid kan het gedrag van de geobserveerde beïnvloeden.", "bad": ["Je kan geen impliciete requirements ontdekken.", "Je krijgt geen realistisch beeld van de werkomgeving van de gebruiker.", "Je kan maar één stakeholder per jaar observeren."], "why": "Observatie is ook tijdrovend, maar ontdekt net impliciete requirements in een realistische context."}, {"id": "q112", "ch": "1", "q": "Wanneer is documentanalyse een goede keuze?", "ok": "Als er al formulieren, handleidingen of regelgeving bestaan over het proces.", "bad": ["Als stakeholders het oneens zijn en je consensus moet bereiken.", "Als je honderden verspreide gebruikers snel wil bevragen.", "Als je nog niets weet en eerst de doelen van de opdrachtgever zoekt."], "why": "Voordeel: objectief en het onthult impliciete bedrijfsregels. Nadeel: kan verouderd zijn, niet alles staat op papier."}, {"id": "q113", "ch": "1", "q": "Je start een nieuw project en kent de situatie van de klant nog niet. Waarmee begin je?", "ok": "Een interview met de opdrachtgever", "bad": ["Een survey bij alle klanten", "Een prototype van het systeem", "Een workshop met alle stakeholders"], "why": "Het interview is het ideale startpunt: diepgaand, je kan doorvragen."}, {"id": "q114", "ch": "1", "q": "Welk onderdeel van het interviewsjabloon bevat de vraag 'Wie zou ik nog moeten spreken?'", "ok": "Afsluiting", "bad": ["Contextschets", "Randvoorwaarden", "Opening"], "why": "Afsluiting: 'Is er nog iets toe te voegen? Wie zou ik nog moeten spreken?' (snowball)."}, {"id": "q115", "ch": "1", "q": "Wat doe je na een interview om het correct te verwerken?", "ok": "Je werkt de aantekeningen uit, haalt er requirements en open vragen uit en laat de samenvatting valideren.", "bad": ["Je stuurt de geïnterviewde meteen de volledige lijst requirements om te ondertekenen als contract voor het project.", "Je wacht tot alle interviews voorbij zijn en vertrouwt dan op je geheugen.", "Je zet de antwoorden meteen om in code zodat de klant snel iets ziet."], "why": "Geen aantekeningen maken en vertrouwen op je geheugen is een van de valkuilen."}, {"id": "q116", "ch": "1", "q": "Welk detail hoort NIET thuis in een persona?", "ok": "Een hobby die niets zegt over hoe de persoon het systeem gebruikt.", "bad": ["De pijnpunten die de persoon vandaag ervaart.", "Een kenmerkend citaat in de woorden van de persoon.", "De context: toestel, digitale vaardigheid, moment van gebruik."], "why": "Persona's zijn realistisch en gebaseerd op interviews. Irrelevante details leiden af."}, {"id": "q117", "ch": "1", "q": "Waarom stel je persona's op?", "ok": "Om de eindgebruiker centraal te stellen tijdens de analyse en het ontwerp.", "bad": ["Om de marketingcampagne voor de lancering van het nieuwe platform voor te bereiden.", "Om te bepalen welke stakeholders het project mogen blokkeren.", "Om de stakeholders met de meeste invloed te identificeren."], "why": "Een persona is een fictief maar realistisch profiel van een typische gebruiker."}, {"id": "q118", "ch": "1", "q": "Wat is de eerste stap om een backbone op te stellen?", "ok": "Het verhaal van de gebruiker van begin tot einde beschrijven.", "bad": ["De epics op kaartjes van links naar rechts op de horizontale lijn leggen.", "De stories prioriteren van boven naar onder.", "De MVP-lijn trekken onder de essentiële stories."], "why": "1. verhaal beschrijven → 2. epics identificeren → 3. op de horizontale lijn zetten → 4. valideren met stakeholders."}, {"id": "q119", "ch": "1", "q": "Een intern verlofportaal: welke volgorde van epics is het meest logisch?", "ok": "Authenticatie → Verlofsaldo → Aanvraag → Goedkeuring → Opvolging → Administratie", "bad": ["Administratie → Authenticatie → Aanvraag → Verlofsaldo → Opvolging → Goedkeuring", "Aanvraag → Goedkeuring → Authenticatie → Opvolging → Verlofsaldo → Administratie", "Goedkeuring → Aanvraag → Verlofsaldo → Authenticatie → Administratie → Opvolging"], "why": "De backbone volgt het verhaal van de medewerker. Administratie (HR) staat achteraan."}, {"id": "q120", "ch": "1", "q": "Een gemeentelijk loket krijgt een backoffice. Waar komt de epic 'Behandeling' (medewerker keurt de aanvraag goed)?", "ok": "Tussen Aanvraag en Levering, op het moment waarop het in het proces gebeurt.", "bad": ["Achteraan, naast Administratie, omdat het om interne medewerkers gaat en niet om de burger.", "Vooraan, omdat de medewerker eerst moet inloggen.", "Nergens: een backoffice hoort niet op de backbone."], "why": "Een nieuw blok plaats je op het moment dat het gebeurt, niet automatisch achteraan."}, {"id": "q121", "ch": "1", "q": "Een collega vindt een vlakke Excel-lijst genoeg in plaats van een USM. Wat is het belangrijkste voordeel van de USM?", "ok": "Ze toont het verhaal van de gebruiker en maakt zichtbaar wat er ontbreekt en wat eerst komt.", "bad": ["Ze kan door het ontwikkelteam automatisch omgezet worden naar code en testscenario's voor elke sprint.", "Ze maakt prioriteren overbodig omdat alle stories evenveel waard zijn.", "Ze is verplicht volgens de Scrum Guide en de Agile Manifesto."], "why": "Twee assen: narrative flow (horizontaal) en prioriteit (verticaal), plus releaselijnen."}, {"id": "q122", "ch": "2", "q": "Wat is een use case?", "ok": "Het uitgeschreven verhaal van een actor die het systeem gebruikt om een bepaald doel te bereiken.", "bad": ["Een diagram met de technische componenten van het systeem en de koppelingen tussen die componenten.", "Een korte zin in het formaat 'Als… wil ik… zodat…'.", "Een testgeval waarmee de klant het systeem goedkeurt."], "why": "Stap voor stap, in de taal van de opdrachtgever. Ook een eerste aanzet voor testscenario's."}, {"id": "q123", "ch": "2", "q": "Welk onderdeel van het use case-template beschrijft de toestand van het systeem nadat de use case succesvol is afgerond?", "ok": "Postcondities", "bad": ["Precondities", "Normaal verloop", "Domeinspecifieke regels"], "why": "Precondities = voorwaarden vóór de start."}, {"id": "q124", "ch": "2", "q": "Wat is de tweede stap bij het schrijven van een use case?", "ok": "Het normaal verloop opstellen", "bad": ["Brainstormen over fouten en uitzonderingen", "Alternatieve verlopen uitwerken", "Actor en goal vastleggen"], "why": "1. actor en goal · 2. normaal verloop · 3. brainstorm fouten/uitzonderingen · 4. alternatieve verlopen."}, {"id": "q125", "ch": "2", "q": "Hoe noteer je een domeinspecifieke regel in een use case volgens de cursus?", "ok": "Genummerd, als DR_01, DR_02…", "bad": ["Als stap in het normaal verloop, met een eigen nummer.", "Als alternatief verloop met de notatie XA.", "Als voetnoot onder de postcondities."], "why": "Bv. DR_01: na 5 mislukte pogingen wordt het account 15 minuten geblokkeerd."}, {"id": "q126", "ch": "2", "q": "Welke actiestap is NIET correct voor een use case?", "ok": "Het systeem gebruikt bcrypt om het wachtwoord te hashen.", "bad": ["Het systeem toont een overzicht van de bestelling.", "De klant kiest een afhaaltijdstip.", "Het systeem registreert de bestelling."], "why": "Een implementatiekeuze hoort niet in een use case: enkel WAT, niet HOE."}, {"id": "q127", "ch": "2", "q": "Welk kenmerk van een user story betekent dat ze een uitnodiging tot gesprek is en geen contract?", "ok": "Flexibel", "bad": ["Waardegedreven", "Gebruikersgericht", "Makkelijk te plannen"], "why": "Kenmerken: kort en eenvoudig, gebruikersgericht, waardegedreven, flexibel, makkelijk te plannen."}, {"id": "q128", "ch": "2", "q": "Welke user story is het best geformuleerd vanuit de eindgebruiker?", "ok": "Als bezorger wil ik een lijst van mijn leveringen van vandaag in rijvolgorde zodat ik mijn ronde efficiënt rijd.", "bad": ["Als systeem wil ik de leveringen sorteren op afstand zodat de route korter wordt voor de bezorger.", "Als ontwikkelaar wil ik een API voor leveringen bouwen zodat de app de adressen kan ophalen.", "Als bakkerij wil ik dat het systeem alle leveringen beheert zodat alles vlotter en beter verloopt voor iedereen die betrokken is."], "why": "Een concrete gebruikersrol, een concrete wens en een echte waarde. Geen 'systeem', 'ontwikkelaar' of vage organisatie als actor."}, {"id": "q129", "ch": "2", "q": "Hoe verhouden user stories zich tot functionele requirements?", "ok": "Ze zijn een agile vorm om functionele requirements te beschrijven, aangevuld met acceptatiecriteria.", "bad": ["Ze vervangen alle requirements van het project, ook de niet-functionele requirements en de bedrijfsregels.", "Ze staan los van de requirements en beschrijven enkel de planning.", "Ze beschrijven de technische tasks die nodig zijn om een requirement te bouwen."], "why": "Use cases zijn de traditionele vorm. NFR's hangen als acceptatiecriteria aan de story."}, {"id": "q130", "ch": "2", "q": "Welk INVEST-criterium schendt 'Als admin wil ik de database normaliseren zodat het systeem beter presteert.' het duidelijkst?", "ok": "Valuable", "bad": ["Small", "Estimatable", "Independent"], "why": "Geen waarde voor een gebruiker: het is een technische task. Ook 'beter presteert' is niet testbaar."}, {"id": "q131", "ch": "2", "q": "Welk INVEST-criterium zegt dat een story in één sprint moet passen?", "ok": "Small", "bad": ["Estimatable", "Independent", "Testable"], "why": "Te groot = een epic → opsplitsen."}, {"id": "q132", "ch": "2", "q": "Welk INVEST-criterium zegt dat het team stories in elke volgorde moet kunnen oppakken?", "ok": "Independent", "bad": ["Negotiable", "Small", "Valuable"], "why": "Afhankelijke stories zijn moeilijk te prioriteren. Herformuleren of splitsen."}, {"id": "q133", "ch": "2", "q": "Welke verbetering maakt 'Als klant wil ik snel kunnen bestellen.' het best INVEST-conform?", "ok": "Als vaste klant wil ik mijn vorige bestelling met één klik herhalen zodat ik in minder dan 30 seconden bestel.", "bad": ["Als klant wil ik heel snel en makkelijk kunnen bestellen zodat ik altijd tevreden ben over de webshop van de bakkerij.", "Als klant wil ik dat het systeem een cache gebruikt zodat het bestellen sneller gaat dan nu.", "Als klant wil ik snel kunnen bestellen, betalen, mijn bestelling volgen en een factuur ontvangen."], "why": "Concreet, testbaar en klein. De andere blijven vaag, leggen een oplossing op of zijn te groot."}, {"id": "q134", "ch": "2", "q": "Welke kenmerk hoort bij een task en NIET bij een user story?", "ok": "Ze behandelt één laag van de applicatie en mag technische taal bevatten.", "bad": ["Ze levert zelfstandig en aantoonbaar waarde op voor de eindgebruiker of de organisatie.", "Ze volgt het formaat 'Als… wil ik… zodat…'.", "Ze snijdt door alle lagen van de applicatie."], "why": "Tasks: technische taal toegestaan, geen directe business value, hoeven niet onafhankelijk te zijn."}, {"id": "q135", "ch": "2", "q": "Welke task hoort bij de story 'Als klant wil ik producten filteren op categorie zodat ik sneller vind wat ik zoek'?", "ok": "Een API-endpoint schrijven dat producten per categorie teruggeeft.", "bad": ["Als klant wil ik ook op prijs kunnen filteren zodat ik binnen budget blijf.", "De volledige webshop migreren naar een nieuw framework.", "Een marketingcampagne voor de nieuwe categorieën opzetten."], "why": "Een task is een technische subtaak van de story. De eerste afleider is een nieuwe story."}, {"id": "q136", "ch": "2", "q": "Welke splitsingstechniek: 'bestelling plaatsen' → mandje samenstellen · afhaling of levering kiezen · bevestigen?", "ok": "Op workflow", "bad": ["Op CRUD-operaties", "Op data", "Op business rules"], "why": "Opsplitsen volgens de stappen van het proces."}, {"id": "q137", "ch": "2", "q": "Welke splitsingstechniek: 'bestellingen invoeren' → als klant via de website · als verkoopster namens een telefonische klant?", "ok": "Op gebruikersrollen", "bad": ["Op workflow", "Op business rules", "Op data"], "why": "Dezelfde functie, maar voor verschillende rollen."}, {"id": "q138", "ch": "2", "q": "Welke gouden regel geldt bij het splitsen van stories?", "ok": "Elke gesplitste story moet zelfstandig waarde leveren en nog steeds aan INVEST voldoen.", "bad": ["Elke gesplitste story moet precies even groot zijn als de andere delen.", "Je splitst altijd per technische laag: eerst de databank, daarna de logica en tot slot de interface.", "Je splitst enkel als de Product Owner het uitdrukkelijk vraagt."], "why": "Vermijd ook afhankelijkheden, gebruik AC om grenzen te verduidelijken en betrek het team."}, {"id": "q139", "ch": "2", "q": "Hoeveel stappen telt het bouwen van een USM volgens de cursus, en wat is de laatste?", "ok": "Zes stappen; de laatste is samen valideren met de stakeholders.", "bad": ["Vier stappen; de laatste is de stories schatten in story points.", "Vijf stappen; de laatste is de sprints inplannen in Jira.", "Zes stappen; de laatste is de code opleveren voor de MVP-lijn."], "why": "1. verhaal · 2. epics · 3. stories toevoegen · 4. verticaal prioriteren · 5. releases afbakenen · 6. samen valideren."}, {"id": "q140", "ch": "2", "q": "Waar trek je de MVP-lijn op een User Story Map?", "ok": "Horizontaal, onder de stories die absoluut nodig zijn om live te gaan.", "bad": ["Verticaal, na de epic die het meest gebruikt wordt.", "Verticaal, na de epic die door de meeste gebruikers het vaakst gebruikt wordt.", "Onder de backbone, zodat enkel de epics in het MVP zitten."], "why": "Elke epic heeft idealiter minstens één story boven de lijn, zodat het hele traject werkt."}, {"id": "q141", "ch": "2", "q": "Welke uitspraak over de Product Backlog klopt?", "ok": "Bovenaan is ze gedetailleerd, onderaan grofkorrelig; details komen pas net voor de implementatie.", "bad": ["Ze wordt bij de start van het project volledig uitgeschreven en daarna niet meer gewijzigd.", "Ze wordt beheerd door het ontwikkelteam en bevat enkel de stories van de huidige sprint.", "Alle stories hebben hetzelfde detailniveau, zodat het team ze vrij kan kiezen."], "why": "Levend document, geordend door de PO, na elke sprint herzien (JIT)."}, {"id": "q142", "ch": "2", "q": "Welk criterium staat in de Definition of Done uit de cursus?", "ok": "De code is gereviewd door een collega.", "bad": ["De klant heeft de story betaald.", "De story staat bovenaan de Product Backlog.", "De story heeft minstens 8 story points."], "why": "Ook: alle AC vervuld, unit tests, geen kritieke bugs, getest in de testomgeving, gemerged en deploybaar."}, {"id": "q143", "ch": "2", "q": "Een story werkt op de laptop van de developer, maar is nog niet getest in de testomgeving. Is ze done?", "ok": "Nee, ze voldoet niet aan de Definition of Done.", "bad": ["Ja, zolang de acceptatiecriteria geslaagd zijn op de laptop.", "Ja, als de Scrum Master het goedkeurt.", "Nee, want de klant moet eerst de UAT afronden voor elke story."], "why": "De DoD voorkomt dat 'bijna klaar' als 'klaar' geldt."}, {"id": "q144", "ch": "2", "q": "Wat gebeurt er als een Must have-story ontbreekt bij de release?", "ok": "De release gaat niet door: het is een showstopper.", "bad": ["Er is een workaround mogelijk, dus de release gaat wel door.", "Het heeft nauwelijks effect op de tevredenheid.", "De story schuift automatisch door naar Could have."], "why": "Should = workaround mogelijk. Could = nauwelijks effect."}, {"id": "q145", "ch": "2", "q": "MoSCoW voor de bakkerij v1: 'Als klant wil ik producten filteren op categorie.'", "ok": "Should have", "bad": ["Must have", "Could have", "Won't have"], "why": "Nuttig, maar de klant kan ook scrollen (cursusvoorbeeld)."}, {"id": "q146", "ch": "2", "q": "In welke Kano-categorie valt een AI-assistent die een configuratie voorstelt?", "ok": "Aantrekkelijke behoefte", "bad": ["Basisbehoefte", "Prestatiebehoefte", "Omgekeerd"], "why": "Verrassend en enthousiasmerend: de klant verwacht het niet."}, {"id": "q147", "ch": "2", "q": "In welke Kano-categorie valt de mogelijkheid om de achtergrondkleur te kiezen?", "ok": "Onverschillig", "bad": ["Aantrekkelijke behoefte", "Basisbehoefte", "Prestatiebehoefte"], "why": "Het doet er voor de gebruiker niet toe."}, {"id": "q148", "ch": "2", "q": "Welke story krijgt de hoogste prioriteit volgens de combinatie MoSCoW–Kano?", "ok": "Must have + Basisbehoefte", "bad": ["Must have + Aantrekkelijke behoefte", "Should have + Basisbehoefte", "Should have + Prestatiebehoefte"], "why": "Essentieel én vanzelfsprekend komt eerst."}, {"id": "q149", "ch": "2", "q": "Een story wordt geschat als XL in T-shirt sizing. Wat betekent dat?", "ok": "Het is een epic van 40+ punten die gesplitst moet worden.", "bad": ["Het is een normale story van 8 punten voor één sprint.", "Het is een triviale aanpassing van minder dan een dag.", "Het is een story die het team zonder schatting mag starten."], "why": "L = 13–20 (overweeg splitsen) · XL = 40+ (moet gesplitst)."}, {"id": "q150", "ch": "2", "q": "Waarom gebruiken story points de Fibonacci-reeks?", "ok": "De grote sprongen weerspiegelen de toenemende onzekerheid bij grotere stories.", "bad": ["Omdat het team zo gemakkelijker uren kan omrekenen naar werkdagen voor de planning van de sprint.", "Omdat de Scrum Guide verplicht dat elke schatting een priemgetal is.", "Omdat de som van de punten dan altijd de velocity oplevert."], "why": "1, 2, 3, 5, 8, 13, 20, 40, 100."}, {"id": "q151", "ch": "2", "q": "Wanneer gebeurt planning poker volgens de cursus?", "ok": "Tijdens refinement sessies, om de top van de backlog te verfijnen.", "bad": ["Tijdens de Sprint Review, samen met de klant en het management.", "Tijdens de Retrospective, om de velocity te verbeteren.", "Tijdens de Daily Scrum, voor de taken van vandaag."], "why": "Doel: stories duidelijk maken, inschatten en acceptatiecriteria toevoegen (JIT)."}, {"id": "q152", "ch": "2", "q": "Scope 90 SP, gemiddelde velocity 18,5 SP, sprint = 2 weken. Hoelang duurt het project?", "ok": "5 sprints = 10 weken", "bad": ["4 sprints = 8 weken", "5 sprints = 5 weken", "6 sprints = 12 weken"], "why": "90 / 18,5 ≈ 4,9 → naar boven afronden → 5 sprints × 2 weken."}, {"id": "q153", "ch": "2", "q": "Een burndown ligt op dag 5 duidelijk boven de ideale lijn. Wat betekent dat?", "ok": "Het team loopt achter: er is meer werk over dan gepland.", "bad": ["Het team loopt voor en kan extra werk opnemen.", "De velocity van het team is gestegen tegenover de vorige sprint.", "De sprint backlog bevat te weinig stories."], "why": "De burndown signaleert vroeg dat het team achterloopt. Bespreek het in de stand-up."}, {"id": "q154", "ch": "2", "q": "Wat zijn acceptatiecriteria?", "ok": "Vooraf gedefinieerde eisen waaraan een story moet voldoen om als voltooid en geaccepteerd beschouwd te worden.", "bad": ["De generieke kwaliteitseisen die voor alle stories van het project gelden, zoals code review en unit tests voor elke wijziging.", "De lijst van technische taken die een developer moet afwerken.", "De handtekening van de klant op het einde van het project."], "why": "Ze worden opgesteld tijdens de planning, vóór de implementatie. Generiek voor alle stories = DoD."}, {"id": "q155", "ch": "2", "q": "Wat is een voordeel van acceptatiecriteria?", "ok": "Minder herwerk, omdat ontwikkelaars exact weten wat ze bouwen.", "bad": ["Er zijn geen testers meer nodig in het team.", "De story hoeft niet meer geschat te worden.", "De Product Owner hoeft de backlog niet meer te prioriteren."], "why": "Ook: afstemming, testefficiëntie, meetbare voortgang en klanttevredenheid."}, {"id": "q156", "ch": "2", "q": "Welke karakteristiek schendt een criterium dat drie dingen tegelijk test in één zin?", "ok": "Onafhankelijkheid", "bad": ["Meetbaarheid", "Resultaat, niet recept", "Duidelijkheid en beknoptheid"], "why": "Elk AC test één specifiek aspect, zodat je het apart als geslaagd of gefaald kan markeren."}, {"id": "q157", "ch": "2", "q": "Welk acceptatiecriterium is het best?", "ok": "Gegeven een leeg winkelmandje, als de klant op bestellen klikt, dan toont het systeem 'Je winkelmandje is leeg.'", "bad": ["De klant mag geen lege bestelling kunnen plaatsen, want dat zou voor de bakkerij en voor de klant erg vervelend zijn.", "Het winkelmandje moet goed werken en de klant moet er tevreden over zijn.", "Gebruik een JavaScript-controle die het formulier blokkeert als het mandje leeg is."], "why": "Concreet, testbaar en resultaatgericht. De andere zijn vaag, subjectief of een recept."}, {"id": "q158", "ch": "2", "q": "Welke scenario's moet je naast de happy flow zeker uitschrijven?", "ok": "Negatieve scenario's en edge cases", "bad": ["Enkel de scenario's die de klant expliciet vraagt", "Scenario's voor elke technische laag van de applicatie", "Scenario's voor de stories van de volgende sprint"], "why": "Negatief: foutinvoer, verlopen sessie. Edge: lege invoer, maximale waarden, speciale tekens."}, {"id": "q159", "ch": "2", "q": "Wat brengt de tester in tijdens een 3 amigos-sessie?", "ok": "Randgevallen en foutscenario's, en hij spot vage criteria.", "bad": ["De klantbehoeften en de functionaliteit die de klant voor ogen heeft.", "De technische haalbaarheid en de formulering.", "De prioriteit en de story points van de story."], "why": "PO/BA = klantbehoeften · ontwikkelteam = haalbaarheid · tester = randgevallen."}, {"id": "q160", "ch": "2", "q": "Uit welke aanpak komt het Given/When/Then-format?", "ok": "Behavior Driven Development (BDD)", "bad": ["Test Driven Development (TDD) uit Extreme Programming", "Het V-model", "Waterfall"], "why": "BDD: de AC vormen de basis voor geautomatiseerde testen."}, {"id": "q161", "ch": "2", "q": "Welk testniveau voer je uit tijdens de ontwikkeling om één functie in isolatie te testen?", "ok": "Unit test", "bad": ["Systeemtest", "Integratietest", "Acceptatietest"], "why": "Verantwoordelijke: de ontwikkelaar."}, {"id": "q162", "ch": "2", "q": "Met welke ontwikkelingsfase is de acceptatietest gekoppeld in het V-model?", "ok": "Requirements", "bad": ["Technisch ontwerp", "Componenten", "Functioneel ontwerp"], "why": "Requirements ↔ acceptatietest (FAT, GAT, PAT)."}, {"id": "q163", "ch": "2", "q": "Welke techniek voor kwaliteitsborging heeft als doel consensus, waarbij de auteur de groep door het document leidt?", "ok": "Structured walkthrough", "bad": ["Inspectie (Fagan)", "Expert review", "Collegiale review"], "why": "Expert review: externe expert met checklist. Collegiale review: informeel."}, {"id": "q164", "ch": "2", "q": "Hoe verschilt de traditionele aanpak van de agile aanpak bij het structureren van functionele requirements?", "ok": "Traditioneel met uitgebreide use cases; agile met epics en user stories in een USM en backlog.", "bad": ["Traditioneel met korte user stories op post-its; agile met een uitgebreid functioneel ontwerp vooraf.", "Traditioneel zonder documentatie; agile met een volledig lastenboek vooraf.", "Er is geen verschil: beide gebruiken enkel use case-diagrammen."], "why": "Beide beschrijven wat het systeem doet; agile is lichter, gesprekgericht en iteratief."}, {"id": "q165", "ch": "3", "q": "Welke van deze is een niet-functionele requirement volgens hoofdstuk 3?", "ok": "De verkoopster gebruikt het bestellingenoverzicht op een tablet in landscape.", "bad": ["De verkoopster kan een bestelling invoeren namens een klant die telefonisch bestelt.", "Bestellingen onder €5 worden niet geleverd.", "De klant kan een bestelling plaatsen via de website."], "why": "Platform, toestel en oriëntatie zijn randvoorwaarden. De andere zijn F, BR en F."}, {"id": "q166", "ch": "3", "q": "Case 2: de app wordt gebruikt op een iPad Mini in landscape en is onbruikbaar. Wat is de les?", "ok": "Toestelvorm en schermoriëntatie zijn NFR's die even bindend zijn als de functionaliteit.", "bad": ["Het team had meer functionele tests moeten schrijven voor alle schermen van de applicatie.", "De klant had een smartphone moeten gebruiken in plaats van een tablet.", "De app had als website in plaats van als app gebouwd moeten worden."], "why": "De UI ging uit van een smartphone in portretmodus, maar dat stond nergens."}, {"id": "q167", "ch": "3", "q": "Case 3: halverwege het project blijkt er geen API en geen identity provider te zijn. Wat is de les?", "ok": "Connectiviteit en authenticatie moet je vóór de sprint kennen, niet halverwege.", "bad": ["Het team had beter een andere programmeertaal gekozen.", "De functionele requirements waren onvolledig, omdat er schermen en knoppen ontbraken.", "De klant had een groter budget moeten voorzien voor de app."], "why": "Gevolg: budgetoverschrijding en maanden vertraging. De functionele requirements waren wel correct."}, {"id": "q168", "ch": "3", "q": "Welke vraag hoort bij kernvraag 3 (Beveiliging & Toegang)?", "ok": "Hoe worden tokens veilig bewaard op het mobiele toestel?", "bad": ["Wat gebeurt er als de verbinding wegvalt tijdens een transactie?", "Welke schermoriëntatie verwacht de gebruiker?", "Hoeveel gelijktijdige gebruikers verwachten we tijdens de piek?"], "why": "Ook: wie mag wat zien, bestaat er een identity provider, reageert de API met 401/403?"}, {"id": "q169", "ch": "3", "q": "Welke vraag hoort bij kernvraag 4 (Performantie)?", "ok": "Wat is de responstijdgrens en wat gebeurt er bij traagheid?", "bad": ["Bestaat er een Swagger- of OpenAPI-specificatie voor de koppeling?", "Moet de app deels offline werken?", "Welke rollen hebben toegang tot welke data?"], "why": "Ook: piekvolumes. Load- en stresstests volgen pas later in de opleiding."}, {"id": "q170", "ch": "3", "q": "Welke vraag hoort bij kernvraag 1 (Platform & Toestel)?", "ok": "Is er een camera, NFC-chip, GPS of barcodescanner nodig?", "bad": ["Waar zit de data: in een ERP, een clouddatabank of bij een derde partij?", "Wat is de vereiste uptime tijdens de piekuren?", "Hoe synchroniseert de app nadat de verbinding hersteld is?"], "why": "Ook: OS en minimale versie, toestelcategorie, schermoriëntatie."}, {"id": "q171", "ch": "3", "q": "Wat zegt de 'hangt ervan af'-test?"
