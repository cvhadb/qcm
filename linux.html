oadprogramma: maakt bij een bestaande naam een nieuwe kopie (.1)", "waarom": "wget is voorzichtig en nummert; curl -o schrijft gewoon over."}, {"id": "sys-38", "ch": "4", "lab": true, "q": "Labo curl: je vraagt een site op zonder https://. Welke statuscode krijg je typisch, en hoe laat je curl de doorverwijzing volgen?", "a": "301, volgen met curl -L", "w": ["301, volgen met curl -R", "404, volgen met curl -L", "404, volgen met curl -R"], "method": "301 (Moved Permanently) → curl -L", "detail": "Headers zien: `curl -I` (enkel headers) of `-i` (headers + body).", "uitleg": "301 = HTTP-statuscode Moved Permanently (doorverwijzing) · curl -L = location: volg de doorverwijzing · curl -I = toon enkel de headers, om de statuscode te zien", "waarom": "301 = Moved Permanently (naar https). -L = location: volg redirects. -R = remote time; 404 = niet gevonden."}, {"id": "sys-39", "ch": "4", "lab": true, "q": "Labo curl: download ftp://ftp.belnet.be/debian/README als README, met gebruiker anonymous en een leeg wachtwoord.", "a": "curl -u anonymous: ftp://ftp.belnet.be/debian/README -o README", "w": ["curl -u anonymous ftp://ftp.belnet.be/debian/README -o README", "curl -U anonymous: ftp://ftp.belnet.be/debian/README -o README", "curl -U anonymous ftp://ftp.belnet.be/debian/README -o README"], "method": "curl -u anonymous: ftp://ftp.belnet.be/debian/README -o README", "detail": "`-u gebruiker:wachtwoord`. Leeg wachtwoord: niets na de `:`.", "uitleg": "curl · -u anonymous: = user: gebruikersnaam anonymous, met leeg wachtwoord (niets na de :) · ftp://... = adres via het FTP-protocol · -o README = bewaar als README", "waarom": "-u gebruiker:wachtwoord; de : met niets erachter = leeg wachtwoord. Zonder : vraagt curl het wachtwoord. -U is voor een proxy-gebruiker."}, {"id": "sys-40", "ch": "4", "lab": true, "q": "Labo curl: verberg de voortgangsbalk, volg redirects en maak de JSON-uitvoer leesbaar.", "a": "curl -sL URL | jq", "w": ["curl -vL URL | jq", "curl -sL URL > jq", "curl -vL URL > jq"], "method": "curl -sL URL | jq", "detail": "`-s` = silent. `jq` zonder filter = pretty print.", "uitleg": "curl = tool om gegevens van/naar een server over te dragen · -s = silent: geen voortgangsbalk · -L = location: volg doorverwijzingen · URL = plaats voor het echte adres · | jq = stuur de JSON naar jq, dat ze leesbaar (pretty print) afdrukt", "waarom": "-s = silent, -L = volg redirects, | jq = mooi opmaken. ✗ -v = juist extra uitleg · > jq schrijft naar een bestand met de naam jq."}, {"id": "sys-41", "ch": "4", "lab": true, "q": "Labo curl: welke -o geeft een bestandsnaam met een tijdstempel, zoals fiets-20261110-142501.json?", "a": "-o \"fiets-$(date +%Y%m%d-%H%M%S).json\"", "w": ["-o 'fiets-$(date +%Y%m%d-%H%M%S).json'", "-o \"fiets-${date +%Y%m%d-%H%M%S}.json\"", "-o 'fiets-${date +%Y%m%d-%H%M%S}.json'"], "method": "curl -s \"URL\" -o \"fietsenstallingen-$(date +%Y%m%d-%H%M%S).json\"", "detail": "⚠ Quotes rond een URL met `&`, anders zet Bash het commando op de achtergrond.", "uitleg": "curl · -s = silent: geen voortgangsbalk · \"URL\" = adres (tussen quotes, nodig bij &) · -o = output: bestandsnaam · $(date +%Y%m%d-%H%M%S) = command substitution: datum JJJJMMDD-UUmmSS", "waarom": "$( ) = command substitution, en die werkt enkel tussen dubbele quotes (of zonder quotes). Tussen enkele quotes blijft alles letterlijk; ${ } is voor variabelen."}, {"id": "sys-42", "ch": "4", "lab": true, "q": "Labo SSH: toon de fingerprint van je publieke sleutel.", "a": "ssh-keygen -lf ~/.ssh/id_ed25519.pub", "w": ["ssh-keygen -yf ~/.ssh/id_ed25519.pub", "ssh-add -l ~/.ssh/id_ed25519.pub", "ssh-keyscan ~/.ssh/id_ed25519.pub"], "method": "ssh-keygen -lf ~/.ssh/id_ed25519.pub", "detail": "", "uitleg": "ssh-keygen = SSH-sleutelbeheer · -l = list: toon de fingerprint · -f = file: van dit sleutelbestand · ~/.ssh/id_ed25519.pub = je publieke sleutel", "waarom": "-l = toon fingerprint, -f = van dit bestand. ✗ -y leidt een publieke sleutel af uit een privésleutel · ssh-add -l toont de sleutels in de agent · ssh-keyscan haalt sleutels van een server."}, {"id": "sys-43", "ch": "4", "lab": true, "q": "Labo SSH: welke permissies moeten ~/.ssh, je private sleutel en je publieke sleutel hebben?", "a": "~/.ssh 700 · private 600 · .pub 644", "w": ["~/.ssh 700 · private 644 · .pub 600", "~/.ssh 755 · private 600 · .pub 644", "~/.ssh 755 · private 644 · .pub 600"], "method": "~/.ssh 700 · private sleutel 600 · .pub 644 · authorized_keys 600", "detail": "Te ruime rechten op de private sleutel: ssh weigert ze te gebruiken.", "waarom": "De map en de private sleutel enkel voor jou; de publieke sleutel mag iedereen lezen. Is de private sleutel te open, dan weigert ssh hem."}, {"id": "sys-44", "ch": "4", "lab": true, "q": "Labo SSH: maak een extra RSA-sleutel met de bestandsnaam ~/.ssh/id_rsa_lab.", "a": "ssh-keygen -t rsa -f ~/.ssh/id_rsa_lab", "w": ["ssh-keygen -t rsa -C ~/.ssh/id_rsa_lab", "ssh-keygen -b rsa -f ~/.ssh/id_rsa_lab", "ssh-keygen -b rsa -C ~/.ssh/id_rsa_lab"], "method": "ssh-keygen -t rsa -f ~/.ssh/id_rsa_lab", "detail": "⚠ Gewoon Enter bij de naam kan je bestaande sleutel overschrijven → toegang tot GitHub kwijt.", "uitleg": "ssh-keygen = maak een sleutelpaar · -t rsa = type: RSA · -f ~/.ssh/id_rsa_lab = file: bestandsnaam van de nieuwe sleutel (de .pub krijgt dezelfde naam)", "waarom": "-t = type, -f = bestandsnaam. ✗ -C = commentaar (bv. je e-mail) · -b = aantal bits (bv. 4096), geen type."}, {"id": "sys-45", "ch": "4", "lab": true, "q": "Labo SSH: wat zet je in ~/.ssh/config om met `ssh S1` in te loggen op 157.193.215.170 als USER?", "a": "Host S1 / HostName 157.193.215.170 / User USER", "w": ["Host 157.193.215.170 / HostName S1 / User USER", "Host S1 / Address 157.193.215.170 / User USER", "Host 157.193.215.170 / Address S1 / User USER"], "method": "In ~/.ssh/config:\nHost S1\n    HostName 157.193.215.170\n    User USER", "detail": "", "uitleg": "Host S1 = de korte naam die je typt · HostName = het echte adres · User = de gebruikersnaam. Daarna volstaat: ssh S1", "waarom": "Host = de bijnaam die je typt; HostName = het echte adres. Een sleutelwoord Address bestaat niet."}, {"id": "sys-46", "ch": "4", "lab": true, "q": "Labo SSH: hoe log je van S1 verder in op S2 zonder wachtwoord, zónder je private sleutel op S1 te zetten?", "a": "met agent forwarding: ssh -A naar S1", "w": ["met X11 forwarding: ssh -X naar S1", "door je private sleutel naar S1 te kopiëren met scp", "door ssh-copy-id uit te voeren op S1"], "method": "Je private sleutel staat niet op S1\nMet agent forwarding (ssh -A of ForwardAgent yes) niet", "detail": "Lokaal: `ssh-add KEYFILE`, controle: `ssh-add -L`.", "uitleg": "ssh -A = agent forwarding: je lokale ssh-agent wordt doorgegeven aan S1, zodat S1 je sleutel kan gebruiken zonder dat de private sleutel op S1 staat · ForwardAgent yes = hetzelfde in ~/.ssh/config", "waarom": "-A stuurt verzoeken van S1 terug naar de ssh-agent op je laptop. ✗ -X is voor grafische vensters · de sleutel kopiëren is net wat je niet wil · ssh-copy-id op S1 vereist een sleutel op S1."}, {"id": "sys-47", "ch": "4", "lab": false, "q": "Voeg op Ubuntu een extra softwarebron (bv. een PPA) toe aan apt.", "a": "sudo add-apt-repository BRON", "w": ["sudo apt add-repository BRON", "sudo apt-get install BRON", "sudo dpkg --add-architecture BRON"], "method": "sudo add-apt-repository BRON", "detail": "Daarna `sudo apt update`. Bronnen staan in /etc/apt/sources.list(.d).", "uitleg": "sudo = als root · add-apt-repository = voeg een extra softwarebron (bv. een PPA) toe · BRON = de bron. Daarna: sudo apt update", "waarom": "add-apt-repository (pakket software-properties-common) voegt de bron toe in /etc/apt/sources.list.d/. ✗ apt kent geen add-repository · apt-get install installeert een pakket · dpkg --add-architecture voegt een processorarchitectuur toe (bv. i386)."}, {"id": "sys-48", "ch": "4", "lab": false, "q": "Zet de systeemtaal (locale) blijvend op en_US.UTF-8 (systemd).", "a": "sudo localectl set-locale en_US.UTF-8", "w": ["sudo localectl set-keymap en_US.UTF-8", "export LANG=en_US.UTF-8", "sudo locale -a en_US.UTF-8"], "method": "sudo localectl set-locale en_US.UTF-8", "detail": "De locale bepaalt o.a. wat [a-z] in globbing matcht (cursus: $LANG en vierkante haken).", "uitleg": "sudo = als root · localectl = beheer taal- en toetsenbordinstellingen · set-locale = stel de systeemlocale in · en_US.UTF-8 = taal_LAND.tekenset", "waarom": "localectl set-locale schrijft de systeembrede LANG (Debian: /etc/default/locale). ✗ set-keymap gaat over het toetsenbord · export geldt enkel voor je huidige shell · locale -a toont enkel de beschikbare locales."}, {"id": "sys-52", "ch": "4", "lab": false, "q": "VirtualBox: welk commando start de VM LinuxGUI zonder een venster te openen?", "a": "VBoxManage startvm \"LinuxGUI\" --type headless", "w": ["VBoxManage startvm \"LinuxGUI\" --type gui", "VBoxManage controlvm \"LinuxGUI\" --type headless", "VBoxManage controlvm \"LinuxGUI\" --type gui"], "method": "VBoxManage startvm \"LinuxGUI\" --type headless", "detail": "", "uitleg": "", "waarom": "startvm start een VM; --type headless = op de achtergrond. controlvm bestuurt een VM die al draait (poweroff, savestate, …)."}, {"id": "sys-53", "ch": "4", "lab": false, "q": "VirtualBox: wat is het verschil tussen `VBoxManage controlvm LinuxGUI acpipowerbutton` en `… poweroff`?", "a": "acpipowerbutton vraagt de gast om netjes af te sluiten; poweroff onderbreekt de stroom", "w": ["acpipowerbutton onderbreekt de stroom; poweroff vraagt de gast om netjes af te sluiten", "acpipowerbutton bewaart de toestand op schijf; poweroff vraagt de gast om netjes af te sluiten", "acpipowerbutton vraagt de gast om netjes af te sluiten; poweroff bewaart de toestand op schijf"], "method": "acpipowerbutton vraagt de gast om netjes af te sluiten; poweroff onderbreekt de stroom", "detail": "", "uitleg": "", "waarom": "acpipowerbutton = virtueel op de aan/uit-knop drukken. poweroff = stekker eruit. De toestand bewaren doet savestate."}, {"id": "sys-54", "ch": "4", "lab": false, "q": "VirtualBox: welke VM's draaien er op dit moment?", "a": "VBoxManage list runningvms", "w": ["VBoxManage list vms", "VBoxManage showvminfo runningvms", "VBoxManage showvminfo vms"], "method": "VBoxManage list runningvms", "detail": "", "uitleg": "", "waarom": "list runningvms = enkel de draaiende. ✗ list vms = álle geregistreerde VM's · showvminfo verwacht de naam van één VM."}, {"id": "sys-55", "ch": "4", "lab": false, "q": "Maak een nieuw SSH-sleutelpaar van het type ed25519 voor GitHub, met je e-mail als commentaar.", "a": "ssh-keygen -t ed25519 -C \"jij@student.hogent.be\"", "w": ["ssh-keygen -t ed25519 -f \"jij@student.hogent.be\"", "ssh-keygen -b ed25519 -C \"jij@student.hogent.be\"", "ssh-keygen -b ed25519 -f \"jij@student.hogent.be\""], "method": "ssh-keygen -t ed25519 -C \"jij@student.hogent.be\"", "detail": "", "uitleg": "", "waarom": "-t = type, -C = commentaar. ✗ -f = bestandsnaam (je sleutel zou zo heten) · -b = aantal bits."}, {"id": "sys-56", "ch": "4", "lab": false, "q": "Welk bestand plak je in GitHub onder Settings > SSH and GPG keys?", "a": "~/.ssh/id_ed25519.pub", "w": ["~/.ssh/id_ed25519", "~/.ssh/known_hosts", "~/.ssh/authorized_keys"], "method": "~/.ssh/id_ed25519.pub", "detail": "", "uitleg": "", "waarom": "Enkel de publieke sleutel (.pub). De private sleutel (zonder .pub) geef je nooit weg."}, {"id": "shell-01", "ch": "5", "lab": false, "q": "Schrijf de uitvoer van ls naar lijst.txt; een bestaand lijst.txt mag overschreven worden.", "a": "ls > lijst.txt", "w": ["ls >> lijst.txt", "ls < lijst.txt", "ls | lijst.txt"], "method": "ls > lijst.txt", "detail": "⚠ `>` maakt het bestand eerst leeg.", "uitleg": "ls = list · > = stuur stdout naar een bestand en overschrijf het · lijst.txt = het bestand", "waarom": "> = overschrijven. ✗ >> voegt toe · < geeft het bestand als invoer · | stuurt naar een commándo, en lijst.txt is geen commando."}, {"id": "shell-02", "ch": "5", "lab": false, "q": "Voeg de regel 'tekst' toe aan het einde van bestand, zonder de bestaande inhoud te wissen.", "a": "echo 'tekst' >> bestand", "w": ["echo 'tekst' > bestand", "echo 'tekst' << bestand", "echo 'tekst' &> bestand"], "method": "echo 'tekst' >> bestand", "detail": "`>>` = append. ⚠ `>` op ~/.bashrc wist alles!", "uitleg": "echo = druk tekst af · 'tekst' = de tekst · >> = append: voeg toe aan het einde van het bestand · bestand = het bestand", "waarom": ">> = append. ✗ > en &> overschrijven · << start een here-document."}, {"id": "shell-03", "ch": "5", "lab": false, "q": "Stuur enkel de foutmeldingen (stderr) van een commando naar fouten.txt; de gewone uitvoer blijft op het scherm.", "a": "commando 2> fouten.txt", "w": ["commando 1> fouten.txt", "commando > fouten.txt 2>&1", "commando &> fouten.txt"], "method": "commando 2> fouten.txt", "detail": "0 = stdin, 1 = stdout, 2 = stderr.", "uitleg": "commando = plaats voor het echte commando · 2> = stuur stderr (kanaal 2, de foutmeldingen) naar een bestand · fouten.txt = het bestand", "waarom": "2 = stderr. ✗ 1> = stdout · de andere twee sturen stdout én stderr naar het bestand."}, {"id": "shell-04", "ch": "5", "lab": false, "q": "Stuur zowel stdout als stderr van een commando naar log.txt.", "a": "commando > log.txt 2>&1", "w": ["commando 2>&1 > log.txt", "commando > log.txt 1>&2", "commando 2>&1 | log.txt"], "method": "commando > log.txt 2>&1   (of &> log.txt)", "detail": "⚠ Volgorde telt: `2>&1 > log` stuurt stderr nog naar het scherm.", "uitleg": "commando = het echte commando · > log.txt = stdout naar log.txt · 2>&1 = stuur stderr (2) naar dezelfde plek als stdout (1) · &> log.txt = korte vorm: beide naar log.txt", "waarom": "Volgorde telt: eerst stdout naar het bestand, dán stderr naar 'waar stdout nu heen gaat'. Bij `2>&1 > log.txt` gaat stderr nog naar het scherm."}, {"id": "shell-05", "ch": "5", "lab": false, "q": "Gooi alle uitvoer van een commando weg, zowel stdout als stderr.", "a": "commando > /dev/null 2>&1", "w": ["commando 2>&1 > /dev/null", "commando > /dev/zero 2>&1", "commando 2>&1 > /dev/zero"], "method": "commando > /dev/null 2>&1", "detail": "/dev/null = het zwarte gat.", "uitleg": "commando = het echte commando · > /dev/null = stdout naar het 'zwarte gat' · 2>&1 = stderr naar dezelfde plek · &> /dev/null = korte vorm", "waarom": "/dev/null slikt alles. Met `2>&1 > /dev/null` blijft stderr op het scherm. /dev/zero is een bron van nullen, bedoeld om uit te lezen."}, {"id": "shell-06", "ch": "5", "lab": false, "q": "Druk in een script de foutmelding 'Fout!' af op stderr in plaats van stdout.", "a": "echo 'Fout!' >&2", "w": ["echo 'Fout!' 2>&1", "echo 'Fout!' > 2", "echo 'Fout!' 2> /dev/null"], "method": "echo 'Fout!' >&2", "detail": "De opgave eist: fouten op stderr, gevraagde info op stdout.", "uitleg": "echo 'Fout!' = druk de tekst af · >&2 = stuur deze uitvoer naar stderr (kanaal 2) i.p.v. stdout", "waarom": ">&2 = stuur stdout naar file descriptor 2. ✗ 2>&1 stuurt stderr naar stdout (de tekst blijft op stdout) · > 2 schrijft naar een bestand met de naam 2 · 2>/dev/null verandert niets aan stdout."}, {"id": "shell-07", "ch": "5", "lab": false, "q": "Wat doet een pipe | tussen twee commando's?", "a": "de stdout van links wordt de stdin van rechts", "w": ["de stdin van links wordt de stdout van rechts", "de stderr van links wordt de stdin van rechts", "de stdout van rechts wordt de stdin van links"], "method": "stdout van links wordt stdin van rechts", "detail": "Bv. `ls | wc -l` telt het aantal bestanden.", "waarom": "Uitvoer stroomt van links naar rechts. stderr gaat standaard níet door de pipe."}, {"id": "shell-08", "ch": "5", "lab": false, "q": "Toon de uitvoer van een commando op het scherm én bewaar ze tegelijk in bestand.", "a": "commando | tee bestand", "w": ["commando | cat bestand", "commando > bestand | cat", "commando >| bestand"], "method": "commando | tee bestand", "detail": "`tee -a` = toevoegen.", "uitleg": "commando = het echte commando · | = pipe · tee = schrijf de invoer naar het scherm én naar een bestand · bestand = het bestand (-a = toevoegen)", "waarom": "tee splitst de stroom: naar het bestand én verder naar stdout. ✗ cat bestand toont het bestand · na > bestand blijft er niets over voor de pipe · >| overschrijft ook met noclobber, maar toont niets."}, {"id": "shell-09", "ch": "5", "lab": false, "q": "Wat betekent `cmd1 || cmd2`?", "a": "cmd2 wordt enkel uitgevoerd als cmd1 faalt", "w": ["cmd2 wordt enkel uitgevoerd als cmd1 lukt", "cmd2 wordt altijd uitgevoerd, na cmd1", "cmd1 en cmd2 lopen tegelijk"], "method": "&& : cmd2 enkel als cmd1 lukt\n|| : cmd2 enkel als cmd1 faalt", "detail": "`;` voert altijd beide uit.", "waarom": "|| = OF: bij een fout van cmd1 doe cmd2. && = enkel bij succes; ; = altijd na elkaar; & = op de achtergrond."}, {"id": "shell-10", "ch": "5", "lab": false, "q": "Hoe zie je of het vorige commando gelukt is (0 = gelukt)?", "a": "echo $?", "w": ["echo $!", "echo $$", "echo $#"], "method": "echo $?", "detail": "0 = gelukt, alles anders = fout.", "uitleg": "echo = druk af · $? = exit-status van het vorige commando: 0 = gelukt, alles anders = fout", "waarom": "$? = exit-status van het laatste commando. $! = PID van de laatste achtergrondjob, $$ = PID van de shell, $# = aantal argumenten."}, {"id": "shell-11", "ch": "5", "lab": false, "q": "Start een commando op de achtergrond, zodat je meteen verder kan typen.", "a": "commando &", "w": ["commando &&", "commando ; bg", "bg commando"], "method": "commando &", "detail": "`jobs` toont ze, `fg` haalt terug naar voren.", "uitleg": "commando = het echte commando · & = start het op de achtergrond, zodat je prompt meteen vrij is", "waarom": "& op het einde. ✗ && wacht op een volgend commando · bg hervat een gepauzeerde job, het start geen nieuw commando."}, {"id": "shell-12", "ch": "5", "lab": false, "q": "Een programma draait op de voorgrond. Pauzeer het en laat het daarna verder lopen op de achtergrond.", "a": "Ctrl+Z, daarna bg", "w": ["Ctrl+Z, daarna fg", "Ctrl+C, daarna bg", "Ctrl+C, daarna fg"], "method": "Ctrl+Z, daarna bg", "detail": "Ctrl+C stopt het programma volledig.", "uitleg": "Ctrl+Z = pauzeer (suspend) het lopende programma · bg = background: laat het verder lopen op de achtergrond · fg = foreground: terug naar voren · Ctrl+C = stop het programma", "waarom": "Ctrl+Z pauzeert (stopt tijdelijk), bg laat verder lopen op de achtergrond. ✗ fg haalt het terug naar de voorgrond · Ctrl+C beëindigt het programma."}, {"id": "shell-13", "ch": "5", "lab": false, "q": "Welke toetscombinatie doorzoekt je history naar een eerder getypt commando?", "a": "Ctrl+R", "w": ["Ctrl+F", "Ctrl+L", "Ctrl+S"], "method": "Ctrl+R en typ een stukje", "detail": "Nog eens Ctrl+R = vorige match. `history` toont alles.", "uitleg": "Ctrl+R = reverse search: zoek achteruit in je history; typ een stukje van het commando, nog eens Ctrl+R = vorige match, Enter = uitvoeren", "waarom": "Ctrl+R = reverse search. ✗ Ctrl+F = cursor één teken vooruit · Ctrl+L = scherm leegmaken · Ctrl+S = terminal bevriezen (Ctrl+Q ontdooit)."}, {"id": "shell-14", "ch": "5", "lab": false, "q": "Je vorige commando faalde wegens rechten. Herhaal het, nu met sudo ervoor.", "a": "sudo !!", "w": ["sudo !$", "sudo $_", "sudo $?"], "method": "sudo !!", "detail": "`!!` = vorige commando.", "uitleg": "sudo = als root · !! = history-expansie: het volledige vorige commando", "waarom": "!! = het volledige vorige commando. ✗ !$ en $_ = enkel het laatste argument · $? = de exit-status."}, {"id": "shell-15", "ch": "5", "lab": false, "q": "Met welk teken hergebruik je het laatste argument van het vorige commando (bv. na `mkdir nieuwe_map` → `cd …`)?", "a": "!$", "w": ["!!", "$!", "!#"], "method": "!$   of   Alt+.", "detail": "Bv. `mkdir nieuwmap` → `cd !$`.", "uitleg": "!$ = history-expansie: het laatste argument van het vorige commando (sneltoets: Alt+.)", "waarom": "!$ = laatste argument. ✗ !! = het hele vorige commando · $! = PID van de laatste achtergrondjob · !# = de huidige regel tot nu toe."}, {"id": "shell-16", "ch": "5", "lab": false, "q": "Welke toetscombinatie wist alles vóór de cursor op de opdrachtregel?", "a": "Ctrl+U", "w": ["Ctrl+K", "Ctrl+W", "Ctrl+L"], "method": "Ctrl+A · Ctrl+E · Ctrl+U · Ctrl+L", "detail": "Tab = aanvullen; 2× Tab = alle opties tonen.", "uitleg": "Ctrl+A = naar het begin van de regel · Ctrl+E = naar het einde (end) · Ctrl+U = wis alles vóór de cursor · Ctrl+L = maak het scherm leeg", "waarom": "Ctrl+U = tot het begin. ✗ Ctrl+K = vanaf de cursor tot het einde · Ctrl+W = één woord terug · Ctrl+L = scherm leegmaken."}, {"id": "shell-17", "ch": "5", "lab": false, "q": "Maak een snelkoppeling ll die `ls -lh` uitvoert.", "a": "alias ll='ls -lh'", "w": ["alias ll = 'ls -lh'", "alias 'ls -lh'=ll", "export ll='ls -lh'"], "method": "alias ll='ls -lh'", "detail": "Permanent: toevoegen aan ~/.bashrc, daarna `source ~/.bashrc`.", "uitleg": "alias = maak een snelkoppeling · ll = de nieuwe naam · ='ls -lh' = het commando dat uitgevoerd wordt (geen spaties rond =). Permanent: in ~/.bashrc", "waarom": "alias NAAM='COMMANDO', zonder spaties rond =. ✗ export maakt een omgevingsvariabele, geen commando."}, {"id": "shell-18", "ch": "5", "lab": false, "q": "Hoe controleer je of cd een builtin is, een alias, een functie of een programma?", "a": "type cd", "w": ["which cd", "whereis cd", "file cd"], "method": "type cd   →   builtin", "detail": "`which` vindt enkel externe programma's in `$PATH`.", "uitleg": "type = toon wat een naam is: builtin, alias, functie of extern programma (met pad) · cd = de naam", "waarom": "type kent álle soorten. ✗ which en whereis zoeken enkel programma's op schijf · file zegt welk soort bestand iets is."}, {"id": "shell-19", "ch": "5", "lab": false, "q": "$HOME is /home/hogent. Wat drukken `echo '$HOME'` en `echo \"$HOME\"` af?", "a": "'$HOME' → $HOME · \"$HOME\" → /home/hogent", "w": ["'$HOME' → /home/hogent · \"$HOME\" → $HOME", "beide → /home/hogent", "beide → $HOME"], "method": "Enkel: letterlijk $HOME\nDubbel: /home/hogent", "detail": "Enkele quotes = geen expansie. ⚠ `~` wordt binnen quotes nooit uitgewerkt.", "waarom": "Enkele quotes: alles letterlijk. Dubbele quotes: variabelen worden ingevuld."}, {"id": "shell-20", "ch": "5", "lab": false, "q": "nano: hoe sla je op en sluit je daarna af?", "a": "Ctrl+O, Enter, Ctrl+X", "w": ["Ctrl+S, Enter, Ctrl+Q", "Ctrl+X, Enter, Ctrl+O", "Ctrl+W, Enter, Ctrl+Q"], "method": "Ctrl+O · Ctrl+X · Ctrl+W · Ctrl+_", "detail": "Ctrl+K knipt een regel, Ctrl+U plakt.", "uitleg": "Ctrl+O = write Out: opslaan · Ctrl+X = exit: afsluiten · Ctrl+W = where is: zoeken · Ctrl+_ = ga naar regel (en kolom)", "waarom": "Ctrl+O = write Out (Enter bevestigt de naam), Ctrl+X = exit. Ctrl+W = zoeken in nano."}, {"id": "shell-21", "ch": "5", "lab": false, "q": "Hoe voorkom je dat > per ongeluk een bestaand bestand overschrijft?", "a": "set -o noclobber", "w": ["set -o nounset", "set -o noglob", "set -o ignoreeof"], "method": "set -o noclobber", "detail": "Toch overschrijven: `>|`.", "uitleg": "set -o = zet een shell-optie aan (set +o = uit) · noclobber = > mag geen bestaand bestand overschrijven (forceren met >|)", "waarom": "noclobber: > weigert bestaande bestanden (>| forceert het toch). ✗ nounset = fout bij onbestaande variabelen · noglob = geen * expansie · ignoreeof = Ctrl+D sluit de shell niet."}, {"id": "shell-22", "ch": "5", "lab": false, "q": "Welke redirectie geeft één string (bv. de inhoud van een variabele) als stdin aan een commando?", "a": "<<< (here string)", "w": ["<< (here document)", "< (invoer uit een bestand)", "<& (kopie van een file descriptor)"], "method": "< bestand als stdin\n<< here document (meerdere regels tot de eindmarker)\n<<< here string (één string)", "detail": "Bv. `grep -o '[0-9]*' <<< \"${line}\"`.", "waarom": "`bc <<< \"2+3\"`. << leest meerdere regels tot een eindwoord, < leest uit een bestand."}, {"id": "shell-23", "ch": "5", "lab": false, "q": "Maak het bestand log.txt in één keer leeg, zonder het te verwijderen.", "a": "> log.txt", "w": ["< log.txt", ">> log.txt", "rm log.txt"], "method": "> bestand", "detail": "Quick file clear.", "uitleg": "> bestand = redirectie zonder commando: maakt het bestand leeg (of maakt het aan)", "waarom": "Een lege redirectie met > maakt het bestand 0 bytes. ✗ < leest enkel · >> voegt niets toe · rm verwijdert het."}, {"id": "shell-24", "ch": "5", "lab": false, "q": "Wat doet een \\ helemaal op het einde van een regel in een script?", "a": "het commando loopt verder op de volgende regel", "w": ["de rest van de regel wordt als commentaar gezien", "het commando wordt op de achtergrond gestart", "de volgende regel wordt door Bash overgeslagen"], "method": "Het commando loopt verder op de volgende regel", "detail": "⚠ Er mag niets (ook geen spatie) na de \\ staan.", "waarom": "De backslash maskeert de Enter (regeleinde), zodat Bash de volgende regel erbij neemt. Let op: geen spatie ná de \\."}, {"id": "shell-25", "ch": "5", "lab": false, "q": "Welke file descriptor-nummers horen bij stdin, stdout en stderr (in die volgorde)?", "a": "0, 1, 2", "w": ["1, 2, 3", "0, 2, 1", "1, 0, 2"], "method": "0, 1, 2", "detail": "", "uitleg": "", "waarom": "0 = stdin, 1 = stdout, 2 = stderr. Daarom 2> voor fouten en >&2 om naar stderr te schrijven."}, {"id": "git-01", "ch": "6", "lab": false, "q": "Maak van de huidige map een nieuwe, lege Git-repository.", "a": "git init", "w": ["git clone .", "git add .", "git status"], "method": "git init", "detail": "Er verschijnt een verborgen map `.git`. Zie je ze niet? `ls -la`.", "uitleg": "git = versiebeheer · init = maak van de huidige map een nieuwe repository (verborgen map .git)", "waarom": "git init maakt de map .git aan. ✗ clone kopieert een bestaande repo · add zet bestanden klaar (faalt zonder repo) · status toont de toestand."}, {"id": "git-02", "ch": "6", "lab": false, "q": "Stel voor álle repo's op deze machine je naam in voor Git-commits.", "a": "git config --global user.name \"Céline\"", "w": ["git config --local user.name \"Céline\"", "git config --global user.email \"Céline\"", "git config --local user.email \"Céline\""], "method": "git config --global user.name 'Céline'\ngit config --global user.email ...", "detail": "Dit komt in `~/.gitconfig`. Editor kiezen: `git config --global core.editor nano`.", "uitleg": "git config = instellingen · --global = voor al je repositories (in ~/.gitconfig) · user.name = je naam · user.email = je e-mailadres", "waarom": "--global = voor je gebruiker op deze machine (~/.gitconfig); --local = enkel deze repo. user.email is voor je e-mailadres."}, {"id": "git-03", "ch": "6", "lab": false, "q": "In welke volgorde zet je een gewijzigd bestand op GitHub?", "a": "add → commit → push", "w": ["commit → add → push", "add → push → commit", "commit → push → add"], "method": "git add bestand → git commit -m 'boodschap' → git push", "detail": "add = klaarzetten (staging), commit = lokaal bewaren, push = naar de remote.", "uitleg": "git add bestand = zet de wijziging klaar (staging) · git commit -m 'boodschap' = bewaar een momentopname lokaal, -m = message · git push = stuur de commits naar GitHub", "waarom": "add = klaarzetten (staging), commit = lokaal vastleggen, push = naar GitHub sturen."}, {"id": "git-04", "ch": "6", "lab": false, "q": "Welk Git-commando toont welke bestanden gewijzigd zijn, wat klaarstaat voor de commit en wat nog niet gevolgd wordt?", "a": "git status", "w": ["git log", "git show", "git diff"], "method": "git status", "detail": "Je meest gebruikte Git-commando: altijd eerst kijken.", "uitleg": "git status = toon welke bestanden gewijzigd zijn, wat klaarstaat voor de volgende commit (staged) en wat niet gevolgd wordt", "waarom": "status = toestand van de werkmap. ✗ log = historiek · show = één commit in detail · diff = de gewijzigde regels zelf."}, {"id": "git-05", "ch": "6", "lab": false, "q": "Toon de Git-historiek compact: één regel per commit.", "a": "git log --oneline", "w": ["git log -1", "git status --short", "git show --oneline"], "method": "git log --oneline", "detail": "Syllabus: `git log --pretty=oneline`.", "uitleg": "git log = toon de historiek · --oneline = één regel per commit: korte hash + boodschap", "waarom": "--oneline = korte hash + titel. ✗ log -1 = enkel de laatste commit (volledig) · status --short = korte toestand, geen historiek · show toont één commit met diff."}, {"id": "git-06", "ch": "6", "lab": false, "q": "Hernoem oud.sh naar nieuw.sh, zodat Git de hernoeming meteen klaarzet.", "a": "git mv oud.sh nieuw.sh", "w": ["mv oud.sh nieuw.sh", "git mv nieuw.sh oud.sh", "mv nieuw.sh oud.sh"], "method": "git mv oud.sh nieuw.sh", "detail": "Daarna nog committen.", "uitleg": "git mv = hernoem of verplaats een bestand en registreer het meteen in Git · oud.sh = oude naam · nieuw.sh = nieuwe naam", "waarom": "git mv OUD NIEUW = mv + git add van beide. Met gewone mv ziet Git eerst een verwijderd en een nieuw bestand."}, {"id": "git-07", "ch": "6", "lab": false, "q": "Maak een nieuwe branch newheader en schakel er meteen naar over.", "a": "git checkout -b newheader", "w": ["git checkout newheader", "git branch newheader", "git branch -d newheader"], "method": "git checkout -b newheader", "detail": "Alle branches tonen: `git branch`.", "uitleg": "git checkout = wissel van branch · -b newheader = maak eerst een nieuwe branch met deze naam", "waarom": "checkout -b = maak én wissel (of: git switch -c). ✗ checkout zonder -b faalt als de branch niet bestaat · git branch maakt hem enkel aan · -d verwijdert."}, {"id": "git-08", "ch": "6", "lab": false, "q": "newheader is samengevoegd in main. Verwijder de lokale branch newheader.", "a": "git branch -d newheader", "w": ["git branch -m newheader", "git checkout -d newheader", "git checkout -m newheader"], "method": "git merge newheader\ngit branch -d newheader", "detail": "Eerst terug naar de hoofdbranch (`git checkout main` / `master`).", "uitleg": "git merge newheader = voeg de wijzigingen van branch newheader samen met de huidige branch · git branch -d = delete: verwijder een (samengevoegde) branch", "waarom": "branch -d = delete (enkel als hij samengevoegd is; -D forceert). ✗ branch -m = hernoemen · checkout kent geen -d · checkout -m wisselt naar de branch en neemt je wijzigingen mee."}, {"id": "git-09", "ch": "6", "lab": false, "q": "Kopieer een bestaande repo van GitHub naar je VM (de map bestaat nog niet).", "a": "git clone git@github.com:user/repo.git", "w": ["git pull git@github.com:user/repo.git", "git init git@github.com:user/repo.git", "git fetch git@github.com:user/repo.git"], "method": "git clone git@github.com:user/repo.git", "detail": "SSH-URL begint met `git@github.com:`. Je publieke sleutel moet op GitHub staan.", "uitleg": "git clone = kopieer een volledige repository · git@github.com:user/repo.git = SSH-adres (gebruiker/repository)", "waarom": "clone maakt een nieuwe map met de volledige repo. ✗ pull en fetch werken binnen een bestaande repo · init maakt een lege repo."}, {"id": "git-10", "ch": "6", "lab": false, "q": "Haal de nieuwe commits van GitHub binnen én voeg ze samen met je huidige branch.", "a": "git pull", "w": ["git push", "git fetch", "git clone"], "method": "git pull", "detail": "= fetch + merge.", "uitleg": "git pull = haal de nieuwste commits van de remote (GitHub) en voeg ze samen (= fetch + merge)", "waarom": "pull = fetch + merge. ✗ fetch downloadt enkel, zonder samen te voegen · push stuurt naar GitHub · clone maakt een nieuwe kopie."}, {"id": "git-11", "ch": "6", "lab": false, "q": "Hoe test je of GitHub je SSH-sleutel aanvaardt?", "a": "ssh -T git@github.com", "w": ["ssh -T github.com", "ssh-keyscan github.com", "ssh-copy-id git@github.com"], "method": "ssh -T git@github.com", "detail": "Verwacht: `Hi cvhadb! You've successfully authenticated`.", "uitleg": "ssh = verbinding · -T = geen terminal aanvragen (GitHub geeft geen shell) · git@github.com = gebruiker git op GitHub. Verwacht: 'Hi cvhadb!'", "waarom": "Je logt in als gebruiker git; -T = vraag geen terminal (GitHub geeft toch geen shell) en antwoordt 'Hi …! You've successfully authenticated'. ✗ zonder git@ gebruikt ssh jouw eigen gebruikersnaam · ssh-keyscan haalt enkel de host-sleutel van GitHub op · ssh-copy-id probeert je sleutel te installeren (dat doe je via de website)."}, {"id": "git-12", "ch": "6", "lab": false, "q": "Je private sleutel heeft een wachtwoord. Hoe typ je dat maar één keer per sessie?", "a": "eval $(ssh-agent) en dan ssh-add", "w": ["ssh-add en dan eval $(ssh-agent)", "eval $(ssh-add) en dan ssh-agent", "ssh-agent en dan eval $(ssh-add)"], "method": "eval $(ssh-agent)  en dan  ssh-add", "detail": "Jouw veilige versie: `ssh-add -L >/dev/null 2>&1 || { eval $(ssh-agent); ssh-add; }`\n⚠ Apart typen: vraagt je passphrase.", "uitleg": "ssh-agent = programma dat ontgrendelde sleutels bewaart · eval $( ) = voer de uitvoer ervan uit, zodat je shell de agent kent · ssh-add = voeg je sleutel toe (vraagt één keer de passphrase)", "waarom": "Eerst de agent starten (eval zet zijn variabelen in je shell), dan de sleutel laden met ssh-add."}, {"id": "git-13", "ch": "6", "lab": false, "q": "Pakketbeheer: wat is een dependency (afhankelijkheid)?", "a": "een pakket dat een ander pakket nodig heeft om te werken", "w": ["een bron (repository) waaruit apt de pakketten haalt", "een nieuwere versie die een bestaand pakket vervangt", "de lijst met alle pakketten die geïnstalleerd zijn"], "method": "Repository = bron met pakketten\nDependency = pakket dat een ander pakket nodig heeft", "detail": "apt/dnf installeren dependencies automatisch mee.", "waarom": "Voorbeeld: apache2 heeft apache2-bin nodig. apt installeert dependencies automatisch, dpkg niet."}, {"id": "git-14", "ch": "6", "lab": false, "q": "Welk pakketformaat en welke tools gebruikt Debian?", "a": ".deb, met dpkg en apt", "w": [".rpm, met rpm en dnf", ".deb, met rpm en dnf", ".rpm, met dpkg en apt"], "method": "Debian: .deb (dpkg, apt)\nFedora/EL: .rpm (rpm, dnf)", "detail": "", "waarom": "Debian/Ubuntu: .deb + dpkg/apt. Fedora/Enterprise Linux: .rpm + rpm/dnf."}, {"id": "git-15", "ch": "6", "lab": false, "q": "In welk bestand staan (klassiek) de repositories waaruit apt pakketten haalt?", "a": "/etc/apt/sources.list", "w": ["/etc/apt/apt.conf", "/var/lib/apt/lists", "/var/cache/apt/archives"], "method": "/etc/apt/sources.list", "detail": "(en `/etc/apt/sources.list.d/`)", "waarom": "sources.list (+ /etc/apt/sources.list.d/). ✗ apt.conf = instellingen van apt · /var/lib/apt/lists = de gedownloade lijsten · /var/cache/apt/archives = gedownloade .deb's."}, {"id": "git-16", "ch": "6", "lab": false, "q": "Wat is het verschil tussen apt-get en apt?", "a": "zelfde werk; apt is de nieuwere, gebruiksvriendelijkere versie", "w": ["apt-get installeert pakketten; apt kan enkel zoeken en tonen", "apt werkt enkel op Ubuntu; apt-get werkt enkel op Debian", "apt-get lost geen dependencies op; apt doet dat wel"], "method": "Zelfde werk; apt is de modernere, gebruiksvriendelijke versie", "detail": "`apt-cache search` = `apt search`. In scripts zie je vaak `apt-get install -y`.", "waarom": "apt bundelt apt-get en apt-cache met mooiere uitvoer. In scripts gebruik je vaak apt-get (stabiele uitvoer)."}, {"id": "git-17", "ch": "6", "lab": false, "q": "Wat doet -y in `sudo apt-get install -y vim`?", "a": "het antwoordt automatisch 'ja' op de bevestigingsvraag", "w": ["het installeert ook de aanbevolen pakketten", "het werkt eerst de pakketlijst bij", "het toont wat er zou gebeuren, zonder te installeren"], "method": "Antwoordt automatisch 'ja' op de bevestigingsvraag", "detail": "Nodig in scripts en provisioning (Vagrant), waar niemand kan antwoorden.", "uitleg": "apt-get install = installeer · -y = yes: beantwoord de bevestigingsvraag automatisch met ja · vim = het pakket", "waarom": "-y = yes. Handig in scripts (bv. Vagrant-provisioning). Een droge test is -s (simulate)."}, {"id": "git-18", "ch": "6", "lab": false, "q": "Maak de cache met gedownloade .deb-bestanden (/var/cache/apt/archives) helemaal leeg.", "a": "sudo apt-get clean", "w": ["sudo apt-get autoclean", "sudo apt-get autoremove", "sudo apt-get purge"], "method": "sudo apt-get clean", "detail": "Cache staat in `/var/cache/apt/archives/`.", "uitleg": "sudo = als root · apt-get clean = maak de cache van gedownloade .deb-bestanden leeg (/var/cache/apt/archives)", "waarom": "clean = alles uit de cache. ✗ autoclean = enkel verouderde .deb's · autoremove = overbodige pakketten verwijderen · purge = pakket + config verwijderen."}, {"id": "git-19", "ch": "6", "lab": false, "q": "Je compileert software uit broncode. In welke volgorde voer je de stappen uit?", "a": "./configure → make → sudo make install", "w": ["make → ./configure → sudo make install", "./configure → sudo make install → make", "make → sudo make install → ./configure"], "method": "tarball/clone → ./configure → make → sudo make install", "detail": "Je hebt build-tools nodig: `sudo apt install build-essential`.", "uitleg": "./configure = controleer het systeem en maak een Makefile · make = compileer volgens de Makefile · sudo make install = installeer het resultaat (als root)", "waarom": "configure controleert je systeem en maakt de Makefile, make compileert, make install kopieert naar /usr/local (daarom sudo)."}, {"id": "git-20", "ch": "6", "lab": false, "q": "Makefile: hoe voer je het doel (target) clean uit?", "a": "make clean", "w": ["make -t clean", "make -f clean", "make run clean"], "method": "make   ·   make clean", "detail": "Make leest `Makefile` in de huidige map. Het eerste doel is het standaarddoel.", "uitleg": "make = voer het eerste (standaard)doel uit de Makefile in de huidige map uit · make clean = voer het doel clean uit", "waarom": "make DOEL. ✗ -t = touch: markeer als up-to-date zonder iets uit te voeren · -f = gebruik een ander bestand als Makefile · 'run' zou een doel met de naam run zijn."}, {"id": "git-21", "ch": "6", "lab": false, "q": "Makefile: waarmee moet elke commandoregel (recipe) onder een doel beginnen?", "a": "met een TAB", "w": ["met 4 spaties", "met een @", "met een -"], "method": "doel: afhankelijkheden\n<TAB>commando", "detail": "⚠ De commando-regel MOET met een TAB beginnen, geen spaties.\nMake voert enkel uit als het doel ouder is dan de afhankelijkheden.", "uitleg": "doel = wat gemaakt wordt · : afhankelijkheden = bestanden waarvan het doel afhangt · <TAB>commando = het recept, verplicht met een TAB ervoor", "waarom": "Een TAB is verplicht; met spaties krijg je 'missing separator'. @ (niet tonen) en - (fout negeren) zijn optionele voorvoegsels ná de TAB."}, {"id": "git-22", "ch": "6", "lab": true, "q": "Labo Makefiles: je voert make twee keer na elkaar uit, zonder iets te wijzigen. Wat gebeurt de tweede keer?", "a": "make zegt dat het doel up to date is en doet niets", "w": ["make compileert alles opnieuw", "make geeft een fout omdat het doel al bestaat", "make verwijdert eerst het oude resultaat en bouwt het opnieuw"], "method": "2e keer: 'is up to date', er gebeurt niets\nNa touch: opnieuw compileren", "detail": "`touch` maakt de bron nieuwer dan het doel.", "waarom": "make vergelijkt de tijdstempels: het doel is nieuwer dan zijn afhankelijkheden, dus er is niets te doen."}, {"id": "git-23", "ch": "6", "lab": true, "q": "Labo Makefiles: je compileerde je eigen programma true in de huidige map. Hoe voer je dát uit, en niet het ingebouwde true van Bash?", "a": "./true", "w": ["true", "command true", "exec true"], "method": "./true", "detail": "`type true` → builtin. Zonder pad wint de shell-builtin.", "uitleg": "./ = voer het programma uit de huidige map uit. Zonder ./ voert de shell de builtin true uit", "waarom": "Met een pad (./) zoekt Bash niet in builtins of $PATH. ✗ true en exec true starten de builtin / /usr/bin/true · command true slaat enkel functies en aliassen over."}, {"id": "git-24", "ch": "6", "lab": true, "q": "Labo Makefiles: hoe begint een pattern rule die van een .tex-bestand een .pdf maakt?", "a": "%.pdf: %.tex", "w": ["%.tex: %.pdf", "*.pdf: *.tex", "*.tex: *.pdf"], "method": "%.pdf: %.tex\n<TAB>xelatex $<", "detail": "`$<` = eerste afhankelijkheid, `$@` = het doel.", "uitleg": "%.pdf: %.tex = pattern rule: maak een .pdf uit de .tex met dezelfde naam · <TAB> = recepten beginnen verplicht met een TAB · xelatex = LaTeX-compiler · $< = de eerste afhankelijkheid (het .tex-bestand)", "waarom": "DOEL: BRON, met % als jokerteken voor het gemeenschappelijke deel. Het doel (.pdf) staat links."}, {"id": "git-25", "ch": "6", "lab": true, "q": "Labo Makefiles: de variabele sources bevat a.tex b.tex. Zet die om naar a.pdf b.pdf.", "a": "$(patsubst %.tex,%.pdf,$(sources))", "w": ["$(patsubst %.pdf,%.tex,$(sources))", "$(wildcard %.tex,%.pdf,$(sources))", "$(wildcard %.pdf,%.tex,$(sources))"], "method": "sources := $(wildcard *.tex)\npdfs := $(patsubst %.tex,%.pdf,$(sources))", "detail": "Het eerste target (bv. `all:`) is het standaarddoel.", "uitleg": "sources = naam van de variabele · := = ken één keer toe · $(wildcard *.tex) = Make-functie: lijst van alle bestanden die op .tex eindigen", "waarom": "patsubst PATROON,VERVANGING,TEKST. wildcard zoekt bestanden op schijf en neemt geen vervanging."}, {"id": "git-27", "ch": "6", "lab": false, "q": "Welke clone-URL gebruikt je SSH-sleutel (en niet je wachtwoord of token)?", "a": "git@github.com:HoGentTIN/repo.git", "w": ["https://github.com/HoGentTIN/repo.git", "ssh://github.com/HoGentTIN/repo", "git://github.com:HoGentTIN/repo.git"], "method": "git@github.com:HoGentTIN/repo.git", "detail": "", "uitleg": "", "waarom": "De vorm user@host:pad is SSH. https:// vraagt een token; ssh:// zonder git@ logt in met jouw gebruikersnaam; git:// is het oude, onbeveiligde protocol (niet meer bij GitHub)."}, {"id": "git-28", "ch": "6", "lab": false, "q": "Je hebt task.sh verknoeid en wil je niet-gecommitte wijzigingen weggooien (terug naar de laatste commit).", "a": "git restore task.sh", "w": ["git restore --staged task.sh", "git reset task.sh", "git rm task.sh"], "method": "git restore task.sh", "detail": "", "uitleg": "", "waarom": "git restore BESTAND zet de werkkopie terug. ✗ --staged en reset halen het enkel uit de staging area · git rm verwijdert het bestand."}, {"id": "git-29", "ch": "6", "lab": false, "q": "Je hebt notes.txt per ongeluk klaargezet met git add. Haal het uit de staging area, zonder je wijzigingen te verliezen.", "a": "git restore --staged notes.txt", "w": ["git restore notes.txt", "git rm notes.txt", "git checkout notes.txt"], "method": "git restore --staged notes.txt", "detail": "", "uitleg": "", "waarom": "--staged = enkel de staging area. ✗ git restore en git checkout gooien je wijzigingen in de werkmap weg · git rm verwijdert het bestand."}, {"id": "git-30", "ch": "6", "lab": false, "q": "Wat is het verschil tussen git fetch en git pull?", "a": "fetch downloadt enkel; pull downloadt én voegt samen met je branch", "w": ["fetch downloadt én voegt samen met je branch; pull downloadt enkel", "fetch werkt enkel via HTTPS; pull werkt ook via SSH", "fetch haalt één bestand op; pull haalt de volledige repo op"], "method": "fetch downloadt enkel; pull downloadt én voegt samen met je branch", "detail": "", "uitleg": "", "waarom": "pull = fetch + merge (of rebase). Na fetch zie je de nieuwe commits in origin/main zonder dat je eigen werk verandert."}, {"id": "git-31", "ch": "6", "lab": false, "q": "git push wordt geweigerd: 'the remote contains work that you do not have locally'. Wat doe je?", "a": "eerst git pull, conflicten oplossen, dan opnieuw pushen", "w": ["eerst git push --force, daarna pas git pull doen", "eerst de repo opnieuw clonen, dan opnieuw pushen", "eerst git commit --amend, dan opnieuw pushen"], "method": "eerst git pull, conflicten oplossen, dan opnieuw pushen", "detail": "", "uitleg": "", "waarom": "Iemand (of jij op een andere machine) pushte eerst. Haal dat binnen en voeg samen; --force zou andermans werk overschrijven."}, {"id": "git-32", "ch": "6", "lab": false, "q": "Welke uitspraak over merge en rebase is correct?", "a": "merge behoudt beide historieken met een merge-commit; rebase zet je commits opnieuw bovenop de andere branch (lineair)", "w": ["rebase behoudt beide historieken met een merge-commit; merge zet je commits opnieuw bovenop de andere branch (lineair)", "merge en rebase doen hetzelfde, rebase is enkel sneller", "merge werkt enkel lokaal, rebase enkel op GitHub"], "method": "merge behoudt beide historieken met een merge-commit; rebase zet je commits opnieuw bovenop de andere branch (lineair)", "detail": "", "uitleg": "", "waarom": "rebase herschrijft je commits (nieuwe hashes); doe dat niet met commits die je al gedeeld hebt."}, {"id": "git-33", "ch": "6", "lab": false, "q": "Een merge geeft een conflict in task.sh. In welke volgorde los je dat op?", "a": "het bestand aanpassen en de conflictmarkeringen weghalen → git add task.sh → git commit", "w": ["git add task.sh → het bestand aanpassen en de markeringen weghalen → git commit", "git commit → het bestand aanpassen en de markeringen weghalen → git add task.sh", "het bestand aanpassen en de markeringen weghalen → git commit → git add task.sh"], "method": "het bestand aanpassen en de conflictmarkeringen weghalen → git add task.sh → git commit", "detail": "", "uitleg": "", "waarom": "Met git add zeg je 'dit conflict is opgelost'; de commit rondt de merge af. Markeringen: <<<<<<<, =======, >>>>>>>."}, {"id": "git-34", "ch": "6", "lab": false, "q": "make: wat is het doel van make?", "a": "doelen bouwen uit hun bronnen, en enkel verouderde stappen opnieuw doen", "w": ["doelen bouwen uit hun bronnen, en telkens álle stappen opnieuw doen", "gewijzigde bestanden kopiëren naar een andere map, zoals rsync", "commando's op een vast tijdstip laten draaien, zoals cron"], "method": "doelen bouwen uit hun bronnen, en enkel verouderde stappen opnieuw doen", "detail": "", "uitleg": "", "waarom": "make vergelijkt de wijzigingstijd van het doel met die van zijn afhankelijkheden en slaat stappen over die al up-to-date zijn."}, {"id": "git-35", "ch": "6", "lab": false, "q": "make zegt: `Makefile:4: *** missing separator. Stop.` Wat is de meest waarschijnlijke oorzaak?", "a": "een commandoregel begint met spaties in plaats van een TAB", "w": ["een commandoregel begint met een TAB in plaats van spaties", "er ontbreekt een puntkomma achter het doel", "er staat geen lege regel tussen twee doelen"], "method": "een commandoregel begint met spaties in plaats van een TAB", "detail": "", "uitleg": "", "waarom": "Recipes moeten met een TAB beginnen. Veel editors zetten een TAB om naar spaties: check met `cat -A Makefile` (TAB = ^I)."}, {"id": "git-36", "ch": "6", "lab": false, "q": "make zegt: `make: 'report.txt' is up to date.` Waarom?", "a": "report.txt bestaat en is nieuwer dan al zijn afhankelijkheden", "w": ["report.txt bestaat en is ouder dan al zijn afhankelijkheden", "report.txt bestaat niet en heeft geen afhankelijkheden", "report.txt staat in .PHONY"], "method": "report.txt bestaat en is nieuwer dan al zijn afhankelijkheden", "detail": "", "uitleg": "", "waarom": "Niets om te doen: geen bron is nieuwer. Een .PHONY-doel wordt juist altijd uitgevoerd."}, {"id": "git-37", "ch": "6", "lab": false, "q": "Waarom zet je clean in .PHONY?", "a": "clean is geen bestand; .PHONY zorgt dat make het altijd uitvoert, ook als er een bestand clean bestaat", "w": ["clean is een bestand; .PHONY zorgt dat make het enkel uitvoert als het bestand clean ouder is", ".PHONY verbergt de commando's van clean in de uitvoer", ".PHONY maakt clean het standaarddoel als je enkel make typt"], "method": "clean is geen bestand; .PHONY zorgt dat make het altijd uitvoert, ook als er een bestand clean bestaat", "detail": "", "uitleg": "", "waarom": "Zonder .PHONY: als er toevallig een bestand clean is, zegt make 'up to date' en ruimt het niets op."}, {"id": "git-38", "ch": "6", "lab": false, "q": "In de regel `out.txt: a.csv b.csv` — wat zijn $@, $< en $^?", "a": "$@ = out.txt · $< = a.csv · $^ = a.csv b.csv", "w": ["$@ = a.csv b.csv · $< = a.csv · $^ = out.txt", "$@ = out.txt · $< = a.csv b.csv · $^ = a.csv", "$@ = a.csv · $< = out.txt · $^ = a.csv b.csv"], "method": "$@ = out.txt · $< = a.csv · $^ = a.csv b.csv", "detail": "", "uitleg": "", "waarom": "$@ = het doel, $< = de eerste afhankelijkheid, $^ = alle afhankelijkheden."}, {"id": "git-39", "ch": "6", "lab": false, "q": "Welk doel bouwt make als je enkel `make` typt, zonder doel?", "a": "het eerste doel in de Makefile", "w": ["het laatste doel in de Makefile", "het doel met de naam all, waar het ook staat", "alle doelen in de Makefile, van boven naar onder"], "method": "het eerste doel in de Makefile", "detail": "", "uitleg": "", "waarom": "Het eerste doel is het standaarddoel; daarom zet men vaak `all:` bovenaan."}, {"id": "git-40", "ch": "6", "lab": false, "q": "Makefile: hoe definieer en gebruik je een variabele PYTHON?", "a": "PYTHON = python3, en dan $(PYTHON) analyse.py", "w": ["PYTHON = python3, en dan $PYTHON analyse.py", "$(PYTHON) = python3, en dan PYTHON analyse.py", "export PYTHON=python3, en dan ${PYTHON analyse.py}"], "method": "PYTHON = python3, en dan $(PYTHON) analyse.py", "detail": "", "uitleg": "", "waarom": "In make gebruik je een variabele met $( ) of ${ }. $PYTHON leest make als $P gevolgd door YTHON."}, {"id": "git-41", "ch": "6", "lab": false, "q": "Makefile: welke regel zet alle CSV-bestanden in de map data/ in de variabele CSV?", "a": "CSV := $(wildcard data/*.csv)", "w": ["CSV := data/*.csv", "CSV := $(patsubst data/*.csv)", "CSV := $(shell data/*.csv)"], "method": "CSV := $(wildcard data/*.csv)", "detail": "", "uitleg": "", "waarom": "wildcard zoekt bestaande bestanden op schijf. ✗ zonder wildcard bewaar je de letterlijke tekst data/*.csv · patsubst vervangt tekst en heeft 3 argumenten nodig · shell voert data/a.csv uit als commando."}, {"id": "var-01", "ch": "7", "lab": false, "q": "Maak in Bash een variabele city met de waarde Burtonville.", "a": "city=Burtonville", "w": ["city = Burtonville", "$city=Burtonville", "set city=Burtonville"], "method": "city=Burtonville\necho \"${city}\"", "detail": "⚠ Geen spaties rond `=`: `city = x` zoekt een commando `city`.", "uitleg": "city = naam van de variabele · = = toekenning, ZONDER spaties · Burtonville = de waarde. Tonen: echo \"${city}\"", "waarom": "Geen spaties rond =, geen $ bij het toekennen. ✗ met spaties zoekt Bash een commando city · $city= wordt eerst ingevuld · set city=… zet positionele parameters."}, {"id": "var-02", "ch": "7", "lab": false, "q": "Wat is de uitvoer van `prefix=Super; echo \"Hello $prefixman\"`?", "a": "Hello", "w": ["Hello Superman", "Hello $prefixman", "Hello Super"], "method": "Hello   (leeg!)", "detail": "Bash zoekt een variabele `prefixman`. Oplossing: `\"${prefix}man\"` → Superman.", "waarom": "Bash leest de variabele prefixman (bestaat niet → leeg). Schrijf ${prefix}man om Superman te krijgen."}, {"id": "var-03", "ch": "7", "lab": false, "q": "Zijn variabelen in Bash hoofdlettergevoelig? Wat geven $USER en $user?", "a": "ja: $user is leeg, $USER bevat je gebruikersnaam", "w": ["ja: $USER is leeg, $user bevat je gebruikersnaam", "nee: beide bevatten je gebruikersnaam", "nee: Bash zet alle namen om naar hoofdletters"], "method": "Ja: `$USER` = jouw naam, `$user` = leeg", "detail": "Systeemvariabelen zijn in HOOFDLETTERS; eigen variabelen in kleine letters.", "waarom": "USER en user zijn twee verschillende namen. Omgevingsvariabelen staan in hoofdletters; gebruik zelf kleine letters."}, {"id": "var-04", "ch": "7", "lab": false, "q": "`file_name='My file.txt'; touch ${file_name}` — zonder quotes rond de variabele. Wat gebeurt er?", "a": "Bash splitst op de spatie: er komen 2 bestanden, My en file.txt", "w": ["Bash vult de variabele niet in: er komt 1 bestand ${file_name}", "touch faalt met een syntaxfout", "er komt 1 bestand 'My file.txt'"], "method": "Zonder quotes splitst Bash op de spatie", "detail": "`touch ${file_name}` maakt 2 bestanden: My en file.txt.\nMet quotes: 1 bestand.", "waarom": "Word splitting: een niet-gequote variabele wordt op spaties gesplitst. Schrijf altijd \"${file_name}\"."}, {"id": "var-05", "ch": "7", "lab": false, "q": "Verwijder de variabele my_var volledig (niet enkel leegmaken).", "a": "unset my_var", "w": ["my_var=", "export -n my_var", "unalias my_var"], "method": "unset my_var", "detail": "", "uitleg": "unset = verwijder een variabele volledig · my_var = naam van de variabele (zonder $)", "waarom": "unset verwijdert. ✗ my_var= maakt ze leeg, maar ze bestaat nog · export -n haalt enkel het export-kenmerk weg · unalias is voor aliassen."}, {"id": "var-06", "ch": "7", "lab": false, "q": "Wat doet `export penguin=tux`?", "a": "ze wordt zichtbaar in scripts die je vanuit deze shell start", "w": ["ze blijft bewaard, ook nadat je de machine herstart", "ze wordt alleen-lezen en kan niet meer wijzigen", "ze wordt automatisch opgeslagen in je ~/.bashrc"], "method": "Maakt de variabele zichtbaar in subshells en scripts", "detail": "Zonder export ziet een script (= subshell) de variabele niet.", "waarom": "export = doorgeven aan kindprocessen. Blijvend wordt ze pas als je de regel zelf in ~/.bashrc zet; alleen-lezen is readonly."}, {"id": "var-07", "ch": "7", "lab": false, "q": "Welke variabele bevat de lijst mappen waarin Bash naar commando's zoekt?", "a": "PATH", "w": ["HOME", "SHELL", "PWD"], "method": "$PATH", "detail": "Mappen gescheiden door `:`. Daarom moet je `./task.sh` typen: `.` staat niet in PATH.", "waarom": "PATH = mappen gescheiden door :. HOME = je home-map, SHELL = je login-shell, PWD = huidige map."}, {"id": "var-08", "ch": "7", "lab": false, "q": "Welke variabele bepaalt hoe je gewone prompt (bv. hogent@linux:~$) eruitziet?", "a": "PS1", "w": ["PS2", "PROMPT_COMMAND", "TERM"], "method": "$PS1", "detail": "Aanpassen in `~/.bashrc`.", "waarom": "PS1 = hoofdprompt. PS2 = vervolgprompt (>), PROMPT_COMMAND = commando dat vóór elke prompt draait, TERM = type terminal."}, {"id": "var-09", "ch": "7", "lab": false, "q": "Wat toont `env -i bash -c 'echo $HOME'`?", "a": "een lege regel, want de omgeving is leeg", "w": ["/home/hogent", "/root", "een foutmelding, want env kent geen -i"], "method": "Start bash met een lege omgeving → HOME is leeg", "detail": "`env` zonder argumenten toont alle omgevingsvariabelen.", "uitleg": "env = start een commando met een aangepaste omgeving · -i = ignore environment: lege omgeving · bash -c '...' = voer deze opdracht uit in een nieuwe bash · echo $HOME = toon HOME", "waarom": "env -i start het commando met een lege omgeving: HOME bestaat niet. De enkele quotes zorgen dat je huidige shell $HOME níet al invult."}, {"id": "var-10", "ch": "7", "lab": false, "q": "Bewaar de uitvoer van `date +%F` (bv. 2026-11-10) in de variabele today.", "a": "today=$(date +%F)", "w": ["today=${date +%F}", "today='date +%F'", "today=$date +%F"], "method": "today=$(date +%F)", "detail": "Command substitution. De oude vorm met backticks `` `date` `` werkt ook, maar wordt afgeraden.", "uitleg": "today = naam van de variabele · $( ) = command substitution: de uitvoer van het commando wordt de waarde · date +%F = datum als JJJJ-MM-DD (%F = %Y-%m-%d)", "waarom": "$( ) = command substitution. ✗ ${ } is voor variabelen · tussen enkele quotes bewaar je de tekst zelf · $date +%F zoekt een variabele date."}, {"id": "var-11", "ch": "7", "lab": false, "q": "Wat geeft `${var:-standaard}`?", "a": "de waarde van var, of 'standaard' als var leeg is", "w": ["altijd 'standaard', ook als var een waarde heeft", "'standaard' enkel als var wél een waarde heeft", "niets, maar var wordt blijvend 'standaard'"], "method": "De waarde van var, of 'standaard' als var leeg/onbestaand is", "detail": "Veilig onder `set -o nounset`: `${1:-}`.", "waarom": ":- = standaardwaarde, var zelf verandert niet. (:= zou var ook invullen.)"}, {"id": "var-12", "ch": "7", "lab": false, "q": "Hoe krijg je het aantal tekens van de string in de variabele var?", "a": "${#var}", "w": ["${var#}", "$#var", "${var:#}"], "method": "${#var}", "detail": "name=Céline → `${#name}` = 6.", "uitleg": "${#var} = de lengte (aantal tekens) van de waarde in var", "waarom": "${#var} = lengte. ✗ $#var = het aantal argumenten ($#) gevolgd door de tekst var."}, {"id": "var-13", "ch": "7", "lab": false, "q": "file=rapport.tar.gz. Wat geeft `${file%.*}`?", "a": "rapport.tar", "w": ["rapport", "tar.gz", "gz"], "method": "rapport.tar   ·   tar.gz", "detail": "`%` knipt achteraan, `#` vooraan. Dubbel (`%%`, `##`) = zo veel mogelijk: `${file%%.*}` = rapport.", "uitleg": "${file%.*} = knip achteraan het kortste stuk weg dat op .* past · ${file#*.} = knip vooraan het kortste stuk weg dat op *. past · %% en ## = het langste stuk", "waarom": "% knipt het kortste stuk dat matcht op het einde weg (.gz). %% knipt het langste (.tar.gz → rapport); # en ## knippen vooraan."}, {"id": "var-14", "ch": "7", "lab": false, "q": "Toon elk commando zoals Bash het uitvoert, met de variabelen al ingevuld (debuggen).", "a": "set -x", "w": ["set -v", "set -e", "set -n"], "method": "set -x   (uit: set +x)", "detail": "In een script: `bash -x script.sh`.", "uitleg": "set -x = xtrace aan: Bash toont elk commando met + ervoor, na expansie · set +x = xtrace weer uit", "waarom": "-x = xtrace: toont + commando met ingevulde waarden. ✗ -v toont de regels zoals ze geschreven staan · -e = errexit · -n = enkel lezen, niets uitvoeren."}, {"id": "var-15", "ch": "7", "lab": false, "q": "Wat is het verschil tussen `./script.sh` en `source script.sh`?", "a": "./ draait in een nieuwe shell; source draait in je huidige shell", "w": ["./ draait in je huidige shell; source draait in een nieuwe shell", "source vereist chmod +x, ./ niet", "geen verschil: beide draaien in een nieuwe shell"], "method": "./ = in een subshell\nsource = in je huidige shell", "detail": "Na `source` blijven de variabelen van het script bestaan. `. script.sh` = hetzelfde als source.", "waarom": "Daarom blijven variabelen en cd's uit een gesourcet script in je shell bestaan. ./ vereist wél chmod +x; source niet."}, {"id": "var-16", "ch": "7", "lab": true, "q": "Labo Scripting 101: hey.sh bevat `echo \"Hallo ${person}\"`. De variabele person bestaat niet en nounset staat uit. Wat is de uitvoer?", "a": "Hallo", "w": ["Hallo ${person}", "Hallo person", "een foutmelding: person: unbound variable"], "method": "Zonder: Hallo\nMet nounset: fout 'person: unbound variable'", "detail": "Cursus: nounset toevoegen is beter.", "waarom": "Een onbestaande variabele is leeg. Enkel mét set -o nounset krijg je 'unbound variable'."}, {"id": "var-17", "ch": "7", "lab": true, "q": "Labo Scripting 101: je zet person=Jan in je terminal en start dan ./hey.sh. Hoe zorg je dat het script person kent?", "a": "export person=Jan", "w": ["local person=Jan", "readonly person=Jan", "declare person=Jan"], "method": "Nee: de variabele bestaat niet in de subshell\nexport person=Jan   of   person=Jan ./hey.sh", "detail": "Bij `person=Jan ./hey.sh` bestaat de variabele daarna niet meer in je shell.", "uitleg": "export = maak een variabele zichtbaar in subshells en scripts die je daarna start · person=Jan = naam en waarde", "waarom": "Enkel geëxporteerde variabelen gaan mee naar een nieuw proces. local werkt enkel in functies; readonly en declare exporteren niet."}, {"id": "var-18", "ch": "7", "lab": true, "q": "Labo Scripting 101: welke Bash-variabele bevat bv. 'linux-gnu', het type besturingssysteem?", "a": "OSTYPE", "w": ["HOSTTYPE", "MACHTYPE", "SHELL"], "method": "OSTYPE: type OS (linux-gnu) · UID: gebruikersnummer · LANG: taal/locale · HOSTNAME: naam machine · PWD: huidige map", "detail": "Omgevingsvariabelen: gedefinieerd buiten je script.", "waarom": "OSTYPE = linux-gnu. HOSTTYPE = x86_64, MACHTYPE = x86_64-pc-linux-gnu, SHELL = /bin/bash."}, {"id": "var-19", "ch": "7", "lab": false, "q": "line=\"a;b;c\". Wat doet `${line//;/,}`?", "a": "vervangt élke ; door , (a,b,c)", "w": ["vervangt enkel de eerste ; door , (a,b;c)", "verwijdert élke ; (abc)", "knipt alles vanaf de eerste ; weg (a)"], "method": "vervangt élke ; door , (a,b,c)", "detail": "", "uitleg": "", "waarom": "${var//zoek/vervang} = alle; ${var/zoek/vervang} = enkel de eerste. Met een lege vervanging verwijder je."}, {"id": "script-01", "ch": "8", "lab": false, "q": "Welke drie shell-opties zet je volgens de cursus bovenaan elk script?", "a": "set -o nounset · set -o errexit · set -o pipefail", "w": ["set -o noclobber · set -o noexec · set -o pipefail", "set -o noclobber · set -o errexit · set -o xtrace", "set -o nounset · set -o noexec · set -o xtrace"], "method": "#!/bin/bash --\nset -o nounset\nset -o errexit\nset -o pipefail", "detail": "Dit noemt de cursus 'strict mode'. Kort: `set -euo pipefail` (minder leesbaar).", "uitleg": "#!/bin/bash -- = shebang: voer dit script uit met bash (-- = geen verdere opties, tegen spoofing) · set -o nounset = stop bij een onbestaande variabele · set -o errexit = stop zodra een commando faalt · set -o pipefail = een pipeline faalt als één deel faalt", "waarom": "nounset = fout bij een onbestaande variabele, errexit = stop bij een fout, pipefail = pipeline faalt als één deel faalt. ✗ noclobber = > overschrijft niet · noexec = niets uitvoeren · xtrace = elk commando tonen (debuggen)."}, {"id": "script-02", "ch": "8", "lab": false, "q": "Wat doet `set -o errexit` in een script?", "a": "het script stopt zodra een commando faalt", "w": ["het script stopt bij een onbestaande variabele", "een pipeline faalt als één deel ervan faalt", "elk commando wordt eerst getoond"], "method": "nounset: stop bij onbestaande variabele\nerrexit: stop bij fout\npipefail: pipeline faalt als één deel faalt", "detail": "", "waarom": "errexit (= set -e). De andere drie zijn nounset, pipefail en xtrace."}, {"id": "script-03", "ch": "8", "lab": false, "q": "Controleer task.sh op syntaxfouten zonder het uit te voeren.", "a": "bash -n task.sh", "w": ["bash -x task.sh", "bash -v task.sh", "bash -e task.sh"], "method": "bash -n script.sh   ·   shellcheck script.sh", "detail": "Op het examen moeten beide slagen (shellcheck met `--severity=error`).", "uitleg": "bash -n = noexec: lees het script en controleer de syntax, zonder het uit te voeren · shellcheck = statische analyse: vindt fouten en slechte gewoontes · script.sh = het script", "waarom": "-n = noexec: enkel inlezen. ✗ -x, -v en -e voeren het script wél uit (met tracing, met de regels getoond, of met errexit)."}, {"id": "script-04", "ch": "8", "lab": false, "q": "Wat legt de shebang `#!/bin/bash` op de eerste regel vast?", "a": "welke interpreter het script uitvoert", "w": ["dat het script uitvoerbaar is", "welke gebruiker het script mag starten", "dat de regel commentaar is en verder niets"], "method": "Eerste regel #!/bin/bash: welke interpreter het script uitvoert", "detail": "Zonder shebang kiest de huidige shell. Een extensie `.sh` heeft voor Linux geen betekenis.", "waarom": "Bij ./task.sh leest de kernel #! en start /bin/bash met het script. Uitvoerbaar maken doe je met chmod +x."}, {"id": "script-05", "ch": "8", "lab": false, "q": "Wat toont `test 56 -gt 55; echo $?`?", "a": "0", "w": ["1", "true", "56"], "method": "test 56 -gt 55 ; echo $?   →   0", "detail": "`[ 56 -gt 55 ]` is hetzelfde als `test 56 -gt 55`.", "uitleg": "test = evalueer een voorwaarde (= [ ]) · 56 -gt 55 = greater than · ; = daarna · echo $? = toon de exit-status: 0 = waar", "waarom": "56 > 55 is waar, en 'waar' is exit-status 0. Onwaar zou 1 geven. test drukt zelf niets af."}, {"id": "script-06", "ch": "8", "lab": false, "q": "Welke operator betekent 'kleiner dan of gelijk aan' voor getallen in [ ]?", "a": "-le", "w": ["-lt", "-ge", "<="], "method": "-eq  -ne  -lt  -le  -gt  -ge", "detail": "-eq = equal (gelijk aan)\n-ne = not equal (niet gelijk aan)\n-lt = less than (kleiner dan)\n-le = less than or equal (kleiner dan of gelijk aan)\n-gt = greater than (groter dan)\n-ge = greater than or equal (groter dan of gelijk aan)\nEnkel voor gehele getallen. Strings vergelijk je met `=` en `!=`. ⚠ `[ 10 > 9 ]` is redirectie naar een bestand `9`!", "waarom": "-le = less or equal, -lt = less than, -ge = greater or equal. <= werkt niet in [ ] (< is daar een redirectie)."}, {"id": "script-07", "ch": "8", "lab": false, "q": "Welke test is waar als het pad bestaat én een map is?", "a": "[ -d pad ]", "w": ["[ -f pad ]", "[ -e pad ]", "[ -s pad ]"], "method": "-f gewoon bestand · -d map · -e bestaat · -r leesbaar · -w schrijfbaar", "detail": "Bv. `if [ -f \"${file}\" ]`. Lege string: `-z`, niet-leeg: `-n`.", "waarom": "-d = directory. ✗ -f = gewoon bestand · -e = bestaat (eender welk type) · -s = bestaat en is niet leeg."}, {"id": "script-08", "ch": "8", "lab": false, "q": "Waarom moeten er spaties staan in `[ \"${a}\" = \"${b}\" ]`?", "a": "[ is een commando, en =, de waarden en ] zijn argumenten", "w": ["zonder spaties wordt = een toekenning in plaats van een test", "spaties zijn enkel een stijlregel uit de cursus", "] moet altijd het laatste woord van de regel zijn"], "method": "[ is een commando; = en ] zijn argumenten", "detail": "`[\"${a}\"=\"${b}\"]` → command not found.", "waarom": "[ is een ander naam voor test. Zonder spaties krijgt het één lang woord (bv. [a=b) en vindt Bash geen commando."}, {"id": "script-09", "ch": "8", "lab": false, "q": "Combineer twee tests (66 > 55 EN 66 < 500) zoals de cursus aanraadt.", "a": "[ 66 -gt 55 ] && [ 66 -lt 500 ]", "w": ["[ 66 -gt 55 ] || [ 66 -lt 500 ]", "[ 66 -gt 55 -a 66 -lt 500 ]", "[ 66 -gt 55 -o 66 -lt 500 ]"], "method": "[ 66 -gt 55 ] && [ 66 -lt 500 ]", "detail": "`-a` en `-o` binnen [ ] zijn verouderd.", "uitleg": "[ ] = test-commando · 66 -gt 55 = greater than · && = enkel als de eerste test lukt, ook de tweede · 66 -lt 500 = less than", "waarom": "Twee aparte [ ] met && (EN). -a en -o binnen één [ ] zijn verouderd; || en -o betekenen OF."}, {"id": "script-10", "ch": "8", "lab": false, "q": "Wat is de juiste structuur van if / elif / else in Bash?", "a": "if …; then …; elif …; then …; else …; fi", "w": ["if …; then …; else if …; then …; fi", "if …; then …; elif …; then …; else …; done", "if …; then …; elif …; else …; fi"], "method": "if [ ... ]\nthen\n  ...\nelif [ ... ]\nthen\n  ...\nelse\n  ...\nfi", "detail": "Afsluiten met `fi` (if achterstevoren).", "uitleg": "if [ test ] = als de test waar is · then = dan · elif = anders als · else = in alle andere gevallen · fi = einde van if (if achterstevoren)", "waarom": "elif heeft een eigen then; een if sluit je af met fi (done is voor lussen)."}, {"id": "script-11", "ch": "8", "lab": false, "q": "In `for file in *.sh; do … done`: hoe kopieer je elk bestand naar dezelfde naam met .backup erachter?", "a": "cp \"${file}\" \"${file}.backup\"", "w": ["cp \"${file}\" \"${file.backup}\"", "cp \"${file}\" \"${backup}.file\"", "cp \"${file}.backup\" \"${file}\""], "method": "for file in *.sh; do cp \"${file}\" \"${file}.backup\"; done", "detail": "⚠ De syllabus schrijft `${file.backup}`: dat is fout.", "uitleg": "for file in *.sh = loop over elk bestand dat op .sh eindigt (globbing) · do ... done = de lusinhoud · cp = kopieer · \"${file}\" = huidig bestand, tussen quotes voor spaties · \"${file}.backup\" = zelfde naam + .backup", "waarom": "De punt staat buiten de accolades. ${file.backup} is geen geldige variabelenaam; de laatste kopieert in de verkeerde richting."}, {"id": "script-12", "ch": "8", "lab": false, "q": "Tel van 1 tot 20 in een for-lus, zonder seq.", "a": "for counter in {1..20}", "w": ["for counter in {1-20}", "for counter in [1..20]", "for counter in (1..20)"], "method": "for counter in {1..20}; do ...; done", "detail": "Met seq: `for counter in $(seq 1 20)`.", "uitleg": "for counter in {1..20} = brace expansion: de getallen 1 tot en met 20 · do ... done = de lusinhoud · echo \"${counter}\" = druk het huidige getal af", "waarom": "Brace expansion {BEGIN..EINDE}, met twee punten."}, {"id": "script-13", "ch": "8", "lab": false, "q": "Verlaag i met 1 op een manier die altijd veilig is onder errexit.", "a": "i=$((i - 1))", "w": ["i=$(i - 1)", "((i--))", "i=$((i--))"], "method": "i=100\nwhile [ \"${i}\" -ge 0 ]; do\n  echo \"${i}\"\n  i=$((i - 1))\ndone", "detail": "⚠ `(( i-- ))` stopt een script met errexit als het resultaat 0 is.", "uitleg": "i=100 = startwaarde · while [ \"${i}\" -ge 0 ] = herhaal zolang i groter dan of gelijk aan 0 is · do ... done = lusinhoud · echo = druk i af · i=$((i - 1)) = rekenkundige expansie: verlaag i met 1", "waarom": "$(( )) rekent en de toekenning geeft altijd status 0. ✗ $( ) voert een commando 'i' uit · ((i--)) geeft status 1 als de waarde 0 was, en dan stopt errexit je script · i=$((i--)) zet i terug op de oude waarde (i-- geeft eerst de oude waarde)."}, {"id": "script-14", "ch": "8", "lab": false, "q": "Wat is het verschil tussen een while- en een until-lus?", "a": "until herhaalt zolang de test onwaar is, en stopt zodra hij waar wordt", "w": ["until herhaalt zolang de test waar is, en stopt zodra hij onwaar wordt", "until voert de lus altijd minstens één keer uit", "until werkt enkel met getallen"], "method": "while: herhaalt zolang de test WAAR is\nuntil: herhaalt tot de test WAAR wordt", "detail": "Oneindige lus: `while true` of `while :`.", "waarom": "while = zolang waar; until = tot waar. Beide testen vóór elke ronde."}, {"id": "script-15", "ch": "8", "lab": false, "q": "Hoe lees je bestand regel per regel in een lus?", "a": "while read -r line; do …; done < bestand", "w": ["while read -r line < bestand; do …; done", "for line in bestand; do …; done", "for line < bestand; do …; done"], "method": "while read -r line; do\n  echo \"${line}\"\ndone < bestand", "detail": "`-r`: backslashes blijven letterlijk.", "uitleg": "while read -r line = lees telkens één regel in de variabele line (-r = backslashes letterlijk) · do ... done = lusinhoud · < bestand = de invoer van de hele lus komt uit dit bestand", "waarom": "De < hoort na done: de hele lus leest uit het bestand. Binnen de test opent elke ronde het bestand opnieuw (altijd regel 1). for line in bestand loopt over het woord 'bestand'."}, {"id": "script-16", "ch": "8", "lab": false, "q": "Vraag de gebruiker zijn naam met de prompt 'Enter your name ' en bewaar het antwoord in name.", "a": "read -r -p 'Enter your name ' name", "w": ["read -r -p name 'Enter your name '", "read -r -s 'Enter your name ' name", "echo 'Enter your name ' | read -r name"], "method": "read -p 'Enter your name ' -r name", "detail": "`-p` = prompt.", "uitleg": "read = lees invoer van de gebruiker · -p 'Enter your name ' = prompt: toon eerst deze vraag · -r = raw: backslashes letterlijk · name = de variabele waarin het antwoord komt", "waarom": "-p TEKST = prompt, daarna de variabelenaam. ✗ omgekeerd wordt 'name' de prompt · -s = stil typen (wachtwoord), geen prompt · read in een pipe draait in een subshell: name is daarna leeg."}, {"id": "script-17", "ch": "8", "lab": false, "q": "Welke uitdrukking geeft alle argumenten van een script, elk als apart woord (ook als er spaties in zitten)?", "a": "\"$@\"", "w": ["\"$*\"", "$#", "$0"], "method": "$0 scriptnaam · $1 eerste param · $# aantal · $* alles als 1 string · \"$@\" alles, elk apart", "detail": "", "waarom": "\"$@\" behoudt elk argument apart. \"$*\" plakt alles aan elkaar tot één woord; $# = aantal; $0 = naam van het script."}, {"id": "script-18", "ch": "8", "lab": false, "q": "Wat geeft $10 in Bash?", "a": "de waarde van $1, gevolgd door het teken 0", "w": ["de waarde van het tiende argument", "een lege string, want $10 bestaat niet", "een syntaxfout bij het uitvoeren"], "method": "$10 = ${1} gevolgd door het teken 0", "detail": "Cursus: gebruik altijd accolades.", "waarom": "Vanaf 10 heb je accolades nodig: ${10}."}, {"id": "script-19", "ch": "8", "lab": false, "q": "Wat doet shift?", "a": "$1 valt weg, de rest schuift één plaats op, $# daalt met 1", "w": ["er komt een lege $1 bij, de rest schuift op, $# stijgt met 1", "het laatste argument valt weg, de rest blijft, $# daalt met 1", "alle argumenten worden gewist en $# wordt 0"], "method": "Schuift de parameters één plaats op: $2 wordt $1, $# daalt met 1", "detail": "Typisch: `while [ \"$#\" -gt 0 ]; do ...; shift; done`.", "waarom": "shift schuift alle argumenten één plaats naar links ($2 wordt $1); shift 3 = drie plaatsen."}, {"id": "script-20", "ch": "8", "lab": false, "q": "Laat een script stoppen met een foutcode als het zonder argumenten gestart wordt.", "a": "if [ \"$#\" -eq 0 ]; then echo 'Usage…' >&2; exit 1; fi", "w": ["if [ \"$#\" -eq 0 ]; then echo 'Usage…' >&2; exit 0; fi", "if [ \"$1\" -eq 0 ]; then echo 'Usage…' >&2; exit 1; fi", "if [ \"$1\" -eq 0 ]; then echo 'Usage…' >&2; exit 0; fi"], "method": "if [ \"$#\" -eq 0 ]; then\n  echo 'Usage: ...' >&2\n  exit 1\nfi", "detail": "Foutmelding naar stderr, exit-status ≠ 0.", "uitleg": "if [ ... ]; then ... fi = voorwaarde · \"$#\" = aantal parameters · -eq 0 = gelijk aan 0 · echo '...' >&2 = boodschap naar stderr · exit 1 = stop het script met foutcode 1", "waarom": "$# = aantal argumenten; een exit-code ≠ 0 betekent 'fout'. \"$1\" -eq 0 test of het eerste argument het getal 0 is."}, {"id": "script-21", "ch": "8", "lab": false, "q": "Lees het configuratiebestand myApp.conf (met regels als port=8080) in je script in, zodat die variabelen beschikbaar zijn.", "a": "source myApp.conf", "w": ["bash myApp.conf", "exec myApp.conf", "cat myApp.conf"], "method": "source myApp.conf   (of . myApp.conf)", "detail": "Het bestand bevat gewone Bash-variabelen. Shellcheck: SC1090 mag je negeren.", "uitleg": "source = lees het bestand in en voer het uit in de huidige shell, zodat de variabelen erin blijven bestaan (korte vorm: .) · myApp.conf = het configuratiebestand", "waarom": "source voert de regels uit in je eigen script. ✗ bash start een aparte shell: de variabelen verdwijnen erna · exec vervangt je script · cat toont enkel."}, {"id": "script-22", "ch": "8", "lab": false, "q": "In `getopts \":af:z\"` — wat betekent de : na de f?", "a": "-f verwacht een argument, dat in ${OPTARG} komt", "w": ["-f is verplicht en het script faalt zonder", "-f mag meerdere keren na elkaar voorkomen", "-f wordt stil genegeerd als het voorkomt"], "method": "Eerste : = stille modus (zelf fouten afhandelen)\nf: = -f verwacht een argument (in ${OPTARG})", "detail": "Fout `:` in case = argument ontbreekt; `*` / `?` = ongeldige optie.", "uitleg": "getopts = verwerk opties in een while-lus · : vooraan = stille modus: jij handelt fouten af · a, z = opties zonder argument · f: = optie met argument, dat in ${OPTARG} komt", "waarom": "Een : ná een letter = die optie neemt een waarde. De : helemaal vooraan zet de stille foutafhandeling aan."}, {"id": "script-23", "ch": "8", "lab": false, "q": "Wat is de juiste structuur van een case-statement in Bash?", "a": "case \"${var}\" in start) … ;; esac", "w": ["case \"${var}\" in start) … ;; done", "case \"${var}\" in start: … ;; esac", "case \"${var}\" in start: … ;; done"], "method": "case \"${var}\" in\n  start) ... ;;\n  stop|halt) ... ;;\n  *) ... ;;\nesac", "detail": "`*)` = al de rest. Afsluiten met `esac`.", "uitleg": "case \"${var}\" in = vergelijk de waarde met patronen · start) = als het 'start' is · stop|halt) = 'stop' of 'halt' · *) = al de rest · ;; = einde van een geval · esac = einde (case achterstevoren)", "waarom": "patroon) commando's ;; en afsluiten met esac (case achterstevoren)."}, {"id": "script-24", "ch": "8", "lab": false, "q": "Hoe roep je de Bash-functie greet aan met het argument Paul?", "a": "greet Paul", "w": ["greet(Paul)", "greet \"$Paul\"", "call greet Paul"], "method": "greet() {\n  printf 'Hello %s!\\n' \"${1}\"\n}\ngreet Paul", "detail": "Binnen een functie zijn ${1}, ${2} de argumenten van de functie, niet van het script.", "uitleg": "greet() { ... } = definitie van de functie greet · printf 'Hello %s!\\n' = geformatteerd afdrukken: %s wordt vervangen door het argument, \\n = nieuwe regel · \"${1}\" = eerste argument van de functie · greet Paul = aanroep, zonder haakjes", "waarom": "Een functie roep je aan als een commando. ✗ haakjes geven een syntaxfout · \"$Paul\" geeft de (lege) variabele Paul mee · call bestaat niet."}, {"id": "script-25", "ch": "8", "lab": false, "q": "Waarom gebruik je local voor variabelen in een functie?", "a": "zonder local is ze globaal, in het hele script zichtbaar", "w": ["zonder local verdwijnt ze meteen na de functie", "local maakt de variabele alleen-lezen", "local is verplicht voor de parameters $1 en $2"], "method": "Zonder local is de variabele globaal en bestaat ze na de functie nog", "detail": "Cursus: declareer alle variabelen in functies als local.", "waarom": "Bash-variabelen zijn standaard globaal; local beperkt ze tot de functie, zodat je niets buiten de functie overschrijft."}, {"id": "script-26", "ch": "8", "lab": false, "q": "Een functie moet een berekend totaal teruggeven. Wat is in Bash het gebruikelijke patroon?", "a": "de functie doet echo \"${total}\"; de aanroeper doet total=$(calc_total)", "w": ["de functie doet return \"${total}\"; de aanroeper leest $?", "de functie doet export total; de aanroeper leest ${total}", "de functie doet echo \"${total}\"; de aanroeper leest $?"], "method": "Druk ze af op stdout en vang ze met $( )", "detail": "message=$(get_greeting Paul).\n`return` geeft enkel een exit-status (0–255).", "waarom": "return geeft enkel een exit-status (0–255). Waarden 'teruggeven' = afdrukken op stdout en vangen met $( )."}, {"id": "script-27", "ch": "8", "lab": false, "q": "Wat is een predicaat (predicate) volgens de cursus?", "a": "een functie die waar/onwaar geeft via haar exit-status", "w": ["een functie die altijd exit-status 0 teruggeeft", "een functie die haar resultaat afdrukt op stdout", "een test die tussen dubbele [[ ]] staat"], "method": "Functie die waar/onwaar teruggeeft via haar exit-status", "detail": "Bv. `is_user_present() { getent passwd \"${1}\" > /dev/null 2>&1; }` → `if ! is_user_present jan`.", "waarom": "Bv. is_number() { [[ \"$1\" =~ ^[0-9]+$ ]]; } — bruikbaar als `if is_number \"$x\"; then`."}, {"id": "script-28", "ch": "8", "lab": false, "q": "var='val global'. func1 zet `local var='val func1'` en roept func2 aan, die echo \"$var\" doet. Daarna wordt func2 nog eens apart aangeroepen. Wat is de uitvoer?", "a": "val func1, daarna val global", "w": ["val global, daarna val global", "val func1, daarna val func1", "val global, daarna val func1"], "method": "Een functie ziet de local-variabelen van de functie die haar aanriep", "detail": "func1 zet `local var`, roept func2 → func2 ziet die waarde.", "waarom": "Bash heeft dynamische scope: func2 ziet de local van func1 zolang func1 loopt. Daarna is er weer enkel de globale var."}, {"id": "script-29", "ch": "8", "lab": false, "q": "Zet de shell-optie cdspell aan (kleine typfouten in cd verbeteren).", "a": "shopt -s cdspell", "w": ["shopt -u cdspell", "set -o cdspell", "set +o cdspell"], "method": "shopt -s cdspell   ·   shopt -u cdspell", "detail": "Controleren: `shopt -q cdspell; echo $?`. Met cdspell corrigeert `cd /Etc` naar /etc.", "uitleg": "shopt = shell options · -s = set: zet aan · -u = unset: zet uit · cdspell = verbeter kleine typfouten in cd", "waarom": "shopt -s = set (aan), -u = unset (uit). cdspell is een shopt-optie, geen set -o-optie."}, {"id": "script-30", "ch": "8", "lab": false, "q": "Tel 5 op bij de getalvariabele i.", "a": "i=$((i + 5))", "w": ["i=$(i + 5)", "i=$i+5", "let i+5"], "method": "i=$((i + 5))", "detail": "Bash rekent enkel met gehele getallen.", "uitleg": "i= = toekenning · $(( )) = rekenkundige expansie: Bash rekent met gehele getallen · i + 5 = de berekening", "waarom": "$(( )) = rekenen. ✗ $( ) voert een commando 'i' uit · i=$i+5 geeft de tekst 3+5 · let i+5 rekent i+5 uit maar bewaart niets (let i+=5 zou wel werken)."}, {"id": "script-31", "ch": "8", "lab": true, "q": "Labo Scripting 102: schrijf errexit, nounset en pipefail zo kort mogelijk op één regel.", "a": "set -euo pipefail", "w": ["set -eux pipefail", "s
