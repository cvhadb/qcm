<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><a href="index.html" style="display:block;width:max-content;margin:14px auto 0;font:600 11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:1.5px;text-transform:uppercase;color:#8a91a5;background:#161921;border:1px solid #252a35;padding:8px 10px;text-decoration:none">&larr; Menu</a>

<style>
  :root { color-scheme: dark;
    --bg: #0d0f14; --surface: #161921; --border: #252a35;
    --accent: #e8ff47; --accent2: #47c8ff; --text: #e8eaf0; --muted: #8a91a5; --card-bg: #1a1f2e;
    --good: #7bc84a; --good-bg: rgba(58,110,26,.22); --good-bd: #3a6e1a;
    --bad: #e05c5c; --bad-bg: rgba(122,26,26,.22); --bad-bd: #7a1a1a;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --display: 'Syne', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { text-align: center; margin-bottom: 24px; }
  header h1 { font-family: var(--display); font-size: clamp(1.7rem,4vw,2.5rem); font-weight: 800; letter-spacing: -1px; color: var(--accent); text-transform: uppercase; line-height: 1; text-wrap: balance; }
  header p { color: var(--muted); font-size: .78rem; margin-top: 6px; letter-spacing: 2px; text-transform: uppercase; }
  .stats-bar { display: flex; gap: 22px; margin-bottom: 20px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; flex-wrap: wrap; justify-content: center; font-variant-numeric: tabular-nums; }
  .stats-bar strong { color: var(--accent); font-size: 1rem; }
  .stat-good strong { color: var(--good); } .stat-bad strong { color: var(--bad); }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; max-width: 880px; }
  .filter-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 2px; }
  .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .progress-track { width: 100%; max-width: 720px; height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
  .progress-text { font-size: .7rem; color: var(--muted); text-align: center; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  .qcard { width: 100%; max-width: 720px; background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 28px 32px; margin-bottom: 18px; min-width: 0; }
  .card-label { font-size: .65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 14px; }
  .card-question { white-space: pre-line; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; overflow-wrap: anywhere; }
  .card-question code, .expl code { background: rgba(71,200,255,.1); color: var(--accent2); padding: 1px 6px; border-radius: 2px; font-size: .9em; }
  .options { display: grid; gap: 10px; }
  .opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: .86rem; line-height: 1.5; padding: 12px 14px; border-radius: 3px; cursor: pointer; min-width: 0; }
  .opt .key { color: var(--muted); font-weight: 600; }
  .opt .txt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .opt:hover:not([disabled]) { border-color: var(--accent2); }
  .opt:focus-visible, .btn:focus-visible, .filter-btn:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .opt[disabled] { cursor: default; }
  .opt.correct { background: var(--good-bg); border-color: var(--good-bd); }
  .opt.correct .key { color: var(--good); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad-bd); }
  .opt.wrong .key { color: var(--bad); }
  .opt.dim { opacity: .55; }
  .expl { margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 16px; }
  .verdict { font-family: var(--display); font-weight: 800; font-size: 1.05rem; margin-bottom: 10px; }
  .verdict.ok { color: var(--good); } .verdict.ko { color: var(--bad); }
  .expl-method { white-space: pre-line; color: var(--accent2); font-weight: 600; font-size: .9rem; line-height: 1.6; margin-bottom: 8px; overflow-wrap: anywhere; }
  .expl-waarom { color: var(--text, inherit); font-size: .85rem; line-height: 1.65; margin-bottom: 10px; overflow-wrap: anywhere; }
  .expl-waarom ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  .expl-waarom li { margin: 2px 0; }
  .expl-waarom .lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 8px; }
  .expl-detail { white-space: pre-line; color: var(--muted); font-size: .8rem; line-height: 1.7; overflow-wrap: anywhere; }
  .expl-uitleg { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; font-size: .8rem; line-height: 1.65; display: grid; grid-template-columns: minmax(0, max-content) 1fr; gap: 4px 10px; }
  .expl-uitleg .k { color: var(--accent); overflow-wrap: anywhere; } .expl-uitleg .v { color: var(--muted); overflow-wrap: anywhere; }
  .controls { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .btn { padding: 12px 24px; font-family: var(--mono); font-size: .78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; border: none; border-radius: 2px; }
  .btn-primary { background: var(--accent); color: #000; } .btn-primary:hover { background: #fff; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); } .btn-secondary:hover { border-color: var(--text); color: var(--text); }
  .kbd { display: inline-block; background: var(--border); color: var(--muted); padding: 1px 7px; border-radius: 2px; font-size: .68rem; margin: 4px 2px 0; }
  .hints { text-align: center; max-width: 720px; }
  #done-screen { width: 100%; max-width: 720px; margin-bottom: 18px; }
  .done-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .result-box { border-radius: 4px; padding: 1.2rem; text-align: center; }
  .result-box .big { font-family: var(--display); font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .result-box .lbl { font-size: .72rem; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .result-good { background: var(--good-bg); border: 1px solid var(--good-bd); color: var(--good); }
  .result-bad { background: var(--bad-bg); border: 1px solid var(--bad-bd); color: var(--bad); }
  .done-buttons { display: flex; gap: 10px; flex-wrap: wrap; } .done-buttons .btn { flex: 1; min-width: 200px; }
  @media (max-width: 520px) { .qcard { padding: 22px 18px; } .card-question { font-size: .95rem; } .opt { font-size: .82rem; } }
</style>

<script>
const ALL = [{"id": "nav-01", "ch": "1", "lab": false, "q": "Je weet niet meer waar je bent in de terminal. Welk commando toont het absolute pad van de map waarin je nu staat?", "a": "pwd", "w": ["cd", "ls -d", "echo ~"], "method": "pwd", "detail": "print working directory. Toont het absolute pad, bv. `/home/hogent`.", "uitleg": "pwd = print working directory: toont het absolute pad van de map waarin je staat", "waarom": "pwd = print working directory. ✗ cd zonder argument brengt je naar je home-map · ls -d toont enkel `.` · echo ~ toont altijd je home-map, niet waar je staat."}, {"id": "nav-02", "ch": "1", "lab": false, "q": "Je staat in /etc. Welk commando brengt je naar je eigen home-map (/home/hogent)?", "a": "cd ~", "w": ["cd /", "cd ..", "cd /home"], "method": "cd   ·   cd ~   ·   cd $HOME", "detail": "`cd` zonder argument brengt je altijd naar huis.", "uitleg": "cd = change directory: ga naar een andere map · ~ = je home-map (/home/hogent) · cd zonder argument = ook naar je home-map · $HOME = variabele met het pad van je home-map", "waarom": "~ is je home-map (cd zonder argument werkt ook). ✗ / is de root van het bestandssysteem · .. is de bovenliggende map (vanuit /etc is dat /) · /home is de map met álle home-mappen, niet de jouwe."}, {"id": "nav-03", "ch": "1", "lab": false, "q": "Je staat in /home/hogent/scripts. Welk commando brengt je naar /home/hogent?", "a": "cd ..", "w": ["cd .", "cd ../..", "cd ~/.."], "method": "cd ..", "detail": "`..` = bovenliggende map, `.` = huidige map.", "uitleg": "cd = change directory · .. = de bovenliggende map (één niveau hoger) · . = de huidige map", "waarom": ".. = één map hoger. ✗ . = de huidige map (je blijft staan) · ../.. = twee mappen hoger (/home) · ~/.. = de map boven je home-map (/home)."}, {"id": "nav-04", "ch": "1", "lab": false, "q": "Je ging met cd van ~/scripts naar /var/log. Welk commando brengt je in één keer terug naar ~/scripts, de map waar je net was?", "a": "cd -", "w": ["cd ..", "cd ~", "cd !$"], "method": "cd -", "detail": "Handig om te wisselen tussen twee mappen.", "uitleg": "cd = change directory · - = de vorige map waar je stond (Bash onthoudt die in $OLDPWD)", "waarom": "`cd -` springt naar de vorige map ($OLDPWD). ✗ cd .. gaat naar /var · cd ~ gaat naar je home-map · !$ is het laatste argument van het vorige commando (/var/log), dus je blijft staan."}, {"id": "nav-05", "ch": "1", "lab": false, "q": "Welk van deze paden is een absoluut pad?", "a": "/home/hogent/scripts", "w": ["home/hogent/scripts", "../hogent/scripts", "./hogent/scripts"], "method": "Absoluut begint met /\nRelatief vertrekt vanaf de huidige map", "detail": "`/home/hogent/scripts` = absoluut.\n`scripts/task` = relatief (vanuit je home).\n⚠ In cron altijd absolute paden.", "waarom": "Een absoluut pad begint met /, vanaf de root. De andere drie zijn relatief: ze hangen af van de map waarin je staat."}, {"id": "nav-06", "ch": "1", "lab": false, "q": "Met welk ls-commando zie je ook de verborgen bestanden, zoals .bashrc?", "a": "ls -a", "w": ["ls -h", "ls -d", "ls -F"], "method": "ls -a", "detail": "Verborgen bestanden beginnen met een punt. `-A` toont ze ook, maar zonder `.` en `..`.", "uitleg": "ls = list: toon de inhoud van een map · -a = all: ook verborgen bestanden (die met een punt beginnen), inclusief . en ..", "waarom": "-a = all, ook namen die met een punt beginnen. ✗ -h = leesbare groottes (enkel nuttig met -l) · -d = toon de map zelf, niet de inhoud · -F = zet een teken achter elke naam (/ voor mappen, * voor uitvoerbare bestanden)."}, {"id": "nav-07", "ch": "1", "lab": false, "q": "Welk ls-commando toont per bestand de rechten, eigenaar, groep, grootte en wijzigingsdatum?", "a": "ls -l", "w": ["ls -1", "ls -i", "ls -s"], "method": "ls -l", "detail": "Eerste kolom = type + rechten, bv. `-rwxr-xr-x`.", "uitleg": "ls = list · -l = long: lange lijst met type + rechten, aantal links, eigenaar, groep, grootte, datum en naam", "waarom": "-l = long listing. ✗ -1 (cijfer één) = één naam per regel · -i = toon het inode-nummer · -s = toon enkel de grootte in blokken."}, {"id": "nav-08", "ch": "1", "lab": false, "q": "Toon een lange lijst (ls -l) waarin de groottes leesbaar zijn voor mensen (K, M, G).", "a": "ls -lh", "w": ["ls -ls", "ls -lS", "ls -la"], "method": "ls -lh", "detail": "`-h` = human readable. Werkt ook bij `du -h` en `df -h`.", "uitleg": "ls = list · -l = long: lange lijst · -h = human readable: groottes in K, M, G in plaats van bytes (enkel zinvol samen met -l)", "waarom": "-h = human-readable. ✗ -s = grootte in blokken · -S = sorteer op grootte · -a = toon ook verborgen bestanden."}, {"id": "nav-09", "ch": "1", "lab": false, "q": "Toon een lange lijst (ls -l), gesorteerd op wijzigingstijd, met het nieuwste bestand bovenaan.", "a": "ls -lt", "w": ["ls -ltr", "ls -lS", "ls -lr"], "method": "ls -lt", "detail": "`-r` keert om: `ls -ltr` zet het nieuwste onderaan.", "uitleg": "ls = list · -l = long: lange lijst · -t = time: sorteer op wijzigingstijd, nieuwste bovenaan", "waarom": "-t = sorteer op tijd, nieuwste eerst. ✗ -tr = op tijd maar omgekeerd (oudste bovenaan) · -S = op grootte · -r = alfabetisch omgekeerd."}, {"id": "nav-10", "ch": "1", "lab": false, "q": "Welk ls-commando toont de inhoud van een map én van al haar submappen (recursief)?", "a": "ls -R", "w": ["ls -r", "ls -d", "ls -A"], "method": "ls -R", "detail": "R = recursief.", "uitleg": "ls = list · -R = recursive: toon ook de inhoud van alle submappen (hoofdletter R! kleine -r = reverse)", "waarom": "-R (hoofdletter) = recursief. ✗ -r (kleine letter) = omgekeerde sorteervolgorde · -d = de map zelf · -A = verborgen bestanden zonder . en .."}, {"id": "nav-11", "ch": "1", "lab": false, "q": "In de uitvoer van ls -l begint een regel met `drwxr-xr-x`. Wat betekent de eerste letter d?", "a": "het is een map (directory)", "w": ["het is een apparaatbestand (device)", "iedereen mag het verwijderen (delete)", "het is een symbolische link"], "method": "d = directory (map)", "detail": "`-` = gewoon bestand, `l` = symbolische link.", "waarom": "Eerste teken = bestandstype: - gewoon bestand, d map, l symbolische link, c/b apparaatbestand."}, {"id": "nav-12", "ch": "1", "lab": false, "q": "Maak in de huidige map een nieuwe, lege map met de naam labo.", "a": "mkdir labo", "w": ["touch labo", "md labo", "ln -s labo"], "method": "mkdir labo", "detail": "Bestaat ze al, dan krijg je een fout.", "uitleg": "mkdir = make directory: maak een map · labo = naam van de nieuwe map", "waarom": "mkdir = make directory. ✗ touch maakt een leeg bestánd · md is een Windows-commando · ln -s labo maakt een symbolische link."}, {"id": "nav-13", "ch": "1", "lab": false, "q": "Maak het pad a/b/c in één commando, ook als de mappen a en a/b nog niet bestaan.", "a": "mkdir -p a/b/c", "w": ["mkdir -r a/b/c", "mkdir -v a/b/c", "mkdir a b c"], "method": "mkdir -p a/b/c", "detail": "`-p` = parents. Geeft ook geen fout als de map al bestaat.\n⚠ Zonder `-p`: No such file or directory.", "uitleg": "mkdir = make directory · -p = parents: maak ontbrekende bovenliggende mappen mee aan, en geen fout als de map al bestaat · a/b/c = het pad dat aangemaakt wordt", "waarom": "-p = parents: maak ontbrekende bovenliggende mappen mee aan. ✗ -r bestaat niet bij mkdir · -v = verbose (toont wat er gebeurt, maar faalt zonder a) · `mkdir a b c` maakt drie aparte mappen naast elkaar."}, {"id": "nav-14", "ch": "1", "lab": false, "q": "Maak een nieuw, leeg bestand notes.txt aan zonder een editor te openen.", "a": "touch notes.txt", "w": ["cat notes.txt", "mkdir notes.txt", "less notes.txt"], "method": "touch notes.txt", "detail": "Bestaat het al, dan past `touch` enkel de tijdstempel aan.", "uitleg": "touch = maak een leeg bestand aan (of werk enkel de tijdstempel bij als het al bestaat) · notes.txt = bestandsnaam", "waarom": "touch maakt een leeg bestand als het nog niet bestaat. ✗ cat en less tonen een bestand (fout als het niet bestaat) · mkdir maakt een map."}, {"id": "nav-15", "ch": "1", "lab": false, "q": "Kopieer het bestand a.txt naar een nieuw bestand b.txt; a.txt moet blijven bestaan.", "a": "cp a.txt b.txt", "w": ["cp b.txt a.txt", "mv a.txt b.txt", "mv b.txt a.txt"], "method": "cp a.txt b.txt", "detail": "Het origineel blijft staan. Bestaat b.txt al, dan wordt het zonder vraag overschreven.", "uitleg": "cp = copy: kopieer · a.txt = bron (eerst) · b.txt = doel (daarna). Bestaat het doel al, dan wordt het zonder vraag overschreven", "waarom": "cp BRON DOEL: eerst wat je kopieert, dan waar het heen moet. ✗ mv verplaatst/hernoemt: a.txt zou verdwijnen."}, {"id": "nav-16", "ch": "1", "lab": false, "q": "Kopieer de map scripts met alle bestanden erin naar een nieuwe map backup.", "a": "cp -r scripts backup", "w": ["cp scripts backup", "cp -i scripts backup", "mv scripts backup"], "method": "cp -r scripts backup", "detail": "`-r` = recursief. ⚠ Zonder `-r`: omitting directory.", "uitleg": "cp = copy · -r = recursive: kopieer een map met alles erin · scripts = bronmap · backup = doelmap", "waarom": "-r = recursief: ook alle inhoud. ✗ zonder -r weigert cp een map ('omitting directory') · -i vraagt enkel bevestiging · mv kopieert niet maar verplaatst."}, {"id": "nav-17", "ch": "1", "lab": false, "q": "Kopieer bron naar doel, maar laat cp eerst om bevestiging vragen als doel al bestaat.", "a": "cp -i bron doel", "w": ["cp -f bron doel", "cp -n bron doel", "cp -u bron doel"], "method": "cp -i bron doel", "detail": "`-i` = interactive. Werkt ook bij `mv` en `rm`.", "uitleg": "cp = copy · -i = interactive: vraag bevestiging voor je een bestaand bestand overschrijft · bron = wat je kopieert · doel = waar het naartoe gaat", "waarom": "-i = interactive. ✗ -f = force (overschrijft zonder vragen) · -n = no-clobber (overschrijft nooit, vraagt ook niets) · -u = update (enkel als bron nieuwer is)."}, {"id": "nav-18", "ch": "1", "lab": false, "q": "Welke twee taken doe je allebei met het commando mv?", "a": "verplaatsen en hernoemen", "w": ["kopiëren en hernoemen", "verplaatsen en kopiëren", "kopiëren en linken"], "method": "Verplaatsen én hernoemen", "detail": "`mv a.txt map/` = verplaatsen.\n`mv a.txt b.txt` = hernoemen.\n⚠ `mv` kopieert niet: het origineel is weg.", "waarom": "mv = move: `mv a.txt map/` verplaatst, `mv a.txt b.txt` hernoemt. Kopiëren doe je met cp, linken met ln."}, {"id": "nav-19", "ch": "1", "lab": false, "q": "Hernoem het bestand task-start.sh naar task.sh.", "a": "mv task-start.sh task.sh", "w": ["mv task.sh task-start.sh", "cp task-start.sh task.sh", "cp task.sh task-start.sh"], "method": "mv task-start.sh task.sh", "detail": "In Linux is hernoemen = verplaatsen naar een nieuwe naam.", "uitleg": "mv = move: verplaatsen of hernoemen · task-start.sh = oude naam · task.sh = nieuwe naam", "waarom": "mv OUD NIEUW. ✗ omgekeerde volgorde zoekt een task.sh die nog niet bestaat · cp laat het origineel staan, dus dat is kopiëren, geen hernoemen."}, {"id": "nav-20", "ch": "1", "lab": false, "q": "Verwijder het gewone bestand oud.txt.", "a": "rm oud.txt", "w": ["rmdir oud.txt", "unset oud.txt", "> oud.txt"], "method": "rm oud.txt", "detail": "⚠ Geen prullenbak: weg is weg.", "uitleg": "rm = remove: verwijder een bestand definitief (geen prullenbak) · oud.txt = het bestand", "waarom": "rm = remove. ✗ rmdir werkt enkel op lege mappen · unset verwijdert een shellvariabele · > oud.txt maakt het bestand leeg, maar het blijft bestaan."}, {"id": "nav-21", "ch": "1", "lab": false, "q": "De map oud/ bevat nog bestanden. Welk commando verwijdert de map mét alle inhoud?", "a": "rm -r oud", "w": ["rmdir oud", "rm oud", "rmdir -p oud"], "method": "Leeg: rmdir map\nVol: rm -r map", "detail": "`rm -rf` vraagt niets meer. ⚠ Dubbelcheck je pad, zeker met sudo.", "uitleg": "rmdir = remove directory: verwijdert enkel een lege map · rm -r = remove recursive: verwijdert een map met alles erin · map = naam van de map", "waarom": "-r = recursief. ✗ rmdir (ook met -p) werkt enkel op lege mappen · rm zonder -r weigert een map."}, {"id": "nav-22", "ch": "1", "lab": false, "q": "Zoek in je home-map en alle submappen naar bestanden waarvan de náám eindigt op .sh.", "a": "find ~ -name '*.sh'", "w": ["find ~ -type '*.sh'", "grep -r '\\.sh$' ~", "ls -R ~ '*.sh'"], "method": "find ~ -name '*.sh'", "detail": "⚠ Zet het patroon tussen quotes, anders werkt de shell de `*` zelf uit.", "uitleg": "find = zoek bestanden · ~ = vertrekpunt: je home-map · -name = zoek op naam · '*.sh' = patroon (tussen quotes, zodat find de * verwerkt en niet de shell)", "waarom": "find MAP -name 'PATROON'; de quotes zorgen dat find de * krijgt en niet de shell. ✗ -type verwacht f, d, l… · grep -r zoekt in de inhoud van bestanden, niet in de namen · ls kent geen zoekpatroon: '*.sh' wordt gezocht als letterlijke naam."}, {"id": "nav-23", "ch": "1", "lab": false, "q": "Zoek in je home-map enkel naar mappen (geen bestanden) met precies de naam .git.", "a": "find ~ -type d -name .git", "w": ["find ~ -type f -name .git", "find ~ -type d -path .git", "find ~ -type f -path .git"], "method": "find ~ -type d -name .git", "detail": "`-type f` = bestand, `-type d` = map.", "uitleg": "find = zoek bestanden · ~ = vertrekpunt: je home-map · -type d = enkel directories (mappen); -type f = enkel gewone bestanden · -name .git = met deze naam", "waarom": "-type d = directory, -name vergelijkt enkel de naam. ✗ -type f = gewone bestanden · -path vergelijkt het volledige pad (~/x/.git), dus `.git` alleen matcht nooit."}, {"id": "nav-24", "ch": "1", "lab": false, "q": "Je typt `ls *.txt`. Wie vervangt de * door de echte bestandsnamen, en wanneer?", "a": "de shell, nog vóór ls start", "w": ["ls zelf, tijdens het oplijsten", "de shell, nadat ls klaar is", "ls zelf, vóór het oplijsten"], "method": "Toont alle bestanden die op .txt eindigen", "detail": "De **shell** doet de globbing, niet `ls`. `ls` krijgt al de lijst van bestandsnamen.", "waarom": "Globbing gebeurt door de shell. ls krijgt al een lijst namen (a.txt b.txt …) en ziet de * nooit."}, {"id": "nav-25", "ch": "1", "lab": false, "q": "Globbing: welke bestandsnamen matcht `ls file?`?", "a": "file gevolgd door precies één teken", "w": ["file gevolgd door nul of meer tekens", "file gevolgd door precies één cijfer", "file gevolgd door nul of één teken"], "method": "file + precies één teken", "detail": "Bv. file1, fileA. `?` = 1 teken, `*` = 0 of meer, `[0-9]` = één cijfer.", "waarom": "In een glob is ? precies één willekeurig teken (file1, fileA, file_), niet `file` en niet `file12`. Nul of meer = *, één cijfer = [0-9]."}, {"id": "nav-26", "ch": "1", "lab": false, "q": "Hoeveel schijfruimte neemt de map ~/data in? Je wil één leesbaar totaal (bv. 1.2G).", "a": "du -sh ~/data", "w": ["du -h ~/data", "df -h ~/data", "ls -sh ~/data"], "method": "du -sh map   ·   df -h", "detail": "du = disk usage (een map), df = disk free (het bestandssysteem).", "uitleg": "du = disk usage: hoeveel plaats een map gebruikt · -s = summarize: enkel het totaal · -h = human readable · map = de map · df = disk free: vrije ruimte per bestandssysteem · -h = human readable", "waarom": "du = disk usage, -s = summary (één totaal), -h = leesbaar. ✗ du -h zonder -s toont elke submap apart · df toont de vrije ruimte van het hele bestandssysteem · ls -s toont enkel de bestanden in de map, niet de submappen."}, {"id": "nav-27", "ch": "1", "lab": true, "q": "Labo First VM: hoe zet je de VM het netst uit, zodat het besturingssysteem alles correct afsluit?", "a": "sudo poweroff in de VM", "w": ["sudo reboot in de VM", "VBoxManage controlvm VM poweroff op de host", "VBoxManage controlvm VM savestate op de host"], "method": "Goed: 'De staat van de machine opslaan', afsluiten via het startmenu, of sudo poweroff\nNooit: venster sluiten + 'De machine uitschakelen'", "detail": "Uitschakelen = stroom onderbreken: kans op corrupte bestanden.", "uitleg": "sudo = als root uitvoeren · poweroff = sluit het systeem netjes af (programma's stoppen, buffers worden weggeschreven)", "waarom": "poweroff in de VM laat Linux zelf netjes afsluiten. ✗ reboot herstart · controlvm poweroff trekt virtueel de stekker uit · savestate bevriest de VM in plaats van ze af te sluiten."}, {"id": "nav-28", "ch": "1", "lab": true, "q": "Labo First VM: wanneer neem je best een snapshot?", "a": "na de configuratie, vóór je gaat experimenteren", "w": ["vlak nadat er iets kapot is gegaan", "enkel bij de allereerste installatie, daarna nooit meer", "pas op het einde van het semester"], "method": "Na de installatie/configuratie, vóór je gaat experimenteren\nMachine > Snapshot maken (kan terwijl de VM draait)", "detail": "Jij: `snap naam` op Ubuntu.", "waarom": "Een snapshot is een terugkeerpunt naar een werkende toestand: neem het wanneer alles werkt, vóór je iets riskants doet."}, {"id": "nav-29", "ch": "1", "lab": true, "q": "Labo First VM: met welke VirtualBox-instelling kan je tekst kopiëren en plakken tussen je laptop en de VM, in beide richtingen?", "a": "Apparaten > Gedeeld klembord > Bidirectioneel", "w": ["Apparaten > Gedeeld klembord > Gast naar host", "Apparaten > Drag-and-drop > Bidirectioneel", "Apparaten > Drag-and-drop > Host naar gast"], "method": "VirtualBox: Apparaten > Gedeeld klembord > Bidirectioneel", "detail": "", "waarom": "Kopiëren/plakken = klembord; bidirectioneel = in beide richtingen. Drag-and-drop is voor bestanden slepen. 'Gast naar host' werkt maar in één richting."}, {"id": "nav-30", "ch": "1", "lab": false, "q": "Toon de map project en al haar submappen als grafische boomstructuur (met ├── en └──).", "a": "tree project", "w": ["ls -R project", "du -a project", "find project -type d"], "method": "tree map", "detail": "Eventueel eerst installeren: `sudo apt install tree`.", "uitleg": "tree = toon een map en al haar submappen als boomstructuur · map = de map om te tonen", "waarom": "tree tekent de boom. ✗ ls -R toont de mappen na elkaar als lijsten · du -a toont groottes per bestand · find -type d toont enkel de paden van de mappen, zonder boomtekening."}, {"id": "nav-31", "ch": "1", "lab": false, "q": "link is een symbolische link die via een andere link naar een bestand wijst. Welk commando toont het volledige, uiteindelijke pad van dat bestand?", "a": "readlink -f link", "w": ["readlink link", "realpath -s link", "ls -l link"], "method": "readlink -f link", "detail": "Cursus: `readlink -f $(which rename)`.", "uitleg": "readlink = toon waar een symbolische link naar wijst · -f = follow: volg alle links tot het echte bestand en toon het volledige pad · link = de link", "waarom": "-f volgt alle links tot het einde en geeft een absoluut pad. ✗ readlink zonder -f en ls -l tonen maar één stap · realpath -s volgt de links juist níet."}, {"id": "nav-32", "ch": "1", "lab": false, "q": "In het commando `ls -l /etc`: wat zijn -l en /etc?", "a": "-l is een optie, /etc is een argument", "w": ["-l is een argument, /etc is een optie", "-l en /etc zijn allebei opties", "-l en /etc zijn allebei argumenten"], "method": "-l is een optie, /etc is een argument", "detail": "", "uitleg": "", "waarom": "Een optie (met -) verandert hoe het commando werkt; een argument zegt waarop het werkt (hier: de map /etc)."}, {"id": "nav-33", "ch": "1", "lab": false, "q": "Welk commando doet exact hetzelfde als `ls -a -l`?", "a": "ls -al", "w": ["ls --al", "ls -A -l", "ls -a,l"], "method": "ls -al", "detail": "", "uitleg": "", "waarom": "Korte opties mag je samenvoegen achter één streepje: -a -l = -al = -la. ✗ --al is een (onbestaande) lange optie · -A verbergt . en .. · een komma is geen scheidingsteken."}, {"id": "nav-34", "ch": "1", "lab": false, "q": "Je weet niet welk commando een wachtwoord wijzigt. Hoe doorzoek je de korte beschrijvingen van álle man pages op het trefwoord password?", "a": "man -k password", "w": ["man -f password", "man password", "help password"], "method": "man -k password", "detail": "", "uitleg": "", "waarom": "man -k (= apropos) zoekt het trefwoord in de beschrijvingen. ✗ man -f (= whatis) zoekt enkel een exacte commandonaam · man password opent een pagina die zo heet (bestaat niet) · help is enkel voor shell-builtins."}, {"id": "nav-35", "ch": "1", "lab": false, "q": "Wat vind je in sectie 5 van de man pages, bijvoorbeeld met `man 5 passwd`?", "a": "het formaat van configuratiebestanden (/etc/passwd)", "w": ["het gewone commando passwd om een wachtwoord te wijzigen", "beheercommando's die enkel root gebruikt, zoals useradd", "de C-functies waarmee programma's wachtwoorden opvragen"], "method": "het formaat van configuratiebestanden (/etc/passwd)", "detail": "", "uitleg": "", "waarom": "Secties: 1 gewone commando's (passwd), 3 C-bibliotheekfuncties, 5 bestandsformaten (/etc/passwd), 7 overzichten (glob, regex), 8 beheercommando's (useradd)."}, {"id": "nav-36", "ch": "1", "lab": false, "q": "De SYNOPSIS van cp is `cp [OPTION]... SOURCE... DIRECTORY`. Wat leer je daaruit?", "a": "opties zijn optioneel, en je mag meerdere bronnen geven vóór de doelmap", "w": ["opties zijn verplicht, en je mag meerdere bronnen geven vóór de doelmap", "opties zijn optioneel, maar je mag maar één bron geven vóór de doelmap", "opties zijn verplicht, maar je mag maar één bron geven vóór de doelmap"], "method": "opties zijn optioneel, en je mag meerdere bronnen geven vóór de doelmap", "detail": "", "uitleg": "", "waarom": "[ ] = optioneel; ... = mag herhaald worden. Dus `cp -v a.txt b.txt backup/` mag."}, {"id": "nav-37", "ch": "1", "lab": false, "q": "FHS: in welke map staan de systeembrede configuratiebestanden (bv. ssh, apache2, passwd)?", "a": "/etc", "w": ["/usr", "/var", "/opt"], "method": "/etc", "detail": "", "uitleg": "", "waarom": "/etc = configuratie. /usr = geïnstalleerde programma's en bibliotheken, /var = data die verandert (logs, databanken), /opt = extra software van derden."}, {"id": "nav-38", "ch": "1", "lab": false, "q": "FHS: in welke map staan logbestanden, zoals de access log van Apache?", "a": "/var/log", "w": ["/var/lib", "/var/cache", "/etc/apache2"], "method": "/var/log", "detail": "", "uitleg": "", "waarom": "/var/log (Apache: /var/log/apache2/). /var/lib = toestandsdata van programma's (bv. databanken), /var/cache = cache, /etc/apache2 = configuratie."}, {"id": "nav-39", "ch": "1", "lab": false, "q": "FHS: wat is de home-map van de gebruiker root?", "a": "/root", "w": ["/home/root", "/", "/home"], "method": "/root", "detail": "", "uitleg": "", "waarom": "root heeft een eigen home-map /root, los van /home, zodat root kan werken als /home niet beschikbaar is."}, {"id": "nav-40", "ch": "1", "lab": false, "q": "FHS: welke map bevat virtuele bestanden met informatie over draaiende processen (bv. /…/1234/status)?", "a": "/proc", "w": ["/dev", "/boot", "/srv"], "method": "/proc", "detail": "", "uitleg": "", "waarom": "/proc wordt door de kernel opgebouwd: per proces een map met zijn PID. /dev = apparaatbestanden, /boot = kernel en bootloader, /srv = data die de server aanbiedt."}, {"id": "nav-41", "ch": "1", "lab": false, "q": "FHS: waar staan normaal de programma's die elke gebruiker kan uitvoeren, zoals ls en grep?", "a": "/usr/bin", "w": ["/usr/sbin", "/usr/lib", "/usr/share"], "method": "/usr/bin", "detail": "", "uitleg": "", "waarom": "bin = binaries voor iedereen. sbin = beheercommando's voor root, lib = bibliotheken, share = architectuuronafhankelijke data (man pages, iconen)."}, {"id": "nav-42", "ch": "1", "lab": false, "q": "FHS: welke map is bedoeld voor tijdelijke bestanden en wordt meestal leeggemaakt bij een herstart?", "a": "/tmp", "w": ["/var/tmp", "/var/cache", "/opt"], "method": "/tmp", "detail": "", "uitleg": "", "waarom": "/tmp wordt bij een herstart gewist. /var/tmp is óók tijdelijk, maar blijft bewaard na een herstart."}, {"id": "nav-43", "ch": "1", "lab": false, "q": "notes.txt bestaat al en bevat tekst. Wat doet `touch notes.txt`?", "a": "de wijzigingstijd wordt bijgewerkt, de inhoud blijft", "w": ["de wijzigingstijd blijft, de inhoud blijft", "de wijzigingstijd wordt bijgewerkt, het bestand wordt leeggemaakt", "de wijzigingstijd blijft, het bestand wordt leeggemaakt"], "method": "de wijzigingstijd wordt bijgewerkt, de inhoud blijft", "detail": "", "uitleg": "", "waarom": "touch zet de tijdstempel op 'nu'. Een bestaand bestand wordt nooit leeggemaakt (dat doet `> notes.txt`)."}, {"id": "nav-44", "ch": "1", "lab": false, "q": "data.csv heeft een header op regel 1. Welk commando toont alles behalve die eerste regel?", "a": "tail -n +2 data.csv", "w": ["tail -n -2 data.csv", "head -n +2 data.csv", "head -n -2 data.csv"], "method": "tail -n +2 data.csv", "detail": "", "uitleg": "", "waarom": "tail -n +2 = begin vanaf regel 2. ✗ tail -n -2 = de laatste 2 regels · head -n +2 = de eerste 2 regels · head -n -2 = alles behalve de laatste 2 regels."}, {"id": "nav-45", "ch": "1", "lab": false, "q": "Je wil een lang logbestand pagina per pagina lezen en erin zoeken. Welk commando gebruik je?", "a": "less app.log", "w": ["cat app.log", "tail app.log", "wc app.log"], "method": "less app.log", "detail": "", "uitleg": "", "waarom": "less = pager: spatie bladert, /woord zoekt, q stopt. cat dumpt alles in één keer, tail toont het einde, wc telt."}, {"id": "nav-46", "ch": "1", "lab": false, "q": "Maak een hard link met de naam copy die naar hetzelfde bestand wijst als orig.txt.", "a": "ln orig.txt copy", "w": ["ln copy orig.txt", "ln -s orig.txt copy", "ln -s copy orig.txt"], "method": "ln orig.txt copy", "detail": "", "uitleg": "", "waarom": "ln DOEL LINKNAAM, zoals bij cp. Zonder -s = hard link; met -s = symbolische link."}, {"id": "nav-47", "ch": "1", "lab": false, "q": "orig.txt heeft een hard link hard.txt en een symbolische link sym.txt. Je verwijdert orig.txt. Wat gebeurt er?", "a": "hard.txt toont nog de inhoud; sym.txt is gebroken", "w": ["hard.txt is gebroken; sym.txt toont nog de inhoud", "beide tonen nog de inhoud", "beide zijn gebroken"], "method": "hard.txt toont nog de inhoud; sym.txt is gebroken", "detail": "", "uitleg": "", "waarom": "Een hard link is een tweede naam voor dezelfde inode: de data blijft zolang er een naam is. Een symlink bevat enkel het pad orig.txt, en dat bestaat niet meer (dangling link)."}, {"id": "nav-48", "ch": "1", "lab": false, "q": "Hoe controleer je of a.txt en b.txt hard links naar hetzelfde bestand zijn?", "a": "ls -i toont voor beide hetzelfde inode-nummer", "w": ["ls -l toont bij beide een pijl -> naar de ander", "diff a.txt b.txt geeft geen enkele output", "readlink -f geeft voor beide hetzelfde pad"], "method": "ls -i toont voor beide hetzelfde inode-nummer", "detail": "", "uitleg": "", "waarom": "Hard links delen één inode. ✗ de pijl -> zie je enkel bij symlinks · dezelfde inhoud (diff) kan ook bij twee aparte kopieën · readlink volgt enkel symlinks."}, {"id": "nav-49", "ch": "1", "lab": false, "q": "Welke beperking heeft een hard link, die een symbolische link niet heeft?", "a": "ze kan niet naar een map of ander bestandssysteem wijzen", "w": ["ze werkt niet meer zodra het origineel verwijderd wordt", "ze neemt evenveel schijfruimte in als het origineel", "ze kan enkel door root aangemaakt worden, niet door jou"], "method": "ze kan niet naar een map of ander bestandssysteem wijzen", "detail": "", "uitleg": "", "waarom": "Een hard link verwijst naar een inode, en inodes bestaan maar binnen één bestandssysteem. ✗ breken na verwijderen = symlink · een hard link kost geen extra data · elke gebruiker kan er maken."}, {"id": "nav-50", "ch": "1", "lab": false, "q": "Hoe herken je een symbolische link in de uitvoer van `ls -l`?", "a": "de regel begint met l en toont naam -> doel", "w": ["de regel begint met s en toont naam -> doel", "de regel begint met l en toont het doel tussen haakjes", "de regel begint met s en toont het doel tussen haakjes"], "method": "de regel begint met l en toont naam -> doel", "detail": "", "uitleg": "", "waarom": "Type l = link, en ls -l toont `sym.txt -> orig.txt`. (Een s in de rechten is setuid/setgid, geen type.)"}, {"id": "filt-01", "ch": "2", "lab": false, "q": "Toon de volledige inhoud van het bestand ~/.taskrc op het scherm.", "a": "cat ~/.taskrc", "w": ["echo ~/.taskrc", "head ~/.taskrc", "file ~/.taskrc"], "method": "cat ~/.taskrc", "detail": "Voor lange bestanden: `less`.", "uitleg": "cat = concatenate: toon de volledige inhoud van een of meer bestanden · ~/.taskrc = het bestand .taskrc in je home-map", "waarom": "cat toont alles. ✗ echo drukt enkel de naam af · head toont maar de eerste 10 regels · file zegt welk soort bestand het is."}, {"id": "filt-02", "ch": "2", "lab": false, "q": "Je bekijkt een bestand in less. Hoe zoek je vóóruit naar 'woord', spring je naar de volgende match en sluit je less af?", "a": "/woord, n, q", "w": ["?woord, n, q", "/woord, N, q", "?woord, N, q"], "method": "less bestand\n/woord zoeken · n volgende · q stoppen", "detail": "Zelfde toetsen als in `man`.", "uitleg": "less = toon een bestand pagina per pagina · /woord = zoek vooruit · n = volgende match · q = quit: stoppen · bestand = het bestand", "waarom": "/ zoekt vooruit, ? achteruit; n = volgende match in dezelfde richting, N = in de andere richting; q = quit. Werkt ook in man."}, {"id": "filt-03", "ch": "2", "lab": false, "q": "Toon de eerste 5 regels van bestand.txt.", "a": "head -n 5 bestand.txt", "w": ["head -c 5 bestand.txt", "tail -n 5 bestand.txt", "tail -c 5 bestand.txt"], "method": "head -n 5 bestand", "detail": "Zonder `-n`: standaard 10 regels.", "uitleg": "head = toon het begin van een bestand · -n 5 = number: de eerste 5 regels (standaard 10) · bestand = het bestand", "waarom": "head = begin, tail = einde; -n telt regels, -c telt bytes (tekens)."}, {"id": "filt-04", "ch": "2", "lab": false, "q": "Toon de laatste 20 regels van bestand.txt.", "a": "tail -n 20 bestand.txt", "w": ["tail -n +20 bestand.txt", "head -n 20 bestand.txt", "head -n -20 bestand.txt"], "method": "tail -n 20 bestand", "detail": "", "uitleg": "tail = toon het einde van een bestand · -n 20 = number: de laatste 20 regels · bestand = het bestand", "waarom": "tail -n 20 = laatste 20. ✗ tail -n +20 = alles vanaf regel 20 · head -n 20 = eerste 20 · head -n -20 = alles behalve de laatste 20."}, {"id": "filt-05", "ch": "2", "lab": false, "q": "Volg access.log live: nieuwe regels moeten meteen op het scherm verschijnen tot je Ctrl+C geeft.", "a": "tail -f access.log", "w": ["tail -n 0 access.log", "cat access.log", "wc -l access.log"], "method": "tail -f /var/log/apache2/access.log", "detail": "Stoppen met Ctrl+C.", "uitleg": "tail = toon het einde van een bestand · -f = follow: blijf het bestand volgen en toon nieuwe regels zodra ze erbij komen (stoppen met Ctrl+C) · /var/log/apache2/access.log = het Apache-toegangslog", "waarom": "-f = follow: tail blijft wachten op nieuwe regels. ✗ tail -n 0 toont 0 regels en stopt · cat toont de huidige inhoud en stopt · wc -l telt."}, {"id": "filt-06", "ch": "2", "lab": false, "q": "Tel hoeveel regels bestand.txt telt.", "a": "wc -l bestand.txt", "w": ["wc -w bestand.txt", "wc -c bestand.txt", "wc -m bestand.txt"], "method": "wc -l bestand", "detail": "`-w` = woorden, `-c` = bytes.", "uitleg": "wc = word count: tel regels, woorden, tekens · -l = lines: enkel het aantal regels · bestand = het bestand", "waarom": "wc = word count: -l regels (lines), -w woorden, -c bytes, -m tekens."}, {"id": "filt-07", "ch": "2", "lab": false, "q": "Toon alle regels uit app.log die het woord error bevatten.", "a": "grep error app.log", "w": ["grep app.log error", "grep -c error app.log", "grep -l error app.log"], "method": "grep error bestand", "detail": "Toont de volledige regels die matchen.", "uitleg": "grep = zoek regels die een patroon bevatten · error = het patroon (eerst) · bestand = waarin je zoekt (daarna)", "waarom": "grep PATROON BESTAND. ✗ omgekeerde volgorde zoekt 'app.log' in een bestand error · -c toont enkel het aantal · -l toont enkel de bestandsnaam."}, {"id": "filt-08", "ch": "2", "lab": false, "q": "Welke grep-optie zoekt hoofdletterongevoelig, zodat error, Error en ERROR allemaal matchen?", "a": "grep -i", "w": ["grep -I", "grep -w", "grep -E"], "method": "grep -i", "detail": "Matcht dan Error, ERROR, error.", "uitleg": "grep = zoek regels met een patroon · -i = ignore case: hoofdletterongevoelig", "waarom": "-i = ignore case. ✗ -I = sla binaire bestanden over · -w = enkel hele woorden · -E = extended regex."}, {"id": "filt-09", "ch": "2", "lab": false, "q": "Welke grep-optie toont de regels die NIET matchen?", "a": "grep -v", "w": ["grep -n", "grep -x", "grep -L"], "method": "grep -v", "detail": "v = invert.", "uitleg": "grep = zoek regels met een patroon · -v = invert: toon juist de regels die NIET matchen", "waarom": "-v = invert. ✗ -n = regelnummers · -x = de hele regel moet matchen · -L = namen van bestanden zonder match."}, {"id": "filt-10", "ch": "2", "lab": false, "q": "Welke grep-optie toont enkel hoeveel regels matchen (één getal)?", "a": "grep -c", "w": ["grep -n", "grep -l", "grep -o"], "method": "-n regelnummer   ·   -c aantal", "detail": "", "uitleg": "grep = zoek regels met een patroon · -n = line number: zet het regelnummer voor elke match · -c = count: toon enkel het aantal matchende regels", "waarom": "-c = count. ✗ -n = regelnummer vóór elke match · -l = enkel bestandsnamen · -o = enkel het gematchte stuk."}, {"id": "filt-11", "ch": "2", "lab": false, "q": "Welke grep-optie toont enkel het gematchte stuk tekst (bv. elk e-mailadres), niet de hele regel?", "a": "grep -o", "w": ["grep -w", "grep -x", "grep -b"], "method": "grep -o", "detail": "Zo haal je bv. alle `@context`-woorden uit task.sh.", "uitleg": "grep = zoek regels met een patroon · -o = only matching: toon enkel het gematchte stuk, elk op een eigen regel", "waarom": "-o = only matching. ✗ -w = enkel hele woorden · -x = hele regel moet matchen · -b = byte-positie tonen."}, {"id": "filt-12", "ch": "2", "lab": false, "q": "Met welke grep-optie gebruik je extended regex, zodat + ? {} | () werken zonder backslash?", "a": "grep -E", "w": ["grep -e", "grep -G", "grep -F"], "method": "grep -E", "detail": "Bv. `grep -E '[0-9]{4}-[0-9]{2}-[0-9]{2}'` voor een datum.", "uitleg": "grep = zoek regels met een patroon · -E = extended regex (ERE): + ? {} | () werken zonder backslash", "waarom": "-E = ERE. ✗ -e = geef een (extra) patroon op · -G = basic regex (de standaard) · -F = vaste tekst, geen regex."}, {"id": "filt-13", "ch": "2", "lab": false, "q": "In een if-test wil je enkel weten óf grep iets vindt, zonder enige output op het scherm. Welke optie?", "a": "grep -q", "w": ["grep -s", "grep -l", "grep -c"], "method": "grep -q", "detail": "Exit-status 0 = gevonden, 1 = niet gevonden. Handig in een `if`.", "uitleg": "grep = zoek regels met een patroon · -q = quiet: geen uitvoer, enkel de exit-status (0 = gevonden, 1 = niet gevonden)", "waarom": "-q = quiet: geen output, enkel de exit-status (0 = gevonden). ✗ -s verbergt enkel foutmeldingen · -l en -c tonen nog iets."}, {"id": "filt-14", "ch": "2", "lab": false, "q": "Sorteer een lijst getallen numeriek, met het grootste getal bovenaan.", "a": "sort -rn", "w": ["sort -rd", "sort -n", "sort -d"], "method": "sort   ·   sort -rn", "detail": "-n = numeriek, -r = omgekeerd.", "uitleg": "sort = sorteer regels (standaard alfabetisch) · -n = numeric: als getallen · -r = reverse: omgekeerd, dus aflopend", "waarom": "-n = numeriek, -r = omgekeerd. ✗ -d = woordenboekvolgorde (alfabetisch: 10 komt vóór 9) · zonder -r staat het kleinste bovenaan."}, {"id": "filt-15", "ch": "2", "lab": false, "q": "Je wil weten hoe vaak elke waarde in een lijst voorkomt. Welk stuk pipeline doet dat correct?", "a": "sort | uniq -c", "w": ["uniq -c | sort", "sort | uniq -d", "uniq -d | sort"], "method": "sort | uniq -c", "detail": "⚠ `uniq` vergelijkt enkel opeenvolgende regels: eerst `sort`!", "uitleg": "sort = sorteer, zodat gelijke regels naast elkaar komen · | = pipe: uitvoer links wordt invoer rechts · uniq = voeg opeenvolgende gelijke regels samen · -c = count: zet het aantal ervoor", "waarom": "uniq vergelijkt enkel opeenvolgende regels, dus eerst sorteren. -c = tel; -d = toon enkel de dubbele, zonder aantal."}, {"id": "filt-16", "ch": "2", "lab": false, "q": "Welk commando sorteert én houdt van elke regel maar één exemplaar over, in één keer (zonder te tellen)?", "a": "sort -u", "w": ["sort -c", "uniq -u", "uniq -c"], "method": "sort -u", "detail": "= `sort | uniq`.", "uitleg": "sort = sorteer · -u = unique: toon elke regel maar één keer (= sort | uniq)", "waarom": "sort -u = unique. ✗ sort -c controleert enkel óf het al gesorteerd is · uniq -u toont enkel regels die maar één keer voorkomen (en sorteert niet) · uniq -c telt."}, {"id": "filt-17", "ch": "2", "lab": false, "q": "Haal kolom 2 uit f.csv; de kolommen zijn gescheiden door een komma.", "a": "cut -d',' -f2 f.csv", "w": ["cut -d',' -c2 f.csv", "cut -d' ' -f2 f.csv", "cut -d' ' -c2 f.csv"], "method": "cut -d',' -f2 bestand.csv", "detail": "Standaard scheidingsteken van `cut` is TAB.", "uitleg": "cut = knip kolommen uit regels · -d',' = delimiter: het scheidingsteken is een komma (standaard TAB) · -f2 = field: kolom 2 · bestand.csv = het bestand", "waarom": "-d = delimiter (scheidingsteken), -f = field (kolom). ✗ -c = teken op positie 2 · -d' ' splitst op spaties."}, {"id": "filt-18", "ch": "2", "lab": false, "q": "Zet in de tekst alle kleine letters om naar hoofdletters.", "a": "tr '[:lower:]' '[:upper:]'", "w": ["tr '[:upper:]' '[:lower:]'", "tr -d '[:lower:]'", "tr -d '[:upper:]'"], "method": "tr '[:lower:]' '[:upper:]'", "detail": "`tr` leest enkel stdin: `cat f | tr ...` of `tr ... < f`.", "uitleg": "tr = translate: vervang tekens, leest enkel van stdin · '[:lower:]' = alle kleine letters (van) · '[:upper:]' = de overeenkomstige hoofdletters (naar)", "waarom": "tr VAN NAAR. ✗ omgekeerd maakt alles klein · -d verwijdert de tekens in plaats van ze om te zetten."}, {"id": "filt-19", "ch": "2", "lab": false, "q": "Vervang in bestand.txt zelf (het bestand moet aangepast worden) élke oud door nieuw, ook als het meerdere keren op één regel staat.", "a": "sed -i 's/oud/nieuw/g' bestand.txt", "w": ["sed -i 's/oud/nieuw/p' bestand.txt", "sed -n 's/oud/nieuw/g' bestand.txt", "sed -n 's/oud/nieuw/p' bestand.txt"], "method": "sed -i 's/oud/nieuw/g' bestand", "detail": "`g` = alle keren per regel. `-i` = in place.", "uitleg": "sed = stream editor · -i = in place: pas het bestand zelf aan · 's/oud/nieuw/g' = substitute: vervang oud door nieuw · g = global: alle keren per regel, niet enkel de eerste · bestand = het bestand", "waarom": "-i = in-place (in het bestand zelf), vlag g = global (alle keren per regel). ✗ vlag p = druk de gewijzigde regel (nog eens) af en vervangt enkel de eerste per regel · -n = druk niets automatisch af: het bestand verandert niet."}, {"id": "filt-20", "ch": "2", "lab": false, "q": "Druk met awk de eerste kolom af van f.tsv, waarin de kolommen gescheiden zijn door TABs.", "a": "awk -F'\\t' '{ print $1 }' f.tsv", "w": ["awk -F'\\t' '{ print $0 }' f.tsv", "awk -F',' '{ print $1 }' f.tsv", "awk -F',' '{ print $0 }' f.tsv"], "method": "awk -F'\\t' '{ print $1 }' bestand", "detail": "`-F` = veldscheider. Zonder `-F`: spaties/tabs.", "uitleg": "awk = tekstverwerking per regel en per kolom · -F'\\t' = field separator: kolommen gescheiden door een TAB · '{ print $1 }' = druk kolom 1 af voor elke regel · bestand = het bestand", "waarom": "-F = veldscheidingsteken; $1 = eerste veld, $0 = de hele regel."}, {"id": "filt-21", "ch": "2", "lab": false, "q": "cd is een shell-builtin. Welk commando toont zeker de hulptekst bij cd?", "a": "help cd", "w": ["which cd", "whatis cd", "type cd"], "method": "man ls   ·   ls --help   ·   help cd", "detail": "`help` is voor shell-builtins (cd, read, test). Mag op het examen!", "uitleg": "help = hulp bij shell-builtins (cd, read, test) · man = manual page van een commando · --help = korte hulptekst die een extern commando zelf toont", "waarom": "help = hulp bij builtins. ✗ which zoekt een programma in $PATH (vindt niets) · whatis zoekt een man page · type zegt enkel dát cd een builtin is."}, {"id": "filt-22", "ch": "2", "lab": false, "q": "Toon bestand.txt achterstevoren: de laatste regel eerst, de eerste regel laatst.", "a": "tac bestand.txt", "w": ["rev bestand.txt", "sort -r bestand.txt", "tail -r bestand.txt"], "method": "tac bestand", "detail": "tac = cat achterstevoren.", "uitleg": "tac = cat omgekeerd: toon een bestand van de laatste naar de eerste regel · bestand = het bestand", "waarom": "tac = cat omgekeerd. ✗ rev keert de tekens binnen elke regel om · sort -r sorteert omgekeerd alfabetisch · tail -r bestaat niet bij GNU tail."}, {"id": "filt-23", "ch": "2", "lab": false, "q": "Zet een volgnummer vóór elke (niet-lege) regel van bestand.txt.", "a": "nl bestand.txt", "w": ["wc -l bestand.txt", "cat -s bestand.txt", "sort -n bestand.txt"], "method": "nl bestand   (of cat -n)", "detail": "", "uitleg": "nl = number lines: zet een nummer voor elke (niet-lege) regel · cat -n = number: cat met regelnummers voor alle regels · bestand = het bestand", "waarom": "nl = number lines. ✗ wc -l telt enkel · cat -s voegt lege regels samen · sort -n sorteert numeriek."}, {"id": "filt-24", "ch": "2", "lab": false, "q": "a.txt en b.txt zijn gesorteerd. Toon enkel de regels die in béíde bestanden voorkomen.", "a": "comm -12 a.txt b.txt", "w": ["comm -3 a.txt b.txt", "comm -23 a.txt b.txt", "comm -13 a.txt b.txt"], "method": "comm bestand1 bestand2", "detail": "3 kolommen: enkel in 1, enkel in 2, in beide. `comm -12` = enkel gemeenschappelijk.", "uitleg": "comm = compare: vergelijk twee GESORTEERDE bestanden in 3 kolommen (enkel in 1 · enkel in 2 · in beide) · -12 = verberg kolom 1 en 2, dus toon enkel wat in beide zit · bestand1 bestand2 = de bestanden", "waarom": "comm toont 3 kolommen: 1 enkel in a, 2 enkel in b, 3 in beide. -12 verbergt kolom 1 en 2, dus blijft 3 over. -3 = enkel de verschillen, -23 = enkel in a, -13 = enkel in b."}, {"id": "filt-25", "ch": "2", "lab": false, "q": "Zet namen.txt en scores.txt naast elkaar: regel 1 naast regel 1, regel 2 naast regel 2, …", "a": "paste namen.txt scores.txt", "w": ["paste -s namen.txt scores.txt", "cat namen.txt scores.txt", "comm namen.txt scores.txt"], "method": "paste bestand1 bestand2", "detail": "`join` voegt samen op een gemeenschappelijk veld (beide gesorteerd!).", "uitleg": "paste = zet bestanden naast elkaar, regel per regel (standaard gescheiden door een TAB) · bestand1 bestand2 = de bestanden", "waarom": "paste plakt regels naast elkaar (TAB ertussen). ✗ -s zet elk bestand op één lange regel · cat zet de bestanden ónder elkaar · comm vergelijkt gesorteerde bestanden."}, {"id": "filt-26", "ch": "2", "lab": false, "q": "In de tekst staan soms meerdere spaties na elkaar. Vervang elke reeks spaties door één spatie.", "a": "tr -s ' '", "w": ["tr -d ' '", "sed 's/ //g'", "sed 's/ / /g'"], "method": "tr -s ' '", "detail": "`-s` = squeeze. `tr -d` = tekens verwijderen.", "uitleg": "tr = translate · -s = squeeze: herhaalde opeenvolgende tekens samenvoegen tot één · ' ' = het teken: een spatie", "waarom": "-s = squeeze: herhaalde tekens worden er één. ✗ tr -d en sed 's/ //g' verwijderen álle spaties · sed 's/ / /g' vervangt een spatie door een spatie (verandert niets)."}, {"id": "filt-27", "ch": "2", "lab": true, "q": "Labo Scripting 101: `apt list --installed` toont een WARNING (op stderr) en daarna eerst de regel 'Listing...'. Bewaar enkel de pakketlijst in packages.txt.", "a": "apt list --installed 2>/dev/null | tail -n +2 > packages.txt", "w": ["apt list --installed 2>/dev/null | head -n +2 > packages.txt", "apt list --installed 1>/dev/null | tail -n +2 > packages.txt", "apt list --installed 1>/dev/null | head -n +2 > packages.txt"], "method": "apt list --installed 2>/dev/null | tail -n +2 > packages.txt", "detail": "De waarschuwing gaat naar stderr (`2>`). `tail -n +2` = vanaf lijn 2.", "uitleg": "apt list --installed = lijst van geïnstalleerde pakketten · 2>/dev/null = gooi stderr (de waarschuwing) weg · | = pipe · tail -n +2 = toon alles vanaf regel 2 (zonder de eerste regel 'Listing...') · > packages.txt = schrijf naar dit bestand (overschrijven)", "waarom": "2>/dev/null gooit de WARNING (stderr) weg; tail -n +2 begint vanaf regel 2 (dus zonder 'Listing...'). ✗ 1>/dev/null gooit juist de lijst (stdout) weg · head -n +2 houdt enkel de eerste 2 regels."}, {"id": "filt-28", "ch": "2", "lab": true, "q": "Labo Scripting 101: elke regel in packages.txt ziet eruit als `bash/stable,now 5.2.15-2 amd64 [installed]`. Toon elke architectuur (het 3e spatie-gescheiden veld) met hoe vaak ze voorkomt.", "a": "cut -d' ' -f3 packages.txt | sort | uniq -c", "w": ["cut -d' ' -f3 packages.txt | uniq -c | sort", "cut -d'/' -f3 packages.txt | sort | uniq -c", "cut -d'/' -f3 packages.txt | uniq -c | sort"], "method": "cut -d' ' -f3 packages.txt | sort | uniq -c", "detail": "Een lijn ziet eruit als: `naam/stable,now 1.2 amd64 [installed]`.", "uitleg": "cut = knip kolommen · -d' ' = scheidingsteken: spatie · -f3 = kolom 3 · packages.txt = het bestand · | sort = sorteer · | uniq -c = tel opeenvolgende gelijke regels", "waarom": "Spatie als scheidingsteken → veld 3 = amd64. Eerst sort, dan uniq -c: uniq telt enkel opeenvolgende gelijke regels. Met -d'/' is er geen veld 3."}, {"id": "filt-29", "ch": "2", "lab": true, "q": "Labo Scripting 101: verwijder met grep de lege regels uit de uitvoer van een commando.", "a": "grep -v '^$'", "w": ["grep '^$'", "grep -v '$^'", "grep '$^'"], "method": "grep -v '^$'", "detail": "Lege lijn = begin `^` meteen gevolgd door einde `$`.", "uitleg": "grep = zoek regels · -v = invert: toon wat NIET matcht · '^$' = regex voor een lege regel: begin (^) meteen gevolgd door einde ($)", "waarom": "^$ = begin en meteen einde = lege regel; -v = toon alles wat NIET matcht. `$^` in die volgorde is geen lege regel."}, {"id": "filt-30", "ch": "2", "lab": true, "q": "Labo Scripting 101: in packages.txt staat de pakketnaam vóór de eerste / (bv. bash/stable,now 5.2.15-2 amd64). Tel hoeveel verschillende pakketnamen er zijn.", "a": "cut -d/ -f1 packages.txt | sort -u | wc -l", "w": ["cut -d/ -f1 packages.txt | sort | wc -l", "cut -d/ -f2 packages.txt | sort -u | wc -l", "cut -d/ -f2 packages.txt | sort | wc -l"], "method": "cut -d/ -f1 packages.txt | sort -u | wc -l", "detail": "", "uitleg": "cut -d/ = scheidingsteken / · -f1 = kolom 1 (de pakketnaam) · python-packages.txt = het bestand · sort -u = sorteer en hou elke naam één keer · wc -l = tel de regels", "waarom": "-d/ -f1 = alles vóór de eerste / (de naam). sort -u houdt elke naam één keer; wc -l telt. Zonder -u tel je ook dubbels; -f2 is de rest (stable,now 5.2…)."}, {"id": "filt-31", "ch": "2", "lab": true, "q": "Labo Scripting 101: in /etc/passwd zijn de velden gescheiden door : (veld 1 = gebruikersnaam, veld 3 = UID). Toon de namen van de systeemgebruikers (UID kleiner dan 1000).", "a": "awk -F: '$3 < 1000 { print $1 }' /etc/passwd", "w": ["awk -F: '$1 < 1000 { print $3 }' /etc/passwd", "awk -F: '$3 > 1000 { print $1 }' /etc/passwd", "awk -F: '$1 > 1000 { print $3 }' /etc/passwd"], "method": "cut -d: -f1 /etc/passwd | sort\nawk -F: '$3 < 1000 { print $1 }' /etc/passwd | sort", "detail": "", "uitleg": "cut -d: -f1 = kolom 1 (gebruikersnaam), scheidingsteken : · /etc/passwd = gebruikersbestand · sort = alfabetisch · awk -F: = kolommen gescheiden door : · '$3 < 1000' = voorwaarde: kolom 3 (UID) kleiner dan 1000 · { print $1 } = druk kolom 1 af", "waarom": "Voorwaarde op veld 3 (UID), afdrukken van veld 1 (naam)."}, {"id": "filt-32", "ch": "2", "lab": true, "q": "Labo Scripting 101: topcmd.sh gebruikt `history` om je meest gebruikte commando's te tonen. Waarom start je het met source in plaats van ./topcmd.sh?", "a": "./ start een aparte shell met lege history; source draait in je huidige shell", "w": ["./ draait in je huidige shell; source start een aparte shell met jouw history", "history werkt enkel als het script uitvoerbaar is, en source vereist dat niet", "source is sneller dan ./ omdat er geen interpreter nodig is"], "method": "history | awk '{ print $2 }' | sort | uniq -c | sort -rn | head -n 10\nsource: anders draait het in een subshell met een lege history", "detail": "`. topcmd.sh` = hetzelfde.", "uitleg": "history = lijst van je vorige commando's · awk '{ print $2 }' = kolom 2: de commandonaam (kolom 1 is het nummer) · sort = sorteer · uniq -c = tel · sort -rn = numeriek aflopend · head -n 10 = de eerste 10", "waarom": "./script.sh draait in een nieuwe (niet-interactieve) shell zonder jouw history. source voert de regels uit in je huidige shell, mét je history."}, {"id": "filt-33", "ch": "2", "lab": true, "q": "Labo Scripting 101: zet de UTF-8-tekst 'Šárka Dvořák' om naar gewone ASCII, zodat je 'Sarka Dvorak' krijgt.", "a": "iconv -f utf-8 -t ascii//TRANSLIT", "w": ["iconv -f ascii -t utf-8//TRANSLIT", "iconv -f utf-8 -t ascii//IGNORE", "iconv -f ascii -t utf-8//IGNORE"], "method": "echo 'Šárka Dvořák' | iconv -f utf-8 -t ascii//TRANSLIT", "detail": "⚠ Werkt enkel met een UTF-8-locale (LANG), anders krijg je `?`.", "uitleg": "echo = druk tekst af · | = pipe · iconv = zet tekst om naar een andere tekenset · -f utf-8 = from: brontekenset · -t ascii//TRANSLIT = to: doeltekenset ASCII, met //TRANSLIT = vervang speciale tekens door een gelijkend ASCII-teken", "waarom": "-f = from (bron is UTF-8), -t = to (ASCII). //TRANSLIT vervangt Š door S; //IGNORE laat zulke tekens gewoon weg (Srka Dvok)."}, {"id": "filt-34", "ch": "2", "lab": true, "q": "Labo Scripting 101: voeg usernames.txt en passwords.txt regel per regel samen, met een komma ertussen (bv. jan,geheim).", "a": "paste -d, usernames.txt passwords.txt", "w": ["paste -s -d, usernames.txt passwords.txt", "join -t, usernames.txt passwords.txt", "cat usernames.txt passwords.txt | tr '\\n' ,"], "method": "paste -d, usernames.txt passwords.txt > user-pass.csv", "detail": "", "uitleg": "paste = zet bestanden naast elkaar, regel per regel · -d, = delimiter: komma als scheidingsteken · usernames.txt passwords.txt = de twee bestanden · > user-pass.csv = schrijf naar dit bestand", "waarom": "paste -d, plakt regel 1 naast regel 1 met een komma. ✗ -s zet eerst alle gebruikersnamen op één regel · join koppelt op een gemeenschappelijk veld · cat+tr maakt één lange regel."}, {"id": "filt-35", "ch": "2", "lab": true, "q": "Labo Text Processing: toon met enkel awk de gebruikersnamen (veld 1) uit /etc/passwd waarvan de login-shell (laatste veld) bash is.", "a": "awk -F: '/bash$/ { print $1 }' /etc/passwd", "w": ["awk -F: '$1 ~ /bash$/ { print $1 }' /etc/passwd", "awk -F: '/bash$/ { print $NF }' /etc/passwd", "awk -F: '$1 ~ /bash$/ { print $NF }' /etc/passwd"], "method": "awk -F: '/bash$/ { print $1 }' /etc/passwd", "detail": "", "uitleg": "awk = tekstverwerking · -F: = kolommen gescheiden door : · '/bash$/' = enkel regels die eindigen op bash · { print $1 } = druk kolom 1 (gebruikersnaam) af · /etc/passwd = het bestand", "waarom": "/bash$/ test de hele regel: eindigt ze op bash, dan is dat het laatste veld. ✗ $1 ~ test de naam · $NF = het laatste veld (de shell zelf), niet de naam."}, {"id": "filt-36", "ch": "2", "lab": true, "q": "Labo Text Processing: druk bestand.csv af zonder de header (regel 1), enkel met awk.", "a": "awk 'NR>1' bestand.csv", "w": ["awk 'NR==1' bestand.csv", "awk 'NF>1' bestand.csv", "awk 'NF==1' bestand.csv"], "method": "awk 'NR>1' bestand.csv", "detail": "NR = regelnummer.", "uitleg": "awk = tekstverwerking · 'NR>1' = voorwaarde: regelnummer (Number of Records) groter dan 1, dus alles behalve de header; zonder { actie } drukt awk de hele regel af · bestand.csv = het bestand", "waarom": "NR = regelnummer (Number of Records). Een voorwaarde zonder { } drukt de regel af. ✗ NR==1 toont enkel de header · NF = aantal velden op de regel, niet het regelnummer."}, {"id": "filt-37", "ch": "2", "lab": true, "q": "Labo Text Processing: f.csv heeft een komma als scheidingsteken en een header op regel 1. Druk één getal af: de som van kolom 6.", "a": "awk -F, 'NR>1 { s += $6 } END { print s }' f.csv", "w": ["awk -F, 'NR>1 { s += $6; print s }' f.csv", "awk -F, 'NR>1 { s = $6 } END { print s }' f.csv", "awk -F, 'NR>1 { s = $6; print s }' f.csv"], "method": "awk -F, 'NR>1 { s += $6 } END { print s }' f.csv\nawk -F, 'NR>1 && $2 == \"Female\" { s += $6 } END { print s }' f.csv", "detail": "", "uitleg": "awk = tekstverwerking · -F, = kolommen gescheiden door een komma · NR>1 = sla regel 1 (header) over (géén ; erna) · { s += $6 } = tel kolom 6 op bij variabele s · END { print s } = na de laatste regel: druk s af · f.csv = het bestand", "waarom": "+= telt op; print in END gebeurt één keer na de laatste regel. ✗ print in het blok drukt na élke regel een tussentotaal · s = $6 overschrijft telkens. Let op: géén ; na NR>1 — `'NR>1; { … }'` maakt er twee aparte regels van (afdrukken én optellen voor elke regel)."}, {"id": "filt-38", "ch": "2", "lab": true, "q": "Labo Text Processing: f.csv heeft een komma als scheidingsteken en een header. Toon elke waarde uit kolom 7 één keer, met hoe vaak ze voorkomt.", "a": "awk -F, 'NR>1 { c[$7]++ } END { for (k in c) print k, c[k] }' f.csv", "w": ["awk -F, 'NR>1 { c[$7]++; print $7, c[$7] }' f.csv", "awk -F, 'NR>1 { c[$7] = 1 } END { for (k in c) print k, c[k] }' f.csv", "awk -F, 'NR>1 { c[$7] = 1; print $7, c[$7] }' f.csv"], "method": "awk -F, 'NR>1 { c[$7]++ } END { for (k in c) print k, c[k] }' f.csv | sort", "detail": "Associatieve array: `c[waarde]++`.", "uitleg": "awk -F, = komma als scheidingsteken · NR>1 = sla de header over · c[$7]++ = associatieve array: verhoog de teller voor de waarde in kolom 7 · END { for (k in c) print k, c[k] } = na afloop: druk elke waarde en haar aantal af · | sort = sorteer het resultaat", "waarom": "c[$7]++ = teller per waarde (associatieve array); de lus in END drukt elke waarde één keer af. ✗ print in het blok drukt elke regel af (met een tussenstand) · = 1 telt niet."}, {"id": "filt-39", "ch": "2", "lab": true, "q": "Labo Text Processing: f.csv heeft een komma als scheidingsteken en een header. Kolom 2 = Gender, kolom 3 = e service draait (Active: active (running)) en de laatste logregels · mariadb = de service", "waarom": "status = actief of niet + recente logs. ✗ show = alle ruwe eigenschappen · is-enabled = start ze bij het opstarten · list-units = korte lijst."}, {"id": "sys-10", "ch": "4", "lab": false, "q": "Zorg dat apache2 voortaan automatisch start bij het opstarten van de machine.", "a": "sudo systemctl enable apache2", "w": ["sudo systemctl start apache2", "sudo systemctl unmask apache2", "sudo systemctl reload apache2"], "method": "sudo systemctl enable apache2", "detail": "⚠ `enable` start hem niet nu. Beide tegelijk: `enable --now`.", "uitleg": "sudo = als root · systemctl enable = start de service automatisch bij elke boot (start ze niet nu; beide: enable --now) · apache2 = de service", "waarom": "enable = bij elke boot. ✗ start = enkel nu · unmask maakt een geblokkeerde service weer startbaar · reload herleest de config."}, {"id": "sys-11", "ch": "4", "lab": false, "q": "Wat is het verschil tussen `systemctl start` en `systemctl enable`?", "a": "start = nu starten; enable = automatisch starten bij elke boot", "w": ["start = automatisch starten bij elke boot; enable = nu starten", "start = nu starten; enable = nu én bij elke boot starten", "start = starten tot de volgende reload; enable = starten tot de volgende boot"], "method": "start = nu\nenable = bij elke boot", "detail": "`disable` = niet meer automatisch starten.", "waarom": "enable start de service níet meteen (tenzij je `enable --now` gebruikt). Vaak doe je beide."}, {"id": "sys-12", "ch": "4", "lab": false, "q": "Welk commando antwoordt kort 'enabled' of 'disabled': start service x automatisch bij het opstarten?", "a": "systemctl is-enabled x", "w": ["systemctl is-active x", "systemctl is-failed x", "systemctl is-system-running"], "method": "systemctl is-active x · is-enabled x", "detail": "Geeft één woord terug, handig in scripts.", "uitleg": "systemctl is-active x = geeft één woord: active of inactive · systemctl is-enabled x = enabled of disabled (start bij boot?) · x = de service", "waarom": "is-enabled = start ze bij boot. ✗ is-active = draait ze nú · is-failed = is ze gecrasht · is-system-running = toestand van het hele systeem."}, {"id": "sys-13", "ch": "4", "lab": false, "q": "Bekijk de logberichten van de service apache2 in de systemd-journal.", "a": "journalctl -u apache2", "w": ["journalctl -k", "journalctl -b", "journalctl -f"], "method": "journalctl -u apache2", "detail": "`-f` = live volgen, `-n 50` = laatste 50 regels.", "uitleg": "journalctl = lees de systemd-logs · -u apache2 = unit: enkel de logs van deze service (-f = live volgen)", "waarom": "-u = unit (één service). ✗ -k = enkel kernelberichten · -b = alles sinds de laatste boot · -f = volg live álle nieuwe berichten."}, {"id": "sys-14", "ch": "4", "lab": false, "q": "Welke TCP-poorten staan open om op te luisteren, en welk programma luistert op elke poort?", "a": "sudo ss -tlnp", "w": ["sudo ss -tan", "sudo ss -ulnp", "sudo ss -s"], "method": "sudo ss -tlnp", "detail": "t=TCP, l=luisterend, n=numeriek, p=proces.", "uitleg": "sudo = als root (nodig om de procesnamen te zien) · ss = socket statistics · -t = TCP · -l = listening: enkel luisterende poorten · -n = numeric: poortnummers i.p.v. namen · -p = process: welk programma luistert", "waarom": "-t TCP, -l listening, -n poortnummers, -p proces. ✗ -tan = alle TCP-verbindingen zonder programma · -u = UDP · -s = samenvatting."}, {"id": "sys-15", "ch": "4", "lab": false, "q": "Wat zijn de standaardpoorten van HTTP, HTTPS, SSH en MariaDB/MySQL (in die volgorde)?", "a": "80 · 443 · 22 · 3306", "w": ["80 · 8443 · 23 · 5432", "8080 · 443 · 23 · 5432", "8080 · 8443 · 22 · 3306"], "method": "80 · 443 · 22 · 3306", "detail": "", "waarom": "23 = telnet, 5432 = PostgreSQL, 8080 en 8443 zijn alternatieve webpoorten."}, {"id": "sys-16", "ch": "4", "lab": false, "q": "Welk commando toont de IP-adressen van de netwerkinterfaces van je VM?", "a": "ip a", "w": ["ip r", "ip link", "ip n"], "method": "ip a", "detail": "Kijk naar `inet` bij je netwerkkaart (bv. enp0s3).", "uitleg": "ip = netwerkconfiguratie · a = address: toon alle netwerkkaarten en hun IP-adressen (inet = IPv4)", "waarom": "ip a (= ip address). ✗ ip r = routes (default gateway) · ip link = interfaces zonder IP · ip n = buren (ARP-tabel)."}, {"id": "sys-17", "ch": "4", "lab": false, "q": "In welk bestand wijzig je de poort waarop de SSH-server luistert?", "a": "/etc/ssh/sshd_config", "w": ["/etc/ssh/ssh_config", "~/.ssh/config", "~/.ssh/known_hosts"], "method": "/etc/ssh/sshd_config → Port 2222", "detail": "Daarna `sudo systemctl restart ssh`.\n⚠ Zorg dat je nog een andere weg binnen hebt voor je herstart.", "uitleg": "/etc/ssh/sshd_config = configuratie van de SSH-server (sshd = SSH daemon; ssh_config is voor de client) · Port 2222 = de regel die de poort bepaalt. Daarna: sudo systemctl restart ssh", "waarom": "sshd_config (met d van daemon) = server. ssh_config en ~/.ssh/config = instellingen voor de client; known_hosts = gekende servers."}, {"id": "sys-18", "ch": "4", "lab": false, "q": "Uit welke map serveert Apache op Debian standaard de website?", "a": "/var/www/html", "w": ["/var/www/public", "/etc/apache2/html", "/etc/apache2/public"], "method": "/var/www/html", "detail": "Config: /etc/apache2/. Logs: /var/log/apache2/.", "waarom": "DocumentRoot is /var/www/html (zie /etc/apache2/sites-available/000-default.conf). /etc/apache2 bevat enkel configuratie."}, {"id": "sys-19", "ch": "4", "lab": false, "q": "Je VM stuurt poort 2222 van je laptop door naar poort 22 van de VM. Log vanop je laptop in als hogent.", "a": "ssh -p 2222 hogent@localhost", "w": ["ssh -P 2222 hogent@localhost", "ssh -p 22 hogent@localhost", "ssh -P 22 hogent@localhost"], "method": "ssh -p 2222 hogent@localhost", "detail": "⚠ Bij `scp` is het een hoofdletter: `scp -P 2222`.", "uitleg": "ssh = secure shell: log in op een andere machine · -p 2222 = port: poortnummer (kleine p) · hogent@localhost = gebruiker@machine", "waarom": "ssh gebruikt kleine -p voor de poort (scp gebruikt hoofdletter -P). Je verbindt met de doorgestuurde poort 2222 op je eigen laptop."}, {"id": "sys-20", "ch": "4", "lab": false, "q": "Kopieer je publieke SSH-sleutel naar een server, zodat je daarna zonder wachtwoord kan inloggen.", "a": "ssh-copy-id user@host", "w": ["ssh-add user@host", "ssh-keyscan user@host", "ssh-keygen -R host"], "method": "ssh-keygen   ·   ssh-copy-id user@host", "detail": "De publieke sleutel komt in `~/.ssh/authorized_keys`.", "uitleg": "ssh-keygen = maak een SSH-sleutelpaar (private + .pub) · ssh-copy-id = kopieer je publieke sleutel naar ~/.ssh/authorized_keys op de server · user@host = gebruiker@server", "waarom": "ssh-copy-id zet je .pub in ~/.ssh/authorized_keys op de server. ✗ ssh-add laadt een sleutel in de agent · ssh-keyscan haalt de host-sleutel van een server op · ssh-keygen -R verwijdert een host uit known_hosts."}, {"id": "sys-21", "ch": "4", "lab": false, "q": "Haal een webpagina op met curl en bewaar ze onder de naam pagina.html.", "a": "curl -o pagina.html URL", "w": ["curl -O pagina.html URL", "curl -i pagina.html URL", "curl -I pagina.html URL"], "method": "curl -o pagina.html URL", "detail": "`-s` stil, `-L` redirects volgen, `-I` enkel headers.", "uitleg": "curl = tool om gegevens van/naar een server over te dragen · -o pagina.html = output: bewaar het resultaat in dit bestand · URL = plaats voor het echte adres", "waarom": "kleine -o = output naar een naam die jij kiest. ✗ -O = gebruik de naam uit de URL · -i = toon headers mee · -I = enkel de headers."}, {"id": "sys-22", "ch": "4", "lab": false, "q": "Je kent het PID van een proces. Hoe vraag je het netjes om te stoppen?", "a": "kill PID", "w": ["kill -l PID", "kill -STOP PID", "ps -p PID"], "method": "ps aux   ·   top   ·   kill PID", "detail": "`kill -9 PID` als het niet anders lukt.", "uitleg": "ps = process status · a = processen van alle gebruikers · u = user-oriented: layout met gebruiker, CPU- en geheugengebruik · x = ook processen zonder terminal", "waarom": "kill stuurt standaard SIGTERM (15): vriendelijk stoppen. ✗ -l toont de lijst met signalen · -STOP pauzeert het proces · ps -p toont enkel info."}, {"id": "sys-23", "ch": "4", "lab": false, "q": "Kopieer bestand.txt van je laptop (Ubuntu) naar de home-map van hogent in je VM; SSH zit op poort 2222.", "a": "scp -P 2222 bestand.txt hogent@localhost:~/", "w": ["scp -p 2222 bestand.txt hogent@localhost:~/", "scp -P 2222 hogent@localhost:~/ bestand.txt", "scp -p 2222 hogent@localhost:~/ bestand.txt"], "method": "scp -P 2222 bestand hogent@localhost:~/", "detail": "Omgekeerd: `scp -P 2222 hogent@localhost:~/f .`", "uitleg": "scp = secure copy over SSH · -P 2222 = port (HOOFDLETTER P bij scp) · bestand = wat je kopieert · hogent@localhost:~/ = gebruiker@machine:doelmap", "waarom": "scp gebruikt hoofdletter -P voor de poort (kleine -p = tijden bewaren). Volgorde: BRON DOEL, dus eerst het lokale bestand."}, {"id": "sys-24", "ch": "4", "lab": false, "q": "Voer één commando (uptime) uit op een andere machine via SSH, zonder er interactief in te loggen.", "a": "ssh hogent@host uptime", "w": ["ssh uptime hogent@host", "scp hogent@host uptime", "scp uptime hogent@host"], "method": "ssh hogent@host 'commando'", "detail": "Bv. `ssh -p 2222 hogent@localhost 'df -h'`.", "uitleg": "ssh = log in op een andere machine · hogent@host = gebruiker@machine · 'commando' = voer enkel dit commando uit en sluit dan af", "waarom": "Alles na user@host wordt op de server uitgevoerd. ✗ ssh uptime … probeert in te loggen op een machine met de naam uptime · scp kopieert bestanden en voert niets uit."}, {"id": "sys-25", "ch": "4", "lab": false, "q": "In welk bestand op de server staan de publieke sleutels die mogen inloggen als die gebruiker?", "a": "~/.ssh/authorized_keys", "w": ["~/.ssh/known_hosts", "/etc/ssh/authorized_keys", "/etc/ssh/known_hosts"], "method": "~/.ssh/authorized_keys", "detail": "Private sleutel (bv. id_ed25519) nooit delen; .pub mag je delen.", "waarom": "authorized_keys in de home-map van de doelgebruiker. known_hosts = servers die jíj als client vertrouwt."}, {"id": "sys-26", "ch": "4", "lab": false, "q": "curl: toon de HTTP-headers van het antwoord, gevolgd door de body.", "a": "curl -i URL", "w": ["curl -I URL", "curl -H URL", "curl -s URL"], "method": "curl -i URL", "detail": "`-I` = enkel headers (HEAD-request).", "uitleg": "curl = tool om gegevens van/naar een server over te dragen · -i = include: toon de HTTP-headers van het antwoord vóór de inhoud · URL = het adres", "waarom": "-i = include headers. ✗ -I = enkel de headers (HEAD-request) · -H = stuur zelf een header mee · -s = silent."}, {"id": "sys-27", "ch": "4", "lab": false, "q": "curl: stuur een POST-request met JSON-data naar een API.", "a": "curl -X POST -d '{\"a\":1}' URL", "w": ["curl -X POST -D '{\"a\":1}' URL", "curl -X GET -d '{\"a\":1}' URL", "curl -X GET -D '{\"a\":1}' URL"], "method": "curl -X POST -H 'Content-Type: application/json' -d '{...}' URL", "detail": "`-X` kiest de methode: GET, POST, PUT, DELETE.", "uitleg": "curl · -X POST = request method: POST i.p.v. GET · -H '...' = header: voeg deze HTTP-header toe · -d '{...}' = data: de inhoud die je meestuurt · URL = het adres", "waarom": "-X kiest de methode, -d = data in de body. ✗ -D = dump de headers naar een bestand."}, {"id": "sys-28", "ch": "4", "lab": false, "q": "curl: download een bestand en bewaar het onder de originele naam uit de URL.", "a": "curl -O URL", "w": ["curl -o URL", "curl -L URL", "curl -R URL"], "method": "curl -O URL", "detail": "`-o naam` = zelf een naam kiezen.", "uitleg": "curl · -O = remote name: bewaar onder de bestandsnaam uit de URL (hoofdletter O; kleine -o = zelf een naam kiezen) · URL = het adres", "waarom": "hoofdletter -O = remote name. ✗ -o verwacht zelf een bestandsnaam · -L = redirects volgen · -R = gebruik de tijd van de server voor het bestand."}, {"id": "sys-29", "ch": "4", "lab": true, "q": "Labo Package Management: toon welke pakketten een nieuwere versie hebben, zonder iets te upgraden.", "a": "apt list --upgradable", "w": ["apt list --installed", "apt show --upgradable", "apt show --installed"], "method": "sudo apt update\napt list --upgradable", "detail": "", "uitleg": "sudo apt update = vernieuw de pakketlijst · apt list --upgradable = toon welke pakketten een nieuwere versie hebben, zonder te upgraden", "waarom": "apt list --upgradable. ✗ --installed toont álle geïnstalleerde pakketten · apt show kent die opties niet en toont details van één pakket."}, {"id": "sys-30", "ch": "4", "lab": true, "q": "Labo Package Management: update enkel Firefox (firefox-esr) en laat de andere pakketten ongemoeid.", "a": "sudo apt install --only-upgrade firefox-esr", "w": ["sudo apt upgrade --only firefox-esr", "sudo apt update firefox-esr", "sudo apt reinstall firefox-esr"], "method": "sudo apt install --only-upgrade firefox-esr", "detail": "Op Debian heet Firefox `firefox-esr`.", "uitleg": "sudo apt install = installeer · --only-upgrade = enkel bijwerken als het al geïnstalleerd is, niets nieuws installeren · firefox-esr = Firefox op Debian", "waarom": "install --only-upgrade upgradet dit pakket als het al geïnstalleerd is. ✗ upgrade kent geen --only · update verwacht geen pakketnaam · reinstall installeert dezelfde versie opnieuw."}, {"id": "sys-31", "ch": "4", "lab": true, "q": "Labo Package Management: installeer het gedownloade bestand sl_amd64.deb (in de huidige map) met apt, inclusief dependencies.", "a": "sudo apt install ./sl_amd64.deb", "w": ["sudo apt install sl_amd64.deb", "sudo dpkg -i ./sl_amd64.deb", "sudo dpkg -i sl_amd64.deb"], "method": "sudo apt install ./sl_*.deb   (of sudo dpkg -i sl_*.deb)", "detail": "⚠ `./` is nodig, anders zoekt apt in de repository.\n`apt` installeert ontbrekende dependencies mee, `dpkg -i` niet.", "uitleg": "sudo apt install ./sl_*.deb = installeer een lokaal .deb-bestand (./ = pad, anders zoekt apt in de repository), met dependencies · dpkg -i = install: idem, maar zonder dependencies", "waarom": "Met ./ weet apt dat het om een lokaal bestand gaat; zonder ./ zoekt het een pakket met die naam in de repository. dpkg -i installeert het bestand wel, maar haalt geen ontbrekende dependencies op."}, {"id": "sys-32", "ch": "4", "lab": true, "q": "Labo Package Management: waarom loopt `sudo dpkg -i cavepacker.deb` vast?", "a": "dpkg installeert geen ontbrekende dependencies", "w": ["dpkg weigert pakketten die niet van Debian komen", "dpkg vereist eerst een apt update", "het .deb-bestand moet eerst uitgepakt worden met -x"], "method": "Ontbrekende dependencies: dpkg installeert die niet", "detail": "Oplossen: `sudo apt install -f` of meteen `sudo apt install ./cavepacker.deb`.", "waarom": "dpkg werkt enkel met het bestand dat je geeft. apt (apt install ./bestand.deb of daarna apt -f install) haalt de dependencies op."}, {"id": "sys-33", "ch": "4", "lab": true, "q": "Labo Package Management: toon welke bestanden in bestand.deb zitten, zonder te installeren.", "a": "dpkg -c bestand.deb", "w": ["dpkg -L bestand.deb", "dpkg -I bestand.deb", "dpkg -S bestand.deb"], "method": "dpkg -I bestand.deb   (info)\ndpkg -c bestand.deb   (bestandenlijst)", "detail": "", "uitleg": "dpkg = Debian package · -c = contents: toon de bestandenlijst in het .deb · -I = info: toon de pakketinformatie · bestand.deb = het pakket", "waarom": "-c = contents van een .deb. ✗ -L = bestanden van een al geïnstalleerd pakket · -I = info (metadata) van het .deb · -S = zoek welk pakket een bestand bevat."}, {"id": "sys-34", "ch": "4", "lab": true, "q": "Labo Package Management: pak de bestanden uit bestand.deb uit naar de map uitpakmap/, zonder te installeren.", "a": "dpkg -x bestand.deb uitpakmap/", "w": ["dpkg -i bestand.deb uitpakmap/", "dpkg -c bestand.deb uitpakmap/", "dpkg -e bestand.deb uitpakmap/"], "method": "dpkg -x bestand.deb uitpakmap/", "detail": "Daarna `find uitpakmap -name dhcpd.conf`.", "uitleg": "dpkg = Debian package · -x = extract: pak de bestanden uit zonder te installeren · bestand.deb = het pakket · uitpakmap/ = doelmap", "waarom": "-x = extract. ✗ -i installeert · -c toont enkel de inhoud · -e pakt enkel de control-bestanden (metadata) uit."}, {"id": "sys-35", "ch": "4", "lab": true, "q": "Labo Package Management: waarom kan je isc-dhcp-server_…_ppc64el.deb nooit installeren op je VM?", "a": "het is gebouwd voor een andere processorarchitectuur", "w": ["het is gebouwd voor een oudere versie van Debian", "isc-dhcp-server mag je enkel op servers installeren", "het bestand komt niet uit een officiële Debian-bron"], "method": "Verkeerde processorarchitectuur: ppc64el (PowerPC) ≠ amd64", "detail": "Je architectuur: `dpkg --print-architecture`.", "waarom": "Het laatste deel van de naam is de architectuur. Je VM draait op amd64 (x86-64)."}, {"id": "sys-36", "ch": "4", "lab": true, "q": "Labo curl: vraag je publieke IP-adres op via de dienst icanhazip.com.", "a": "curl icanhazip.com", "w": ["curl -I icanhazip.com", "ip a", "curl localhost"], "method": "curl icanhazip.com", "detail": "", "uitleg": "curl = tool om gegevens van/naar een server over te dragen · icanhazip.com = de service die je publieke IP-adres terugstuurt", "waarom": "De dienst antwoordt met het IP waarmee je op het internet verschijnt. ✗ -I toont enkel headers · ip a toont je lokale (private) adressen · localhost is je eigen machine."}, {"id": "sys-37", "ch": "4", "lab": true, "q": "Labo curl: je downloadt een pagina een tweede keer naar dezelfde bestandsnaam. Wat doen curl -o en wget?", "a": "curl overschrijft het bestand, wget maakt pagina.html.1", "w": ["curl maakt pagina.html.1, wget overschrijft het bestand", "beide overschrijven het bestand zonder waarschuwing", "beide weigeren en geven een foutmelding"], "method": "curl -o: ja, zonder waarschuwing\nwget: nee, maakt pagina.html.1", "detail": "", "uitleg": "curl -o = output: bewaar in dit bestand en overschrijf zonder te vragen · wget = ander downl
