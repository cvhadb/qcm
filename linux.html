 hetzelfde.", "uitleg": "apachectl = Apache control (op Debian = apache2ctl) · configtest = controleer de syntax van de configuratie", "waarom": "apachectl bestaat op beide (op Debian is apache2ctl hetzelfde programma). De service heet apache2 op Debian en httpd op EL."}, {"id": "web-22", "ch": "12", "lab": false, "q": "Waar wijzig je op Debian de poort waarop Apache luistert?", "a": "Listen in /etc/apache2/ports.conf, plus de bijhorende <VirtualHost *:poort> in het site-bestand", "w": ["Listen in /etc/apache2/apache2.conf, en verder niets", "Port in /etc/apache2/ports.conf, plus de bijhorende <VirtualHost *:poort> in het site-bestand", "Port in /etc/apache2/apache2.conf, en verder niets"], "method": "Listen in /etc/apache2/ports.conf, plus de bijhorende <VirtualHost *:poort> in het site-bestand", "detail": "", "uitleg": "", "waarom": "De richtlijn heet Listen en staat op Debian in ports.conf; de VirtualHost moet dezelfde poort gebruiken."}, {"id": "web-23", "ch": "12", "lab": false, "q": "Waar staan op Debian de logbestanden van Apache?", "a": "/var/log/apache2/access.log en /var/log/apache2/error.log", "w": ["/var/log/httpd/access_log en /var/log/httpd/error_log", "/etc/apache2/logs/access.log en /etc/apache2/logs/error.log", "/var/www/logs/access.log en /var/www/logs/error.log"], "method": "/var/log/apache2/access.log en /var/log/apache2/error.log", "detail": "", "uitleg": "", "waarom": "Debian: /var/log/apache2/. Het pad /var/log/httpd/ is van Enterprise Linux."}, {"id": "web-24", "ch": "12", "lab": false, "q": "`curl https://localhost` faalt met een certificaatfout (self-signed). Hoe test je de pagina toch?", "a": "curl -k https://localhost", "w": ["curl -L https://localhost", "curl -s https://localhost", "curl -I https://localhost"], "method": "curl -k https://localhost", "detail": "", "uitleg": "", "waarom": "-k (--insecure) = sla de certificaatcontrole over. ✗ -L volgt redirects · -s = stil · -I = enkel headers; alle drie falen nog op het certificaat."}, {"id": "web-25", "ch": "12", "lab": false, "q": "Welk pakket installeert de databankserver op Debian, en hoe heet de service?", "a": "pakket mariadb-server · service mariadb", "w": ["pakket mariadb-server · service mysqld", "pakket mariadb-client · service mariadb", "pakket mariadb-client · service mysqld"], "method": "pakket mariadb-server · service mariadb", "detail": "", "uitleg": "", "waarom": "mariadb-server = server (mariadb-client = enkel de client). De systemd-service heet mariadb (mysqld is de naam van het serverprogramma)."}, {"id": "web-26", "ch": "12", "lab": false, "q": "SQL: toon eerst alle databanken, en daarna de tabellen van de databank app.", "a": "SHOW DATABASES; dan USE app; en SHOW TABLES;", "w": ["SHOW DATABASES; dan OPEN app; en SHOW TABLES;", "LIST DATABASES; dan USE app; en SHOW TABLES;", "LIST DATABASES; dan OPEN app; en SHOW TABLES;"], "method": "SHOW DATABASES; dan USE app; en SHOW TABLES;", "detail": "", "uitleg": "", "waarom": "USE kiest de databank; SHOW TABLES; toont dan haar tabellen (of SHOW TABLES FROM app;). LIST en OPEN zijn geen SQL-opdrachten."}, {"id": "web-27", "ch": "12", "lab": false, "q": "Voer het SQL-script schema.sql uit in de databank app, als gebruiker appuser (met wachtwoordvraag).", "a": "mysql -u appuser -p app < schema.sql", "w": ["mysql -u appuser -p app > schema.sql", "mysql -u appuser -p < app schema.sql", "mysqldump -u appuser -p app < schema.sql"], "method": "mysql -u appuser -p app < schema.sql", "detail": "", "uitleg": "", "waarom": "-u gebruiker, -p = vraag wachtwoord, daarna de databanknaam; het script komt via stdin (<). > zou schema.sql overschrijven."}, {"id": "web-28", "ch": "12", "lab": false, "q": "Wat gebeurt er met `mysql -u appuser -p secret app`?", "a": "secret wordt de databanknaam, en mysql vraagt het wachtwoord", "w": ["secret wordt het wachtwoord, en app de databanknaam", "mysql weigert, want -p mag geen waarde krijgen", "secret wordt gezien als de gebruikersnaam"], "method": "secret wordt de databanknaam, en mysql vraagt het wachtwoord", "detail": "", "uitleg": "", "waarom": "Het wachtwoord moet vast tegen -p staan (-psecret). Met een spatie vraagt mysql het, en is secret de databank. Beter: enkel -p, en typen als het gevraagd wordt."}, {"id": "web-29", "ch": "12", "lab": false, "q": "SQL: welke query toont de databankgebruikers, vanaf welke host ze mogen verbinden, en hun wachtwoord-hash?", "a": "SELECT user, host, password FROM mysql.user;", "w": ["SELECT user, host, password FROM mysql.users;", "SHOW USERS;", "SELECT * FROM users;"], "method": "SELECT user, host, password FROM mysql.user;", "detail": "", "uitleg": "", "waarom": "De tabel heet user (enkelvoud) in de databank mysql. SHOW USERS bestaat niet."}, {"id": "web-30", "ch": "12", "lab": false, "q": "SQL: welke reeks maakt een databank klaar voor een webapplicatie op dezelfde machine?", "a": "CREATE DATABASE app; CREATE USER 'appuser'@'localhost' IDENTIFIED BY 'pw'; GRANT ALL PRIVILEGES ON app.* TO 'appuser'@'localhost';", "w": ["CREATE DATABASE app; CREATE USER 'appuser'@'localhost' IDENTIFIED BY 'pw'; GRANT ALL PRIVILEGES ON *.app TO 'appuser'@'localhost';", "CREATE DATABASE app; GRANT ALL PRIVILEGES ON app.* TO 'appuser'@'localhost'; CREATE USER 'appuser'@'localhost' IDENTIFIED BY 'pw';", "CREATE DATABASE app; GRANT ALL PRIVILEGES ON *.app TO 'appuser'@'localhost'; CREATE USER 'appuser'@'localhost' IDENTIFIED BY 'pw';"], "method": "CREATE DATABASE app; CREATE USER 'appuser'@'localhost' IDENTIFIED BY 'pw'; GRANT ALL PRIVILEGES ON app.* TO 'appuser'@'localhost';", "detail": "", "uitleg": "", "waarom": "Eerst de databank, dan de gebruiker, dan de rechten (op app.* = alle tabellen van app). Een GRANT aan een gebruiker die nog niet bestaat (zonder IDENTIFIED BY) faalt in MariaDB; de gebruiker die je daarna maakt, heeft dan geen rechten. *.app = de tabel app in elke databank."}, {"id": "web-31", "ch": "12", "lab": false, "q": "Een PHP-webapp meldt 'could not find driver' bij het verbinden met MariaDB. Wat ontbreekt er?", "a": "de PHP-extensie voor MySQL: sudo apt install php-mysql, en Apache herstarten", "w": ["de MariaDB-client: sudo apt install mariadb-client, en Apache herstarten", "de Apache-module: sudo a2enmod mysql, en Apache herstarten", "de databank zelf: CREATE DATABASE app; in MariaDB"], "method": "de PHP-extensie voor MySQL: sudo apt install php-mysql, en Apache herstarten", "detail": "", "uitleg": "", "waarom": "PDO zoekt een driver (pdo_mysql) die in php-mysql zit. Een ontbrekende databank geeft een andere fout ('Unknown database')."}, {"id": "web-32", "ch": "12", "lab": false, "q": "De webapp draait op dezelfde machine als MariaDB. Welk host-deel geef je de databankgebruiker?", "a": "'appuser'@'localhost'", "w": ["'appuser'@'%'", "'appuser'@'10.0.2.2'", "'appuser'@'0.0.0.0'"], "method": "'appuser'@'localhost'", "detail": "", "uitleg": "", "waarom": "localhost = enkel verbindingen van deze machine (veiligst). '%' = vanaf eender waar; 10.0.2.2 = je laptop achter NAT."}, {"id": "vi-01", "ch": "13", "lab": false, "q": "vi: hoe ga je van insert mode terug naar command mode (normal mode)?", "a": "Esc", "w": ["Enter", ":q", "Ctrl+X"], "method": "command mode en insert mode\nterug naar command mode: Esc", "detail": "vi start in command mode. Toetsen zijn daar commando's, geen tekst.", "waarom": "Esc. In insert mode typt :q gewoon de tekens :q; Ctrl+X is nano."}, {"id": "vi-02", "ch": "13", "lab": false, "q": "vi (command mode): welke toets opent een nieuwe regel ónder de cursor en zet je in insert mode?", "a": "o", "w": ["O", "a", "A"], "method": "i (vóór) · a (na) · o (nieuwe regel eronder)", "detail": "Hoofdletters: I begin van de regel · A einde van de regel · O nieuwe regel erboven.", "uitleg": "i = insert: begin te typen vóór de cursor · a = append: na de cursor · o = open: nieuwe regel onder de cursor", "waarom": "o = onder, O = boven; a = invoegen na de cursor, A = aan het einde van de regel."}, {"id": "vi-03", "ch": "13", "lab": false, "q": "vi (command mode): welke toets verwijdert het teken onder de cursor?", "a": "x", "w": ["X", "r", "s"], "method": "x (verwijderen) · r gevolgd door het nieuwe teken (vervangen)", "detail": "X verwijdert het teken vóór de cursor.", "uitleg": "x = verwijder het teken onder de cursor (X = het teken ervoor)", "waarom": "x = onder de cursor, X = ervóór; r = vervang één teken; s = verwijder het teken en ga naar insert mode."}, {"id": "vi-04", "ch": "13", "lab": false, "q": "vi (command mode): welke toets maakt de laatste wijziging ongedaan?", "a": "u", "w": ["U", ".", "Ctrl+R"], "method": "u (undo) · . (herhalen)", "detail": "Redo in vim: Ctrl+R.", "uitleg": "u = undo: maak de laatste wijziging ongedaan · . = herhaal de laatste wijziging", "waarom": "u = undo. U = alle wijzigingen op de huidige regel terugdraaien; . = herhaal de laatste wijziging; Ctrl+R = redo."}, {"id": "vi-05", "ch": "13", "lab": false, "q": "vi (command mode): welk commando knipt (verwijdert) de volledige huidige regel?", "a": "dd", "w": ["yy", "dw", "D"], "method": "dd (knippen) · yy (kopiëren) · p (plakken eronder)", "detail": "P plakt boven de huidige regel.", "uitleg": "dd = delete: knip de huidige regel · yy = yank: kopieer de huidige regel · p = put: plak onder de cursor", "waarom": "dd = delete line (gaat naar het klembord, plakken met p). yy kopieert; dw = één woord; D = van de cursor tot het einde van de regel."}, {"id": "vi-06", "ch": "13", "lab": false, "q": "vi (command mode): kopieer 2 regels vanaf de cursor.", "a": "2yy", "w": ["2dd", "yy2", "2p"], "method": "2yy · 3dd", "detail": "Een getal vóór het commando = zoveel keer.", "uitleg": "2yy = yank 2 regels: kopieer 2 regels · 3dd = delete 3 regels: knip 3 regels. Een getal ervoor = zoveel keer", "waarom": "Getal + commando herhaalt het. yy = yank (kopieer) regel; dd knipt; p plakt."}, {"id": "vi-07", "ch": "13", "lab": false, "q": "vi (command mode): welke toets springt naar het einde van de huidige regel?", "a": "$", "w": ["0", "^", "G"], "method": "0 of ^ (begin) · $ (einde)", "detail": "Zelfde tekens als de ankers in een regex.", "uitleg": "0 = begin van de regel · ^ = eerste niet-spatie van de regel · $ = einde van de regel", "waarom": "$ = einde (zoals in regex). 0 = begin van de regel, ^ = eerste niet-spatie, G = laatste regel van het bestand."}, {"id": "vi-08", "ch": "13", "lab": false, "q": "vi (command mode): welke toets voegt de volgende regel samen met de huidige?", "a": "J", "w": ["j", "K", "k"], "method": "J", "detail": "Kleine j = één regel naar beneden.", "uitleg": "J = join: voeg de volgende regel samen met de huidige", "waarom": "J = join. j en k bewegen de cursor omlaag en omhoog; K opent de man page van het woord onder de cursor."}, {"id": "vi-09", "ch": "13", "lab": false, "q": "vi (command mode): welke toets springt één woord terug?", "a": "b", "w": ["w", "e", "h"], "method": "w (vooruit) · b (achteruit)", "detail": "Combineer met een getal: 3w = drie woorden vooruit.", "uitleg": "w = word: één woord vooruit · b = back: één woord achteruit", "waarom": "b = back, w = begin volgend woord, e = einde van het woord, h = één teken naar links."}, {"id": "vi-10", "ch": "13", "lab": false, "q": "vi: sluit af zonder je wijzigingen op te slaan.", "a": ":q!", "w": [":q", ":wq", ":x"], "method": ":w · :q · :q! · :wq", "detail": "⚠ :q weigert als er niet-opgeslagen wijzigingen zijn: dan :q! of :wq.", "uitleg": ":w = write: opslaan · :q = quit: afsluiten · :q! = afsluiten zonder opslaan · :wq = opslaan en afsluiten", "waarom": "! = forceer. :q weigert als er niet-opgeslagen wijzigingen zijn; :wq en :x slaan op."}, {"id": "vi-11", "ch": "13", "lab": false, "q": "vi: zoek achterwaarts (naar boven) naar 'woord'.", "a": "?woord", "w": ["/woord", "N", ":s/woord"], "method": "/woord (vooruit) · ?woord (achteruit) · n (volgende)", "detail": "Zelfde toetsen als in less en man.", "uitleg": "/woord = zoek vooruit · ?woord = zoek achteruit · n = volgende match", "waarom": "? = achterwaarts, / = voorwaarts; n herhaalt in dezelfde richting. ✗ N herhaalt de vórige zoekopdracht in de andere richting (zoekt geen nieuw woord) · :s/woord is een vervanging op de huidige regel."}, {"id": "vi-12", "ch": "13", "lab": false, "q": "vi: vervang álle foo door bar in het hele bestand.", "a": ":1,$ s/foo/bar/g", "w": [":.,$ s/foo/bar/g", ":1,$ s/bar/foo/g", ":.,$ s/bar/foo/g"], "method": ":1,$ s/foo/bar/g", "detail": "1,$ = van regel 1 tot de laatste. Zonder g: enkel de eerste match per regel. Kort: :%s/foo/bar/g.", "uitleg": ": = ex-commando · 1,$ = van regel 1 tot de laatste regel · s/foo/bar/ = vervang foo door bar · g = alle keren per regel", "waarom": "1,$ = van regel 1 tot de laatste (ook: %); g = alle keren per regel. ✗ .,$ = van de huidige regel tot het einde · s/bar/foo/ vervangt in de verkeerde richting."}, {"id": "vi-13", "ch": "13", "lab": false, "q": "vi: voeg de uitvoer van het commando date in je bestand in.", "a": ":r !date", "w": [":!date", ":w !date", ":e !date"], "method": ":r !date", "detail": ":r bestand voegt een bestand in. :!cmd voert enkel uit, zonder in te voegen.", "uitleg": ":r = read: voeg in onder de cursor · !date = de uitvoer van het shell-commando date", "waarom": ":r = read (invoegen), !date = de uitvoer van date. ✗ :!date toont de uitvoer enkel · :w !date stuurt je bestand als invoer naar date · :e opent een bestand."}];
const KEY = 'linux-qcm-review';
let filter = 'all', deck = [], idx = 0, answers = {}, good = 0, bad = 0, wrongList = [];

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function codeify(s) { return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>'); }
function loadReview() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
function saveReview(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) {} document.getElementById('review-count').textContent = r.length; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function prepare(list) {
  return shuffle(list.map(c => ({ ...c, opts: shuffle([{ t: c.a, ok: true }, ...c.w.map(t => ({ t, ok: false }))]) })));
}
function buildDeck(src) {
  let list;
  if (src) list = src;
  else if (filter === 'all') list = ALL;
  else if (filter === 'lab') list = ALL.filter(c => c.lab);
  else if (filter === 'review') { const r = loadReview(); list = ALL.filter(c => r.includes(c.id)); if (!list.length) list = ALL; }
  else list = ALL.filter(c => c.ch === filter);
  deck = prepare(list); idx = 0; answers = {}; good = 0; bad = 0; wrongList = [];
  document.getElementById('done-screen').hidden = true;
  document.getElementById('qcard').hidden = false;
  updateStats(); render();
}
function updateStats() {
  document.getElementById('stat-good').textContent = good;
  document.getElementById('stat-bad').textContent = bad;
  const n = good + bad;
  document.getElementById('stat-pct').textContent = n ? Math.round(good / n * 100) + '%' : '–';
}
function render() {
  const c = deck[idx];
  document.getElementById('card-label').textContent = 'Vraag ' + (idx + 1) + (c.lab ? ' · uit de labo\'s' : '');
  document.getElementById('card-question').innerHTML = codeify(c.q);
  const box = document.getElementById('options'); box.innerHTML = '';
  const chosen = answers[idx];
  c.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    b.innerHTML = '<span class="key">' + 'ABCD'[i] + '</span><span class="txt">' + esc(o.t) + '</span>';
    b.onclick = () => choose(i);
    if (chosen !== undefined) {
      b.disabled = true;
      if (o.ok) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
      else b.classList.add('dim');
    }
    box.appendChild(b);
  });
  const ex = document.getElementById('expl');
  if (chosen !== undefined) {
    const ok = c.opts[chosen].ok;
    const v = document.getElementById('verdict');
    v.textContent = ok ? 'Juist.' : 'Niet juist. Het goede antwoord is groen gemarkeerd.';
    v.className = 'verdict ' + (ok ? 'ok' : 'ko');
    document.getElementById('expl-method').textContent = c.method || c.a;
    document.getElementById('expl-detail').innerHTML = codeify(c.detail || '');
    const wy = document.getElementById('expl-waarom');
    if (c.waarom) {
      const k = c.waarom.indexOf(' ✗ ');
      const main = k >= 0 ? c.waarom.slice(0, k) : c.waarom;
      const rest = k >= 0 ? c.waarom.slice(k + 3).split(' · ') : [];
      wy.innerHTML = '<div>' + codeify(main) + '</div>' + (rest.length ? '<div class="lbl">Waarom de andere opties fout zijn</div><ul>' + rest.map(x => '<li>' + codeify(x) + '</li>').join('') + '</ul>' : '');
      wy.hidden = false;
    } else wy.hidden = true;
    const ul = document.getElementById('expl-uitleg');
    if (c.uitleg) { ul.innerHTML = c.uitleg.split(' · ').map(p => { const i = p.indexOf(' = '); return i > 0 ? '<span class="k">' + esc(p.slice(0, i)) + '</span><span class="v">' + esc(p.slice(i + 3)) + '</span>' : '<span class="k"></span><span class="v">' + esc(p) + '</span>'; }).join(''); ul.hidden = false; } else { ul.hidden = true; }
    ex.hidden = false;
  } else ex.hidden = true;
  document.getElementById('current-num').textContent = idx + 1;
  document.getElementById('total-num').textContent = deck.length;
  const pct = Math.round((idx + 1) / deck.length * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = 'Vraag ' + (idx + 1) + ' van ' + deck.length + ' · ' + pct + '% van de reeks';
}
function choose(i) {
  if (answers[idx] !== undefined) return;
  answers[idx] = i;
  const c = deck[idx], ok = c.opts[i].ok;
  let r = loadReview().filter(x => x !== c.id);
  if (ok) good++; else { bad++; r.push(c.id); wrongList.push(c); }
  saveReview(r); updateStats(); render();
  document.getElementById('btn-next').focus({ preventScroll: true });
}
function nextQ() {
  if (idx + 1 >= deck.length) { if (Object.keys(answers).length) showDone(); return; }
  idx++; render();
}
function prevQ() { if (idx > 0) { idx--; render(); } }
function shuffleDeck() { buildDeck(deck.map(({ opts, ...c }) => c)); }
function showDone() {
  document.getElementById('qcard').hidden = true;
  document.getElementById('done-screen').hidden = false;
  document.getElementById('final-good').textContent = good;
  document.getElementById('final-bad').textContent = bad;
  const b = document.getElementById('btn-retry');
  b.hidden = !wrongList.length;
  b.textContent = 'Herhaal foute vragen (' + wrongList.length + ') ↗';
}
function restartWrong() { buildDeck(wrongList.map(({ opts, ...c }) => c)); }
function restartAll() { buildDeck(); }
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); buildDeck();
}
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  const map = { '1': 0, '2': 1, '3': 2, '4': 3, 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
  if (k in map && !document.getElementById('qcard').hidden) { choose(map[k]); return; }
  if (e.key === 'ArrowRight' || (e.key === 'Enter' && answers[idx] !== undefined)) { e.preventDefault(); nextQ(); }
  if (e.key === 'ArrowLeft') prevQ();
  if (k === 's') shuffleDeck();
});
saveReview(loadReview());
buildDeck();
</script>
