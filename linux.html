et -euo errexit", "set -eux errexit"], "method": "set -euo pipefail", "detail": "De cursus raadt de lange vorm aan (leesbaarder).", "uitleg": "set = shell-opties · -e = errexit · -u = nounset · -o pipefail = pipefail (heeft geen korte letter)", "waarom": "-e = errexit, -u = nounset, -o pipefail (pipefail heeft geen korte letter). ✗ -x zet tracing aan en dan is pipefail gewoon een argument · -o errexit herhaalt -e en vergeet pipefail."}, {"id": "script-32", "ch": "8", "lab": true, "q": "Labo Scripting 102: controleer of ${age} een positief geheel getal is (enkel cijfers).", "a": "[[ \"${age}\" =~ ^[0-9]+$ ]]", "w": ["[[ \"${age}\" =~ [0-9]+ ]]", "[[ \"${age}\" == ^[0-9]+$ ]]", "[[ \"${age}\" == [0-9]+ ]]"], "method": "[[ \"${age}\" =~ ^[0-9]+$ ]]", "detail": "Leeg of 'twintig' → false. ⚠ Zonder deze test geeft `[ \"${age}\" -ge 18 ]` 'integer expression expected'.", "uitleg": "[[ ]] = uitgebreide Bash-test · \"${age}\" = de variabele · =~ = vergelijk met een regex · ^[0-9]+$ = van begin (^) tot einde ($) één of meer (+) cijfers", "waarom": "=~ = regex. ^ en $ verplichten dat de hele string uit cijfers bestaat; zonder ankers is 'a1b' ook goed. == vergelijkt met een glob, geen regex."}, {"id": "script-33", "ch": "8", "lab": true, "q": "Labo Scripting 102: test of ping lukt, zonder dat er iets op het scherm komt.", "a": "if ping -c 1 1.1.1.1 > /dev/null 2>&1; then", "w": ["if ping -c 1 1.1.1.1 2>&1 > /dev/null; then", "if [ ping -c 1 1.1.1.1 ] > /dev/null 2>&1; then", "if [ ping -c 1 1.1.1.1 ] 2>&1 > /dev/null; then"], "method": "if ping -c 1 1.1.1.1 > /dev/null 2>&1; then ... fi", "detail": "Het if test de exit-status van ping.", "uitleg": "ping = test bereikbaarheid · -c 1 = count: één pakket · 1.1.1.1 = het IP-adres · > /dev/null 2>&1 = gooi alle uitvoer weg · if ...; then ... fi = reageer op de exit-status van ping", "waarom": "if test de exit-status van het commando zelf, zonder [ ]. Volgorde: eerst stdout weg, dan stderr erachteraan."}, {"id": "script-34", "ch": "8", "lab": true, "q": "Labo Scripting 102: test of DNS-naamomzetting werkt, zonder dig of nslookup.", "a": "getent ahosts icanhazip.com", "w": ["getent passwd icanhazip.com", "ip route get icanhazip.com", "ss -tn icanhazip.com"], "method": "getent ahosts icanhazip.com", "detail": "Exit-status 0 = naam opgelost.", "uitleg": "getent = vraag een record op · ahosts = de hosts-databank, inclusief DNS · icanhazip.com = de naam die opgezocht wordt. Exit-status 0 = DNS werkt", "waarom": "getent ahosts zet een naam om via de systeem-resolver. ✗ passwd zoekt een gebruiker · ip route get verwacht een IP-adres · ss toont verbindingen."}, {"id": "script-35", "ch": "8", "lab": true, "q": "Labo Scripting 103: druk het tiende argument af, of niets als het ontbreekt — ook met nounset aan.", "a": "echo \"${10:-}\"", "w": ["echo \"$10\"", "echo \"${10}\"", "echo \"${1:-0}\""], "method": "\"${3:-}\"   en   \"${10:-}\"", "detail": "⚠ `$10` = `${1}0`.", "uitleg": "\"${3:-}\" = derde parameter, of een lege string als ze niet bestaat (veilig onder nounset) · \"${10:-}\" = tiende parameter: accolades verplicht vanaf 10", "waarom": "${10:-} = het tiende argument of leeg, zonder 'unbound variable'. ✗ $10 = $1 + '0' · ${10} faalt onder nounset als het ontbreekt · ${1:-0} = eerste argument of 0."}, {"id": "script-36", "ch": "8", "lab": true, "q": "Labo Scripting 103: schuif de argumenten drie plaatsen op, maar enkel als er méér dan drie zijn.", "a": "if [ \"$#\" -gt 3 ]; then shift 3; fi", "w": ["if [ \"$#\" -ge 3 ]; then shift 3; fi", "if [ \"$#\" -gt 3 ]; then shift; fi", "if [ \"$#\" -ge 3 ]; then shift; fi"], "method": "if [ \"$#\" -gt 3 ]; then shift 3; fi", "detail": "", "uitleg": "[ \"$#\" -gt 3 ] = meer dan 3 parameters? · shift 3 = schuif alle parameters drie plaatsen op ($4 wordt $1)", "waarom": "-gt = strikt groter dan (méér dan drie); shift 3 = drie plaatsen. -ge = groter of gelijk; shift zonder getal = één plaats."}, {"id": "script-37", "ch": "8", "lab": true, "q": "Labo Scripting 103: druk elk argument op een aparte regel af; `./args.sh a \"een test\"` moet 2 regels geven.", "a": "for arg in \"$@\"; do echo \"${arg}\"; done", "w": ["for arg in \"$*\"; do echo \"${arg}\"; done", "for arg in $@; do echo \"${arg}\"; done", "for arg in \"$#\"; do echo \"${arg}\"; done"], "method": "for arg in \"$@\"; do echo \"${arg}\"; done", "detail": "Met `$*` of zonder quotes wordt 'een test' gesplitst.", "uitleg": "for arg in \"$@\" = loop over alle parameters; \"$@\" met quotes houdt elk argument apart, ook met spaties · do echo \"${arg}\"; done = druk elk argument op een eigen regel af", "waarom": "\"$@\" houdt \"een test\" als één geheel. \"$*\" = alles in één woord (1 regel) · $@ zonder quotes splitst op spaties (3 regels) · \"$#\" = het aantal (2)."}, {"id": "script-38", "ch": "8", "lab": true, "q": "Labo Scripting 103: toon /etc/passwd als nette tabel, numeriek gesorteerd op UID (veld 3, scheidingsteken :).", "a": "sort -t: -k3 -n /etc/passwd | column -t -s:", "w": ["sort -t: -k3 /etc/passwd | column -t -s:", "sort -d: -k3 -n /etc/passwd | column -t -s:", "sort -d: -k3 /etc/passwd | column -t -s:"], "method": "sort -t: -k3 -n /etc/passwd | column -t -s:", "detail": "`-t:` scheidingsteken, `-k3` veld 3, `-n` numeriek.", "uitleg": "sort -t: = scheidingsteken : · -k3 = sorteer op veld 3 (UID) · -n = numeriek · /etc/passwd = het bestand · | column -t = toon als tabel · -s: = scheidingsteken :", "waarom": "sort -t = scheidingsteken, -k3 = veld 3, -n = numeriek (anders komt 1000 vóór 33). -d is bij sort 'woordenboekvolgorde'."}, {"id": "script-39", "ch": "8", "lab": true, "q": "Labo Scripting 103: controleer dat het argument precies één cijfer van 1 t/m 7 is, zónder foutmelding als iemand 'foo' ingeeft.", "a": "[[ \"${1}\" =~ ^[1-7]$ ]]", "w": ["[[ \"${1}\" =~ [1-7] ]]", "[ \"${1}\" -ge 1 ] && [ \"${1}\" -le 7 ]", "[ \"${1}\" -ge 1 ] || [ \"${1}\" -le 7 ]"], "method": "[[ \"${1}\" =~ ^[1-7]$ ]]", "detail": "`[ \"${1}\" -ge 1 ]` met 'foo' geeft 'integer expression expected'.", "uitleg": "[[ ]] = Bash-test · =~ = regex-vergelijking · ^[1-7]$ = precies één teken, een cijfer van 1 tot 7", "waarom": "Met ankers moet de hele invoer één cijfer 1–7 zijn. Zonder ankers is '17' of 'a3' ook goed. -ge op 'foo' geeft 'integer expression expected'."}, {"id": "script-40", "ch": "8", "lab": true, "q": "Labo Scripting 103: srm.sh moet mappen én symbolische links overslaan. Wat is de valkuil bij de testen?", "a": "eerst -L testen: -f is ook waar voor een link naar een bestand", "w": ["eerst -f testen: -L is ook waar voor een gewoon bestand", "-d volstaat: een link is technisch een map", "! -f volstaat: -f is altijd onwaar voor een link"], "method": "if [ -L \"${f}\" ] || [ ! -f \"${f}\" ]; then\n  echo \"${f} is not a file! Skipping...\"\n  continue\nfi", "detail": "⚠ `-f` is ook waar voor een link naar een bestand, dus eerst `-L` testen.", "uitleg": "[ -L \"${f}\" ] = is f een symbolische link? · || = of · [ ! -f \"${f}\" ] = is f GEEN gewoon bestand? · echo = melding · continue = spring naar de volgende iteratie van de lus", "waarom": "-f en -d volgen de link naar het doel. Enkel -L (of -h) test of iets zelf een link is."}, {"id": "script-41", "ch": "8", "lab": true, "q": "Labo Scripting 103: comprimeer het bestand ${f} met gzip en verplaats het resultaat naar ~/.trash/.", "a": "gzip \"${f}\" && mv -v \"${f}.gz\" ~/.trash/", "w": ["gzip \"${f}\" && mv -v \"${f}\" ~/.trash/", "gzip \"${f}\" || mv -v \"${f}.gz\" ~/.trash/", "gzip \"${f}\" || mv -v \"${f}\" ~/.trash/"], "method": "gzip \"${f}\"\nmv -v \"${f}.gz\" ~/.trash/", "detail": "Quotes: werkt ook met spaties in de naam.", "uitleg": "gzip = comprimeer het bestand (wordt bestand.gz) · && = enkel als dat lukt · mv = verplaats · -v = verbose: meld wat er gebeurt · ~/.trash/ = doelmap", "waarom": "gzip vervangt f door f.gz (het origineel verdwijnt). && = enkel verplaatsen als gzip lukte; || zou enkel verplaatsen als gzip faalde."}, {"id": "script-42", "ch": "8", "lab": true, "q": "Labo Scripting 103: verwijder de bestanden in ~/.trash die langer dan 2 weken geleden gewijzigd zijn.", "a": "find ~/.trash -type f -mtime +14 -exec rm -v {} +", "w": ["find ~/.trash -type f -mtime -14 -exec rm -v {} +", "find ~/.trash -type f -mmin +14 -exec rm -v {} +", "find ~/.trash -type f -mmin -14 -exec rm -v {} +"], "method": "find ~/.trash -type f -mtime +14 -exec rm -v {} +\ntouch -t 200001010000 oldfile.txt.gz", "detail": "", "uitleg": "find ~/.trash = zoek in de trash-map · -type f = gewone bestanden · -mtime +14 = gewijzigd meer dan 14 dagen geleden · -exec rm -v {} + = verwijder ze (verbose) · touch -t 200001010000 = zet de tijdstempel op JJJJMMDDuumm", "waarom": "-mtime telt in dagen: +14 = meer dan 14 dagen geleden, -14 = minder dan 14 dagen. -mmin telt in minuten."}, {"id": "script-43", "ch": "8", "lab": true, "q": "Labo Scripting 201: kies 4 willekeurige woorden uit /usr/share/dict/words.", "a": "shuf -n 4 /usr/share/dict/words", "w": ["shuf -e 4 /usr/share/dict/words", "sort -R /usr/share/dict/words", "head -n 4 /usr/share/dict/words"], "method": "shuf -n 4 /usr/share/dict/words", "detail": "", "uitleg": "shuf = schud regels willekeurig door elkaar · -n 4 = toon er maar 4 · /usr/share/dict/words = de woordenlijst", "waarom": "shuf -n 4 = 4 willekeurige regels. ✗ -e schudt de argumenten zelf (4 en de bestandsnaam) · sort -R schudt alles, maar geeft alle regels · head geeft altijd dezelfde eerste 4."}, {"id": "script-44", "ch": "8", "lab": true, "q": "Labo Scripting 201: je script toont zijn eigen hulp: druk de regels die beginnen met ## af, zonder de ## en de spatie erna.", "a": "grep '^##' \"${0}\" | sed 's/^## \\{0,1\\}//'", "w": ["grep '^##' \"${1}\" | sed 's/^## \\{0,1\\}//'", "grep '^##' \"${0}\" | sed 's/^## \\{0,1\\}//g' | head -n 1", "grep '##' \"${0}\" | sed 's/##//'"], "method": "grep '^##' \"${0}\" | sed 's/^## \\{0,1\\}//'", "detail": "", "uitleg": "grep '^##' = regels die beginnen met ## · \"${0}\" = het script zelf · | sed 's/^## \\{0,1\\}//' = verwijder ## en een optionele spatie aan het begin van de regel", "waarom": "$0 = het script zelf ($1 is het eerste argument). ^## = enkel aan het begin van de regel; \\{0,1\\} = de spatie mag ontbreken. Zonder ^ pak je ook ## midden in code."}, {"id": "script-45", "ch": "8", "lab": true, "q": "Labo Scripting 201: welke tar-opties maken (create) een met bzip2 gecomprimeerd archief?", "a": "tar -cjf", "w": ["tar -czf", "tar -xjf", "tar -xzf"], "method": "tar -cjf \"${dest}/$(basename \"${dir}\")-$(date +%Y%m%d%H%M).tar.bz2\" \"${dir}\" > \"${dest}/backup-$(date +%Y%m%d%H%M).log\" 2>&1", "detail": "`c` create, `j` bzip2, `f` bestand. Timestamp formaat JJJJMMDDUUMM.", "uitleg": "tar = archief · -c = create · -j = bzip2-compressie · -f = file: naam van het archief · $(basename \"${dir}\") = enkel de mapnaam · $(date +%Y%m%d%H%M) = timestamp · > log 2>&1 = stdout en stderr naar het logbestand", "waarom": "c = create, x = extract; j = bzip2, z = gzip (J = xz); f = bestandsnaam volgt."}, {"id": "script-46", "ch": "8", "lab": true, "q": "Labo Scripting 201: in strict mode doe je `git log --pretty=oneline | wc -l` in een repo zonder commits. Wat is de valkuil?", "a": "git log faalt, dus door pipefail faalt de pipeline en errexit stopt je script", "w": ["git log faalt, maar wc -l lukt, dus de pipeline lukt en je script loopt verder met 0", "wc -l geeft een foutmelding bij 0 regels, en errexit stopt je script", "git log toont dan 'no commits', dus je krijgt 1 in plaats van 0"], "method": "git log --pretty=oneline | wc -l", "detail": "⚠ Zonder commits faalt `git log` (exit 128): met errexit + pipefail stopt je script.", "uitleg": "git log = historiek · --pretty=oneline = één regel per commit · | wc -l = tel de regels, dus het aantal commits", "waarom": "Zonder pipefail telt enkel de exit-status van wc. Mét pipefail (strict mode) faalt de hele pipeline, en errexit stopt het script."}, {"id": "script-47", "ch": "8", "lab": true, "q": "Labo Scripting 201: test of bestand een character special file is (zoals /dev/null).", "a": "[ -c bestand ]", "w": ["[ -b bestand ]", "[ -p bestand ]", "[ -s bestand ]"], "method": "[ -b bestand ]   ·   [ -c bestand ]", "detail": "Bestandstype opvragen: `file bestand`.", "uitleg": "[ -b bestand ] = is het een block special bestand (bv. een schijf)? · [ -c bestand ] = is het een character special bestand (bv. een terminal)?", "waarom": "-c = character device. -b = block device (schijven), -p = named pipe, -s = bestaat en is niet leeg."}, {"id": "script-48", "ch": "8", "lab": false, "q": "Het script wordt gestart als `./task.sh a.csv b.csv`. Wat zijn $0, $1 en $#?", "a": "$0 = ./task.sh · $1 = a.csv · $# = 2", "w": ["$0 = a.csv · $1 = b.csv · $# = 2", "$0 = ./task.sh · $1 = a.csv · $# = 3", "$0 = a.csv · $1 = b.csv · $# = 3"], "method": "$0 = ./task.sh · $1 = a.csv · $# = 2", "detail": "", "uitleg": "", "waarom": "$0 = hoe het script aangeroepen werd; $1… = de argumenten; $# telt enkel de argumenten, niet $0."}, {"id": "script-49", "ch": "8", "lab": false, "q": "Welke for-lus in C-stijl telt van 1 tot en met 5?", "a": "for (( i=1; i<=5; i++ )); do echo \"$i\"; done", "w": ["for (( i=1; i<5; i++ )); do echo \"$i\"; done", "for ( i=1; i<=5; i++ ); do echo \"$i\"; done", "for ( i=1; i<5; i++ ); do echo \"$i\"; done"], "method": "for (( i=1; i<=5; i++ )); do echo \"$i\"; done", "detail": "", "uitleg": "", "waarom": "Dubbele haakjes (( )) voor rekenen; <= om 5 mee te nemen. Met < stopt de lus bij 4; enkele haakjes zijn een syntaxfout."}, {"id": "script-50", "ch": "8", "lab": false, "q": "Welke lus verwerkt de opties van een script één voor één tot er geen argumenten meer zijn?", "a": "while [ \"$#\" -gt 0 ]; do case \"$1\" in … esac; shift; done", "w": ["while [ \"$#\" -gt 0 ]; do case \"$1\" in … esac; done", "until [ \"$#\" -gt 0 ]; do case \"$1\" in … esac; shift; done", "until [ \"$#\" -gt 0 ]; do case \"$1\" in … esac; done"], "method": "while [ \"$#\" -gt 0 ]; do case \"$1\" in … esac; shift; done", "detail": "", "uitleg": "", "waarom": "Elke ronde bekijk je $1 en schuif je op met shift. Zonder shift blijft $1 hetzelfde (eindeloze lus). until … -gt 0 stopt meteen zodra er argumenten zijn."}, {"id": "script-51", "ch": "8", "lab": false, "q": "Welke case-tak vangt zowel -h als --help op en toont de hulp?", "a": "-h|--help) usage; exit 0 ;;", "w": ["-h||--help) usage; exit 0 ;;", "-h,--help) usage; exit 0 ;;", "\"-h --help\") usage; exit 0 ;;"], "method": "-h|--help) usage; exit 0 ;;", "detail": "", "uitleg": "", "waarom": "In case scheid je alternatieve patronen met één |. Hulp vragen is geen fout, dus exit 0."}, {"id": "script-52", "ch": "8", "lab": false, "q": "Welk case-patroon matcht elk argument dat eindigt op .csv?", "a": "*.csv)", "w": ["'*.csv')", ".csv)", "*\\.csv$)"], "method": "*.csv)", "detail": "", "uitleg": "", "waarom": "case gebruikt globbing, geen regex. Tussen quotes wordt * letterlijk; .csv alleen matcht enkel exact '.csv'; $ is geen anker in een glob."}, {"id": "script-53", "ch": "8", "lab": false, "q": "Binnen een Bash-functie: wat is $1?", "a": "het eerste argument dat aan de functie werd meegegeven", "w": ["het eerste argument dat aan het script werd meegegeven", "de naam van de functie", "de exit-status van de vorige functie"], "method": "het eerste argument dat aan de functie werd meegegeven", "detail": "", "uitleg": "", "waarom": "Binnen een functie gaan $1, $2, $#, \"$@\" over de argumenten van de functie. Wil je die van het script, geef ze dan door: myfunc \"$@\"."}, {"id": "script-54", "ch": "8", "lab": false, "q": "Welke test controleert dat ${file} bestaat én een gewoon bestand is (geen map)?", "a": "[ -f \"${file}\" ]", "w": ["[ -e \"${file}\" ]", "[ -d \"${file}\" ]", "[ -r \"${file}\" ]"], "method": "[ -f \"${file}\" ]", "detail": "", "uitleg": "", "waarom": "-f = regular file. ✗ -e = bestaat, ook als map · -d = map · -r = leesbaar."}, {"id": "regex-01", "ch": "9", "lab": false, "q": "Globbing: wat matcht `[!5]` in een bestandsnaampatroon?", "a": "precies één teken, eender welk behalve 5", "w": ["precies één teken: een 5 of een uitroepteken", "nul of meer tekens, behalve 5", "eender welke naam die geen 5 bevat"], "method": "* = 0 of meer tekens · ? = precies 1 · [A5] = A of 5 · [!5] = alles behalve 5", "detail": "Globbing werkt op bestandsnamen en wordt door de shell uitgewerkt.", "waarom": "[ ] = precies één teken uit de set; ! (of ^) vooraan = negatie. `ls file[!5]` matcht file1 maar niet file5 of file12."}, {"id": "regex-02", "ch": "9", "lab": false, "q": "Hoe druk je een letterlijke * af, zonder dat de shell hem vervangt door bestandsnamen?", "a": "echo '*'", "w": ["echo *", "echo $*", "echo `*`"], "method": "echo \\*   ·   echo '*'   ·   echo \"*\"", "detail": "", "uitleg": "echo = druk af · '*' = tussen enkele quotes: letterlijk · \\* = backslash: escape dit ene teken · \"*\" = tussen dubbele quotes: ook geen globbing", "waarom": "Quotes stoppen globbing. ✗ echo * toont alle bestanden · $* = alle argumenten van het script · backticks voeren * uit als commando."}, {"id": "regex-03", "ch": "9", "lab": false, "q": "Wat maakt `touch test{1,2,3}`?", "a": "drie bestanden: test1, test2 en test3", "w": ["één bestand met de naam test{1,2,3}", "één bestand met de naam test1,2,3", "één bestand met de naam test123"], "method": "test1 test2 test3", "detail": "Accolades = brace expansion, geen globbing. Werkt ook als de bestanden nog niet bestaan.", "uitleg": "touch = maak lege bestanden · test{1,2,3} = brace expansion: de shell maakt er test1 test2 test3 van", "waarom": "Brace expansion maakt van één woord meerdere woorden, ook als de bestanden nog niet bestaan (anders dan globbing)."}, {"id": "regex-04", "ch": "9", "lab": false, "q": "Globbing: welke namen matcht `ls file[[:lower:]]*`?", "a": "file + één kleine letter + eender wat (ook niets)", "w": ["file + enkel kleine letters tot het einde", "file + precies één kleine letter, niets meer", "file + één letter (klein of groot) + eender wat"], "method": "Bestanden die beginnen met 'file' + een kleine letter", "detail": "Klassen: [:lower:] [:upper:] [:digit:] [:alpha:] [:space:]. Veiliger dan [a-z], dat van `$LANG` afhangt.", "waarom": "[[:lower:]] = precies één kleine letter; * = nul of meer willekeurige tekens. filea en fileaB1 matchen, fileA niet."}, {"id": "regex-05", "ch": "9", "lab": false, "q": "Wat betekent * in een reguliere expressie (grep, sed)?", "a": "het vorige teken nul of meer keer", "w": ["eender welke reeks tekens", "precies één willekeurig teken", "het vorige teken één of meer keer"], "method": "Glob: * = eender welke tekens\nRegex: * = vorige teken 0 of meer keer", "detail": "Regex-equivalent van glob * is `.*`.", "waarom": "In regex hoort * bij het teken ervóór: `ab*` = a, ab, abb… 'Eender wat' is in regex `.*`. Eén of meer is +."}, {"id": "regex-06", "ch": "9", "lab": false, "q": "Regex: wat betekent ^ buiten vierkante haken, bv. in `grep '^#'`?", "a": "het begin van de regel", "w": ["het einde van de regel", "een negatie: alles behalve #", "een letterlijk ^-teken"], "method": "^ = begin van de regel · $ = einde van de regel", "detail": "`grep '^Val' names`, `grep 'a$' names`. ⚠ Zet regex tussen quotes.", "waarom": "^ = begin, $ = einde. Enkel binnen [ ] vooraan betekent ^ 'niet': [^0-9]."}, {"id": "regex-07", "ch": "9", "lab": false, "q": "Regex: wat betekent een punt . in een patroon?", "a": "precies één willekeurig teken", "w": ["nul of meer willekeurige tekens", "een letterlijke punt", "één letter of cijfer"], "method": "Precies één willekeurig teken", "detail": "Letterlijke punt: `\\.`", "waarom": "Een letterlijke punt schrijf je als \\. (bv. '\\.txt$')."}, {"id": "regex-08", "ch": "9", "lab": false, "q": "Wat is het verschil tussen basic regex (grep) en extended regex (grep -E)?", "a": "in ERE werken + ? {} | () zonder backslash; in BRE moet je ze escapen", "w": ["in BRE werken + ? {} | () zonder backslash; in ERE moet je ze escapen", "ERE ondersteunt geen ^ en $", "BRE is hoofdletterongevoelig, ERE niet"], "method": "In ERE werken + ? {} | () zonder backslash", "detail": "BRE: `grep 'i\\|a'`. ERE: `grep -E 'i|a'`.", "waarom": "In BRE schrijf je \\+, \\{3\\}, \\(…\\); in ERE gewoon +, {3}, (…)."}, {"id": "regex-09", "ch": "9", "lab": false, "q": "Extended regex: wat betekent o+?", "a": "minstens één o", "w": ["nul of meer o's", "precies één o", "een o gevolgd door een plusteken"], "method": "o* = 0 of meer o's (matcht elke regel!)\no+ = minstens één o", "detail": "", "waarom": "+ = 1 of meer, * = 0 of meer, ? = 0 of 1. (In basic regex is + letterlijk, tenzij je \\+ schrijft.)"}, {"id": "regex-10", "ch": "9", "lab": false, "q": "Zoek met grep regels met precies 3 keer o na elkaar (ooo).", "a": "grep -E 'o{3}'", "w": ["grep -E 'o[3]'", "grep -F 'o{3}'", "grep -F 'o[3]'"], "method": "o{3}   ·   o{2,3}   (met grep -E)", "detail": "In sed (BRE): `o\\{3\\}`.", "uitleg": "grep = zoek · -E = extended regex · 'o{3}' = precies 3 keer de letter o na elkaar (tussen quotes)", "waarom": "{n} = precies n keer (ERE). ✗ [3] = het cijfer 3 · -F zoekt vaste tekst: letterlijk o{3} of o[3]."}, {"id": "regex-11", "ch": "9", "lab": false, "q": "Zoek over als heel woord, zodat overalls of moreover níet matchen.", "a": "grep -w over", "w": ["grep -x over", "grep -o over", "grep -i over"], "method": "grep -w over   (of '\\bover\\b')", "detail": "", "uitleg": "grep = zoek · -w = word: enkel als heel woord, niet als deel van een langer woord · over = het woord", "waarom": "-w = word. ✗ -x = de hele regel moet 'over' zijn · -o toont het stuk, maar matcht ook in overalls · -i = hoofdletterongevoelig."}, {"id": "regex-12", "ch": "9", "lab": false, "q": "sed: vervang in het bestand today zelf de eerste Sun op elke regel door Mon.", "a": "sed -i 's/Sun/Mon/' today", "w": ["sed 's/Sun/Mon/' today", "sed -i 's/Mon/Sun/' today", "sed 's/Mon/Sun/' today"], "method": "sed -i 's/Sun/Mon/' today", "detail": "Zonder `-i` toont sed enkel het resultaat.", "uitleg": "sed = stream editor · -i = in place: pas het bestand aan · 's/Sun/Mon/' = vervang de eerste Sun per regel door Mon · today = het bestand", "waarom": "s/ZOEK/VERVANG/; -i = in het bestand zelf. Zonder -i zie je het resultaat enkel op het scherm."}, {"id": "regex-13", "ch": "9", "lab": false, "q": "sed met BRE: maak van 2014-04-01 de tekst 01:04:2014.", "a": "sed 's/\\(....\\)-\\(..\\)-\\(..\\)/\\3:\\2:\\1/'", "w": ["sed 's/\\(....\\)-\\(..\\)-\\(..\\)/\\1:\\2:\\3/'", "sed 's/(....)-(..)-(..)/\\3:\\2:\\1/'", "sed 's/(....)-(..)-(..)/\\1:\\2:\\3/'"], "method": "sed 's/\\(....\\)-\\(..\\)-\\(..\\)/\\3:\\2:\\1/'", "detail": "`\\( \\)` onthoudt een groep, `\\1` haalt ze terug.", "uitleg": "sed 's/.../.../' = vervang · \\( \\) = onthoud een groep (BRE) · .... = 4 willekeurige tekens · \\3:\\2:\\1 = zet groep 3, 2 en 1 terug, gescheiden door :", "waarom": "Groepen in BRE: \\( \\); \\1, \\2, \\3 = de groepen in volgorde. Zonder backslash zijn ( ) letterlijke haakjes (dat werkt enkel met sed -E)."}, {"id": "regex-14", "ch": "9", "lab": false, "q": "Hernoem in één commando alle .text-bestanden naar .txt (perl-rename).", "a": "rename 's/\\.text$/.txt/' *.text", "w": ["rename 's/\\.txt$/.text/' *.text", "mv *.text *.txt", "mv '*.text' '*.txt'"], "method": "rename 's/\\.text$/.txt/' *.text", "detail": "`rename -n` = droogtest: tonen zonder te doen.", "uitleg": "rename = hernoem bestanden met een Perl-regex · 's/\\.text$/.txt/' = vervang .text aan het einde ($) door .txt; \\. = letterlijke punt · *.text = alle .text-bestanden", "waarom": "rename past de regex toe op elke naam. ✗ omgekeerde regex verandert niets · mv met meerdere bronnen verwacht een map als laatste argument · tussen quotes zoekt mv een bestand dat letterlijk *.text heet."}, {"id": "regex-15", "ch": "9", "lab": true, "q": "Labo Text Processing: maak de bestanden file, filea, fileb, filec en filed in één commando.", "a": "touch file{,a,b,c,d}", "w": ["touch file{a,b,c,d}", "touch file{a..d}", "touch file[,a,b,c,d]"], "method": "touch file{,a,b,c,d}", "detail": "Brace expansion. `{1..19}` voor reeksen.", "uitleg": "touch = maak lege bestanden · file{,a,b,c,d} = brace expansion: file + (niets, a, b, c, d) = file filea fileb filec filed", "waarom": "Het lege element vóór de eerste komma levert 'file' zelf op. {a..d} en {a,b,c,d} maken enkel filea t/m filed; [ ] is globbing, geen expansie."}, {"id": "regex-16", "ch": "9", "lab": true, "q": "Labo Text Processing: toon met globbing de namen die bestaan uit file gevolgd door precies één cijfer.", "a": "ls file[0-9]", "w": ["ls file?", "ls file[0-9]*", "ls file*[0-9]"], "method": "ls file?   ·   ls file[[:alpha:]]   ·   ls file[0-9]", "detail": "Geen regex of grep: alleen globbing.", "uitleg": "ls file? = file + precies één teken · ls file[[:alpha:]] = file + één letter · ls file[0-9] = file + één cijfer · de shell werkt de patronen uit (globbing)", "waarom": "[0-9] = precies één cijfer. ✗ ? = eender welk teken (ook filea) · [0-9]* laat nog meer toe (file12) · *[0-9] = eender wat en eindigend op een cijfer."}, {"id": "regex-17", "ch": "9", "lab": true, "q": "Labo Text Processing: toon met globbing enkel file12, file13, file14, file15 en file16.", "a": "ls file1[2-6]", "w": ["ls file1[26]", "ls file[12-16]", "ls file[12,16]"], "method": "ls file1[2-6]   ·   ls file[!1]*", "detail": "⚠ `file[!1]*` toont `file` zelf niet (er volgt geen teken). Erbij: `ls file file[!1]*`.", "uitleg": "ls file1[2-6] = file1 + één cijfer van 2 tot 6 · ls file[!1]* = file + één teken dat GEEN 1 is + de rest · ; = voer beide na elkaar uit", "waarom": "[ ] is één teken: na 'file1' komt één cijfer van 2 t/m 6. ✗ [26] = enkel 2 of 6 · [12-16] en [12,16] zijn ook maar één teken (1, 2, 6, komma…)."}, {"id": "regex-18", "ch": "9", "lab": false, "q": "Wanneer gebruik je globbing en wanneer een reguliere expressie?", "a": "globbing om bestandsnamen te selecteren in de shell; regex om patronen in tekst te zoeken met grep, sed of awk", "w": ["regex om bestandsnamen te selecteren in de shell; globbing om patronen in tekst te zoeken met grep, sed of awk", "globbing enkel in scripts; regex enkel op de commandoregel", "ze zijn uitwisselbaar: elk patroon werkt in beide"], "method": "globbing om bestandsnamen te selecteren in de shell; regex om patronen in tekst te zoeken met grep, sed of awk", "detail": "", "uitleg": "", "waarom": "Dezelfde tekens betekenen iets anders: * is in een glob 'eender wat', in regex 'het vorige teken 0+ keer'."}, {"id": "regex-19", "ch": "9", "lab": false, "q": "Wat is in een reguliere expressie het equivalent van het glob-teken ? (precies één willekeurig teken)?", "a": ".", "w": ["?", "*", ".*"], "method": ".", "detail": "", "uitleg": "", "waarom": "In regex is . één willekeurig teken. ? betekent daar 'het vorige teken 0 of 1 keer'; .* = eender welke reeks."}, {"id": "regex-20", "ch": "9", "lab": false, "q": "Hoe schrijf je 'één teken dat géén cijfer is' als glob en als regex?", "a": "glob [!0-9] · regex [^0-9]", "w": ["glob [^0-9] · regex [!0-9]", "glob [!0-9] · regex [!0-9]", "glob ?[0-9] · regex .[0-9]"], "method": "glob [!0-9] · regex [^0-9]", "detail": "", "uitleg": "", "waarom": "Negatie in een glob: ! (Bash aanvaardt ook ^). In regex: enkel ^ vooraan binnen [ ]; [!0-9] is in regex 'een ! of een cijfer'."}, {"id": "regex-21", "ch": "9", "lab": false, "q": "Welke man pages leggen globbing en reguliere expressies uit?", "a": "man 7 glob en man 7 regex", "w": ["man 3 glob en man 3 regex", "man 1 glob en man 1 regex", "man 5 glob en man 5 regex"], "method": "man 7 glob en man 7 regex", "detail": "", "uitleg": "", "waarom": "Sectie 7 = overzichten en conventies. Sectie 3 bevat de C-functies glob() en regcomp(); sectie 1 heeft geen pagina's met die namen."}, {"id": "regex-22", "ch": "9", "lab": false, "q": "Waarom zet je het patroon tussen enkele quotes in `grep '^[0-9]*$' bestand`?", "a": "zodat de shell het patroon niet zelf uitwerkt (bv. als glob)", "w": ["zodat grep weet dat het om extended regex gaat", "zodat grep zonder onderscheid in hoofdletters zoekt", "omdat grep zonder quotes enkel letterlijke tekst zoekt"], "method": "zodat de shell het patroon niet zelf uitwerkt (bv. als glob)", "detail": "", "uitleg": "", "waarom": "[0-9]* is ook een geldige glob: zonder quotes kan de shell het vervangen door bestandsnamen. Extended regex = -E."}, {"id": "regex-23", "ch": "9", "lab": false, "q": "Welke grep toont enkel regels die volledig bestaan uit een datum als 2026-10-30?", "a": "grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'", "w": ["grep -G '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'", "grep -E '\\<[0-9]{4}-[0-9]{2}-[0-9]{2}\\>'", "grep -G '\\<[0-9]{4}-[0-9]{2}-[0-9]{2}\\>'"], "method": "grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'", "detail": "", "uitleg": "", "waarom": "^ en $ verplichten dat de hele regel de datum is; -E is nodig om {4} zonder backslash te gebruiken. ✗ -G (basic regex) leest { } letterlijk · \\< \\> zijn woordgrenzen: 'Datum: 2026-10-30 ok' matcht dan ook."}, {"id": "regex-24", "ch": "9", "lab": false, "q": "Welke grep toont de regels die beginnen met ERROR of met WARN?", "a": "grep -E '^(ERROR|WARN)'", "w": ["grep -E '^ERROR|WARN'", "grep -G '^(ERROR|WARN)'", "grep -G '^ERROR|WARN'"], "method": "grep -E '^(ERROR|WARN)'", "detail": "", "uitleg": "", "waarom": "De haakjes groeperen, zodat ^ voor beide geldt. ✗ '^ERROR|WARN' in ERE = ERROR vooraan óf WARN eender waar · in basic regex (-G) zijn ( | ) letterlijke tekens."}, {"id": "cron-01", "ch": "10", "lab": false, "q": "Welke achtergrondjobs heb ik in deze shell (met hun jobnummer)?", "a": "jobs", "w": ["ps", "bg", "atq"], "method": "jobs", "detail": "`jobs -p` toont de PID's.", "uitleg": "jobs = toon de achtergrondjobs van deze shell, met hun nummer", "waarom": "jobs toont [1], [2]… van deze shell. ✗ ps toont processen (geen jobnummers) · bg hervat een job · atq toont at-taken."}, {"id": "cron-02", "ch": "10", "lab": false, "q": "Haal job 3 uit `jobs` terug naar de voorgrond.", "a": "fg %3", "w": ["bg %3", "kill %3", "fg 3%"], "method": "fg 3   ·   bg 2", "detail": "Ctrl+Z pauzeert de huidige job.", "uitleg": "fg 3 = foreground: haal job 3 naar de voorgrond · bg 2 = background: laat de gepauzeerde job 2 verder lopen op de achtergrond", "waarom": "fg %3 (fg 3 werkt ook). ✗ bg laat hem op de achtergrond verder lopen · kill stopt hem · 3% is geen geldige jobaanduiding."}, {"id": "cron-03", "ch": "10", "lab": false, "q": "Plan een eenmalige taak om 22:00 vandaag.", "a": "at 22:00", "w": ["cron 22:00", "batch 22:00", "crontab 22:00"], "method": "at 22:00", "detail": "Typ de commando's, sluit af met Ctrl+D. `at 10:05 tomorrow` kan ook.", "uitleg": "at = plan een eenmalige taak · 22:00 = tijdstip. Daarna typ je de commando's en sluit je af met Ctrl+D", "waarom": "at = eenmalig op een tijdstip (daarna typ je de commando's, Ctrl+D). ✗ cron is de daemon, geen commando om te plannen · batch start als de systeembelasting laag is · crontab is voor herhalende taken."}, {"id": "cron-04", "ch": "10", "lab": false, "q": "Verwijder een geplande at-taak (het nummer zie je met atq).", "a": "atrm NUMMER", "w": ["atq -d NUMMER", "kill NUMMER", "crontab -r NUMMER"], "method": "atq   ·   atrm NUMMER", "detail": "", "uitleg": "atq = at queue: toon de geplande at-taken met hun nummer · atrm NUMMER = at remove: verwijder taak NUMMER", "waarom": "atrm = at remove. ✗ atq toont enkel · kill werkt op PID's · crontab -r wist je volledige crontab."}, {"id": "cron-05", "ch": "10", "lab": false, "q": "Bewerk je eigen crontab.", "a": "crontab -e", "w": ["crontab -l", "crontab -r", "nano /etc/crontab"], "method": "crontab -e   ·   crontab -l", "detail": "Nooit het crontab-bestand rechtstreeks bewerken.", "uitleg": "crontab -e = edit: open je eigen crontab in een editor · crontab -l = list: toon je crontab", "waarom": "-e = edit. ✗ -l = list · -r = remove (wist alles, zonder te vragen!) · /etc/crontab is de systeemcrontab, met een extra gebruikersveld."}, {"id": "cron-06", "ch": "10", "lab": false, "q": "Wat zijn de 5 tijdvelden van een crontab-regel, in volgorde?", "a": "minuut · uur · dag van de maand · maand · dag van de week", "w": ["uur · minuut · dag van de maand · maand · dag van de week", "minuut · uur · dag van de week · maand · dag van de maand", "uur · minuut · dag van de week · maand · dag van de maand"], "method": "minuut  uur  dag-van-maand  maand  dag-van-week", "detail": "Daarna het commando.", "waarom": "Van klein naar groot: minuut, uur, dag, maand — en als laatste de weekdag (0/7 = zondag)."}, {"id": "cron-07", "ch": "10", "lab": false, "q": "Wat betekent de crontab-regel `8 14 * * * script42`?", "a": "elke dag om 14:08", "w": ["elke dag om 08:14", "op de 14de van elke maand om 08:00", "elke 8 minuten tussen 14:00 en 15:00"], "method": "Elke dag om 14:08", "detail": "", "waarom": "Eerste veld = minuut (8), tweede = uur (14)."}, {"id": "cron-08", "ch": "10", "lab": false, "q": "Wat betekent de crontab-regel `25 0 1 * * script`?", "a": "op de 1ste van elke maand om 00:25", "w": ["elke dag om 01:25", "op 25 januari om middernacht", "elke maandag om 00:25"], "method": "Elke 1e van de maand om 00:25", "detail": "", "waarom": "minuut 25, uur 0, dag van de maand 1. Maandag zou het 5de veld zijn."}, {"id": "cron-09", "ch": "10", "lab": false, "q": "Wat betekent de crontab-regel `*/2 * * * 0 script33`?", "a": "elke 2 minuten, maar enkel op zondag", "w": ["elke 2 uur, maar enkel op zondag", "elke 2 minuten, elke dag behalve zondag", "elke 2 uur, elke dag behalve zondag"], "method": "Elke 2 minuten, maar enkel op zondag", "detail": "Zondag = 0 of 7.", "waarom": "*/2 in het minuutveld = om de 2 minuten; 0 in het laatste veld = zondag."}, {"id": "cron-10", "ch": "10", "lab": false, "q": "Welke crontab-tijdvelden laten een taak elke 15 minuten draaien?", "a": "*/15 * * * *", "w": ["15 * * * *", "* */15 * * *", "0-15 * * * *"], "method": "*/15 * * * *   ·   @reboot", "detail": "Ook: @hourly, @daily, @weekly, @monthly.", "uitleg": "*/15 * * * * = minuut: elke 15e · uur, dag, maand, weekdag: elke · @reboot = één keer bij het opstarten", "waarom": "*/15 = elke 15 minuten (0, 15, 30, 45). ✗ 15 = één keer per uur, om kwart over · */15 in het uurveld = elke minuut van elk 15de uur · 0-15 = elke minuut van 0 tot 15."}, {"id": "cron-11", "ch": "10", "lab": false, "q": "Welk teken moet je in een crontab-regel escapen omdat het een speciale betekenis heeft?", "a": "% → schrijf \\%", "w": ["* → schrijf \\*", "$ → schrijf \\$", "# → schrijf \\#"], "method": "1. Minimale omgeving → absolute paden\n2. % escapen (\\%)\n3. Output weg → naar logbestand", "detail": "Bv. `*/15 * * * * /home/hogent/collect.sh >> /home/hogent/collect.log 2>&1`.", "waarom": "cron maakt van een % een regeleinde. Daarom: date +\\%F."}, {"id": "cron-12", "ch": "10", "lab": false, "q": "In welke map zet je een script dat het systeem elke dag moet uitvoeren?", "a": "/etc/cron.daily", "w": ["/var/spool/cron", "/etc/crontab.d", "/etc/cron.d/daily"], "method": "/etc/crontab en /etc/cron.daily, cron.hourly, cron.weekly, cron.monthly", "detail": "Toegang regelen: /etc/cron.allow en /etc/cron.deny.", "waarom": "/etc/cron.daily (ook hourly, weekly, monthly). ✗ /var/spool/cron bevat de crontabs van gebruikers · /etc/cron.d bevat crontab-bestanden met eigen tijden · /etc/crontab.d bestaat niet."}, {"id": "cron-13", "ch": "10", "lab": true, "q": "Labo Task Scheduling: `jobs` toont [1] en [2]. Stop beide jobs.", "a": "kill %1 %2", "w": ["kill $1 $2", "fg %1 %2", "fg $1 $2"], "method": "Ctrl+Z → jobs → bg\nkill %1 %2", "detail": "`%1` = job 1 (zie `jobs`).", "uitleg": "Ctrl+Z = pauzeer · jobs = toon de jobs · bg = laat verder lopen op de achtergrond · kill %1 %2 = stop job 1 en 2 (% = jobnummer, geen PID)", "waarom": "Met % bedoel je jobnummers. ✗ $1 $2 zijn positionele parameters (meestal leeg) · fg haalt een job naar de voorgrond en stopt niets."}, {"id": "cron-14", "ch": "10", "lab": true, "q": "Labo Task Scheduling: plan een taak over exact 3 minuten.", "a": "at now + 3 minutes", "w": ["at now + 3 hours", "at 3 minutes", "at 3 hours"], "method": "echo 'echo \"Labo at-commando geslaagd\" > ~/at_test.txt' | at now + 3 minutes", "detail": "Of `at now + 3 minutes`, commando typen, Ctrl+D. Volgen: `tail -f` of `watch`.", "uitleg": "at now + 3 minutes = plan een taak over 3 minuten · echo '...' | at = geef het commando via een pipe door, in plaats van het te typen · > ~/at_test.txt = schrijf naar dit bestand", "waarom": "at now + AANTAL minutes/hours/days. Zonder 'now +' begrijpt at het tijdstip niet."}, {"id": "cron-15", "ch": "10", "lab": true, "q": "Labo Task Scheduling: hoe schrijf je `date '+%Y-%m-%d %H:%M:%S'` correct in een crontab-regel?", "a": "date '+\\%Y-\\%m-\\%d \\%H:\\%M:\\%S'", "w": ["date '+%Y-%m-%d %H:%M:%S'", "date '+%%Y-%%m-%%d %%H:%%M:%%S'", "date '+\\\\%Y-\\\\%m-\\\\%d \\\\%H:\\\\%M:\\\\%S'"], "method": "* * * * * echo \"$(date '+\\%Y-\\%m-\\%d \\%H:\\%M:\\%S') - Labo cronjob geslaagd\" >> /tmp/cron_test.txt", "detail": "⚠ In een crontab betekent `%` een nieuwe regel: escapen als `\\%`.", "uitleg": "* * * * * = elke minuut · echo \"...\" = druk tekst af · $(date '+...') = huidige datum en tijd · \\% = in een crontab moet % ge-escaped worden · >> /tmp/cron_test.txt = voeg toe aan dit bestand", "waarom": "In crontab moet elke % als \\% geschreven worden, ook tussen quotes. %% is de notatie van printf, niet van cron."}, {"id": "cron-16", "ch": "10", "lab": true, "q": "Labo Task Scheduling: schrijf de vrije schijfruimte van / naar de systeemlog.", "a": "logger \"Free disk space: $(df -h --output=avail / | tail -n 1 | tr -d ' ')\"", "w": ["logger \"Free disk space: $(du -sh / | tail -n 1 | tr -d ' ')\"", "echo \"Free disk space: $(df -h --output=avail / | tail -n 1 | tr -d ' ')\" > /var/log/syslog", "echo \"Free disk space: $(du -sh / | tail -n 1 | tr -d ' ')\" > /var/log/syslog"], "method": "logger \"Free disk space: $(df -h --output=avail / | tail -n 1 | tr -d ' ')\"", "detail": "Bekijken: `journalctl -t GEBRUIKER` (`-f` = live).", "uitleg": "logger = schrijf een boodschap naar de systeemlog · df -h = vrije ruimte, leesbaar · --output=avail = enkel de kolom 'beschikbaar' · / = root-partitie · tail -n 1 = laatste regel (zonder kop) · tr -d ' ' = verwijder spaties", "waarom": "logger schrijft naar de systeemlog (journal/syslog). df = vrije ruimte op het bestandssysteem; du = hoeveel er gebrúíkt wordt. > zou het logbestand overschrijven (en vereist root)."}, {"id": "cron-17", "ch": "10", "lab": true, "q": "Labo Task Scheduling: welke tijdvelden = elke maandag om 12 uur 's middags?", "a": "0 12 * * 1", "w": ["12 0 * * 1", "0 12 1 * *", "0 12 * 1 *"], "method": "*/5 * * * *  ·  0 8 * * *  ·  0 12 * * 1  ·  0 0 1 * *  ·  @reboot", "detail": "", "uitleg": "Velden: minuut · uur · dag van de maand · maand · dag van de week (0 of 7 = zondag, 1 = maandag) · * = elke · */5 = elke 5e · @reboot = bij het opstarten", "waarom": "minuut 0, uur 12, weekdag 1 (maandag). ✗ 12 0 = 00:12 · 3de veld 1 = de 1ste van de maand · 4de veld 1 = januari."}, {"id": "cron-18", "ch": "10", "lab": true, "q": "Labo Task Scheduling: welke tijdvelden = op maandag en vrijdag in juli en augustus, elk uur na de middag (13 t/m 23 uur), om kwart over?", "a": "15 13-23 * 7,8 1,5", "w": ["15 13-23 * 1,5 7,8", "15 13-23 7,8 * 1,5", "*/15 13-23 * 7,8 1,5"], "method": "15 13-23 * 7,8 1,5", "detail": "Velden: minuut uur dag maand weekdag. Lijst met `,`, bereik met `-`.", "uitleg": "15 = minuut 15 · 13-23 = uren 13 tot en met 23 · * = elke dag van de maand · 7,8 = juli en augustus · 1,5 = maandag en vrijdag", "waarom": "minuut 15, uur 13-23, dag van de maand *, maand 7,8, weekdag 1,5. */15 zou elke 15 minuten zijn."}, {"id": "cron-19", "ch": "10", "lab": true, "q": "Labo Task Scheduling: hoe bewaar je de uitvoer (en fouten) van een cronjob zonder het systeem aan te passen?", "a": "zet >> ~/cron.log 2>&1 achter het commando", "w": ["zet 2>&1 >> ~/cron.log achter het commando", "zet MAILTO=\"\" bovenaan de crontab", "voer crontab -l > ~/cron.log uit"], "method": "Standaard: per mail naar de gebruiker (als er een MTA is)\nZelf: >> ~/cron.log 2>&1 achter het commando", "detail": "Zonder mailserver gaat de output verloren.", "uitleg": ">> ~/cron.log = voeg stdout toe aan een logbestand · 2>&1 = stuur stderr naar dezelfde plek. Zonder mailserver (MTA) gaat de uitvoer anders verloren", "waarom": "Eerst stdout naar het bestand (toevoegen), dan stderr erachteraan. ✗ omgekeerd gaat stderr niet mee · MAILTO=\"\" gooit de uitvoer juist weg · crontab -l bewaart de regels van je crontab, niet de uitvoer."}, {"id": "cron-20", "ch": "10", "lab": false, "q": "Start een proces dat 1000 seconden wacht, op de achtergrond.", "a": "sleep 1000 &", "w": ["sleep 1000 &&", "wait 1000 &", "sleep & 1000"], "method": "sleep 1000 &", "detail": "Typisch testproces in het hoofdstuk over jobs.", "uitleg": "sleep = wacht een aantal seconden · 1000 = het aantal seconden · & = op de achtergrond", "waarom": "& achteraan = achtergrond. ✗ && wacht op een volgend commando · wait wacht op een job met dat nummer · sleep & 1000 start sleep zonder argument en daarna commando 1000."}, {"id": "cont-01", "ch": "11", "lab": false, "q": "Docker: wat is het verschil tussen een image en een container?", "a": "een image is het sjabloon; een container is een (draaiende) instantie ervan", "w": ["een container is het sjabloon; een image is een (draaiende) instantie ervan", "een image is een gestopte container; een container is een gestarte image", "een image bevat enkel de data; een container enkel de code"], "method": "Image = sjabloon (read-only, lagen)\nContainer = draaiende instantie van een image", "detail": "Eén image → meerdere containers.", "waarom": "Uit één image (bv. nginx) kan je veel containers starten. Een gestopte container blijft een container (docker ps -a)."}, {"id": "cont-02", "ch": "11", "lab": false, "q": "Bouw een image met de naam penguins-app uit de Dockerfile in de huidige map.", "a": "docker build -t penguins-app .", "w": ["docker build -t . penguins-app", "docker build -f penguins-app .", "docker build -f . penguins-app"], "method": "docker build -t penguins-app .", "detail": "⚠ Vergeet de `.` niet: dat is de build context.", "uitleg": "docker build = bouw een image uit een Dockerfile · -t penguins-app = tag: naam van de image · . = build context: de huidige map (met de Dockerfile)", "waarom": "-t = tag (naam van de image); het laatste argument . = de build-context (de map met de Dockerfile). -f = het pad naar de Dockerfile zelf."}, {"id": "cont-03", "ch": "11", "lab": false, "q": "Start een container uit image op de achtergrond, met poort 8080 van de VM doorgestuurd naar poort 80 in de container.", "a": "docker run -d -p 8080:80 image", "w": ["docker run -d -p 80:8080 image", "docker run -it -p 8080:80 image", "docker run -it -p 80:8080 image"], "method": "docker run -d -p 8080:80 image", "detail": "`-p HOST:CONTAINER`. `-d` = detached.", "uitleg": "docker run = start een nieuwe container · -d = detached: op de achtergrond · -p 8080:80 = publish: poort HOST:CONTAINER · image = naam van de image", "waarom": "-p HOST:CONTAINER; -d = detached (achtergrond). -it = interactief op de voorgrond."}, {"id": "cont-04", "ch": "11", "lab": false, "q": "Toon alle containers, ook de gestopte.", "a": "docker ps -a", "w": ["docker ps", "docker images -a", "docker container ls"], "method": "docker ps   ·   docker ps -a", "detail": "Images: `docker image ls`.", "uitleg": "docker ps = toon draaiende containers · -a = all: ook gestopte containers", "waarom": "-a = all. ✗ docker ps en docker container ls tonen enkel de draaiende · docker images toont images, geen containers."}, {"id": "cont-05", "ch": "11", "lab": false, "q": "Welke optie bij docker run verwijdert de container automatisch zodra hij stopt?", "a": "--rm", "w": ["-d", "--restart no", "--init"], "method": "docker run --rm -v \"$PWD/output\":/output penguins-app", "detail": "`-v` = volume / bind mount: bestanden blijven bewaard na de container.", "uitleg": "docker run = start een container · --rm = verwijder de container na afloop · -v \"$PWD/output\":/output = volume: koppel map output van de host aan /output in de container · penguins-app = de image", "waarom": "--rm = opruimen na afloop. ✗ -d = op de achtergrond · --restart no = niet automatisch herstarten (de container blijft bestaan) · --init = een klein init-proces als PID 1."}, {"id": "cont-06", "ch": "11", "lab": false, "q": "Open een interactieve bash-shell in de container web, die al draait.", "a": "docker exec -it web bash", "w": ["docker run -it web bash", "docker exec -d web bash", "docker run -d web bash"], "method": "docker exec -it CONTAINER bash", "detail": "Logs: `docker logs CONTAINER`. Stoppen: `docker stop`.", "uitleg": "docker exec = voer een commando uit in een draaiende container · -i = interactive · -t = tty: terminal · CONTAINER = naam of ID · bash = het commando (een shell)", "waarom": "exec = extra proces in een draaiende container; -it = interactief met terminal. ✗ run start een nieuwe container uit een image 'web' · -d start bash op de achtergrond, zonder terminal (het stopt meteen)."}, {"id": "cont-07", "ch": "11", "lab": false, "q": "Wat is het verschil tussen RUN en CMD in een Dockerfile?", "a": "RUN draait tijdens het bouwen; CMD bij het starten van een container", "w": ["CMD draait tijdens het bouwen; RUN bij het starten van een container", "beide draaien tijdens het bouwen, maar CMD als allerlaatste", "beide draaien bij het starten van een container, RUN eerst"], "method": "FROM · WORKDIR · COPY · RUN · EXPOSE · CMD", "detail": "RUN = tijdens het bouwen, CMD = bij het starten.", "waarom": "RUN apt-get install … → zit in een laag van de image. CMD [\"nginx\", \"-g\", \"daemon off;\"] → draait bij docker run."}, {"id": "cont-08", "ch": "11", "lab": false, "q": "Start alle services uit compose.yaml op de achtergrond.", "a": "docker compose up -d", "w": ["docker compose up --build", "docker compose start -d", "docker compose start --build"], "method": "docker compose up -d", "detail": "Stoppen: `docker compose down`.", "uitleg": "docker compose = beheer meerdere containers uit een compose-bestand · up = start alle services · -d = detached: op de achtergrond", "waarom": "up maakt en start de containers, -d = op de achtergrond. ✗ up --build bouwt eerst opnieuw, maar blijft op de voorgrond · start herstart enkel bestaande containers en kent die opties niet."}, {"id": "cont-09", "ch": "11", "lab": false, "q": "Vagrant: hoe zet je een VM uit zonder ze te verwijderen?", "a": "vagrant halt", "w": ["vagrant destroy", "vagrant suspend", "vagrant reload"], "method": "vagrant up · vagrant ssh · vagrant halt", "detail": "Status: `vagrant status`. Weggooien: `vagrant destroy`.", "uitleg": "vagrant up = maak en start de VM · vagrant ssh = log in op de VM · vagrant halt = sluit de VM netjes af", "waarom": "halt = netjes afsluiten. ✗ destroy verwijdert de VM · suspend bevriest ze (toestand blijft in het geheugenbestand) · reload = halt + up."}, {"id": "cont-10", "ch": "11", "lab": false, "q": "Vagrant: de VM draait en je wijzigde het provisioning-script. Voer het opnieuw uit.", "a": "vagrant provision", "w": ["vagrant reload", "vagrant up", "vagrant resume"], "method": "vagrant provision", "detail": "`vagrant reload` = herstarten (bv. na een wijziging in de Vagrantfile).", "uitleg": "vagrant provision = voer het provisioning-script opnieuw uit op een draaiende VM", "waarom": "provision voert enkel de provisioning opnieuw uit. ✗ reload herstart, maar provisiont niet (tenzij met --provision) · up op een draaiende VM doet niets · resume wekt een gepauzeerde VM."}, {"id": "cont-11", "ch": "11", "lab": false, "q": "Vagrant: via welke map zie je in de VM de projectmap (met de Vagrantfile) van je laptop?", "a": "/vagrant", "w": ["/home/vagrant", "/mnt/host", "/srv/vagrant"], "method": "/vagrant", "detail": "Gedeelde map, automatisch gekoppeld.", "waarom": "Vagrant deelt de projectmap standaard als /vagrant. /home/vagrant is de home-map van de gebruiker vagrant in de VM."}, {"id": "cont-12", "ch": "11", "lab": false, "q": "Vagrant: welke boxes (basisimages) staan lokaal op je laptop?", "a": "vagrant box list", "w": ["vagrant global-status", "vagrant status", "vagrant box outdated"], "method": "vagrant box list", "detail": "Ook: `vagrant box add`, `update`, `remove`.", "uitleg": "vagrant box list = toon de base boxes die lokaal gedownload zijn", "waarom": "box list = gedownloade boxes. ✗ global-status = alle Vagrant-VM's op je laptop · status = VM's van dit project · box outdated = is er een nieuwere versie."}, {"id": "cont-13", "ch": "11", "lab": false, "q": "Maak een Python virtual environment in de map .venv.", "a": "python3 -m venv .venv", "w": ["python3 -m pip venv .venv", "pip install venv .venv", "python3 venv .venv"], "method": "python3 -m venv .venv", "detail": "Op Debian: pakket `python3-venv` nodig.", "uitleg": "python3 = Python-interpreter · -m venv = voer de module venv uit · .venv = map voor de virtuele omgeving", "waarom": "-m venv = start de module venv. ✗ pip kent geen subcommando venv · pip install zou pakketten installeren · zonder -m zoekt python3 een script met de naam venv."}, {"id": "cont-14", "ch": "11", "lab": false, "q": "Activeer de virtual environment in .venv in je huidige shell.", "a": "source .venv/bin/activate", "w": ["bash .venv/bin/activate", "source .venv/activate", "bash .venv/activate"], "method": "source .venv/bin/activate   ·   deactivate", "detail": "Je prompt toont dan `(.venv)`.", "uitleg": "source .venv/bin/activate = activeer de venv in je huidige shell (prompt toont (.venv)) · deactivate = verlaat de venv", "waarom": "activate past PATH aan in je eigen shell, dus source. bash start een aparte shell die meteen weer stopt. Het script staat in bin/."}, {"id": "cont-15", "ch": "11", "lab": false, "q": "Bewaar de geïnstalleerde pakketten (met versies) van je venv in requirements.txt.", "a": "pip freeze > requirements.txt", "w": ["pip freeze < requirements.txt", "pip list > requirements.txt", "pip list < requirements.txt"], "method": "pip freeze > requirements.txt\npip install -r requirements.txt", "detail": "Zo is je omgeving reproduceerbaar.", "uitleg": "pip freeze = lijst van geïnstalleerde pakketten met exacte versie · > requirements.txt = naar dit bestand · pip install -r = requirement file: installeer alles uit dit bestand", "waarom": "freeze geeft naam==versie, het formaat dat `pip install -r` verwacht; > schrijft naar het bestand. ✗ < leest uit het bestand · pip list geeft een tabel."}, {"id": "cont-16", "ch": "11", "lab": false, "q": "Waarom gebruik je op Debian 13 niet `sudo pip install pandas`?", "a": "je verknoeit de systeem-Python; Debian weigert het", "w": ["het mag gerust, alleen is sudo hier overbodig", "pip werkt op Debian enkel achter een proxy", "het pakket pandas bestaat niet voor Debian 13"], "method": "Je verknoeit de systeem-Python; Debian 13 weigert dit zelfs", "detail": "Gebruik een venv per project.", "waarom": "Debian markeert zijn Python als 'externally-managed-environment'. Gebruik een venv (python3 -m venv) of het Debian-pakket python3-pandas."}, {"id": "cont-17", "ch": "11", "lab": true, "q": "Labo Docker: je wil een image verwijderen, maar een (gestopte) container gebruikt ze nog. Hoe doe je dat netjes?", "a": "eerst docker rm CONTAINER, dan docker rmi IMAGE", "w": ["eerst docker rmi IMAGE, dan docker rm CONTAINER", "eerst docker stop CONTAINER, dan docker rmi IMAGE", "eerst docker rmi IMAGE, dan docker stop CONTAINER"], "method": "ps = draaiende containers · ps -a = ook gestopte\nEerst docker rm CONTAINER, dan docker rmi IMAGE", "detail": "", "uitleg": "docker ps = draaiende containers · -a = ook gestopte · docker rm CONTAINER = verwijder een container · docker rmi IMAGE = remove image: verwijder een image", "waarom": "Een gestopte container houdt de image nog vast; je moet hem verwijderen (rm), stoppen is niet genoeg."}, {"id": "cont-18", "ch": "11", "lab": true, "q": "Labo Docker: start een container uit de image alpine, met de naam alpine, interactief met een shell.", "a": "docker run -i -t --name alpine alpine", "w": ["docker run -d --name alpine alpine", "docker exec -i -t --name alpine alpine", "docker exec -d --name alpine alpine"], "method": "docker run -i -t --name alpine alpine", "detail": "Bestaat de naam al: `docker start alpine`.", "uitleg": "docker run = start een container · -i = interactive · -t = tty · --name alpine = naam van de container · alpine = de image", "waarom": "run maakt een nieuwe container; -i -t = interactief met terminal (alpine start standaard sh). ✗ -d = op de achtergrond · exec werkt enkel in een container die al draait."}, {"id": "cont-19", "ch": "11", "lab": true, "q": "Labo Docker: welke processen draaien er in de container alpine?", "a": "docker top alpine", "w": ["docker ps alpine", "docker stats alpine", "docker logs alpine"], "method": "docker inspect alpine   ·   docker top alpine", "detail": "`docker container ls` = `docker ps`.", "uitleg": "docker inspect = alle details (JSON) van een container · docker top = de processen die in de container draaien · alpine = de container", "waarom": "top = processen in de container. ✗ ps toont containers (en neemt geen naam) · stats = CPU/geheugen · logs = uitvoer van het hoofdproces."}, {"id": "cont-20", "ch": "11", "lab": true, "q": "Labo Docker: welke host-poort is doorgestuurd naar de container helloweb?", "a": "docker port helloweb", "w": ["docker top helloweb", "docker network ls", "docker logs helloweb"], "method": "docker port helloweb   (of docker ps)", "detail": "Met `-p 8080:80` → `curl http://localhost:8080/`.", "uitleg": "docker port = toon welke host-poort naar welke containerpoort doorgestuurd wordt · helloweb = de container · docker ps = toont het ook, in de kolom PORTS", "waarom": "docker port toont bv. 80/tcp -> 0.0.0.0:8080. ✗ top = processen · network ls = netwerken · logs = uitvoer."}, {"id": "cont-21", "ch": "11", "lab": true, "q": "Labo Docker: waar staat het volume mysql-data op de schijf van de host (Mountpoint)?", "a": "docker volume inspect mysql-data", "w": ["docker volume create mysql-data", "docker volume rm mysql-data", "docker volume ls -f name=mysql-data"], "method": "docker volume create mysql-data\ndocker volume inspect mysql-data   (Mountpoint)", "detail": "", "uitleg": "docker volume create = maak een volume · docker volume inspect = details, met Mountpoint: waar het op schijf staat · mysql-data = naam van het volume", "waarom": "inspect toont o.a. Mountpoint (/var/lib/docker/volumes/…). ✗ create maakt een volume (of doet niets als het al bestaat) · rm verwijdert het · ls toont enkel de naam."}, {"id": "cont-22", "ch": "11", "lab": true, "q": "Labo Docker: wat doet -e in `docker run -e MYSQL_ROOT_PASSWORD=geheim mysql:5.7`?", "a": "het zet een omgevingsvariabele in de container", "w": ["het publiceert een poort van de container (expose)", "het verwijdert de container weer na afloop", "het koppelt een volume aan de container"], "method": "-v volume koppelen (data blijft) · -e omgevingsvariabele · -p poortdoorsturing", "detail": "Logs volgen: `docker logs -f db`.", "uitleg": "-v naam:/pad = volume: koppel een volume (data blijft bewaard) · -e VAR=waarde = environment: zet een omgevingsvariabele · -p 3306:3306 = publish: poort HOST:CONTAINER", "waarom": "-e = env. Poort = -p, opruimen = --rm, volume = -v."}, {"id": "cont-23", "ch": "11", "lab": true, "q": "Labo Docker: bouw een image met de tag local:static-site uit de huidige map.", "a": "docker image build --tag local:static-site .", "w": ["docker image build --tag local:static-site", "docker image build --name local:static-site .", "docker image build --name local:static-site"], "method": "docker image build --tag local:static-site .", "detail": "= `docker build -t local:static-site .` ⚠ De `.` op het einde.", "uitleg": "docker image build = bouw een image (= docker build) · --tag local:static-site = naam:tag · . = build context: huidige map", "waarom": "--tag (= -t) geeft de naam:tag; de punt is de build-context. Een optie --name bestaat niet bij build."}, {"id": "cont-24", "ch": "11", "lab": true, "q": "Labo Docker: waarom combineer je in een Dockerfile meerdere commando's in één RUN met && en \\?", "a": "elke RUN-regel voegt een extra laag toe aan de image", "w": ["RUN mag maar één keer per Dockerfile voorkomen", "met && lopen de commando's tegelijk (parallel)", "elke RUN start een container die blijft draaien"], "method": "Elke RUN maakt een extra laag (layer) in de image", "detail": "Bekijken: `docker image inspect IMAGE | jq '.[]|.RootFS.Layers'`.", "waarom": "Minder lagen = kleinere image, en opruimen (bv. apt-get clean) in dezelfde laag scheelt echt ruimte. && = enkel verder als het vorige lukte."}, {"id": "cont-25", "ch": "11", "lab": true, "q": "Labo Docker: wat doet ADD meer dan COPY in een Dockerfile?", "a": "ADD pakt een lokaal tar-archief automatisch uit", "w": ["ADD kopieert ook verborgen bestanden, COPY niet", "ADD maakt een nieuwe laag, COPY doet dat niet", "ADD werkt enkel met URL's, COPY enkel lokaal"], "method": "ADD pakt een tar-archief automatisch uit", "detail": "", "waarom": "Gebruik COPY tenzij je die extra functies nodig hebt. Beide maken een laag en kopiëren ook verborgen bestanden."}, {"id": "cont-26", "ch": "11", "lab": true, "q": "Labo Docker: waarom gebruik je in een container geen `systemctl start`?", "a": "in een container draait je app zelf als hoofdproces, zonder systemd", "w": ["systemctl werkt in een container enkel als je root bent", "een Alpine-image bevat geen enkele service", "Docker blokkeert alle netwerkdiensten in containers"], "method": "Een container draait maar één applicatie: een init-systeem zoals systemd is overbodig", "detail": "Het programma start via ENTRYPOINT/CMD.", "waarom": "In een container is je applicatie zelf PID 1 (via CMD). Er draait geen systemd om services te beheren."}, {"id": "cont-27", "ch": "11", "lab": true, "q": "Labo Docker: hoe vinden containers in dezelfde compose-stack elkaar, zonder IP-adressen?", "a": "via de servicenamen uit de compose-file (bv. host db)", "w": ["via het IP-adres van de host", "via de container-ID", "via regels die je zelf in /etc/hosts van de host zet"], "method": "Via de servicenamen uit de compose-file (hostnaam)", "detail": "Testen in de container: `getent ahosts mysql`.", "waarom": "Compose maakt een netwerk met ingebouwde DNS: de servicenaam is de hostnaam."}, {"id": "cont-28", "ch": "11", "lab": true, "q": "Labo Vagrant: de VM db draait al. Voer haar provisioning-script opnieuw uit.", "a": "vagrant provision db", "w": ["vagrant reload db", "vagrant up db", "vagrant ssh db"], "method": "vagrant up db · vagrant ssh db · vagrant provision db", "detail": "Gebruiker en wachtwoord: vagrant / vagrant.", "uitleg": "vagrant up db = start enkel de VM db · vagrant ssh db = log in op db · vagrant provision db = voer het provisioning-script van db opnieuw uit", "waarom": "provision NAAM. ✗ reload herstart zonder provisioning · up doet niets op een draaiende VM · ssh logt enkel in."}, {"id": "cont-29", "ch": "11", "lab": true, "q": "Labo Vagrant: hoe test je of de provisioning van web volledig reproduceerbaar is (van nul af aan)?", "a": "vagrant destroy -f web && vagrant up web", "w": ["vagrant halt web && vagrant up web", "vagrant reload --provision web", "vagrant provision web"], "method": "vagrant destroy web && vagrant up web", "detail": "De website moet daarna meteen werken, zonder manueel werk.", "uitleg": "vagrant destroy web = verwijder de VM web volledig · && = enkel als dat lukt · vagrant up web = maak ze opnieuw aan en voer de provisioning uit", "waarom": "Enkel na destroy begin je met een lege box. halt/reload/provision werken op een VM die je eerdere (handmatige) wijzigingen nog bevat."}, {"id": "cont-30", "ch": "11", "lab": true, "q": "Labo Vagrant: welke twee regels gelden voor een provisioning-script?", "a": "het draait als root, en het mag nooit om invoer vragen", "w": ["het draait als de gebruiker vagrant, en het mag om bevestiging vragen", "het draait als root, en het vraagt het root-wachtwoord", "het draait op de host, en het vereist sudo"], "method": "Het draait als root (geen sudo nodig)\nHet mag nooit invoer vragen (bv. apt-get install -y)", "detail": "Bestanden uit je repo zijn in de VM bereikbaar onder /vagrant.", "waarom": "Niemand kan antwoorden tijdens vagrant up: gebruik apt-get install -y enz. sudo is overbodig, het script draait al als root."}, {"id": "cont-31", "ch": "11", "lab": false, "q": "Wat is het belangrijkste verschil tussen een container en een VM op een hypervisor?", "a": "containers delen de kernel van de host; elke VM heeft een eigen kernel", "w": ["elke container heeft een eigen kernel; VM's delen de kernel van de host", "containers én VM's delen de kernel van de host", "containers én VM's hebben elk een eigen kernel"], "method": "containers delen de kernel van de host; elke VM heeft een eigen kernel", "detail": "", "uitleg": "", "waarom": "Daarom starten containers snel en zijn ze klein; een VM emuleert hardware en boot een eigen kernel."}, {"id": "cont-32", "ch": "11", "lab": false, "q": "Docker is geïnstalleerd. Zorg dat de service nu start én bij elke boot.", "a": "sudo systemctl enable --now docker", "w": ["sudo systemctl enable docker", "sudo systemctl start --now docker", "sudo systemctl start docker"], "method": "sudo systemctl enable --now docker", "detail": "", "uitleg": "", "waarom": "enable = bij elke boot; --now = start ook meteen. ✗ enable alleen start niet nu · start alleen maakt het niet blijvend · start kent geen --now."}, {"id": "cont-33", "ch": "11", "lab": false, "q": "Hoe open je de man page van het subcommando docker run?", "a": "man docker-run", "w": ["man docker run", "man run", "docker man run"], "method": "man docker-run", "detail": "", "uitleg": "", "waarom": "Subcommando's hebben een eigen pagina met een streepje. `man docker run` opent twee pagina's na elkaar: docker en daarna run (die bestaat niet). docker run --help toont ook de opties."}, {"id": "cont-34", "ch": "11", "lab": false, "q": "Download de image nginx en toon daarna je lokale images.", "a": "docker pull nginx en docker image ls", "w": ["docker pull nginx en docker ps -a", "docker run nginx en docker image ls", "docker run nginx en docker ps -a"], "method": "docker pull nginx en docker image ls", "detail": "", "uitleg": "", "waarom": "pull downloadt enkel. run zou ook een container starten · ps -a toont containers, geen images."}, {"id": "cont-35", "ch": "11", "lab": false, "q": "Wat doet `docker run -d -p 8080:80 --name web nginx`?", "a": "start nginx op de achtergrond; poort 8080 van de host gaat naar poort 80 in de container", "w": ["start nginx op de achtergrond; poort 80 van de host gaat naar poort 8080 in de container", "start nginx op de voorgrond; poort 8080 van de host gaat naar poort 80 in de container", "start nginx op de voorgrond; poort 80 van de host gaat naar poort 8080 in de container"], "method": "start nginx op de achtergrond; poort 8080 van de host gaat naar poort 80 in de container", "detail": "", "uitleg": "", "waarom": "-d = detached; -p HOST:CONTAINER; --name geeft de container de naam web."}, {"id": "cont-36", "ch": "11", "lab": false, "q": "Hoe stop je de container web, en start je later diezelfde container opnieuw?", "a": "docker stop web, daarna docker start web", "w": ["docker stop web, daarna docker run web", "docker rm web, daarna docker start web", "docker rm web, daarna docker run web"], "method": "docker stop web, daarna docker start web", "detail": "", "uitleg": "", "waarom": "start hergebruikt de bestaande container. run maakt een nieuwe container (uit een image met die naam); rm verwijdert hem."}, {"id": "cont-37", "ch": "11", "lab": false, "q": "Hoe blijven de gegevens van een MariaDB-container bewaard als je de container verwijdert?", "a": "koppel een named volume: docker run -v dbdata:/var/lib/mysql … mariadb", "w": ["koppel een named volume: docker run -v /var/lib/mysql:dbdata … mariadb", "publiceer de poort: docker run -p 3306:3306 … mariadb", "start met --rm: docker run --rm … mariadb"], "method": "koppel een named volume: docker run -v dbdata:/var/lib/mysql … mariadb", "detail": "", "uitleg": "", "waarom": "-v VOLUME:PAD-IN-CONTAINER. De data staat dan in het volume, buiten de container. --rm verwijdert juist alles; -p gaat over netwerk."}, {"id": "cont-38", "ch": "11", "lab": false, "q": "Wat doet `docker volume prune`?", "a": "het verwijdert volumes die geen enkele container gebruikt", "w": ["het verwijdert alle volumes, ook die in gebruik zijn", "het maakt alle volumes leeg, maar houdt ze zelf", "het toont enkel welke volumes niet gebruikt worden"], "method": "het verwijdert volumes die geen enkele container gebruikt", "detail": "", "uitleg": "", "waarom": "Recente Docker-versies verwijderen standaard enkel anonieme ongebruikte volumes; met -a ook ongebruikte named volumes. Gebruikte volumes blijven altijd."}, {"id": "cont-39", "ch": "11", "lab": false, "q": "Welke Dockerfile-regel kopieert index.html uit de build-map naar de webroot van nginx in de image?", "a": "COPY index.html /usr/share/nginx/html/", "w": ["COPY /usr/share/nginx/html/ index.html", "RUN cp index.html /usr/share/nginx/html/", "RUN cp /usr/share/nginx/html/ index.html"], "method": "COPY index.html /usr/share/nginx/html/", "detail": "", "uitleg": "", "waarom": "COPY BRON DOEL: bron uit de build-context, doel in de image. RUN cp draait ín de image, waar index.html nog niet bestaat."}, {"id": "cont-40", "ch": "11", "lab": false, "q": "Wat doet `EXPOSE 80` in een Dockerfile?", "a": "het documenteert poort 80, maar publiceert ze niet op de host", "w": ["het publiceert poort 80 automatisch op de host", "het opent poort 80 in de firewall van de host", "het laat in de container enkel verkeer op poort 80 toe"], "method": "het documenteert poort 80, maar publiceert ze niet op de host", "detail": "", "uitleg": "", "waarom": "Publiceren doe je bij het starten met -p 8080:80 (of -P voor alle EXPOSE-poorten)."}, {"id": "cont-41", "ch": "11", "lab": false, "q": "In compose.yaml moet de service web pas starten na de service db. Welke sleutel gebruik je?", "a": "depends_on: [db] onder web", "w": ["depends_on: [web] onder db", "start_after: [db] onder web", "after: [db] onder web"], "method": "depends_on: [db] onder web", "detail": "", "uitleg": "", "waarom": "depends_on staat bij de service die wácht. Let op: het wacht op het starten van db, niet tot de databank klaar is (daarvoor dient een healthcheck)."}, {"id": "web-01", "ch": "12", "lab": false, "q": "In welke map staan op Debian de site-configuraties van Apache (ook de niet-actieve)?", "a": "/etc/apache2/sites-available/", "w": ["/etc/apache2/sites-enabled/", "/etc/apache2/conf-enabled/", "/etc/apache2/mods-available/"], "method": "/etc/apache2/sites-available/", "detail": "Geactiveerd = link in sites-enabled/. Poorten: /etc/apache2/ports.conf.", "waarom": "sites-available = alle sites; sites-enabled bevat enkel links naar de actieve (gemaakt door a2ensite). conf-* = extra configuratie, mods-* = modules.", "uitleg": ""}, {"id": "web-02", "ch": "12", "lab": false, "q": "Activeer de Apache-module ssl op Debian.", "a": "sudo a2enmod ssl", "w": ["sudo a2ensite ssl", "sudo a2enconf ssl", "sudo a2dismod ssl"], "method": "sudo a2ensite site.conf   ·   sudo a2enmod ssl", "detail": "Uitzetten: `a2dissite`, `a2dismod`. Daarna `systemctl reload apache2`.", "uitleg": "sudo = als root · a2enmod ssl = Apache 2 enable module: activeer de module ssl · a2ensite site.conf = activeer een site uit sites-available", "waarom": "a2enmod = module, a2ensite = site, a2enconf = extra configuratie; dis = uitschakelen. Daarna systemctl restart apache2."}, {"id": "web-03", "ch": "12", "lab": false, "q": "Controleer de Apache-configuratie op syntaxfouten vóór je herstart (Debian).", "a": "sudo apache2ctl configtest", "w": ["sudo apache2ctl status", "sudo systemctl status apache2", "sudo systemctl reload apache2"], "method": "sudo apache2ctl configtest", "detail": "Verwacht: Syntax OK.", "uitleg": "sudo = als root · apache2ctl configtest = controleer de syntax van de Apache-configuratie (verwacht: Syntax OK)", "waarom": "configtest → 'Syntax OK'. ✗ status toont of Apache draait · reload laadt de config meteen (en faalt bij een fout)."}, {"id": "web-04", "ch": "12", "lab": false, "q": "Maak een nieuw wachtwoordbestand /var/www/.htpasswd aan met de gebruiker cliff.", "a": "sudo htpasswd -c /var/www/.htpasswd cliff", "w": ["sudo htpasswd /var/www/.htpasswd cliff", "sudo htpasswd -c cliff /var/www/.htpasswd", "sudo htpasswd cliff /var/www/.htpasswd"], "method": "sudo htpasswd -c /var/www/.htpasswd cliff", "detail": "⚠ `-c` enkel de eerste keer: het overschrijft het bestand.", "uitleg": "sudo = als root · htpasswd = Apache-tool voor wachtwoordbestanden · -c = create: maak een nieuw bestand (overschrijft!) · /var/www/.htpasswd = het bestand · cliff = de gebruiker", "waarom": "-c = create (nieuw bestand; overschrijft een bestaand!). Volgorde: BESTAND GEBRUIKER. Zonder -c voeg je een gebruiker toe aan een bestaand bestand."}, {"id": "web-05", "ch": "12", "lab": false, "q": "Beveilig een verse MariaDB-installatie (root-wachtwoord, anonieme gebruikers en testdatabank weg).", "a": "sudo mysql_secure_installation", "w": ["sudo mysql_upgrade", "sudo mysqladmin status", "sudo mysqldump --all-databases"], "method": "sudo apt install mariadb-server\nsudo mysql_secure_installation", "detail": "Syllabus: `default-mysql-server`. Service: `mariadb`.", "uitleg": "sudo apt install mariadb-server = installeer MariaDB · sudo mysql_secure_installation = interactief script: root-toegang en testdatabank beveiligen", "waarom": "mysql_secure_installation stelt je een reeks vragen. ✗ mysql_upgrade past tabellen aan na een upgrade · mysqladmin status toont statistieken · mysqldump maakt een back-up."}, {"id": "web-06", "ch": "12", "lab": false, "q": "Open de MariaDB-client als databank-root op een verse Debian-installatie.", "a": "sudo mysql", "w": ["mysql -u root", "sudo mysqld", "sudo mariadb-server"], "method": "sudo mysql", "detail": "Als gewone gebruiker: `mysql -ukevin -phunter2 famouspeople`.", "uitleg": "sudo = als root · mysql = de MariaDB/MySQL-client. Op Debian logt root in via de unix-socket, zonder wachtwoord", "waarom": "Op Debian logt root in via unix_socket: de Linux-gebruiker root mag zonder wachtwoord. ✗ mysql -u root als gewone gebruiker wordt geweigerd · mysqld is de server zelf · mariadb-server is de pakketnaam."}, {"id": "web-07", "ch": "12", "lab": false, "q": "SQL in de MariaDB-client: toon alle databanken.", "a": "SHOW DATABASES;", "w": ["SHOW TABLES;", "SELECT DATABASES;", "LIST DATABASES;"], "method": "SHOW DATABASES;\nCREATE DATABASE famouspeople;\nUSE famouspeople;", "detail": "⚠ Elke SQL-opdracht eindigt op `;`.", "uitleg": "SHOW DATABASES; = toon alle databanken · CREATE DATABASE famouspeople; = maak een databank · USE famouspeople; = werk voortaan in deze databank · ; = einde van een SQL-opdracht", "waarom": "SHOW DATABASES; (de ; voert het uit). SHOW TABLES; toont de tabellen van de gekozen databank; SELECT en LIST werken zo niet."}, {"id": "web-08", "ch": "12", "lab": false, "q": "SQL: geef kevin alle rechten op de databank famouspeople, enkel als hij verbindt vanaf dezelfde machine.", "a": "GRANT ALL ON famouspeople.* TO kevin@localhost IDENTIFIED BY 'hunter2';", "w": ["GRANT ALL ON famouspeople.* TO kevin@'%' IDENTIFIED BY 'hunter2';", "GRANT ALL ON *.famouspeople TO kevin@localhost IDENTIFIED BY 'hunter2';", "GRANT ALL ON *.famouspeople TO kevin@'%' IDENTIFIED BY 'hunter2';"], "method": "GRANT ALL ON famouspeople.* TO kevin@localhost IDENTIFIED BY 'hunter2';", "detail": "Vanaf elk adres: `kevin@'%'`.", "uitleg": "GRANT ALL = alle rechten · ON famouspeople.* = op alle tabellen van famouspeople · TO kevin@localhost = gebruiker kevin, enkel vanaf deze machine · IDENTIFIED BY 'hunter2' = met dit wachtwoord", "waarom": "databank.* = alle tabellen van die databank. @localhost = enkel lokaal; @'%' = vanaf elke host. *.famouspeople = de tabel famouspeople in elke databank."}, {"id": "web-09", "ch": "12", "lab": false, "q": "SQL: verwijder de databank famouspeople, zonder foutmelding als ze niet bestaat.", "a": "DROP DATABASE IF EXISTS famouspeople;", "w": ["DROP TABLE famouspeople;", "DELETE DATABASE IF EXISTS famouspeople;", "DELETE FROM famouspeople;"], "method": "DROP DATABASE IF EXISTS famouspeople;", "detail": "", "uitleg": "DROP DATABASE = verwijder een databank · IF EXISTS = geen fout als ze niet bestaat · famouspeople = de databank", "waarom": "DROP verwijdert objecten (databanken, tabellen); IF EXISTS voorkomt de fout. ✗ DROP TABLE = een tabel · DELETE verwijdert rijen uit een tabel, geen databanken."}, {"id": "web-10", "ch": "12", "lab": false, "q": "Maak een back-up van de databank famouspeople in het bestand backup.sql.", "a": "sudo mysqldump famouspeople > backup.sql", "w": ["sudo mysqldump famouspeople < backup.sql", "sudo mysql famouspeople > backup.sql", "sudo mysql famouspeople < backup.sql"], "method": "sudo mysqldump famouspeople > famouspeople-backup-$(date -I).sql\nsudo mysql famouspeople < bestand.sql", "detail": "`date -I` = 2026-10-16.", "uitleg": "mysqldump famouspeople = exporteer de databank als SQL · > bestand.sql = naar dit bestand · $(date +%F) = datum JJJJ-MM-DD · mysql famouspeople < bestand.sql = importeer het bestand in de databank", "waarom": "mysqldump schrijft SQL naar stdout, dus >. ✗ mysql famouspeople < backup.sql zet een back-up juist terug · mysql > bewaart enkel de (lege) uitvoer van de client."}, {"id": "web-11", "ch": "12", "lab": false, "q": "Voer één SQL-opdracht uit vanuit de shell, zonder de interactieve client te openen.", "a": "sudo mysql -e 'SHOW DATABASES;'", "w": ["sudo mysql -c 'SHOW DATABASES;'", "sudo mysql 'SHOW DATABASES;'", "sudo mysql -D 'SHOW DATABASES;'"], "method": "sudo mysql -e 'SHOW DATABASES;'", "detail": "Of meerdere opdrachten met een heredoc: `mysql ... << _EOF_`.", "uitleg": "sudo mysql = MariaDB-client als root · -e 'SHOW DATABASES;' = execute: voer deze SQL uit en sluit af", "waarom": "-e = execute. ✗ -c bewaart commentaar · zonder optie wordt de tekst gezien als databanknaam · -D kiest een databank."}, {"id": "web-12", "ch": "12", "lab": false, "q": "Op welke TCP-poort luistert MariaDB standaard?", "a": "3306", "w": ["5432", "3389", "1433"], "method": "3306   ·   sudo ss -tlnp", "detail": "", "uitleg": "sudo = als root · ss = socket statistics · -t = TCP · -l = listening · -n = numeric: poortnummers · -p = process: welk programma luistert (MariaDB: 3306)", "waarom": "3306 = MySQL/MariaDB. 5432 = PostgreSQL, 3389 = Remote Desktop, 1433 = Microsoft SQL Server."}, {"id": "web-13", "ch": "12", "lab": true, "q": "Labo Webserver: welke site activeer je op Debian voor HTTPS, nadat je a2enmod ssl deed?", "a": "sudo a2ensite default-ssl", "w": ["sudo a2ensite ssl", "sudo a2enconf default-ssl", "sudo a2enconf ssl"], "method": "sudo a2enmod ssl\nsudo a2ensite default-ssl\nsudo systemctl reload apache2", "detail": "", "uitleg": "a2enmod ssl = activeer de module ssl · a2ensite default-ssl = activeer de standaard HTTPS-site · systemctl reload apache2 = lees de configuratie opnieuw in", "waarom": "default-ssl is een site in sites-available (VirtualHost *:443). ssl is de module (al geactiveerd); a2enconf is voor conf-available."}, {"id": "web-14", "ch": "12", "lab": true, "q": "Labo Webserver: waarom toont je browser een waarschuwing bij https:// naar je VM?", "a": "het certificaat is zelfondertekend", "w": ["poort 443 is geblokkeerd op de VM", "de module ssl is nog niet geladen", "het certificaat is al vervallen"], "method": "Zelfondertekend certificaat: geen erkende CA heeft het ondertekend\nOmzeilen: curl -k (of uitzondering in de browser)", "detail": "Je kan voor localhost/10.0.2.15 geen echt certificaat krijgen.", "uitleg": "curl -k = insecure: aanvaard het certificaat zonder controle. Een zelfondertekend certificaat is door geen erkende CA (certificate authority) ondertekend", "waarom": "Het snakeoil-certificaat is door geen erkende CA ondertekend. Zonder ssl-module of met een geblokkeerde poort zou er helemaal geen verbinding zijn."}, {"id": "web-15", "ch": "12", "lab": true, "q": "Labo Webserver: welk Debian-pakket laat Apache PHP-pagina's uitvoeren?", "a": "libapache2-mod-php", "w": ["php-mysql", "php-cli", "apache2-utils"], "method": "sudo apt install php libapache2-mod-php php-mysql", "detail": "Test: een .php-bestand in /var/www/html.", "uitleg": "sudo apt install = installeer · php = PHP · libapache2-mod-php = Apache-module die PHP uitvoert · php-mysql = PHP-koppeling met MySQL/MariaDB", "waarom": "libapache2-mod-php = de PHP-module voor Apache. ✗ php-mysql = verbinding met MariaDB · php-cli = php op de commandoregel · apache2-utils = hulpprogramma's (htpasswd, ab)."}, {"id": "web-16", "ch": "12", "lab": true, "q": "Labo Webserver: voer het SQL-script db.sql uit in MariaDB (als root).", "a": "sudo mysql < db.sql", "w": ["sudo mysql > db.sql", "sudo mysqldump < db.sql", "sudo mysqldump > db.sql"], "method": "sudo mysql < db.sql", "detail": "", "uitleg": "sudo mysql = MariaDB-client als root · < db.sql = invoerredirectie: lees de SQL-opdrachten uit dit bestand", "waarom": "De client leest SQL van stdin. ✗ > overschrijft db.sql · mysqldump maakt back-ups en leest geen SQL."}, {"id": "web-17", "ch": "12", "lab": true, "q": "Labo Webserver: welk IP-adres krijgt een VirtualBox-VM standaard op een NAT-interface?", "a": "10.0.2.15", "w": ["10.0.2.2", "10.0.2.3", "192.168.56.101"], "method": "VM 10.0.2.15 · router 10.0.2.2 · DNS 10.0.2.3", "detail": "Daarom zie je bij SSH 'Last login from 10.0.2.2'.", "waarom": "NAT: VM = 10.0.2.15, gateway (je laptop) = 10.0.2.2, DNS = 10.0.2.3. 192.168.56.x is het host-only-netwerk.", "uitleg": ""}, {"id": "web-18", "ch": "12", "lab": true, "q": "Labo Webserver: NAT met port forwarding host 8080 → VM 80. Welke URL typ je op je laptop voor todo.php?", "a": "http://localhost:8080/todo.php", "w": ["http://localhost:80/todo.php", "http://10.0.2.15:8080/todo.php", "http://10.0.2.15:80/todo.php"], "method": "http://localhost:8080/todo.php", "detail": "Jouw SSH werkt op dezelfde manier: host 2222 → VM 22.", "waarom": "Je laptop luistert op 8080 en stuurt door. 10.0.2.15 is achter NAT niet bereikbaar vanaf de host.", "uitleg": ""}, {"id": "web-19", "ch": "12", "lab": false, "q": "Activeer het extra configuratiebestand naam.conf uit /etc/apache2/conf-available.", "a": "sudo a2enconf naam", "w": ["sudo a2enmod naam", "sudo a2ensite naam", "sudo a2disconf naam"], "method": "sudo a2enconf naam · sudo a2disconf naam", "detail": "Uit /etc/apache2/conf-available. Parallel: a2enmod/a2dismod (mods-available), a2ensite/a2dissite (sites-available).", "uitleg": "a2enconf naam = activeer een configuratiebestand uit /etc/apache2/conf-available · a2disconf naam = deactiveer het weer", "waarom": "a2enconf = conf-available → conf-enabled. a2enmod = modules, a2ensite = sites, a2disconf = uitschakelen."}, {"id": "web-20", "ch": "12", "lab": false, "q": "Schakel het extra configuratiebestand naam.conf (conf-enabled) weer uit.", "a": "sudo a2disconf naam", "w": ["sudo a2dismod naam", "sudo a2dissite naam", "sudo a2enconf naam"], "method": "sudo a2disconf naam", "detail": "Daarna `sudo systemctl reload apache2`.", "uitleg": "sudo = als root · a2disconf = Apache 2 disable conf: deactiveer een extra configuratiebestand · naam = het bestand zonder .conf", "waarom": "a2disconf verwijdert de link in conf-enabled; het bestand in conf-available blijft."}, {"id": "web-21", "ch": "12", "lab": false, "q": "Welk commando controleert de Apache-configuratie zowel op Debian als op Enterprise Linux?", "a": "apachectl configtest", "w": ["apachectl status", "systemctl status httpd", "systemctl status apache2"], "method": "sudo apachectl configtest", "detail": "Op Debian is `apache2ctl`
